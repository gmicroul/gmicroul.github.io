<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · SFOS 风格</title>
<style>
  :root{
    --bg:#eef2f5;
    --panel:#ffffff;
    --text:#1c2733;
    --dim:#6b7a8a;
    --accent:#0a9d8c;
    --accent2:#33cde5;
    --line:#e3e8ee;
    --shadow:0 10px 24px rgba(28,42,58,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(51,205,229,.14), transparent 60%),
      radial-gradient(1000px 500px at 90% 10%, rgba(10,157,140,.12), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(238,242,245,.86);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:12px 20px;
  }
  .bar{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .tile{
    width:34px;height:34px;flex:none;border-radius:9px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    display:grid;place-items:center;box-shadow:0 4px 10px rgba(10,157,140,.35);
  }
  .brand .tile svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .brand b{font-size:18px;letter-spacing:.3px;white-space:nowrap}
  .brand small{display:block;font-size:11px;color:var(--dim);font-weight:400}
  .count{
    font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap;
    background:rgba(10,157,140,.10);border:1px solid rgba(10,157,140,.28);
    padding:5px 12px;border-radius:999px;
  }
  .search{margin-left:auto;flex:1;min-width:170px;max-width:430px;position:relative}
  .search input{
    width:100%;padding:10px 16px 10px 42px;border-radius:14px;
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:15px;outline:none;
    transition:border-color .2s,box-shadow .2s;
    box-shadow:0 2px 8px rgba(28,42,58,.05);
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,157,140,.16)}
  .search input::placeholder{color:var(--dim)}
  .search svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none;
  }
  .hint{display:none}
  main{max-width:1120px;margin:0 auto;padding:26px 20px 70px}
  .grid{
    display:grid;gap:16px 14px;
    grid-template-columns:repeat(auto-fill,108px);
    justify-content:center;
  }
  @media(max-width:560px){
    .grid{grid-template-columns:repeat(2,108px);gap:14px 12px}
    .bar{gap:8px}
    .brand small{display:none}
  }
  @media(max-width:340px){
    .grid{grid-template-columns:repeat(2,104px)}
  }
  .card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    width:108px;height:108px;border-radius:20px;text-decoration:none;color:var(--text);
    background:var(--panel);border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(28,42,58,.06);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card img{width:86px;height:86px;border-radius:16px;display:block;pointer-events:none;user-select:none}
  .card .nm{
    max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:11px;color:var(--dim);line-height:1.2;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(10,157,140,.5)}
  .card:hover .nm{color:var(--accent)}
  .empty{
    grid-column:1/-1;text-align:center;padding:60px 0;color:var(--dim);
  }
  .empty b{display:block;font-size:16px;color:var(--text);margin-bottom:4px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/></svg>
      </div>
      <div>
        <b>游戏大厅</b>
        <small>SFOS Games Launcher</small>
      </div>
    </div>
    <span class="count" id="count">0 款游戏</span>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg>
      <input id="q" type="text" placeholder="搜索游戏…" autocomplete="off" spellcheck="false">
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <b>没有找到匹配的游戏</b>
    <span>换个关键词试试</span>
  </div>
</main>
<footer>Game Hub · 共 <span id="total">0</span> 款游戏 · 点击卡片即可游玩</footer>

var grid = document.getElementById('grid');
var empty = document.getElementById('empty');
var countEl = document.getElementById('count');
var totalEl = document.getElementById('total');
var ICON = 'icons/';
var gameEls = [];

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function build(){
  var html = '';
  for (var i=0;i<GAMES.length;i++){
    var g = GAMES[i];
    html += '<a class="card" href="../games-web/' + encodeURI(g.f) + '" target="_blank" rel="noopener" title="' + esc(g.n) + '" data-name="' + esc(g.n.toLowerCase()) + '">' +
            '<img src="' + ICON + g.icon.split('/').pop() + '" alt="' + esc(g.n) + '" width="86" height="86" loading="lazy">' +
            '<span class="nm">' + esc(g.n) + '</span></a>';
  }
  grid.innerHTML = html;
  gameEls = Array.prototype.slice.call(grid.children);
  totalEl.textContent = GAMES.length;
}

function filter(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var shown = 0;
  for (var i=0;i<gameEls.length;i++){
    var el = gameEls[i];
    var ok = !q || el.getAttribute('data-name').indexOf(q) !== -1;
    el.style.display = ok ? '' : 'none';
    if (ok) shown++;
  }
  countEl.textContent = shown + ' / ' + GAMES.length + ' 款游戏';
  empty.style.display = shown === 0 ? '' : 'none';
}

document.getElementById('q').addEventListener('input', filter);
build();
filter();
</script>
