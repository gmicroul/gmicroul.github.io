<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏大厅 · SFOS Game Hub</title>
<style>
  :root{
    --bg0:#04141C; --bg1:#06222C; --bg2:#0A3A47;
    --card:#0C2B36; --card2:#0E3240;
    --text:#EAF6F8; --dim:#8FB6C0;
    --accent:#4FC3F7; --accent2:#2EBD85;
    --line:rgba(79,195,247,.20);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 520px at 85% -10%, rgba(79,195,247,.16), transparent 60%),
      radial-gradient(900px 520px at -10% 110%, rgba(46,189,133,.12), transparent 60%),
      linear-gradient(165deg,var(--bg1) 0%,var(--bg0) 55%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text);min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(4,20,28,.94),rgba(4,20,28,.78));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
  }
  .bar{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
  .brand .dot{width:14px;height:14px;flex:none;border-radius:0;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(79,195,247,.65)}
  .brand em{font-style:normal;background:linear-gradient(120deg,#4FC3F7,#2EBD85);-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{
    font-size:12.5px;color:var(--dim);white-space:nowrap;
    border:1px solid var(--line);padding:3px 11px;background:rgba(79,195,247,.08);
    border-radius:999px;
  }
  .search{position:relative;flex:1;min-width:170px;max-width:440px;margin-left:auto}
  .search svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2.4;
    stroke-linecap:round;pointer-events:none;
  }
  .search input{
    width:100%;padding:9px 14px 9px 38px;border-radius:999px;
    border:1px solid var(--line);background:rgba(12,43,54,.9);
    color:var(--text);font-size:15px;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.16)}
  .search input::placeholder{color:var(--dim)}
  main{max-width:1200px;margin:0 auto;padding:22px 16px 60px}
  .meta{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
  .meta h2{font-size:15px;font-weight:700;color:var(--dim);letter-spacing:1px}
  .meta h2 b{color:var(--text)}
  .meta .hint{font-size:12px;color:var(--dim);opacity:.75}
  .grid{
    display:grid;gap:14px;
    grid-template-columns:repeat(2,108px);
    justify-content:center;
  }
  @media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,108px);gap:16px}}
  .card{
    width:108px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:8px 6px 9px;
    border:1px solid var(--line);
    background:linear-gradient(165deg,var(--card2),var(--card));
    text-decoration:none;color:var(--text);
    border-radius:0;
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-4px);
    border-color:rgba(79,195,247,.6);
    box-shadow:0 10px 22px rgba(2,12,18,.6),0 0 0 1px rgba(79,195,247,.25);
    background:linear-gradient(165deg,#10506A,#0C3340);
    outline:none;
  }
  .icon{width:86px;height:86px;flex:none;background:#071B23}
  .icon img{
    width:86px;height:86px;display:block;object-fit:contain;
    filter:drop-shadow(0 6px 12px rgba(2,12,18,.5));
    transition:transform .16s ease;
  }
  .card:hover .icon img{transform:scale(1.06)}
  .name{
    font-size:12px;font-weight:600;text-align:center;line-height:1.3;
    max-width:96px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:2.6em;
  }
  .empty{display:none;text-align:center;color:var(--dim);padding:64px 0;font-size:15px}
  .empty svg{width:44px;height:44px;stroke:var(--dim);fill:none;stroke-width:1.6;margin-bottom:12px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:0 0 26px;opacity:.7;letter-spacing:.4px}
</style>
</head>

</header>
<main>

</main>
<footer>SFOS Game Hub · 点击游戏开始 · 离线可用</footer>

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

var grid=document.getElementById("grid");
var countEl=document.getElementById("count");
var shownEl=document.getElementById("shown");
var emptyEl=document.getElementById("empty");
var total=GAMES.length;
var cards=[];

GAMES.forEach(function(g){
  var a=document.createElement("a");
  a.className="card";
  a.href="../games-web/"+encodeURIComponent(g.f);
  a.target="_blank"; a.rel="noopener";
  a.title=g.n;
  a.innerHTML='<span class="icon"><img src="icons/'+encodeURIComponent(g.i)+'" alt="'+esc(g.n)+'" loading="lazy" width="86" height="86"></span><span class="name"></span>';
  a.querySelector(".name").textContent=g.n;
  grid.appendChild(a);
  cards.push({el:a, name:g.n.toLowerCase(), file:g.f.toLowerCase()});
});

function setCount(n){
  countEl.textContent=n+" / "+total;
  shownEl.textContent=n;
}

var q=document.getElementById("q");
function filter(){
  var v=q.value.trim().toLowerCase(), shown=0;
  cards.forEach(function(c){
    var hit=!v || c.name.indexOf(v)!==-1 || c.file.indexOf(v)!==-1;
    c.el.style.display=hit?"":"none";
    if(hit)shown++;
  });
  setCount(shown);
  emptyEl.style.display=shown?"none":"block";
}
q.addEventListener("input",filter);

setCount(total);
})();
