<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Hub</title>
<style>
:root{
  --bg:#0b0f1a; --bg2:#111827; --card:#151c2e; --card-hover:#1c2438;
  --text:#e8ecf4; --muted:#8b94ab; --accent:#4cc2ff; --border:rgba(255,255,255,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(76,194,255,.12),transparent 60%),
             radial-gradient(900px 500px at 10% -10%,rgba(150,90,255,.10),transparent 60%),
             var(--bg);
  color:var(--text);min-height:100vh;
}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(11,15,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.bar{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,#4cc2ff 0%,#3a6ff7 55%,#7a3ff2 100%);
  box-shadow:0 4px 14px rgba(60,130,255,.45),inset 0 1px 0 rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px}
.searchwrap{position:relative;flex:1 1 240px;max-width:420px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
#search{
  width:100%;padding:11px 36px 11px 36px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,194,255,.18)}
#search::placeholder{color:var(--muted)}
#clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border:none;border-radius:50%;background:rgba(255,255,255,.08);
  color:var(--muted);font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;
}
#clear:hover{background:rgba(255,255,255,.16);color:var(--text)}
.stats{font-size:13px;color:var(--muted);white-space:nowrap}
.stats b{color:var(--accent);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
.grid{
  display:grid;gap:18px 14px;
  grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
}
@media(min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:22px 18px}}
.card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:16px 8px 14px;border-radius:16px;cursor:pointer;text-decoration:none;color:inherit;
  background:transparent;border:1px solid transparent;
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.card:hover,.card:focus-visible{background:var(--card);border-color:var(--border);transform:translateY(-3px)}
.card:active{transform:translateY(0) scale(.97)}
.card.hidden{display:none}
/* SailfishOS-style icon: squircle, vivid gradient, glossy top light, centered glyph */
.icon{
  position:relative;width:64px;height:64px;border-radius:22%;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 -8px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .18s ease,box-shadow .18s ease;
}
@media(min-width:720px){.icon{width:76px;height:76px}}
.card:hover .icon{transform:scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 -8px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.icon::before{ /* glossy highlight */
  content:"";position:absolute;left:6%;right:6%;top:3%;height:46%;
  border-radius:50% 50% 60% 60%/100% 100% 40% 40%;
  background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,.04));
}
.icon::after{ /* inner ring */
  content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.icon span{
  position:relative;z-index:1;font-weight:800;color:#fff;
  font-size:30px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.35);
  font-family:inherit;
}
@media(min-width:720px){.icon span{font-size:34px}}
.name{
  font-size:12.5px;line-height:1.3;text-align:center;color:var(--text);
  max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.empty{display:none;text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:12px}
footer{border-top:1px solid var(--border);padding:18px 20px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:480px){.brand h1{font-size:17px}.stats{width:100%;order:3}}
</style>
</head>

    <div class="stats"><b id="shown">0</b> / <span id="total">0</span> games</div>

</header>
<main>
  <div id="grid" class="grid"></div>

<footer>Game Hub · <span id="footcount"></span> HTML5 games</footer>

// Deterministic SailfishOS-style gradient per game name
function hashStr(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function iconStyle(name){
  var h=hashStr(name),hue=h%360,hue2=(hue+40+(h>>8)%50)%360;
  return "background:linear-gradient(135deg,hsl("+hue+",72%,58%) 0%,hsl("+hue2+",70%,44%) 100%);";
}
function glyph(name){
  var w=name.replace(/[^A-Za-z0-9 ]/g," ").trim().split(/ +/).filter(Boolean);
  if(!w.length)return "?";
  if(/^[0-9]/.test(name))return name.replace(/[^0-9A-Za-z]/g,"").slice(0,3).toUpperCase();
  if(w.length>1)return (w[0][0]+w[1][0]).toUpperCase();
  return w[0].slice(0,2).toUpperCase();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var grid=document.getElementById("grid"),shownEl=document.getElementById("shown"),

              '<div class="name">'+esc(g.n)+'</div>';
  frag.appendChild(a);
  cards.push({el:a,key:g.n.toLowerCase()});
});
grid.appendChild(frag);
totalEl.textContent=GAMES.length;
shownEl.textContent=GAMES.length;
document.getElementById("footcount").textContent=GAMES.length;

function filter(){
  var q=searchEl.value.trim().toLowerCase(),n=0;
  clearBtn.style.display=q?"flex":"none";
  for(var i=0;i<cards.length;i++){
    var show=!q||cards[i].key.indexOf(q)!==-1;
    cards[i].el.classList.toggle("hidden",!show);
    if(show)n++;
  }
  shownEl.textContent=n;
  emptyEl.style.display=n?"none":"block";
  grid.style.display=n?"":"none";
}
searchEl.addEventListener("input",filter);
clearBtn.addEventListener("click",function(){searchEl.value="";filter();searchEl.focus();});
