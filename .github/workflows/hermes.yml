name: Hermes Agent


on:

  workflow_dispatch:


jobs:

  hermes:

    runs-on: ubuntu-latest

    timeout-minutes: 360


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build Docker image
      run: |
        docker build \
          -t hermes-agent .


    - name: Run Hermes
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      run: |

        docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          hermes-agent
