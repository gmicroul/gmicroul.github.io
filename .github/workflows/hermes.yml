name: Hermes Test

on:
  workflow_dispatch:


permissions:
  contents: write


jobs:

  test:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare output

      run: |

        mkdir -p output

        sudo chmod 777 output



    - name: Check secrets

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |

        echo "Checking environment..."

        if [ -z "$OPENAI_API_KEY" ]; then
          echo "ERROR: OPENAI_API_KEY empty"
          exit 1
        else
          echo "OPENAI_API_KEY OK"
        fi


        echo "OPENAI_BASE_URL=$OPENAI_BASE_URL"

        echo "OPENAI_MODEL=$OPENAI_MODEL"



    - name: Run Hermes test

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Running Hermes test..."

        date


        timeout 5m docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "
          不要搜索。

          直接生成一个测试 HTML 页面。

          必须创建：

          /output/index.html

          内容要求：

          标题：
          Hermes GitHub Actions Test

          内容：
          GitHub Actions运行成功。
          "


        echo "Hermes finished"

        date



    - name: Verify output

      run: |

        echo "===== output ====="

        ls -lah output


        if [ ! -f output/index.html ]; then

          echo "ERROR: index.html missing"

          exit 1

        fi


        echo "SUCCESS"

        head -30 output/index.html
