name: Hermes Games uploader


on:

  workflow_dispatch:


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

        token: ${{ secrets.GITHUB_TOKEN }}



    - name: Download Offline HTML Games Pack

      run: |

        git clone --depth=1 \
          https://github.com/gmicroul/Offline-HTML-Games-Pack.git games-pack


        mkdir -p Games-Offline


        cp -r games-pack/offline/* Games-Offline/


        rm -rf games-pack


        echo "Remove files larger than 25MB"


        find Games-Offline -type f -size +25M -print -delete


        echo "Remaining files:"

        find Games-Offline -type f | wc -l





    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .





    - name: Prepare output

      run: |

        rm -rf output

        mkdir -p output

        chmod 777 output





    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        timeout 25m docker run \
          --rm \
          --user root \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD:/opt/hermes-agent/gmicroul.github.io" \
          hermes-agent \
          "


          不要询问。

          不要执行git操作。


          当前仓库：

          /opt/hermes-agent/gmicroul.github.io


          已经存在 Games-Offline。


          扫描：

          Games-Offline/


          生成：

          Games-Offline/index.html


          要求：

          - 汇总所有HTML游戏
          - 提取title
          - 自动生成图标
          - 搜索功能
          - 响应式布局


          完成后复制：

          Games-Offline/index.html


          到：

          output/index.html


          不删除其它文件。


          "





    - name: Verify files

      run: |


        echo "===== output ====="

        ls -lah output



        test -f output/index.html



        COUNT=$(find Games-Offline -name "*.html" | wc -l)

        echo "Games count: $COUNT"



        if [ "$COUNT" -lt 1 ]; then

          exit 1

        fi





    - name: Commit and push

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git config http.postBuffer 524288000

        git config core.compression 0



        git add Games-Offline output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes Games Offline"



        git push \
          https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
          HEAD:${GITHUB_REF_NAME}
