name: Hermes Games uploader


on:

  workflow_dispatch:


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

        token: ${{ secrets.GITHUB_TOKEN }}



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare workspace

      run: |

        mkdir -p output

        chmod 777 output

        ls -lah



    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Starting Hermes..."



        timeout 25m docker run \
          --rm \
          --user root \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD:/opt/hermes-agent/gmicroul.github.io" \
          hermes-agent \
          "


          不要停下来询问。

          不要执行 git push。

          GitHub Actions 会负责提交。


          当前工作目录：

          /opt/hermes-agent/gmicroul.github.io


          任务：

          1.
          从：

          https://github.com/gmicroul/Offline-HTML-Games-Pack

          获取：

          offline/

          下全部游戏文件。


          2.

          在当前仓库创建：

          Games-Offline/


          3.

          将所有游戏复制到：

          Games-Offline/


          4.

          扫描 Games-Offline 下所有 HTML 游戏。


          5.

          生成：

          Games-Offline/index.html


          要求：

          - 显示全部游戏
          - 提取游戏标题
          - 自动生成图标
          - 支持搜索
          - 响应式布局


          6.

          将：

          Games-Offline/index.html


          复制到：

          output/index.html


          7.

          不修改、不删除仓库其它文件。


          "


        echo "Hermes finished"

        date





    - name: Fix permission

      run: |

        sudo chown -R $USER:$USER Games-Offline output || true

        sudo chmod -R u+rwX,go+rX Games-Offline output || true



    - name: Verify output

      run: |


        echo "===== output ====="

        ls -lah output



        if [ ! -f output/index.html ]; then

          echo "ERROR: output/index.html missing"

          find . -maxdepth 3 -name index.html

          exit 1

        fi



        SIZE=$(wc -c < output/index.html)

        echo "SIZE=$SIZE"



        if [ "$SIZE" -lt 1000 ]; then

          echo "ERROR: index.html too small"

          exit 1

        fi



    - name: Verify Games-Offline

      run: |


        echo "===== Games-Offline ====="


        ls -lah Games-Offline | head -50


        COUNT=$(find Games-Offline -name "*.html" | wc -l)


        echo "HTML COUNT=$COUNT"


        if [ "$COUNT" -lt 1 ]; then

          echo "ERROR: no games found"

          exit 1

        fi





    - name: Commit and push

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        echo "===== Git status ====="

        git status



        git add Games-Offline output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes Games Offline"



        git push \
          https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
          HEAD:${GITHUB_REF_NAME}
