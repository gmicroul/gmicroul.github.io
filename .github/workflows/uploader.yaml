name: Hermes Games uploader


on:

  workflow_dispatch:


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

        token: ${{ secrets.GITHUB_TOKEN }}



    - name: Download Offline HTML Games Pack

      run: |

        git clone --depth=1 \
          https://github.com/gmicroul/Offline-HTML-Games-Pack.git games-pack


        mkdir -p Games-Offline


        cp -r games-pack/offline/* Games-Offline/


        rm -rf games-pack


        echo "Games copied"

        find Games-Offline -name "*.html" | wc -l





    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .





    - name: Prepare output directory

      run: |

        rm -rf output

        mkdir -p output

        chmod 777 output





    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Starting Hermes..."


        timeout 25m docker run \
          --rm \
          --user root \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD:/opt/hermes-agent/gmicroul.github.io" \
          hermes-agent \
          "


          不要停下来询问。

          不要执行 git push。


          当前仓库：

          /opt/hermes-agent/gmicroul.github.io


          已经准备好 Games-Offline 目录。


          任务：


          1. 扫描：

          /opt/hermes-agent/gmicroul.github.io/Games-Offline/


          下全部 HTML 游戏。


          2. 生成：

          /opt/hermes-agent/gmicroul.github.io/Games-Offline/index.html


          要求：

          - 汇总全部游戏
          - 提取HTML title作为游戏名称
          - 自动生成游戏图标
          - 网格布局
          - 搜索功能
          - 手机和电脑自适应


          3. 完成后复制：


          /opt/hermes-agent/gmicroul.github.io/Games-Offline/index.html


          到：


          /opt/hermes-agent/gmicroul.github.io/output/index.html


          4. 不删除其它文件。

          5. 不执行git操作。


          "


        echo "Hermes finished"

        date





    - name: Fix permissions

      run: |

        sudo chown -R $USER:$USER Games-Offline output

        sudo chmod -R u+rwX,go+rX Games-Offline output





    - name: Verify files

      run: |


        echo "===== output ====="

        ls -lah output


        if [ ! -f output/index.html ]; then

          echo "ERROR: output/index.html missing"

          exit 1

        fi



        echo "===== Games ====="


        COUNT=$(find Games-Offline -name "*.html" | wc -l)


        echo "HTML COUNT=$COUNT"



        if [ "$COUNT" -lt 1 ]; then

          echo "ERROR: Games-Offline empty"

          exit 1

        fi



        SIZE=$(wc -c < output/index.html)


        echo "INDEX SIZE=$SIZE"



        if [ "$SIZE" -lt 1000 ]; then

          echo "ERROR: index too small"

          exit 1

        fi





    - name: Commit and push

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        git add Games-Offline output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes Games Offline"



        git push \
          https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
          HEAD:${GITHUB_REF_NAME}
