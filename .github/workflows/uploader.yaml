name: Hermes Games uploader


on:

  workflow_dispatch:

  # schedule:
  #   - cron: "0 */2 * * *"


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

        token: ${{ secrets.GITHUB_TOKEN }}



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare output directory

      run: |

        rm -rf output

        mkdir -p output

        chmod 777 output



    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Running Hermes..."

        date



        timeout 25m docker run \
          --rm \
          --user root \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "


          不要停下来问问题，一次都不要停。

          不要执行git push。

          GitHub提交由外部workflow完成。


          任务：

          1. 在仓库 https://github.com/gmicroul/gmicroul.github.io 创建 Games-Offline/index.html


          2. 获取：
          https://github.com/gmicroul/Offline-HTML-Games-Pack/tree/master/offline/

          下所有HTML游戏文件。


          3. 将所有游戏上传到：

          https://github.com/gmicroul/gmicroul.github.io/Games-Offline


          4. 扫描 Games-Offline 下所有html。


          5. 自动生成 Games-Offline/index.html：

             - 游戏列表
             - 游戏标题
             - 游戏小图标
             - 点击进入游戏


          6. 将最终：

             Games-Offline/index.html

             复制到：

             output/index.html


          7. 不修改、不删除其它文件。


          "



        echo "Hermes finished"

        date





    - name: Fix Hermes output permission

      run: |


        echo "Fix output permission"


        sudo chown -R $USER:$USER output


        sudo chmod -R u+rwX,go+rX output


        ls -lah output





    - name: Verify Hermes output

      run: |


        echo "===== output ====="


        ls -lah output



        if [ ! -f output/index.html ]; then

          echo "ERROR: output/index.html missing"

          exit 1

        fi



        SIZE=$(wc -c < output/index.html)


        echo "SIZE=$SIZE"



        if [ "$SIZE" -lt 1000 ]; then

          echo "ERROR: index.html too small"

          cat output/index.html

          exit 1

        fi



        echo "===== Preview ====="


        head -50 output/index.html





    - name: Commit only Hermes page

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        git config user.name "github-actions[bot]"


        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        echo "===== Git status ====="


        git status



        git add output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes generated Games page"



        git push \
          https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
          HEAD:${GITHUB_REF_NAME}
