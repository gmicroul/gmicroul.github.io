name: Hermes Games Navigation Generator


on:

  workflow_dispatch:


permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

        token: ${{ secrets.GITHUB_TOKEN }}



    - name: Scan games-web

      run: |

        echo "Scan games-web html files"

        COUNT=$(find games-web -name "*.html" | wc -l)

        echo "Games count: $COUNT"


        if [ "$COUNT" -lt 1 ]; then

          echo "No html games found"

          exit 1

        fi




    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .




    - name: Prepare output

      run: |

        rm -rf output

        mkdir -p output

        chmod 777 output




    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        timeout 25m docker run \
          --rm \
          --user root \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD:/opt/hermes-agent/gmicroul.github.io" \
          hermes-agent \
          "


          不要询问。

          不要执行git操作。


          当前仓库：

          /opt/hermes-agent/gmicroul.github.io


          任务：

          扫描：

          games-web/


          里面所有HTML游戏文件。


          生成：

          output/index.html


          这是一个HTML5游戏导航主页。


          要求：


          1. 扫描所有：

          games-web/*.html


          2. 自动读取每个HTML：

          - 提取title标签作为游戏名称

          - 如果没有title，使用文件名生成名称


          3. 每个游戏生成一个卡片：


          包含：

          - 游戏图标

          - 游戏名称

          - 打开按钮


          4. 图标规则：

          优先寻找：

          games-web同目录下：

          favicon

          icon

          png

          jpg

          webp


          如果不存在：

          自动生成彩色字母图标。


          5. 页面要求：

          - 图标网格布局

          - 响应式设计

          - 手机和电脑适配

          - CSS内置

          - 无外部依赖


          6. 添加搜索：

          可以按照游戏名称实时过滤。


          7. 游戏链接：

          使用相对路径：

          games-web/文件名.html


          8. 不修改：

          games-web

          其它目录


          9. 完成后确认：

          output/index.html


          "




    - name: Verify output

      run: |


        echo "===== output ====="

        ls -lah output


        test -f output/index.html


        COUNT=$(find games-web -name "*.html" | wc -l)

        echo "Games count: $COUNT"


        if [ "$COUNT" -lt 1 ]; then

          exit 1

        fi




    - name: Commit and push

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git config http.postBuffer 524288000

        git config core.compression 0


        git add output/index.html


        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi


        git commit \
          -m "Update Hermes games navigation"


        git push \
          https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
          HEAD:${GITHUB_REF_NAME}
