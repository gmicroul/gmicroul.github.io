name: Hermes Games  uploader


on:

  workflow_dispatch:

 # schedule:

 #   - cron: "0 */2 * * *"



permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-latest

    timeout-minutes: 30



    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare output directory

      run: |

        rm -rf output

        mkdir -p output

        chmod 777 output



    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Running Hermes..."

        date



        timeout 25m docker run \
          --rm \
          --user root \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "


          不要停下来问（一次都不能停）。你自己想办法完成输出。


          我把github的token放到了Repository secrets的GITTOKEN里，你可以调用GITTOKEN。


          要求：

          1，在https://github.com/gmicroul/gmicroul.github.io新建一个目录为Games-Offline
          2. 将https://github.com/gmicroul/Offline-HTML-Games-Pack/tree/master/offline/下的所有html全部上传到https://github.com/gmicroul/gmicroul.github.io/Games-Offline
          3. 对https://github.com/gmicroul/gmicroul.github.io/Games-Offline的所有html汇总，生成一个index.html在https://github.com/gmicroul/gmicroul.github.io/Games-Offline目录做一个总导引并带有每个游戏的小图标。
          

          4. 不要修改或删除其它文件。

          5. 你要一定自己去想法提交，别推给我提交。


          "



        echo "Hermes finished"

        date





    - name: Fix Hermes output permission

      run: |


        echo "Fix output permission"


        sudo chown -R $USER:$USER output


        sudo chmod -R u+rwX,go+rX output


        ls -lah output





    - name: Verify Hermes output

      run: |


        echo "===== output ====="


        ls -lah output



        if [ ! -f output/index.html ]; then

          echo "ERROR: output/index.html missing"

          exit 1

        fi



        SIZE=$(wc -c < output/index.html)


        echo "SIZE=$SIZE"



        if [ "$SIZE" -lt 1000 ]; then

          echo "ERROR: index.html too small"

          cat output/index.html

          exit 1

        fi



        echo "===== Preview ====="


        head -50 output/index.html





    - name: Commit only Hermes page

      run: |


        git config user.name "github-actions[bot]"


        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        echo "===== Git status ====="


        git status



        git add output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes generated news"



        git push origin HEAD:${GITHUB_REF_NAME}
