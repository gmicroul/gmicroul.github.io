name: Hermes News Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0



      - name: Clean workspace

        run: |

          rm -rf output

          rm -rf hermes-home

          mkdir -p output

          mkdir -p hermes-home

          chmod 777 output

          chmod 777 hermes-home



      - name: Build Hermes image

        run: |

          docker build \
            --no-cache \
            --progress=plain \
            -t hermes-agent .



      - name: Check secrets

        env:

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


        run: |

          echo "Checking API..."

          if [ -z "$OPENAI_API_KEY" ]; then

            echo "OPENAI_API_KEY missing"

            exit 1

          fi


          echo "KEY LENGTH=${#OPENAI_API_KEY}"

          echo "MODEL=$OPENAI_MODEL"

          echo "BASE_URL=$OPENAI_BASE_URL"




      - name: Run Hermes

        env:

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


        run: |


          echo "=================="

          echo "Running Hermes..."

          date



          timeout 25m docker run \
            --rm \
            --user root \
            --env HOME=/tmp \
            --env OPENAI_API_KEY="$OPENAI_API_KEY" \
            --env OPENAI_BASE_URL="$OPENAI_BASE_URL" \
            --env OPENAI_MODEL="$OPENAI_MODEL" \
            --env NVIDIA_API_KEY="$OPENAI_API_KEY" \
            --env OPENAI_API_TOKEN="$OPENAI_API_KEY" \
            --env OPENAI_KEY="$OPENAI_API_KEY" \
            -v "$PWD/output:/output" \
            -v "$PWD/hermes-home:/tmp/hermes-home" \
            hermes-agent \
            "


            生成一个真实的中文 Jolla Phone 和 Sailfish OS 新闻日报 HTML 页面。


            要求：


            1. 创建：

            /output/index.html


            2. 使用最近一个月真实新闻。


            3. 每条新闻必须包含来源链接。


            4. 页面必须是完整 HTML5。


            5. 不要修改或删除其它文件。


            "



          echo "Hermes finished"

          date




      - name: Verify output

        run: |


          echo "===== output ====="

          ls -lah output



          if [ ! -f output/index.html ]; then

            echo "ERROR: index.html missing"

            exit 1

          fi



          SIZE=$(wc -c < output/index.html)


          echo "SIZE=$SIZE"



          if [ "$SIZE" -lt 1000 ]; then

            echo "ERROR: Hermes output invalid"

            cat output/index.html

            exit 1

          fi




      - name: Fix permission

        run: |

          sudo chown -R $USER:$USER output

          chmod 644 output/index.html




      - name: Commit result

        run: |


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add output/index.html



          if git diff --cached --quiet; then

            echo "No changes"

            exit 0

          fi



          git commit \
            -m "Update Hermes generated news"



          git pull --rebase origin ${GITHUB_REF_NAME}



          git push origin HEAD:${GITHUB_REF_NAME}
