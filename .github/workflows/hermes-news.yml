name: Hermes News Generator


on:

  workflow_dispatch:

  schedule:

    - cron: "0 */6 * * *"



permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-latest

    timeout-minutes: 30



    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare output directory

      run: |

        mkdir -p output

        sudo chmod 777 output



    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Running Hermes..."

        date


        timeout 15m docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "
          不要搜索。
          不要访问互联网。
          不要调用任何工具。

          直接生成一份模拟的 Jolla Phone 和 Sailfish OS 新闻日报 HTML 页面。
          

          要求：

          1. 使用中文。

          2. 输出完整 HTML5 页面。

          3. 必须创建：

             /output/index.html


          4. 页面包含：

             - 标题：Jolla Phone 新闻日报
             - 更新时间
             - 新闻标题
             - 新闻摘要
             - 来源链接
             - 简洁 CSS 样式


          5. 不要修改其他文件。
          "


        echo "Hermes finished"

        date



    - name: Verify Hermes output

      run: |


        echo "===== output ====="

        ls -lah output


        if [ ! -f output/index.html ]; then

          echo "ERROR: output/index.html missing"

          exit 1

        fi


        if [ ! -s output/index.html ]; then

          echo "ERROR: index.html empty"

          exit 1

        fi


        echo "===== Preview ====="

        head -50 output/index.html



    - name: Fix output permission

      run: |


        sudo chown -R $USER:$USER output


        chmod 644 output/index.html



    - name: Commit only Hermes page

      run: |


        git config user.name "github-actions[bot]"


        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        git add output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes generated news"



        git pull --rebase origin ${GITHUB_REF_NAME}



        git push origin HEAD:${GITHUB_REF_NAME}
