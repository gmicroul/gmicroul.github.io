name: Hermes Jolla News


on:

  schedule:

    - cron: "0 1 * * *"


  workflow_dispatch:



permissions:

  contents: read

  pages: write

  id-token: write



jobs:


  build:



    runs-on: ubuntu-latest


    timeout-minutes: 30



    steps:



      - name: Checkout

        uses: actions/checkout@v4





      - name: Build Hermes image


        run: |


          docker build \
            --progress=plain \
            -t hermes-agent .





      - name: Run Hermes



        env:


          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

          PYTHONUNBUFFERED: 1



        run: |


          mkdir -p output



          docker run \
            --rm \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e OPENAI_MODEL \
            -e PYTHONUNBUFFERED \
            -v "$PWD/output:/output" \
            hermes-agent \
            "
            你是一个HTML网页生成器。

            创建一个中文新闻网页。

            文件必须保存：

            /output/index.html


            网页要求：

            标题：
            Jolla Phone 新闻日报


            内容：

            - 当前更新时间
            - Jolla Phone相关新闻
            - Sailfish OS相关新闻
            - 新闻摘要
            - 来源链接


            使用完整HTML5格式。

            不要只回复文本。

            必须创建文件。
            "





      - name: Check output


        run: |


          echo "==== output ===="

          ls -lah output


          echo "==== index preview ===="

          head -30 output/index.html


          test -f output/index.html





      - name: Upload Pages artifact


        uses: actions/upload-pages-artifact@v3


        with:


          path: ./output






  deploy:



    needs: build



    runs-on: ubuntu-latest



    environment:


      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}




    steps:



      - name: Deploy Pages


        id: deployment


        uses: actions/deploy-pages@v4
