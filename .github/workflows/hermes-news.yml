name: Hermes News Generator


on:

  workflow_dispatch:

  schedule:

    - cron: "0 */6 * * *"



permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-latest

    timeout-minutes: 30



    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        mkdir -p output


        docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "

          生成 Jolla Phone 和 Sailfish OS 新闻日报。

          要求：

          1. 使用中文。

          2. 输出完整 HTML5 页面。

          3. 必须创建文件：

             /output/index.html

          4. 页面包含：

             - 标题：Jolla Phone 新闻日报

             - 更新时间

             - 新闻标题

             - 新闻摘要

             - 来源链接

             - 简洁 CSS 样式

          "



    - name: Check Hermes output

      run: |

        echo "===== output ====="

        ls -lah output


        if [ ! -f output/index.html ]; then

          echo "ERROR: output/index.html missing"

          exit 1

        fi


        echo "===== index.html ====="

        head -50 output/index.html



    - name: Fix output permission

      run: |

        chmod -R 755 output



    - name: Commit Hermes output

      run: |

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git add output/index.html


        git commit \
          -m "Update Hermes generated news" \
          || echo "No changes"


        git push origin HEAD:${GITHUB_REF_NAME}
