name: Hermes Pages


on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"



permissions:

  contents: write

  pages: write

  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    timeout-minutes: 30



    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Run Hermes


      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        mkdir -p output



        docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "

          生成 Jolla Phone 和 Sailfish OS 新闻日报。


          要求：

          - 使用中文

          - 输出 HTML 内容

          - 直接返回网页正文

          - 不调用文件工具


          "



    - name: Check Hermes output


      run: |


        echo "===== output ====="


        ls -lah output


        echo "===== index.html ====="


        head -50 output/index.html





    - name: Commit Hermes output


      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git add output/


        git commit -m "Update Hermes generated page" || echo "No changes"


        git push





    #
    # 创建 Pages 发布目录
    #
    # 目标:
    #
    # /
    # ├── index.html
    # └── output/
    #     └── index.html
    #

    - name: Prepare Pages


      run: |


        rm -rf pages


        mkdir -p pages/output



        # 保留你的主页

        cp index.html pages/index.html



        # 放入 Hermes 页面

        cp output/index.html pages/output/index.html



        touch pages/.nojekyll



        echo "===== Pages structure ====="


        find pages -maxdepth 3 -type f





    - name: Upload Pages artifact


      uses: actions/upload-pages-artifact@v3


      with:

        path: pages





  deploy:


    needs: build


    runs-on: ubuntu-latest



    environment:

      name: github-pages



    steps:


    - name: Deploy Pages


      uses: actions/deploy-pages@v4
