name: Hermes Pages


on:

  workflow_dispatch:



permissions:

  contents: read

  pages: write

  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    timeout-minutes: 20



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Build Hermes image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Run Hermes


      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        mkdir -p output



        docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "

          生成一份 Jolla Phone 和 Sailfish OS 新闻日报。


          要求：

          1. 中文输出

          2. 输出完整 HTML 内容

          3. 不要创建文件

          4. 不要调用文件工具

          5. 直接返回网页正文


          "



    - name: Check output


      run: |

        echo "===== output ====="

        ls -lah output


        echo "===== index.html ====="

        cat output/index.html




    - name: Upload Pages


      uses: actions/upload-pages-artifact@v3


      with:

        path: output





  deploy:


    needs: build


    runs-on: ubuntu-latest



    environment:

      name: github-pages



    steps:


    - name: Deploy Pages


      uses: actions/deploy-pages@v4
