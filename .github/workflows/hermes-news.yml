name: Hermes News Generator


on:

  workflow_dispatch:

  schedule:

    - cron: "0 */6 * * *"



permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-latest

    timeout-minutes: 30



    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare output directory

      run: |

        mkdir -p output

        sudo chmod 777 output



    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Running Hermes..."

        date


        timeout 25m docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -e HERMES_ACCEPT_HOOKS=1 \
          -v "$PWD/output:/output" \
          hermes-agent \
          "
          你是一名资深科技媒体主编，负责运营一个高质量移动科技新闻网站。

          请生成《Jolla Phone 新闻日报》。

          目标：
          制作一个类似专业科技媒体的新闻页面，而不是简单新闻列表。

          要求：

          1. 使用中文。

          2. 精选 5 条最重要新闻。
          不要为了数量降低质量。

          3. 每条新闻包含：

          - 新闻标题
          - 发布日期
          - 新闻分类标签
          - 详细摘要（100-200字）
          - 新闻背景
          - 对 Jolla Phone / Sailfish OS 用户的影响
          - 来源链接

          4. 页面必须包含：

          - 主标题：Jolla Phone 新闻日报
          - 更新时间
          - 今日摘要
          - 新闻卡片列表
          - 页脚信息

          5. HTML要求：

          生成完整 HTML5 文件。

          包含：
          - 内嵌 CSS
          - 响应式设计
          - 移动端适配
          - 现代科技媒体风格
          - 卡片布局
          - 清晰视觉层次

          6. 写入：

          /output/index.html

          不要修改其他文件。
          "


        echo "Hermes finished"

        date



    - name: Verify Hermes output

      run: |


        echo "===== output ====="

        ls -lah output


        if [ ! -f output/index.html ]; then

          echo "ERROR: output/index.html missing"

          exit 1

        fi


        if [ ! -s output/index.html ]; then

          echo "ERROR: index.html empty"

          exit 1

        fi


        echo "===== Preview ====="

        head -50 output/index.html



    - name: Fix output permission

      run: |


        sudo chown -R $USER:$USER output


        chmod 644 output/index.html



    - name: Commit only Hermes page

      run: |


        git config user.name "github-actions[bot]"


        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        git add output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes generated news"



        git pull --rebase origin ${GITHUB_REF_NAME}



        git push origin HEAD:${GITHUB_REF_NAME}
