name: Hermes Test


on:

  workflow_dispatch:


permissions:

  contents: read

  pages: write

  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    timeout-minutes: 20



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Build image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Run Hermes


      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        mkdir -p output



        docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD/output:/output" \
          hermes-agent \
          "

          创建文件：

          /output/index.html


          文件内容必须是：


          <!DOCTYPE html>
          <html>
          <body>

          <h1>Hermes CI OK</h1>

          </body>
          </html>


          必须实际创建文件。

          不要只回复代码。


          "




    - name: Check result


      run: |


        echo "===== output ====="


        ls -lah output



        echo "===== index.html ====="


        cat output/index.html




    - name: Upload Pages artifact


      uses: actions/upload-pages-artifact@v3


      with:

        path: output




  deploy:


    needs: build


    runs-on: ubuntu-latest


    environment:

      name: github-pages


    steps:


    - name: Deploy


      uses: actions/deploy-pages@v4
