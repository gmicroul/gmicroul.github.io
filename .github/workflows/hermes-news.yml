name: Hermes Jolla News


on:

  schedule:
    - cron: "0 1 * * *"


  workflow_dispatch:



permissions:

  contents: read
  pages: write
  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    timeout-minutes: 60



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Build Hermes Docker


        run: |

          docker build \
            --progress=plain \
            -t hermes-agent .



      - name: Run Hermes


        env:

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}



        run: |


          mkdir -p output



          docker run \
            --rm \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e OPENAI_MODEL \
            -v "$PWD/output:/output" \
            hermes-agent \
            "
            你是 Jolla Phone 和 Sailfish OS 新闻编辑。

            搜索最近24小时 Jolla Phone、
            Sailfish OS 相关新闻。


            生成完整 HTML5 中文新闻网页。


            必须创建：

            /output/index.html


            HTML要求：

            - UTF-8编码
            - 标题：Jolla Phone 新闻日报
            - 显示更新时间
            - 新闻标题
            - 新闻摘要
            - 新闻来源链接
            - 简单CSS美化


            不要只返回文字。

            必须写入 /output/index.html。
            "



      - name: Check output


        run: |

          ls -lah output

          test -f output/index.html





      - name: Upload Pages Artifact


        uses: actions/upload-pages-artifact@v3


        with:

          path: ./output





  deploy:


    needs: build


    runs-on: ubuntu-latest



    environment:


      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:


      - name: Deploy GitHub Pages


        id: deployment

        uses: actions/deploy-pages@v4
