name: Hermes Jolla News


on:

  workflow_dispatch:

  schedule:
    # 每天 UTC 01:00 运行
    - cron: "0 1 * * *"



permissions:

  contents: read

  pages: write

  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    timeout-minutes: 60



    steps:



      - name: Checkout repository

        uses: actions/checkout@v4




      - name: Build Hermes Docker image

        run: |

          docker build \
            --progress=plain \
            -t hermes-agent .





      - name: Run Hermes Agent


        env:

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


        run: |


          mkdir -p output



          docker run \
            --rm \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e OPENAI_MODEL \
            -v "$PWD/output:/output" \
            hermes-agent \
            "

            你是 Jolla Phone 和 Sailfish OS 新闻编辑。


            任务：

            搜索最近24小时 Jolla Phone、
            Sailfish OS 相关新闻。


            生成一个完整 HTML5 中文新闻页面。


            必须创建文件：

            /output/index.html


            页面要求：

            - UTF-8
            - 标题：Jolla Phone 新闻日报
            - 显示生成时间
            - 新闻标题列表
            - 新闻摘要
            - 新闻来源链接
            - 简洁CSS样式


            不要只返回文字。

            必须写入 /output/index.html。


            "





      - name: Check generated files


        run: |


          echo "===== output ====="


          ls -lah output



          echo "===== index.html ====="


          head -50 output/index.html



          test -f output/index.html






      - name: Upload GitHub Pages artifact


        uses: actions/upload-pages-artifact@v3


        with:

          path: ./output






  deploy:



    needs: build


    runs-on: ubuntu-latest



    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:



      - name: Deploy to GitHub Pages


        id: deployment


        uses: actions/deploy-pages@v4
