name: Hermes Jolla News


on:

  schedule:
    # 每天 UTC 01:00
    - cron: "0 1 * * *"

  workflow_dispatch:


permissions:

  contents: read
  pages: write
  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    timeout-minutes: 60


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Build Hermes

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Run Hermes


      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        mkdir -p output


        docker run \
          --rm \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v $PWD/output:/output \
          hermes-agent \
          "
          搜索最近24小时 Jolla Phone 和 Sailfish OS 新闻。

          生成一个完整 HTML5 中文新闻网页。

          必须保存文件：

          /output/index.html


          页面要求：

          - 标题：Jolla Phone 新闻日报
          - 显示更新时间
          - 新闻标题列表
          - 新闻摘要
          - 来源链接
          - 简洁美观的HTML/CSS
          "



    - name: Check output

      run: |

        ls -la output

        test -f output/index.html



    - name: Upload Pages Artifact

      uses: actions/upload-pages-artifact@v3

      with:

        path: ./output





  deploy:


    needs: build


    runs-on: ubuntu-latest


    environment:

      name: github-pages


      url: ${{ steps.deployment.outputs.page_url }}


    steps:


    - name: Deploy Pages

      id: deployment

      uses: actions/deploy-pages@v4
