name: Hermes News Generator


on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:

  contents: write


jobs:


  build:


    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Clean workspace

      run: |

        sudo rm -rf /root/.hermes || true

        rm -rf ~/.hermes || true

        rm -rf hermes-home || true

        mkdir -p hermes-home

        chmod 777 hermes-home



    - name: Build Hermes Docker image

      run: |

        docker build \
          --no-cache \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare output directory

      run: |

        mkdir -p output

        chmod 777 output



    - name: Check API secrets

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "Checking secrets..."


        if [ -z "$OPENAI_API_KEY" ]; then

          echo "ERROR: OPENAI_API_KEY missing"

          exit 1

        fi


        echo "KEY length=${#OPENAI_API_KEY}"

        echo "BASE_URL=$OPENAI_BASE_URL"

        echo "MODEL=$OPENAI_MODEL"




    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        echo "=================="

        echo "Running Hermes..."

        date



        timeout 25m docker run \

          --rm \

          --user root \

          -e HOME=/tmp/hermes-home \

          -e OPENAI_API_KEY \

          -e OPENAI_BASE_URL \

          -e OPENAI_MODEL \

          -v "$PWD/output:/output" \

          -v "$PWD/hermes-home:/tmp/hermes-home" \

          hermes-agent \

          "


          mkdir -p /tmp/hermes-home/.hermes



          cat > /tmp/hermes-home/.hermes/config.yaml <<EOF


model:

  default: \"$OPENAI_MODEL\"

  provider: custom

  api_key: \"$OPENAI_API_KEY\"

  base_url: \"$OPENAI_BASE_URL\"

  api_mode: chat_completions


EOF



          echo '===== Config ====='

          cat /tmp/hermes-home/.hermes/config.yaml



          echo '=================='



          直接生成一个真实的不是模拟的数据 Jolla Phone 和 Sailfish OS 新闻日报 HTML 页面。


          要求：


          1. 使用中文。


          2. 创建：

          /output/index.html


          3. 内容必须是最近一个月内的新闻。


          4. 每条新闻必须带来源链接。


          5. 不要修改或删除其它文件。



          "



        echo "Hermes finished"

        date





    - name: Verify output

      run: |


        echo "===== Output ====="

        ls -lah output



        if [ ! -f output/index.html ]; then

          echo "ERROR: index.html missing"

          exit 1

        fi



        SIZE=$(wc -c < output/index.html)


        echo "SIZE=$SIZE"



        if [ "$SIZE" -lt 1000 ]; then

          echo "ERROR: Generated page too small"

          cat output/index.html

          exit 1

        fi



        head -50 output/index.html





    - name: Fix permission

      run: |


        sudo chown -R $USER:$USER output

        chmod 644 output/index.html





    - name: Commit Hermes page

      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        git add output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes generated news"



        git pull --rebase origin ${GITHUB_REF_NAME}



        git push origin HEAD:${GITHUB_REF_NAME}
