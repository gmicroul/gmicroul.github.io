name: Hermes Games Navigation Generator-AI


on:

  workflow_dispatch:
  
#  schedule:

#    - cron: "0 */2 * * *"

permissions:

  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

        token: ${{ secrets.GITHUB_TOKEN }}



    - name: Check games-web

      run: |

        if [ ! -d "games-web" ]; then
          echo "games-web directory not found"
          exit 1
        fi


        COUNT=$(find games-web -type f -name "*.html" | wc -l)


        echo "HTML games: $COUNT"


        if [ "$COUNT" -lt 1 ]; then
          echo "No games found"
          exit 1
        fi



    - name: Build Hermes Docker image

      run: |

        docker build \
          --progress=plain \
          -t hermes-agent .



    - name: Prepare output

      run: |

        rm -rf output

        mkdir -p output

        chmod 777 output



    - name: Run Hermes

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}


      run: |


        timeout 25m docker run \
          --rm \
          --user root \
          -e OPENAI_API_KEY \
          -e OPENAI_BASE_URL \
          -e OPENAI_MODEL \
          -v "$PWD:/opt/hermes-agent/gmicroul.github.io" \
          hermes-agent \
          "


          不要询问。

          不要执行git操作。


          当前仓库：

          /opt/hermes-agent/gmicroul.github.io



          你的任务：

          为 GitHub Pages 生成 HTML5 游戏导航主页。图标参照sailfishos的图标风格如下要求：
          == 1. 务必用https://github.com/gmicroul/icon-templates的6个svg文件交替使用。进行光影和配色。不运行出现其它形状的图标。

          == 2. 配色（参考 hex，可按品牌微调） ==
          - 主色系（海洋感，占全套 60% 以上）：
            深青 #0E7C8C / 青 #19A7CE / 天蓝 #4FC3F7 / 海绿 #2EBD85 / 深绿 #15966B
          - 功能强调暖色（少量使用）：
            珊瑚红 #F0544F / 橙 #F59B23 / 明黄 #FFD34E / 紫粉渐变 #C56CD6→#E85D9E
          - 前景符号色：白 #FFFFFF 或米白 #F5F7F7；深色底上用纯白。
          - 点缀色举例：气泡内三点用紫红 #B03A6B，镜头感光点用红绿蓝三色小圆。
          - 单图标内用同色系深浅渐变，不跨色相；明度高、饱和中高，避免荧光刺眼。

          == 3. 光影 ==
          - 光源固定：左上，全套统一。
          - 线性渐变角度：120°–150°，明度变化柔和（L 值差 8%–15%）。
          - 球面元素（镜头、地球、钟表）用轻微径向渐变：中心偏左上亮 10%。
          - 投影：低透明蓝黑 rgba(20,40,60,0.15–0.25)，大模糊小偏移；或 45° 柔和长投影（扁平长影风格），全套二选一，不混用。
          - 高光：玻璃/水面元素加 1 处小面积半透明白色叠层即可，不做写实反光。
          - 禁用：粗黑描边、硬边内阴影、金属/拟物纹理、真实透视。



      

          扫描目录：

          /opt/hermes-agent/gmicroul.github.io/games-web/



          生成文件：

          /opt/hermes-agent/gmicroul.github.io/output/index.html





          ===== 重要路径规则 =====


          GitHub Pages 地址：

          https://gmicroul.github.io/



          output/index.html 部署后：

          https://gmicroul.github.io/output/index.html



          games-web 游戏地址：

          https://gmicroul.github.io/games-web/文件名.html




          所有游戏链接必须使用绝对根路径。



          正确示例：

          /games-web/granny.html



          禁止生成：

          games-web/granny.html

          ./games-web/granny.html

          ../games-web/granny.html

          /output/games-web/granny.html





          ===== 游戏扫描 =====


          扫描所有：

          games-web/**/*.html



          每个游戏：

          读取HTML文件。


          提取：

          <title>

          作为游戏名称。



          如果没有title：

          根据文件名生成名称。




          ===== 图标 =====


          每个游戏生成卡片图标。


          优先寻找同目录资源：

          favicon.ico

          icon.png

          icon.jpg

          icon.webp

          *.png

          *.jpg

          *.webp



          如果不存在：

          使用CSS生成随机字母占位图标。



          不允许引用外部图片。



          ===== 页面要求 =====


          生成现代游戏大厅风格。



          必须包含：


          1. 响应式网格布局


          2. 手机适配


          3. 电脑适配


          4. 搜索框


          5. 实时过滤游戏


          6. 游戏数量统计


          7. 点击卡片打开游戏




          ===== 技术限制 =====


          index.html必须独立运行。



          所有：

          CSS

          JavaScript



          必须直接写入index.html。



          禁止：

          外部CDN

          外部JS

          外部CSS




          ===== 安全规则 =====


          不修改：

          games-web/



          不删除：

          任何仓库文件



          不执行：

          git命令



          只生成：

          output/index.html




          ===== 完成检查 =====


          确认：

          output/index.html

          存在。



          如果成功：

          退出。



          "




    - name: Verify generated files

      run: |


        echo "===== Output ====="

        ls -lah output


        test -f output/index.html



        SIZE=$(du -h output/index.html | awk '{print $1}')

        echo "index.html size: $SIZE"



        COUNT=$(find games-web -type f -name "*.html" | wc -l)

        echo "Games count: $COUNT"



        if [ "$COUNT" -lt 1 ]; then

          exit 1

        fi





    - name: Commit and push

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        git add output/index.html



        if git diff --cached --quiet; then

          echo "No changes"

          exit 0

        fi



        git commit \
          -m "Update Hermes games navigation"



        git push \
          https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
          HEAD:${GITHUB_REF_NAME}
