<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Hub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#06222c;color:#e8f6fa;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(8,32,44,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(79,195,247,.22)}
  #bar a{color:#4fc3f7;text-decoration:none;font-size:13.5px;padding:4px 12px;border:1px solid rgba(79,195,247,.4);border-radius:999px;white-space:nowrap}
  #bar a:active{background:rgba(79,195,247,.15)}
  #t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  #frame{flex:1;width:100%;border:0}
</style>
</head>
<body>
<div id="bar"><a href="index.html">‹ 返回大厅</a><span id="t">载入中…</span></div>
<iframe id="frame" frameborder="0" allowfullscreen allow="autoplay;fullscreen"></iframe>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var g=p.get('g')||'';
  var n=p.get('n')||'Game';
  if(!/\.html$/i.test(g)){g='';}
  document.title=n+' · Game Hub';
  document.getElementById('t').textContent=n;
  if(g){document.getElementById('frame').src='../games-web/'+g;}
})();
</script>
</body>
</html>
