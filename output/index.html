<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a1620;
  --bg-elevated: #0f1e2d;
  --fg: #f0f4f7;
  --fg-muted: #8aa0b0;
  --accent-cyan: #19a7ce;
  --accent-teal: #2ebd85;
  --accent-coral: #f0544f;
  --accent-orange: #f59b23;
  --accent-yellow: #ffd34e;
  --accent-purple: #c56cd6;
  --card-bg: rgba(15, 30, 45, 0.9);
  --card-border: rgba(25, 167, 206, 0.15);
  --shadow: 0 8px 32px rgba(20, 40, 60, 0.4);
  --shadow-hover: 0 16px 48px rgba(20, 40, 60, 0.55);
  --radius: 16px;
  --radius-sm: 12px;
  --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

/* ===== SailfishOS Icon Color Palette ===== */
:root {
  --icon-1-bg: linear-gradient(135deg, #0e7c8c 0%, #15966b 100%);
  --icon-2-bg: linear-gradient(135deg, #19a7ce 0%, #0e7c8c 100%);
  --icon-3-bg: linear-gradient(135deg, #4fc3f7 0%, #19a7ce 100%);
  --icon-4-bg: linear-gradient(135deg, #2ebd85 0%, #15966b 100%);
  --icon-5-bg: linear-gradient(135deg, #f0544f 0%, #c56cd6 100%);
  --icon-6-bg: linear-gradient(135deg, #f59b23 0%, #ffd34e 100%);
  --icon-7-bg: linear-gradient(135deg, #c56cd6 0%, #e85d9e 100%);
  --icon-8-bg: linear-gradient(135deg, #0e7c8c 0%, #2ebd85 100%);
  --icon-9-bg: linear-gradient(135deg, #19a7ce 0%, #4fc3f7 100%);
  --icon-10-bg: linear-gradient(135deg, #15966b 0%, #2ebd85 100%);
  --icon-fg: #ffffff;
}

/* ===== Base ===== */
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Background atmosphere */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(25, 167, 206, 0.08) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(46, 189, 133, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 30% at 0% 0%, rgba(197, 108, 214, 0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: -1;
}

/* ===== Layout ===== */
.app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

/* ===== Header ===== */
.header {
  text-align: center;
  margin-bottom: 32px;
  padding: 8px 0 16px;
}
.header h1 {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--fg) 0%, var(--accent-cyan) 50%, var(--accent-teal) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.header .subtitle {
  color: var(--fg-muted);
  font-size: clamp(0.875rem, 1.5vw, 1rem);
  font-weight: 400;
}

/* ===== Search & Stats ===== */
.search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  max-width: 640px;
  margin-left: auto;
  margin-right: auto;
}
.search-wrapper {
  flex: 1;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 14px 18px 14px 48px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  color: var(--fg);
  font-size: 1rem;
  font-family: inherit;
  transition: var(--transition);
  backdrop-filter: blur(10px);
}
.search-input::placeholder { color: var(--fg-muted); opacity: 0.7; }
.search-input:focus {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.2);
}
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--fg-muted);
  pointer-events: none;
  transition: var(--transition);
}
.search-input:focus + .search-icon { stroke: var(--accent-cyan); }
.clear-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--fg-muted);
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: var(--transition);
}
.clear-btn.visible { opacity: 1; pointer-events: auto; }
.clear-btn:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
.stats {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-muted);
  font-size: 0.875rem;
  font-weight: 500;
  white-space: nowrap;
}
.stats strong { color: var(--accent-cyan); font-size: 1.125rem; }

/* ===== Game Grid ===== */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  animation: fadeIn 0.5s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Game Card ===== */
.game-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 20px 14px 16px;
  backdrop-filter: blur(10px);
  transition: var(--transition);
  overflow: hidden;
}
.game-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25,167,206,0.08) 0%, transparent 50%);
  opacity: 0;
  transition: var(--transition);
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: rgba(25, 167, 206, 0.4);
  box-shadow: var(--shadow-hover);
}
.game-card:hover::before { opacity: 1; }
.game-card:focus-visible {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.3);
}

/* ===== SailfishOS-style Icon ===== */
.icon-wrapper {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 22%; /* squircle-ish */
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 
    0 4px 16px rgba(20, 40, 60, 0.35),
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 -1px 0 rgba(20, 40, 60, 0.2);
  overflow: hidden;
  transition: var(--transition);
}
.game-card:hover .icon-wrapper {
  transform: scale(1.05) rotate(-1deg);
  box-shadow: 
    0 8px 24px rgba(20, 40, 60, 0.45),
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(20, 40, 60, 0.3);
}

/* Three base shapes rotation */
.icon-shape {
  position: absolute;
  inset: 12%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Shape 1: Circle / Concentric */
.shape-circle {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--icon-fg);
  opacity: 0.15;
  mask: radial-gradient(circle at 35% 35%, transparent 35%, black 36%);
  -webkit-mask: radial-gradient(circle at 35% 35%, transparent 35%, black 36%);
}

/* Shape 2: Squircle */
.shape-squircle {
  width: 86%;
  height: 86%;
  border-radius: 28%;
  background: var(--icon-fg);
  opacity: 0.12;
  transform: rotate(45deg);
}

/* Shape 3: Organic blob */
.shape-blob {
  width: 78%;
  height: 78%;
  border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
  background: var(--icon-fg);
  opacity: 0.1;
  animation: blobRotate 20s linear infinite;
}
@keyframes blobRotate { to { transform: rotate(360deg); } }

/* Icon letter fallback */
.icon-letter {
  position: relative;
  z-index: 2;
  font-size: clamp(1.5rem, 3vw, 2.25rem);
  font-weight: 700;
  color: var(--icon-fg);
  text-shadow: 0 2px 8px rgba(20, 40, 60, 0.4);
  letter-spacing: -0.02em;
  filter: drop-shadow(0 2px 4px rgba(20, 40, 60, 0.3));
}

/* Subtle shine overlay */
.icon-wrapper::after {
  content: "";
  position: absolute;
  top: -10%;
  left: -10%;
  width: 120%;
  height: 120%;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
  pointer-events: none;
  opacity: 0.5;
}

/* ===== Card Content ===== */
.game-title {
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.3;
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 100%;
  letter-spacing: -0.01em;
}

/* ===== Empty State ===== */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-muted);
}
.empty-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 16px;
  stroke: var(--fg-muted);
  opacity: 0.5;
}
.empty-state h3 { font-size: 1.125rem; margin-bottom: 8px; color: var(--fg); }
.empty-state p { font-size: 0.875rem; }

/* ===== Footer ===== */
.footer {
  margin-top: 40px;
  padding: 24px 16px;
  text-align: center;
  color: var(--fg-muted);
  font-size: 0.75rem;
  border-top: 1px solid var(--card-border);
}
.footer a { color: var(--accent-cyan); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .shape-blob { animation: none; }
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .app { padding: 16px 12px 32px; }
  .search-bar { flex-direction: column; gap: 12px; }
  .stats { order: -1; justify-content: center; }
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .icon-wrapper { width: 72px; height: 72px; }
  .game-title { font-size: 0.75rem; }
}

@media (min-width: 1024px) {
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .icon-wrapper { width: 88px; height: 88px; }
  .game-title { font-size: 0.875rem; }
}

@media (min-width: 1400px) {
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}
</style>
</head>

// ===== Icon Background Variations =====
const ICON_BGS = [
  'var(--icon-1-bg)', 'var(--icon-2-bg)', 'var(--icon-3-bg)', 'var(--icon-4-bg)',
  'var(--icon-5-bg)', 'var(--icon-6-bg)', 'var(--icon-7-bg)', 'var(--icon-8-bg)',
  'var(--icon-9-bg)', 'var(--icon-10-bg)'
];

// ===== Shape Types (SailfishOS three base shapes) =====
const SHAPE_TYPES = ['circle', 'squircle', 'blob'];

// ===== Simple Hash for Consistent Assignment =====
function hashStr(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

// ===== Render Game Cards =====
const grid = document.getElementById('gameGrid');
const emptyState = document.getElementById('emptyState');
const countEl = document.getElementById('gameCount');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

function getInitials(title) {
  const words = title.trim().split(/\s+/);
  if (words.length === 1) {
    return words[0].slice(0, 2).toUpperCase();
  }
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}

function renderGames(filtered) {
  grid.innerHTML = '';
  countEl.textContent = filtered.length;
  
  if (filtered.length === 0) {
    grid.hidden = true;
    emptyState.hidden = false;
    return;
  }
  
  grid.hidden = false;
  emptyState.hidden = true;
  
  filtered.forEach((game, idx) => {
    const h = hashStr(game.title);
    const bgIdx = h % ICON_BGS.length;
    const shapeIdx = h % SHAPE_TYPES.length;
    const letter = getInitials(game.title);
    const shape = SHAPE_TYPES[shapeIdx];
    
    const card = document.createElement('a');
    card.href = game.url;
    card.className = 'game-card';
    card.role = 'listitem';
    card.setAttribute('data-title', game.title.toLowerCase());
    
    card.innerHTML = `
      <div class="icon-wrapper" style="background: ${ICON_BGS[bgIdx]};">
        <div class="icon-shape shape-${shape}"></div>
        <span class="icon-letter">${letter}</span>
      </div>
      <span class="game-title">${game.title}</span>
    `;
    
    grid.appendChild(card);
  });
}

// ===== Search & Filter =====
let debounceTimer = null;
searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const query = e.target.value.trim().toLowerCase();
    clearBtn.classList.toggle('visible', query.length > 0);
    
    const filtered = GAMES.filter(g => g.title.toLowerCase().includes(query));
    renderGames(filtered);
  }, 80);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  renderGames(GAMES);
  searchInput.focus();
});

// ===== Initial Render =====
renderGames(GAMES);

// ===== Keyboard Shortcuts =====
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.blur();
    if (searchInput.value) {
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      renderGames(GAMES);
    }
  }
});
</script>
