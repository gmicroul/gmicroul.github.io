<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 - GitHub Pages</title>
<style>
/* ===== CSS Variables - SailfishOS Color Palette ===== */
:root {
  /* Oceanic primary colors (60%+) */
  --deep-teal: #0E7C8C;
  --teal: #19A7CE;
  --sky-blue: #4FC3F7;
  --sea-green: #2EBD85;
  --deep-green: #15966B;
  
  /* Warm accent colors (sparingly) */
  --coral-red: #F0544F;
  --orange: #F59B23;
  --bright-yellow: #FFD34E;
  --purple-pink-start: #C56CD6;
  --purple-pink-end: #E85D9E;
  
  /* Foreground */
  --fg-white: #FFFFFF;
  --fg-offwhite: #F5F7F7;
  
  /* Accent examples */
  --accent-purple-red: #B03A6B;
  
  /* Shadows */
  --shadow-color: rgba(20, 40, 60, 0.2);
  --shadow-color-strong: rgba(20, 40, 60, 0.25);
  
  /* Background */
  --bg-primary: #0A1628;
  --bg-secondary: #0D1B2E;
  --bg-card: #112036;
  --bg-card-hover: #152840;
  
  /* Layout */
  --card-size: 160px;
  --icon-size: 96px;
  --gap: 20px;
  --radius: 24px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset & Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg-primary);
  color: var(--fg-white);
  min-height: 100vh;
  line-height: 1.5;
}

/* Subtle animated background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(14, 124, 140, 0.15) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(46, 189, 133, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(25, 167, 206, 0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ===== Header ===== */
.header {
  position: relative;
  z-index: 10;
  padding: 24px 20px;
  max-width: 1400px;
  margin: 0 auto;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--fg-white);
}

.logo-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, var(--deep-teal), var(--sea-green));
  border-radius: 14px;
  position: relative;
  overflow: hidden;
}

.logo-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%) rotate(45deg); }
  100% { transform: translateX(200%) rotate(45deg); }
}

.logo-text {
  font-size: 1.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--sky-blue), var(--sea-green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stats {
  font-size: 0.875rem;
  color: rgba(255,255,255,0.6);
  white-space: nowrap;
}

.stats strong {
  color: var(--sky-blue);
  font-weight: 600;
}

/* ===== Search ===== */
.search-container {
  position: relative;
  max-width: 480px;
  width: 100%;
}

.search-input {
  width: 100%;
  padding: 14px 20px 14px 50px;
  background: var(--bg-secondary);
  border: 2px solid rgba(25, 167, 206, 0.2);
  border-radius: 14px;
  color: var(--fg-white);
  font-size: 1rem;
  transition: var(--transition);
}

.search-input:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 4px rgba(25, 167, 206, 0.15);
}

.search-input::placeholder {
  color: rgba(255,255,255,0.4);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: rgba(255,255,255,0.5);
  pointer-events: none;
  transition: var(--transition);
}

.search-input:focus + .search-icon {
  stroke: var(--sky-blue);
}

.clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.clear-btn:hover {
  background: var(--coral-red);
  color: var(--fg-white);
}

.clear-btn.visible {
  display: flex;
}

/* ===== Game Grid ===== */
.main {
  position: relative;
  z-index: 10;
  padding: 0 20px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--gap);
}

/* ===== Game Card ===== */
.game-card {
  position: relative;
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid rgba(25, 167, 206, 0.1);
  animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) backwards;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.game-card:hover {
  transform: translateY(-8px) scale(1.02);
  border-color: var(--teal);
  box-shadow: 
    0 20px 40px var(--shadow-color-strong),
    0 0 0 1px var(--teal),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.game-card:active {
  transform: translateY(-4px) scale(0.99);
}

/* Staggered animation delay */
.game-card:nth-child(1) { animation-delay: 0ms; }
.game-card:nth-child(2) { animation-delay: 30ms; }
.game-card:nth-child(3) { animation-delay: 60ms; }
.game-card:nth-child(4) { animation-delay: 90ms; }
.game-card:nth-child(5) { animation-delay: 120ms; }
.game-card:nth-child(6) { animation-delay: 150ms; }
.game-card:nth-child(7) { animation-delay: 180ms; }
.game-card:nth-child(8) { animation-delay: 210ms; }
.game-card:nth-child(9) { animation-delay: 240ms; }
.game-card:nth-child(10) { animation-delay: 270ms; }
.game-card:nth-child(11) { animation-delay: 300ms; }
.game-card:nth-child(12) { animation-delay: 330ms; }

/* ===== Icon Container - SailfishOS Style ===== */
.icon-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* SailfishOS icon shape: square with circle cutout corners */
.icon-shape {
  position: relative;
  width: 100%;
  height: 100%;
  /* Square with inscribed circle cutouts - SailfishOS style */
  clip-path: polygon(
    0 15%, 0 85%, 
    15% 100%, 85% 100%, 
    100% 85%, 100% 15%, 
    85% 0, 15% 0
  );
  overflow: hidden;
}

.icon-bg {
  position: absolute;
  inset: 0;
  background: var(--icon-gradient);
  opacity: 0.95;
}

.icon-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.icon-bg::after {
  content: '';
  position: absolute;
  inset: -4px;
  background: inherit;
  filter: blur(12px);
  opacity: 0.3;
  z-index: -1;
  border-radius: inherit;
}

/* Icon symbol - negative space cutout */
.icon-symbol {
  position: relative;
  z-index: 2;
  width: 78%;
  height: 78%;
  display: flex;
  align-items: center;
  justify-content: center;
  mask: var(--icon-mask);
  -webkit-mask: var(--icon-mask);
  background: var(--fg-white);
}

/* Alternate rotation for even-indexed cards */
.game-card:nth-child(2n) .icon-shape {
  transform: rotate(90deg);
}

.game-card:nth-child(2n) .icon-symbol {
  transform: rotate(-90deg);
}

/* Card content */
.card-content {
  padding: 16px;
}

.card-title {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--fg-white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

/* ===== Empty State ===== */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: rgba(255,255,255,0.4);
}

.empty-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 16px;
  stroke: rgba(25, 167, 206, 0.3);
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  :root {
    --card-size: 140px;
    --icon-size: 80px;
    --gap: 16px;
    --radius: 20px;
  }
  
  .header { padding: 16px; }
  .logo-text { font-size: 1.25rem; }
  .main { padding: 0 16px 32px; }
  .game-grid { gap: 16px; }
  .card-content { padding: 12px; }
  .card-title { font-size: 0.8rem; }
}

@media (min-width: 1024px) {
  :root {
    --card-size: 180px;
    --icon-size: 108px;
  }
}

@media (min-width: 1400px) {
  :root {
    --card-size: 200px;
    --icon-size: 120px;
  }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== Focus Visible ===== */
.game-card:focus-visible,
.search-input:focus-visible {
  outline: 2px solid var(--sky-blue);
  outline-offset: 2px;
}
</style>

  { name: 'diamond', svg: '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 5 L90 45 L50 85 L10 45 L50 5 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M50 25 L90 45 L50 65 L10 45 L50 25" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>' },
  { name: 'cloud', svg: '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M30 60 C30 45 40 35 55 35 C62 35 68 30 75 25 C85 25 92 32 92 42 C92 58 80 70 60 70 C48 70 38 65 30 60 Z" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/></svg>' },
  { name: 'bolt', svg: '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M35 15 L55 50 L40 50 L55 85 L40 85 L20 50 L35 50 L35 15 Z" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>' },
  { name: 'gear', svg: '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="18" fill="currentColor"/><path d="M50 8 L50 20 M50 80 L50 92 M8 50 L20 50 M80 50 L92 50 M20 20 L12 12 M88 88 L96 96 M20 80 L12 88 M88 12 L96 20" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg>' },
];

function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function generateIconHTML(game, index) {
  const hash = hashString(game.filename);
  const gradient = allGradients[hash % allGradients.length];
  const shape = iconShapes[hash % iconShapes.length];
  
  const maskSvg = shape.svg.replace(/fill="currentColor"/g, 'fill="white"')
                          .replace(/stroke="currentColor"/g, 'stroke="white"')
                          .replace(/fill="none"/g, 'fill="white"');
  
  const maskDataUri = 'url("data:image/svg+xml;base64,' + btoa(maskSvg) + '")';
  
  return `
    <div class="icon-wrapper" style="--icon-gradient: ${gradient};">
      <div class="icon-shape" style="--icon-mask: ${maskDataUri};">
        <div class="icon-bg"></div>
        <div class="icon-symbol" style="--icon-mask: ${maskDataUri};"></div>
      </div>
    </div>
  `;
}

const grid = document.getElementById('game-grid');
const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-btn');
const emptyState = document.getElementById('empty-state');
const totalCount = document.getElementById('total-count');
const visibleCount = document.getElementById('visible-count');

function renderGames(filter = '') {
  const lowerFilter = filter.toLowerCase().trim();
  const filtered = games.filter(g => 
    g.display_title.toLowerCase().includes(lowerFilter) ||
    g.filename.toLowerCase().includes(lowerFilter)
  );
  
  totalCount.textContent = games.length;
  visibleCount.textContent = filtered.length;
  
  if (filtered.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  
  emptyState.style.display = 'none';
  
  grid.innerHTML = filtered.map((game, idx) => {
    const iconHTML = generateIconHTML(game, idx);
    return `
      <article class="game-card" 
               role="listitem" 
               tabindex="0"
               data-filename="${game.filename}"
               data-title="${game.display_title.replace(/"/g, '"')}"
               aria-label="打开游戏：${game.display_title.replace(/"/g, '"')}">
        ${iconHTML}
        <div class="card-content">
          <h3 class="card-title">${game.display_title}</h3>
        </div>
      </article>
    `;
  }).join('');
  
  attachCardListeners();
}

function attachCardListeners() {
  document.querySelectorAll('.game-card').forEach(card => {
    card.addEventListener('click', () => openGame(card));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openGame(card);
      }
    });
  });
}

function openGame(card) {
  const filename = card.dataset.filename;
  window.open('/games-web/' + filename, '_blank', 'noopener,noreferrer');
}

let searchDebounce;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    const value = e.target.value;
    clearBtn.classList.toggle('visible', value.length > 0);
    renderGames(value);
  }, 100);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  renderGames('');
  searchInput.focus();
});

renderGames();

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
    if (searchInput.value) {
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      renderGames('');
    }
  }
});

console.log(`游戏大厅已加载 - ${games.length} 款游戏`);
</script>
