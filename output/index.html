<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub - HTML5 游戏导航</title>
<style>
:root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #888888;
    --card-bg: #111111;
    --border: #222222;
    --accent-blue: #5FD0F5;
    --accent-pink: #FFD8E0;
    --purple-pink: #E85D9E;
    --radius: 16px;
    --gap: 16px;
    --header-h: 72px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.5; }

header {
    position: sticky; top: 0; z-index: 100;
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
}

header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

.search-wrap { flex: 1; max-width: 520px; margin: 0 24px; position: relative; }

#search {
    width: 100%; height: 40px; padding: 0 44px 0 16px;
    font-size: 0.95rem; color: var(--fg); background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
#search:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(95,208,245,0.15); }
#search::placeholder { color: var(--muted); }

.search-wrap svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); pointer-events: none; }

.stats { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }

main { padding: 20px; max-width: 1400px; margin: 0 auto; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: var(--gap);
}

@media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    header { padding: 0 12px; }
    .search-wrap { margin: 0 12px; max-width: none; }
    main { padding: 12px; }
    header h1 { font-size: 1.1rem; }
}

@media (min-width: 641px) and (max-width: 1024px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.card:hover { transform: translateY(-4px); border-color: var(--accent-blue); box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
.card:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

.icon-wrap {
    aspect-ratio: 1 / 1;
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    position: relative;
}
.icon-wrap svg { width: 86px; height: 86px; display: block; }
.icon-wrap img { width: 100%; height: 100%; object-fit: cover; }

.card-info { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 56px; }
.card-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.card-name small { font-weight: 400; color: var(--muted); font-size: 0.7em; }

.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }

.hidden { display: none !important; }

/* Sailfish OS style icon generation via CSS */
.sailfish-icon {
    width: 86px; height: 86px;
    transform: translateY(-4px);
}
.sailfish-icon .bg { transform-origin: 43px 47px; }
.sailfish-icon .highlight { transform-origin: 43px 47px; }
.sailfish-icon text { dominant-baseline: middle; text-anchor: middle; font: bold 29px system-ui; fill: #fff; pointer-events: none; }
.sailfish-icon.even .bg, .sailfish-icon.even .highlight { transform: rotate(90deg); }
.sailfish-icon.even text { transform: rotate(-90deg); transform-origin: 43px 47px; }
.sailfish-icon.even.letter-i text { fill: #E85D9E; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
}
</style>
</head>

const GRAD_HL = 'url(#grad-hl)';

function makeDefs() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.style.display = 'none';
    svg.innerHTML = `
<defs>
<linearGradient id="grad-odd" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0%" stop-color="#5FD0F5"/>
<stop offset="100%" stop-color="#3AA8D0"/>
</linearGradient>
<linearGradient id="grad-even" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0%" stop-color="#FFD8E0"/>
<stop offset="100%" stop-color="#FFB0C4"/>
</linearGradient>
<radialGradient id="grad-hl" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
</defs>`;
    document.body.appendChild(svg);
}
makeDefs();

function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h);
}

function firstLetter(name) {
    const m = name.trim().match(/[A-Za-z]/);
    return m ? m[0].toUpperCase() : '?';
}

function buildIconSvg(name, index) {
    const isEven = (index % 2) === 1; // 0-based: 1st=odd(index 0), 2nd=even(index 1)
    const letter = firstLetter(name);
    const letterIsI = letter === 'I';
    const textColor = (isEven && letterIsI) ? '#E85D9E' : '#FFFFFF';
    const bgGrad = isEven ? GRAD_EVEN : GRAD_ODD;
    const bgTransform = isEven ? 'rotate(90 43 47)' : '';
    const hlTransform = isEven ? 'rotate(90 43 47)' : '';
    const textTransform = isEven ? 'rotate(-90 43 47)' : '';
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 86 94');
    svg.setAttribute('class', 'sailfish-icon' + (isEven ? ' even' : ''));
    svg.setAttribute('width', '86');
    svg.setAttribute('height', '86');
    svg.innerHTML = `
<g class="bg" transform="${bgTransform}">
<path d="${PATH}" fill="${bgGrad}"/>
</g>
<g class="highlight" transform="${hlTransform}">
<path d="${PATH}" fill="${GRAD_HL}"/>
</g>
<text x="43" y="47" transform="${textTransform}" fill="${textColor}">${letter}</text>`;
    return svg;
}

function render(list) {
    grid.innerHTML = '';
    if (list.length === 0) {
        empty.classList.remove('hidden');
        stats.textContent = '共 0 款游戏';
        return;
    }
    empty.classList.add('hidden');
    stats.textContent = `共 ${list.length} 款游戏`;
    list.forEach((game, idx) => {
        const a = document.createElement('a');
        a.href = game.url;
        a.className = 'card';
        a.setAttribute('role', 'listitem');
        a.setAttribute('aria-label', game.name);
        const iconWrap = document.createElement('div');
        iconWrap.className = 'icon-wrap';
        const iconSvg = buildIconSvg(game.name, idx);
        iconWrap.appendChild(iconSvg);
        const info = document.createElement('div');
        info.className = 'card-info';
        const nameEl = document.createElement('div');
        nameEl.className = 'card-name';
        nameEl.textContent = game.name;
        info.appendChild(nameEl);
        a.appendChild(iconWrap);
        a.appendChild(info);
        grid.appendChild(a);
    });
}

let debounceTimer = null;
search.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        const q = search.value.trim().toLowerCase();
        if (!q) { render(GAMES); return; }
        const filtered = GAMES.filter(g => g.name.toLowerCase().includes(q));
        render(filtered);
    }, 80);
});

render(GAMES);
</script>
