<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub · HTML5 游戏大厅</title>
<style>
:root{
  --bg0:#0b1020; --bg1:#121a33; --card:#17203d; --card2:#1d2a4f;
  --txt:#eaf0ff; --dim:#8fa0c8; --accent:#5eead4; --accent2:#818cf8;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#1c2b5a 0%,transparent 60%),
             radial-gradient(1000px 700px at -10% 20%,#14324a 0%,transparent 55%),
             linear-gradient(180deg,var(--bg0),var(--bg1));
  background-attachment:fixed;
  color:var(--txt); min-height:100vh; padding-bottom:60px;
}
header{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:rgba(11,16,32,.72);
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:18px 20px 14px;
}
.hwrap{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
h1{font-size:22px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
h1 .logo{
  width:34px;height:34px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:42% 58% 55% 45% / 48% 42% 58% 52%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#0b1020;font-weight:900;
  box-shadow:0 4px 14px rgba(94,234,212,.35);
}
.count{
  font-size:13px;color:var(--dim);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:4px 12px;border-radius:999px;white-space:nowrap;
}
.count b{color:var(--accent)}
.searchbox{flex:1;min-width:200px;position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim);pointer-events:none}
#search{
  width:100%;padding:11px 16px 11px 40px;font-size:15px;color:var(--txt);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;outline:none;transition:border-color .2s,box-shadow .2s;
}
#search::placeholder{color:var(--dim)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,234,212,.15)}
main{max-width:1200px;margin:0 auto;padding:26px 20px 0}
.grid{
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
}
.card{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:20px 10px 16px;text-decoration:none;color:var(--txt);
  background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  cursor:pointer;
}
.card:hover{transform:translateY(-5px);border-color:rgba(94,234,212,.4);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.card:active{transform:translateY(-1px) scale(.98)}
.icon{
  width:64px;height:64px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;color:rgba(255,255,255,.95);
  text-shadow:0 2px 6px rgba(0,0,0,.35);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.25),inset 0 -4px 8px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.35);
  transition:transform .25s ease;
}
.card:hover .icon{transform:scale(1.1) rotate(-4deg)}
.name{
  font-size:13.5px;font-weight:600;text-align:center;line-height:1.35;
  word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.empty{
  display:none;text-align:center;color:var(--dim);
  padding:80px 20px;font-size:15px;
}
.empty.show{display:block}
footer{max-width:1200px;margin:50px auto 0;padding:0 20px;text-align:center;color:var(--dim);font-size:12px}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
  .icon{width:54px;height:54px;font-size:23px}
  .card{padding:16px 6px 13px;border-radius:16px}
  .name{font-size:12px}
  h1{font-size:18px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1><span class="logo">G</span>Game Hub</h1>
    <span class="count">共 <b id="total">0</b> 个游戏<span id="viswrap"> · 显示 <b id="visible">0</b> 个</span></span>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索游戏…" autocomplete="off">
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有找到匹配的游戏，换个关键词试试。</div>
</main>
<footer>HTML5 Games · gmicroul.github.io</footer>

/* SailfishOS 风格：有机圆角（四条边非直边）+ 由名称哈希生成的渐变 */
var PALETTES = [
  ["#0ea5e9","#6366f1"],["#f43f5e","#fb923c"],["#10b981","#84cc16"],
  ["#8b5cf6","#ec4899"],["#f59e0b","#ef4444"],["#06b6d4","#3b82f6"],
  ["#a3e635","#10b981"],["#f97316","#facc15"],["#e879f9","#818cf8"],
  ["#2dd4bf","#0ea5e9"],["#fb7185","#c084fc"],["#4ade80","#22d3ee"]
];
/* 四组有机 blob 圆角，模拟 Sailfish 图标的非直边轮廓 */
var SHAPES = [
  "42% 58% 55% 45% / 48% 42% 58% 52%",
  "58% 42% 45% 55% / 42% 55% 45% 58%",
  "50% 50% 42% 58% / 55% 45% 58% 42%",
  "45% 55% 58% 42% / 50% 52% 44% 56%",
  "55% 45% 50% 50% / 42% 58% 45% 55%",
  "38% 62% 50% 50% / 55% 40% 60% 45%"
];
function hash(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function initial(t){
  var m=t.match(/[A-Za-z0-9\u4e00-\u9fff]/);
  return m?m[0].toUpperCase():"?";
}

var grid=document.getElementById("grid"),
    input=document.getElementById("search"),
    empty=document.getElementById("empty"),
    totalEl=document.getElementById("total"),
    visEl=document.getElementById("visible");

var cards=GAMES.map(function(g){
  var h=hash(g.title), pal=PALETTES[h%PALETTES.length], shape=SHAPES[(h>>4)%SHAPES.length];
  var a=document.createElement("a");
  a.className="card";
  a.href="/games-web/"+encodeURI(g.file);
  a.target="_blank"; a.rel="noopener";
  a.setAttribute("data-name",g.title.toLowerCase());
  a.innerHTML='<div class="icon" style="background:linear-gradient(135deg,'+pal[0]+","+pal[1]+");border-radius:"+shape+'">'+esc(initial(g.title))+"</div>"+
              '<div class="name">'+esc(g.title)+"</div>";
  grid.appendChild(a);
  return a;
});

totalEl.textContent=GAMES.length;
visEl.textContent=GAMES.length;

input.addEventListener("input",function(){
  var q=this.value.trim().toLowerCase(), n=0;
  cards.forEach(function(c){
    var hit=!q||c.getAttribute("data-name").indexOf(q)!==-1;
    c.style.display=hit?"":"none";
    if(hit)n++;
  });
  visEl.textContent=n;
  empty.classList.toggle("show",n===0);
});
</script>
