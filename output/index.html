<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · SFOS Style</title>
<style>
  :root{
    --bg1:#04141D; --bg2:#0A2733;
    --card:#0E2E3C; --card-brd:rgba(90,210,235,.16);
    --text:#E8F6FA; --dim:#7FA9B8;
    --accent:#4FC3F7; --accent2:#2EBD85;
    --hl:rgba(120,225,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(46,189,133,.14), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(79,195,247,.12), transparent 55%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text);min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(5,22,30,.78);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(90,210,235,.16);
    padding:14px 18px;
  }
  .bar{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.4px}
  .logo svg{width:32px;height:32px;flex:none;filter:drop-shadow(0 2px 8px rgba(79,195,247,.45))}
  .logo em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:13px;color:var(--dim);background:var(--hl);
    border:1px solid rgba(90,210,235,.25);padding:4px 12px;border-radius:999px;white-space:nowrap}
  .search{margin-left:auto;flex:1;min-width:170px;max-width:400px;position:relative}
  .search input{
    width:100%;padding:10px 16px 10px 40px;border-radius:999px;
    border:1px solid rgba(90,210,235,.30);background:rgba(11,38,50,.85);
    color:var(--text);font-size:15px;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.18)}
  .search input::placeholder{color:var(--dim)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;
    stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
  main{max-width:1180px;margin:0 auto;padding:22px 16px 56px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,108px);justify-content:center;gap:18px 14px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(auto-fill,112px);gap:22px 18px}}
  .card{
    width:108px;display:flex;flex-direction:column;align-items:center;gap:8px;
    text-decoration:none;color:var(--text);
  }
  .tile{
    width:108px;height:108px;flex:none;display:flex;align-items:center;justify-content:center;
    border-radius:20px;background:linear-gradient(150deg,rgba(20,56,72,.55),rgba(9,36,48,.55));
    border:1px solid var(--card-brd);
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .tile img{width:86px;height:86px;display:block;filter:drop-shadow(0 8px 14px rgba(3,15,20,.45))}
  .card:hover .tile,.card:focus-visible .tile{
    transform:translateY(-5px);
    background:linear-gradient(150deg,rgba(26,70,90,.8),rgba(14,48,64,.8));
    border-color:rgba(79,195,247,.5);box-shadow:0 14px 30px rgba(3,15,20,.55);outline:none;
  }
  .card:hover .tile img{filter:drop-shadow(0 12px 20px rgba(3,15,20,.55))}
  .name{
    font-size:12px;font-weight:600;text-align:center;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:2.7em;max-width:108px;
  }
  .empty{display:none;text-align:center;color:var(--dim);padding:70px 0;font-size:16px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:0 0 28px;opacity:.7}
</style>
</head>

            <path d="M150 350 L150 162 L196 162 L196 252 L316 162 L374 162 L246 258 L380 350 L320 350 L212 268 L196 268 L196 350 Z" fill="#000"/>
          </mask>

      </svg>
      <span>游戏<em>大厅</em></span>
    </div>
    <span class="count" id="count"></span>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>

    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>

</main>
