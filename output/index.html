<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Sail Sans,"Noto Sans",sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 16px 8px}
.header h1{font-size:22px;font-weight:300;letter-spacing:.5px;margin-bottom:10px;color:rgba(255,255,255,.95)}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:rgba(255,255,255,.45);stroke-width:2;stroke-linecap:round}
#search{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:9px 14px 9px 38px;color:#fff;font-size:15px;outline:none;transition:border-color .2s}
#search::placeholder{color:rgba(255,255,255,.35)}
#search:focus{border-color:rgba(255,255,255,.25)}
.count{font-size:13px;color:rgba(255,255,255,.45);padding:10px 16px 4px;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,108px);gap:8px;padding:4px 12px 20px;justify-content:center}
@media(max-width:260px){.grid{grid-template-columns:repeat(2,108px)}}
@media(min-width:261px) and (max-width:480px){.grid{grid-template-columns:repeat(2,108px);justify-content:center}}
.card{width:108px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:0;transition:transform .15s,opacity .15s;-webkit-user-select:none;user-select:none}
.card:active{transform:scale(.92)}
.card.hidden{display:none}
.icon-wrap{width:86px;height:86px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.icon-wrap img,.icon-wrap object{width:86px;height:86px;display:block}
.card-name{font-size:11px;color:rgba(255,255,255,.7);text-align:center;margin-top:2px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);font-size:15px;display:none}
</style>
</head>

  for(var i=0;i<total;i++){
    var g=games[i],name=g[1],url=g[2],icon=g[3];
    if(f&&name.toLowerCase().indexOf(f)===-1&&g[0].toLowerCase().indexOf(f)===-1)continue;
    n++;
    var card=document.createElement("div");
    card.className="card";
    card.setAttribute("data-name",name);
    card.onclick=(function(u){return function(){location.href=u}})(url);
    card.innerHTML='<div class="icon-wrap"><object data="icons/'+icon+'" type="image/svg+xml" width="86" height="86"></object></div><div class="card-name">'+name+'</div>';
    grid.appendChild(card);
  }
  countEl.textContent=n+" game"+(n!==1?"s":"");
  emptyEl.style.display=n===0?"block":"none";
}
render();
search.addEventListener("input",function(){render(this.value)});
</script>
</body>
</html>
