<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红色警戒 - 单关随机战役</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #00ff00; 
            font-family: 'Courier New', monospace; 
            overflow: hidden;
            user-select: none;
        }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        #canvas { display: block; background: #0d1a0d; }
        #ui-overlay { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            pointer-events: none; 
        }
        #top-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 20, 0, 0.9); border: 2px solid #00ff00;
            padding: 8px 20px; border-radius: 8px;
            font-size: 14px; letter-spacing: 1px;
            pointer-events: auto;
        }
        #side-panel {
            position: absolute; right: 10px; top: 60px; bottom: 10px;
            width: 220px; background: rgba(0, 20, 0, 0.95);
            border: 2px solid #00ff00; border-radius: 8px;
            padding: 10px; overflow-y: auto; pointer-events: auto;
            display: flex; flex-direction: column;
        }
        #bottom-bar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 20, 0, 0.9); border: 2px solid #00ff00;
            padding: 10px 20px; border-radius: 8px;
            pointer-events: auto; display: flex; gap: 15px; flex-wrap: wrap;
            justify-content: center; max-width: 90%;
        }
        .resource { display: inline-block; margin-right: 20px; }
        .resource-label { color: #88ff88; }
        .resource-value { color: #ffff00; font-weight: bold; }
        .panel-title { 
            color: #00ff00; border-bottom: 1px solid #00ff00; 
            padding-bottom: 5px; margin-bottom: 10px; font-size: 13px;
        }
        .build-btn {
            background: #003300; border: 1px solid #00ff00; color: #00ff00;
            padding: 8px 12px; margin: 4px 0; text-align: left;
            cursor: pointer; font-family: inherit; font-size: 12px;
            width: 100%; border-radius: 4px; transition: all 0.1s;
        }
        .build-btn:hover:not(:disabled) { background: #005500; }
        .build-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .build-btn.selected { background: #00aa00; color: #000; }
        .unit-info { font-size: 11px; color: #88ff88; margin-top: 2px; }
        .minimap {
            position: absolute; bottom: 10px; left: 10px;
            width: 180px; height: 180px; border: 2px solid #00ff00;
            background: #001100; pointer-events: auto; border-radius: 4px;
        }
        #message-log {
            position: absolute; bottom: 210px; left: 10px;
            width: 350px; height: 150px; background: rgba(0, 20, 0, 0.9);
            border: 1px solid #00ff00; border-radius: 4px; padding: 8px;
            overflow-y: auto; font-size: 11px; line-height: 1.4;
            pointer-events: none;
        }
        .msg { margin: 2px 0; color: #88ff88; }
        .msg.warning { color: #ffaa00; }
        .msg.danger { color: #ff4444; }
        .msg.success { color: #44ff44; }
        #victory-screen, #defeat-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; pointer-events: auto;
        }
        #victory-screen h1 { color: #44ff44; font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 20px #44ff44; }
        #defeat-screen h1 { color: #ff4444; font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 20px #ff4444; }
        .restart-btn {
            background: #003300; border: 2px solid #00ff00; color: #00ff00;
            padding: 15px 40px; font-size: 18px; font-family: inherit;
            cursor: pointer; border-radius: 8px; margin-top: 20px;
        }
        .restart-btn:hover { background: #005500; }
        .selection-box { 
            position: absolute; border: 1px dashed #00ff00; 
            background: rgba(0, 255, 0, 0.1); pointer-events: none; display: none; 
        }
        #load-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .load-bar { width: 300px; height: 20px; border: 2px solid #00ff00; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        .load-fill { height: 100%; background: linear-gradient(90deg, #00ff00, #00aa00); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div id="load-screen">
        <h1 style="color:#00ff00;text-shadow:0 0 20px #00ff00;">红色警戒</h1>
        <p style="color:#88ff88;margin-top:10px;">初始化战场...</p>
        <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
    </div>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui-overlay">
            <div id="top-bar">
                <span class="resource"><span class="resource-label">资金: </span><span class="resource-value" id="money">0</span></span>
                <span class="resource"><span class="resource-label">电力: </span><span class="resource-value" id="power">0/0</span></span>
                <span class="resource"><span class="resource-label">人口: </span><span class="resource-value" id="population">0/0</span></span>
                <span class="resource"><span class="resource-label">单位: </span><span class="resource-value" id="unit-count">0</span></span>
            </div>
            <div id="side-panel">
                <div class="panel-title">▶ 建造队列</div>
                <div id="build-buttons"></div>
                <div class="panel-title" style="margin-top:15px;">▶ 选中单位</div>
                <div id="selection-info" style="font-size:12px;color:#88ff88;min-height:60px;">未选中单位</div>
            </div>
            <div id="bottom-bar">
                <button class="build-btn" data-action="move" id="btn-move">移动 (M)</button>
                <button class="build-btn" data-action="attack" id="btn-attack">攻击 (A)</button>
                <button class="build-btn" data-action="guard" id="btn-guard">戒备 (G)</button>
                <button class="build-btn" data-action="stop" id="btn-stop">停止 (S)</button>
                <button class="build-btn" data-action="sell" id="btn-sell">出售</button>
                <button class="build-btn" data-action="repair" id="btn-repair">修理</button>
            </div>
            <canvas class="minimap" id="minimap"></canvas>
            <div id="message-log"></div>
            <div class="selection-box" id="selection-box"></div>
        </div>
    </div>

    <div id="victory-screen">
        <h1>任务完成</h1>
        <p style="color:#88ff88;font-size:18px;margin-bottom:30px;">敌方基地已被摧毁，胜利属于我们！</p>
        <button class="restart-btn" onclick="restartGame()">再来一局</button>
    </div>

    <div id="defeat-screen">
        <h1>任务失败</h1>
        <p style="color:#88ff88;font-size:18px;margin-bottom:30px;">指挥中心被摧毁，撤退！</p>
        <button class="restart-btn" onclick="restartGame()">重新开始</button>
    </div>

<script>
// ========== 游戏常量 ==========
const TILE_SIZE = 32;
const MAP_TILES = 60; // 60x60 tiles = 1920x1920 world
const WORLD_SIZE = MAP_TILES * TILE_SIZE;
const VIEWPORT_W = window.innerWidth;
const VIEWPORT_H = window.innerHeight;

const TERRAIN = {
    GRASS: 0, DIRT: 1, WATER: 2, ORE: 3, GEM: 4, BRIDGE: 5
};

const TERRAIN_COLORS = {
    [TERRAIN.GRASS]: ['#1a3a1a', '#1e441e', '#163016', '#224a22'],
    [TERRAIN.DIRT]: ['#3d2a1a', '#4a3322', '#352215', '#443020'],
    [TERRAIN.WATER]: ['#0a1a3a', '#0d2244', '#081530', '#102850'],
    [TERRAIN.ORE]: ['#4a3a1a', '#554422', '#403015', '#504020'],
    [TERRAIN.GEM]: ['#1a3a3a', '#224444', '#153030', '#204040'],
    [TERRAIN.BRIDGE]: ['#554433', '#665544', '#443322', '#776655'],
};

const FACTION = { PLAYER: 0, ENEMY: 1, NEUTRAL: 2 };

const UNIT_TYPES = {
    MCV: { name: '基地车', cost: 3000, hp: 600, speed: 0.8, range: 0, dmg: 0, buildTime: 30, armor: 'heavy', icon: '🚚', desc: '展开建立基地' },
    HARVESTER: { name: '矿车', cost: 1400, hp: 400, speed: 1.0, range: 0, dmg: 0, buildTime: 20, armor: 'heavy', icon: '⛏', desc: '采集矿石/宝石' },
    TANK: { name: '重型坦克', cost: 800, hp: 300, speed: 1.5, range: 120, dmg: 50, buildTime: 15, armor: 'heavy', icon: '🚁', desc: '主力战车' },
    LIGHT_TANK: { name: '轻型坦克', cost: 600, hp: 180, speed: 2.2, range: 100, dmg: 30, buildTime: 10, armor: 'light', icon: '🚁', desc: '快速骚扰' },
    INFANTRY: { name: '步兵', cost: 100, hp: 40, speed: 1.2, range: 80, dmg: 8, buildTime: 3, armor: 'infantry', icon: '👤', desc: '基础步兵' },
    ROCKET_INF: { name: '火箭兵', cost: 300, hp: 50, speed: 1.1, range: 140, dmg: 35, buildTime: 5, armor: 'infantry', icon: '💥', desc: '对空/对地' },
    ENGINEER: { name: '工程师', cost: 500, hp: 40, speed: 1.0, range: 0, dmg: 0, buildTime: 8, armor: 'infantry', icon: '🔧', desc: '占领/修理建筑' },
    APC: { name: '装甲运兵车', cost: 700, hp: 200, speed: 2.0, range: 0, dmg: 0, buildTime: 12, armor: 'light', icon: '🚌', desc: '运输步兵' },
    V2: { name: 'V2火箭车', cost: 900, hp: 150, speed: 1.3, range: 250, dmg: 120, buildTime: 18, armor: 'light', icon: '🚀', desc: '远程轰炸' },
    MIG: { name: '米格战机', cost: 1200, hp: 200, speed: 6.0, range: 150, dmg: 80, buildTime: 20, armor: 'air', icon: '✈️', desc: '空中打击' },
};

const BUILDING_TYPES = {
    CONYARD: { name: '建筑场', cost: 0, hp: 1000, size: 3, power: 0, provides: [], req: [], icon: '🏗', desc: '基地核心，展开MCV获得' },
    POWER: { name: '电厂', cost: 300, hp: 400, size: 2, power: 200, provides: [], req: ['CONYARD'], icon: '⚡', desc: '提供电力' },
    REFINERY: { name: '精炼厂', cost: 2000, hp: 600, size: 3, power: -50, provides: ['HARVESTER'], req: ['CONYARD'], icon: '🏭', desc: '矿车卸矿，生产矿车' },
    BARRACKS: { name: '兵营', cost: 300, hp: 400, size: 2, power: -25, provides: ['INFANTRY', 'ROCKET_INF', 'ENGINEER'], req: ['CONYARD'], icon: '🏰', desc: '训练步兵' },
    WARFACTORY: { name: '战车工厂', cost: 2000, hp: 600, size: 3, power: -50, provides: ['TANK', 'LIGHT_TANK', 'APC', 'V2'], req: ['CONYARD'], icon: '🏭', desc: '生产车辆' },
    AIRFIELD: { name: '机场', cost: 1500, hp: 400, size: 3, power: -50, provides: ['MIG'], req: ['CONYARD', 'POWER'], icon: '✈️', desc: '生产战机' },
    DEFENSE_GUN: { name: '机枪碉堡', cost: 400, hp: 300, size: 1, power: -10, provides: [], req: ['CONYARD'], icon: '🔫', desc: '对地防御' },
    DEFENSE_SAM: { name: '防空导弹', cost: 500, hp: 250, size: 1, power: -25, provides: [], req: ['CONYARD', 'POWER'], icon: '🛡', desc: '对空防御' },
    TECH_CENTER: { name: '科技中心', cost: 1500, hp: 500, size: 2, power: -50, provides: [], req: ['CONYARD', 'POWER'], icon: '🔬', desc: '解锁高级单位' },
    SILO: { name: '核弹发射井', cost: 5000, hp: 400, size: 2, power: -200, provides: [], req: ['CONYARD', 'TECH_CENTER'], icon: '☢️', desc: '超级武器' },
};

// ========== 工具函数 ==========
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx*dx + dy*dy); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ========== 地图生成 ==========
function generateMap() {
    const map = new Array(MAP_TILES).fill(0).map(() => new Array(MAP_TILES).fill(TERRAIN.GRASS));
    
    // 基础地形噪声
    for (let y = 0; y < MAP_TILES; y++) {
        for (let x = 0; x < MAP_TILES; x++) {
            const n = noise2D(x * 0.05, y * 0.05);
            if (n < -0.3) map[y][x] = TERRAIN.DIRT;
            else if (n > 0.3) map[y][x] = TERRAIN.GRASS;
        }
    }
    
    // 河流生成
    const riverCount = randInt(2, 4);
    for (let r = 0; r < riverCount; r++) {
        let x = randInt(0, MAP_TILES - 1);
        let y = randInt(0, MAP_TILES - 1);
        const dir = randInt(0, 3);
        const length = randInt(30, 50);
        for (let i = 0; i < length; i++) {
            if (x >= 0 && x < MAP_TILES && y >= 0 && y < MAP_TILES) {
                map[y][x] = TERRAIN.WATER;
                // 河流宽度
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < MAP_TILES && ny >= 0 && ny < MAP_TILES && Math.random() < 0.4) {
                            map[ny][nx] = TERRAIN.WATER;
                        }
                    }
                }
            }
            switch(dir) {
                case 0: y--; break;
                case 1: x++; break;
                case 2: y++; break;
                case 3: x--; break;
            }
            // 随机转向
            if (Math.random() < 0.15) {
                const ndir = (dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
            }
        }
    }
    
    // 矿石分布
    const orePatches = randInt(6, 10);
    for (let i = 0; i < orePatches; i++) {
        const cx = randInt(5, MAP_TILES - 6);
        const cy = randInt(5, MAP_TILES - 6);
        const size = randInt(3, 6);
        const isGem = Math.random() < 0.2;
        for (let y = -size; y <= size; y++) {
            for (let x = -size; x <= size; x++) {
                if (x*x + y*y <= size*size && Math.random() < 0.7) {
                    const tx = cx + x, ty = cy + y;
                    if (tx > 0 && tx < MAP_TILES && ty > 0 && ty < MAP_TILES && map[ty][tx] === TERRAIN.GRASS) {
                        map[ty][tx] = isGem ? TERRAIN.GEM : TERRAIN.ORE;
                    }
                }
            }
        }
    }
    
    // 桥梁
    for (let y = 1; y < MAP_TILES - 1; y++) {
        for (let x = 1; x < MAP_TILES - 1; x++) {
            if (map[y][x] === TERRAIN.WATER) {
                const h = (map[y-1][x] !== TERRAIN.WATER) + (map[y+1][x] !== TERRAIN.WATER);
                const v = (map[y][x-1] !== TERRAIN.WATER) + (map[y][x+1] !== TERRAIN.WATER);
                if ((h >= 1 && v >= 1) || (h === 2 && v === 0) || (v === 2 && h === 0)) {
                    if (Math.random() < 0.08) map[y][x] = TERRAIN.BRIDGE;
                }
            }
        }
    }
    
    return map;
}

// 简单噪声
function noise2D(x, y) {
    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return (n - Math.floor(n)) * 2 - 1;
}

// 可通行性检查
function isPassable(tileType, unitType) {
    if (unitType === 'air') return true;
    if (tileType === TERRAIN.WATER) return unitType === 'naval'; // 无海军单位
    if (tileType === TERRAIN.BRIDGE) return true;
    return true;
}

// ========== 游戏状态 ==========
let gameState = {
    map: [],
    entities: [],
    buildings: [],
    projectiles: [],
    effects: [],
    selectedEntities: [],
    camera: { x: 0, y: 0, targetX: 0, targetY: 0 },
    resources: { money: 5000, power: 0, powerMax: 0, population: 0, populationMax: 0 },
    player: { faction: FACTION.PLAYER, conyardDeployed: false, techLevel: 1 },
    enemy: { faction: FACTION.ENEMY, conyardDeployed: false, techLevel: 1, attackTimer: 0 },
    gameOver: false,
    victory: false,
    buildMode: null,
    buildPreview: null,
    mouse: { x: 0, y: 0, worldX: 0, worldY: 0, down: false, dragStart: null },
    keys: {},
    tick: 0,
    messages: [],
};

// ========== 实体类 ==========
class Entity {
    constructor(data) {
        Object.assign(this, {
            id: Date.now() + Math.random(),
            x: 0, y: 0,
            targetX: 0, targetY: 0,
            hp: 100, maxHp: 100,
            speed: 1, range: 0, dmg: 0,
            faction: FACTION.PLAYER,
            type: 'unit',
            unitType: 'ground',
            armor: 'light',
            state: 'idle', // idle, move, attack, harvest, return, deploy, guard
            target: null,
            lastAttack: 0,
            buildProgress: 0,
            buildTime: 0,
            carryAmount: 0,
            carryMax: 1000,
            selectionRing: false,
            renderSize: 16,
            color: '#00ff00',
            shadowOffset: 2,
        }, data);
        this.targetX = this.x;
        this.targetY = this.y;
    }
    
    update(dt) {
        if (this.hp <= 0) return false;
        
        // 状态机
        switch(this.state) {
            case 'move':
                this.moveTo(this.targetX, this.targetY, dt);
                break;
            case 'attack':
                this.attackBehavior(dt);
                break;
            case 'harvest':
                this.harvestBehavior(dt);
                break;
            case 'return':
                this.returnBehavior(dt);
                break;
            case 'deploy':
                this.deployBehavior(dt);
                break;
            case 'guard':
                this.guardBehavior(dt);
                break;
        }
        
        // 自动寻敌
        if (this.state === 'idle' || this.state === 'guard') {
            const enemy = this.findNearestEnemy();
            if (enemy && dist(this.x, this.y, enemy.x, enemy.y) < this.range + 100) {
                this.state = 'attack';
                this.target = enemy;
            }
        }
        
        return true;
    }
    
    moveTo(tx, ty, dt) {
        const dx = tx - this.x;
        const dy = ty - this.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 5) {
            this.x = tx; this.y = ty;
            if (this.state === 'move') this.state = 'idle';
            return true;
        }
        const moveDist = this.speed * dt * 60;
        const nx = this.x + dx/d * moveDist;
        const ny = this.y + dy/d * moveDist;
        
        // 碰撞检测
        if (this.canMoveTo(nx, ny)) {
            this.x = nx; this.y = ny;
        } else {
            // 简单寻路：尝试绕行
            this.tryPathfind(tx, ty, dt);
        }
        return false;
    }
    
    canMoveTo(x, y) {
        const tx = Math.floor(x / TILE_SIZE);
        const ty = Math.floor(y / TILE_SIZE);
        if (tx < 0 || tx >= MAP_TILES || ty < 0 || ty >= MAP_TILES) return false;
        return isPassable(gameState.map[ty][tx], this.unitType);
    }
    
    tryPathfind(tx, ty, dt) {
        // 简单的8方向尝试
        const angles = [0, Math.PI/4, -Math.PI/4, Math.PI/2, -Math.PI/2, 3*Math.PI/4, -3*Math.PI/4, Math.PI];
        const moveDist = this.speed * dt * 60;
        for (const a of angles) {
            const nx = this.x + Math.cos(a) * moveDist;
            const ny = this.y + Math.sin(a) * moveDist;
            if (this.canMoveTo(nx, ny)) {
                this.x = nx; this.y = ny;
                break;
            }
        }
    }
    
    findNearestEnemy() {
        let nearest = null, minD = 99999;
        for (const e of gameState.entities) {
            if (e.faction !== this.faction && e.hp > 0) {
                const d = dist(this.x, this.y, e.x, e.y);
                if (d < minD && d < this.range + 200) {
                    minD = d; nearest = e;
                }
            }
        }
        for (const b of gameState.buildings) {
            if (b.faction !== this.faction && b.hp > 0) {
                const d = dist(this.x, this.y, b.x + b.size*TILE_SIZE/2, b.y + b.size*TILE_SIZE/2);
                if (d < minD && d < this.range + 200) {
                    minD = d; nearest = b;
                }
            }
        }
        return nearest;
    }
    
    attackBehavior(dt) {
        if (!this.target || this.target.hp <= 0) {
            this.target = this.findNearestEnemy();
            if (!this.target) { this.state = 'idle'; return; }
        }
        
        const tx = this.target.x + (this.target.size ? this.target.size * TILE_SIZE / 2 : 0);
        const ty = this.target.y + (this.target.size ? this.target.size * TILE_SIZE / 2 : 0);
        const d = dist(this.x, this.y, tx, ty);
        
        if (d > this.range) {
            this.moveTo(tx, ty, dt);
        } else {
            // 停止移动攻击
            if (Date.now() - this.lastAttack > 1000) {
                this.lastAttack = Date.now();
                this.fireProjectile(tx, ty);
            }
        }
    }
    
    fireProjectile(tx, ty) {
        gameState.projectiles.push(new Projectile({
            x: this.x, y: this.y,
            targetX: tx, targetY: ty,
            dmg: this.dmg,
            faction: this.faction,
            speed: 8,
            type: this.unitType === 'air' ? 'missile' : 'shell',
            source: this,
        }));
    }
    
    harvestBehavior(dt) {
        // 寻找最近矿石
        let ore = null, minD = 99999;
        for (let y = Math.max(0, Math.floor(this.y/TILE_SIZE)-5); y < Math.min(MAP_TILES, Math.floor(this.y/TILE_SIZE)+5); y++) {
            for (let x = Math.max(0, Math.floor(this.x/TILE_SIZE)-5); x < Math.min(MAP_TILES, Math.floor(this.x/TILE_SIZE)+5); x++) {
                if (gameState.map[y][x] === TERRAIN.ORE || gameState.map[y][x] === TERRAIN.GEM) {
                    const d = dist(this.x, this.y, x*TILE_SIZE, y*TILE_SIZE);
                    if (d < minD) { minD = d; ore = {x, y, type: gameState.map[y][x]}; }
                }
            }
        }
        if (!ore) { this.state = 'idle'; return; }
        
        if (minD < 40) {
            // 采集
            this.carryAmount += dt * 60 * 20;
            const maxCarry = gameState.map[ore.y][ore.x] === TERRAIN.GEM ? 2000 : 1000;
            if (this.carryAmount >= maxCarry) {
                this.carryAmount = maxCarry;
                // 扣除地图资源
                if (Math.random() < 0.05) gameState.map[ore.y][ore.x] = TERRAIN.GRASS;
                this.state = 'return';
            }
        } else {
            this.moveTo(ore.x * TILE_SIZE, ore.y * TILE_SIZE, dt);
        }
    }
    
    returnBehavior(dt) {
        // 寻找精炼厂
        let refinery = null, minD = 99999;
        for (const b of gameState.buildings) {
            if (b.faction === this.faction && b.type === 'REFINERY' && b.hp > 0) {
                const d = dist(this.x, this.y, b.x + b.size*TILE_SIZE/2, b.y + b.size*TILE_SIZE/2);
                if (d < minD) { minD = d; refinery = b; }
            }
        }
        if (!refinery) { this.state = 'idle'; return; }
        
        const rx = refinery.x + refinery.size * TILE_SIZE / 2;
        const ry = refinery.y + refinery.size * TILE_SIZE / 2;
        
        if (minD < 50) {
            // 卸货
            const value = gameState.map[0][0] === TERRAIN.GEM ? this.carryAmount * 2 : this.carryAmount;
            gameState.resources.money += this.carryAmount;
            addMessage(`+$${Math.floor(this.carryAmount)}`, 'success');
            this.carryAmount = 0;
            this.state = 'harvest';
        } else {
            this.moveTo(rx, ry, dt);
        }
    }
    
    deployBehavior(dt) {
        if (this.buildProgress >= this.buildTime) {
            // 展开建筑
            const bx = Math.floor(this.x / TILE_SIZE);
            const by = Math.floor(this.y / TILE_SIZE);
            const building = new Building({
                type: 'CONYARD',
                x: bx * TILE_SIZE,
                y: by * TILE_SIZE,
                faction: this.faction,
            });
            gameState.buildings.push(building);
            gameState.player.conyardDeployed = true;
            addMessage('建筑场已展开！', 'success');
            // 移除MCV
            return false;
        }
        this.buildProgress += dt * 60;
        return true;
    }
    
    guardBehavior(dt) {
        // 守卫原地，自动攻击范围内敌人
        const enemy = this.findNearestEnemy();
        if (enemy && dist(this.x, this.y, enemy.x, enemy.y) < this.range + 150) {
            this.state = 'attack';
            this.target = enemy;
        }
    }
    
    takeDamage(dmg, attacker) {
        this.hp -= dmg;
        gameState.effects.push(new Effect({
            x: this.x, y: this.y, type: 'hit', color: this.faction === FACTION.PLAYER ? '#00ff00' : '#ff4444'
        }));
        if (this.hp <= 0) {
            this.onDeath(attacker);
            return false;
        }
        return true;
    }
    
    onDeath(attacker) {
        gameState.effects.push(new Effect({
            x: this.x, y: this.y, type: 'explosion', size: this.renderSize * 2
        }));
        if (this.faction === FACTION.ENEMY && attacker && attacker.faction === FACTION.PLAYER) {
            gameState.resources.money += Math.floor(this.maxHp / 2);
        }
    }
    
    render(ctx) {
        if (this.hp <= 0) return;
        
        const sx = this.x - gameState.camera.x;
        const sy = this.y - gameState.camera.y;
        
        // 阴影
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sx + this.shadowOffset, sy + this.shadowOffset + this.renderSize/2, 
                    this.renderSize/2, this.renderSize/4, 0, 0, Math.PI*2);
        ctx.fill();
        
        // 单位本体
        ctx.fillStyle = this.faction === FACTION.PLAYER ? this.color : '#ff4444';
        ctx.strokeStyle = this.faction === FACTION.PLAYER ? '#00aa00' : '#aa0000';
        ctx.lineWidth = 1.5;
        
        if (this.unitType === 'air') {
            // 飞机
            ctx.beginPath();
            ctx.moveTo(sx, sy - this.renderSize);
            ctx.lineTo(sx - this.renderSize, sy);
            ctx.lineTo(sx, sy + this.renderSize/2);
            ctx.lineTo(sx + this.renderSize, sy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        } else if (this.armor === 'heavy') {
            // 坦克 - 矩形
            ctx.fillRect(sx - this.renderSize, sy - this.renderSize, this.renderSize*2, this.renderSize*2);
            ctx.strokeRect(sx - this.renderSize, sy - this.renderSize, this.renderSize*2, this.renderSize*2);
            // 炮管
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            const angle = this.target ? Math.atan2(this.target.y - this.y, this.target.x - this.x) : 0;
            ctx.lineTo(sx + Math.cos(angle) * this.renderSize * 1.5, sy + Math.sin(angle) * this.renderSize * 1.5);
            ctx.stroke();
        } else {
            // 步兵/轻型 - 圆形
            ctx.beginPath();
            ctx.arc(sx, sy, this.renderSize, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
        }
        
        // 选中圈
        if (this.selectionRing) {
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.arc(sx, sy, this.renderSize + 4, 0, Math.PI*2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        // 血条
        if (this.hp < this.maxHp) {
            const bw = this.renderSize * 2;
            ctx.fillStyle = '#330000';
            ctx.fillRect(sx - bw/2, sy - this.renderSize - 8, bw, 4);
            ctx.fillStyle = this.hp/this.maxHp > 0.5 ? '#00ff00' : '#ffaa00';
            if (this.hp/this.maxHp < 0.25) ctx.fillStyle = '#ff0000';
            ctx.fillRect(sx - bw/2, sy - this.renderSize - 8, bw * this.hp/this.maxHp, 4);
        }
        
        // 载重显示
        if (this.carryAmount > 0) {
            ctx.fillStyle = '#ffff00';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(Math.floor(this.carryAmount), sx, sy - this.renderSize - 12);
        }
    }
}

class Building {
    constructor(data) {
        Object.assign(this, {
            id: Date.now() + Math.random(),
            x: 0, y: 0,
            hp: 1000, maxHp: 1000,
            size: 2, // tiles
            type: 'CONYARD',
            faction: FACTION.PLAYER,
            buildProgress: 0,
            buildTime: 0,
            producing: null,
            produceProgress: 0,
            rallyX: 0, rallyY: 0,
            powerProvided: 0,
            powerConsumed: 0,
            color: '#00aa00',
            selectionRing: false,
        }, data);
        this.rallyX = this.x + this.size * TILE_SIZE / 2;
        this.rallyY = this.y + this.size * TILE_SIZE / 2;
        const def = BUILDING_TYPES[this.type];
        if (def) {
            this.maxHp = def.hp;
            this.hp = def.hp;
            this.size = def.size;
            this.powerProvided = def.power > 0 ? def.power : 0;
            this.powerConsumed = def.power < 0 ? -def.power : 0;
        }
    }
    
    update(dt) {
        if (this.hp <= 0) return false;
        
        // 建造中
        if (this.buildProgress < this.buildTime) {
            this.buildProgress += dt * 60;
            if (this.buildProgress >= this.buildTime) {
                this.onBuilt();
            }
            return true;
        }
        
        // 生产单位
        if (this.producing) {
            const udef = UNIT_TYPES[this.producing];
            this.produceProgress += dt * 60;
            if (this.produceProgress >= udef.buildTime) {
                this.spawnUnit(this.producing);
                this.producing = null;
                this.produceProgress = 0;
            }
        }
        
        // 防御建筑自动攻击
        if (this.type === 'DEFENSE_GUN' || this.type === 'DEFENSE_SAM') {
            this.defenseAttack(dt);
        }
        
        // 核弹发射井
        if (this.type === 'SILO' && this.faction === FACTION.PLAYER) {
            this.nukeReady = true;
        }
        
        return true;
    }
    
    onBuilt() {
        // 更新电力
        updatePower();
        // 设置集结点
        this.findRallyPoint();
    }
    
    findRallyPoint() {
        // 寻找建筑附近空地
        for (let r = this.size; r < this.size + 3; r++) {
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                const tx = Math.floor((this.x + Math.cos(a) * r * TILE_SIZE) / TILE_SIZE);
                const ty = Math.floor((this.y + Math.sin(a) * r * TILE_SIZE) / TILE_SIZE);
                if (tx > 0 && tx < MAP_TILES && ty > 0 && ty < MAP_TILES) {
                    if (gameState.map[ty][tx] !== TERRAIN.WATER) {
                        this.rallyX = tx * TILE_SIZE;
                        this.rallyY = ty * TILE_SIZE;
                        return;
                    }
                }
            }
        }
    }
    
    spawnUnit(unitType) {
        const udef = UNIT_TYPES[unitType];
        const angle = Math.random() * Math.PI * 2;
        const spawnX = this.rallyX + Math.cos(angle) * 30;
        const spawnY = this.rallyY + Math.sin(angle) * 30;
        
        const unit = new Entity({
            ...udef,
            x: spawnX, y: spawnY,
            targetX: this.rallyX, targetY: this.rallyY,
            faction: this.faction,
            color: this.faction === FACTION.PLAYER ? '#00ff00' : '#ff4444',
        });
        
        if (udef.armor === 'air') unit.unitType = 'air';
        
        gameState.entities.push(unit);
        gameState.resources.population++;
        addMessage(`${udef.name} 就绪`, 'success');
    }
    
    defenseAttack(dt) {
        if (!this.lastAttack) this.lastAttack = 0;
        if (Date.now() - this.lastAttack < 1500) return;
        
        let bestTarget = null, bestD = 99999;
        for (const e of gameState.entities) {
            if (e.faction !== this.faction && e.hp > 0) {
                const canTarget = (this.type === 'DEFENSE_SAM' && e.unitType === 'air') ||
                                  (this.type === 'DEFENSE_GUN' && e.unitType !== 'air');
                if (canTarget) {
                    const d = dist(this.x + this.size*TILE_SIZE/2, this.y + this.size*TILE_SIZE/2, e.x, e.y);
                    if (d < 300 && d < bestD) { bestD = d; bestTarget = e; }
                }
            }
        }
        
        if (bestTarget) {
            this.lastAttack = Date.now();
            gameState.projectiles.push(new Projectile({
                x: this.x + this.size*TILE_SIZE/2,
                y: this.y + this.size*TILE_SIZE/2,
                targetX: bestTarget.x, targetY: bestTarget.y,
                dmg: this.type === 'DEFENSE_SAM' ? 80 : 40,
                faction: this.faction,
                speed: 10,
                type: 'missile',
            }));
            gameState.effects.push(new Effect({
                x: this.x + this.size*TILE_SIZE/2,
                y: this.y + this.size*TILE_SIZE/2,
                type: 'muzzle'
            }));
        }
    }
    
    takeDamage(dmg, attacker) {
        this.hp -= dmg;
        gameState.effects.push(new Effect({
            x: this.x + this.size*TILE_SIZE/2, y: this.y + this.size*TILE_SIZE/2, 
            type: 'hit', color: this.faction === FACTION.PLAYER ? '#00ff00' : '#ff4444'
        }));
        if (this.hp <= 0) {
            this.onDeath(attacker);
            return false;
        }
        return true;
    }
    
    onDeath(attacker) {
        gameState.effects.push(new Effect({
            x: this.x + this.size*TILE_SIZE/2, y: this.y + this.size*TILE_SIZE/2, 
            type: 'explosion', size: this.size * TILE_SIZE
        }));
        
        // 检查胜负
        if (this.type === 'CONYARD') {
            if (this.faction === FACTION.PLAYER) {
                gameState.gameOver = true;
                gameState.victory = false;
            } else {
                gameState.gameOver = true;
                gameState.victory = true;
            }
        }
        
        updatePower();
    }
    
    render(ctx) {
        if (this.hp <= 0) return;
        
        const sx = this.x - gameState.camera.x;
        const sy = this.y - gameState.camera.y;
        const w = this.size * TILE_SIZE;
        const h = this.size * TILE_SIZE;
        
        // 阴影
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(sx + 2, sy + 2, w, h);
        
        // 建筑底座
        const def = BUILDING_TYPES[this.type];
        ctx.fillStyle = this.faction === FACTION.PLAYER ? '#2a4a2a' : '#4a2a2a';
        ctx.strokeStyle = this.faction === FACTION.PLAYER ? '#00ff00' : '#ff4444';
        ctx.lineWidth = 2;
        ctx.fillRect(sx, sy, w, h);
        ctx.strokeRect(sx, sy, w, h);
        
        // 建筑特征
        ctx.fillStyle = this.faction === FACTION.PLAYER ? '#00aa00' : '#aa0000';
        const cx = sx + w/2, cy = sy + h/2;
        
        switch(this.type) {
            case 'CONYARD':
                ctx.fillRect(cx - 12, cy - 12, 24, 24);
                ctx.strokeRect(cx - 12, cy - 12, 24, 24);
                break;
            case 'POWER':
                ctx.beginPath();
                ctx.moveTo(cx, cy - 15);
                ctx.lineTo(cx - 8, cy + 5);
                ctx.lineTo(cx + 8, cy + 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                break;
            case 'REFINERY':
                ctx.fillRect(cx - 15, cy - 10, 30, 20);
                ctx.strokeRect(cx - 15, cy - 10, 30, 20);
                // 烟囱
                ctx.fillRect(cx + 10, cy - 18, 6, 10);
                break;
            case 'BARRACKS':
                ctx.fillRect(cx - 14, cy - 12, 28, 24);
                ctx.strokeRect(cx - 14, cy - 12, 28, 24);
                // 门
                ctx.fillStyle = '#000';
                ctx.fillRect(cx - 4, cy + 4, 8, 8);
                break;
            case 'WARFACTORY':
                ctx.fillRect(cx - 18, cy - 14, 36, 28);
                ctx.strokeRect(cx - 18, cy - 14, 36, 28);
                // 大门
                ctx.fillStyle = '#000';
                ctx.fillRect(cx - 8, cy + 6, 16, 8);
                break;
            case 'AIRFIELD':
                // 跑道
                ctx.fillStyle = '#333';
                ctx.fillRect(sx, cy - 2, w, 4);
                ctx.fillStyle = '#fff';
                ctx.fillRect(cx - 30, cy - 1, 60, 2);
                break;
            case 'DEFENSE_GUN':
                ctx.beginPath();
                ctx.arc(cx, cy, 10, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                // 炮管
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + 18, cy - 8);
                ctx.stroke();
                break;
            case 'DEFENSE_SAM':
                ctx.beginPath();
                ctx.arc(cx, cy, 10, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                // 导弹
                ctx.fillStyle = '#fff';
                for (let i = -1; i <= 1; i++) {
                    ctx.fillRect(cx + i*6 - 2, cy - 18, 4, 18);
                }
                break;
            case 'TECH_CENTER':
                ctx.fillRect(cx - 12, cy - 12, 24, 24);
                ctx.strokeRect(cx - 12, cy - 12, 24, 24);
                // 天线
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy - 12);
                ctx.lineTo(cx, cy - 25);
                ctx.stroke();
                break;
            case 'SILO':
                ctx.fillRect(cx - 8, cy - 20, 16, 40);
                ctx.strokeRect(cx - 8, cy - 20, 16, 40);
                // 警示
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(cx, cy - 25, 6, 0, Math.PI*2);
                ctx.fill();
                break;
        }
        
        // 建造进度条
        if (this.buildProgress < this.buildTime) {
            const p = this.buildProgress / this.buildTime;
            ctx.fillStyle = '#330000';
            ctx.fillRect(sx, sy - 8, w, 4);
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(sx, sy - 8, w * p, 4);
        }
        
        // 生产进度
        if (this.producing) {
            const udef = UNIT_TYPES[this.producing];
            const p = this.produceProgress / udef.buildTime;
            ctx.fillStyle = '#001100';
            ctx.fillRect(sx, sy + h + 2, w, 4);
            ctx.fillStyle = '#00ffaa';
            ctx.fillRect(sx, sy + h + 2, w * p, 4);
        }
        
        // 选中框
        if (this.selectionRing) {
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(sx - 2, sy - 2, w + 4, h + 4);
            ctx.setLineDash([]);
        }
        
        // 血条
        if (this.hp < this.maxHp) {
            ctx.fillStyle = '#330000';
            ctx.fillRect(sx, sy - 14, w, 4);
            ctx.fillStyle = this.hp/this.maxHp > 0.5 ? '#00ff00' : '#ffaa00';
            if (this.hp/this.maxHp < 0.25) ctx.fillStyle = '#ff0000';
            ctx.fillRect(sx, sy - 14, w * this.hp/this.maxHp, 4);
        }
        
        // 集结点
        if (this.faction === FACTION.PLAYER && !gameState.buildMode) {
            const rx = this.rallyX - gameState.camera.x;
            const ry = this.rallyY - gameState.camera.y;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(rx, ry, 12, 0, Math.PI*2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }
}

class Projectile {
    constructor(data) {
        Object.assign(this, {
            x: 0, y: 0, targetX: 0, targetY: 0,
            dmg: 50, faction: FACTION.PLAYER,
            speed: 10, type: 'shell', // shell, missile
            target: null, source: null,
            life: 0, maxLife: 180,
        }, data);
    }
    
    update(dt) {
        this.life++;
        if (this.life > this.maxLife) return false;
        
        if (this.target && this.target.hp > 0) {
            this.targetX = this.target.x + (this.target.size ? this.target.size*TILE_SIZE/2 : 0);
            this.targetY = this.target.y + (this.target.size ? this.target.size*TILE_SIZE/2 : 0);
        }
        
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        
        if (d < this.speed * dt * 60) {
            // 命中
            if (this.target && this.target.hp > 0) {
                this.target.takeDamage(this.dmg, this.source);
            } else {
                // 溅射伤害
                this.explode();
            }
            gameState.effects.push(new Effect({
                x: this.targetX, y: this.targetY, type: 'explosion', size: 20
            }));
            return false;
        }
        
        this.x += dx/d * this.speed * dt * 60;
        this.y += dy/d * this.speed * dt * 60;
        return true;
    }
    
    explode() {
        for (const e of gameState.entities) {
            if (e.faction !== this.faction && dist(e.x, e.y, this.x, this.y) < 60) {
                e.takeDamage(this.dmg * 0.5, this.source);
            }
        }
        for (const b of gameState.buildings) {
            if (b.faction !== this.faction && dist(b.x + b.size*TILE_SIZE/2, b.y + b.size*TILE_SIZE/2, this.x, this.y) < 60) {
                b.takeDamage(this.dmg * 0.5, this.source);
            }
        }
    }
    
    render(ctx) {
        const sx = this.x - gameState.camera.x;
        const sy = this.y - gameState.camera.y;
        
        if (this.type === 'missile') {
            // 导弹轨迹
            ctx.strokeStyle = this.faction === FACTION.PLAYER ? '#00ff00' : '#ff4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx - Math.cos(Math.atan2(this.targetY - this.y, this.targetX - this.x)) * 10,
                       sy - Math.sin(Math.atan2(this.targetY - this.y, this.targetX - this.x)) * 10);
            ctx.stroke();
            
            // 导弹本体
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(sx, sy, 3, 0, Math.PI*2);
            ctx.fill();
        } else {
            // 炮弹
            ctx.fillStyle = this.faction === FACTION.PLAYER ? '#ffff00' : '#ff8800';
            ctx.beginPath();
            ctx.arc(sx, sy, 4, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

class Effect {
    constructor(data) {
        Object.assign(this, {
            x: 0, y: 0, type: 'explosion', // explosion, hit, muzzle
            size: 30, color: '#ffff00',
            life: 0, maxLife: 30,
        }, data);
    }
    
    update(dt) {
        this.life += dt * 60;
        return this.life < this.maxLife;
    }
    
    render(ctx) {
        const sx = this.x - gameState.camera.x;
        const sy = this.y - gameState.camera.y;
        const p = 1 - this.life / this.maxLife;
        
        if (this.type === 'explosion') {
            const radius = this.size * p;
            const alpha = p * 0.8;
            const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
            gradient.addColorStop(0, this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba'));
            gradient.addColorStop(1, this.color.replace(')', ', 0)').replace('rgb', 'rgba'));
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(sx, sy, radius, 0, Math.PI*2);
            ctx.fill();
        } else if (this.type === 'hit') {
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, sy, 5 + this.life * 0.5, 0, Math.PI*2);
            ctx.stroke();
        } else if (this.type === 'muzzle') {
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(sx, sy, 8 - this.life * 0.2, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

// ========== 敌方AI ==========
function enemyAI(dt) {
    if (gameState.gameOver) return;
    
    gameState.enemy.attackTimer += dt;
    
    // 部署基地车
    if (!gameState.enemy.conyardDeployed) {
        const mcv = gameState.entities.find(e => e.faction === FACTION.ENEMY && e.type === 'MCV' && e.state !== 'deploy');
        if (mcv) {
            // 寻找合适位置
            const corners = [
                {x: MAP_TILES - 10, y: MAP_TILES - 10},
                {x: 10, y: MAP_TILES - 10},
                {x: MAP_TILES - 10, y: 10},
            ];
            for (const c of corners) {
                if (gameState.map[c.y][c.x] !== TERRAIN.WATER) {
                    mcv.targetX = c.x * TILE_SIZE;
                    mcv.targetY = c.y * TILE_SIZE;
                    mcv.state = 'move';
                    break;
                }
            }
            // 接近后展开
            if (dist(mcv.x, mcv.y, mcv.targetX, mcv.targetY) < 100) {
                mcv.state = 'deploy';
                mcv.buildTime = 180;
                gameState.enemy.conyardDeployed = true;
            }
        }
        return;
    }
    
    // 建设基地
    const enemyBuildings = gameState.buildings.filter(b => b.faction === FACTION.ENEMY && b.hp > 0);
    const hasPower = enemyBuildings.some(b => b.type === 'POWER');
    const hasRefinery = enemyBuildings.some(b => b.type === 'REFINERY');
    const hasBarracks = enemyBuildings.some(b => b.type === 'BARRACKS');
    const hasWarFactory = enemyBuildings.some(b => b.type === 'WARFACTORY');
    const hasAirfield = enemyBuildings.some(b => b.type === 'AIRFIELD');
    const hasDefense = enemyBuildings.some(b => b.type === 'DEFENSE_GUN' || b.type === 'DEFENSE_SAM');
    
    // 寻找可建造的建筑
    const conyard = enemyBuildings.find(b => b.type === 'CONYARD');
    if (conyard && !conyard.producing && conyard.buildProgress >= conyard.buildTime) {
        if (!hasPower && gameState.resources.money >= 300) {
            startEnemyBuild('POWER', conyard);
        } else if (!hasRefinery && gameState.resources.money >= 2000) {
            startEnemyBuild('REFINERY', conyard);
        } else if (!hasBarracks && gameState.resources.money >= 300) {
            startEnemyBuild('BARRACKS', conyard);
        } else if (!hasWarFactory && gameState.resources.money >= 2000) {
            startEnemyBuild('WARFACTORY', conyard);
        } else if (hasPower && !hasAirfield && gameState.resources.money >= 1500) {
            startEnemyBuild('AIRFIELD', conyard);
        } else if (!hasDefense && gameState.resources.money >= 400) {
            startEnemyBuild('DEFENSE_GUN', conyard);
        } else if (hasPower && !enemyBuildings.some(b => b.type === 'DEFENSE_SAM') && gameState.resources.money >= 500) {
            startEnemyBuild('DEFENSE_SAM', conyard);
        }
    }
    
    // 精炼厂生产矿车
    const refineries = enemyBuildings.filter(b => b.type === 'REFINERY' && !b.producing);
    for (const r of refineries) {
        if (gameState.resources.money >= 1400 && gameState.entities.filter(e => e.faction === FACTION.ENEMY && e.type === 'HARVESTER').length < 3) {
            r.producing = 'HARVESTER';
        }
    }
    
    // 兵营生产步兵
    const barracks = enemyBuildings.filter(b => b.type === 'BARRACKS' && !b.producing);
    for (const b of barracks) {
        const types = ['INFANTRY', 'ROCKET_INF', 'ENGINEER'];
        const t = types[randInt(0, types.length-1)];
        if (gameState.resources.money >= UNIT_TYPES[t].cost) {
            b.producing = t;
        }
    }
    
    // 战车工厂生产坦克
    const warfacts = enemyBuildings.filter(b => b.type === 'WARFACTORY' && !b.producing);
    for (const w of warfacts) {
        const types = ['TANK', 'LIGHT_TANK', 'V2', 'APC'];
        const t = types[randInt(0, types.length-1)];
        if (gameState.resources.money >= UNIT_TYPES[t].cost) {
            w.producing = t;
        }
    }
    
    // 机场生产米格
    const airfields = enemyBuildings.filter(b => b.type === 'AIRFIELD' && !b.producing);
    for (const a of airfields) {
        if (gameState.resources.money >= 1200) {
            a.producing = 'MIG';
        }
    }
    
    // 进攻逻辑
    if (gameState.enemy.attackTimer > 30) {
        gameState.enemy.attackTimer = 0;
        
        const attackUnits = gameState.entities.filter(e => 
            e.faction === FACTION.ENEMY && e.hp > 0 && 
            (e.state === 'idle' || e.state === 'guard') &&
            e.type !== 'HARVESTER' && e.type !== 'MCV' && e.type !== 'ENGINEER'
        );
        
        if (attackUnits.length > 5) {
            // 寻找玩家建筑
            const playerBuildings = gameState.buildings.filter(b => b.faction === FACTION.PLAYER && b.hp > 0);
            if (playerBuildings.length > 0) {
                const target = playerBuildings[randInt(0, playerBuildings.length-1)];
                for (const u of attackUnits.slice(0, Math.min(8, attackUnits.length))) {
                    u.state = 'attack';
                    u.target = target;
                }
            }
        }
    }
    
    // 矿车采集
    const harvesters = gameState.entities.filter(e => e.faction === FACTION.ENEMY && e.type === 'HARVESTER' && e.state === 'idle');
    for (const h of harvesters) {
        h.state = 'harvest';
    }
}

function startEnemyBuild(type, conyard) {
    const def = BUILDING_TYPES[type];
    if (!def || gameState.resources.money < def.cost) return;
    
    gameState.resources.money -= def.cost;
    
    // 在基地车附近寻找位置
    let placed = false;
    for (let r = conyard.size + 1; r < conyard.size + 5 && !placed; r++) {
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
            const tx = Math.floor((conyard.x + Math.cos(a) * r * TILE_SIZE) / TILE_SIZE);
            const ty = Math.floor((conyard.y + Math.sin(a) * r * TILE_SIZE) / TILE_SIZE);
            if (canPlaceBuilding(tx, ty, def.size)) {
                const building = new Building({
                    type, x: tx * TILE_SIZE, y: ty * TILE_SIZE,
                    faction: FACTION.ENEMY, buildTime: 120,
                });
                gameState.buildings.push(building);
                placed = true;
                break;
            }
        }
    }
}

function canPlaceBuilding(tx, ty, size) {
    if (tx < 0 || ty < 0 || tx + size > MAP_TILES || ty + size > MAP_TILES) return false;
    for (let y = ty; y < ty + size; y++) {
        for (let x = tx; x < tx + size; x++) {
            if (gameState.map[y][x] === TERRAIN.WATER) return false;
            // 检查是否有其他建筑
            for (const b of gameState.buildings) {
                const bx = Math.floor(b.x / TILE_SIZE);
                const by = Math.floor(b.y / TILE_SIZE);
                if (x >= bx && x < bx + b.size && y >= by && y < by + b.size) return false;
            }
        }
    }
    return true;
}

// ========== 电力系统 ==========
function updatePower() {
    let provided = 0, consumed = 0;
    for (const b of gameState.buildings) {
        if (b.hp > 0 && b.buildProgress >= b.buildTime) {
            if (b.faction === FACTION.PLAYER) {
                provided += b.powerProvided;
                consumed += b.powerConsumed;
            }
        }
    }
    gameState.resources.powerMax = provided;
    gameState.resources.power = provided - consumed;
}

// ========== 消息系统 ==========
function addMessage(text, type = '') {
    gameState.messages.unshift({ text, type, time: Date.now() });
    if (gameState.messages.length > 50) gameState.messages.pop();
    renderMessages();
}

function renderMessages() {
    const log = document.getElementById('message-log');
    log.innerHTML = gameState.messages.slice(0, 20).map(m => 
        `<div class="msg ${m.type}">[${new Date(m.time).toLocaleTimeString()}] ${m.text}</div>`
    ).join('');
}

// ========== UI 渲染 ==========
function renderBuildButtons() {
    const container = document.getElementById('build-buttons');
    const playerBuildings = gameState.buildings.filter(b => b.faction === FACTION.PLAYER && b.hp > 0 && b.buildProgress >= b.buildTime);
    const hasConyard = playerBuildings.some(b => b.type === 'CONYARD');
    const hasPower = playerBuildings.some(b => b.type === 'POWER');
    const hasRefinery = playerBuildings.some(b => b.type === 'REFINERY');
    const hasBarracks = playerBuildings.some(b => b.type === 'BARRACKS');
    const hasWarFactory = playerBuildings.some(b => b.type === 'WARFACTORY');
    const hasAirfield = playerBuildings.some(b => b.type === 'AIRFIELD');
    const hasTech = playerBuildings.some(b => b.type === 'TECH_CENTER');
    
    let html = '';
    
    // 建筑
    if (hasConyard) {
        html += '<div class="panel-title" style="margin-top:5px;font-size:11px;">建筑</div>';
        const buildings = [
            {type: 'POWER', req: true},
            {type: 'REFINERY', req: true},
            {type: 'BARRACKS', req: true},
            {type: 'WARFACTORY', req: true},
            {type: 'DEFENSE_GUN', req: true},
            {type: 'DEFENSE_SAM', req: hasPower},
            {type: 'AIRFIELD', req: hasPower},
            {type: 'TECH_CENTER', req: hasPower},
            {type: 'SILO', req: hasTech},
        ];
        for (const b of buildings) {
            const def = BUILDING_TYPES[b.type];
            const canAfford = gameState.resources.money >= def.cost;
            const canBuild = b.req && canAfford && gameState.resources.power + def.power >= 0;
            html += `<button class="build-btn ${gameState.buildMode === b.type ? 'selected' : ''}" 
                data-build="${b.type}" ${!canBuild ? 'disabled' : ''}>
                ${def.icon} ${def.name} <span style="color:#ffff00;">$${def.cost}</span>
                <div class="unit-info">${def.desc} | 电力: ${def.power >= 0 ? '+' : ''}${def.power}</div>
            </button>`;
        }
    }
    
    // 单位生产 - 根据拥有的建筑显示
    const producingBuildings = playerBuildings.filter(b => b.producing || ['BARRACKS', 'WARFACTORY', 'AIRFIELD', 'REFINERY'].includes(b.type));
    if (producingBuildings.length > 0) {
        html += '<div class="panel-title" style="margin-top:5px;font-size:11px;">单位</div>';
        const allUnits = [
            {type: 'HARVESTER', reqBuilding: 'REFINERY'},
            {type: 'INFANTRY', reqBuilding: 'BARRACKS'},
            {type: 'ROCKET_INF', reqBuilding: 'BARRACKS'},
            {type: 'ENGINEER', reqBuilding: 'BARRACKS'},
            {type: 'LIGHT_TANK', reqBuilding: 'WARFACTORY'},
            {type: 'TANK', reqBuilding: 'WARFACTORY'},
            {type: 'APC', reqBuilding: 'WARFACTORY'},
            {type: 'V2', reqBuilding: 'WARFACTORY'},
            {type: 'MIG', reqBuilding: 'AIRFIELD'},
        ];
        
        for (const u of allUnits) {
            const hasReq = playerBuildings.some(b => b.type === u.reqBuilding);
            if (!hasReq) continue;
            
            const udef = UNIT_TYPES[u.type];
            const canAfford = gameState.resources.money >= udef.cost;
            const hasSpace = gameState.resources.population < gameState.resources.populationMax;
            const canBuild = canAfford && hasSpace;
            
            html += `<button class="build-btn" 
                data-produce="${u.type}" ${!canBuild ? 'disabled' : ''}>
                ${udef.icon} ${udef.name} <span style="color:#ffff00;">$${udef.cost}</span>
                <div class="unit-info">HP:${udef.hp} 伤害:${udef.dmg} 射程:${udef.range} 速度:${udef.speed}</div>
            </button>`;
        }
    }
    
    container.innerHTML = html;
    
    // 绑定事件
    container.querySelectorAll('[data-build]').forEach(btn => {
        btn.onclick = () => {
            if (gameState.buildMode === btn.dataset.build) {
                gameState.buildMode = null;
                gameState.buildPreview = null;
            } else {
                gameState.buildMode = btn.dataset.build;
                gameState.buildPreview = { type: btn.dataset.build };
            }
            renderBuildButtons();
        };
    });
    
    container.querySelectorAll('[data-produce]').forEach(btn => {
        btn.onclick = () => {
            produceUnit(btn.dataset.produce);
        };
    });
}

function produceUnit(type) {
    const udef = UNIT_TYPES[type];
    if (gameState.resources.money < udef.cost) return;
    if (gameState.resources.population >= gameState.resources.populationMax) {
        addMessage('人口上限已满！', 'warning');
        return;
    }
    
    // 找到对应建筑
    const building = gameState.buildings.find(b => 
        b.faction === FACTION.PLAYER && b.hp > 0 && b.buildProgress >= b.buildTime &&
        !b.producing && BUILDING_TYPES[b.type].provides.includes(type)
    );
    
    if (building) {
        gameState.resources.money -= udef.cost;
        building.producing = type;
        addMessage(`开始生产 ${udef.name}`, 'success');
        renderBuildButtons();
        updateResourcesUI();
    }
}

function updateResourcesUI() {
    document.getElementById('money').textContent = Math.floor(gameState.resources.money);
    document.getElementById('power').textContent = `${gameState.resources.power}/${gameState.resources.powerMax}`;
    document.getElementById('population').textContent = `${gameState.resources.population}/${gameState.resources.populationMax}`;
    document.getElementById('unit-count').textContent = gameState.entities.filter(e => e.faction === FACTION.PLAYER && e.hp > 0).length;
}

function updateSelectionInfo() {
    const info = document.getElementById('selection-info');
    const selected = gameState.selectedEntities.filter(e => e.hp > 0);
    
    if (selected.length === 0) {
        info.innerHTML = '未选中单位';
        return;
    }
    
    if (selected.length === 1) {
        const u = selected[0];
        if (u.type === 'building') {
            const def = BUILDING_TYPES[u.type];
            info.innerHTML = `<strong>${def.name}</strong><br>HP: ${u.hp}/${u.maxHp}<br>电力: ${u.powerProvided - u.powerConsumed >= 0 ? '+' : ''}${u.powerProvided - u.powerConsume}`;
            if (u.producing) {
                const udef = UNIT_TYPES[u.producing];
                info.innerHTML += `<br>生产: ${udef.name} (${Math.floor(u.produceProgress/udef.buildTime*100)}%)`;
            }
        } else {
            const udef = UNIT_TYPES[u.type] || {name: u.type, hp: u.maxHp, dmg: u.dmg, range: u.range, speed: u.speed};
            info.innerHTML = `<strong>${udef.name}</strong><br>HP: ${u.hp}/${u.maxHp}<br>状态: ${u.state}`;
            if (u.carryAmount > 0) info.innerHTML += `<br>载重: ${Math.floor(u.carryAmount)}`;
        }
    } else {
        const types = {};
        for (const u of selected) {
            const name = u.type === 'building' ? BUILDING_TYPES[u.type].name : (UNIT_TYPES[u.type]?.name || u.type);
            types[name] = (types[name] || 0) + 1;
        }
        info.innerHTML = `选中 ${selected.length} 个单位<br>` + Object.entries(types).map(([n,c])=>`${n} x${c}`).join('<br>');
    }
}

// ========== 输入处理 ==========
function setupInput() {
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('ui-overlay');
    
    // 鼠标移动
    overlay.addEventListener('mousemove', e => {
        gameState.mouse.x = e.clientX;
        gameState.mouse.y = e.clientY;
        gameState.mouse.worldX = e.clientX + gameState.camera.x;
        gameState.mouse.worldY = e.clientY + gameState.camera.y;
        
        // 建造预览
        if (gameState.buildMode) {
            const tx = Math.floor(gameState.mouse.worldX / TILE_SIZE);
            const ty = Math.floor(gameState.mouse.worldY / TILE_SIZE);
            const def = BUILDING_TYPES[gameState.buildMode];
            gameState.buildPreview = { tx, ty, valid: canPlaceBuilding(tx, ty, def.size) };
        }
    });
    
    // 鼠标按下
    overlay.addEventListener('mousedown', e => {
        if (e.target.tagName === 'BUTTON') return;
        gameState.mouse.down = true;
        gameState.mouse.dragStart = { x: e.clientX, y: e.clientY };
        
        if (e.button === 0) { // 左键
            if (gameState.buildMode) {
                placeBuilding();
            } else if (!gameState.keys.Shift) {
                // 开始框选
                gameState.selectionBoxStart = { x: e.clientX, y: e.clientY };
                document.getElementById('selection-box').style.display = 'block';
            }
        } else if (e.button === 2) { // 右键
            issueCommand();
        }
    });
    
    // 鼠标抬起
    overlay.addEventListener('mouseup', e => {
        gameState.mouse.down = false;
        if (gameState.selectionBoxStart) {
            // 完成框选
            const box = document.getElementById('selection-box');
            const x1 = Math.min(gameState.selectionBoxStart.x, e.clientX);
            const y1 = Math.min(gameState.selectionBoxStart.y, e.clientY);
            const x2 = Math.max(gameState.selectionBoxStart.x, e.clientX);
            const y2 = Math.max(gameState.selectionBoxStart.y, e.clientY);
            
            selectUnitsInBox(x1, y1, x2, y2);
            
            gameState.selectionBoxStart = null;
            box.style.display = 'none';
        }
    });
    
    // 右键菜单
    overlay.addEventListener('contextmenu', e => e.preventDefault());
    
    // 键盘
    window.addEventListener('keydown', e => {
        gameState.keys[e.key] = true;
        handleHotkeys(e.key);
    });
    
    window.addEventListener('keyup', e => {
        gameState.keys[e.key] = false;
    });
    
    // 滚轮缩放（暂不实现缩放）
    // 相机边缘滚动
    setInterval(() => {
        if (gameState.gameOver) return;
        const edge = 30;
        const speed = 20;
        if (gameState.mouse.x < edge) gameState.camera.targetX -= speed;
        if (gameState.mouse.x > VIEWPORT_W - edge) gameState.camera.targetX += speed;
        if (gameState.mouse.y < edge) gameState.camera.targetY -= speed;
        if (gameState.mouse.y > VIEWPORT_H - edge) gameState.camera.targetY += speed;
        
        gameState.camera.targetX = clamp(gameState.camera.targetX, 0, WORLD_SIZE - VIEWPORT_W);
        gameState.camera.targetY = clamp(gameState.camera.targetY, 0, WORLD_SIZE - VIEWPORT_H);
    }, 16);
}

function handleHotkeys(key) {
    const k = key.toLowerCase();
    switch(k) {
        case 'm': setAction('move'); break;
        case 'a': setAction('attack'); break;
        case 'g': setAction('guard'); break;
        case 's': setAction('stop'); break;
        case 'escape': 
            gameState.buildMode = null;
            gameState.buildPreview = null;
            renderBuildButtons();
            break;
        case 'delete': sellSelected(); break;
        case 'r': repairSelected(); break;
    }
}

function setAction(action) {
    gameState.currentAction = action;
    document.querySelectorAll('#bottom-bar .build-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('btn-' + action)?.classList.add('selected');
}

function issueCommand() {
    const selected = gameState.selectedEntities.filter(e => e.hp > 0 && e.faction === FACTION.PLAYER);
    if (selected.length === 0) return;
    
    const wx = gameState.mouse.worldX;
    const wy = gameState.mouse.worldY;
    const action = gameState.currentAction || 'move';
    
    // 检查是否点击了敌人
    let target = null;
    for (const e of gameState.entities) {
        if (e.faction !== FACTION.PLAYER && e.hp > 0) {
            const d = dist(e.x, e.y, wx, wy);
            if (d < e.renderSize + 10) { target = e; break; }
        }
    }
    for (const b of gameState.buildings) {
        if (b.faction !== FACTION.PLAYER && b.hp > 0) {
            const bx = b.x + b.size*TILE_SIZE/2;
            const by = b.y + b.size*TILE_SIZE/2;
            const d = dist(bx, by, wx, wy);
            if (d < b.size*TILE_SIZE/2 + 10) { target = b; break; }
        }
    }
    
    for (const u of selected) {
        if (u.type === 'building') continue;
        
        switch(action) {
            case 'move':
                u.state = 'move';
                u.targetX = wx; u.targetY = wy;
                u.target = null;
                break;
            case 'attack':
                if (target) {
                    u.state = 'attack';
                    u.target = target;
                } else {
                    u.state = 'attack';
                    u.targetX = wx; u.targetY = wy;
                    u.target = null; // 攻击地面
                }
                break;
            case 'guard':
                u.state = 'guard';
                u.target = null;
                break;
            case 'stop':
                u.state = 'idle';
                u.target = null;
                break;
        }
    }
}

function placeBuilding() {
    if (!gameState.buildPreview || !gameState.buildPreview.valid) return;
    
    const def = BUILDING_TYPES[gameState.buildMode];
    if (gameState.resources.money < def.cost) {
        addMessage('资金不足！', 'warning');
        return;
    }
    if (gameState.resources.power + def.power < 0) {
        addMessage('电力不足！', 'warning');
        return;
    }
    
    const {tx, ty} = gameState.buildPreview;
    gameState.resources.money -= def.cost;
    
    const building = new Building({
        type: gameState.buildMode,
        x: tx * TILE_SIZE,
        y: ty * TILE_SIZE,
        faction: FACTION.PLAYER,
        buildTime: 120,
    });
    
    // 如果是建筑场且还没展开
    if (gameState.buildMode === 'CONYARD' && !gameState.player.conyardDeployed) {
        building.buildTime = 0;
        building.buildProgress = 0;
        gameState.player.conyardDeployed = true;
    }
    
    gameState.buildings.push(building);
    addMessage(`${def.name} 开始建造`, 'success');
    
    gameState.buildMode = null;
    gameState.buildPreview = null;
    renderBuildButtons();
    updateResourcesUI();
}

function selectUnitsInBox(x1, y1, x2, y2) {
    // 清除旧选择
    gameState.selectedEntities.forEach(e => e.selectionRing = false);
    gameState.selectedEntities = [];
    
    // 框选
    for (const e of gameState.entities) {
        if (e.faction !== FACTION.PLAYER || e.hp <= 0) continue;
        const sx = e.x - gameState.camera.x;
        const sy = e.y - gameState.camera.y;
        if (sx >= x1 && sx <= x2 && sy >= y1 && sy <= y2) {
            e.selectionRing = true;
            gameState.selectedEntities.push(e);
        }
    }
    for (const b of gameState.buildings) {
        if (b.faction !== FACTION.PLAYER || b.hp <= 0) continue;
        const sx = b.x - gameState.camera.x;
        const sy = b.y - gameState.camera.y;
        const w = b.size * TILE_SIZE;
        const h = b.size * TILE_SIZE;
        if (sx + w >= x1 && sx <= x2 && sy + h >= y1 && sy <= y2) {
            b.selectionRing = true;
            gameState.selectedEntities.push(b);
        }
    }
    
    updateSelectionInfo();
}

function sellSelected() {
    for (const e of gameState.selectedEntities) {
        if (e.type === 'building' && e.faction === FACTION.PLAYER && e.hp > 0) {
            const def = BUILDING_TYPES[e.type];
            const refund = Math.floor(def.cost * 0.5 * (e.hp / e.maxHp));
            gameState.resources.money += refund;
            e.hp = 0;
            e.onDeath(null);
            addMessage(`出售 ${def.name} +$${refund}`, 'success');
        }
    }
    gameState.selectedEntities = [];
    updateResourcesUI();
    renderBuildButtons();
}

function repairSelected() {
    // 简单实现：花钱修理选中建筑
    for (const e of gameState.selectedEntities) {
        if (e.type === 'building' && e.faction === FACTION.PLAYER && e.hp > 0 && e.hp < e.maxHp) {
            const cost = Math.floor((e.maxHp - e.hp) * 0.5);
            if (gameState.resources.money >= cost) {
                gameState.resources.money -= cost;
                e.hp = e.maxHp;
                addMessage(`修理完成 -$${cost}`, 'success');
            } else {
                addMessage('资金不足无法修理', 'warning');
            }
        }
    }
    updateResourcesUI();
}

// ========== 渲染 ==========
function render() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = VIEWPORT_W;
    canvas.height = VIEWPORT_H;
    
    // 平滑相机
    gameState.camera.x = lerp(gameState.camera.x, gameState.camera.targetX, 0.1);
    gameState.camera.y = lerp(gameState.camera.y, gameState.camera.targetY, 0.1);
    
    // 计算可见范围
    const startTx = Math.max(0, Math.floor(gameState.camera.x / TILE_SIZE) - 1);
    const endTx = Math.min(MAP_TILES, Math.ceil((gameState.camera.x + VIEWPORT_W) / TILE_SIZE) + 1);
    const startTy = Math.max(0, Math.floor(gameState.camera.y / TILE_SIZE) - 1);
    const endTy = Math.min(MAP_TILES, Math.ceil((gameState.camera.y + VIEWPORT_H) / TILE_SIZE) + 1);
    
    // 渲染地形
    for (let ty = startTy; ty < endTy; ty++) {
        for (let tx = startTx; tx < endTx; tx++) {
            const terrain = gameState.map[ty][tx];
            const colors = TERRAIN_COLORS[terrain];
            const sx = tx * TILE_SIZE - gameState.camera.x;
            const sy = ty * TILE_SIZE - gameState.camera.y;
            
            // 基础颜色
            const baseColor = colors[0];
            ctx.fillStyle = baseColor;
            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            
            // 伪随机纹理
            const seed = (tx * 73856093) ^ (ty * 19349663);
            const rand = ((seed * seed * 15731 + 789221) % 1376312589) / 1376312589;
            if (rand < 0.1) {
                ctx.fillStyle = colors[1];
                ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            } else if (rand < 0.15) {
                ctx.fillStyle = colors[2];
                ctx.fillRect(sx + rand * TILE_SIZE, sy + rand * TILE_SIZE, 4, 4);
            }
            
            // 矿石/宝石特效
            if (terrain === TERRAIN.ORE || terrain === TERRAIN.GEM) {
                ctx.fillStyle = terrain === TERRAIN.ORE ? '#aa8844' : '#44aacc';
                const cx = sx + TILE_SIZE/2, cy = sy + TILE_SIZE/2;
                for (let i = 0; i < 3; i++) {
                    const angle = (seed + i) * 2.3;
                    const r = 4 + (seed * 100 % 6);
                    ctx.beginPath();
                    ctx.arc(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, 3, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            
            // 桥梁
            if (terrain === TERRAIN.BRIDGE) {
                ctx.fillStyle = '#665544';
                ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = '#887766';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx, sy, TILE_SIZE, TILE_SIZE);
            }
        }
    }
    
    // 网格线（可选，性能考虑可关闭）
    // ctx.strokeStyle = 'rgba(0,255,0,0.03)';
    // ctx.lineWidth = 0.5;
    // for (let tx = startTx; tx <= endTx; tx++) {
    //     ctx.beginPath();
    //     ctx.moveTo(tx*TILE_SIZE - gameState.camera.x, -gameState.camera.y);
    //     ctx.lineTo(tx*TILE_SIZE - gameState.camera.x, WORLD_SIZE - gameState.camera.y);
    //     ctx.stroke();
    // }
    // for (let ty = startTy; ty <= endTy; ty++) {
    //     ctx.beginPath();
    //     ctx.moveTo(-gameState.camera.x, ty*TILE_SIZE - gameState.camera.y);
    //     ctx.lineTo(WORLD_SIZE - gameState.camera.x, ty*TILE_SIZE - gameState.camera.y);
    //     ctx.stroke();
    // }
    
    // 渲染建筑（先渲染，单位在上层）
    for (const b of gameState.buildings) {
        if (b.hp > 0) b.render(ctx);
    }
    
    // 渲染建造预览
    if (gameState.buildPreview && gameState.buildMode) {
        const def = BUILDING_TYPES[gameState.buildMode];
        const {tx, ty, valid} = gameState.buildPreview;
        const sx = tx * TILE_SIZE - gameState.camera.x;
        const sy = ty * TILE_SIZE - gameState.camera.y;
        const w = def.size * TILE_SIZE;
        const h = def.size * TILE_SIZE;
        
        ctx.fillStyle = valid ? 'rgba(0,255,0,0.3)' : 'rgba(255,0,0,0.3)';
        ctx.fillRect(sx, sy, w, h);
        ctx.strokeStyle = valid ? '#00ff00' : '#ff0000';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(sx, sy, w, h);
        ctx.setLineDash([]);
    }
    
    // 渲染单位
    for (const e of gameState.entities) {
        if (e.hp > 0) e.render(ctx);
    }
    
    // 渲染投射物
    for (const p of gameState.projectiles) {
        p.render(ctx);
    }
    
    // 渲染特效
    for (const fx of gameState.effects) {
        fx.render(ctx);
    }
    
    // 渲染框选框
    if (gameState.selectionBoxStart) {
        const box = document.getElementById('selection-box');
        const x1 = gameState.selectionBoxStart.x;
        const y1 = gameState.selectionBoxStart.y;
        const x2 = gameState.mouse.x;
        const y2 = gameState.mouse.y;
        box.style.left = Math.min(x1, x2) + 'px';
        box.style.top = Math.min(y1, y2) + 'px';
        box.style.width = Math.abs(x2 - x1) + 'px';
        box.style.height = Math.abs(y2 - y1) + 'px';
    }
    
    // 渲染小地图
    renderMinimap();
}

function renderMinimap() {
    const canvas = document.getElementById('minimap');
    const ctx = canvas.getContext('2d');
    const scale = canvas.width / WORLD_SIZE;
    
    // 背景
    ctx.fillStyle = '#001100';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 地形简化渲染
    for (let ty = 0; ty < MAP_TILES; ty += 2) {
        for (let tx = 0; tx < MAP_TILES; tx += 2) {
            const terrain = gameState.map[ty][tx];
            let color = '#1a3a1a';
            if (terrain === TERRAIN.WATER) color = '#0a1a3a';
            else if (terrain === TERRAIN.ORE) color = '#4a3a1a';
            else if (terrain === TERRAIN.GEM) color = '#1a3a3a';
            else if (terrain === TERRAIN.DIRT) color = '#3d2a1a';
            ctx.fillStyle = color;
            ctx.fillRect(tx * TILE_SIZE * scale, ty * TILE_SIZE * scale, 2 * scale, 2 * scale);
        }
    }
    
    // 玩家单位
    ctx.fillStyle = '#00ff00';
    for (const e of gameState.entities) {
        if (e.faction === FACTION.PLAYER && e.hp > 0) {
            ctx.fillRect(e.x * scale, e.y * scale, 2, 2);
        }
    }
    
    // 敌方单位
    ctx.fillStyle = '#ff4444';
    for (const e of gameState.entities) {
        if (e.faction === FACTION.ENEMY && e.hp > 0) {
            ctx.fillRect(e.x * scale, e.y * scale, 2, 2);
        }
    }
    
    // 建筑
    for (const b of gameState.buildings) {
        if (b.hp > 0) {
            ctx.fillStyle = b.faction === FACTION.PLAYER ? '#00aa00' : '#aa0000';
            ctx.fillRect(b.x * scale, b.y * scale, b.size * TILE_SIZE * scale, b.size * TILE_SIZE * scale);
        }
    }
    
    // 相机视野框
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 1;
    ctx.strokeRect(
        gameState.camera.x * scale,
        gameState.camera.y * scale,
        VIEWPORT_W * scale,
        VIEWPORT_H * scale
    );
}

// ========== 游戏循环 ==========
let lastTime = 0;
function gameLoop(time) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    
    if (!gameState.gameOver) {
        update(dt);
    }
    render();
    
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    gameState.tick++;
    
    // 更新实体
    gameState.entities = gameState.entities.filter(e => e.update(dt));
    
    // 更新建筑
    gameState.buildings = gameState.buildings.filter(b => b.update(dt));
    
    // 更新投射物
    gameState.projectiles = gameState.projectiles.filter(p => p.update(dt));
    
    // 更新特效
    gameState.effects = gameState.effects.filter(fx => fx.update(dt));
    
    // 敌方AI
    if (gameState.tick % 60 === 0) enemyAI(dt);
    
    // 资源增长（精炼厂被动收入）
    if (gameState.tick % 120 === 0) {
        const refineries = gameState.buildings.filter(b => b.faction === FACTION.PLAYER && b.type === 'REFINERY' && b.hp > 0);
        for (const r of refineries) {
            gameState.resources.money += 20;
        }
        updateResourcesUI();
    }
    
    // 检查胜利条件
    checkVictory();
}

function checkVictory() {
    const playerConyard = gameState.buildings.find(b => b.faction === FACTION.PLAYER && b.type === 'CONYARD' && b.hp > 0);
    const enemyConyard = gameState.buildings.find(b => b.faction === FACTION.ENEMY && b.type === 'CONYARD' && b.hp > 0);
    
    if (!playerConyard && gameState.player.conyardDeployed) {
        gameState.gameOver = true;
        gameState.victory = false;
    }
    if (!enemyConyard && gameState.enemy.conyardDeployed) {
        gameState.gameOver = true;
        gameState.victory = true;
    }
    
    if (gameState.gameOver) {
        document.getElementById(gameState.victory ? 'victory-screen' : 'defeat-screen').style.display = 'flex';
    }
}

// ========== 初始化 ==========
function initGame() {
    // 生成地图
    gameState.map = generateMap();
    
    // 重置状态
    gameState.entities = [];
    gameState.buildings = [];
    gameState.projectiles = [];
    gameState.effects = [];
    gameState.selectedEntities = [];
    gameState.camera = { x: 0, y: 0, targetX: 0, targetY: 0 };
    gameState.resources = { money: 5000, power: 0, powerMax: 0, population: 0, populationMax: 50 };
    gameState.player = { faction: FACTION.PLAYER, conyardDeployed: false, techLevel: 1 };
    gameState.enemy = { faction: FACTION.ENEMY, conyardDeployed: false, techLevel: 1, attackTimer: 0 };
    gameState.gameOver = false;
    gameState.victory = false;
    gameState.buildMode = null;
    gameState.buildPreview = null;
    gameState.messages = [];
    gameState.tick = 0;
    
    // 隐藏结算界面
    document.getElementById('victory-screen').style.display = 'none';
    document.getElementById('defeat-screen').style.display = 'none';
    
    // 玩家起始位置 - 左上角区域
    const playerStart = findClearArea(5, 15, 5, 15);
    if (playerStart) {
        gameState.camera.targetX = playerStart.x * TILE_SIZE - VIEWPORT_W / 2;
        gameState.camera.targetY = playerStart.y * TILE_SIZE - VIEWPORT_H / 2;
        gameState.camera.x = gameState.camera.targetX;
        gameState.camera.y = gameState.camera.targetY;
        
        // 给玩家一个MCV
        const mcv = new Entity({
            ...UNIT_TYPES.MCV,
            x: playerStart.x * TILE_SIZE, y: playerStart.y * TILE_SIZE,
            targetX: playerStart.x * TILE_SIZE, targetY: playerStart.y * TILE_SIZE,
            faction: FACTION.PLAYER,
            color: '#00ff00',
        });
        gameState.entities.push(mcv);
    }
    
    // 敌方起始位置 - 右下角区域
    const enemyStart = findClearArea(MAP_TILES - 15, MAP_TILES - 5, MAP_TILES - 15, MAP_TILES - 5);
    if (enemyStart) {
        const mcv = new Entity({
            ...UNIT_TYPES.MCV,
            x: enemyStart.x * TILE_SIZE, y: enemyStart.y * TILE_SIZE,
            targetX: enemyStart.x * TILE_SIZE, targetY: enemyStart.y * TILE_SIZE,
            faction: FACTION.ENEMY,
            color: '#ff4444',
        });
        gameState.entities.push(mcv);
        
        // 给敌方一些初始资金
        gameState.resources.money = 5000; // 共享资金池简化处理
    }
    
    // 设置默认动作
    gameState.currentAction = 'move';
    setAction('move');
    
    renderBuildButtons();
    updateResourcesUI();
    addMessage('指挥官，战场已就绪。展开基地车开始建立基地。', 'success');
    addMessage('左键选择单位，右键下达命令。按 M/A/G/S 切换移动/攻击/戒备/停止。', '');
}

function findClearArea(minX, maxX, minY, maxY) {
    for (let attempts = 0; attempts < 100; attempts++) {
        const tx = randInt(minX, maxX);
        const ty = randInt(minY, maxY);
        if (gameState.map[ty][tx] !== TERRAIN.WATER) {
            // 检查周围3x3
            let clear = true;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (gameState.map[ty+dy][tx+dx] === TERRAIN.WATER) clear = false;
                }
            }
            if (clear) return {x: tx, y: ty};
        }
    }
    return {x: minX, y: minY};
}

function restartGame() {
    initGame();
}

// ========== 启动 ==========
function startLoading() {
    let progress = 0;
    const fill = document.getElementById('load-fill');
    const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            setTimeout(() => {
                document.getElementById('load-screen').style.display = 'none';
                initGame();
                requestAnimationFrame(gameLoop);
            }, 300);
        }
        fill.style.width = progress + '%';
    }, 100);
}

// 窗口大小变化
window.addEventListener('resize', () => {
    VIEWPORT_W = window.innerWidth;
    VIEWPORT_H = window.innerHeight;
});

// 防止右键菜单
document.addEventListener('contextmenu', e => e.preventDefault());

// 启动
setupInput();
startLoading();
</script>
