<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a101c">
<title>Games Web · 游戏大厅</title>
<style>
:root{
  --bg:#0a101c;
  --bg2:#0e1626;
  --surface:#131c2e;
  --surface2:#182338;
  --line:rgba(140,180,255,.10);
  --text:#e9eef7;
  --dim:#8fa3bd;
  --accent:#00a9f4;
  --accent2:#00d4ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 500px at 50% -180px, rgba(0,169,244,.16), transparent 65%),
    radial-gradient(800px 400px at 100% 100%, rgba(64,120,255,.08), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2) 40%,#080d17 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
.top{
  position:sticky;top:0;z-index:10;
  background:rgba(10,16,28,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:14px 18px 12px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--accent),#005e86);
  border-radius:0;box-shadow:0 4px 16px rgba(0,169,244,.35);
}
.logo svg{width:26px;height:26px;display:block}
.titles h1{font-size:17px;font-weight:700;letter-spacing:.3px;line-height:1.2}
.titles p{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.5px}

.searchwrap{
  display:flex;align-items:center;gap:10px;
  margin:14px auto 0;max-width:560px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:0 14px;height:46px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.searchwrap:focus-within{border-color:rgba(0,169,244,.55);box-shadow:0 0 0 3px rgba(0,169,244,.18)}
.searchwrap svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round}
#q{
  flex:1;background:transparent;border:0;outline:0;color:var(--text);
  font-size:15px;font-family:inherit;min-width:0;
}
#q::placeholder{color:var(--dim)}
#q::-webkit-search-cancel-button{display:none}
.clear{
  flex:0 0 auto;border:0;background:transparent;color:var(--dim);cursor:pointer;
  font-size:18px;line-height:1;width:28px;height:28px;border-radius:14px;
  display:none;align-items:center;justify-content:center;
}
.clear:hover{color:var(--text);background:rgba(255,255,255,.08)}
.clear.show{display:flex}

.stats{
  max-width:760px;margin:14px auto 0;padding:0 18px;
  display:flex;align-items:baseline;gap:8px;
  font-size:12px;color:var(--dim);letter-spacing:.3px;
}
.stats b{color:var(--accent2);font-size:15px;font-variant-numeric:tabular-nums}
.stats .sep{color:rgba(140,180,255,.25)}

main{max-width:860px;margin:0 auto;padding:20px 18px 60px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:16px 12px;justify-items:center;
}
.card{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.box{
  width:108px;height:108px;
  background:linear-gradient(170deg,var(--surface2),var(--surface));
  border:1px solid var(--line);
  border-radius:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  will-change:transform;
}
.box img{width:86px;height:86px;display:block}
.card:hover .box,.card:focus-visible .box{
  transform:translateY(-3px);
  border-color:rgba(0,169,244,.5);
  box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 3px rgba(0,169,244,.15);
}
.card:active .box{transform:translateY(-1px) scale(.98)}
.name{
  width:108px;font-size:11.5px;color:var(--text);line-height:1.3;
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.empty{
  text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;
}
.empty b{display:block;font-size:26px;color:var(--accent);margin-bottom:10px}
footer{
  text-align:center;color:rgba(143,163,189,.5);font-size:11px;
  padding:0 18px 28px;letter-spacing:.5px;
}
@media (max-width:430px){
  .grid{grid-template-columns:repeat(2,1fr);gap:14px 10px}
  .box{width:108px;height:108px}
  .name{width:108px}
  main{padding:16px 14px 50px}
}
@media (min-width:1200px){
  .grid{grid-template-columns:repeat(6,minmax(118px,1fr))}
}
</style>
</head>

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var shown = document.getElementById('shown');
  var total = document.getElementById('total');
  var q = document.getElementById('q');
  var clear = document.getElementById('clear');

  total.textContent = GAMES.length;

  function render(){
    var t = q.value.trim().toLowerCase();
    var items = [];
    if (!t){
      items = GAMES;
    } else {
      for (var i=0;i<GAMES.length;i++){
        if (GAMES[i].n.toLowerCase().indexOf(t) !== -1) items.push(GAMES[i]);
      }
    }
    grid.innerHTML = '';
    for (var i=0;i<items.length;i++){
      var g = items[i];
      var a = document.createElement('a');
      a.className = 'card';
      a.href = '../games-web/' + g.f;
      a.setAttribute('aria-label', g.n);
      var box = document.createElement('div');
      box.className = 'box';
      var img = document.createElement('img');
      img.width = 86; img.height = 86;
      img.loading = 'lazy';
      img.alt = g.n;
      img.src = 'icons/' + g.i;
      box.appendChild(img);
      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = g.n;
      nm.title = g.n;
      a.appendChild(box);
      a.appendChild(nm);
      grid.appendChild(a);
    }
    empty.hidden = items.length > 0;
    shown.textContent = items.length;
    clear.classList.toggle('show', t.length > 0);
  }

  q.addEventListener('input', render);
  clear.addEventListener('click', function(){ q.value=''; render(); q.focus(); });
  render();
})();
