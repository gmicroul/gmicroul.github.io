        /* ==========================================
           CSS Variables - SailfishOS Color System
           ========================================== */
        :root {
            /* Ocean palette (primary - 60%+) */
            --deep-teal: #0E7C8C;
            --teal: #19A7CE;
            --sky-blue: #4FC3F7;
            --sea-green: #2EBD85;
            --deep-green: #15966B;
            
            /* Warm accents (minimal) */
            --coral: #F0544F;
            --orange: #F59B23;
            --amber: #FFD34E;
            --purple-pink: #C56CD6;
            
            /* Foreground */
            --fg-white: #FFFFFF;
            --fg-offwhite: #F5F7F7;
            
            /* Accent */
            --accent-magenta: #B03A6B;
            
            /* Shadows */
            --shadow-deep: rgba(20, 40, 60, 0.2);
            --shadow-soft: rgba(20, 40, 60, 0.12);
            --shadow-long: rgba(20, 40, 60, 0.15);
            
            /* Layout */
            --card-size: 96px;
            --icon-size: 64px;
            --icon-stroke: 5px;
            --gap: 16px;
            --radius-squircle: 26%;
            --safe-zone: 82%;
            
            /* Gradients */
            --grad-main: linear-gradient(135deg, var(--deep-teal) 0%, var(--teal) 50%, var(--sky-blue) 100%);
            --grad-card-1: linear-gradient(135deg, #0E7C8C 0%, #19A7CE 100%);
            --grad-card-2: linear-gradient(135deg, #15966B 0%, #2EBD85 100%);
            --grad-card-3: linear-gradient(135deg, #19A7CE 0%, #4FC3F7 100%);
            --grad-card-4: linear-gradient(135deg, #0E7C8C 0%, #15966B 100%);
            --grad-card-5: linear-gradient(135deg, #2EBD85 0%, #19A7CE 100%);
            --grad-card-6: linear-gradient(135deg, #19A7CE 0%, #0E7C8C 100%);
        }

        /* ==========================================
           Reset & Base
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #0a1a2a 0%, #0d2338 50%, #0a1a2a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            color: var(--fg-white);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Subtle background pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(14, 124, 140, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(30, 189, 133, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(79, 195, 247, 0.04) 0%, transparent 30%);
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================
           SailfishOS Leaf Icon - Pure CSS
           ========================================== */
        .sailfish-icon {
            --size: var(--icon-size);
            --stroke: var(--icon-stroke);
            width: var(--size);
            height: var(--size);
            position: relative;
            transform-origin: center;
        }

        .sailfish-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Leaf shape: square with left-bottom and right-top right angles,
           quarter-circles from center forming the curved edges */
        .leaf-path {
            fill: none;
            stroke: var(--fg-white);
            stroke-width: var(--stroke);
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* Even-odd fill for the leaf shape (negative space cutout) */
        .leaf-shape {
            fill: var(--fg-white);
            fill-rule: evenodd;
        }

        /* ==========================================
           Card Grid
           ========================================== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: var(--gap);
            padding: var(--gap);
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .game-card {
            background: var(--grad-card-1);
            border-radius: calc(var(--card-size) * var(--radius-squircle));
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--fg-white);
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        box-shadow 0.25s ease,
                        border-radius 0.25s ease;
            box-shadow: 
                0 4px 20px var(--shadow-deep),
                0 2px 8px var(--shadow-soft),
                inset 0 1px 0 rgba(255,255,255,0.1);
            animation: cardEnter 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) backwards;
        }

        .game-card:nth-child(6n+1) { background: var(--grad-card-1); }
        .game-card:nth-child(6n+2) { background: var(--grad-card-2); }
        .game-card:nth-child(6n+3) { background: var(--grad-card-3); }
        .game-card:nth-child(6n+4) { background: var(--grad-card-4); }
        .game-card:nth-child(6n+5) { background: var(--grad-card-5); }
        .game-card:nth-child(6n+6) { background: var(--grad-card-6); }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .game-card:hover,
        .game-card:focus-visible {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 12px 40px var(--shadow-deep),
                0 6px 16px var(--shadow-soft),
                0 0 0 2px rgba(255,255,255,0.15),
                inset 0 1px 0 rgba(255,255,255,0.2);
            border-radius: calc(var(--card-size) * 0.3);
            z-index: 10;
        }

        .game-card:active {
            transform: translateY(-2px) scale(0.98);
            transition-duration: 0.1s;
        }

        .game-card.hidden {
            display: none !important;
        }

        /* Icon container */
        .card-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            position: relative;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
        }

        /* Rotate every even card's icon 90deg as per spec */
        .game-card:nth-child(2n) .card-icon .sailfish-icon {
            transform: rotate(90deg);
        }

        /* Title */
        .card-title {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.02em;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* Subtle shine overlay on cards */
        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.1) 0%, 
                transparent 40%, 
                transparent 60%, 
                rgba(255,255,255,0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            border-radius: inherit;
        }

        .game-card:hover::before {
            opacity: 1;
        }

        /* ==========================================
           Header & Search
           ========================================== */
        .header {
            padding: 24px var(--gap) 16px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--fg-white) 0%, var(--sky-blue) 50%, var(--sea-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            font-weight: 400;
        }

        .search-wrapper {
            max-width: 480px;
            margin: 20px auto 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            height: 48px;
            padding: 0 52px 0 20px;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            color: var(--fg-white);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(20px);
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-input:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
        }

        .search-input:focus {
            border-color: var(--sky-blue);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 4px rgba(79, 195, 247, 0.15);
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: var(--fg-white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .search-clear.visible {
            opacity: 1;
            visibility: visible;
        }

        .search-clear:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-50%) scale(1.1);
        }

        .search-clear svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        .stats {
            margin-top: 16px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
        }

        .stats strong {
            color: var(--sky-blue);
        }

        /* ==========================================
           Empty State
           ========================================== */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-state.visible {
            display: flex;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            color: rgba(255,255,255,0.6);
            font-size: 15px;
        }

        /* ==========================================
           Footer
           ========================================== */
        .footer {
            padding: 24px var(--gap);
            text-align: center;
            color: rgba(255,255,255,0.35);
            font-size: 12px;
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: var(--sky-blue);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ==========================================
           Reduced Motion
           ========================================== */
        @media (prefers-reduced-motion: reduce) {
            .game-card,
            .search-input,
            .search-clear,
            .game-card::before {
                animation: none !important;
                transition: none !important;
            }
            .game-card:hover {
                transform: none;
            }
        }

        /* ==========================================
           Responsive Adjustments
           ========================================== */
        @media (max-width: 480px) {
            :root {
                --card-size: 88px;
                --icon-size: 56px;
                --icon-stroke: 4px;
                --gap: 12px;

            .header { padding: 16px 12px 12px; }
            .header h1 { font-size: 22px; }
            .search-input { height: 44px; font-size: 16px; }
            .card-title { font-size: 11px; }
        }

        @media (min-width: 768px) and (max-width: 1023px) {

        }

        @media (min-width: 1024px) {
            :root { --card-size: 112px; --icon-size: 72px; --icon-stroke: 6px; }
        }

        @media (min-width: 1400px) {
            :root { --card-size: 120px; --icon-size: 76px; }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --shadow-deep: rgba(0,0,0,0.5);
                --shadow-soft: rgba(0,0,0,0.3);
            }
            .game-card { border: 2px solid rgba(255,255,255,0.3); }
            .search-input { border-width: 3px; }
        }
    </style>

        // ==========================================
        // SailfishOS Leaf Icon SVG Generator
        // ==========================================
        function createLeafIcon(index) {
            const isEven = index % 2 === 1; // 0-based: odd indices = even cards
            const rotation = isEven ? 90 : 0;
            
            // Leaf shape: square with quarter circles from center
            // Using even-odd fill rule for the negative space cutout
            const size = 64;
            const half = size / 2;
            const radius = half; // radius = half of square = quarter circle from center
            
            // Path for the leaf shape (using fill-rule: evenodd)
            // The shape is a square with two quarter-circles cut out
            // Left-bottom and right-top are right angles
            // Quarter circles from center to left-top and right-bottom edges
            const pathData = `
                M 0 ${half}
                L 0 0
                L ${half} 0
                A ${radius} ${radius} 0 0 1 ${half} ${radius}
                L ${size} ${radius}
                L ${size} ${size}
                L ${half} ${size}
                A ${radius} ${radius} 0 0 1 ${half} ${half}
                L 0 ${half}
                Z
                M ${half} 0
                L ${size} 0
                L ${size} ${half}
                A ${radius} ${radius} 0 0 1 ${half} ${half}
                L ${half} ${size}
                L 0 ${size}
                L 0 ${half}
                A ${radius} ${radius} 0 0 1 ${half} ${half}
                Z
            `.trim();
            
            return `
                <svg viewBox="0 0 ${size} ${size}" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: rotate(${rotation}deg);">
                    <path class="leaf-shape" d="${pathData}" fill-rule="evenodd"/>
                </svg>
            `;
        }

        // ==========================================
        // Render Game Cards
        // ==========================================
        const grid = document.getElementById('gameGrid');
        const gameCountEl = document.getElementById('gameCount');
        const filteredCountEl = document.getElementById('filteredCount');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        let visibleCount = GAMES.length;

        function renderGames(filter = '') {
            const lowerFilter = filter.toLowerCase().trim();
            let html = '';
            visibleCount = 0;
            
            GAMES.forEach((game, index) => {
                const matches = !lowerFilter || game.title.toLowerCase().includes(lowerFilter);
                if (matches) {
                    visibleCount++;
                    const delay = Math.min(visibleCount * 15, 300);
                    html += `
                        <a href="${game.url}" class="game-card" role="listitem" style="animation-delay: ${delay}ms;" target="_blank" rel="noopener">
                            <div class="card-icon">
                                ${createLeafIcon(index)}
                            </div>
                            <span class="card-title">${escapeHtml(game.title)}</span>
                        </a>
                    `;
                }
            });
            
            grid.innerHTML = html;
            updateStats();
            emptyState.classList.toggle('visible', visibleCount === 0 && lowerFilter);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats() {
            gameCountEl.textContent = GAMES.length;
            const filter = searchInput.value.trim();
            if (filter) {
                filteredCountEl.textContent = `筛选: ${visibleCount} 款`;
            } else {
                filteredCountEl.textContent = '';
            }
        }

        // ==========================================
        // Search Functionality
        // ==========================================
        let searchDebounce = null;
        
        searchInput.addEventListener('input', (e) => {
            const value = e.target.value;
            searchClear.classList.toggle('visible', value.length > 0);
            
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                renderGames(value);
            }, 80);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            renderGames('');
            searchInput.focus();
        });

        // Keyboard: Escape to clear
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchClear.classList.remove('visible');
                renderGames('');
                searchInput.blur();
            }
        });

        // ==========================================
        // Initial Render
        // ==========================================
        renderGames('');

        // ==========================================
        // Performance: IntersectionObserver for animation
        // ==========================================
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animationPlayState = 'running';
                        observer.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '50px' });

            // Re-observe after render
            const observeCards = () => {
                document.querySelectorAll('.game-card').forEach(card => {
                    card.style.animationPlayState = 'paused';
                    observer.observe(card);
                });
            };

            // Use MutationObserver to detect new cards
            const mutObserver = new MutationObserver(() => {
                observeCards();
            });
            mutObserver.observe(grid, { childList: true });
        }
    </script>
