<style>
  :root {
    --bg0: #0a1622;
    --bg1: #0f2233;
    --card: rgba(255, 255, 255, 0.05);
    --card-hover: rgba(255, 255, 255, 0.10);
    --border: rgba(255, 255, 255, 0.08);
    --text: #eaf4f6;
    --muted: #8fb2bd;
    --teal: #19A7CE;
    --sky: #4FC3F7;
    --green: #2EBD85;
    --shadow: rgba(20, 40, 60, 0.35);
    --icon-size: 84px;
    --icon-size-sm: 64px;
    --card-radius: 20px;
    --card-radius-sm: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(79, 195, 247, 0.16), transparent 60%),
      radial-gradient(800px 480px at 95% 0%, rgba(46, 189, 133, 0.12), transparent 60%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #0b1b29);
    background-attachment: fixed;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

  header.top { text-align: center; padding: 22px 0 8px; }
  .logo { width: var(--icon-size); height: var(--icon-size); margin: 0 auto 12px; filter: drop-shadow(0 10px 22px var(--shadow)); }
  .logo svg { width: 100%; height: 100%; display: block; }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--sky), var(--teal) 55%, var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .toolbar {
    position: sticky; top: 12px; z-index: 10;
    margin: 22px auto 8px;
    max-width: 640px;
  }
  .search {
    display: flex; align-items: center; gap: 10px;
    background: rgba(10, 25, 38, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 18px;
    box-shadow: 0 12px 30px var(--shadow);
  }
  .search svg { flex: none; width: 18px; height: 18px; opacity: 0.7; }
  .search input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 1rem;
  }
  .search input::placeholder { color: var(--muted); }
  .count { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 12px 0 22px; }
  .count b { color: var(--sky); font-weight: 700; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 18px 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    text-decoration: none; color: var(--text);
    transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    animation: pop 0.35s ease both;
  }
  .card:hover {
    transform: translateY(-4px);
    background: var(--card-hover);
    box-shadow: 0 14px 30px var(--shadow);
  }
  .card:active { transform: translateY(-1px) scale(0.98); }
  .icon { width: var(--icon-size); height: var(--icon-size); filter: drop-shadow(0 8px 16px var(--shadow)); }
  .icon svg { width: 100%; height: 100%; display: block; }
  .name {
    font-size: 0.86rem; font-weight: 600; text-align: center;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    line-height: 1.3;
    word-break: break-word;
  }
  .empty { display: none; text-align: center; color: var(--muted); padding: 60px 0; font-size: 1rem; }
  .empty.show { display: block; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 48px; opacity: 0.7; }

  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    .wrap { padding: 20px 14px 48px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
    .card { padding: 14px 8px 12px; border-radius: var(--card-radius-sm); }
    .icon { width: var(--icon-size-sm); height: var(--icon-size-sm); }
    .name { font-size: 0.78rem; }
    .toolbar { top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; transition: none; }
  }
</style>

  { name: "squircle2", path: "M14 90 L14 54 A36 36 0 0 1 86 54 L86 90 Q86 92 84 92 L16 92 Q14 92 14 90 Z" },
  // 有机流线形
  { name: "organic", path: "M20 80 C20 42 42 20 80 20 C80 58 58 80 20 80 Z" },
  { name: "organic2", path: "M50 10 A40 40 0 1 0 50 90 A40 40 0 1 0 50 10 Z" },
];

// SailfishOS 配色：主色系（海洋感 60%+）+ 功能强调暖色
const GRADIENTS = [
  // 海洋主色系
  { start: "#0E7C8C", end: "#15966B" },  // 深青 → 深绿
  { start: "#19A7CE", end: "#0E7C8C" },  // 青 → 深青
  { start: "#4FC3F7", end: "#19A7CE" },  // 天蓝 → 青
  { start: "#2EBD85", end: "#15966B" },  // 海绿 → 深绿
  { start: "#13A5BA", end: "#09535E" },  // 蓝绿 → 深青
  { start: "#34C0E6", end: "#1382A1" },  // 浅蓝 → 中蓝
  { start: "#80D4F9", end: "#1EB2F5" },  // 淡蓝 → 亮蓝
  { start: "#4BD39E", end: "#249468" },  // 薄荷绿 → 中绿
  { start: "#1BC38B", end: "#0F694B" },  // 绿松石 → 深绿
  // 暖色强调
  { start: "#F0544F", end: "#C83B36" },  // 珊瑚红
  { start: "#F59B23", end: "#DB810A" },  // 橙
  { start: "#F7B154", end: "#DB810A" },  // 明黄橙
  { start: "#EE8AB9", end: "#E23083" },  // 粉红
  { start: "#D594E1", end: "#B544CB" },  // 紫粉
  { start: "#F4827E", end: "#EC2620" },  // 珊瑚橙
];

// 点缀色
const ACCENTS = [
  "#B03A6B", "#C56CD6", "#4FC3F7", "#F0544F", "#F59B23", "#FFD34E", "#2EBD85", "#FFFFFF"
];

// 为每个游戏生成确定性的随机种子
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getGameIcon(game, index) {
  const seed = hashString(game.file + game.title);
  const shape = SHAPES[seed % SHAPES.length];
  const gradient = GRADIENTS[Math.floor(seed / SHAPES.length) % GRADIENTS.length];
  const accent = ACCENTS[(seed * 7) % ACCENTS.length];
  const accent2 = ACCENTS[(seed * 13) % ACCENTS.length];
  const useAccent = seed % 3 === 0;
  const useSecondAccent = seed % 5 === 0;
  
  const gradId = `g${index}`;
  const maskId = `m${index}`;
  const clipId = `c${index}`;
  
  // 首字母作为备用符号
  const letter = game.title.charAt(0).toUpperCase();
  
  // 交替使用三大母形 - 符合 SailfishOS 规范
  let maskPath = shape.path;
  let clipPath = shape.path;
  
  // 部分图标添加文字作为负形
  const useText = seed % 4 === 0;
  
  let svg = `
    <svg viewBox="0 0 100 100" role="img" aria-hidden="true">
      <defs>
        <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${gradient.start}"/>
          <stop offset="100%" stop-color="${gradient.end}"/>
        </linearGradient>
        <mask id="${maskId}" maskUnits="userSpaceOnUse">
          ${maskPath.replace('Z"', 'Z" fill="#fff"')}
          ${useText ? `<text x="50" y="53" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="46" font-weight="800" fill="#000">${letter}</text>` : ''}
        </mask>
        <clipPath id="${clipId}"><path d="${clipPath}"/></clipPath>
      </defs>
      <path d="${maskPath}" fill="url(#${gradId})" mask="url(#${maskId})"/>
  `;
  
  if (useAccent) {
    // 点缀圆点 - 左上光源位置
    svg += `<g clip-path="url(#${clipId})"><circle cx="74" cy="26" r="8" fill="${accent}"/>`;
    if (useSecondAccent) {
      svg += `<circle cx="26" cy="74" r="5" fill="${accent2}"/>`;
    }
    svg += `</g>`;
  }
  
  svg += `</svg>`;
  return svg;
}

// ============ 渲染与搜索 ============
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const totalEl = document.getElementById('total');
const shownEl = document.getElementById('shown');
const searchInput = document.getElementById('q');

totalEl.textContent = GAMES.length;

function renderGames(list) {
  grid.innerHTML = '';
  list.forEach((game, i) => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = `/games-web/${game.file}`;
    card.target = '_blank';
    card.rel = 'noopener';
    card.dataset.name = game.title.toLowerCase();
    card.style.animationDelay = `${Math.min(i * 0.015, 0.5)}s`;
    
    const iconHtml = getGameIcon(game, i);
    
    card.innerHTML = `
      <div class="icon">${iconHtml}</div>
      <div class="name" title="${game.title}">${game.title}</div>
    `;
    
    grid.appendChild(card);
  });
  
  shownEl.textContent = list.length;
  empty.classList.toggle('show', list.length === 0);
}

function filterGames(query) {
  const q = query.trim().toLowerCase();
  if (!q) return GAMES;
  return GAMES.filter(g => g.title.toLowerCase().includes(q));
}

searchInput.addEventListener('input', (e) => {
  const filtered = filterGames(e.target.value);
  renderGames(filtered);
});

// 初始渲染
renderGames(GAMES);
</script>
</body>
