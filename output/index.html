<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0f1a;
  --bg-elevated: #111827;
  --bg-card: #151d30;
  --fg: #e8ecf1;
  --fg-muted: #8b95a6;
  --accent: #19a7ce;
  --accent-dim: #0e7c8c;
  --accent-glow: #4fc3f7;
  --coral: #f0544f;
  --orange: #f59b23;
  --yellow: #ffd34e;
  --green: #2ebd85;
  --dark-green: #15966b;
  --purple-pink: #c56cd6;
  --purple-pink-2: #e85d9e;
  --card-border: rgba(25,167,206,0.15);
  --shadow: rgba(20,40,60,0.35);
  --shadow-strong: rgba(20,40,60,0.55);
  --focus-ring: rgba(25,167,206,0.6);
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f4f8;
    --bg-elevated: #ffffff;
    --bg-card: #f8fafc;
    --fg: #1e293b;
    --fg-muted: #64748b;
    --accent: #0e7c8c;
    --accent-dim: #0a5f6b;
    --accent-glow: #19a7ce;
    --card-border: rgba(14,124,140,0.18);
    --shadow: rgba(14,60,80,0.12);
    --shadow-strong: rgba(14,60,80,0.22);
    --focus-ring: rgba(14,124,140,0.5);
  }
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(25,167,206,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(46,189,133,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(197,108,214,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

header {
  position: relative;
  z-index: 10;
  padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
  border-bottom: 1px solid var(--card-border);
  background: linear-gradient(180deg, rgba(21,29,48,0.95) 0%, rgba(21,29,48,0.7) 100%);
  backdrop-filter: blur(12px);
}

.header-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2vw, 16px);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--fg);
}

.logo-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.logo-text {
  font-size: clamp(1.1rem, 2.5vw, 1.4rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 50%, var(--purple-pink) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stats {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.5vw, 16px);
  font-size: clamp(0.8rem, 1.5vw, 0.95rem);
  color: var(--fg-muted);
  white-space: nowrap;
}

.stats strong {
  color: var(--fg);
  font-weight: 600;
}

.search-wrapper {
  position: relative;
  width: 100%;
  max-width: 560px;
}

.search-input {
  width: 100%;
  padding: clamp(10px, 2vw, 12px) clamp(14px, 2.5vw, 18px);
  padding-left: clamp(44px, 6vw, 52px);
  font-size: clamp(0.9rem, 1.8vw, 1rem);
  color: var(--fg);
  background: var(--bg-elevated);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.search-input::placeholder {
  color: var(--fg-muted);
  opacity: 0.7;
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--focus-ring), 0 8px 24px var(--shadow);
  background: var(--bg-card);
}

.search-icon {
  position: absolute;
  left: clamp(14px, 2.5vw, 18px);
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--fg-muted);
  stroke-width: 2;
  pointer-events: none;
  transition: stroke 0.2s ease;
}

.search-input:focus + .search-icon {
  stroke: var(--accent);
}

.clear-btn {
  position: absolute;
  right: clamp(10px, 2vw, 14px);
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, background 0.15s ease;
}

.clear-btn.visible {
  opacity: 1;
  pointer-events: auto;
}

.clear-btn:hover {
  background: rgba(255,255,255,0.08);
}

.clear-btn svg {
  width: 18px;
  height: 18px;
  stroke: var(--fg-muted);
  stroke-width: 2.5;
}

main {
  flex: 1;
  position: relative;
  z-index: 5;
  padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
}

.games-grid {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 20vw, 180px), 1fr));
  gap: clamp(12px, 2vw, 16px);
}

.game-card {
  position: relative;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  overflow: hidden;
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
              box-shadow 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
              border-color 0.22s ease;
  cursor: pointer;
}

.game-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25,167,206,0.06) 0%, rgba(46,189,133,0.04) 50%, rgba(197,108,214,0.05) 100%);
  opacity: 0;
  transition: opacity 0.22s ease;
  pointer-events: none;
  z-index: 0;
}

.game-card:hover {
  transform: translateY(-6px) scale(1.015);
  box-shadow: 0 20px 48px var(--shadow-strong), 0 8px 16px var(--shadow);
  border-color: rgba(25,167,206,0.35);
  z-index: 10;
}

.game-card:hover::before {
  opacity: 1;
}

.game-card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--focus-ring), 0 12px 32px var(--shadow-strong);
}

.card-icon {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--icon-bg-start) 0%, var(--icon-bg-end) 100%);
  overflow: hidden;
}

.card-icon::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 25% 25%, rgba(255,255,255,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 75%, rgba(0,0,0,0.15) 0%, transparent 45%);
  pointer-events: none;
}

.icon-svg {
  position: relative;
  z-index: 1;
  width: 62%;
  height: 62%;
  max-width: 88px;
  max-height: 88px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.game-card:hover .icon-svg {
  transform: scale(1.06);
}

.card-content {
  position: relative;
  z-index: 1;
  padding: clamp(10px, 1.8vw, 12px) clamp(12px, 2vw, 14px);
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-height: 0;
}

.card-title {
  font-size: clamp(0.82rem, 1.6vw, 0.95rem);
  font-weight: 600;
  line-height: 1.3;
  color: var(--fg);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: break-word;
}

.card-url {
  font-size: clamp(0.65rem, 1.2vw, 0.75rem);
  color: var(--fg-muted);
  opacity: 0.7;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.empty-state {
  display: none;
  grid-column: 1 / -1;
  text-align: center;
  padding: clamp(40px, 8vw, 60px) 20px;
  color: var(--fg-muted);
}

.empty-state.visible {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.empty-icon {
  width: 80px;
  height: 80px;
  stroke: var(--fg-muted);
  stroke-width: 1.5;
  opacity: 0.5;
}

.empty-title {
  font-size: clamp(1.1rem, 2vw, 1.3rem);
  font-weight: 600;
  color: var(--fg);
}

.empty-desc {
  font-size: clamp(0.9rem, 1.5vw, 1rem);
  max-width: 320px;
}

footer {
  position: relative;
  z-index: 5;
  padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
  border-top: 1px solid var(--card-border);
  background: rgba(21,29,48,0.5);
  backdrop-filter: blur(12px);
}

.footer-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: clamp(0.75rem, 1.3vw, 0.85rem);
  color: var(--fg-muted);
}

.footer-links {
  display: flex;
  gap: clamp(16px, 3vw, 24px);
}

.footer-links a {
  color: var(--fg-muted);
  text-decoration: none;
  transition: color 0.15s ease;
}

.footer-links a:hover {
  color: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (prefers-contrast: high) {
  :root {
    --card-border: currentColor;
    --shadow: currentColor;
    --shadow-strong: currentColor;
  }
  .game-card { border-width: 2px; }
}

@media (max-width: 480px) {
  .games-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .card-content { padding: 10px; }
  .card-title { font-size: 0.8rem; }
  .card-url { display: none; }
  .stats { font-size: 0.75rem; }
}

@media (min-width: 481px) and (max-width: 768px) {
  .games-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .games-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (min-width: 1025px) and (max-width: 1400px) {
  .games-grid {
    grid-template-columns: repeat(5, 1fr);
  }
}

@media (min-width: 1401px) {
  .games-grid {
    grid-template-columns: repeat(6, 1fr);
  }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(25,167,206,0.3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(25,167,206,0.5); }
</style>

  // 基于字符串的稳定伪随机
  function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  function seededRandom(seed, min = 0, max = 1) {
    const x = Math.sin(seed) * 10000;
    return min + (x - Math.floor(x)) * (max - min);
  }

  function pickRandom(arr, seed) {
    return arr[Math.floor(seededRandom(seed, 0, arr.length))];
  }

  function getIconConfig(title) {
    const seed = hashString(title);
    const shapeType = pickRandom(['circle', 'squircle', 'organic'], seed);
    const shapeVariants = SHAPES[shapeType].variants;
    const shapeVariant = pickRandom(shapeVariants, seed + 1);
    const colorPair = pickRandom(OCEAN_COLORS, seed + 2);
    const accentColor = pickRandom(ACCENT_COLORS, seed + 3);
    const rotation = seededRandom(seed + 4, 0, 360);
    const hasAccent = seededRandom(seed + 5, 0, 1) > 0.6;
    const accentType = pickRandom(['dot', 'dots', 'line', 'ring'], seed + 6);

    return {
      shapeType,
      shapeVariant,
      bgStart: colorPair.start,
      bgEnd: colorPair.end,
      accentColor,
      rotation,
      hasAccent,
      accentType
    };
  }

  // 生成图标 SVG
  function generateIconSVG(title, size = 128) {
    const config = getIconConfig(title);
    const viewBox = `0 0 512 512`;
    const safeScale = 0.82; // 内容安全区 82%

    let accentSVG = '';
    if (config.hasAccent) {
      const accentColor = config.accentColor;
      switch (config.accentType) {
        case 'dot':
          // 单个装饰点 - 左上光源位置
          accentSVG = `<circle cx="180" cy="180" r="32" fill="${accentColor}" opacity="0.9"/>`;
          break;
        case 'dots':
          // 三个小点
          accentSVG = `
            <circle cx="170" cy="170" r="20" fill="${accentColor}" opacity="0.9"/>
            <circle cx="300" cy="180" r="16" fill="${accentColor}" opacity="0.7"/>
            <circle cx="256" cy="300" r="12" fill="${accentColor}" opacity="0.6"/>
          `;
          break;
        case 'line':
          // 光影高光线
          accentSVG = `
            <path d="M140 140 L220 220" stroke="${accentColor}" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
            <path d="M160 380 L220 320" stroke="${accentColor}" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
          `;
          break;
        case 'ring':
          // 内环
          accentSVG = `
            <circle cx="256" cy="256" r="90" fill="none" stroke="${accentColor}" stroke-width="6" opacity="0.3"/>
          `;
          break;
      }
    }

    // 根据形状类型选择渲染方式
    let mainShapeSVG = '';
    if (config.shapeType === 'circle') {
      // 圆形母形：主体用 fill="currentColor"，配合 CSS 设置颜色
      // 但我们需要渐变背景，所以直接内联
      mainShapeSVG = config.shapeVariant.replace(/fill="currentColor"/g, `fill="url(#iconGrad)"`);
    } else if (config.shapeType === 'squircle') {
      mainShapeSVG = config.shapeVariant.replace(/fill="currentColor"/g, `fill="url(#iconGrad)"`);
    } else {
      mainShapeSVG = config.shapeVariant.replace(/fill="currentColor"/g, `fill="url(#iconGrad)"`);
    }

    // 处理负形切割中的 #fff
    mainShapeSVG = mainShapeSVG.replace(/fill="#fff"/g, `fill="none"`);
    mainShapeSVG = mainShapeSVG.replace(/fill="white"/g, `fill="none"`);

    const rotation = config.rotation;
    const transform = rotation > 180 ? `rotate(${rotation} 256 256)` : '';

    return `
      <svg class="icon-svg" viewBox="${viewBox}" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="transform: ${transform};">
        <defs>
          <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${config.bgStart}"/>
            <stop offset="50%" stop-color="${config.bgEnd}"/>
            <stop offset="100%" stop-color="${config.bgStart}"/>
          </linearGradient>
          <!-- 阴影滤镜 -->
          <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="rgba(20,40,60,0.4)"/>
          </filter>
        </defs>
        <g filter="url(#iconShadow)">
          ${mainShapeSVG}
          ${accentSVG}
        </g>
        <!-- 顶部高光 -->
        <ellipse cx="256" cy="180" rx="120" ry="40" fill="url(#highlightGrad)" opacity="0.15"/>
        <defs>
          <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
    `;
  }

  return { generateIconSVG, getIconConfig };
})();

// 渲染游戏卡片
function renderGameCard(game) {
  const iconSVG = IconGenerator.generateIconSVG(game.title);
  const config = IconGenerator.getIconConfig(game.title);

  return `
    <a href="${game.url}" class="game-card" role="listitem" style="--icon-bg-start: ${config.bgStart}; --icon-bg-end: ${config.bgEnd};" data-title="${game.title.replace(/"/g, '"')}">
      <div class="card-icon">
        ${iconSVG}
      </div>
      <div class="card-content">
        <h3 class="card-title">${escapeHtml(game.title)}</h3>
        <span class="card-url">${escapeHtml(game.filename)}</span>
      </div>
    </a>
  `;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 搜索和过滤逻辑
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const gamesGrid = document.getElementById('gamesGrid');
const emptyState = document.getElementById('emptyState');
const totalCountEl = document.getElementById('totalCount');
const filteredCountEl = document.getElementById('filteredCount');
const showCountEl = document.getElementById('showCount');

let filteredGames = GAMES_DATA;
let debounceTimer = null;

function updateStats() {
  totalCountEl.textContent = GAMES_DATA.length;
  if (filteredGames.length !== GAMES_DATA.length) {
    filteredCountEl.style.display = 'inline';
    showCountEl.textContent = filteredGames.length;
  } else {
    filteredCountEl.style.display = 'none';
  }
}

function renderGames(games) {
  gamesGrid.innerHTML = games.map(renderGameCard).join('');
  emptyState.classList.toggle('visible', games.length === 0);
  updateStats();
}

function filterGames(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    filteredGames = GAMES_DATA;
  } else {
    filteredGames = GAMES_DATA.filter(game =>
      game.title.toLowerCase().includes(q) ||
      game.filename.toLowerCase().includes(q)
    );
  }
  renderGames(filteredGames);
  clearBtn.classList.toggle('visible', q.length > 0);
}

searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    filterGames(e.target.value);
  }, 80);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  filterGames('');
  clearBtn.classList.remove('visible');
});

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  renderGames(GAMES_DATA);
  searchInput.focus();
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.blur();
  }
});

// 性能优化：IntersectionObserver 懒加载动画
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.willChange = 'transform, box-shadow';
      } else {
        entry.target.style.willChange = 'auto';
      }
    });
  }, { rootMargin: '100px' });

  // 延迟观察，首屏直接渲染
  setTimeout(() => {
    document.querySelectorAll('.game-card').forEach(card => observer.observe(card));
  }, 100);
}
</script>
