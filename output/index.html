<head>

<title>游戏大厅 · Game Hub</title>
<style>
/* ===== CSS Custom Properties (Sailfish OS Color System) ===== */
:root {
  /* Ocean Primary Colors (60%+) */
  --ocean-deep-teal: #0E7C8C;
  --ocean-teal: #19A7CE;
  --ocean-sky: #4FC3F7;
  --ocean-sea-green: #2EBD85;
  --ocean-deep-green: #15966B;
  
  /* Warm Accent Colors (sparingly) */
  --accent-coral: #F0544F;
  --accent-orange: #F59B23;
  --accent-yellow: #FFD34E;
  --accent-magenta: #B03A6B;
  
  /* Foreground / Neutral */
  --fg-white: #FFFFFF;
  --fg-offwhite: #F5F7F7;
  --bg-dark: #0A1620;
  --bg-card: #0F1B2A;
  --bg-card-hover: #142536;
  --border-subtle: #1E3A50;
  --text-primary: #E8F0F8;
  --text-secondary: #9AB0C8;
  --text-muted: #6B8BA4;
  
  /* Shadows (unified) */
  --shadow-ambient: rgba(20, 40, 60, 0.2);
  --shadow-elevated: rgba(20, 40, 60, 0.35);
  --shadow-long: rgba(20, 40, 60, 0.15);
  
  /* Gradients (120-150 deg, light from top-left) */
  --grad-deep-teal: linear-gradient(135deg, #0E7C8C 0%, #15966B 100%);
  --grad-teal-sky: linear-gradient(135deg, #19A7CE 0%, #4FC3F7 100%);
  --grad-sea-deep: linear-gradient(135deg, #2EBD85 0%, #15966B 100%);
  --grad-coral: linear-gradient(135deg, #F0544F 0%, #F59B23 100%);
  --grad-magenta: linear-gradient(135deg, #C56CD6 0%, #E85D9E 100%);
  --grad-orange-yellow: linear-gradient(135deg, #F59B23 0%, #FFD34E 100%);
  --grad-sky-teal: linear-gradient(135deg, #4FC3F7 0%, #19A7CE 100%);
  
  /* Layout */
  --icon-size: 96px;
  --icon-size-sm: 72px;
  --gap: 16px;
  --gap-sm: 12px;
  --radius-squircle: 26%;
  --safe-area: 82%;
  --stroke-width: 7%;
  --transition-fast: 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --transition-normal: 280ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  min-height: 100vh;
  background: var(--bg-dark);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  line-height: 1.5;
  overflow-x: hidden;
}

/* Subtle animated background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(14, 124, 140, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(30, 189, 133, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(25, 167, 206, 0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  animation: bgDrift 20s ease-in-out infinite alternate;
}
@keyframes bgDrift {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-2%, 1%) scale(1.02); }
}

/* ===== Layout ===== */
.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* Header */
.header {
  padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
  text-align: center;
  border-bottom: 1px solid var(--border-subtle);
  background: linear-gradient(180deg, rgba(15, 27, 42, 0.95) 0%, rgba(15, 27, 42, 0.7) 100%);
  backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 {
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--fg-white) 0%, var(--ocean-sky) 50%, var(--ocean-sea-green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
.header .subtitle {
  font-size: clamp(0.8rem, 2vw, 0.95rem);
  color: var(--text-secondary);
  font-weight: 400;
}

/* Search Bar */
.search-wrapper {
  max-width: 640px;
  margin: clamp(16px, 3vw, 20px) auto 0;
  position: relative;
}
.search-input {
  width: 100%;
  height: 48px;
  padding: 0 52px 0 18px;
  font-size: 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  color: var(--text-primary);
  outline: none;
  transition: var(--transition-fast);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:hover { border-color: var(--ocean-teal); }
.search-input:focus { border-color: var(--ocean-sky); box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.15); }
.search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: var(--transition-fast);
}
.search-clear.visible { opacity: 1; pointer-events: auto; }
.search-clear:hover { background: var(--border-subtle); color: var(--fg-white); }
.search-clear svg { width: 18px; height: 18px; }

/* Stats Bar */
.stats-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(12px, 3vw, 24px);
  padding: clamp(10px, 2vw, 14px) clamp(16px, 4vw, 32px);
  font-size: clamp(0.75rem, 1.8vw, 0.875rem);
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(15, 27, 42, 0.8);
  backdrop-filter: blur(10px);
  flex-wrap: wrap;
}
.stats-bar .stat {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stats-bar .stat-value {
  color: var(--ocean-sky);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Main Grid */
.main { flex: 1; padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--gap);
  max-width: 1600px;
  margin: 0 auto;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: var(--gap-sm); }
}
@media (min-width: 481px) and (max-width: 768px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 769px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 1025px) and (max-width: 1400px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}
@media (min-width: 1401px) {
  .grid { grid-template-columns: repeat(6, 1fr); }
}

/* Game Card */
.game-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: var(--transition-normal);
  cursor: pointer;
  isolation: isolate;
}
.game-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25,167,206,0.08) 0%, transparent 50%);
  opacity: 0;
  transition: var(--transition-normal);
  pointer-events: none;
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--ocean-teal);
  box-shadow: 0 16px 40px var(--shadow-elevated), 0 0 0 1px var(--ocean-teal);
}
.game-card:hover::before { opacity: 1; }
.game-card:focus-visible {
  outline: none;
  border-color: var(--ocean-sky);
  box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.3);
}

/* Icon Container */
.icon-wrap {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--grad-deep-teal);
}
.icon-wrap svg { width: 72%; height: 72%; max-width: var(--icon-size); max-height: var(--icon-size); }
@media (max-width: 480px) {
  .icon-wrap svg { width: 68%; height: 68%; }
}

/* Sailfish OS Style Icon System */
/* Base shapes using mask/clip-path for negative space cutting */
.sailfish-icon {
  width: 100%;
  height: 100%;
  position: relative;
}
/* Squircle mask (continuous curvature approximation via SVG path) */
.squircle-mask {
  width: 100%;
  height: 100%;
}
/* Organic blob mask */
.organic-mask {
  width: 100%;
  height: 100%;
}

/* Icon variants - each game gets a deterministic variant based on index */
/* Variant 1: Circle/Concentric - Focus, Time, Lens, Play, Celestial */
.icon-v1 .icon-bg { fill: url(#grad-v1); }
.icon-v1 .icon-symbol { fill: var(--fg-white); }
#grad-v1 { stop-color: var(--ocean-deep-teal); }
#grad-v1 + stop { stop-color: var(--ocean-deep-green); }

/* Variant 2: Squircle - App, Window, Card, System */
.icon-v2 .icon-bg { fill: url(#grad-v2); }
.icon-v2 .icon-symbol { fill: var(--fg-white); }
#grad-v2 { stop-color: var(--ocean-teal); }
#grad-v2 + stop { stop-color: var(--ocean-sky); }

/* Variant 3: Organic Blob - Phone, Bubble, Envelope, Life */
.icon-v3 .icon-bg { fill: url(#grad-v3); }
.icon-v3 .icon-symbol { fill: var(--fg-white); }
#grad-v3 { stop-color: var(--ocean-sea-green); }
#grad-v3 + stop { stop-color: var(--ocean-deep-green); }

/* Variant 4: Circle with accent dot */
.icon-v4 .icon-bg { fill: url(#grad-v4); }
.icon-v4 .icon-symbol { fill: var(--fg-white); }
.icon-v4 .accent-dot { fill: var(--accent-magenta); }
#grad-v4 { stop-color: var(--ocean-deep-teal); }
#grad-v4 + stop { stop-color: var(--ocean-teal); }

/* Variant 5: Squircle with cut corner */
.icon-v5 .icon-bg { fill: url(#grad-v5); }
.icon-v5 .icon-symbol { fill: var(--fg-white); }
#grad-v5 { stop-color: var(--accent-coral); }
#grad-v5 + stop { stop-color: var(--accent-orange); }

/* Variant 6: Organic with inner curve */
.icon-v6 .icon-bg { fill: url(#grad-v6); }
.icon-v6 .icon-symbol { fill: var(--fg-white); }
#grad-v6 { stop-color: var(--ocean-sky); }
#grad-v6 + stop { stop-color: var(--ocean-teal); }

/* Variant 7: Concentric rings */
.icon-v7 .icon-bg { fill: url(#grad-v7); }
.icon-v7 .icon-symbol { fill: var(--fg-white); }
.icon-v7 .ring { stroke: var(--fg-white); stroke-width: 4%; fill: none; }
#grad-v7 { stop-color: var(--ocean-deep-green); }
#grad-v7 + stop { stop-color: var(--ocean-sea-green); }

/* Variant 8: Squircle with center cross */
.icon-v8 .icon-bg { fill: url(#grad-v8); }
.icon-v8 .icon-symbol { fill: var(--fg-white); }
#grad-v8 { stop-color: var(--accent-orange); }
#grad-v8 + stop { stop-color: var(--accent-yellow); }

/* Variant 9: Organic droplet */
.icon-v9 .icon-bg { fill: url(#grad-v9); }
.icon-v9 .icon-symbol { fill: var(--fg-white); }
#grad-v9 { stop-color: var(--ocean-teal); }
#grad-v9 + stop { stop-color: var(--ocean-deep-teal); }

/* Variant 10: Circle with play triangle */
.icon-v10 .icon-bg { fill: url(#grad-v10); }
.icon-v10 .icon-symbol { fill: var(--fg-white); }
#grad-v10 { stop-color: var(--accent-coral); }
#grad-v10 + stop { stop-color: var(--accent-magenta); }

/* Variant 11: Squircle with grid */
.icon-v11 .icon-bg { fill: url(#grad-v11); }
.icon-v11 .icon-symbol { fill: var(--fg-white); }
#grad-v11 { stop-color: var(--ocean-sea-green); }
#grad-v11 + stop { stop-color: var(--ocean-teal); }

/* Variant 12: Organic wave */
.icon-v12 .icon-bg { fill: url(#grad-v12); }
.icon-v12 .icon-symbol { fill: var(--fg-white); }
#grad-v12 { stop-color: var(--ocean-sky); }
#grad-v12 + stop { stop-color: var(--ocean-deep-teal); }

/* Game Title */
.game-title {
  padding: 10px 12px 12px;
  font-size: 0.8rem;
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.6em;
  color: var(--text-primary);
}

/* Empty State */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: 1rem; }

/* Footer */
.footer {
  padding: 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.75rem;
  border-top: 1px solid var(--border-subtle);
  background: rgba(10, 22, 32, 0.8);
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  body::before { animation: none; }
}

/* High Contrast */
@media (prefers-contrast: high) {
  :root {
    --border-subtle: var(--ocean-teal);
    --text-secondary: var(--fg-white);
    --text-muted: var(--ocean-sky);
  }
  .game-card:hover { border-width: 2px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--ocean-teal); }
</style>
</head>

// ===== Sailfish OS Icon Generator =====
// Deterministic pseudo-random based on string hash
function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

const ICON_VARIANTS = 12;
const GRADIENTS = [
  'grad-v1', 'grad-v2', 'grad-v3', 'grad-v4', 'grad-v5', 'grad-v6',
  'grad-v7', 'grad-v8', 'grad-v9', 'grad-v10', 'grad-v11', 'grad-v12'
];

// SVG Paths for three primary shapes (Sailfish OS style)
// 1. Circle/Concentric (focus, time, lens, play, celestial)
// 2. Squircle (continuous curvature, ~26% corner radius)
// 3. Organic blob (droplet/leaf/comma/arch - single axis asymmetric)

const SQUIRCLE_PATH = "M50,4 C68.5,4 84,19.5 84,38 C84,56.5 68.5,72 50,72 C31.5,72 16,56.5 16,38 C16,19.5 31.5,4 50,4 Z";

const ORGANIC_PATHS = [
  // Droplet (pointing up)
  "M50,8 C50,8 70,20 70,38 C70,58 50,88 50,88 C50,88 30,58 30,38 C30,20 50,8 50,8 Z",
  // Leaf (asymmetric curve)
  "M50,6 C50,6 78,18 82,40 C86,62 60,88 50,88 C40,88 14,62 18,40 C22,18 50,6 50,6 Z",
  // Comma/teardrop
  "M50,12 C50,12 75,18 75,40 C75,65 55,88 50,88 C45,88 25,65 25,40 C25,18 50,12 50,12 Z",
  // Arch/dome
  "M18,60 Q18,25 50,12 Q82,25 82,60 Q82,78 50,88 Q18,78 18,60 Z"
];

const SYMBOL_PATHS = [
  // Play triangle
  "M36,26 L66,44 L36,62 Z",
  // Concentric rings (two rings)
  "M50,18 A32,32 0 1,1 49.9,18 M50,28 A22,22 0 1,1 49.9,28",
  // Center cross (plus)
  "M36,50 L64,50 M50,36 L50,64",
  // Grid 2x2
  "M30,30 L70,30 M30,50 L70,50 M30,30 L30,70 M50,30 L50,70 M70,30 L70,70",
  // Three dots (bubble)
  "M35,35 A4,4 0 1,1 34.9,35 M50,35 A4,4 0 1,1 49.9,35 M65,35 A4,4 0 1,1 64.9,35",
  // Arrow right
  "M30,50 L60,50 M45,35 L60,50 L45,65",
  // Home shape
  "M50,18 L78,40 L78,70 L50,70 L50,18 Z M22,40 L50,18",
  // Gamepad D-pad
  "M50,24 A26,26 0 1,1 49.9,24 M50,34 L50,66 M34,50 L66,50",
  // Mountain peaks
  "M15,70 L35,28 L55,52 L75,18 L90,70 Z",
  // Waves
  "M10,55 Q30,35 50,55 Q70,35 90,55",
  // Hexagon
  "M50,10 L85,30 L85,70 L50,90 L15,70 L15,30 Z",
  // Star
  "M50,12 L58,40 L88,40 L63,60 L70,90 L50,72 L30,90 L37,60 L12,40 L42,40 Z"
];

function getIconVariant(title, index) {
  const h = hashString(title + index);
  return h % ICON_VARIANTS;
}

function getSymbolVariant(title, index) {
  const h = hashString(title + index + 'sym');
  return h % SYMBOL_PATHS.length;
}

function getOrganicVariant(title, index) {
  const h = hashString(title + index + 'org');
  return h % ORGANIC_PATHS.length;
}

function generateIconSVG(title, index) {
  const variant = getIconVariant(title, index);
  const symbolIdx = getSymbolVariant(title, index);
  const organicIdx = getOrganicVariant(title, index);
  const grad = GRADIENTS[variant];
  
  let bgPath, symbolPath, extraElements = '';
  const strokeWidth = '3.5'; // ~7% of 50
  const symbolScale = 0.45; // Safe area ~82%, symbol ~45% of viewBox
  
  switch(variant) {
    case 0: // Circle/Concentric - focus, time, lens
      bgPath = `<circle cx="50" cy="50" r="48" class="icon-bg"/>`;
      symbolPath = `<circle cx="50" cy="50" r="22" class="icon-symbol" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round"/>`;
      extraElements = `<circle cx="50" cy="50" r="12" class="ring"/>`;
      break;
    case 1: // Squircle - app, window, system
      bgPath = `<path d="${SQUIRCLE_PATH}" class="icon-bg"/>`;
      symbolPath = `<path d="${SYMBOL_PATHS[symbolIdx]}" class="icon-symbol" transform="translate(50,50) scale(${symbolScale}) translate(-50,-50)"/>`;
      break;
    case 2: // Organic blob - phone, bubble, life
      bgPath = `<path d="${ORGANIC_PATHS[organicIdx]}" class="icon-bg"/>`;
      symbolPath = `<path d="${SYMBOL_PATHS[symbolIdx]}" class="icon-symbol" transform="translate(50,50) scale(${symbolScale}) translate(-50,-50)"/>`;
      break;
    case 3: // Circle with accent dot
      bgPath = `<circle cx="50" cy="50" r="48" class="icon-bg"/>`;
      symbolPath = `<path d="${SYMBOL_PATHS[symbolIdx]}" class="icon-symbol" transform="translate(50,50) scale(${symbolScale}) translate(-50,-50)"/>`;
      extraElements = `<circle cx="78" cy="22" r="6" class="accent-dot"/>`;
      break;
    case 4: // Squircle warm accent
      bgPath = `<path d="${SQUIRCLE_PATH}" class="icon-bg"/>`;
      symbolPath = `<path d="${SYMBOL_PATHS[symbolIdx]}" class="icon-symbol" transform="translate(50,50) scale(${symbolScale}) translate(-50,-50)"/>`;
      break;
    case 5: // Organic with inner curve
      bgPath = `<path d="${ORGANIC_PATHS[organicIdx]}" class="icon-bg"/>`;
      symbolPath = `<path d="${SYMBOL_PATHS[symbolIdx]}" class="icon-symbol" transform="translate(50,50) scale(${symbolScale}) translate(-50,-50)"/>`;
      break;
    case 6: // Concentric rings
      bgPath = `<circle cx="50" cy="50" r="48" class="icon-bg"/>`;
      symbolPath = `<g class="icon-symbol" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round">
        <circle cx="50" cy="50" r="28"/>
        <circle cx="50" cy="50" r="16"/>
      </g>`;
      break;
    case 7: // Squircle with center cross
      bgPath = `<path d="${SQUIRCLE_PATH}" class="icon-bg"/>`;
      symbolPath = `<g class="icon-symbol" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round">
        <line x1="50" y1="22" x2="50" y2="78"/>
        <line x1="22" y1="50" x2="78" y2="50"/>
      </g>`;
      break;
    case 8: // Organic droplet
      bgPath = `<path d="${ORGANIC_PATHS[organicIdx]}" class="icon-bg"/>`;
      symbolPath = `<path d="${SYMBOL_PATHS[symbolIdx]}" class="icon-symbol" transform="translate(50,50) scale(${symbolScale}) translate(-50,-50)"/>`;
      break;
    case 9: // Circle with play
      bgPath = `<circle cx="50" cy="50" r="48" class="icon-bg"/>`;
      symbolPath = `<path d="M34,28 L66,50 L34,72 Z" class="icon-symbol"/>`;
      break;
    case 10: // Squircle with grid
      bgPath = `<path d="${SQUIRCLE_PATH}" class="icon-bg"/>`;
      symbolPath = `<g class="icon-symbol" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round">
        <line x1="30" y1="30" x2="70" y2="30"/>
        <line x1="30" y1="50" x2="70" y2="50"/>
        <line x1="30" y1="70" x2="70" y2="70"/>
        <line x1="30" y1="30" x2="30" y2="70"/>
        <line x1="50" y1="30" x2="50" y2="70"/>
        <line x1="70" y1="30" x2="70" y2="70"/>
      </g>`;
      break;
    case 11: // Organic wave
      bgPath = `<path d="${ORGANIC_PATHS[organicIdx]}" class="icon-bg"/>`;
      symbolPath = `<path d="${SYMBOL_PATHS[symbolIdx]}" class="icon-symbol" transform="translate(50,50) scale(${symbolScale}) translate(-50,-50)"/>`;
      break;
  }
  
  const gradDefs = `
    <defs>
      <linearGradient id="${grad}" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
        <stop offset="0%" stop-color="var(--ocean-deep-teal)"/>
        <stop offset="100%" stop-color="var(--ocean-deep-green)"/>
      </linearGradient>
    </defs>
  `;
  
  // Inject actual gradient colors via style (CSS custom properties don't work in SVG fill directly)
  // We'll use inline styles for gradients
  const gradColors = [
    ['#0E7C8C', '#15966B'], // v1 deep-teal to deep-green
    ['#19A7CE', '#4FC3F7'], // v2 teal to sky
    ['#2EBD85', '#15966B'], // v3 sea-green to deep-green
    ['#0E7C8C', '#19A7CE'], // v4 deep-teal to teal
    ['#F0544F', '#F59B23'], // v5 coral to orange
    ['#4FC3F7', '#19A7CE'], // v6 sky to teal
    ['#15966B', '#2EBD85'], // v7 deep-green to sea-green
    ['#F59B23', '#FFD34E'], // v8 orange to yellow
    ['#19A7CE', '#0E7C8C'], // v9 teal to deep-teal
    ['#F0544F', '#C56CD6'], // v10 coral to magenta
    ['#2EBD85', '#19A7CE'], // v11 sea-green to teal
    ['#4FC3F7', '#0E7C8C']  // v12 sky to deep-teal
  ];
  
  const [c1, c2] = gradColors[variant];
  const inlineGrad = `
    <defs>
      <linearGradient id="g${index}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="${c2}"/>
      </linearGradient>
    </defs>
  `;
  
  return `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="sailfish-icon icon-v${variant + 1}">
      ${inlineGrad}
      ${bgPath.replace('class="icon-bg"', `fill="url(#g${index})"`)}
      ${symbolPath.replace('class="icon-symbol"', 'fill="white"').replace('stroke="currentColor"', 'stroke="white"')}
      ${extraElements}
    </svg>
  `;
}

// ===== Render Game Grid =====
const grid = document.getElementById('gameGrid');
const emptyState = document.getElementById('emptyState');
const visibleCountEl = document.getElementById('visibleCount');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

let filteredGames = GAMES;

function renderGames(games) {
  grid.innerHTML = '';
  if (games.length === 0) {
    grid.hidden = true;
    emptyState.hidden = false;
    visibleCountEl.textContent = '0';
    return;
  }
  grid.hidden = false;
  emptyState.hidden = true;
  visibleCountEl.textContent = games.length;
  
  const fragment = document.createDocumentFragment();
  games.forEach((game, idx) => {
    const card = document.createElement('a');
    card.href = game.path;
    card.className = 'game-card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', game.title);
    
    const iconHTML = generateIconSVG(game.title, idx);
    
    card.innerHTML = `
      <div class="icon-wrap">${iconHTML}</div>
      <div class="game-title">${escapeHtml(game.title)}</div>
    `;
    
    fragment.appendChild(card);
  });
  grid.appendChild(fragment);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== Search/Filter =====
function filterGames(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    filteredGames = GAMES;
  } else {
    filteredGames = GAMES.filter(g => g.title.toLowerCase().includes(q));
  }
  renderGames(filteredGames);
}

let searchDebounce;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    filterGames(e.target.value);
    searchClear.classList.toggle('visible', e.target.value.length > 0);
  }, 80);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  searchClear.classList.remove('visible');
  filterGames('');
});

// Keyboard: Escape to clear, / to focus
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && searchInput.value) {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    filterGames('');
    searchInput.blur();
  }
  if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    searchInput.focus();
  }
});

// Initial render
renderGames(GAMES);

// Smooth scroll to top on load
window.addEventListener('load', () => window.scrollTo(0, 0));
</script>
</body>
</html>
