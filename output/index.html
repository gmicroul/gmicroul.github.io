<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1420;
  --bg2:#111c2e;
  --card:#16233a;
  --card-hover:#1d2f4e;
  --text:#e8eef7;
  --muted:#8fa3bf;
  --accent:#4fc3f7;
}
html,body{min-height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#1b2f52 0%,transparent 60%),
             radial-gradient(900px 500px at -10% 20%,#14263f 0%,transparent 55%),
             var(--bg);
  color:var(--text);
  min-height:100vh;
}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(13,20,32,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(143,163,191,.12);
  padding:14px 20px;
}
.header-inner{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
h1{font-size:20px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
h1 .dot{color:var(--accent)}
.count{
  font-size:13px;color:var(--muted);
  background:rgba(79,195,247,.1);
  border:1px solid rgba(79,195,247,.25);
  border-radius:999px;padding:3px 12px;white-space:nowrap;
}
.search-wrap{flex:1;min-width:180px;display:flex;justify-content:flex-end}
#search{
  width:100%;max-width:340px;
  background:rgba(22,35,58,.9);
  border:1px solid rgba(143,163,191,.25);
  border-radius:999px;
  color:var(--text);
  font-size:14px;
  padding:9px 18px;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
#search::placeholder{color:var(--muted)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.15)}
main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:18px 14px;
}
.card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  text-decoration:none;color:var(--text);
  padding:14px 8px 12px;
  border-radius:16px;
  background:transparent;
  transition:background .2s, transform .2s;
  cursor:pointer;
}
.card:hover,.card:focus-visible{background:var(--card);transform:translateY(-3px)}
.icon{
  width:72px;height:72px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:rgba(255,255,255,.95);
  text-shadow:0 2px 6px rgba(0,0,0,.35);
  box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;
  transition:transform .25s, box-shadow .25s;
  user-select:none;
}
.icon::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.05) 35%,transparent 60%);
  pointer-events:none;
}
.card:hover .icon{transform:scale(1.08);box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3)}
.name{
  font-size:12.5px;line-height:1.35;text-align:center;
  color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
  max-width:100%;
}
.empty{
  text-align:center;color:var(--muted);padding:80px 20px;font-size:15px;display:none;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 32px;opacity:.7}
@media (max-width:720px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
  .icon{width:60px;height:60px;font-size:25px}
  h1{font-size:17px}
  .search-wrap{order:3;flex-basis:100%;justify-content:stretch}
  #search{max-width:none}
}
@media (min-width:1400px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}
</style>
</head>

/* SailfishOS 风格:四个角半径各不相同,边不一定是直边(不对称 blob 形) */
function hashStr(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}

function sailfishRadius(seed){
  function r(min,max){return min+seed% (max-min+1)} // 占位,实际下方重新播种
  var s=seed;
  function next(min,max){s=(s*1103515245+12345)&0x7fffffff;return min+(s%(max-min+1))}
  var tl=next(28,62),tr=next(28,62),br=next(28,62),bl=next(28,62);
  var tl2=next(28,62),tr2=next(28,62),br2=next(28,62),bl2=next(28,62);
  return tl+"% "+tr+"% "+br+"% "+bl+"% / "+tl2+"% "+tr2+"% "+br2+"% "+bl2+"%";
}

function makeCard(g){
  var seed=hashStr(g.n);
  var hue=seed%360;
  var hue2=(hue+40+seed%60)%360;
  var a=document.createElement("a");
  a.className="card";
  a.href=g.u;
  a.title=g.n;
  var icon=document.createElement("div");
  icon.className="icon";
  icon.style.borderRadius=sailfishRadius(seed);
  icon.style.background="linear-gradient(150deg,hsl("+hue+",62%,52%) 0%,hsl("+hue2+",68%,38%) 100%)";
  var ch=g.n.replace(/^[^\p{L}\p{N}]*/u,"").charAt(0).toUpperCase()||"?";
  icon.textContent=ch;
  var name=document.createElement("div");
  name.className="name";
  name.textContent=g.n;
  a.appendChild(icon);
  a.appendChild(name);
  return a;
}

var grid=document.getElementById("grid");
var empty=document.getElementById("empty");
var count=document.getElementById("count");
var total=document.getElementById("total");
var cards=GAMES.map(function(g){return{g:g,el:makeCard(g),key:g.n.toLowerCase()}});
cards.forEach(function(c){grid.appendChild(c.el)});
total.textContent=GAMES.length;

function filter(q){
  q=q.trim().toLowerCase();
  var shown=0;
  cards.forEach(function(c){
    var hit=!q||c.key.indexOf(q)!==-1;
    c.el.style.display=hit?"":"none";
    if(hit)shown++;
  });
  count.textContent=q?("匹配 "+shown+" / "+GAMES.length+" 款"):(GAMES.length+" 款游戏");
  empty.style.display=shown?"none":"block";
}

var search=document.getElementById("search");
search.addEventListener("input",function(){filter(search.value)});
filter("");
