<title>游戏大厅 · Game Hub</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #000000;
  --fg: #FFFFFF;
  --muted: #666666;
  --accent-blue: #5FD0F5;
  --accent-pink: #FFD8E0;
  --card-bg: rgba(255,255,255,0.03);
  --card-border: rgba(255,255,255,0.08);
  --search-bg: rgba(255,255,255,0.05);
  --search-border: rgba(255,255,255,0.12);
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.5;
  padding: 24px 16px 40px;
}

/* ===== Header ===== */
.header {
  max-width: 1400px;
  margin: 0 auto 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 0 4px;
}
.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.title-row h1 {
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #5FD0F5 0%, #FFD8E0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.count-badge {
  font-size: 0.875rem;
  color: var(--muted);
  white-space: nowrap;
  padding: 4px 12px;
  border: 1px solid var(--card-border);
  border-radius: 999px;
  background: var(--card-bg);
}

/* ===== Search ===== */
.search-wrapper {
  position: relative;
  width: 100%;
  max-width: 520px;
}
.search-wrapper svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--muted);
  pointer-events: none;
}
#searchInput {
  width: 100%;
  padding: 12px 16px 12px 48px;
  font-size: 1rem;
  color: var(--fg);
  background: var(--search-bg);
  border: 1px solid var(--search-border);
  border-radius: 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
#searchInput::placeholder { color: var(--muted); }
#searchInput:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(95, 208, 245, 0.15);
  background: rgba(255,255,255,0.07);
}
#clearSearch {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: none;
  border-radius: 50%;
  transition: color 0.2s, background 0.2s;
}
#clearSearch:hover { color: var(--fg); background: rgba(255,255,255,0.1); }
#clearSearch svg { width: 18px; height: 18px; stroke: currentColor; }

/* ===== Grid ===== */
.grid {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 18px;
  padding: 0 4px;
}

/* ===== Card ===== */
.card {
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 16px 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  transition: transform 0.18s cubic-bezier(0.2, 0, 0, 1),
              border-color 0.18s,
              box-shadow 0.18s,
              background 0.18s;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(95,208,245,0.06) 0%, rgba(255,216,224,0.06) 100%);
  opacity: 0;
  transition: opacity 0.18s;
  pointer-events: none;
}
.card:hover {
  transform: translateY(-4px);
  border-color: rgba(95, 208, 245, 0.4);
  box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(95,208,245,0.2);
  background: rgba(255,255,255,0.05);
}
.card:hover::before { opacity: 1; }
.card:focus-visible {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(95, 208, 245, 0.3);
}

/* ===== Icon Container ===== */
.icon-wrap {
  width: 86px;
  height: 86px;
  flex-shrink: 0;
  position: relative;
}

/* ===== SailfishOS-style Icons (CSS Generated) ===== */
/* Odd index: blue gradient, no rotation */
/* Even index: pink gradient, rotated 90deg, text color special for 'I' */

.icon-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Base shape path for all icons */
.icon-shape {
  /* The path is defined inline in SVG */
}

/* Odd cards (1,3,5...) - Blue */
.card:nth-child(odd) .icon-bg { fill: url(#gradBlue); }
.card:nth-child(odd) .icon-highlight { fill: url(#highlightBlue); }
.card:nth-child(odd) .icon-text { fill: #FFFFFF; }

/* Even cards (2,4,6...) - Pink, rotated */
.card:nth-child(even) .icon-bg { fill: url(#gradPink); }
.card:nth-child(even) .icon-highlight { fill: url(#highlightPink); }
.card:nth-child(even) .icon-group { transform: rotate(90deg); transform-origin: 43px 47px; }
.card:nth-child(even) .icon-text {
  fill: #FFFFFF;
  transform: rotate(-90deg);
  transform-origin: 43px 47px;
}
/* Special case: even cards starting with 'I' get pink-purple text */
.card:nth-child(even)[data-first-letter="I"] .icon-text { fill: #E85D9E; }

/* ===== Card Title ===== */
.card-title {
  font-size: 0.78rem;
  font-weight: 500;
  text-align: center;
  line-height: 1.25;
  max-width: 100%;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--fg);
}

/* ===== Hidden State (for search filtering) ===== */
.card.hidden { display: none !important; }

/* ===== No Results ===== */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 1.1rem;
}

/* ===== Footer ===== */
.footer {
  max-width: 1400px;
  margin: 40px auto 0;
  padding: 24px 16px 0;
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--card-border);
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  body { padding: 16px 12px 32px; }
  .header { margin-bottom: 20px; }
  .grid { gap: 14px; }
  .card { padding: 14px 10px; gap: 8px; }
  .icon-wrap { width: 76px; height: 76px; }
  .card-title { font-size: 0.72rem; }
}

@media (max-width: 400px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  .card, .card::before, #searchInput, #clearSearch { transition: none; }
}
</style>

// ===== DOM Elements =====
const grid = document.getElementById('gameGrid');
const searchInput = document.getElementById('searchInput');
const clearSearch = document.getElementById('clearSearch');
const gameCount = document.getElementById('gameCount');
const totalCount = document.getElementById('totalCount');
const noResults = document.getElementById('noResults');

// ===== SVG Icon Template (SailfishOS style) =====
const SVG_NS = 'http://www.w3.org/2000/svg';
const ICON_VIEWBOX = '0 0 86 86';
const SHAPE_PATH = 'M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z';
const TEXT_X = 43;
const TEXT_Y = 47;
const TEXT_SIZE = 29;
const CENTER_X = 43;
const CENTER_Y = 47;

function createIconSvg(letter, index) {
  const isOdd = index % 2 === 1; // 1-based index
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', ICON_VIEWBOX);
  svg.setAttribute('width', '86');
  svg.setAttribute('height', '86');
  svg.classList.add('icon-svg');
  
  // Group for the shape + highlight (rotated for even)
  const group = document.createElementNS(SVG_NS, 'g');
  group.classList.add('icon-group');
  if (!isOdd) {
    group.setAttribute('transform', `rotate(90 ${CENTER_X} ${CENTER_Y})`);
  }
  
  // Background shape
  const bg = document.createElementNS(SVG_NS, 'path');
  bg.setAttribute('d', SHAPE_PATH);
  bg.classList.add('icon-bg');
  group.appendChild(bg);
  
  // Highlight (radial gradient)
  const highlight = document.createElementNS(SVG_NS, 'path');
  highlight.setAttribute('d', SHAPE_PATH);
  highlight.classList.add('icon-highlight');
  group.appendChild(highlight);
  
  svg.appendChild(group);
  
  // Text (always upright)
  const text = document.createElementNS(SVG_NS, 'text');
  text.setAttribute('x', TEXT_X);
  text.setAttribute('y', TEXT_Y + TEXT_SIZE * 0.35); // vertical center adjustment
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('dominant-baseline', 'central');
  text.setAttribute('font-family', 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif');
  text.setAttribute('font-weight', 'bold');
  text.setAttribute('font-size', TEXT_SIZE);
  text.classList.add('icon-text');
  text.textContent = letter;
  
  // For even cards starting with 'I', use special color
  if (!isOdd && letter === 'I') {
    text.style.fill = '#E85D9E';
  }
  
  svg.appendChild(text);
  return svg;
}

// ===== Render Cards =====
function renderCards(filter = '') {
  grid.innerHTML = '';
  let visibleCount = 0;
  const lowerFilter = filter.toLowerCase().trim();
  
  GAMES.forEach((game, i) => {
    const nameLower = game.name.toLowerCase();
    const matches = !lowerFilter || nameLower.includes(lowerFilter);
    
    const card = document.createElement('a');
    card.href = game.path;
    card.className = 'card' + (matches ? '' : ' hidden');
    card.setAttribute('role', 'listitem');
    card.setAttribute('data-first-letter', game.letter);
    if (!matches) card.style.display = 'none';
    
    const iconWrap = document.createElement('div');
    iconWrap.className = 'icon-wrap';
    iconWrap.appendChild(createIconSvg(game.letter, game.index));
    
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = game.name;
    
    card.appendChild(iconWrap);
    card.appendChild(title);
    grid.appendChild(card);
    
    if (matches) visibleCount++;
  });
  
  // Update count
  gameCount.textContent = filter ? `显示 ${visibleCount} / ${GAMES.length} 款游戏` : `共 ${GAMES.length} 款游戏`;
  totalCount.textContent = GAMES.length;
  
  // Show/hide no results
  noResults.classList.toggle('hidden', visibleCount > 0 || !filter);
}

// ===== Search Handling =====
let searchDebounce = null;
searchInput.addEventListener('input', (e) => {
  const value = e.target.value;
  clearSearch.hidden = !value;
  
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    renderCards(value);
  }, 80);
});

clearSearch.addEventListener('click', () => {
  searchInput.value = '';
  clearSearch.hidden = true;
  searchInput.focus();
  renderCards('');
});

// ===== Keyboard: Escape to clear search =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.value = '';
    clearSearch.hidden = true;
    searchInput.blur();
    renderCards('');
  }
});

// ===== Initial Render =====
renderCards();

// ===== Focus search on load (desktop) =====
if (window.innerWidth > 640) {
  setTimeout(() => searchInput.focus(), 100);
}
