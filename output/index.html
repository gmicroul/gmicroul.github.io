<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1019">
<title>游戏大厅 · Game Lobby</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#1b2635;--bg2:#0b1019;--bg3:#06090f;
  --accent:#39d5ff;--accent2:#7af5c0;
  --txt:#e6edf6;--txt-dim:#9fb0c4;
  --card-bg:rgba(255,255,255,.055);--card-bd:rgba(255,255,255,.09);
  --radius:20px;
}
html,body{height:100%}
body{
  font-family:"Open Sans","Segoe UI",Roboto,"Helvetica Neue","Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt);
  background:radial-gradient(1400px 700px at 50% -12%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  min-height:100%;
}
a{color:inherit;text-decoration:none}

header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,rgba(8,12,20,.88),rgba(8,12,20,.6));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.header-in{max-width:1080px;margin:0 auto;padding:14px 16px 12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:44px;height:44px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:800;color:#05121a;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 4px 18px rgba(57,213,255,.35);
}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:12px;color:var(--txt-dim);margin-top:2px}
.sub b{color:var(--accent);font-weight:700}

.searchbar{
  margin-top:12px;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:0 14px;height:46px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.searchbar:focus-within{
  border-color:rgba(57,213,255,.65);
  background:rgba(255,255,255,.09);
  box-shadow:0 0 0 4px rgba(57,213,255,.14);
}
.searchbar svg{flex:none;width:18px;height:18px;stroke:var(--txt-dim)}
.searchbar input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--txt);font-size:15px;height:100%;
}
.searchbar input::placeholder{color:var(--txt-dim)}
.count{
  flex:none;font-size:12px;color:var(--txt-dim);
  background:rgba(57,213,255,.12);border:1px solid rgba(57,213,255,.25);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}

main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:18px;padding:0 4px;
}
.banner .title{font-size:14px;font-weight:600;color:var(--txt-dim);letter-spacing:1px;text-transform:uppercase}
.banner .hint{font-size:12px;color:rgba(159,176,196,.7)}

.grid{
  display:grid;grid-template-columns:repeat(2,108px);
  justify-content:center;gap:18px 14px;
}
@media(min-width:620px){.grid{grid-template-columns:repeat(auto-fill,108px);gap:20px}}

.card{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:8px 6px 6px;border-radius:var(--radius);
  background:var(--card-bg);border:1px solid var(--card-bd);
  transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  background:rgba(255,255,255,.09);
  border-color:rgba(57,213,255,.55);
  box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 1px rgba(57,213,255,.25);
  outline:none;
}
.card:active{transform:translateY(-1px) scale(.98)}
.card .icon{
  width:86px;height:86px;border-radius:20px;overflow:hidden;flex:none;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);
}
.card .icon img{width:86px;height:86px;display:block}
.card .name{
  font-size:12px;line-height:1.3;text-align:center;color:var(--txt);
  max-width:100px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.empty{
  text-align:center;color:var(--txt-dim);padding:70px 20px;font-size:14px;
}

footer{
  border-top:1px solid rgba(255,255,255,.06);
  text-align:center;color:var(--txt-dim);font-size:12px;padding:18px 16px 30px;
}
footer .dot{color:var(--accent)}

</style>
</head>

    <div class="searchbar">

        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/>
      </svg>
      <input id="q" type="search" placeholder="搜索游戏…  (按 / 聚焦)" autocomplete="off" spellcheck="false">
      <span id="count" class="count"></span>

  </div>
</header>
<main>
  <div class="banner">
    <span class="title">Games</span>
    <span class="hint">点按卡片开始游戏</span>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>未找到匹配的游戏</div>
</main>
<footer>
  游戏大厅 <span class="dot">·</span> SFOS Game Lobby <span class="dot">·</span> 全部游戏本地运行，无需网络

  var grid = document.getElementById('grid');
  var input = document.getElementById('q');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function card(g){
    return '<a class="card" href="../games-web/' + encodeURIComponent(g.f) + '" title="' + esc(g.n) + '">'
         + '<span class="icon"><img src="icons/' + encodeURIComponent(g.s) + '.svg" width="86" height="86" alt="' + esc(g.n) + '" loading="lazy"></span>'
         + '<span class="name">' + esc(g.n) + '</span>'
         + '</a>';
  }
  function render(){
    var q = (input.value || '').trim().toLowerCase();
    var list = q ? GAMES.filter(function(g){return g.n.toLowerCase().indexOf(q) !== -1;}) : GAMES;
    grid.innerHTML = list.map(card).join('');
    count.textContent = q ? (list.length + ' / ' + GAMES.length) : String(GAMES.length);
    empty.hidden = list.length !== 0;
  }
  input.addEventListener('input', render);
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== input){ e.preventDefault(); input.focus(); }
    else if(e.key === 'Escape'){ input.value = ''; render(); input.blur(); }
  });
  render();
})();
