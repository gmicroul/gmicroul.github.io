<title>SFOS 游戏大厅</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;
    background:#0b0e13;color:#e7edf5;min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(11,14,19,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid #1c2430;
  }
  .bar{max-width:1200px;margin:0 auto;padding:14px 16px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px}
  .logo svg{width:30px;height:30px;flex:none}
  .logo .t{font-size:20px;font-weight:700;letter-spacing:.5px}
  .logo .t b{font-weight:700;color:#00a9ff}
  .count{font-size:12px;color:#8a94a6;border:1px solid #202a36;padding:3px 10px;white-space:nowrap}
  .count b{color:#00a9ff;font-weight:700}
  .searchbox{position:relative;flex:1;min-width:200px;max-width:440px;margin-left:auto}
  .searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.55;pointer-events:none}
  .searchbox input{
    width:100%;background:#11161d;border:1px solid #232d3a;color:#e7edf5;
    padding:11px 14px 11px 38px;font-size:14px;border-radius:0;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .searchbox input::placeholder{color:#5b6675}
  .searchbox input:focus{border-color:#00a9ff;box-shadow:0 0 0 1px #00a9ff}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,108px);
    gap:12px;justify-content:center;
  }
  .card{
    width:108px;height:108px;background:#131a23;border:1px solid #202a36;border-radius:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-decoration:none;cursor:pointer;position:relative;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .card:hover,.card:focus-visible{
    border-color:#00a9ff;background:#182330;transform:translateY(-2px);outline:none;
  }
  .card:active{transform:translateY(0)}
  .card img{width:86px;height:86px;display:block;pointer-events:none}
  .card .nm{
    font-size:10px;line-height:12px;color:#c9d4e0;margin-top:4px;
    max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  }
  .empty{display:none;text-align:center;color:#8a94a6;padding:70px 0;font-size:14px}
  footer{text-align:center;color:#55606f;font-size:12px;padding:24px 0 40px}
  @media (max-width:520px){
    .bar{padding:12px 12px 10px;gap:10px}
    .searchbox{order:3;min-width:100%;max-width:none}
    .grid{grid-template-columns:repeat(2,108px);gap:10px}
  }
</style>
</head>

var grid = document.getElementById('grid');
var empty = document.getElementById('empty');
var shownEl = document.getElementById('shown');
function card(g){
  var a = document.createElement('a');
  a.className = 'card';
  a.href = '../games-web/' + g.f;
  a.setAttribute('title', g.n);
  var img = document.createElement('img');
  img.src = 'icons/' + g.i;
  img.alt = g.n;
  img.loading = 'lazy';
  var nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = g.n;
  a.appendChild(img);
  a.appendChild(nm);
  a.setAttribute('data-n', (g.n + ' ' + g.f).toLowerCase());
  return a;
}
GAMES.forEach(function(g){ grid.appendChild(card(g)); });
var q = document.getElementById('q');
q.addEventListener('input', function(){
  var t = q.value.trim().toLowerCase();
  var n = 0;
  var cards = grid.children;
  for (var i = 0; i < cards.length; i++){
    var m = cards[i].getAttribute('data-n').indexOf(t) !== -1;
    cards[i].style.display = m ? '' : 'none';
    if (m) n++;
  }
  shownEl.textContent = n;
  empty.style.display = n ? 'none' : 'block';
});
document.addEventListener('keydown', function(e){
  if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
});
