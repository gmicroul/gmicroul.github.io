<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
/* CSS 变量 */
:root {
  --bg: #000000;
  --fg: #ffffff;
  --fg-muted: #888888;
  --card-bg: #0a0a0a;
  --card-border: #1a1a1a;
  --accent-blue: #5FD0F5;
  --accent-blue-dark: #3AA8D0;
  --accent-pink: #FFD8E0;
  --accent-pink-dark: #FFB0C4;
  --highlight-purple: #E85D9E;
  --radius: 16px;
  --gap: 16px;
  --search-bg: #0d0d0d;
  --search-border: #222222;
}

/* 重置 */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* 页面容器 */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 头部 */
.header {
  padding: 24px 20px;
  text-align: center;
  border-bottom: 1px solid var(--card-border);
}
.header h1 {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .count {
  margin-top: 8px;
  font-size: 0.9rem;
  color: var(--fg-muted);
}

/* 搜索区域 */
.search-wrap {
  padding: 16px 20px;
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 80%, transparent 100%);
  z-index: 10;
}
.search-box {
  max-width: 600px;
  margin: 0 auto;
  position: relative;
}
.search-box svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: var(--fg-muted);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 12px 16px 12px 48px;
  font-size: 1rem;
  background: var(--search-bg);
  border: 1px solid var(--search-border);
  border-radius: 12px;
  color: var(--fg);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input::placeholder { color: var(--fg-muted); }
.search-input:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(95, 208, 245, 0.15);
}

/* 游戏网格 */
.main { flex: 1; padding: 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--gap);
  max-width: 1400px;
  margin: 0 auto;
}

/* 游戏卡片 */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 12px;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-blue);
  box-shadow: 0 12px 32px rgba(95, 208, 245, 0.12);
}
.card:active { transform: translateY(-1px); }

/* 图标容器 */
.icon-wrap {
  width: 86px;
  height: 86px;
  margin-bottom: 12px;
  position: relative;
  flex-shrink: 0;
}

/* SailfishOS 风格 SVG 图标 */
.sailfish-icon {
  width: 86px;
  height: 86px;
  display: block;
}

/* 卡片标题 */
.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 100%;
}

/* 空状态 */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-muted);
}
.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: 1rem; }

/* 页脚 */
.footer {
  padding: 24px 20px;
  text-align: center;
  color: var(--fg-muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--card-border);
}

/* 响应式断点 */
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .header { padding: 16px 16px; }
  .search-wrap { padding: 12px 16px; }
  .main { padding: 16px; }
  .card { padding: 12px 8px; }
  .icon-wrap { width: 72px; height: 72px; }
  .sailfish-icon { width: 72px; height: 72px; }
  .card-title { font-size: 0.75rem; }
}

@media (min-width: 481px) and (max-width: 768px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1025px) and (max-width: 1400px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}

@media (min-width: 1401px) {
  .grid { grid-template-columns: repeat(6, 1fr); }
}

/* 动画 */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeInUp 0.3s ease forwards; opacity: 0; }
.card:nth-child(1) { animation-delay: 0ms; }
.card:nth-child(2) { animation-delay: 20ms; }
.card:nth-child(3) { animation-delay: 40ms; }
.card:nth-child(4) { animation-delay: 60ms; }
.card:nth-child(5) { animation-delay: 80ms; }
.card:nth-child(6) { animation-delay: 100ms; }
.card:nth-child(7) { animation-delay: 120ms; }
.card:nth-child(8) { animation-delay: 140ms; }
.card:nth-child(9) { animation-delay: 160ms; }
.card:nth-child(10) { animation-delay: 180ms; }
.card:nth-child(11) { animation-delay: 200ms; }
.card:nth-child(12) { animation-delay: 220ms; }

/* 减少动画偏好 */
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; opacity: 1; }
  * { transition: none !important; }
}
</style>
</head>

// ===== SailfishOS 风格图标生成 =====
// 奇数：蓝绿渐变 #5FD0F5 → #3AA8D0，无旋转
// 偶数：粉色渐变 #FFD8E0 → #FFB0C4，整体旋转 90°，字体不旋转

function createSailfishIcon(index, title) {
  const isOdd = (index % 2) === 1; // 1-based: 1,3,5... 是奇数
  const firstChar = title.trim().charAt(0).toUpperCase();
  const textColor = (firstChar === 'I') ? '#E85D9E' : '#FFFFFF';
  
  // 渐变定义
  const gradId = `grad-${index}`;
  const highlightId = `highlight-${index}`;
  
  const gradColors = isOdd 
    ? 'stop-color="#5FD0F5" stop-opacity="1"'
    : 'stop-color="#FFD8E0" stop-opacity="1"';
  const gradColorsEnd = isOdd
    ? 'stop-color="#3AA8D0" stop-opacity="1"'
    : 'stop-color="#FFB0C4" stop-opacity="1"';
  
  // 旋转变换：偶数旋转 90°
  const groupTransform = isOdd ? '' : 'transform="rotate(90 43 47)"';
  
  // 文本不旋转，始终直立
  // 字体大小 29px，居中于 (43, 47)
  const fontSize = 29;
  
  return `<svg class="sailfish-icon" viewBox="0 0 86 94" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
  <defs>
    <linearGradient id="${gradId}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" ${gradColors} />
      <stop offset="100%" ${gradColorsEnd} />
    </linearGradient>
    <radialGradient id="${highlightId}" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g ${groupTransform}>
    <!-- 背景形状：圆角矩形路径 -->
    <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${gradId})" />
    <!-- 高光 -->
    <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${highlightId})" />
  </g>
  <!-- 文字：始终直立，居中 (43, 47) -->
  <text x="43" y="50" text-anchor="middle" dominant-baseline="central" fill="${textColor}" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="bold" font-size="${fontSize}px">${firstChar}</text>
</svg>`;
}

// ===== 字母占位图标（备用）=====
function createLetterIcon(char, index) {
  const hue = (index * 137.5) % 360; // 黄金角度分布
  return `<div class="letter-icon" style="
    width:86px;height:86px;border-radius:16px;
    background:hsl(${hue},65%,35%);
    display:flex;align-items:center;justify-content:center;
    font:bold 29px system-ui;color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1),
      0 4px 16px rgba(0,0,0,0.4);
  ">${char}</div>`;
}

// ===== 渲染游戏网格 =====
const grid = document.getElementById('gameGrid');
const emptyState = document.getElementById('emptyState');
const gameCountEl = document.getElementById('gameCount');
const totalCountEl = document.getElementById('totalCount');

function renderGames(filteredGames) {
  grid.innerHTML = '';
  
  if (filteredGames.length === 0) {
    emptyState.hidden = false;
    gameCountEl.textContent = '共 0 款游戏';
    return;
  }
  
  emptyState.hidden = true;
  gameCountEl.textContent = `共 ${filteredGames.length} 款游戏`;
  
  filteredGames.forEach((game, idx) => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = `/games-web/${game.filename}`;
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', game.title);
    
    // 使用游戏标题首字母作为图标字符
    const firstChar = game.title.trim().charAt(0).toUpperCase();
    const iconSvg = createSailfishIcon(idx + 1, game.title);
    
    card.innerHTML = `
      <div class="icon-wrap" aria-hidden="true">${iconSvg}</div>
      <span class="card-title">${escapeHtml(game.title)}</span>
    `;
    
    grid.appendChild(card);
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&': '&', '<': '<', '>': '>', '"': '"', "'": '''
  }[c]));
}

// ===== 搜索过滤 =====
const searchInput = document.getElementById('searchInput');
let debounceTimer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const query = searchInput.value.trim().toLowerCase();
    const filtered = GAMES.filter(g => 
      g.title.toLowerCase().includes(query) || 
      g.filename.toLowerCase().includes(query)
    );
    renderGames(filtered);
  }, 80);
});

// ===== 初始化 =====
renderGames(GAMES);
totalCountEl.textContent = GAMES.length;

// 防止键盘导航时的焦点样式
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') document.body.classList.add('keyboard-nav');
});
document.addEventListener('mousedown', () => {
  document.body.classList.remove('keyboard-nav');
});
