<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg1:#06222C; --bg2:#0A3A47;
    --card:#0E3240; --card-hover:#145062;
    --text:#EAF6F8; --dim:#8FB6C0; --accent:#35C3E8; --line:#1B5466;
  }
  html,body{min-height:100%}
  body{
    color:var(--text);
    font-family:'Open Sans','Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:
      radial-gradient(1100px 560px at 50% -12%, #0E3E4E 0%, transparent 60%),
      radial-gradient(900px 500px at 85% 110%, #0B3846 0%, transparent 55%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 60%);
    background-attachment:fixed;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:30px 18px 60px}
  header{text-align:center;padding-bottom:22px}
  .logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo svg{filter:drop-shadow(0 2px 6px rgba(53,195,232,.35))}
  h1{font-size:26px;font-weight:700;letter-spacing:1px}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .searchbar{
    max-width:560px;margin:20px auto 0;
    display:flex;align-items:center;gap:10px;
    padding:11px 16px;border-radius:999px;
    background:rgba(14,50,64,.65);
    border:1px solid var(--line);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .searchbar:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(53,195,232,.18), 0 8px 24px rgba(0,0,0,.35);
  }
  .searchbar svg{flex:0 0 auto;opacity:.75}
  #search{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:15px;min-width:0}
  #search::placeholder{color:var(--dim);opacity:.7}
  .badge{
    flex:0 0 auto;font-size:12px;color:var(--accent);
    background:rgba(53,195,232,.12);border:1px solid rgba(53,195,232,.3);
    padding:3px 10px;border-radius:999px;white-space:nowrap;
  }
  #grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:26px}
  .card{
    width:108px;height:108px;
    display:flex;flex-direction:column;align-items:center;
    padding:6px 6px 4px;
    background:linear-gradient(180deg, rgba(20,80,98,.55), rgba(14,50,64,.55));
    border:1px solid var(--line);
    border-radius:20px;
    text-decoration:none;color:var(--text);
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 10px 26px rgba(0,0,0,.4), 0 0 0 1px rgba(53,195,232,.25);
  }
  .card img{width:86px;height:86px;border-radius:20px;display:block;flex:0 0 auto}
  .cname{
    width:96px;margin-top:2px;flex:1 1 auto;
    font-size:9px;line-height:10px;text-align:center;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    align-self:center;
  }
  .empty{display:none;flex-direction:column;align-items:center;gap:8px;color:var(--dim);margin-top:40px;font-size:14px}
  footer{text-align:center;color:var(--dim);font-size:11px;margin-top:44px;opacity:.7}
  @media (min-width:600px){
    #grid{gap:18px}
  }
</style>
</head>

  grid.textContent = '';
  for (var i = 0; i < list.length; i++){
    var g = list[i];
    var a = document.createElement('a');
    a.className = 'card';
    a.href = '../games-web/' + g.s + '.html';
    a.setAttribute('role', 'listitem');
    a.setAttribute('title', g.n);

    img.alt = g.n;
    img.width = 86; img.height = 86;

    var sp = document.createElement('span');
    sp.className = 'cname';
    sp.textContent = g.n;

    a.appendChild(sp);
