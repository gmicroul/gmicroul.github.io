<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>

:root{
  --bg1:#0b0f14; --bg2:#131a24; --card:#161e2b; --card2:#1c2738;
  --txt:#e8eef6; --dim:#8fa3bd; --acc:#4dc3ff; --acc2:#2ee6a6;
  --border:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#1b2736 0%,var(--bg1) 55%) fixed,var(--bg1);
  color:var(--txt); min-height:100vh;
}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:8px 0 18px}
h1{font-size:24px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
h1 .mark{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 14px rgba(77,195,255,.6)}
.count{font-size:13px;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.search{
  flex:1 1 240px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:999px;padding:9px 16px;color:var(--dim);font-size:15px;
}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px;min-width:0}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{
  font-size:13px;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:999px;padding:5px 13px;cursor:pointer;transition:.15s;user-select:none;
}
.chip:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}
.chip.on{color:#06121b;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
  gap:14px;justify-content:center;
}
.card{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 12px;
  background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);
  border-radius:20px;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-3px);border-color:rgba(77,195,255,.45);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.card .ico{width:86px;height:86px;border-radius:20px;display:block;flex:none}
.card .ico img{width:86px;height:86px;display:block}
.card .nm{font-size:12.5px;line-height:1.25;text-align:center;color:var(--txt);word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.card .ct{font-size:10.5px;color:var(--dim);margin-top:2px}
.none{display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:48px 0;font-size:15px}
footer{margin-top:26px;text-align:center;color:var(--dim);font-size:12px;opacity:.7}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  h1{font-size:20px}
}
</style>
</head>

<header>

  let active = '全部';
  const cards = [];
  const allCats = ['全部', ...Array.from(new Set(GAMES.map(g=>g.c)))];
  const chipsBox = document.getElementById('chips');
  allCats.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(c==='全部'?' on':'');
    b.textContent=c; b.dataset.cat=c;
    b.addEventListener('click',()=>{
      active=c; chipsBox.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
      render();
    });
    chipsBox.appendChild(b);
  });
  GAMES.forEach(g=>{
    const a=document.createElement('a');
    a.className='card'; a.href=g.f; a.dataset.n=(g.n+' '+g.f).toLowerCase(); a.dataset.c=g.c;
    const i=document.createElement('span'); i.className='ico';
    const img=document.createElement('img'); img.src=g.i; img.alt=g.n; img.width=86; img.height=86; img.loading='lazy';
    i.appendChild(img);
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=g.n;
    const ct=document.createElement('span'); ct.className='ct'; ct.textContent=g.c;
    a.appendChild(i); a.appendChild(nm); a.appendChild(ct);
    grid.appendChild(a); cards.push(a);
  });
  function render(){
    const q=search.value.trim().toLowerCase();
    let n=0;
    cards.forEach(c=>{
      const okC=active==='全部'||c.dataset.c===active;
      const okQ=!q||c.dataset.n.indexOf(q)>=0;
      const show=okC&&okQ; c.classList.toggle('none',!show);
      if(show) n++;
    });
    cnt.textContent=n+' / '+GAMES.length;
    empty.classList.toggle('none',n>0);
  }
  search.addEventListener('input',render);
  render();
})();
