<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --bg1:#06222C; --bg2:#0A3A47;
    --card:#0E3240; --card-hover:#145062;
    --text:#EAF6F8; --dim:#8FB6C0;
    --accent:#5FD0F5; --accent2:#3AA8D0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(6,34,44,.82);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(95,208,245,.18);
    padding:14px 20px;
  }
  .bar{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo svg{width:34px;height:34px;flex:none}
  .logo em{font-style:normal;background:linear-gradient(120deg,#5FD0F5,#3AA8D0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:13px;color:var(--dim);background:rgba(95,208,245,.10);
    border:1px solid rgba(95,208,245,.25);padding:4px 12px;border-radius:999px;white-space:nowrap}
  .search{margin-left:auto;flex:1;min-width:180px;max-width:420px;position:relative}
  .search input{
    width:100%;padding:10px 16px 10px 40px;border-radius:999px;
    border:1px solid rgba(95,208,245,.30);background:rgba(14,50,64,.85);
    color:var(--text);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,208,245,.18)}
  .search input::placeholder{color:var(--dim)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
  main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
  .grid{display:grid;gap:18px 14px;grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
  @media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:22px 18px}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:26px 22px}}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:16px 8px 14px;border-radius:18px;text-decoration:none;color:var(--text);
    background:linear-gradient(150deg,rgba(20,60,76,.55),rgba(10,42,54,.55));
    border:1px solid rgba(95,208,245,.10);
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-5px);background:linear-gradient(150deg,rgba(24,72,90,.75),rgba(14,52,66,.75));
    border-color:rgba(95,208,245,.45);box-shadow:0 12px 28px rgba(4,18,24,.45);outline:none;
  }
  .icon{width:78%;max-width:112px;aspect-ratio:1/1}
  .icon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 16px rgba(20,40,60,.30))}
  .card:hover .icon svg{filter:drop-shadow(0 12px 22px rgba(20,40,60,.40))}
  .name{
    font-size:13px;font-weight:600;text-align:center;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:2.7em;
  }
  .empty{display:none;text-align:center;color:var(--dim);padding:70px 0;font-size:16px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:0 0 30px;opacity:.7}
</style>
</head>

/* SailfishOS icon template: shape_0100_1cut_BL — 86x86 square with a
   quarter-circle cut out of the bottom-left (BL) corner. Only the solid
   (non-cut) region is filled; the cut stays transparent. */
var SHAPE = "M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z M 43 86 A 43.0 43.0 0 0 1 0.0 43.0 L 0 86 Z";

/* Per-card palette — each pair is a 135 deg linear gradient.
   #5FD0F5 -> #3AA8D0 is the brand base; a few ocean/warm variants keep it lively. */
var PALETTE = [
  ["#5FD0F5","#3AA8D0"],
  ["#6FE0FF","#3AA8D0"],
  ["#5FD0F5","#2E94C4"],
  ["#7BD9FF","#3AA8D0"],
  ["#4EDCA0","#2EBD85"],
  ["#5FD0F5","#1E8FB8"],
  ["#8BE0FF","#4FC3F7"],
  ["#FFD98A","#F9A825"],
  ["#F48FB1","#E91E8C"],
  ["#7E9BF5","#5C6BC0"]
];

function hash(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
function letter(name){
  var m=/[A-Za-z0-9\u4e00-\u9fff]/.exec(name);
  return m?m[0].toUpperCase():"?";
}
function esc(s){return s.replace(/\"/g,"&quot;").replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function iconSVG(g,i){
  var c=PALETTE[hash(g.f)%PALETTE.length];
  var L=letter(g.n);
  return '<svg viewBox="0 0 86 86" role="img" aria-label="'+esc(g.n)+'">'
    +'<defs>'
    +'<linearGradient id="g'+i+'" x1="0" y1="0" x2="1" y2="1">'
    +'<stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/>'
    +'</linearGradient>'
    +'<radialGradient id="r'+i+'" cx="0.25" cy="0.25" r="0.6">'
    +'<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>'
    +'<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>'
    +'</radialGradient>'
    +'</defs>'
    +'<path d="'+SHAPE+'" fill-rule="evenodd" fill="url(#g'+i+')"/>'
    +'<path d="'+SHAPE+'" fill-rule="evenodd" fill="url(#r'+i+')"/>'
    +'<text x="43" y="47" text-anchor="middle" dominant-baseline="central" '
    +'font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" '
    +'font-size="29" font-weight="bold" fill="#FFFFFF">'+esc(L)+'</text>'
    +'</svg>';
}

var grid=document.getElementById("grid");
var cards=[];
GAMES.forEach(function(g,i){
  var a=document.createElement("a");
  a.className="card";
  a.href="/games-web/"+encodeURIComponent(g.f);
  a.target="_blank"; a.rel="noopener";
  a.innerHTML='<span class="icon">'+iconSVG(g,i)+'</span><span class="name"></span>';
  a.querySelector(".name").textContent=g.n;
  grid.appendChild(a);
  cards.push({el:a,name:(g.n+" "+g.f).toLowerCase()});
});

var countEl=document.getElementById("count");
var emptyEl=document.getElementById("empty");
var ftotal=document.getElementById("ftotal");
var total=GAMES.length;
ftotal.textContent=total;
function setCount(n){countEl.textContent=n+" / "+total+" 款游戏";}
setCount(total);

var q=document.getElementById("q");
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase(),shown=0;
  cards.forEach(function(c){
    var hit=!v||c.name.indexOf(v)!==-1;
    c.el.style.display=hit?"":"none";
    if(hit)shown++;
  });
  setCount(shown);
  emptyEl.style.display=shown?"none":"block";
});
})();
