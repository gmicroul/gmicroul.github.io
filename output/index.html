<html lang="zh-CN">
<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #21262d;
      --bg-card-hover: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-pink: #ff7bac;
      --border-color: #30363d;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f6f8fa;
        --bg-secondary: #ffffff;
        --bg-card: #ffffff;
        --bg-card-hover: #f6f8fa;
        --text-primary: #24292f;
        --text-secondary: #656d76;
        --accent-blue: #0969da;
        --accent-pink: #db2777;
        --border-color: #d0d7de;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.15);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: clamp(1rem, 2vw, 1.25rem);
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.875rem;
    }

    .stat-value {
      font-weight: 700;
      color: var(--accent-blue);
    }

    .search-wrapper {
      max-width: 560px;
      margin: 0 auto 32px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      font-size: 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: none;
    }

    .clear-btn:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .clear-btn.visible {
      display: block;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    @media (max-width: 480px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .games-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
    }

    @media (min-width: 1025px) and (max-width: 1400px) {
      .games-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 20px;
      }
    }

    @media (min-width: 1401px) {
      .games-grid {
        grid-template-columns: repeat(8, 1fr);
        gap: 20px;
      }
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-blue);
    }

    .game-card:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .icon-wrapper {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .sailfish-icon {
      width: 86px;
      height: 86px;
      position: relative;
    }

    .sailfish-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .icon-bg {
      transition: transform 0.3s ease;
    }

    .game-card:hover .icon-bg {
      transform: scale(1.05);
    }

    .icon-text {
      pointer-events: none;
      user-select: none;
    }

    .game-info {
      padding: 14px 12px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-title {
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .no-results svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      margin-top: 48px;
      padding: 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.875rem;
      border-top: 1px solid var(--border-color);
    }

    footer a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      .game-card,
      .icon-bg,
      .search-input,
      .clear-btn {
        transition: none;
      }
      .spinner {
        animation: none;
      }
    }
  </style>
</head>

    function cleanTitle(raw) {
      return raw
        .replace(/^Solo\s+/i, '')
        .replace(/\s*\|\s*.*$/, '')
        .replace(/\s*Official\s+Site$/i, '')
        .replace(/^Eaglercraft\s+Launcher\s+/i, '')
        .replace(/^Dinosaur\s+Game\s+Chrome$/i, 'Dinosaur Game')
        .replace(/^SPACEBAR\s+CLICKER$/i, 'Spacebar Clicker')
        .replace(/^Class$/i, 'Basket Random')
        .replace(/^Jump$/i, 'Doodle Jump')
        .replace(/^Sand$/i, 'Sand Game')
        .replace(/^OvOfw$/i, 'OvO')
        .replace(/^FNAF-4$/i, 'Five Nights at Freddy\'s 4')
        .replace(/^Fnaf$/i, 'Five Nights at Freddy\'s')
        .replace(/^Flappy Bird$/i, 'Flappy Bird')
        .replace(/^Geometry Dash$/i, 'Geometry Dash')
        .replace(/^Pac Man$/i, 'Pac-Man')
        .replace(/^Chess$/i, 'Chess')
        .replace(/^Minesweeper$/i, 'Minesweeper')
        .replace(/^Super Mario 64$/i, 'Super Mario 64')
        .replace(/^Rooftop Snipers 2$/i, 'Rooftop Snipers 2')
        .replace(/^Cluster Rush$/i, 'Cluster Rush')
        .replace(/^Level Devil$/i, 'Level Devil')
        .replace(/^Noob Miner$/i, 'Noob Miner')
        .replace(/^Space Waves$/i, 'Space Waves')
        .replace(/^Speedstars$/i, 'Speed Stars')
        .replace(/^Stickman Hook$/i, 'Stickman Hook')
        .replace(/^Retro-Ping-Pong$/i, 'Retro Ping Pong')
        .replace(/^Pingpongchaos$/i, 'Ping Pong Chaos')
        .replace(/^Idlebreakout$/i, 'Idle Breakout')
        .replace(/^Drawing/i, 'Drawing')
        .replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/([0-9])([A-Za-z])/g, '$1 $2')
        .replace(/([A-Za-z])([0-9])/g, '$1 $2')
        .replace(/\s+/g, ' ')
        .trim()
        .split(' ')
        .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
        .join(' ');
    }

    const GAMES = RAW_GAMES.map(g => ({ title: cleanTitle(g.title), url: g.url }));

    function generateIconSvg(index, letter) {
      const isOdd = index % 2 === 0;
      const gradientId = `grad-${index}`;
      const highlightId = `highlight-${index}`;
      const clipId = `clip-${index}`;

      const gradStart = isOdd ? '#5FD0F5' : '#FFD8E0';
      const gradEnd = isOdd ? '#3AA8D0' : '#FFB0C4';
      const textColor = letter.toUpperCase() === 'I' ? '#E85D9E' : '#FFFFFF';
      const bgGroupTransform = isOdd ? '' : 'transform="rotate(90 43 47)"';

      return `
        <svg viewBox="0 0 86 94" xmlns="http://www.w3.org/2000/svg" class="sailfish-icon">
          <defs>
            <linearGradient id="${gradientId}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
              <stop offset="0%" stop-color="${gradStart}"/>
              <stop offset="100%" stop-color="${gradEnd}"/>
            </linearGradient>
            <radialGradient id="${highlightId}" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
            <clipPath id="${clipId}">
              <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"/>
            </clipPath>
          </defs>
          <g ${bgGroupTransform} clip-path="url(#${clipId})">
            <path class="icon-bg" d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${gradientId})"/>
            <path class="icon-bg" d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${highlightId})"/>
          </g>
          <text class="icon-text" x="43" y="51" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="bold" fill="${textColor}">${letter}</text>
        </svg>
      `.trim();
    }

    function getInitial(title) {
      const match = title.match(/[A-Za-z0-9]/);
      return match ? match[0].toUpperCase() : '?';
    }

    function renderGames(games) {
      const grid = document.getElementById('games-grid');
      const noResults = document.getElementById('no-results');
      const filteredCount = document.getElementById('filtered-count');

      if (games.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        filteredCount.textContent = '0';
        return;
      }

      noResults.style.display = 'none';
      filteredCount.textContent = games.length;

      grid.innerHTML = games.map((game, idx) => {
        const initial = getInitial(game.title);
        const iconSvg = generateIconSvg(idx, initial);
        return `
          <a href="${game.url}" class="game-card" role="listitem" aria-label="${game.title}">
            <div class="icon-wrapper">${iconSvg}</div>
            <div class="game-info"><span class="game-title">${escapeHtml(game.title)}</span></div>
          </a>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    let debounceTimer = null;

    function filterGames(query) {
      const lowerQuery = query.toLowerCase().trim();
      if (!lowerQuery) { renderGames(GAMES); return; }
      const filtered = GAMES.filter(game => game.title.toLowerCase().includes(lowerQuery));
      renderGames(filtered);
    }

    searchInput.addEventListener('input', (e) => {
      const value = e.target.value;
      clearBtn.classList.toggle('visible', value.length > 0);
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => filterGames(value), 100);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      filterGames('');
      searchInput.focus();
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        filterGames('');
        searchInput.blur();
      }
    });

    renderGames(GAMES);
    document.getElementById('total-count').textContent = GAMES.length;
  </script>
