    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-primary: #58a6ff;
            --accent-secondary: #a371f7;
            --border-color: #30363d;
            --card-hover: #1f2428;
            --success: #3fb950;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(88, 166, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(163, 113, 247, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 16px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 32px;
            padding: 16px 0;
        }

        h1 {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: clamp(14px, 2.5vw, 16px);
            margin-top: 8px;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .stat-value {
            font-weight: 700;
            color: var(--accent-primary);
            font-size: 18px;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        /* Search */
        .search-wrapper {
            max-width: 560px;
            margin: 0 auto 32px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 52px;
            font-size: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: none;
            background: var(--bg-tertiary);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .search-clear:hover {
            background: var(--accent-primary);
            color: white;
        }

        .search-clear.visible {
            display: flex;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        @media (max-width: 480px) {
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .game-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1025px) and (max-width: 1280px) {
            .game-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (min-width: 1281px) {
            .game-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        /* Game Card */
        .game-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--accent-primary);
        }

        .game-card:focus-visible {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .card-icon-wrapper {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-icon {
            width: 72%;
            height: 72%;
            max-width: 80px;
            max-height: 80px;
        }

        .card-info {
            padding: 14px 12px;
            text-align: center;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* SVG Icon Styles - SailfishOS style */
        .sailfish-icon {
            width: 100%;
            height: 100%;
        }

        .sailfish-icon .bg-path {
            transition: filter 0.2s;
        }

        .game-card:hover .sailfish-icon .bg-path {
            filter: brightness(1.1);
        }

        /* Odd cards (1, 3, 5...) - Blue gradient, no rotation */
        .sailfish-icon.odd .bg-path {
            fill: url(#grad-blue);
        }
        .sailfish-icon.odd .highlight {
            fill: url(#highlight-radial);
        }
        .sailfish-icon.odd .icon-text {
            fill: #FFFFFF;
        }

        /* Even cards (2, 4, 6...) - Pink gradient, rotated 90deg */
        .sailfish-icon.even .bg-group {
            transform: rotate(90deg);
            transform-origin: 43px 47px;
        }
        .sailfish-icon.even .bg-path {
            fill: url(#grad-pink);
        }
        .sailfish-icon.even .highlight {
            fill: url(#highlight-radial);
        }
        .sailfish-icon.even .icon-text {
            fill: #FFFFFF;
        }

        /* Special case: I letter uses pink color */
        .sailfish-icon.even .icon-text.i-letter {
            fill: #E85D9E;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .game-card,
            .search-input,
            .search-clear {
                transition: none;
            }
        }

        /* High contrast mode */
        @media (prefers-contrast: high) {
            :root {
                --border-color: #58a6ff;
            }
            .game-card {
                border-width: 2px;
            }
        }
    </style>
</head>

                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
        </defs>
    </svg>

        ];

        // Filter out index.html from the list
        const filteredGames = GAMES.filter(g => g.file !== 'index.html');

        // DOM elements
        const grid = document.getElementById('game-grid');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const totalCount = document.getElementById('total-count');
        const filteredCount = document.getElementById('filtered-count');
        const footerCount = document.getElementById('footer-count');
        const emptyState = document.getElementById('empty-state');

        // Initialize counts
        totalCount.textContent = filteredGames.length;
        footerCount.textContent = filteredGames.length;

        // Generate SailfishOS-style SVG icon
        function createSailfishIcon(index, title) {
            const isOdd = (index + 1) % 2 === 1;
            const firstChar = title.trim().charAt(0).toUpperCase();
            const isILetter = firstChar === 'I';

            // Use first letter or first two characters for the icon text
            let displayText = firstChar;
            if (title.length > 1) {
                const secondChar = title.trim().charAt(1).toUpperCase();
                // If first char is not a letter, try to get a letter
                if (!/[A-Z]/.test(firstChar) && /[A-Z]/.test(secondChar)) {
                    displayText = secondChar;
                } else if (/[A-Z]/.test(firstChar)) {
                    displayText = firstChar;
                } else {
                    displayText = firstChar;
                }
            }

            const oddEvenClass = isOdd ? 'odd' : 'even';
            const textClass = (isEven && isILetter) ? 'icon-text i-letter' : 'icon-text';
            const isEven = !isOdd;

            // For even cards, the bg-group (background + highlight) is rotated 90deg
            // But text stays upright
            const bgGroupTransform = isEven ? 'transform="rotate(90 43 47)"' : '';

            return `<svg class="sailfish-icon ${oddEvenClass}" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
                <g class="bg-group" ${bgGroupTransform}>
                    <path class="bg-path" d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"/>
                    <ellipse class="highlight" cx="21.5" cy="21.5" rx="25.8" ry="25.8"/>
                </g>
                <text class="${textClass}" x="43" y="50" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="bold" font-size="29" fill="${isEven && isILetter ? '#E85D9E' : '#FFFFFF'}">${displayText}</text>
            </svg>`;
        }

        // Render game cards
        function renderGames(games) {
            grid.innerHTML = '';
            let visibleCount = 0;

            games.forEach((game, index) => {
                const card = document.createElement('a');
                card.href = '/games-web/' + game.file;
                card.className = 'game-card';
                card.role = 'listitem';
                card.setAttribute('aria-label', game.title);

                const iconHtml = createSailfishIcon(index, game.title);

                card.innerHTML = `
                    <div class="card-icon-wrapper">
                        ${iconHtml}
                    </div>
                    <div class="card-info">
                        <div class="card-title">${escapeHtml(game.title)}</div>
                    </div>
                `;

                grid.appendChild(card);
                visibleCount++;
            });

            filteredCount.textContent = visibleCount;

            // Show/hide empty state
            if (visibleCount === 0) {
                emptyState.hidden = false;
                grid.style.display = 'none';
            } else {
                emptyState.hidden = true;
                grid.style.display = 'grid';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Search functionality
        let searchTimeout;
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            searchClear.classList.toggle('visible', query.length > 0);

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const filtered = filteredGames.filter(game =>
                    game.title.toLowerCase().includes(query)
                );
                renderGames(filtered);
            }, 50);
        });

        searchClear.addEventListener('click', function() {
            searchInput.value = '';
            this.classList.remove('visible');
            renderGames(filteredGames);
            searchInput.focus();
        });

        // Keyboard support for search clear
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                searchClear.classList.remove('visible');
                renderGames(filteredGames);
                this.blur();
            }
        });

        // Initial render
        renderGames(filteredGames);

        // Focus search on load (optional - comment out if not desired)
        // searchInput.focus();
    </script>
