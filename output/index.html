<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
  :root {
    --bg1: #06222C;
    --bg2: #0A3A47;
    --card: #0E3240;
    --card-hover: #145062;
    --text: #EAF6F8;
    --dim: #8FB6C0;
    --accent: #4FC3F7;
    --accent2: #2EBD85;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(6, 34, 44, .82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(79, 195, 247, .18);
    padding: 14px 20px;
  }
  .bar { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .logo svg { width: 34px; height: 34px; flex: none; }
  .logo em { font-style: normal; background: linear-gradient(120deg, #4FC3F7, #2EBD85); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .count { font-size: 13px; color: var(--dim); background: rgba(79, 195, 247, .10); border: 1px solid rgba(79, 195, 247, .25); padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
  .search { margin-left: auto; flex: 1; min-width: 180px; max-width: 420px; position: relative; }
  .search input {
    width: 100%; padding: 10px 16px 10px 40px; border-radius: 999px;
    border: 1px solid rgba(79, 195, 247, .30); background: rgba(14, 50, 64, .85);
    color: var(--text); font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 195, 247, .18); }
  .search input::placeholder { color: var(--dim); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--dim); fill: none; stroke-width: 2.4; stroke-linecap: round; pointer-events: none; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }
  .grid { display: grid; gap: 18px 14px; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 22px 18px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 26px 22px; } }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px 8px 14px; border-radius: 18px; text-decoration: none; color: var(--text);
    background: linear-gradient(150deg, rgba(20, 60, 76, .55), rgba(10, 42, 54, .55));
    border: 1px solid rgba(79, 195, 247, .10);
    transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-5px);
    background: linear-gradient(150deg, rgba(24, 72, 90, .75), rgba(14, 52, 66, .75));
    border-color: rgba(79, 195, 247, .45);
    box-shadow: 0 12px 28px rgba(4, 18, 24, .45);
    outline: none;
  }
  .icon { width: 78%; max-width: 112px; aspect-ratio: 1/1; }
  .icon svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 16px rgba(20, 40, 60, .30)); }
  .card:hover .icon svg { filter: drop-shadow(0 12px 22px rgba(20, 40, 60, .40)); }
  .name {
    font-size: 13px; font-weight: 600; text-align: center; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-word; min-height: 2.7em;
  }
  .empty { display: none; text-align: center; color: var(--dim); padding: 70px 0; font-size: 16px; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 0 0 30px; opacity: .7; }
</style>
</head>

     5. 全部端点圆头

  var LEAF_PATH = "M" + (ICON_SIZE * 0.541) + " 0 " +  // 277.1
    "L" + ICON_SIZE + " 0 " +
    "L" + ICON_SIZE + " " + (ICON_SIZE * 0.459) + " " +  // 234.9
    "A" + ICON_SIZE + " " + ICON_SIZE + " 0 0 0 " + (ICON_SIZE * 0.459) + " " + ICON_SIZE + " " +  // 234.9
    "L0 " + ICON_SIZE + " " +
    "L0 " + (ICON_SIZE * 0.541) + " " +  // 277.1
    "A" + ICON_SIZE + " " + ICON_SIZE + " 0 0 0 " + (ICON_SIZE * 0.541) + " 0 Z";

  // 海洋色系主色调 (60%+) - 渐变配对
  var OCEAN_PALETTE = [
    {a: "#2FA8C9", b: "#0E7C8C"},  // 深青系
    {a: "#4FC3F7", b: "#19A7CE"},  // 青/天蓝系
    {a: "#7FD6FB", b: "#4FC3F7"},  // 浅蓝系
    {a: "#4EDCA0", b: "#2EBD85"},  // 海绿系
    {a: "#2EBD85", b: "#15966B"},  // 深绿系
    {a: "#2FA8C9", b: "#0E7C8C"},
    {a: "#4FC3F7", b: "#19A7CE"},
    {a: "#4EDCA0", b: "#2EBD85"},
  ];

  // 暖色强调色 (少量使用)
  var ACCENT_PALETTE = [
    {a: "#FB8A7E", b: "#F0544F"},  // 珊瑚红
    {a: "#FDB95F", b: "#F59B23"},  // 橙
    {a: "#FFE083", b: "#FFD34E"},  // 明黄
    {a: "#D98CE0", b: "#C56CD6"}   // 紫粉
  ];

  // 合并调色板，海洋色权重更高
  var PALETTE = OCEAN_PALETTE.concat(OCEAN_PALETTE).concat(OCEAN_PALETTE).concat(ACCENT_PALETTE);

  // 简单哈希函数
  function hash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) {
      h = ((h * 31) + str.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  // 提取首字母/字符
  function getInitial(name) {
    var m = name.match(/[A-Za-z0-9\u4e00-\u9fff]/);
    return m ? m[0].toUpperCase() : "?";
  }

  // 生成图标 SVG
  function generateIconSVG(game, index) {
    var paletteIndex = hash(game.file) % PALETTE.length;
    var colors = PALETTE[paletteIndex];
    var initial = getInitial(game.name);
    var isEven = (index % 2 === 1); // 双数(索引1,3,5...)旋转90度

    // 随机去除象限：基于哈希决定去除哪些象限
    // 四个象限：TL(左上)、TR(右上)、BL(左下)、BR(右下)
    // SailfishOS leaf 去除 TL 和 BR，保留 TR 和 BL
    // 我们基于哈希生成变体
    var h = hash(game.file + game.name);
    var removeTL = (h & 1) !== 0;
    var removeTR = ((h >> 1) & 1) !== 0;
    var removeBL = ((h >> 2) & 1) !== 0;
    var removeBR = ((h >> 3) & 1) !== 0;

    // 确保至少保留2个象限，最多去除2个
    var keepCount = (!removeTL) + (!removeTR) + (!removeBL) + (!removeBR);
    if (keepCount < 2) {
      removeTL = false; removeBR = false;
    }
    if (keepCount > 3) {
      removeTL = true; removeBR = true;
    }

    // 构建路径：基于去除的象限
    // 正方形顶点：(0,0) (512,0) (512,512) (0,512)
    // 内切圆心：(256,256) 半径：256
    // 四个圆弧：每个90度
    // TL: 180°-270° (左上)
    // TR: 270°-0/360° (右上)
    // BR: 0/360°-90° (右下)
    // BL: 90°-180° (左下)

    var cx = ICON_SIZE / 2;
    var cy = ICON_SIZE / 2;
    var r = ICON_SIZE / 2;

    var pathParts = [];

    // 从右上角开始，顺时针
    // TR 弧: 270° -> 360° (右上象限)
    if (!removeTR) {
      pathParts.push("M" + cx + " 0");
      pathParts.push("A" + r + " " + r + " 0 0 1 " + ICON_SIZE + " " + cx);
    } else {
      pathParts.push("M" + ICON_SIZE + " 0");
      pathParts.push("L" + ICON_SIZE + " " + cx);
    }

    // BR 弧: 0° -> 90° (右下象限)
    if (!removeBR) {
      pathParts.push("A" + r + " " + r + " 0 0 1 " + cx + " " + ICON_SIZE);
    } else {
      pathParts.push("L" + cx + " " + ICON_SIZE);
    }

    // BL 弧: 90° -> 180° (左下象限)
    if (!removeBL) {
      pathParts.push("A" + r + " " + r + " 0 0 1 0 " + cx);
    } else {
      pathParts.push("L0 " + cx);
    }

    // TL 弧: 180° -> 270° (左上象限)
    if (!removeTL) {
      pathParts.push("A" + r + " " + r + " 0 0 1 " + cx + " 0");
    } else {
      pathParts.push("L" + cx + " 0");
    }

    pathParts.push("Z");
    var customPath = pathParts.join(" ");

    // 负形文字：用首字母挖空
    // 文字大小约为安全区的 55%
    var fontSize = SAFE_SIZE * 0.55;

    var rotation = isEven ? " rotate(90 " + cx + " " + cy + ")" : "";
    var clipPathId = "clip" + index;
    var maskId = "mask" + index;
    var gradId = "grad" + index;
    var highlightId = "hl" + index;

    return '<svg viewBox="0 0 ' + ICON_SIZE + ' ' + ICON_SIZE + '" role="img" aria-label="' + game.name.replace(/"/g, "") + '">' +
      '<defs>' +
      '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + colors.a + '"/>' +
      '<stop offset="1" stop-color="' + colors.b + '"/>' +
      '</linearGradient>' +
      '<mask id="' + maskId + '">' +
      '<path d="' + customPath + '" fill="#fff"/>' +
      '<text x="' + cx + '" y="' + (cy + fontSize * 0.35) + '" text-anchor="middle" dominant-baseline="central" ' +
      'font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="' + fontSize + '" font-weight="800" fill="#000">' + initial + '</text>' +
      '</mask>' +
      '<clipPath id="' + clipPathId + '"><path d="' + customPath + '"/></clipPath>' +
      // 高光渐变
      '<radialGradient id="' + highlightId + '" cx="30%" cy="30%" r="70%">' +
      '<stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>' +
      '<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>' +
      '</radialGradient>' +
      '</defs>' +
      '<g transform="translate(' + MARGIN + ' ' + MARGIN + ') scale(' + SAFE_RATIO + ')' + rotation + '">' +
      '<g>' +
      '<path d="' + customPath + '" fill="url(#' + gradId + ')" mask="url(#' + maskId + ')"/>' +
      // 裁切内的高光
      '<g clip-path="url(#' + clipPathId + ')">' +
      '<ellipse cx="' + (cx * 0.55) + '" cy="' + (cy * 0.4) + '" rx="' + (r * 0.7) + '" ry="' + (r * 0.35) + '" fill="url(#' + highlightId + ')" transform="rotate(-25 ' + (cx * 0.55) + ' ' + (cy * 0.4) + ')"/>' +
      '</g>' +
      '</g>' +
      '</g></svg>';
  }

  var grid = document.getElementById("grid");
  var cards = [];

  GAMES.forEach(function(g, i) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = "/games-web/" + encodeURIComponent(g.file);
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = '<span class="icon">' + generateIconSVG(g, i) + '</span><span class="name"></span>';
    a.querySelector(".name").textContent = g.name;
    grid.appendChild(a);
    cards.push({el: a, name: g.name.toLowerCase()});
  });

  var countEl = document.getElementById("count");
  var emptyEl = document.getElementById("empty");
  var total = GAMES.length;
  function setCount(n) { countEl.textContent = n + " / " + total + " 款游戏"; }
  setCount(total);

  var q = document.getElementById("q");
  q.addEventListener("input", function() {
    var v = q.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function(c) {
      var hit = !v || c.name.indexOf(v) !== -1;
      c.el.style.display = hit ? "" : "none";
      if (hit) shown++;
    });
    setCount(shown);
    emptyEl.style.display = shown ? "none" : "block";
  });
})();
</script>
</body>
</html>
