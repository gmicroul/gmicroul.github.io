<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --bg1:#06222C; --bg2:#0A3A47;
    --card:#0E3240; --card-hover:#145062;
    --text:#EAF6F8; --dim:#8FB6C0;
    --accent:#4FC3F7;
    --grad-a:#5FD0F5; --grad-b:#3AA8D0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(6,34,44,.82);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(79,195,247,.18);
    padding:14px 20px;
  }
  .bar{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo-ic{width:34px;height:34px;flex:none}
  .logo em{font-style:normal;background:linear-gradient(120deg,var(--grad-a),var(--grad-b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:13px;color:var(--dim);background:rgba(79,195,247,.10);
    border:1px solid rgba(79,195,247,.25);padding:4px 12px;border-radius:999px;white-space:nowrap}
  .search{margin-left:auto;flex:1;min-width:180px;max-width:420px;position:relative}
  .search input{
    width:100%;padding:10px 16px 10px 40px;border-radius:999px;
    border:1px solid rgba(79,195,247,.30);background:rgba(14,50,64,.85);
    color:var(--text);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.18)}
  .search input::placeholder{color:var(--dim)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
  main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
  .grid{display:grid;gap:16px 12px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  @media(min-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:20px 16px}}
  @media(min-width:840px){.grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 20px}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:28px 22px}}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:16px 8px 14px;border-radius:18px;text-decoration:none;color:var(--text);
    background:linear-gradient(150deg,rgba(20,60,76,.55),rgba(10,42,54,.55));
    border:1px solid rgba(79,195,247,.10);
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-5px);background:linear-gradient(150deg,rgba(24,72,90,.75),rgba(14,52,66,.75));
    border-color:rgba(79,195,247,.45);box-shadow:0 12px 28px rgba(4,18,24,.45);outline:none;
  }
  .icon{width:78%;max-width:112px;aspect-ratio:1/1}
  .icon svg{width:100%;height:100%;display:block;overflow:visible;
    filter:drop-shadow(0 8px 16px rgba(20,40,60,.30))}
  .card:hover .icon svg{filter:drop-shadow(0 12px 22px rgba(20,40,60,.40))}
  .name{
    font-size:13px;font-weight:600;text-align:center;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:2.7em;max-width:100%;
  }
  .empty{display:none;text-align:center;color:var(--dim);padding:70px 0;font-size:16px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:0 0 30px;opacity:.7}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">
      <svg class="logo-ic" viewBox="0 0 86 86" aria-hidden="true">
        <defs>
          <linearGradient id="lgL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5FD0F5"/><stop offset="1" stop-color="#3AA8D0"/>
          </linearGradient>
          <clipPath id="lcL"><path d="M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z M 0 43 A 43.0 43.0 0 0 1 43.0 0.0 L 0 0 Z" fill-rule="evenodd"/></clipPath>
        </defs>
        <rect x="0" y="0" width="86" height="86" fill="url(#lgL)" clip-path="url(#lcL)"/>
      </svg>
      <span>游戏<em>大厅</em></span>
    </div>
    <span class="count" id="count"></span>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="q" type="search" placeholder="搜索游戏… / Search games" autocomplete="off" aria-label="搜索游戏">
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有找到匹配的游戏 / No games found</div>
</main>
<footer>Game Hub</footer>

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function firstLetter(name){

/* Render one shaped icon.
   - shape d: the 16-path set, cycled by index. Its evenodd solid region is
     the fill area; cut corners remain transparent.
   - fill: 135deg linear gradient  (#5FD0F5 -> #3AA8D0), x1=0,y1=0 -> x2=1,y2=1.

   - label: white bold system-ui 29px, centred at (43,47). */
function iconSVG(idx,name){
  var d = SHAPES[idx % SHAPES.length];
  var L = firstLetter(name);
  return '<svg viewBox="0 0 86 86" role="img" aria-label="'+esc(name)+'">'
    +'<defs>'
    +'<linearGradient id="g'+idx+'" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">'
    +'<stop offset="0" stop-color="'+GRAD.a+'"/><stop offset="1" stop-color="'+GRAD.b+'"/>'
    +'</linearGradient>'
    +'<radialGradient id="h'+idx+'" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">'
    +'<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>'
    +'<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>'
    +'</radialGradient>'
    +'<clipPath id="c'+idx+'"><path d="'+d+'" fill-rule="evenodd"/></clipPath>'
    +'</defs>'
    +'<path d="'+d+'" fill="url(#g'+idx+')" fill-rule="evenodd"/>'
    +'<rect x="0" y="0" width="86" height="86" fill="url(#h'+idx+')" clip-path="url(#c'+idx+')"/>'
    +'<text x="43" y="47" text-anchor="middle" dominant-baseline="central" '
    +'font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" '
    +'font-weight="bold" font-size="29" fill="#FFFFFF">'+L+'</text>'
    +'</svg>';
}

var grid=document.getElementById("grid");
var cards=[];
GAMES.forEach(function(g,i){
  var a=document.createElement("a");
  a.className="card";
  /* Absolute root path — works on GitHub Pages regardless of current URL depth. */
  a.href="/games-web/"+encodeURIComponent(g[1]);
  a.target="_blank"; a.rel="noopener";
  a.innerHTML='<span class="icon">'+iconSVG(i,g[0])+'</span><span class="name"></span>';
  a.querySelector(".name").textContent=g[0];
  grid.appendChild(a);
  cards.push({el:a,name:g[0].toLowerCase()});
});

var countEl=document.getElementById("count");
var emptyEl=document.getElementById("empty");
var total=GAMES.length;
function setCount(n){countEl.textContent=n+" / "+total+" 款游戏";}
setCount(total);

var q=document.getElementById("q");
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase(),shown=0;
  cards.forEach(function(c){
    var hit=!v||c.name.indexOf(v)!==-1;
    c.el.style.display=hit?"":"none";
    if(hit)shown++;
  });
  setCount(shown);
  emptyEl.style.display=shown?"none":"block";
});
})();
</script>
