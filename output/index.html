<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1420">
<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --bg:#0b1420; --bg2:#111d2e;
    --tile:#152238; --tile-2:#1a2b42;
    --line:rgba(0,200,224,.18);
    --line-2:rgba(255,255,255,.06);
    --text:#e8f4f8; --dim:#7f97ad;
    --accent:#00c8e0; --accent-2:#00a9cc;
    --ok:#2ec27e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,#131f33 0%,var(--bg) 55%,#070d16 100%);
    background-attachment:fixed;
    color:var(--text);min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(11,20,32,.82);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:14px 18px calc(12px + env(safe-area-inset-top));
  }
  .bar{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
  .brand svg{width:30px;height:30px;flex:none}
  .brand em{font-style:normal;color:var(--accent)}
  .count{
    font-size:12px;color:var(--accent);font-weight:600;
    background:rgba(0,200,224,.10);border:1px solid var(--line);
    padding:4px 12px;white-space:nowrap;min-width:56px;text-align:center;
  }
  .search{margin-left:auto;flex:1;min-width:170px;max-width:420px;position:relative}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
  .search input{
    width:100%;padding:10px 14px 10px 38px;border-radius:2px;
    border:1px solid var(--line);background:rgba(21,34,56,.9);
    color:var(--text);font-size:15px;outline:none;
    transition:border-color .18s,box-shadow .18s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,200,224,.22)}
  .search input::placeholder{color:var(--dim)}
  main{max-width:1100px;margin:0 auto;padding:22px 18px 72px}
  .grid{
    display:grid;gap:20px 14px;
    grid-template-columns:repeat(2,1fr);justify-items:center;
  }
  @media(min-width:560px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:24px 18px}
  }
  @media(min-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:28px 22px}
  }
  .cell{
    display:flex;flex-direction:column;align-items:center;gap:9px;
    text-decoration:none;color:var(--text);outline:none;
    animation:in .28s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tile{
    width:108px;height:108px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--tile-2),var(--tile));
    border:1px solid var(--line-2);
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;
  }
  .cell:hover .tile,.cell:focus-visible .tile{
    transform:translateY(-3px);
    border-color:var(--accent);
    box-shadow:0 10px 22px rgba(0,0,0,.45),0 0 0 1px rgba(0,200,224,.25) inset;
    background:linear-gradient(160deg,#1d3150,var(--tile));
  }
  .icon{width:86px;height:86px;display:block}
  .name{
    max-width:118px;font-size:11.5px;line-height:1.25;color:var(--text);
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cell:hover .name{color:var(--accent)}
  .empty{
    display:none;grid-column:1/-1;text-align:center;color:var(--dim);
    padding:60px 0;font-size:14px;letter-spacing:.3px;
  }
  .empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px}
  .badge{font-size:10.5px;color:var(--dim);letter-spacing:.5px}
  footer{max-width:1100px;margin:0 auto;padding:0 18px 40px;color:var(--dim);font-size:11.5px;text-align:center;letter-spacing:.4px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="24" height="24" fill="none" stroke="#00c8e0" stroke-width="2.4"/><path d="M10 20l4-6 3 4 2-3 3 5z" fill="#00c8e0"/></svg>
      <span>游戏<em>大厅</em></span>
    </div>
    <div class="count" id="count">0</div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="搜索游戏…" autocomplete="off" aria-label="搜索游戏">
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"><b>没有找到游戏</b>换个关键词试试吧</div>
</main>
<footer>SFOS 风格游戏大厅 · 共 <span id="total">0</span> 款游戏 · 点击图标进入游戏</footer>

  function render(){

      if(kw && g.n.toLowerCase().indexOf(kw)===-1 && g.u.toLowerCase().indexOf(kw)===-1) continue;
      vis++;
      var a=document.createElement('a');
      a.className='cell';
      a.href=g.u;
      a.style.animationDelay=(Math.min(vis,24)*22)+'ms';
      a.setAttribute('tabindex','0');

    }
    grid.innerHTML='';
    grid.appendChild(frag);
