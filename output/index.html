<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg0:#0a1520; --bg1:#0e1f2e; --card:#12293a; --card-hi:#16344a;
  --line:rgba(79,195,247,.14); --txt:#e8f4f8; --dim:#8fb3c4;
  --accent:#19A7CE; --accent2:#4FC3F7;
  --shadow:0 10px 28px rgba(20,40,60,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 700px at 15% -10%, #123048 0%, var(--bg1) 45%, var(--bg0) 100%) fixed;
  color:var(--txt); min-height:100vh;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 64px}
header{padding:40px 0 8px;text-align:center}
h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:.5px;
  background:linear-gradient(135deg,#4FC3F7,#2EBD85);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);margin-top:8px;font-size:14px}
.bar{position:sticky;top:0;z-index:10;padding:14px 0 12px;margin-top:18px;
  background:linear-gradient(rgba(10,21,32,.92),rgba(10,21,32,.86));backdrop-filter:blur(10px)}
.searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:12px 16px;transition:border-color .2s, box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,167,206,.18)}
.search svg{flex:none;opacity:.7}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:16px;min-width:0}
.search input::placeholder{color:var(--dim)}
.count{flex:none;font-size:13px;color:var(--dim);background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 16px;white-space:nowrap}
.count b{color:var(--accent2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:22px}
.card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 12px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;
  text-decoration:none;color:var(--txt);
  transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease}
.card:hover,.card:focus-visible{transform:translateY(-4px);background:var(--card-hi);
  border-color:rgba(79,195,247,.4);box-shadow:var(--shadow);outline:none}
.card:active{transform:translateY(-1px) scale(.98)}
.icon{width:72px;height:72px;flex:none;filter:drop-shadow(0 6px 12px rgba(20,40,60,.35));
  transition:transform .18s ease}
.card:hover .icon{transform:scale(1.06)}
.name{font-size:13.5px;font-weight:600;text-align:center;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.empty{text-align:center;color:var(--dim);padding:64px 0;display:none}
.empty.show{display:block}
footer{margin-top:48px;text-align:center;color:var(--dim);font-size:12px;opacity:.7}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
  .icon{width:60px;height:60px}
  .name{font-size:12px}
  header{padding:28px 0 4px}
  .count{width:100%;text-align:center;padding:10px 12px}
}
</style>
</head>

var PALETTE = [

function hash(str){
  var h = 5381;
  for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
}

function squirclePath(cx, cy, r, n){
  n = n || 4; var pts = [];
  for (var i = 0; i < 72; i++){
    var t = i / 72 * Math.PI * 2;
    var c = Math.cos(t), s = Math.sin(t);
    var x = Math.sign(c) * Math.pow(Math.abs(c), 2 / n) * r + cx;
    var y = Math.sign(s) * Math.pow(Math.abs(s), 2 / n) * r + cy;
    pts.push((i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1));
  }
  return pts.join(" ") + " Z";
}

function dropletPath(cx, cy, r){
  var t = cy - r * 1.06, b = cy + r * 0.92, l = cx - r * 0.95, rr = cx + r * 0.95;

    " " + rr.toFixed(1) + " " + (cy - r * 0.18).toFixed(1) +
    " " + rr.toFixed(1) + " " + (cy + r * 0.12).toFixed(1) +

    " C " + l.toFixed(1) + " " + (cy - r * 0.2).toFixed(1) +
    " " + (cx - r * 0.32).toFixed(1) + " " + (cy - r * 0.58).toFixed(1) +
    " " + cx + " " + t.toFixed(1) + " Z";

  grad.setAttribute("x1", "0%"); grad.setAttribute("y1", "0%");
  grad.setAttribute("x2", "100%"); grad.setAttribute("y2", "100%");
  var s1 = document.createElementNS(SVGNS, "stop");
  s1.setAttribute("offset", "0%"); s1.setAttribute("stop-color", cols[0]);
  var s2 = document.createElementNS(SVGNS, "stop");
  s2.setAttribute("offset", "100%"); s2.setAttribute("stop-color", cols[1]);
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad);
  svg.appendChild(defs);

  var R = 38.5;
  var bg;
  if (shape === 0){
    bg = document.createElementNS(SVGNS, "circle");
    bg.setAttribute("cx", "48"); bg.setAttribute("cy", "48"); bg.setAttribute("r", R);
  } else {
    bg = document.createElementNS(SVGNS, "path");
    bg.setAttribute("d", shape === 1 ? squirclePath(48, 48, R, 4.2) : dropletPath(48, 48, R));
  }
  bg.setAttribute("fill", "url(#" + id + ")");
  svg.appendChild(bg);

  var hi = document.createElementNS(SVGNS, "ellipse");
  hi.setAttribute("cx", "36"); hi.setAttribute("cy", "30");
  hi.setAttribute("rx", "20"); hi.setAttribute("ry", "12");
  hi.setAttribute("fill", "rgba(255,255,255,0.14)");
  hi.setAttribute("transform", "rotate(-24 36 30)");
  svg.appendChild(hi);

  var txt = document.createElementNS(SVGNS, "text");
  txt.setAttribute("x", "48");
  txt.setAttribute("y", shape === 2 ? "55" : "49");
  txt.setAttribute("text-anchor", "middle");
  txt.setAttribute("dominant-baseline", "central");
  txt.setAttribute("fill", "#FFFFFF");
  txt.setAttribute("font-size", "42");
  txt.setAttribute("font-weight", "800");
  txt.setAttribute("font-family", "-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif");
  txt.textContent = letter;
  svg.appendChild(txt);
  return svg;
}

var grid = document.getElementById("grid");
var cards = [];
GAMES.forEach(function(g){
  var a = document.createElement("a");
  a.className = "card";
  a.href = g.h;
  a.setAttribute("data-name", g.n.toLowerCase());
  a.appendChild(makeIcon(g.n, g.h));
  var span = document.createElement("span");
  span.className = "name";
  span.textContent = g.n;
  a.appendChild(span);
  grid.appendChild(a);
  cards.push(a);
});

document.getElementById("total").textContent = GAMES.length;
document.getElementById("shown").textContent = GAMES.length;
document.getElementById("footcount").textContent = GAMES.length;

var q = document.getElementById("q");
var empty = document.getElementById("empty");
var shownEl = document.getElementById("shown");
q.addEventListener("input", function(){
  var term = q.value.trim().toLowerCase();
  var shown = 0;
  cards.forEach(function(c){
    var hit = !term || c.getAttribute("data-name").indexOf(term) !== -1;
    c.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  shownEl.textContent = shown;
  empty.classList.toggle("show", shown === 0);
});
</script>
</body>
</html>
