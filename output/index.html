<title>游戏大厅 · SFOS Game Hub</title>
<style>
  :root{
    --bg1:#0a0f14; --bg2:#12202e;
    --panel:#131c26; --panel2:#0e1620;
    --line:rgba(130,190,255,.14);
    --text:#e8f1fa; --dim:#8aa0b4;
    --accent:#35b6ff; --accent2:#2ecc9e;
    --glow:rgba(53,182,255,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Open Sans","SF Pro Display","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,rgba(53,182,255,.10),transparent 60%),
               radial-gradient(900px 500px at 90% 110%,rgba(46,204,158,.08),transparent 60%),
               linear-gradient(165deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(12,18,26,.82);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.3px}
  .brand .dot{
    width:26px;height:26px;border-radius:50%;
    background:conic-gradient(from 40deg,var(--accent),var(--accent2),var(--accent));
    box-shadow:0 0 18px var(--glow);flex:none;
  }
  .brand em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{
    font-size:12.5px;color:var(--dim);background:rgba(53,182,255,.10);
    border:1px solid var(--line);padding:5px 12px;border-radius:99px;white-space:nowrap;font-weight:600;
  }
  .count b{color:var(--accent);font-weight:800}
  .search{margin-left:auto;flex:1;min-width:180px;max-width:400px;position:relative}
  .search input{
    width:100%;padding:10px 16px 10px 38px;border-radius:10px;
    border:1px solid var(--line);background:rgba(18,28,38,.9);
    color:var(--text);font-size:14.5px;outline:none;transition:border-color .18s,box-shadow .18s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(53,182,255,.18)}
  .search::before{
    content:"";position:absolute;left:13px;top:50%;width:12px;height:12px;margin-top:-7px;
    border:2px solid var(--dim);border-radius:50%;
  }
  .search::after{
    content:"";position:absolute;left:22px;top:50%;width:6px;height:2px;margin-top:5px;
    background:var(--dim);transform:rotate(45deg);
  }
  main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,108px);gap:12px;justify-content:center;
  }
  a.card{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:3px;padding:4px 8px;
    width:108px;height:108px;
    text-decoration:none;color:var(--text);
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:0;
    transition:transform .16s ease,border-color .16s,box-shadow .16s;
  }
  a.card .icon{
    width:86px;height:86px;border-radius:0;overflow:hidden;flex:none;
    background:#0a1018;box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  a.card .icon img{width:100%;height:100%;display:block}
  a.card .nm{
    font-size:10.5px;font-weight:600;text-align:center;line-height:1.25;
    display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:100%;
  }
  a.card:hover{transform:translateY(-3px);border-color:rgba(53,182,255,.45);box-shadow:0 10px 22px rgba(0,0,0,.4)}
  a.card:active{transform:scale(.97)}
  .empty{display:none;grid-column:1/-1;text-align:center;color:var(--dim);padding:48px 0;font-size:15px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:18px;opacity:.7}
</style>
</head>
<body>
<header>
  <div class="bar">

    <div class="search"><input id="q" type="search" placeholder="搜索游戏…" autocomplete="off"></div>
  </div>
</header>
<main>

</main>

  ];
  var grid=document.getElementById('grid'),empty=document.getElementById('empty'),cnt=document.getElementById('count');
  function render(q){
    q=q.toLowerCase().trim();
    var list=GAMES.filter(function(g){
      if(!q) return true;
      return g.n.toLowerCase().indexOf(q)>-1 || g.f.toLowerCase().indexOf(q)>-1;
    });
    grid.innerHTML='';
    list.forEach(function(g){
      var a=document.createElement('a');
      a.className='card';
      a.href='../games-web/'+g.f;
      a.title=g.n;
      a.innerHTML='<span class="icon"><img src="icons/'+g.i+'" alt="'+g.n+'"></span><span class="nm"></span>';
      a.querySelector('.nm').textContent=g.n;
      grid.appendChild(a);
    });
    empty.style.display=list.length?'none':'block';
    cnt.innerHTML='<b>'+list.length+'</b> / '+GAMES.length+' 款游戏';
  }
  document.getElementById('q').addEventListener('input',function(){render(this.value);});
  render('');
})();
</script>
