<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg0:#0b1020; --bg1:#131c33; --card:#182244; --card-hi:#1f2c58;
  --text:#eaf0ff; --muted:#8fa0c8; --accent:#4fc3f7; --accent2:#7c4dff;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(124,77,255,.22), transparent 60%),
    radial-gradient(1000px 600px at -10% 110%, rgba(79,195,247,.16), transparent 55%),
    linear-gradient(160deg, var(--bg0), var(--bg1));
  min-height:100vh;
  padding:0 16px 60px;
}
header{
  max-width:1200px;margin:0 auto;padding:36px 4px 18px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;
}
h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:.5px}
h1 .dot{color:var(--accent)}
.subtitle{color:var(--muted);font-size:14px;margin-top:6px}
.count-badge{
  margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;
  box-shadow:0 6px 18px rgba(79,195,247,.35);white-space:nowrap;
}
.toolbar{
  max-width:1200px;margin:0 auto 26px;position:sticky;top:10px;z-index:10;
}
.search{
  width:100%;padding:14px 20px 14px 48px;font-size:16px;color:var(--text);
  background:rgba(24,34,68,.85);backdrop-filter:blur(8px);
  border:1px solid rgba(143,160,200,.25);border-radius:var(--radius);
  outline:none;transition:border-color .2s, box-shadow .2s;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%238fa0c8' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><line x1='16.5' y1='16.5' x2='21' y2='21'/></svg>");
  background-repeat:no-repeat;background-position:16px center;
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.2)}
.search::placeholder{color:var(--muted)}
.grid{
  max-width:1200px;margin:0 auto;
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
}
.card{
  background:var(--card);border:1px solid rgba(143,160,200,.14);
  border-radius:var(--radius);padding:18px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  cursor:pointer;transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  user-select:none;text-decoration:none;color:inherit;
}
.card:hover{transform:translateY(-5px) scale(1.03);background:var(--card-hi);
  box-shadow:0 14px 30px rgba(0,0,0,.35)}
.card:active{transform:translateY(-1px) scale(.98)}
/* SailfishOS 风格图标：不规则圆角（非直边）+ 渐变 + 字母 */
.icon{
  width:72px;height:72px;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.18), inset 0 4px 8px rgba(255,255,255,.22),
             0 6px 14px rgba(0,0,0,.3);
  transition:border-radius .3s ease;
}
.card:hover .icon{transition:border-radius .3s ease}
.name{
  font-size:13px;font-weight:600;text-align:center;line-height:1.3;
  max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;word-break:break-word;
}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);
  padding:60px 0;font-size:16px;
}
footer{max-width:1200px;margin:40px auto 0;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
  .icon{width:58px;height:58px;font-size:24px}
  .card{padding:14px 6px 12px}
  .name{font-size:12px}
  header{padding-top:26px}
}
</style>
</head>

// —— SailfishOS 风格图标生成 ——
// 调色板（海洋系渐变，呼应 Sailfish 的 ambiences）
var PALETTES = [
  ["#00bcd4","#006064"], ["#4fc3f7","#1a237e"], ["#7c4dff","#311b92"],
  ["#ff7043","#bf360c"], ["#66bb6a","#1b5e20"], ["#ec407a","#880e4f"],
  ["#ffca28","#e65100"], ["#26c6da","#004d40"], ["#ab47bc","#4a148c"],
  ["#5c6bc0","#1a237e"], ["#ef5350","#b71c1c"], ["#9ccc65","#33691e"],
  ["#29b6f6","#01579b"], ["#ffa726","#e65100"], ["#8d6e63","#3e2723"],
  ["#78909c","#263238"]
];
function hashStr(s){
  var h = 0;
  for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
// 生成不规则圆角：四条边不必是直边（squircle/blob 形状）
function blobRadius(seed){
  function r(n){ return 22 + (seed % n); }
  var a = r(28), b = r(34), c = r(30), d = r(26),
      e = r(32), f = r(24), g = r(30), h = r(28);
  return a + "% " + (100 - a) + "% " + b + "% " + (100 - b) + "% / " +
         c + "% " + d + "% " + (100 - d) + "% " + (100 - c) + "%";
}
function makeIcon(name){
  var seed = hashStr(name);
  var pal = PALETTES[seed % PALETTES.length];
  var el = document.createElement("div");
  el.className = "icon";
  el.textContent = name.trim().charAt(0).toUpperCase();
  el.style.background = "linear-gradient(145deg," + pal[0] + "," + pal[1] + ")";
  el.style.borderRadius = blobRadius(seed);
  return el;
}

  badge.textContent = "共 " + list.length + " 款游戏";
  if (!list.length){
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "没有找到匹配的游戏";
    grid.appendChild(empty);
    return;
  }
  var frag = document.createDocumentFragment();
  list.forEach(function(g){
    var a = document.createElement("a");
    a.className = "card";
    a.href = g.url;
    a.title = g.name;
    a.appendChild(makeIcon(g.name));
    var n = document.createElement("div");
    n.className = "name";
    n.textContent = g.name;
    a.appendChild(n);
    frag.appendChild(a);
  });
  grid.appendChild(frag);
}
function filter(){
  var q = box.value.trim().toLowerCase();
  if (!q){ render(GAMES); return; }
  render(GAMES.filter(function(g){
    return g.name.toLowerCase().indexOf(q) !== -1 ||
           g.url.toLowerCase().indexOf(q) !== -1;
  }));
}
box.addEventListener("input", filter);
render(GAMES);
</script>
</body>
</html>
