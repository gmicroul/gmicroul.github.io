<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg0:#06222e; --bg1:#0a3242; --bg2:#0e4257;
  --card:rgba(255,255,255,.055);
  --card-hover:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.09);
  --text:#eef6f8; --muted:#8fb4c0;
  --accent:#4fc3f7; --accent2:#2ebd85;
  --shadow:rgba(10,26,36,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(79,195,247,.16), transparent 60%),
    radial-gradient(900px 500px at 95% 10%, rgba(46,189,133,.12), transparent 55%),
    linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
  background-attachment:fixed;
}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 60px}

/* ---------- header ---------- */
header.hero{
  display:flex;flex-wrap:wrap;align-items:center;gap:18px;
  padding:22px 24px;border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid var(--line);
  box-shadow:0 18px 40px -18px var(--shadow);
  backdrop-filter:blur(8px);
}
.hero .logo{
  width:64px;height:64px;flex:0 0 64px;border-radius:20px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#19a7ce,#0e7c8c);
  box-shadow:0 10px 24px -8px rgba(20,40,60,.6), inset 0 1px 0 rgba(255,255,255,.35);
}
.hero h1{font-size:clamp(20px,3.4vw,30px);letter-spacing:.5px;font-weight:800}
.hero h1 span{color:var(--accent)}
.hero p.sub{color:var(--muted);font-size:13px;margin-top:4px}
.hero .grow{flex:1}
.count-badge{
  display:flex;align-items:baseline;gap:8px;
  padding:10px 18px;border-radius:16px;
  background:rgba(79,195,247,.12);border:1px solid rgba(79,195,247,.3);
}
.count-badge b{font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.count-badge i{font-style:normal;color:var(--muted);font-size:13px}

/* ---------- search ---------- */
.searchbar{
  position:sticky;top:12px;z-index:50;margin:22px 0 26px;
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;border-radius:18px;
  background:rgba(8,34,46,.82);border:1px solid var(--line);
  box-shadow:0 14px 30px -14px var(--shadow);
  backdrop-filter:blur(10px);
}
.searchbar svg{flex:0 0 auto;opacity:.7}
.searchbar input{
  flex:1;background:transparent;border:0;outline:0;
  color:var(--text);font-size:16px;
}
.searchbar input::placeholder{color:var(--muted)}
.searchbar .hit{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.searchbar .clear{
  display:none;border:0;cursor:pointer;color:var(--muted);
  background:rgba(255,255,255,.08);width:26px;height:26px;border-radius:50%;
  font-size:14px;line-height:1;
}
.searchbar .clear:hover{background:rgba(255,255,255,.16);color:#fff}

/* ---------- grid ---------- */
.grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
}
.card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:20px 12px 16px;border-radius:20px;cursor:pointer;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-5px);
  background:var(--card-hover);
  border-color:rgba(79,195,247,.45);
  box-shadow:0 20px 36px -16px rgba(20,40,60,.7);
  outline:none;
}
.card:active{transform:translateY(-2px) scale(.98)}
.icon{
  width:84px;height:84px;flex:0 0 84px;
  filter:drop-shadow(0 8px 14px rgba(20,40,60,.35));
  transition:transform .18s ease;
}
.card:hover .icon{transform:scale(1.07) rotate(-2deg)}
.icon svg{width:100%;height:100%;display:block}
.name{
  font-size:13.5px;font-weight:600;text-align:center;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;min-height:2.7em;
}
.empty{
  display:none;text-align:center;color:var(--muted);
  padding:70px 0;font-size:15px;
}
.empty.show{display:block}

footer{margin-top:46px;text-align:center;color:var(--muted);font-size:12px}
footer a{color:var(--accent);text-decoration:none}

/* ---------- responsive ---------- */
@media (max-width:900px){ .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px} }
@media (max-width:560px){
  .wrap{padding:16px 12px 48px}
  .grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .icon{width:64px;height:64px;flex-basis:64px}
  .card{padding:14px 6px 12px;border-radius:16px}
  .name{font-size:12px}
  header.hero{padding:16px;border-radius:18px}
  .hero .logo{width:52px;height:52px;flex-basis:52px;border-radius:16px}
  .count-badge{padding:8px 12px}.count-badge b{font-size:20px}
}
@media (max-width:360px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

/* ================= SailfishOS 风格图标生成 =================
   - 母形：超椭圆 squircle（连续曲率，超椭圆 n=5 近似）
   - 负形：白色字形符号，无描边，圆头
   - 光源左上，渐变 135°，同色系深浅渐变
   - 高光：左上小面积半透明白色叠层
   - 颜色：海洋系为主，少量暖色点缀，每图标 ≤3 色        */
const PALETTES = [
  ["#0E7C8C","#19A7CE"],  /* 深青 -> 青 */
  ["#0B5E6B","#0E7C8C"],  /* 墨青 -> 深青 */
  ["#19A7CE","#4FC3F7"],  /* 青 -> 天蓝 */
  ["#15966B","#2EBD85"],  /* 深绿 -> 海绿 */
  ["#0F7A58","#2EBD85"],  /* 森绿 -> 海绿 */
  ["#C73E3A","#F0544F"],  /* 珊瑚红（点缀） */
  ["#E8851A","#F59B23"],  /* 橙（点缀） */
  ["#C56CD6","#E85D9E"],  /* 紫粉渐变（点缀） */
];

/* 超椭圆路径：|x/a|^n + |y/b|^n = 1，n=5 近似 squircle 连续曲率 */
function squirclePath(cx, cy, r, n){
  const pts = [];
  const steps = 96;
  for (let i = 0; i < steps; i++){
    const t = (i / steps) * Math.PI * 2;
    const c = Math.cos(t), s = Math.sin(t);
    const x = cx + r * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    const y = cy + r * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    pts.push((i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1));
  }
  return pts.join(" ") + " Z";
}
const SQUIRCLE = squirclePath(256, 256, 236, 5);

function hashStr(s){
  let h = 0;
  for (let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return h;
}

let uid = 0;
function iconSVG(title){
  const h = hashStr(title);
  const [c0, c1] = PALETTES[h % PALETTES.length];
  /* 字形：取标题首个字母/数字 */
  const ch = (title.match(/[A-Za-z0-9\u4e00-\u9fa5]/) || ["?"])[0].toUpperCase();
  const g = "g" + (uid++);
  return `<svg viewBox="0 0 512 512" role="img" aria-label="${title.replace(/"/g,"&quot;")}">
  <defs>
    <linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c1}"/>
      <stop offset="1" stop-color="${c0}"/>
    </linearGradient>
    <radialGradient id="${g}h" cx="0.32" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="${g}c"><path d="${SQUIRCLE}"/></clipPath>
  </defs>
  <path d="${SQUIRCLE}" fill="url(#${g})"/>
  <g clip-path="url(#${g}c)">
    <path d="${SQUIRCLE}" fill="url(#${g}h)"/>
    <!-- 45° 柔和长投影（扁平长影，全套统一） -->
    <text x="276" y="386" text-anchor="middle"
      font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
      font-size="250" font-weight="800" fill="rgba(20,40,60,0.22)">${ch}</text>
    <!-- 负形符号：纯白字形，无描边 -->
    <text x="256" y="366" text-anchor="middle"
      font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
      font-size="250" font-weight="800" fill="#ffffff">${ch}</text>
  </g>
</svg>`;
}

/* ================= 渲染 ================= */
const grid = document.getElementById("grid");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const hitEl = document.getElementById("hitCount");
const clearBtn = document.getElementById("clearBtn");

document.getElementById("totalCount").textContent = GAMES.length;
document.getElementById("footCount").textContent = GAMES.length;

const cards = GAMES.map(g => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = g.url;                    /* 绝对根路径：/games-web/xxx.html */
  a.target = "_blank";
  a.rel = "noopener";
  a.dataset.key = g.title.toLowerCase();
  a.innerHTML = `<div class="icon">${iconSVG(g.title)}</div><div class="name"></div>`;
  a.querySelector(".name").textContent = g.title;
  grid.appendChild(a);
  return a;
});

/* ================= 实时搜索过滤 ================= */
function applyFilter(){
  const q = searchEl.value.trim().toLowerCase();
  let hit = 0;
  for (const c of cards){
    const show = !q || c.dataset.key.includes(q);
    c.style.display = show ? "" : "none";
    if (show) hit++;
  }
  emptyEl.classList.toggle("show", hit === 0);
  hitEl.textContent = q ? hit + " / " + GAMES.length : "";
  clearBtn.style.display = q ? "block" : "none";
}
searchEl.addEventListener("input", applyFilter);
clearBtn.addEventListener("click", () => { searchEl.value = ""; applyFilter(); searchEl.focus(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
});
</script>
