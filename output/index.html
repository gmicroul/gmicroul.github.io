<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Harbor · 游戏大厅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#081522; --bg2:#0c1f30; --card:#10283c; --card-hover:#163550;
  --text:#e8f2f8; --dim:#8fb3c7; --accent:#19A7CE;
}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 20% -10%,#12334d 0%,var(--bg) 55%) fixed,var(--bg);
  color:var(--text);min-height:100vh;
}
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(8,21,34,.96),rgba(8,21,34,.88));
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(79,195,247,.14);
  padding:18px 20px 14px;
}
.hwrap{max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo{
  width:46px;height:46px;flex:none;
  border-radius:28%;
  background:linear-gradient(135deg,#4FC3F7 0%,#0E7C8C 100%);
  box-shadow:0 8px 24px rgba(20,40,60,.45);
  position:relative;overflow:hidden;
}
.logo::before{
  content:"";position:absolute;width:64%;height:64%;left:-14%;top:-14%;
  background:rgba(255,255,255,.28);border-radius:50%;
}
.logo::after{
  content:"";position:absolute;width:16%;height:16%;right:16%;bottom:16%;
  background:#F5F7F7;border-radius:50%;
}
h1{font-size:22px;font-weight:700;letter-spacing:.5px}
h1 .zh{font-size:13px;font-weight:400;color:var(--dim);margin-left:10px;letter-spacing:2px}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.search{
  flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid rgba(79,195,247,.2);
  border-radius:14px;padding:10px 14px;
  transition:border-color .2s, box-shadow .2s;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,167,206,.18)}
.search svg{flex:none;opacity:.6}
.search input{
  flex:1;background:none;border:none;outline:none;color:var(--text);
  font-size:15px;
}
.search input::placeholder{color:var(--dim)}
.count{
  font-size:13px;color:var(--dim);white-space:nowrap;
  padding:8px 14px;background:var(--card);border-radius:999px;
  border:1px solid rgba(79,195,247,.15);
}
.count b{color:#4FC3F7;font-size:15px}
main{max-width:1200px;margin:0 auto;padding:26px 20px 60px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:18px;
}
.card{
  background:var(--card);
  border:1px solid rgba(79,195,247,.1);
  border-radius:18px;
  padding:20px 12px 16px;
  display:flex;flex-direction:column;align-items:center;gap:13px;
  cursor:pointer;text-decoration:none;color:var(--text);
  transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.card:hover{
  transform:translateY(-5px);
  background:var(--card-hover);
  border-color:rgba(79,195,247,.35);
  box-shadow:0 14px 34px rgba(20,40,60,.5);
}
.card:active{transform:translateY(-2px) scale(.98)}
/* ---- SailfishOS-style icon ---- */
.icon{
  width:76px;height:76px;position:relative;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(20,40,60,.4);
}
/* shape A: squircle (continuous-curvature rounded square) */
.icon.sq{border-radius:27%}
/* shape B: organic flow blob (single-axis asymmetric curve) */
.icon.blob{border-radius:58% 42% 55% 45% / 46% 56% 44% 54%}
/* negative-form clipped arc, upper-left light source */
.icon::before{
  content:"";position:absolute;width:78%;height:78%;left:-22%;top:-22%;
  background:rgba(255,255,255,.16);border-radius:50%;
}
.icon .ch{
  position:relative;z-index:2;
  font-size:34px;font-weight:800;color:#FFFFFF;
  text-shadow:0 2px 6px rgba(20,40,60,.3);
  line-height:1;font-family:inherit;
  transform:translateY(-1px);
}
/* accent dot (negative/positive accent, round) */
.icon .dot{
  position:absolute;z-index:2;width:13%;height:13%;right:17%;bottom:17%;
  border-radius:50%;background:rgba(255,255,255,.92);
}
.icon .dot.pink{background:#B03A6B}
.name{
  font-size:13.5px;font-weight:600;text-align:center;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:2.7em;word-break:break-word;
}
.empty{
  text-align:center;color:var(--dim);padding:70px 20px;font-size:15px;display:none;
}
footer{
  text-align:center;color:var(--dim);font-size:12px;padding:24px 20px 40px;
  border-top:1px solid rgba(79,195,247,.08);
}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
  .icon{width:60px;height:60px}
  .icon .ch{font-size:27px}
  .card{padding:15px 8px 12px;border-radius:15px}
  .name{font-size:12px}
  h1{font-size:19px}
  main{padding:18px 14px 48px}
}
</style>
</head>

var emptyEl = document.getElementById("empty");
var cntEl = document.getElementById("cnt");
var cards = [];

GAMES.forEach(function(g, i){
  var pal = PALETTE[WEIGHTS[i % WEIGHTS.length]];
  var shape = (i % 2 === 0) ? "sq" : "blob";  // interleaved silhouettes
  var ch = (g.n.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase();
  var a = document.createElement("a");
  a.className = "card";
  a.href = g.u;
  a.target = "_blank";
  a.rel = "noopener";
  a.setAttribute("data-name", g.n.toLowerCase());
  a.innerHTML =
    '<div class="icon ' + shape + '" style="background:linear-gradient(135deg,' + pal[0] + ' 0%,' + pal[1] + ' 100%)">' +
      '<span class="ch">' + ch + '</span>' +
      '<span class="dot' + (i % 6 === 0 ? " pink" : "") + '"></span>' +
    '</div>' +
    '<div class="name"></div>';
  a.querySelector(".name").textContent = g.n;
  grid.appendChild(a);
  cards.push(a);
});

var q = document.getElementById("q");
q.addEventListener("input", function(){
  var kw = q.value.trim().toLowerCase();
  var shown = 0;
  cards.forEach(function(c){
    var hit = !kw || c.getAttribute("data-name").indexOf(kw) !== -1;
    c.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  cntEl.textContent = shown;
  emptyEl.style.display = shown === 0 ? "block" : "none";
});
</script>
</body>
