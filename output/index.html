  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0d1117;
      --bg-elevated: #161b22;
      --bg-card: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --accent-dim: #1f426b;
      --success: #3fb950;
      --danger: #f85149;
      --shadow: rgba(0,0,0,0.4);
      --radius: 12px;
      --transition: 0.2s ease;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --bg-elevated: #ffffff;
        --bg-card: #ffffff;
        --border: #d0d7de;
        --text: #24292f;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent-hover: #0860ca;
        --accent-dim: #d0e8ff;
        --shadow: rgba(0,0,0,0.1);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Layout */
    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #a371f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: white;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 0.875rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      font-weight: 600;
      color: var(--text);
    }

    .stat-value.accent {
      color: var(--accent);
    }

    /* Search */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      font-size: 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), color var(--transition);
    }

    .clear-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    .clear-btn.visible { display: flex; }

    /* Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    @media (min-width: 480px) {
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    }

    @media (min-width: 768px) {
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }

    @media (min-width: 1024px) {
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    }

    @media (min-width: 1400px) {
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    }

    /* Game Card */
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 24px var(--shadow);
    }

    .game-card:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .card-icon {
      aspect-ratio: 16/9;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .card-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: inherit;
      opacity: 0.15;
    }

    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .card-icon .letter {
      z-index: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      user-select: none;
    }

    .card-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 0.9375rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      margin-top: auto;
      padding-top: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-arrow {
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      transition: transform var(--transition), color var(--transition);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .game-card:hover .card-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-desc {
      max-width: 320px;
    }

    /* Loading */
    .loading {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* High contrast */
    @media (prefers-contrast: high) {
      :root { --border: var(--text); }
      .game-card:hover { border-width: 2px; }
    }
  </style>
</head>

  </div>

  // Deterministic color generation from string
  function stringToColor(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const h = (hash % 360 + 360) % 360;
    const s = 55 + (hash % 25);
    const l = 35 + (hash % 15);
    return `hsl(${h}, ${s}%, ${l}%)`;
  }

  // Get first letter for icon
  function getFirstLetter(title) {
    const match = title.match(/[A-Za-z0-9]/);
    return match ? match[0].toUpperCase() : '?';
  }

  // Create game card element
  function createCard(game) {
    const link = document.createElement('a');
    link.className = 'game-card';
    link.role = 'listitem';
    link.href = '/games-web/' + game.file;
    link.setAttribute('data-title', game.title.toLowerCase());
    link.tabIndex = 0;
    
    const color = stringToColor(game.title);
    const letter = getFirstLetter(game.title);
    
    link.innerHTML = `
      <div class="card-icon" style="background: ${color};" aria-hidden="true">
        <span class="letter">${letter}</span>
      </div>
      <div class="card-content">
        <h3 class="card-title">${escapeHtml(game.title)}</h3>
        <div class="card-meta">
          <span>点击游玩</span>
          <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </div>
      </div>
    `;
    
    return link;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Render all games
  function renderGames(games) {
    const grid = document.getElementById('games-grid');
    const loading = document.getElementById('loading');
    
    if (loading) loading.remove();
    
    if (games.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" role="status">
          <div class="empty-icon" aria-hidden="true">🔍</div>
          <h3 class="empty-title">未找到匹配的游戏</h3>
          <p class="empty-desc">尝试使用不同的关键词搜索，或清空搜索框查看所有游戏。</p>
        </div>
      `;
      return;
    }
    
    const fragment = document.createDocumentFragment();
    games.forEach(game => {
      fragment.appendChild(createCard(game));
    });
    grid.appendChild(fragment);
  }

  // Filter games
  function filterGames(query) {
    const lowerQuery = query.toLowerCase().trim();
    const cards = document.querySelectorAll('.game-card');
    let visible = 0;
    
    cards.forEach(card => {
      const title = card.getAttribute('data-title');
      const matches = !lowerQuery || title.includes(lowerQuery);
      card.style.display = matches ? 'flex' : 'none';
      if (matches) visible++;
    });
    
    // Show/hide empty state
    let emptyState = document.querySelector('.empty-state');
    if (visible === 0 && lowerQuery) {
      if (!emptyState) {
        const grid = document.getElementById('games-grid');
        emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        emptyState.role = 'status';
        emptyState.innerHTML = `
          <div class="empty-icon" aria-hidden="true">🔍</div>
          <h3 class="empty-title">未找到匹配的游戏</h3>
          <p class="empty-desc">尝试使用不同的关键词搜索，或清空搜索框查看所有游戏。</p>
        `;
        grid.appendChild(emptyState);
      }
    } else if (emptyState) {
      emptyState.remove();
    }
    
    updateCounts(visible);
  }

  function updateCounts(visible) {
    document.getElementById('visible-count').textContent = visible;
    document.getElementById('total-count').textContent = GAMES.length;
  }

  // Debounce function
  function debounce(fn, delay) {
    let timeoutId;
    return (...args) => {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => fn(...args), delay);
    };
  }

  // Initialize
  function init() {
    // Initial render
    renderGames(GAMES);
    updateCounts(GAMES.length);
    
    // Search input handler
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    
    const handleSearch = debounce((e) => {
      const query = e.target.value;
      filterGames(query);
      clearBtn.classList.toggle('visible', query.length > 0);
    }, 100);
    
    searchInput.addEventListener('input', handleSearch);
    
    // Clear button
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      filterGames('');
      clearBtn.classList.remove('visible');
      searchInput.focus();
    });
    
    // Clear on Escape
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterGames('');
        clearBtn.classList.remove('visible');
        searchInput.blur();
      }
    });
    
    // Keyboard navigation for cards
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        const target = e.target.closest('.game-card');
        if (target && document.activeElement === target) {
          e.preventDefault();
          window.location.href = target.href;
        }
      }
    });
  }

  // Run when DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
