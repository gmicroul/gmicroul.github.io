<style>
  :root {
    --bg: #0b0f14;
    --bg-2: #131a22;
    --panel: rgba(255,255,255,0.04);
    --line: rgba(255,255,255,0.09);
    --text: #e8edf2;
    --dim: #8b97a5;
    --accent: #4db8ff;
    --accent-2: #37e0a5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1100px 560px at 18% -10%, rgba(77,184,255,0.12), transparent 60%),
      radial-gradient(900px 480px at 95% 110%, rgba(55,224,165,0.08), transparent 60%),
      linear-gradient(165deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    padding: 28px 16px 48px;
  }
  .page { max-width: 920px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  header .pill {
    display: inline-block; font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent); border: 1px solid rgba(77,184,255,0.35); border-radius: 999px;
    padding: 6px 16px; margin-bottom: 14px; background: rgba(77,184,255,0.06);
  }
  header h1 {
    font-size: 24px; font-weight: 600; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header p { margin-top: 8px; font-size: 13px; color: var(--dim); }
  .searchbar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 26px; flex-wrap: wrap; }
  .search {
    width: 100%; max-width: 380px; padding: 11px 16px; font-size: 14px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 0;
    outline: none; transition: border-color 0.2s ease, background 0.2s ease;
  }
  .search::placeholder { color: var(--dim); }
  .search:focus { border-color: var(--accent); background: rgba(77,184,255,0.07); }
  .count { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .count b { color: var(--accent); font-weight: 600; }
  .grid {
    display: grid; grid-template-columns: repeat(2, 108px); gap: 14px;
    justify-content: center; align-content: start;
  }
  .card {
    width: 108px; height: 108px; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding-top: 2px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 0;
    transition: transform 0.25s cubic-bezier(0.2,0.9,0.3,1.2), border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-4px) scale(1.05); border-color: rgba(77,184,255,0.45);
    background: rgba(77,184,255,0.07); box-shadow: 0 8px 22px rgba(0,0,0,0.45);
  }
  .card .icon {
    width: 86px; height: 86px; display: block;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45));
    transition: filter 0.25s ease;
  }
  .card:hover .icon { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6)); }
  .card .label {
    width: 104px; height: 16px; line-height: 16px; font-size: 9px; letter-spacing: 0.3px;
    text-align: center; color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding: 0 2px;
  }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--dim); font-size: 13px; padding: 30px 0; }
  footer { margin-top: 36px; text-align: center; font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, 108px); } }
  @media (min-width: 700px) { header h1 { font-size: 30px; } }
</style>
</head>

  var nEl = document.getElementById("n");
  var tEl = document.getElementById("t");
  tEl.textContent = GAMES.length;

  function render(filter) {
    filter = (filter || "").toLowerCase().trim();
    grid.innerHTML = "";
    var shown = 0;
    GAMES.forEach(function (g, i) {
      if (filter && g.name.toLowerCase().indexOf(filter) === -1) return;
      shown++;
      var a = document.createElement("a");
      a.className = "card";
      a.href = g.link;
      a.title = g.name;
      a.style.animationDelay = (i % 16) * 12 + "ms";
      var img = document.createElement("img");
      img.className = "icon";
      img.src = g.icon;
      img.alt = g.name;
      img.loading = "lazy";
      var lab = document.createElement("span");
      lab.className = "label";
      lab.textContent = g.name;
      a.appendChild(img);
      a.appendChild(lab);
      grid.appendChild(a);
    });
    nEl.textContent = shown;
    if (!shown) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "没有找到匹配的游戏";
      grid.appendChild(e);
    }
  }
  q.addEventListener("input", function () { render(q.value); });
