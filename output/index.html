<html lang="zh-CN">
<head>

<style>
/* ========================================
   CSS 变量 - SailfishOS 色系
   ======================================== */
:root {
  /* 海洋主色系 */
  --deep-teal: #0E7C8C;
  --teal: #19A7CE;
  --sky-blue: #4FC3F7;
  --sea-green: #2EBD85;
  --deep-green: #15966B;
  /* 功能强调暖色 */
  --coral: #F0544F;
  --orange: #F59B23;
  --amber: #FFD34E;
  /* 渐变端点 */
  --purple-pink-from: #C56CD6;
  --purple-pink-to: #E85D9E;
  /* 前景/文字 */
  --fg-white: #FFFFFF;
  --fg-offwhite: #F5F7F7;
  /* 阴影 */
  --shadow-color: rgba(20, 40, 60, 0.2);
  --shadow-color-strong: rgba(20, 40, 60, 0.35);
  /* 背景 */
  --bg-dark: #0A1620;
  --bg-card: #112233;
  --bg-card-hover: #162A3E;
  --bg-input: #0E1A26;
  --border-color: #1E3A4A;
  /* 字体 */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  /* 圆角 - Squircle 近似 */
  --radius-squircle: 28%;
  --radius-sm: 12px;
  --radius-lg: 24px;
  /* 过渡 */
  --transition-fast: 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --transition-normal: 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ========================================
   Reset & Base
   ======================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--font-sans);
  background: var(--bg-dark);
  color: var(--fg-white);
  min-height: 100vh;
  line-height: 1.5;
}

/* 背景氛围 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(14, 124, 140, 0.15), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(30, 167, 206, 0.08), transparent),
    radial-gradient(ellipse 40% 60% at 0% 0%, rgba(46, 189, 133, 0.06), transparent);
  pointer-events: none;
  z-index: -1;
}

/* ========================================
   Layout
   ======================================== */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.header {
  text-align: center;
  margin-bottom: 32px;
  padding-top: 8px;
}

.header h1 {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--sky-blue), var(--sea-green), var(--amber));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.header p {
  color: rgba(245, 247, 247, 0.6);
  font-size: 0.95rem;
}

/* ========================================
   Search Bar
   ======================================== */
.search-wrapper {
  max-width: 640px;
  margin: 0 auto 28px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 14px 20px 14px 52px;
  font-size: 1rem;
  font-family: inherit;
  color: var(--fg-white);
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: 100px;
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
}

.search-input::placeholder { color: rgba(245, 247, 247, 0.35); }

.search-input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.25);
  background: #122836;
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: rgba(245, 247, 247, 0.4);
  pointer-events: none;
  transition: stroke var(--transition-fast);
}

.search-input:focus + .search-icon { stroke: var(--teal); }

.search-clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: rgba(245, 247, 247, 0.4);
  transition: color var(--transition-fast), background var(--transition-fast);
}

.search-clear:hover { color: var(--fg-white); background: rgba(255,255,255,0.08); }
.search-clear svg { width: 18px; height: 18px; }
.search-clear.visible { display: flex; }

/* ========================================
   Stats
   ======================================== */
.stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 28px;
  padding: 0 16px;
  flex-wrap: wrap;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  color: rgba(245, 247, 247, 0.7);
}

.stat-item strong {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--fg-white);
  background: linear-gradient(135deg, var(--sky-blue), var(--sea-green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ========================================
   Grid
   ======================================== */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
  align-items: start;
}

@media (max-width: 640px) {
  .games-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
}

@media (min-width: 1024px) {
  .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}

/* ========================================
   Game Card
   ======================================== */
.game-card {
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 14px 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  transition: transform var(--transition-normal), border-color var(--transition-fast), box-shadow var(--transition-normal), background var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.game-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25,167,206,0.08), rgba(46,189,133,0.04));
  opacity: 0;
  transition: opacity var(--transition-normal);
  pointer-events: none;
}

.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--teal);
  background: var(--bg-card-hover);
  box-shadow:
    0 12px 32px -8px var(--shadow-color-strong),
    0 4px 16px -4px var(--shadow-color);
}

.game-card:hover::before { opacity: 1; }

.game-card:focus-visible {
  outline: none;
  border-color: var(--sky-blue);
  box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.4);
}

/* 图标容器 - SailfishOS 风格 */
.icon-wrapper {
  width: 72px;
  height: 72px;
  position: relative;
  flex-shrink: 0;
  /* Squircle 形状 - 使用 clip-path 模拟连续曲率 */
  clip-path: path("M36,0 C55.5,0 72,16.5 72,36 C72,55.5 55.5,72 36,72 C16.5,72 0,55.5 0,36 C0,16.5 16.5,0 36,0 Z");
  /* 备选：border-radius 近似 */
  border-radius: 28%;
  overflow: hidden;
  /* 长投影 - 扁平长影风格 */
  box-shadow:
    0 8px 24px -4px var(--shadow-color),
    4px 4px 0 rgba(20,40,60,0.12),
    8px 8px 0 rgba(20,40,60,0.08),
    12px 12px 0 rgba(20,40,60,0.05);
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
}

.game-card:hover .icon-wrapper {
  transform: scale(1.05);
  box-shadow:
    0 12px 32px -6px var(--shadow-color-strong),
    6px 6px 0 rgba(20,40,60,0.15),
    12px 12px 0 rgba(20,40,60,0.1),
    18px 18px 0 rgba(20,40,60,0.06);
}

.icon-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* CSS 生成的图标 - SailfishOS 风格母形 */
.icon-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* ========================================
   SailfishOS 风格图标定义
   使用三大母形：圆形/同心圆、Squircle、有机流线形
   负形切割 + 渐变 + 左上光源
   ======================================== */

/* 预设色组 - 每组：[底色渐变开始, 底色渐变结束, 符号色(白), 点缀色] */
.icon-style-0 { --g1: var(--deep-teal); --g2: var(--teal); --accent: var(--coral); }
.icon-style-1 { --g1: var(--teal); --g2: var(--sky-blue); --accent: var(--amber); }
.icon-style-2 { --g1: var(--sea-green); --g2: var(--deep-green); --accent: var(--purple-pink-from); }
.icon-style-3 { --g1: var(--deep-teal); --g2: var(--deep-green); --accent: var(--orange); }
.icon-style-4 { --g1: var(--teal); --g2: var(--deep-teal); --accent: var(--purple-pink-to); }
.icon-style-5 { --g1: var(--sky-blue); --g2: var(--teal); --accent: var(--coral); }
.icon-style-6 { --g1: var(--deep-green); --g2: var(--sea-green); --accent: var(--amber); }
.icon-style-7 { --g1: var(--purple-pink-from); --g2: var(--purple-pink-to); --accent: var(--fg-white); }

/* 图标形状类别 - 交替使用三大母形 */
/* 类别 A: 圆形/同心圆 */
.icon-shape-circle .icon-bg {
  fill: url(#grad-circle);
}
.icon-shape-circle .icon-fg { fill: var(--fg-white); }

/* 类别 B: Squircle (圆角矩形底版，连续曲率) */
.icon-shape-squircle .icon-bg {
  fill: url(#grad-squircle);
}
.icon-shape-squircle .icon-fg { fill: var(--fg-white); }

/* 类别 C: 有机流线形 */
.icon-shape-organic .icon-bg {
  fill: url(#grad-organic);
}
.icon-shape-organic .icon-fg { fill: var(--fg-white); }

/* 渐变定义 - 左上光源 135° */
.icon-svg defs {
  /* 每个图标实例会通过 CSS 变量注入具体颜色 */
}

/* 通用径向渐变（球面元素用） */
.icon-svg .radial-glow {
  fill: url(#radial-highlight);
}

/* ========================================
   游戏名称
   ======================================== */
.game-title {
  font-size: 0.8rem;
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
  max-width: 100%;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--fg-offwhite);
  transition: color var(--transition-fast);
}

.game-card:hover .game-title { color: var(--fg-white); }

/* ========================================
   Empty State
   ======================================== */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: rgba(245, 247, 247, 0.4);
}

.empty-state svg {
  width: 64px;
  height: 64px;
  margin-bottom: 16px;
  stroke: currentColor;
}

.empty-state p { font-size: 1rem; }

/* ========================================
   Scrollbar
   ======================================== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--teal); }

/* ========================================
   Reduced Motion
   ======================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

// ========================================
// 生成单个图标 SVG
// ========================================
function generateIconSVG(gameIndex, title) {
  // 根据标题哈希选择色组和形状，保证一致性
  let hash = 0;
  for (let i = 0; i < title.length; i++) {
    hash = ((hash << 5) - hash) + title.charCodeAt(i);
    hash |= 0;
  }
  const colorIdx = Math.abs(hash) % COLOR_SCHEMES.length;
  const shapeIdx = Math.abs(hash >> 8) % ICON_SHAPES.length;
  const [colorStart, colorEnd, colorAccent] = COLOR_SCHEMES[colorIdx];
  const shape = ICON_SHAPES[shapeIdx];

  // 构建渐变 ID
  const gradId = `grad-${gameIndex}`;
  const radialId = `radial-${gameIndex}`;

  // 构建路径
  let pathsSVG = '';
  shape.paths.forEach((path, i) => {
    pathsSVG += `<path class="icon-bg" d="${path}" fill-rule="evenodd"/>`;
  });
  if (shape.accent) {
    pathsSVG += `<path class="icon-fg" d="${shape.accent}" fill="${colorAccent}"/>`;
  }

  return `
<svg class="icon-svg icon-style-${colorIdx} icon-shape-${shape.type}" viewBox="0 0 512 512" width="72" height="72" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="${colorStart}"/>
      <stop offset="100%" stop-color="${colorEnd}"/>
    </linearGradient>
    <radialGradient id="${radialId}" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="${colorEnd}" stop-opacity="1"/>
      <stop offset="100%" stop-color="${colorStart}" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <!-- 底色块使用线性渐变，模拟左上光源 135° -->
  <rect width="512" height="512" fill="url(#${gradId})"/>
  <!-- 负形切割层 -->
  <g fill="url(#${gradId})" fill-rule="evenodd">
    ${pathsSVG}
  </g>
  <!-- 球面高光（可选） -->
  ${shape.type === 'circle' ? `<ellipse cx="180" cy="180" rx="80" ry="60" fill="url(#${radialId})" opacity="0.15"/>` : ''}
</svg>`;
}

function renderGames(filter = '') {
  const filtered = GAMES.filter(g =>
    g.title.toLowerCase().includes(filter.toLowerCase())
  );

  visibleCount.textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" role="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="8" x2="14" y2="14"></line>
          <line x1="14" y1="8" x2="8" y2="14"></line>
        </svg>
        <p>未找到匹配的游戏</p>
        <p style="font-size:0.85rem;margin-top:8px;color:rgba(245,247,247,0.25);">尝试其他关键词</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map((game, idx) => {
    const originalIdx = GAMES.indexOf(game);
    return `
<a href="${game.url}" class="game-card" role="listitem" data-title="${game.title.replace(/"/g, '"')}">
  <div class="icon-wrapper">
    ${generateIconSVG(originalIdx, game.title)}
  </div>
  <span class="game-title">${escapeHtml(game.title)}</span>
</a>`;
  }).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========================================
let searchDebounce = null;
searchInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  searchClear.classList.toggle('visible', val.length > 0);

  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    renderGames(val);
  }, 80);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  renderGames('');
  searchInput.focus();
});

// 键盘快捷键：/ 聚焦搜索，Esc 清空
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    renderGames('');
    searchInput.blur();
  }
});

// 清除输入时的动画
searchInput.addEventListener('focus', () => {
  searchInput.parentElement.style.transform = 'scale(1.01)';
});
searchInput.addEventListener('blur', () => {
  searchInput.parentElement.style.transform = 'scale(1)';
});
</script>
</body>
</html>
