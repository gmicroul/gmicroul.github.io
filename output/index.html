<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root {
    --bg-start: #5FD0F5;
    --bg-end: #3AA8D0;
    --card-bg: rgba(255,255,255,0.15);
    --card-border: rgba(255,255,255,0.25);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255,255,255,0.85);
    --accent: #FFFFFF;
    --shadow: 0 8px 32px rgba(0,0,0,0.18);
    --shadow-hover: 0 16px 48px rgba(0,0,0,0.28);
    --radius: 16px;
    --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.55) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 35%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    text-align: center;
    padding: 20px 0 12px;
    margin-bottom: 8px;
}

header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

header p {
    font-size: clamp(14px, 2.5vw, 18px);
    color: var(--text-secondary);
    margin-top: 6px;
    font-weight: 400;
}

.stats {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 16px 0 24px;
    flex-wrap: wrap;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 100px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: clamp(13px, 2vw, 15px);
    color: var(--text-primary);
    font-weight: 500;
}

.stat-item strong {
    font-weight: 700;
    font-size: clamp(15px, 2.5vw, 18px);
}

.search-wrapper {
    max-width: 520px;
    margin: 0 auto 28px;
    position: relative;
}

.search-wrapper svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    stroke: var(--text-secondary);
    stroke-width: 2;
    pointer-events: none;
    transition: stroke var(--transition);
}

.search-wrapper:focus-within svg {
    stroke: var(--accent);
}

#searchInput {
    width: 100%;
    padding: 14px 18px 14px 50px;
    font-size: clamp(15px, 2.5vw, 17px);
    font-family: inherit;
    color: var(--text-primary);
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 14px;
    outline: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}

#searchInput::placeholder {
    color: var(--text-secondary);
    opacity: 0.7;
}

#searchInput:focus {
    border-color: rgba(255,255,255,0.5);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.2);
}

#searchInput:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    flex: 1;
}

@media (min-width: 480px) {
    .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 18px;
    }
}

@media (min-width: 768px) {
    .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 20px;
    }
}

@media (min-width: 1024px) {
    .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 22px;
    }
}

@media (min-width: 1400px) {
    .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    }
}

.game-card {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: var(--radius);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    cursor: pointer;
    overflow: hidden;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
}

.game-card:hover,
.game-card:focus-visible {
    transform: translateY(-6px) scale(1.02);
    box-shadow: var(--shadow-hover);
    border-color: rgba(255,255,255,0.45);
    outline: none;
}

.game-card:active {
    transform: translateY(-2px) scale(0.99);
    transition-duration: 0.1s;
}

.game-card:focus-visible {
    box-shadow: 0 0 0 3px rgba(95,208,245,0.5), var(--shadow-hover);
}

.card-icon {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
}

.card-icon svg {
    width: 52%;
    height: 52%;
    max-width: 72px;
    max-height: 72px;
    transition: transform var(--transition), filter var(--transition);
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
}

.game-card:hover .card-icon svg {
    transform: scale(1.08) rotate(2deg);
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
}

.card-info {
    padding: 14px 12px;
    text-align: center;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.12) 100%);
    flex-shrink: 0;
}

.card-title {
    font-size: clamp(13px, 2vw, 15px);
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 3px rgba(0,0,0,0.12);
}

.card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-primary);
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 100px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity var(--transition), transform var(--transition);
}

.game-card:hover .card-badge {
    opacity: 1;
    transform: translateY(0);
}

.no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
}

.no-results svg {
    width: 64px;
    height: 64px;
    stroke: var(--text-secondary);
    stroke-width: 1.5;
    margin-bottom: 16px;
    opacity: 0.6;
}

.no-results p {
    font-size: clamp(15px, 2.5vw, 18px);
    font-weight: 500;
}

footer {
    text-align: center;
    padding: 24px 0 12px;
    color: var(--text-secondary);
    font-size: clamp(12px, 2vw, 14px);
    opacity: 0.7;
}

footer a {
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    transition: border-color var(--transition);
}

footer a:hover {
    border-bottom-color: var(--text-primary);
}

/* SVG Icons - 16 unique designs */
.icon-set {
    display: none;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

.card-icon svg {
    animation: float 3s ease-in-out infinite;
}

.card-icon svg:nth-child(odd) {
    animation-delay: 0.5s;
}

.card-icon svg:nth-child(3n) {
    animation-delay: 1s;
}

.card-icon svg:nth-child(4n) {
    animation-delay: 1.5s;
}

/* Loading state */
.game-grid.loading .game-card {
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
}

.game-grid.loading .game-card:nth-child(1)  { animation-delay: 0.02s; }
.game-grid.loading .game-card:nth-child(2)  { animation-delay: 0.04s; }
.game-grid.loading .game-card:nth-child(3)  { animation-delay: 0.06s; }
.game-grid.loading .game-card:nth-child(4)  { animation-delay: 0.08s; }
.game-grid.loading .game-card:nth-child(5)  { animation-delay: 0.1s; }
.game-grid.loading .game-card:nth-child(6)  { animation-delay: 0.12s; }
.game-grid.loading .game-card:nth-child(7)  { animation-delay: 0.14s; }
.game-grid.loading .game-card:nth-child(8)  { animation-delay: 0.16s; }
.game-grid.loading .game-card:nth-child(9)  { animation-delay: 0.18s; }
.game-grid.loading .game-card:nth-child(10) { animation-delay: 0.2s; }
.game-grid.loading .game-card:nth-child(11) { animation-delay: 0.22s; }
.game-grid.loading .game-card:nth-child(12) { animation-delay: 0.24s; }
.game-grid.loading .game-card:nth-child(13) { animation-delay: 0.26s; }
.game-grid.loading .game-card:nth-child(14) { animation-delay: 0.28s; }
.game-grid.loading .game-card:nth-child(15) { animation-delay: 0.3s; }
.game-grid.loading .game-card:nth-child(16) { animation-delay: 0.32s; }
.game-grid.loading .game-card:nth-child(17) { animation-delay: 0.34s; }
.game-grid.loading .game-card:nth-child(18) { animation-delay: 0.36s; }
.game-grid.loading .game-card:nth-child(19) { animation-delay: 0.38s; }
.game-grid.loading .game-card:nth-child(20) { animation-delay: 0.4s; }
.game-grid.loading .game-card:nth-child(n+21) { animation-delay: 0.42s; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* High contrast mode support */
@media (prefers-contrast: high) {
    :root {
        --card-bg: rgba(255,255,255,0.25);
        --card-border: rgba(255,255,255,0.5);
    }
    .game-card:focus-visible {
        box-shadow: 0 0 0 4px #FFF, var(--shadow-hover);
    }
}
</style>
</head>

    const grid = document.getElementById('gameGrid');
    const searchInput = document.getElementById('searchInput');
    const gameCountEl = document.getElementById('gameCount');
    const filteredCountEl = document.getElementById('filteredCount');
    const filteredNumberEl = document.getElementById('filteredNumber');
    const noResultsEl = document.getElementById('noResults');

    const icons = document.querySelectorAll('.icon-set');
    const iconCount = icons.length;

    function createCard(game, index) {
        const a = document.createElement('a');
        a.href = game.url;
        a.className = 'game-card';
        a.role = 'listitem';
        a.setAttribute('data-title', game.title.toLowerCase());
        a.setAttribute('data-filename', game.filename.toLowerCase());
        a.tabIndex = 0;
        a.rel = 'noopener';

        const iconSvg = icons[index % iconCount].cloneNode(true);
        iconSvg.removeAttribute('class');
        iconSvg.setAttribute('aria-hidden', 'true');
        iconSvg.style.width = '100%';
        iconSvg.style.height = '100%';

        a.innerHTML = `
            <div class="card-icon">${iconSvg.outerHTML}</div>
            <div class="card-info">
                <span class="card-title">${escapeHtml(game.title)}</span>
            </div>
            <span class="card-badge">Play</span>
        `;

        return a;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderGames(games) {
        grid.innerHTML = '';
        const fragment = document.createDocumentFragment();

        games.forEach((game, i) => {
            fragment.appendChild(createCard(game, i));
        });

        grid.appendChild(fragment);
        grid.classList.remove('loading');

        requestAnimationFrame(() => {
            grid.classList.add('loading');
        });
    }

    function filterGames(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
            return GAMES_DATA;
        }
        return GAMES_DATA.filter(game => {
            const title = game.title.toLowerCase();
            const filename = game.filename.toLowerCase();
            return title.includes(q) || filename.includes(q);
        });
    }

    function updateStats(filtered) {
        gameCountEl.textContent = GAMES_DATA.length;
        if (filtered.length !== GAMES_DATA.length) {
            filteredNumberEl.textContent = filtered.length;
            filteredCountEl.style.display = 'flex';
        } else {
            filteredCountEl.style.display = 'none';
        }
    }

    function toggleNoResults(show) {
        noResultsEl.style.display = show ? 'block' : 'none';
        grid.style.display = show ? 'none' : 'grid';
    }

    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const filtered = filterGames(this.value);
            renderGames(filtered);
            updateStats(filtered);
            toggleNoResults(filtered.length === 0 && this.value.trim() !== '');
        }, 80);
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            this.value = '';
            this.blur();
            const filtered = GAMES_DATA;
            renderGames(filtered);
            updateStats(filtered);
            toggleNoResults(false);
        }
    });

    document.addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            searchInput.focus();
        }
        if (e.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            e.preventDefault();
            searchInput.focus();
        }
    });

    gameCountEl.textContent = GAMES_DATA.length;
    renderGames(GAMES_DATA);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
    }
})();
