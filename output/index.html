<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c141f">
<title>SFOS 游戏大厅</title>
<style>
:root{
  --bg0:#0c141f; --bg1:#101c2b; --bg2:#12283a;
  --panel:#16232f; --panel2:#1c2c3c; --line:#24384c;
  --ink:#e8eef4; --dim:#8fa8bd; --acc:#4aa8ff; --acc2:#5aefc6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(165deg,var(--bg0) 0%,var(--bg1) 46%,var(--bg2) 100%);
  background-attachment:fixed;color:var(--ink);min-height:100vh;
}
header{
  position:sticky;top:0;z-index:30;
  background:rgba(14,22,32,.86);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.brand em{font-style:normal;color:var(--acc2)}
.count{
  font-size:12px;color:var(--dim);
  border:1px solid var(--line);background:var(--panel);
  padding:5px 12px;white-space:nowrap;
  border-radius:0;
}
.search{margin-left:auto;flex:1;min-width:170px;max-width:380px;position:relative}
.search input{
  width:100%;padding:9px 14px 9px 36px;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--line);
  font-size:14px;outline:none;
  transition:border-color .15s;
}
.search input:focus{border-color:var(--acc)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
main{max-width:1240px;margin:0 auto;padding:26px 18px 70px}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  font-size:12px;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);padding:5px 12px;cursor:pointer;
  user-select:none;transition:color .15s,background .15s,border-color .15s;
}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04233f;font-weight:600}
.grid{
  display:grid;
  grid-template-columns:repeat(2,108px);
  gap:16px 14px;
  justify-content:center;
}
@media(min-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,108px);gap:20px 16px;justify-content:flex-start}
}
.card{
  width:108px;height:108px;
  display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:0;
  padding:4px 0 0;
  cursor:pointer;text-decoration:none;
  transition:transform .12s ease,border-color .12s,box-shadow .12s;
  overflow:hidden;
}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.card img{
  width:86px;height:86px;flex:none;
  image-rendering:auto;
  pointer-events:none;
}
.card label{
  width:100%;flex:1;display:flex;align-items:center;justify-content:center;
  padding:0 6px;
  font-size:10px;line-height:1.25;color:var(--dim);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card:hover label{color:var(--ink)}
.empty{
  display:none;text-align:center;color:var(--dim);
  padding:60px 0;font-size:14px;
}
.empty b{color:var(--ink)}
.foot{max-width:1240px;margin:0 auto;padding:0 18px 34px;font-size:12px;color:var(--dim)}
</style>
</head>

      <span>SFOS <em>游戏大厅</em></span>

</header>

  <div class="grid" id="grid"></div>

      $c=document.getElementById('count'), $e=document.getElementById('empty');
const chips=[...document.querySelectorAll('.chip')];
let cat='';
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const k=$q.value.trim().toLowerCase();
  const list=GAMES.filter(x=>{
    if(cat&&x.t!==cat)return false;
    if(!k)return true;
    return (x.n.toLowerCase().indexOf(k)>-1)||(x.f.toLowerCase().indexOf(k)>-1);
  });
  $c.textContent=list.length+' / '+GAMES.length+' 款游戏';
  $e.style.display=list.length?'none':'block';
  $g.innerHTML=list.map(x=>
    '<a class="card" href="'+esc(x.f)+'" title="'+esc(x.n)+'">'+
      '<img src="'+esc(x.i)+'" alt="'+esc(x.n)+'" loading="lazy">'+
      '<label>'+esc(x.n)+'</label></a>'
  ).join('');
}
$q.addEventListener('input',render);
chips.forEach(ch=>ch.addEventListener('click',()=>{
  const t=ch.dataset.c;
  cat=(cat===t?'':t);
  chips.forEach(c=>c.classList.toggle('on',c.dataset.c===cat));
  render();
}));
