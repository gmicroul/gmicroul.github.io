<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏大厅 · Game Hall</title>
<style>

  :root{
    --bg0:#07131b; --bg1:#0b1f2a; --bg2:#0d2a38;
    --card:#102c38; --card2:#12333f;
    --line:rgba(83,183,232,.18);
    --line2:rgba(83,183,232,.38);
    --txt:#dff3fb; --dim:#7fa8b8;
    --accent:#4fc3f7; --accent2:#2ec4b6;
    --shadow:0 6px 18px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Open Sans","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(79,195,247,.10), transparent 60%),
      linear-gradient(165deg, var(--bg1) 0%, var(--bg0) 55%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--txt); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(8,24,33,.82);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:34px;height:34px;flex:none}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  .brand h1 em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:.2px}
  .search{position:relative;flex:1;min-width:200px;max-width:400px;margin-left:auto}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
  .search input{
    width:100%;padding:10px 14px 10px 40px;font-size:14px;color:var(--txt);
    background:rgba(16,44,56,.85);border:1px solid var(--line);outline:none;
    transition:border-color .18s, box-shadow .18s;
  }
  .search input:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(79,195,247,.16)}
  .search input::placeholder{color:var(--dim)}
  .count{font-size:13px;color:var(--dim);white-space:nowrap;padding:6px 12px;border:1px solid var(--line);background:rgba(16,44,56,.5)}
  .count b{color:var(--accent);font-weight:700}
  main{max-width:1120px;margin:0 auto;padding:20px 18px 60px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;justify-items:center}
  .card{
    width:108px;height:108px;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line);border-radius:0;
    text-decoration:none;color:inherit;overflow:hidden;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .card:hover,.card:focus{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow);outline:none}
  .card:active{transform:translateY(0)}
  .card .ic{width:86px;height:86px;flex:none;margin-top:8px;display:flex;align-items:center;justify-content:center}
  .card .ic img{width:86px;height:86px;display:block}
  .card .nm{
    width:100%;margin-top:6px;padding:0 4px;font-size:10px;line-height:1.15;
    text-align:center;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .empty{display:none;width:100%;text-align:center;color:var(--dim);padding:60px 0;font-size:14px}
  .empty svg{width:46px;height:46px;margin:0 auto 14px;stroke:var(--dim);fill:none;stroke-width:1.5;display:block}
  footer{max-width:1120px;margin:0 auto;padding:0 18px 30px;color:var(--dim);font-size:12px;text-align:center;letter-spacing:.3px}
  @media(min-width:620px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:22px;justify-items:center}
  }

</style>
</head>

const grid = document.getElementById('grid');
const input = document.getElementById('q');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const total = GAMES.length;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(list){
  grid.innerHTML = '';
  list.forEach(g=>{
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.href;
    a.setAttribute('data-name', g.name);
    a.innerHTML = '<span class="ic"><img src="icons/'+esc(g.icon)+'" alt="" width="86" height="86" loading="lazy"></span><span class="nm">'+esc(g.name)+'</span>';
    grid.appendChild(a);
  });
  empty.style.display = list.length ? 'none' : 'block';
  count.innerHTML = list.length === total
    ? '<b>'+total+'</b> 款游戏'
    : '找到 <b>'+list.length+'</b> / '+total+' 款';
}

function filter(){
  const q = input.value.trim().toLowerCase();
  const list = q
    ? GAMES.filter(g => g.name.toLowerCase().includes(q) || g.file.toLowerCase().includes(q))
    : GAMES;
  render(list);
}

input.addEventListener('input', filter);
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==input){e.preventDefault(); input.focus();}
  if(e.key==='Escape' && document.activeElement===input){input.value=''; filter(); input.blur();}
});

render(GAMES);

</script>
