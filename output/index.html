<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>游戏大厅 · SFOS Game Hub</title>
<style>
  :root{
    --bg:#14171c;
    --bg2:#1a1e26;
    --card:#1c212a;
    --card-hover:#232a35;
    --line:#2a3140;
    --line-hover:#3b4559;
    --txt:#e8ecf1;
    --dim:#9aa4b2;
    --acc:#4fd2a5;
    --search:#20242c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1c2230 0%, var(--bg) 55%) fixed;
    color:var(--txt);
    font-family:-apple-system,"SF Pro Text",Roboto,"Noto Sans CJK SC","PingFang SC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:28px 16px 64px}

  header{text-align:center;margin-bottom:26px}
  header h1{
    font-size:30px;font-weight:300;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(90deg,#fff 20%,#9fc9ff 60%,var(--acc));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--dim);font-size:13px;margin-top:8px;letter-spacing:4px;text-transform:uppercase}

  .toolbar{display:flex;align-items:center;gap:12px;margin:0 auto 20px;max-width:560px}
  .search{
    flex:1;display:flex;align-items:center;gap:10px;position:relative;
    background:var(--search);border:1px solid var(--line);border-radius:8px;padding:0 14px;
    transition:border-color .15s;
  }
  .search:focus-within{border-color:var(--acc)}
  .search svg{flex:0 0 auto;opacity:.6}
  .search input{
    width:100%;background:none;border:none;outline:none;color:var(--txt);
    font-size:15px;height:44px;letter-spacing:.3px;
  }
  .search input::placeholder{color:var(--dim)}
  .count{
    flex:0 0 auto;font-size:12px;color:var(--dim);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap;
    background:var(--bg2);
  }
  .count b{color:var(--acc);font-weight:600}

  .grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
  }
  .card{
    position:relative;width:100%;max-width:132px;margin:0 auto;
    height:108px;background:var(--card);border:1px solid var(--line);border-radius:0;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;overflow:hidden;
    transition:transform .12s ease,background .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .card:hover,.card:focus-visible{
    background:var(--card-hover);border-color:var(--line-hover);transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,.35);outline:none;
  }
  .card:active{transform:scale(.96)}
  .card img{width:86px;height:86px;display:block;flex:0 0 auto;user-select:none;-webkit-user-drag:none}
  .card .t{
    position:absolute;left:0;right:0;bottom:0;height:18px;line-height:18px;
    font-size:9.5px;letter-spacing:.3px;text-align:center;color:var(--dim);
    background:linear-gradient(transparent,rgba(12,14,18,.72));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
  }
  .card:hover .t{color:#d7e2ef}

  .empty{display:none;text-align:center;color:var(--dim);padding:56px 0;font-size:14px}
  .empty.on{display:block}

  footer{text-align:center;color:#5c6572;font-size:11px;margin-top:40px;letter-spacing:1px}

  @media (max-width:480px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .card{max-width:none}
    .wrap{padding:20px 12px 48px}
    header h1{font-size:25px}
  }
</style>
</head>
