            border-bottom: 1px solid var(--border);

            flex-wrap: wrap;

            background: transparent;
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .nav-tab:hover {
            border-color: var(--highlight);
            color: var(--highlight);
        }
        
        .nav-tab.active {
            background: var(--highlight);
            border-color: var(--highlight);

        }
        
        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;

        .news-card {

            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--highlight), #ff6b6b);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--highlight);
        }
        
        .news-card:hover::before {
            opacity: 1;
        }
        
        .news-category {
            display: inline-block;
            padding: 4px 12px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;

            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 16px;

            -webkit-box-orient: vertical;
            overflow: hidden;

            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);

            background: rgba(15, 52, 96, 0.5);
            color: var(--tag-text);
            border-radius: 8px;
            font-size: 0.7rem;
            border: 1px solid var(--border);
        }
        
        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 24px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--highlight), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }
        
        /* Footer */
        footer {
            padding: 40px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
        }
        
        footer a {
            color: var(--highlight);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        .disclaimer {
            margin-top: 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.8;

            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);

        .empty-state svg {

            height: 64px;
            margin-bottom: 16px;

        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .site-title {
                font-size: 1.75rem;
            }

                flex-direction: column;
                align-items: flex-start;
            }
            
            .meta-info {
                text-align: left;
            }
            
            .news-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-tabs {
                justify-content: flex-start;
            }
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);

        .news-card:nth-child(14) { animation-delay: 0.7s; }
        .news-card:nth-child(15) { animation-delay: 0.75s; }
    </style>

        const newsGrid = document.getElementById('newsGrid');
        const navTabs = document.querySelectorAll('.nav-tab');
        let currentCategory = 'all';
        
        // Format date for display
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${month}月${day}日`;
        }
        
        // Render news cards
        function renderNews(category) {
            currentCategory = category;
            const filtered = category === 'all' 
                ? newsData 
                : newsData.filter(item => item.category === category);
            
            if (filtered.length === 0) {
                newsGrid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <p>暂无该分类下的资讯</p>
                    </div>
                `;
                return;
            }
            
            newsGrid.innerHTML = filtered.map((item, index) => `
                <article class="news-card" style="animation-delay: ${index * 0.05}s">
                    <span class="news-category">${item.category}</span>
                    <h2 class="news-title">${item.title}</h2>
                    <p class="news-summary">${item.summary}</p>
                    <div class="news-tags">
                        ${item.tags.map(tag => `<span class="news-tag">${tag}</span>`).join('')}
                    </div>
                    <footer class="news-footer">
                        <div class="news-source">
                            来源: <a href="${item.source_url}" target="_blank" rel="noopener noreferrer">${item.source}</a>
                        </div>
                        <time class="news-date" datetime="${item.date}">${formatDate(item.date)}</time>
                    </footer>
                </article>
            `).join('');
        }
        
        // Tab click handlers
        navTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                navTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderNews(tab.dataset.category);
            });
        });
        
        // Initialize
        renderNews('all');
        
        // Update stats
        const categories = [...new Set(newsData.map(item => item.category))];
        const sources = [...new Set(newsData.map(item => item.source))];
        const dates = newsData.map(item => new Date(item.date));
        const minDate = new Date(Math.min(...dates));
        const maxDate = new Date(Math.max(...dates));
        const monthDiff = (maxDate.getFullYear() - minDate.getFullYear()) * 12 + (maxDate.getMonth() - minDate.getMonth()) + 1;
        
        document.getElementById('stat-total').textContent = newsData.length;
        document.getElementById('stat-categories').textContent = categories.length;
        document.getElementById('stat-sources').textContent = sources.length;
        document.getElementById('stat-months').textContent = monthDiff;
        document.getElementById('news-count').textContent = newsData.length;
        document.getElementById('category-count').textContent = categories.length;
        document.getElementById('update-date').textContent = new Date().toLocaleDateString('zh-CN', {year: 'numeric', month: 'long'});
    </script>
