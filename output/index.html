<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>游戏大厅 | gmicroul.github.io</title>
<style>
:root{
  --bg0:#0b1220; --bg1:#101a2e; --card:rgba(255,255,255,.06);
  --card-hover:rgba(255,255,255,.12); --border:rgba(255,255,255,.10);
  --text:#eef3fb; --dim:#8ea2c0; --accent:#1fd6c1; --accent2:#5aa9ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(160deg,var(--bg0),var(--bg1) 55%,#0d1f33);
  background-attachment:fixed;color:var(--text);min-height:100vh;
}
/* ambient glow, Sailfish-style ambience */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 400px at 15% -5%, rgba(31,214,193,.14), transparent 60%),
    radial-gradient(700px 500px at 90% 10%, rgba(90,169,255,.12), transparent 60%),
    radial-gradient(500px 500px at 50% 110%, rgba(150,90,255,.10), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 20px 64px}
header{padding:28px 0 8px;text-align:center}
h1{
  font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.subtitle{color:var(--dim);margin-top:8px;font-size:14px}
.toolbar{
  position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;
  flex-wrap:wrap;justify-content:center;
  padding:14px 0;margin-top:14px;
  background:linear-gradient(180deg,rgba(11,18,32,.92),rgba(11,18,32,.75));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.search-box{position:relative;flex:1 1 280px;max-width:460px}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:2}
#search{
  width:100%;padding:12px 16px 12px 40px;border-radius:24px;
  border:1px solid var(--border);background:var(--card);color:var(--text);
  font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;
}
#search::placeholder{color:var(--dim)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,214,193,.18)}
.count{
  font-size:13px;color:var(--dim);white-space:nowrap;
  padding:8px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);
}
.count b{color:var(--accent);font-weight:700}
.grid{
  display:grid;gap:16px;margin-top:22px;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px}}
.card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:18px 10px 14px;border-radius:18px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--border);
  transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);background:var(--card-hover);
  border-color:rgba(31,214,193,.45);box-shadow:0 10px 30px rgba(0,0,0,.35);outline:none;
}
.card:active{transform:translateY(-1px) scale(.98)}
/* SailfishOS-style icon: flat rounded square, ambient gradient, white monogram, subtle top glow */
.icon{
  width:64px;height:64px;border-radius:22%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:26px;color:#fff;letter-spacing:.5px;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  position:relative;overflow:hidden;flex-shrink:0;
  box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
}
.icon::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%);
  pointer-events:none;
}
.name{
  font-size:13px;font-weight:600;text-align:center;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;max-width:100%;
}
.empty{color:var(--dim);text-align:center;padding:60px 0;font-size:15px;display:none}
footer{margin-top:48px;text-align:center;color:var(--dim);font-size:12px}
@media(max-width:480px){
  .wrap{padding:16px 14px 48px}
  .icon{width:56px;height:56px;font-size:22px}
  .grid{gap:12px;grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
</style>

/* Deterministic SailfishOS-style ambient gradient per game name */
var PALETTES = [
  ["#1fd6c1","#0e8f9e"], ["#5aa9ff","#2b5fc7"], ["#ff7a59","#d63c3c"],
  ["#b98bff","#6a3fd4"], ["#ffd257","#e08a00"], ["#4fe08a","#0f9d58"],
  ["#ff6fb1","#c2255c"], ["#59d4ff","#1478a8"], ["#ffa24f","#cc5200"],
  ["#8be04f","#3d9a00"], ["#ff5c5c","#a31f1f"], ["#7c8cff","#3341b8"]
];
function hashStr(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
function initials(name){
  var parts=name.replace(/[^\w\s\u4e00-\u9fff-]/g," ").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  if(parts.length===1){
    var w=parts[0];
    return /^[\u4e00-\u9fff]/.test(w) ? w.charAt(0) : w.slice(0,2).toUpperCase();
  }
  return (parts[0].charAt(0)+parts[1].charAt(0)).toUpperCase();
}

var grid=document.getElementById("grid"),
    countEl=document.getElementById("count"),
    emptyEl=document.getElementById("empty"),
    searchEl=document.getElementById("search");

function buildCard(g){
  var a=document.createElement("a");
  a.className="card";a.href=g.u;a.title=g.n;
  a.setAttribute("data-name",g.n.toLowerCase());
  var p=PALETTES[hashStr(g.n)%PALETTES.length];
  var ic=document.createElement("div");
  ic.className="icon";
  ic.style.background="linear-gradient(150deg,"+p[0]+","+p[1]+")";
  ic.textContent=initials(g.n);
  var nm=document.createElement("div");
  nm.className="name";nm.textContent=g.n;
  a.appendChild(ic);a.appendChild(nm);
  return a;
}

var frag=document.createDocumentFragment();
GAMES.forEach(function(g){frag.appendChild(buildCard(g));});
grid.appendChild(frag);

function applyFilter(){
  var q=searchEl.value.trim().toLowerCase(),visible=0;
  var cards=grid.children;
  for(var i=0;i<cards.length;i++){
    var show=!q||cards[i].getAttribute("data-name").indexOf(q)!==-1;
    cards[i].style.display=show?"":"none";
    if(show)visible++;
  }
  countEl.textContent=visible;
  emptyEl.style.display=visible?"none":"block";
}
searchEl.addEventListener("input",applyFilter);
applyFilter();
