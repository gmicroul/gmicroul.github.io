<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0E7C8C">
  <meta name="description" content="游戏大厅 - 225+ 款 HTML5 游戏在线畅玩">
  <title>游戏大厅 · Game Hub</title>
  <style>
    /* ========================================
       CSS Variables & Reset
       ======================================== */
    :root {
      /* SailfishOS Ocean Palette */
      --deep-teal: #0E7C8C;
      --teal: #19A7CE;
      --sky-blue: #4FC3F7;
      --sea-green: #2EBD85;
      --deep-green: #15966B;
      --coral: #F0544F;
      --orange: #F59B23;
      --bright-yellow: #FFD34E;
      --purple-pink-from: #C56CD6;
      --purple-pink-to: #E85D9E;
      --fg-white: #FFFFFF;
      --fg-offwhite: #F5F7F7;
      --accent-magenta: #B03A6B;
      --shadow-color: rgba(20, 40, 60, 0.2);
      --shadow-color-strong: rgba(20, 40, 60, 0.35);
      
      /* Layout */
      --gap: 16px;
      --card-aspect: 1;
      --icon-size: 96px;
      --card-radius: 24px;
      --container-padding: 20px;
      
      /* Animation */
      --transition-fast: 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-normal: 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-slow: 400ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0A1218;
        --bg-secondary: #101A22;
        --bg-tertiary: #16242E;
        --text-primary: #F5F7F7;
        --text-secondary: #A8B8C8;
        --text-muted: #687888;
        --border-color: rgba(255, 255, 255, 0.08);
        --search-bg: #16242E;
        --card-bg: #101A22;
        --card-hover: #16242E;
      }
    }
    
    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #F0F4F8;
        --bg-secondary: #FFFFFF;
        --bg-tertiary: #E8EFF5;
        --text-primary: #1A2A3A;
        --text-secondary: #4A5A6A;
        --text-muted: #8898A8;
        --border-color: rgba(14, 124, 140, 0.12);
        --search-bg: #FFFFFF;
        --card-bg: #FFFFFF;
        --card-hover: #F0F8FA;
      }
    }
    
    /* Forced dark theme as primary (Sailfish style) */
    :root {
      --bg-primary: #0A1218;
      --bg-secondary: #101A22;
      --bg-tertiary: #16242E;
      --text-primary: #F5F7F7;
      --text-secondary: #A8B8C8;
      --text-muted: #687888;
      --border-color: rgba(255, 255, 255, 0.08);
      --search-bg: #16242E;
      --card-bg: #101A22;
      --card-hover: #16242E;
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      min-height: 100vh;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* ========================================
       Background Atmosphere
       ======================================== */
    .bg-atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .bg-atmosphere::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--deep-teal) 0%, transparent 70%);
      opacity: 0.08;
      filter: blur(100px);
      animation: float 20s ease-in-out infinite;
    }
    
    .bg-atmosphere::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle at 70% 70%, var(--sea-green) 0%, transparent 70%);
      opacity: 0.06;
      filter: blur(100px);
      animation: float 25s ease-in-out infinite reverse;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.05); }
    }
    
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.5;
    }
    
    /* ========================================
       Header
       ======================================== */
    .header {
      position: relative;
      z-index: 10;
      padding: var(--container-padding);
      padding-bottom: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }
    
    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--deep-teal) 0%, var(--teal) 50%, var(--sky-blue) 100%);
      box-shadow: 
        0 4px 20px rgba(14, 124, 140, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }
    
    .logo-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
      pointer-events: none;
    }
    
    .logo-icon svg {
      width: 28px;
      height: 28px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      stroke: var(--fg-white);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    
    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    
    .logo-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--fg-white) 0%, var(--sky-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .logo-subtitle {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .stat-value {
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    
    .stat-label {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    
    /* ========================================
       Search
       ======================================== */
    .search-wrapper {
      position: relative;
      max-width: 1400px;
      margin: 0 auto 24px;
      padding: 0 var(--container-padding);
      z-index: 10;
    }
    
    .search-box {
      position: relative;
      width: 100%;
    }
    
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
      pointer-events: none;
      transition: stroke var(--transition-fast);
    }
    
    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 20px 0 56px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--search-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      outline: none;
      transition: 
        border-color var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast);
    }
    
    .search-input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }
    
    .search-input:hover {
      border-color: rgba(25, 167, 206, 0.4);
    }
    
    .search-input:focus {
      border-color: var(--teal);
      box-shadow: 
        0 0 0 3px rgba(25, 167, 206, 0.15),
        0 4px 20px rgba(20, 40, 60, 0.3);
      background: var(--bg-secondary);
    }
    
    .search-input:focus + .search-icon,
    .search-box:focus-within .search-icon {
      stroke: var(--teal);
    }
    
    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: 
        opacity var(--transition-fast),
        background var(--transition-fast),
        transform var(--transition-fast);
    }
    
    .clear-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      stroke-width: 2.5;
      fill: none;
    }
    
    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    
    .clear-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    
    .search-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 0 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .search-hint kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }
    
    /* ========================================
       Grid
       ======================================== */
    .main {
      position: relative;
      z-index: 10;
      padding: 0 var(--container-padding) var(--container-padding);
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--gap);
      list-style: none;
    }
    
    /* Responsive breakpoints */
    @media (max-width: 480px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      :root {
        --gap: 12px;
        --icon-size: 72px;
        --card-radius: 20px;
        --container-padding: 16px;
      }
    }
    
    @media (min-width: 481px) and (max-width: 768px) {
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      :root {
        --icon-size: 80px;
        --card-radius: 22px;
      }
    }
    
    @media (min-width: 769px) and (max-width: 1024px) {
      .games-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    
    @media (min-width: 1025px) and (max-width: 1280px) {
      .games-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }
    
    @media (min-width: 1281px) {
      .games-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
    
    @media (min-width: 1600px) {
      .games-grid {
        grid-template-columns: repeat(7, 1fr);
      }
    }
    
    /* ========================================
       Game Card
       ======================================== */
    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: var(--text-primary);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 20px 12px 16px;
      transition: 
        transform var(--transition-normal),
        border-color var(--transition-normal),
        box-shadow var(--transition-normal),
        background var(--transition-normal);
      animation: cardEntrance var(--transition-slow) cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      will-change: transform, box-shadow, border-color;
      isolation: isolate;
    }
    
    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(25, 167, 206, 0.5);
      background: var(--card-hover);
      box-shadow: 
        0 16px 48px rgba(20, 40, 60, 0.4),
        0 4px 16px rgba(20, 40, 60, 0.3),
        inset 0 1px 0 rgba(255,255,255,0.05);
      z-index: 10;
    }
    
    .game-card:focus-visible {
      outline: none;
      border-color: var(--teal);
      box-shadow: 
        0 0 0 3px rgba(25, 167, 206, 0.3),
        0 16px 48px rgba(20, 40, 60, 0.4),
        0 4px 16px rgba(20, 40, 60, 0.3);
    }
    
    .game-card:active {
      transform: translateY(-2px) scale(1.01);
      transition-duration: 50ms;
    }
    
    /* Staggered entrance animation */
    .game-card:nth-child(1)  { animation-delay: 0ms; }
    .game-card:nth-child(2)  { animation-delay: 20ms; }
    .game-card:nth-child(3)  { animation-delay: 40ms; }
    .game-card:nth-child(4)  { animation-delay: 60ms; }
    .game-card:nth-child(5)  { animation-delay: 80ms; }
    .game-card:nth-child(6)  { animation-delay: 100ms; }
    .game-card:nth-child(7)  { animation-delay: 120ms; }
    .game-card:nth-child(8)  { animation-delay: 140ms; }
    .game-card:nth-child(9)  { animation-delay: 160ms; }
    .game-card:nth-child(10) { animation-delay: 180ms; }
    .game-card:nth-child(11) { animation-delay: 200ms; }
    .game-card:nth-child(12) { animation-delay: 220ms; }
    .game-card:nth-child(13) { animation-delay: 240ms; }
    .game-card:nth-child(14) { animation-delay: 260ms; }
    .game-card:nth-child(15) { animation-delay: 280ms; }
    .game-card:nth-child(16) { animation-delay: 300ms; }
    .game-card:nth-child(17) { animation-delay: 320ms; }
    .game-card:nth-child(18) { animation-delay: 340ms; }
    .game-card:nth-child(19) { animation-delay: 360ms; }
    .game-card:nth-child(20) { animation-delay: 380ms; }
    .game-card:nth-child(21) { animation-delay: 400ms; }
    .game-card:nth-child(22) { animation-delay: 420ms; }
    .game-card:nth-child(23) { animation-delay: 440ms; }
    .game-card:nth-child(24) { animation-delay: 460ms; }
    .game-card:nth-child(25) { animation-delay: 480ms; }
    .game-card:nth-child(26) { animation-delay: 500ms; }
    .game-card:nth-child(27) { animation-delay: 520ms; }
    .game-card:nth-child(28) { animation-delay: 540ms; }
    .game-card:nth-child(29) { animation-delay: 560ms; }
    .game-card:nth-child(30) { animation-delay: 580ms; }
    
    /* For >30, reuse pattern */
    .game-card:nth-child(n+31) { animation-delay: 600ms; }
    
    /* ========================================
       SailfishOS Style Icon System
       ======================================== */
    .game-icon {
      position: relative;
      width: var(--icon-size);
      height: var(--icon-size);
      margin-bottom: 12px;
      border-radius: calc(var(--icon-size) * 0.26); /* ~26% for squircle feel */
      overflow: hidden;
      flex-shrink: 0;
      /* Squircle approximation using multiple border-radius values */
      border-radius: 28% 26% 28% 26% / 26% 28% 26% 28%;
    }
    
    /* Base icon container with gradient background */
    .icon-canvas {
      position: absolute;
      inset: 0;
      /* Squircle clip path for Sailfish feel */
      clip-path: path("M0,0.26C0,0.116 0.116,0 0.26,0H0.74C0.884,0 1,0.116 1,0.26V0.74C1,0.884 0.884,1 0.74,1H0.26C0.116,1 0,0.884 0,0.74V0.26Z");
      /* Fallback for browsers without clip-path:path() */
      border-radius: 28% 26% 28% 26% / 26% 28% 26% 28%;
    }
    
    /* Icon background - main color block */
    .icon-bg {
      position: absolute;
      inset: 0;
      background: var(--icon-gradient);
    }
    
    /* Icon symbol - negative space cutout (mask) */
    .icon-symbol {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Negative space: white symbol on colored bg, using mask */
      -webkit-mask: var(--icon-mask);
      mask: var(--icon-mask);
      background: var(--fg-white);
    }
    
    /* Accent element */
    .icon-accent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    
    .icon-accent svg {
      width: var(--icon-size);
      height: var(--icon-size);
    }
    
    /* Long shadow (flat long shadow style) */
    .icon-shadow {
      position: absolute;
      inset: calc(var(--icon-size) * -0.5);
      background: 
        linear-gradient(135deg, 
          rgba(20,40,60,0) 0%, 
          rgba(20,40,60,0.15) 50%, 
          rgba(20,40,60,0.25) 100%);
      transform: translate(calc(var(--icon-size) * 0.12), calc(var(--icon-size) * 0.12));
      border-radius: inherit;
      z-index: -1;
      opacity: 0.6;
      filter: blur(calc(var(--icon-size) * 0.02));
    }
    
    /* Highlight for glass/water elements */
    .icon-highlight {
      position: absolute;
      top: calc(var(--icon-size) * 0.1);
      left: calc(var(--icon-size) * 0.1);
      width: calc(var(--icon-size) * 0.35);
      height: calc(var(--icon-size) * 0.35);
      background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    
    /* Alternating rotation: odd = 0deg, even = 90deg */
    .game-card:nth-child(odd) .game-icon {
      transform: rotate(0deg);
    }
    
    .game-card:nth-child(even) .game-icon {
      transform: rotate(90deg);
    }
    
    /* Hover rotation reset for interaction */
    .game-card:hover .game-icon,
    .game-card:focus-visible .game-icon {
      transform: rotate(0deg) scale(1.05);
      transition: transform var(--transition-normal);
    }
    
    .game-card:nth-child(even):hover .game-icon,
    .game-card:nth-child(even):focus-visible .game-icon {
      transform: rotate(0deg) scale(1.05);
    }
    
    /* ========================================
       Card Content
       ======================================== */
    .game-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 4px;
      transition: color var(--transition-fast);
    }
    
    .game-card:hover .game-title {
      color: var(--sky-blue);
    }
    
    /* ========================================
       Empty State
       ======================================== */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      grid-column: 1 / -1;
    }
    
    .empty-state.visible {
      display: flex;
    }
    
    .empty-icon {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--deep-teal), var(--teal));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(14, 124, 140, 0.3);
    }
    
    .empty-icon svg {
      width: 40px;
      height: 40px;
      stroke: var(--fg-white);
      stroke-width: 2;
      fill: none;
    }
    
    .empty-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .empty-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      max-width: 300px;
    }
    
    /* ========================================
       Loading State
       ======================================== */
    .loading-skeleton {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      animation: skeletonPulse 1.5s ease-in-out infinite;
    }
    
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .skeleton-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 28% 26% 28% 26% / 26% 28% 26% 28%;
      background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 12px;
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

      width: 80%;
      height: 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);

      animation: shimmer 1.5s infinite;
    }
    
    /* ========================================
       Footer
       ======================================== */
    .footer {
      position: relative;
      z-index: 10;
      padding: 24px var(--container-padding);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border-color);
      margin-top: 20px;
    }
    
    .footer a {
      color: var(--teal);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    
    .footer a:hover {
      color: var(--sky-blue);
      text-decoration: underline;
    }
    
    /* ========================================
       Reduced Motion
       ======================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .game-card {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }
    
    /* ========================================
       Scrollbar
       ======================================== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
      border: 2px solid transparent;
      background-clip: content-box;
    }
  </style>

      // Deterministic hash from string
      function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash);
      }
      
      // Seeded random
      function seededRandom(seed, index) {
        const x = Math.sin(seed + index * 12.9898) * 43758.5453;
        return x - Math.floor(x);
      }
      
      // Pick from array deterministically
      function pick(arr, seed, index) {
        return arr[Math.floor(seededRandom(seed, index) * arr.length)];
      }
      
      // Generate icon configuration for a game
      function generateIconConfig(title, index) {
        const seed = hashString(title);
        const isEven = index % 2 === 0; // 0-indexed: even = odd number (1st, 3rd...)
        
        // Pick color scheme (70% ocean, 30% accent)
        const useOcean = seededRandom(seed, 0) < 0.7;
        const colorPair = useOcean 
          ? pick(OCEAN_COLORS, seed, 1)
          : pick(ACCENT_COLORS, seed, 1);
        
        const gradient = `linear-gradient(135deg, ${colorPair.start} 0%, ${colorPair.end} 100%)`;
        
        // Pick shape family
        const shapeFamily = pick(SHAPE_TYPES, seed, 2);
        
        // Pick symbol from same family (coherent design)
        const familySymbols = SYMBOLS.filter(s => s.family === shapeFamily);
        const mixedSymbols = [...familySymbols, ...SYMBOLS.filter(s => s.family !== shapeFamily)];
        const symbol = pick(mixedSymbols, seed, 3);
        
        // Accent decision (30% chance)
        const hasAccent = seededRandom(seed, 4) < 0.3;
        const accentSymbol = hasAccent ? pick(SYMBOLS.filter(s => s.family !== symbol.family), seed, 5) : null;
        
        // Highlight (for glass/water feel - 40% chance on organic/circle)
        const hasHighlight = (shapeFamily !== 'squircle') && seededRandom(seed, 6) < 0.4;
        
        // Shadow style (long shadow vs soft shadow)
        const useLongShadow = seededRandom(seed, 7) < 0.6;
        
        return {
          gradient,
          symbol: symbol.svg,
          symbolName: symbol.name,
          accent: hasAccent ? accentSymbol.svg : null,
          accentName: hasAccent ? accentSymbol.name : null,
          hasHighlight,
          useLongShadow,
          isEven: !isEven, // 1-based indexing for rotation rule
        };
      }
      
      // Create icon HTML
      function createIconHTML(config, size) {
        const { gradient, symbol, accent, hasHighlight, useLongShadow } = config;
        
        let html = '<div class="game-icon" style="--icon-size: ' + size + 'px;">';

        html += '<div class="icon-bg" style="--icon-gradient: ' + gradient + ';"></div>';

          html += '<div class="icon-accent">';
          html += '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">';

          html += '</svg>';
          html += '</div>';
        }
        
        if (hasHighlight) {
          html += '<div class="icon-highlight"></div>';
        }
        
        if (useLongShadow) {
          html += '<div class="icon-shadow"></div>';
        }
        
        html += '</div></div>';
        return html;
      }
      
      return { generateIconConfig, createIconHTML };

      const fragment = document.createDocumentFragment();
      
      games.forEach((game, index) => {
        const card = renderGameCard(game, index);
        fragment.appendChild(card);
      });
      
      grid.appendChild(fragment);
    }
    
    function updateCounts() {
      const total = GAMES.length;
      const filtered = filteredGames.length;
      
      totalCountEl.textContent = total;
      filteredCountEl.textContent = filtered;
      footerCountEl.textContent = total;
    }
    
    // ========================================
    // Search / Filter
    // ========================================
    function filterGames(query) {
      searchQuery = query.trim().toLowerCase();
      
      if (searchQuery === '') {
        filteredGames = [...GAMES];
      } else {
        filteredGames = GAMES.filter(game => 
          game.title.toLowerCase().includes(searchQuery)
        );
      }
      
      // Clear search visibility
      clearBtn.classList.toggle('visible', searchQuery !== '');
      
      renderGrid(filteredGames);
      updateCounts();
    }
    
    // Debounced search
    let searchTimeout = null;
    function debouncedFilter(query) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => filterGames(query), 80);
    }
    
    // ========================================
    // Event Listeners
    // ========================================
    searchInput.addEventListener('input', (e) => {
      debouncedFilter(e.target.value);
    });
    
    searchInput.addEventListener('focus', () => {
      searchInput.parentElement.style.borderColor = 'var(--teal)';
    });
    
    searchInput.addEventListener('blur', () => {
      searchInput.parentElement.style.borderColor = '';
    });
    
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      filterGames('');
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Focus search on /
      if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
      // Clear on Escape
      if (e.key === 'Escape') {
        if (document.activeElement === searchInput || searchQuery !== '') {
          searchInput.value = '';
          searchInput.blur();
          filterGames('');
        }
      }
    });
    
    // ========================================
    // Initialization
    // ========================================
    function init() {
      if (isInitialized) return;
      
      // Sort games alphabetically (already sorted from build)
      // GAMES.sort((a, b) => a.title.localeCompare(b.title));
      
      filteredGames = [...GAMES];
      renderGrid(filteredGames);
      updateCounts();
      
      isInitialized = true;
      
      // Announce ready for screen readers
      const announcement = document.createElement('div');
      announcement.setAttribute('role', 'status');
      announcement.setAttribute('aria-live', 'polite');
      announcement.style.position = 'absolute';
      announcement.style.left = '-9999px';
      announcement.textContent = `游戏大厅已加载，共 ${GAMES.length} 款游戏`;
      document.body.appendChild(announcement);
      setTimeout(() => announcement.remove(), 3000);
    }
    
    // Initialize when DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
    
    // ========================================
    // Performance: Intersection Observer for animation
    // ========================================
    if ('IntersectionObserver' in window) {
      const cardObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.animationPlayState = 'running';
            cardObserver.unobserve(entry.target);
          }
        });
      }, { rootMargin: '50px', threshold: 0.1 });
      
      // Observe cards after render
      const observeCards = () => {
        document.querySelectorAll('.game-card').forEach(card => {
          card.style.animationPlayState = 'paused';
          cardObserver.observe(card);
        });
      };
      
      // Hook into render
      const originalRender = renderGrid;
      renderGrid = function(games) {
        originalRender(games);
        requestAnimationFrame(observeCards);
      };
    }
  </script>
</body>
</html>
