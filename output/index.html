        // 格式化时间显示
        function formatTime(timeStr) {
            const now = new Date();
            const newsDate = new Date(timeStr.replace(/-/g, '/'));
            const diffHours = (now - newsDate) / (1000 * 60 * 60);
            
            if (diffHours < 1) {
                const mins = Math.floor((now - newsDate) / (1000 * 60));
                return `${mins}分钟前`;
            } else if (diffHours < 24) {
                return `${Math.floor(diffHours)}小时前`;
            } else if (diffHours < 48) {
                return `昨天 ${timeStr.split(' ')[1] || ''}`;
            } else {
                return timeStr;
            }
        }
        
        // 创建新闻卡片 HTML
        function createNewsCard(news) {
            const tagsHtml = news.tags.map(tag => `<span class="news-tag">${tag}</span>`).join('');
            const isFeatured = news.category === 'featured';
            
            return `
                <article class="news-card ${isFeatured ? 'featured' : ''}">
                    <span class="news-badge badge-${news.badge}">${news.badgeText}</span>
                    <h3 class="news-title">
                        <a href="${news.url}" target="_blank" rel="noopener noreferrer">${news.title}</a>
                    </h3>
                    <p class="news-summary">${news.summary}</p>
                    <div class="news-meta">
                        <span class="news-source ${news.sourceClass}">${news.source}</span>
                        <span class="news-time">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            ${formatTime(news.time)}
                        </span>
                    </div>
                    <div class="news-tags">
                        ${tagsHtml}
                    </div>
                </article>
            `;
        }
        
        // 渲染各分类
        function renderCategory(categoryId, categoryName) {
            const container = document.getElementById(`${categoryId}-grid`);
            const filteredNews = newsData.filter(n => n.category === categoryName);
            container.innerHTML = filteredNews.map(createNewsCard).join('');
            
            // 更新计数
            const countEl = document.querySelector(`#${categoryId}-section .section-count`);
            if (countEl) {
                countEl.textContent = `${filteredNews.length} 篇`;
            }
        }
        
        // 初始化渲染
        document.addEventListener('DOMContentLoaded', function() {
            renderCategory('featured', 'featured');
            renderCategory('models', 'models');
            renderCategory('funding', 'funding');
            renderCategory('research', 'research');
            renderCategory('industry', 'industry');
            
            // 更新日期
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').textContent = today.toLocaleDateString('zh-CN', options);
            
            // 更新时间
            const hours = today.getHours().toString().padStart(2, '0');
            const minutes = today.getMinutes().toString().padStart(2, '0');
            document.getElementById('update-time').textContent = `更新于 ${hours}:${minutes}`;
        });
        
        // 平滑滚动锚点
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
