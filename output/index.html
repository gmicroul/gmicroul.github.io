<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg-deep:#081820;
  --bg-panel:#0d2430;
  --ink:#f5f7f7;
  --ink-dim:#8fb3c0;
  --teal-deep:#0E7C8C;
  --teal:#19A7CE;
  --sky:#4FC3F7;
  --seagreen:#2EBD85;
  --green-deep:#15966B;
  --coral:#F0544F;
  --orange:#F59B23;
  --yellow:#FFD34E;
  --magenta:#B03A6B;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(25,167,206,.18), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(46,189,133,.12), transparent 60%),
    var(--bg-deep);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  background:rgba(8,24,32,.78);
  border-bottom:1px solid rgba(79,195,247,.14);
}
.header-inner{
  max-width:1280px;margin:0 auto;
  padding:18px 20px 14px;
  display:flex;flex-direction:column;gap:14px;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-icon{
  width:52px;height:52px;flex:0 0 52px;
  border-radius:30%;
  background:linear-gradient(135deg,#4FC3F7 0%,#19A7CE 55%,#0E7C8C 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(20,40,60,.35), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;
}
.brand-icon::after{ /* 高光：左上小面积半透明白叠层 */
  content:"";position:absolute;top:6%;left:8%;width:44%;height:30%;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,0));
}
.brand-icon svg{width:60%;height:60%;position:relative;z-index:1;}
.brand h1{font-size:1.35rem;font-weight:700;letter-spacing:.5px;}
.brand p{font-size:.8rem;color:var(--ink-dim);margin-top:2px;}
/* ---------- search ---------- */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.search-wrap{
  flex:1 1 260px;position:relative;display:flex;align-items:center;
}
.search-wrap svg{
  position:absolute;left:14px;width:18px;height:18px;
  stroke:var(--ink-dim);pointer-events:none;
}
#search{
  width:100%;
  padding:12px 16px 12px 42px;
  font-size:.95rem;color:var(--ink);
  background:rgba(13,36,48,.9);
  border:1px solid rgba(79,195,247,.2);
  border-radius:999px;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
#search::placeholder{color:var(--ink-dim);}
#search:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(25,167,206,.22);
}
.count-badge{
  flex:0 0 auto;
  font-size:.82rem;color:var(--ink-dim);
  background:rgba(13,36,48,.9);
  border:1px solid rgba(79,195,247,.2);
  padding:10px 16px;border-radius:999px;
  white-space:nowrap;
}
.count-badge b{color:var(--sky);font-size:.95rem;}
/* ---------- grid ---------- */
main{max-width:1280px;margin:0 auto;padding:26px 20px 60px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:18px;
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;}
  main{padding:18px 12px 48px;}
  .brand h1{font-size:1.1rem;}
}
/* ---------- card ---------- */
.card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:16px 10px 14px;
  background:linear-gradient(160deg,rgba(19,48,63,.85),rgba(11,30,40,.85));
  border:1px solid rgba(79,195,247,.12);
  border-radius:var(--radius);
  cursor:pointer;text-decoration:none;color:inherit;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  border-color:rgba(79,195,247,.45);
  box-shadow:0 14px 30px rgba(20,40,60,.4);
  outline:none;
}
.card:active{transform:translateY(-1px) scale(.98);}
/* SailfishOS 风格图标：squircle 母形 + 海洋系渐变(135°) + 白色符号 + 左上高光 + 统一柔和投影 */
.icon{
  width:64px;height:64px;
  border-radius:30%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.6rem;color:#fff;
  text-shadow:0 1px 2px rgba(20,40,60,.3);
  box-shadow:0 8px 18px rgba(20,40,60,.28), inset 0 1px 0 rgba(255,255,255,.22);
  position:relative;overflow:hidden;
  user-select:none;
}
.icon::after{
  content:"";position:absolute;top:5%;left:8%;width:46%;height:32%;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,0));
  pointer-events:none;
}
.icon span{position:relative;z-index:1;line-height:1;}
@media (max-width:560px){
  .icon{width:52px;height:52px;font-size:1.3rem;}
}
.card .name{
  font-size:.82rem;font-weight:600;text-align:center;
  line-height:1.3;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;
  max-width:100%;
}
.card:hover .name{color:var(--sky);}
.empty{
  text-align:center;padding:80px 20px;color:var(--ink-dim);
  grid-column:1/-1;
}
.empty .big{font-size:2.4rem;margin-bottom:12px;}
footer{
  text-align:center;color:var(--ink-dim);font-size:.75rem;
  padding:24px 20px 40px;
}
</style>
</head>

  <div class="header-inner">

        </svg>
      </div>
      <div>
        <h1>游戏大厅 · Game Hub</h1>
        <p>HTML5 游戏导航 — 点击卡片即玩</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input id="search" type="search" placeholder="搜索游戏… / Search games" autocomplete="off" aria-label="搜索游戏">
      </div>
      <div class="count-badge">共 <b id="total">0</b> 款 · 显示 <b id="shown">0</b> 款</div>
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>

/* SailfishOS 配色：海洋系为主（>60%），少量暖色点缀；渐变方向 135°（左上光源） */
const PALETTE = [
  ["#4FC3F7","#19A7CE"],  /* 天蓝→青 */
  ["#19A7CE","#0E7C8C"],  /* 青→深青 */
  ["#2EBD85","#15966B"],  /* 海绿→深绿 */
  ["#19A7CE","#15966B"],  /* 青→深绿 */
  ["#4FC3F7","#0E7C8C"],  /* 天蓝→深青 */
  ["#2EBD85","#0E7C8C"],  /* 海绿→深青 */
  ["#F59B23","#F0544F"],  /* 橙→珊瑚（点缀） */
  ["#FFD34E","#F59B23"],  /* 明黄→橙（点缀） */
  ["#C56CD6","#E85D9E"]   /* 紫粉渐变（点缀） */
];

function hashStr(s){
  let h = 0;
  for (let i = 0; i < s.length; i++){
    h = (h * 31 + s.charCodeAt(i)) >>> 0;
  }
  return h;
}

function firstLetter(name){
  for (const ch of name){
    if (/[A-Za-z0-9\u4e00-\u9fff]/.test(ch)) return ch.toUpperCase();
  }
  return "?";
}

const grid = document.getElementById("grid");
const searchInput = document.getElementById("search");
const totalEl = document.getElementById("total");
const shownEl = document.getElementById("shown");

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(list){
  shownEl.textContent = list.length;
  if (list.length === 0){
    grid.innerHTML = '<div class="empty"><div class="big">🏝️</div>没有找到匹配的游戏，换个关键词试试</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for (const g of list){
    const [c1, c2] = PALETTE[hashStr(g.name) % PALETTE.length];
    const a = document.createElement("a");
    a.className = "card";
    a.href = g.url;
    a.title = g.name;
    a.innerHTML =
      '<div class="icon" style="background:linear-gradient(135deg,' + c1 + ' 0%,' + c2 + ' 100%)">' +
        '<span>' + esc(firstLetter(g.name)) + '</span>' +
      '</div>' +
      '<div class="name">' + esc(g.name) + '</div>';
    frag.appendChild(a);
  }
  grid.innerHTML = "";
  grid.appendChild(frag);
}

function filter(){
  const q = searchInput.value.trim().toLowerCase();
  if (!q){ render(GAMES); return; }
  render(GAMES.filter(g => g.name.toLowerCase().includes(q) || g.url.toLowerCase().includes(q)));
}

totalEl.textContent = GAMES.length;
render(GAMES);
searchInput.addEventListener("input", filter);
</script>
