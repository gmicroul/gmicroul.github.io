<style>
:root {
  --bg: #0a1620;
  --bg-elevated: #112233;
  --fg: #f0f5f8;
  --fg-muted: #8aa0b0;
  --accent: #19a7ce;
  --accent-strong: #4fc3f7;
  --card-bg: rgba(17,34,51,0.85);
  --card-border: rgba(25,167,206,0.18);
  --card-hover-border: rgba(25,167,206,0.5);
  --shadow: rgba(20,40,60,0.35);
  --shadow-strong: rgba(20,40,60,0.5);
  --search-bg: rgba(10,22,32,0.9);
  --search-border: rgba(25,167,206,0.25);
  --search-focus-border: #19a7ce;
  --badge-bg: rgba(25,167,206,0.15);
  --badge-fg: #4fc3f7;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #e8f0f5;
    --bg-elevated: #ffffff;
    --fg: #1a2a35;
    --fg-muted: #5a7a8a;
    --accent: #0e7c8c;
    --accent-strong: #15966b;
    --card-bg: rgba(255,255,255,0.95);
    --card-border: rgba(14,124,140,0.18);
    --card-hover-border: rgba(14,124,140,0.5);
    --shadow: rgba(14,60,80,0.15);
    --shadow-strong: rgba(14,60,80,0.25);
    --search-bg: rgba(255,255,255,0.95);
    --search-border: rgba(14,124,140,0.2);
    --search-focus-border: #0e7c8c;
    --badge-bg: rgba(14,124,140,0.12);
    --badge-fg: #0e7c8c;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  line-height: 1.5;
  transition: background 0.3s ease, color 0.3s ease;
}

.page {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.header {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
  text-align: center;
}

.header h1 {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  color: var(--fg-muted);
  font-size: clamp(0.9rem, 2vw, 1.05rem);
}

.stats {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--badge-bg);
  color: var(--badge-fg);
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  align-self: center;
  border: 1px solid var(--card-border);
}

.search-wrapper {
  position: relative;
  max-width: 560px;
  margin: 0 auto 32px;
}

.search-input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  font-size: 1rem;
  background: var(--search-bg);
  border: 2px solid var(--search-border);
  border-radius: 14px;
  color: var(--fg);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.search-input::placeholder { color: var(--fg-muted); opacity: 0.7; }

.search-input:focus {
  border-color: var(--search-focus-border);
  box-shadow: 0 0 0 4px rgba(25,167,206,0.15);
  background: var(--bg-elevated);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--fg-muted);
  stroke-width: 2;
  pointer-events: none;
  transition: stroke 0.2s ease;
}

.search-input:focus + .search-icon { stroke: var(--accent); }

.clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: var(--fg-muted);
  cursor: pointer;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
}

.clear-btn.visible { opacity: 1; pointer-events: auto; }
.clear-btn:hover { background: var(--card-border); color: var(--fg); }
.clear-btn svg { width: 18px; height: 18px; stroke-width: 2.5; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}

@media (min-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
@media (min-width: 1400px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

.card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s cubic-bezier(0.2, 0.6, 0.3, 1),
              border-color 0.2s ease,
              box-shadow 0.2s ease;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--card-hover-border);
  box-shadow: 0 16px 40px var(--shadow), 0 4px 12px var(--shadow-strong);
}

.card:active { transform: translateY(-2px) scale(1.01); }

.card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(25,167,206,0.3);
}

.icon-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--icon-from) 0%, var(--icon-to) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.icon-wrapper::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
  pointer-events: none;
}

.icon-svg {
  width: 62%;
  height: 62%;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  transition: transform 0.3s ease;
}

.card:hover .icon-svg { transform: scale(1.08) rotate(-2deg); }

.card-title {
  padding: 12px 10px;
  font-size: 0.82rem;
  font-weight: 600;
  line-height: 1.3;
  text-align: center;
  color: var(--fg);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.card:hover .card-title { color: var(--accent-strong); }

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-muted);
}

.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: 1rem; }

.loading { text-align: center; padding: 40px; color: var(--fg-muted); }
.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--card-border);
  border-top-color: var(--accent);
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

// ============ SailfishOS Icon Generator ============
const PALETTES = [
  { from: "#0E7C8C", to: "#19A7CE" },
  { from: "#15966B", to: "#2EBD85" },
  { from: "#19A7CE", to: "#4FC3F7" },
  { from: "#0E7C8C", to: "#15966B" },
  { from: "#2EBD85", to: "#4FC3F7" },
  { from: "#15966B", to: "#19A7CE" },
  { from: "#4FC3F7", to: "#0E7C8C" },
  { from: "#2EBD85", to: "#0E7C8C" },
  { from: "#19A7CE", to: "#2EBD85" },
  { from: "#0E7C8C", to: "#4FC3F7" },
];

const ICON_SHAPES = [
  // Circle family (concentric)
  (seed) => {
    const r1 = 0.42 + (seed * 0.03) % 0.08;
    const r2 = 0.22 + (seed * 0.07) % 0.08;
    const hasDot = seed % 3 === 0;
    return `<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="${r1*100}" fill="white" fill-opacity="0.95"/><circle cx="50" cy="50" r="${r2*100}" fill="${PALETTES[seed%PALETTES.length].from}"/>` + (hasDot ? `<circle cx="50" cy="50" r="4" fill="#B03A6B"/>` : "") + `</svg>`;
  },
  // Squircle family (rounded rect with continuous curvature)
  (seed) => {
    const r = 24 + (seed * 3) % 12;
    const innerR = r * 0.55;
    const type = seed % 4;
    if (type === 0) {
      return `<svg viewBox="0 0 100 100"><path d="M${r},0 H${100-r} C${100-r+innerR},0 ${100},${innerR} ${100},${r} V${100-r} C${100},${100-r+innerR} ${100-r+innerR},${100} ${100-r},${100} H${r} C${r-innerR},${100} 0,${100-r+innerR} 0,${100-r} V${r} C0,${r-innerR} ${r-innerR},0 ${r},0 Z" fill="white" fill-opacity="0.95"/><rect x="${20}" y="${20}" width="${60}" height="${60}" rx="${innerR*0.6}" fill="${PALETTES[seed%PALETTES.length].from}"/></svg>`;
    } else if (type === 1) {
      return `<svg viewBox="0 0 100 100"><path d="M${r},0 H${100-r} C${100-r+innerR},0 ${100},${innerR} ${100},${r} V${100-r} C${100},${100-r+innerR} ${100-r+innerR},${100} ${100-r},${100} H${r} C${r-innerR},${100} 0,${100-r+innerR} 0,${100-r} V${r} C0,${r-innerR} ${r-innerR},0 ${r},0 Z" fill="white" fill-opacity="0.95"/><path d="M30,50 L45,65 L70,30" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
    } else if (type === 2) {
      return `<svg viewBox="0 0 100 100"><path d="M${r},0 H${100-r} C${100-r+innerR},0 ${100},${innerR} ${100},${r} V${100-r} C${100},${100-r+innerR} ${100-r+innerR},${100} ${100-r},${100} H${r} C${r-innerR},${100} 0,${100-r+innerR} 0,${100-r} V${r} C0,${r-innerR} ${r-innerR},0 ${r},0 Z" fill="white" fill-opacity="0.95"/><circle cx="50" cy="50" r="22" fill="${PALETTES[seed%PALETTES.length].from}"/><circle cx="50" cy="50" r="10" fill="white" fill-opacity="0.95"/></svg>`;
    } else {
      return `<svg viewBox="0 0 100 100"><path d="M${r},0 H${100-r} C${100-r+innerR},0 ${100},${innerR} ${100},${r} V${100-r} C${100},${100-r+innerR} ${100-r+innerR},${100} ${100-r},${100} H${r} C${r-innerR},${100} 0,${100-r+innerR} 0,${100-r} V${r} C0,${r-innerR} ${r-innerR},0 ${r},0 Z" fill="white" fill-opacity="0.95"/><path d="M30,50 H70 M50,30 V70" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/></svg>`;
    }
  },
  // Organic flow (teardrop/leaf/comma)
  (seed) => {
    const t = seed % 5;
    const p = PALETTES[seed%PALETTES.length];
    if (t === 0) { // teardrop
      return `<svg viewBox="0 0 100 100"><path d="M50,15 C30,15 15,35 15,55 C15,75 30,85 50,85 C70,85 85,75 85,55 C85,35 70,15 50,15 Z" fill="white" fill-opacity="0.95"/><path d="M50,15 C30,15 15,35 15,55 C15,75 30,85 50,85 C70,85 85,75 85,55 C85,35 70,15 50,15 Z" fill="${p.from}" fill-opacity="0.3"/><ellipse cx="50" cy="40" rx="14" ry="18" fill="${p.from}"/></svg>`;
    } else if (t === 1) { // leaf
      return `<svg viewBox="0 0 100 100"><path d="M50,10 C25,30 15,55 30,75 C40,90 50,85 50,85 C50,85 60,90 70,75 C85,55 75,30 50,10 Z" fill="white" fill-opacity="0.95"/><path d="M50,10 C25,30 15,55 30,75 C40,90 50,85 50,85" fill="${p.from}" fill-opacity="0.3"/><path d="M50,15 Q50,45 50,70" stroke="${p.from}" stroke-width="3" fill="none"/></svg>`;
    } else if (t === 2) { // comma/blob
      return `<svg viewBox="0 0 100 100"><path d="M60,25 C40,25 25,40 25,58 C25,75 38,88 55,88 C70,88 82,78 88,65 C92,52 88,38 72,32 C58,28 45,25 35,28 C42,24 52,22 60,25 Z" fill="white" fill-opacity="0.95"/><path d="M60,25 C40,25 25,40 25,58 C25,75 38,88 55,88 C70,88 82,78 88,65" fill="${p.from}" fill-opacity="0.4"/><circle cx="70" cy="35" r="14" fill="${p.from}"/></svg>`;
    } else if (t === 3) { // arch/dome
      return `<svg viewBox="0 0 100 100"><path d="M20,70 Q20,35 50,20 Q80,35 80,70 Z" fill="white" fill-opacity="0.95"/><path d="M30,60 Q30,40 50,30 Q70,40 70,60" fill="${p.from}"/><circle cx="50" cy="55" r="8" fill="white" fill-opacity="0.95"/></svg>`;
    } else { // bubble trio
      return `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="28" fill="white" fill-opacity="0.95"/><circle cx="38" cy="45" r="6" fill="${p.from}"/><circle cx="50" cy="38" r="6" fill="#B03A6B"/><circle cx="62" cy="45" r="6" fill="${p.to}"/></svg>`;
    }
  },
];

function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function generateIconSvg(title, index) {
  const seed = hashString(title + index);
  const palette = PALETTES[seed % PALETTES.length];
  const shapeFn = ICON_SHAPES[seed % ICON_SHAPES.length];
  const svg = shapeFn(seed);
  return { svg, palette };
}

// ============ Render ============
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const emptyState = document.getElementById('emptyState');
const statsEl = document.getElementById('stats');

let filteredGames = [...GAMES];

function renderGames(games) {
  grid.innerHTML = '';
  if (games.length === 0) {
    emptyState.classList.remove('hidden');
    return;
  }
  emptyState.classList.add('hidden');
  
  const fragment = document.createDocumentFragment();
  games.forEach((game, idx) => {
    const { svg, palette } = generateIconSvg(game.title, idx);
    const card = document.createElement('a');
    card.className = 'card';
    card.href = game.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.role = 'listitem';
    card.style.setProperty('--icon-from', palette.from);
    card.style.setProperty('--icon-to', palette.to);
    card.innerHTML = `
      <div class="icon-wrapper" aria-hidden="true">${svg}</div>
      <div class="card-title">${escapeHtml(game.title)}</div>
    `;
    fragment.appendChild(card);
  });
  grid.appendChild(fragment);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function filterGames(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    filteredGames = [...GAMES];
  } else {
    filteredGames = GAMES.filter(g => g.title.toLowerCase().includes(q));
  }
  statsEl.textContent = `共 ${filteredGames.length} 款游戏${q ? ` (筛选自 ${GAMES.length} 款)` : ''}`;
  renderGames(filteredGames);
}

searchInput.addEventListener('input', (e) => {
  const val = e.target.value;
  clearBtn.classList.toggle('visible', val.length > 0);
  filterGames(val);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  filterGames('');
  searchInput.focus();
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    clearBtn.classList.remove('visible');
    filterGames('');
    searchInput.blur();
  }
});

// Initial render
filterGames('');
</script>
