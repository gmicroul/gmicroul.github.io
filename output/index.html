<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SFOS 游戏大厅</title>
<style>
:root{
  --bg:#101418; --panel:#161b22; --panel2:#1c232c;
  --text:#e8eef2; --dim:#8b98a5; --accent:#00b7c3; --accent2:#2ed0a2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}
header{
  position:sticky; top:0; z-index:20;
  background:rgba(16,20,24,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,183,195,.18);
}
.bar{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.4px}
.logo .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 10px rgba(0,183,195,.8)}
.logo em{font-style:normal;color:var(--accent)}
.count{font-size:12.5px;color:var(--dim);background:var(--panel);border:1px solid rgba(0,183,195,.25);
  padding:4px 12px;border-radius:999px;white-space:nowrap}
.search{flex:1 1 220px;max-width:420px;margin-left:auto}
.search input{
  width:100%;padding:9px 14px;border-radius:999px;border:1px solid rgba(0,183,195,.25);
  background:var(--panel);color:var(--text);font-size:14px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,183,195,.15)}
.search input::placeholder{color:var(--dim)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px;gap:10px;flex-wrap:wrap}
.toolbar h2{font-size:15px;color:var(--dim);font-weight:600}
#result{font-size:13px;color:var(--accent2)}
#empty{display:none;text-align:center;color:var(--dim);padding:60px 0;font-size:15px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
  gap:10px;
}
.card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:108px;height:108px;padding:6px;
  background:var(--panel);border:1px solid rgba(255,255,255,.05);
  text-decoration:none;color:var(--text);border-radius:0;
  transition:transform .12s, background .12s, border-color .12s;
}
.card:hover{transform:translateY(-3px);background:var(--panel2);border-color:rgba(0,183,195,.45)}
.card:active{transform:scale(.96)}
.card .ic{width:86px;height:86px;flex:none}
.card .ic img{width:100%;height:100%;display:block}
.card .nm{
  width:100%;font-size:11.5px;line-height:14px;font-weight:600;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;color:var(--dim);
}
.card:hover .nm{color:var(--text)}
footer{padding:16px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid rgba(255,255,255,.05)}
@media (max-width:430px){
  .grid{gap:8px;grid-template-columns:repeat(2,1fr)}
  .bar{row-gap:10px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="dot"></span>SFOS <em>游戏大厅</em></div>
    <span class="count" id="totalCount"></span>
    <div class="search"><input id="q" type="search" placeholder="搜索游戏 / Search..." autocomplete="off"></div>
  </div>
</header>
<main>
  <div class="toolbar">
    <h2>全部游戏</h2>
    <span id="result"></span>
  </div>
  <div id="empty">没有找到匹配的游戏</div>
  <div class="grid" id="grid"></div>
</main>
<footer>SFOS Game Hub &middot; 点击卡片开始游戏</footer>
