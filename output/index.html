<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg:#121317; --bg2:#181a20; --panel:#16181d; --panel2:#1d2027;
  --card:#1e2129; --card2:#242830; --line:rgba(255,255,255,.07);
  --text:#eef1f4; --dim:#9aa3b0; --amber:#ffc24b; --amber2:#ffd98a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(170deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed; color:var(--text); min-height:100vh;
}
.topbar{
  position:sticky; top:0; z-index:20;
  background:rgba(18,19,23,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.inner{max-width:1100px;margin:0 auto;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{
  width:30px;height:30px;flex:none;
  background:linear-gradient(135deg,var(--amber),var(--amber2));
  position:relative; border-radius:7px;
}
.mark::after{
  content:"";position:absolute;inset:7px 6px 6px 7px;
  background:var(--bg); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.brand h1 em{font-style:normal;color:var(--amber)}
.brand .sub{font-size:11px;color:var(--dim);margin-top:1px}
.searchbar{
  margin-top:12px; display:flex; gap:10px; align-items:center;
  background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:0 12px;
}
.searchbar svg{width:15px;height:15px;flex:none;opacity:.7}
.searchbar input{
  flex:1; min-width:0; background:none; border:0; outline:none;
  color:var(--text); font-size:14px; padding:11px 0; font-family:inherit;
}
.searchbar input::placeholder{color:var(--dim)}
.count{margin-left:8px;font-size:12px;color:var(--dim);white-space:nowrap}
.count b{color:var(--amber);font-weight:700}
.chips{
  max-width:1100px; margin:12px auto 0; padding:0 16px;
  display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; background:var(--panel); color:var(--dim); border:1px solid var(--line);
  border-radius:999px; padding:6px 14px; font-size:12px; cursor:pointer;
  font-family:inherit; transition:all .15s;
}
.chip:hover{color:var(--text);border-color:rgba(255,194,75,.4)}
.chip.on{color:#14110a;background:linear-gradient(135deg,var(--amber),var(--amber2));border-color:transparent;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:4px 16px 60px}
.grid{
  display:grid; gap:10px;
  grid-template-columns:repeat(2,minmax(0,1fr));
}
.card{
  justify-self:center; width:108px; height:108px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--card); border:1px solid var(--line); border-radius:0;
  text-decoration:none; transition:transform .12s,background .12s,border-color .12s,box-shadow .12s;
}
.card:hover,.card:focus-visible{
  background:var(--card2); border-color:rgba(255,194,75,.55);
  box-shadow:0 0 0 1px rgba(255,194,75,.35),0 8px 22px -8px rgba(0,0,0,.7);
  transform:translateY(-2px); outline:none;
}
.card img{width:86px;height:86px;display:block;flex:none}
.card .name{
  margin-top:4px; max-width:100px; height:10px;
  font-size:9px; line-height:10px; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;
}
.card:hover .name{color:var(--amber2)}
.empty{
  grid-column:1/-1; display:none; flex-direction:column; align-items:center; gap:10px;
  padding:70px 0; color:var(--dim); font-size:14px;
}
.empty svg{width:44px;height:44px;opacity:.5}
footer{
  max-width:1100px; margin:0 auto; padding:0 16px 40px;
  color:#5c6470; font-size:11px; text-align:center;
}
@media (min-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
  .card{justify-self:auto}
}
</style>
</head>

let curCat = 'all';
function esc(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function enc(p){ return encodeURIComponent(p); }
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const total = GAMES.length;
document.getElementById('total').textContent = total;
function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = GAMES.filter(g =>
    (curCat === 'all' || g.c === curCat) &&
    (q === '' || g.n.toLowerCase().includes(q))
  );
  countEl.textContent = list.length + ' / ' + total;
  const frag = document.createDocumentFragment();
  for (const g of list){
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '../games-web/' + enc(g.h);
    a.title = g.n;
    const im = document.createElement('img');
    im.src = 'icons/' + enc(g.i);
    im.alt = g.n;
    im.width = 86; im.height = 86; im.loading = 'lazy';
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = g.n;
    a.appendChild(im); a.appendChild(nm);
    frag.appendChild(a);
  }
  grid.replaceChildren(frag);
  const empty = document.getElementById('empty');
  empty.style.display = list.length ? 'none' : 'flex';
}
function buildChips(){
  const bar = document.getElementById('chips');
  const mk = (key, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (key === curCat ? ' on' : '');
    b.textContent = label + (key === 'all' ? ' · ' + total : '');
    b.addEventListener('click', () => {
      curCat = key;
      [...bar.children].forEach(c => c.classList.toggle('on', c === b));
      render();
    });
    return b;
  };
  bar.appendChild(mk('all', '全部'));
  for (const c of CATS) bar.appendChild(mk(c.k, c.l));
}
document.getElementById('search').addEventListener('input', render);
buildChips();
