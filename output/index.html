<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Lobby</title>
<style>
  :root{
    --bg0:#0a0f17; --bg1:#0d1524; --bg2:#122036;
    --panel:#0e1826; --panel2:#13233a;
    --line:#1d3050; --line2:#2a4570;
    --text:#e8eef7; --dim:#7d93ad; --dim2:#5a7090;
    --accent:#00b0ff; --accent2:#3ce0c8;
    --radius:0px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(0,176,255,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(60,224,200,.08), transparent 55%),
      linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));
    background-attachment:fixed;
    color:var(--text);min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(10,15,23,.82);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
  }
  .bar{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.4px;color:var(--text)}
  .logo svg{width:30px;height:30px;flex:none}
  .logo em{font-style:normal;background:linear-gradient(110deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{
    font-size:12.5px;color:var(--accent2);background:rgba(60,224,200,.08);
    border:1px solid rgba(60,224,200,.28);padding:4px 12px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .search{margin-left:auto;flex:1 1 200px;max-width:420px;position:relative}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--dim);pointer-events:none}
  .search input{
    width:100%;padding:10px 14px 10px 40px;border-radius:999px;
    border:1px solid var(--line2);background:var(--panel2);
    color:var(--text);font-size:14.5px;outline:none;transition:border-color .18s,box-shadow .18s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,176,255,.16)}
  .search input::placeholder{color:var(--dim)}
  .bar .clear{display:none}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .chip{
    font-size:12px;color:var(--dim);border:1px solid var(--line);padding:4px 10px;cursor:pointer;user-select:none;
    transition:all .15s;
  }
  .chip.on{color:var(--accent);border-color:var(--accent);background:rgba(0,176,255,.08)}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
    gap:12px;
  }
  .card{
    text-decoration:none;color:var(--text);
    background:linear-gradient(180deg,var(--panel),var(--bg1));
    border:1px solid var(--line);
    border-radius:var(--radius);
    width:108px;height:108px;
    justify-self:center;
    margin:0 auto;
    position:relative;overflow:hidden;
    transition:border-color .15s,transform .15s,box-shadow .15s;
    display:flex;flex-direction:column;align-items:center;
    padding:11px 6px 0;
  }
  .card:hover,.card:focus-visible{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,176,255,.16);
    outline:none;
  }
  .card .ico{width:86px;height:86px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
  .card .ico svg{width:100%;height:100%;display:block}
  .card .nm{
    width:100%;font-size:10px;line-height:11px;text-align:center;color:var(--dim);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .card:hover .nm{color:var(--accent2)}
  .empty{display:none;grid-column:1/-1;text-align:center;color:var(--dim);padding:48px 0;font-size:14px}
  .foot{max-width:1180px;margin:0 auto;padding:0 16px 26px;text-align:center;color:var(--dim2);font-size:11.5px;letter-spacing:.5px}
  @media (max-width:479px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  }
</style>
</head>
