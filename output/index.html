    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }
        
        h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, #5FD0F5, #FFD8E0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .search-container {
            margin-bottom: 25px;
            position: relative;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        #searchInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #333;
            border-radius: 50px;
            background: #111;
            color: #fff;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        #searchInput:focus {
            border-color: #5FD0F5;
            box-shadow: 0 0 0 3px rgba(95, 208, 245, 0.2);
        }
        
        #searchInput::placeholder {
            color: #666;
        }
        
        .stats {
            text-align: center;
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        
        .stats span {
            color: #5FD0F5;
            font-weight: 600;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #222;
        }
        
        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            border-color: #333;
        }
        
        .game-card:focus-visible {
            outline: 2px solid #5FD0F5;
            outline-offset: 2px;
        }
        
        .game-icon {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .game-icon svg {
            width: 100%;
            height: 100%;
            max-width: 120px;
            max-height: 120px;
        }
        
        .game-info {
            padding: 14px 12px;
            text-align: center;
        }
        
        .game-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .hidden {
            display: none !important;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }
            
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }
            
            .game-info {
                padding: 12px 10px;
            }
            
            .game-title {
                font-size: 0.8rem;
            }
        }
        
        @media (min-width: 1200px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }
    </style>
</head>

        // Generate sailfishos-style icon SVG
        function generateIcon(index, title) {
            const isOdd = index % 2 === 0; // 0-based, so even index = 1st, 3rd, 5th...
            const firstLetter = title.trim().charAt(0).toUpperCase();
            const textColor = (firstLetter === 'I') ? '#E85D9E' : '#FFFFFF';
            
            if (isOdd) {
                // Odd: rounded rect, gradient #5FD0F5 -> #3AA8D0, no rotation
                const gradientId = `grad-odd-${index}`;
                const highlightId = `highlight-odd-${index}`;
                return `
                    <svg viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="${gradientId}" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#5FD0F5"/>
                                <stop offset="100%" stop-color="#3AA8D0"/>
                            </linearGradient>
                            <radialGradient id="${highlightId}" cx="25%" cy="25%" r="60%">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
                                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                            </radialGradient>
                        </defs>
                        <g transform="translate(0,-4)">
                            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" 
                                  fill="url(#${gradientId})"/>
                            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" 
                                  fill="url(#${highlightId})"/>
                        </g>
                        <text x="43" y="50" text-anchor="middle" dominant-baseline="central" 
                              fill="${textColor}" font-family="system-ui, sans-serif" font-weight="bold" font-size="29">${firstLetter}</text>
                    </svg>
                `;
            } else {
                // Even: same shape, gradient #FFD8E0 -> #FFB0C4, rotated 90deg, text upright
                const gradientId = `grad-even-${index}`;
                const highlightId = `highlight-even-${index}`;
                return `
                    <svg viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="${gradientId}" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFD8E0"/>
                                <stop offset="100%" stop-color="#FFB0C4"/>
                            </linearGradient>
                            <radialGradient id="${highlightId}" cx="25%" cy="25%" r="60%">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
                                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                            </radialGradient>
                        </defs>
                        <g transform="rotate(90 43 47) translate(0,-4)">
                            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" 
                                  fill="url(#${gradientId})"/>
                            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" 
                                  fill="url(#${highlightId})"/>
                        </g>
                        <text x="43" y="50" text-anchor="middle" dominant-baseline="central" 
                              fill="${textColor}" font-family="system-ui, sans-serif" font-weight="bold" font-size="29">${firstLetter}</text>
                    </svg>
                `;
            }
        }

        // Render games
        function renderGames(filter = '') {
            const grid = document.getElementById('gamesGrid');
            const countEl = document.getElementById('gameCount');
            
            const filtered = games.filter(g => 
                g.title.toLowerCase().includes(filter.toLowerCase())
            );
            
            countEl.textContent = filtered.length;
            
            grid.innerHTML = filtered.map((game, idx) => `
                <a href="${game.url}" class="game-card" target="_blank" rel="noopener noreferrer">
                    <div class="game-icon">
                        ${generateIcon(idx, game.title)}
                    </div>
                    <div class="game-info">
                        <div class="game-title">${escapeHtml(game.title)}</div>
                    </div>
                </a>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;
        
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderGames(e.target.value);
            }, 100);
        });

        // Initial render
        renderGames();
    </script>
