<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>游戏大厅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a1628;
            --bg-secondary: #0e1f3a;
            --bg-card: #132946;
            --bg-card-hover: #1a3556;
            --text-primary: #e8edf2;
            --text-secondary: #9ab0c8;
            --text-muted: #6b8ba4;
            --accent-cyan: #19a7ce;
            --accent-teal: #0e7c8c;
            --accept-sky: #4fc3f7;
            --accent-sea: #2ebd85;
            --accent-deep: #15966b;
            --accent-coral: #f0544f;
            --accent-orange: #f59b23;
            --accent-yellow: #ffd34e;
            --gradient-ocean: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%);
            --gradient-card: linear-gradient(145deg, #132946 0%, #0e1f3a 100%);
            --shadow-soft: 0 4px 24px rgba(20, 40, 60, 0.25);
            --shadow-hover: 0 8px 40px rgba(20, 40, 60, 0.35);
            --shadow-glow: 0 0 32px rgba(25, 167, 206, 0.15);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f0f5f9;
                --bg-secondary: #e4ebf2;
                --bg-card: #ffffff;
                --bg-card-hover: #f8fafc;
                --text-primary: #1a2a3a;
                --text-secondary: #4a5e72;
                --text-muted: #7a8d9e;
                --shadow-soft: 0 4px 24px rgba(20, 40, 60, 0.1);
                --shadow-hover: 0 8px 40px rgba(20, 40, 60, 0.15);
                --shadow-glow: 0 0 32px rgba(25, 167, 206, 0.1);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Background atmosphere */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(25, 167, 206, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(46, 189, 133, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 30% at 0% 0%, rgba(197, 108, 214, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 24px 20px;
            text-align: center;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            border-radius: 2px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--gradient-ocean);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-soft), var(--shadow-glow);
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(0,0,0,0.15) 0%, transparent 50%);
        }

        .logo-icon svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 26px;
            height: 26px;
            fill: none;
            stroke: white;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .logo-text {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-sky) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: clamp(0.875rem, 2vw, 1rem);
            font-weight: 400;
        }

        /* Search */
        .search-section {
            padding: 0 20px 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .search-wrapper {
            position: relative;
            max-width: 640px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            font-size: 1rem;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            transition: var(--transition);
            box-shadow: var(--shadow-soft);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: var(--shadow-soft), 0 0 0 4px rgba(25, 167, 206, 0.15), var(--shadow-glow);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            stroke: var(--text-muted);
            stroke-width: 2;
            fill: none;
            transition: var(--transition);
            pointer-events: none;
        }

        .search-input:focus + .search-icon {
            stroke: var(--accent-cyan);
        }

        .search-clear {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .search-clear:hover {
            background: var(--bg-secondary);
        }

        .search-clear svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            stroke-width: 2.5;
            fill: none;
        }

        .search-input:not(:placeholder-shown) + .search-icon + .search-clear {
            opacity: 1;
            visibility: visible;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 16px 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-weight: 600;
            color: var(--accent-sky);
            font-size: 1.125rem;
        }

        /* Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 0 20px 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 480px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            }
        }

        @media (min-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 24px;
            }
        }

        @media (min-width: 1440px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        /* Game Card */
        .game-card {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(25,167,206,0.08) 0%, transparent 50%);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: var(--shadow-hover), var(--shadow-glow);
            border-color: rgba(25,167,206,0.2);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card:focus-visible {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: var(--shadow-hover), 0 0 0 3px rgba(25, 167, 206, 0.3);
        }

        .game-icon-wrapper {
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .game-icon {
            width: 100%;
            height: 100%;
            display: block;
            transition: var(--transition);
        }

        .game-card:hover .game-icon {
            transform: scale(1.08) rotate(2deg);
        }

        .game-info {
            padding: 14px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 60px;
        }

        .game-title {
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: var(--transition);
        }

        .game-card:hover .game-title {
            color: var(--accent-sky);
        }

        /* Icon Generation - SailfishOS Style */
        .icon-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            stroke: var(--text-muted);
            stroke-width: 1.5;
            fill: none;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Footer */
        .footer {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: auto;
        }

        .footer a {
            color: var(--accent-sky);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--accent-cyan);
            text-decoration: underline;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-teal), var(--accent-cyan));
            border-radius: 4px;
            border: 2px solid var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-sky));
        }
    </style>
</head>

                    </linearGradient>
                    <clipPath id="clip${size}">
                        <path d="M0,${size*0.2} L${size*0.2},0 L${size},0 L${size},${size} L0,${size} Z"/>
                    </clipPath>
                </defs>
                <rect width="${size}" height="${size}" fill="url(#bg${size})" clip-path="url(#clip${size})" rx="${size*0.18}"/>
                <path d="M${size*0.3},${size*0.5} L${size*0.5},${size*0.3} L${size*0.7},${size*0.5} L${size*0.5},${size*0.7} Z" 
                      fill="${colors.accent}" opacity="0.9"/>
                <circle cx="${size*0.5}" cy="${size*0.5}" r="${size*0.07}" fill="${colors.accent2}"/>
            `,
            // Shape 5: Rounded rect with double notch
            (size, colors) => `
                <defs>
                    <linearGradient id="bg${size}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:${colors.bg[0]}"/>
                        <stop offset="100%" style="stop-color:${colors.bg[1]}"/>
                    </linearGradient>
                    <clipPath id="clip${size}">
                        <path d="M${size*0.1},0 L${size*0.9},0 L${size},${size*0.1} L${size},${size*0.9} L${size*0.9},${size} L${size*0.1},${size} L0,${size*0.9} L0,${size*0.1} Z"/>
                    </clipPath>
                </defs>
                <rect width="${size}" height="${size}" fill="url(#bg${size})" clip-path="url(#clip${size})"/>
                <rect x="${size*0.22}" y="${size*0.22}" width="${size*0.56}" height="${size*0.56}" rx="${size*0.08}" fill="${colors.accent}" opacity="0.9"/>
                <circle cx="${size*0.5}" cy="${size*0.5}" r="${size*0.1}" fill="${colors.bg[0]}"/>
                <circle cx="${size*0.5}" cy="${size*0.5}" r="${size*0.05}" fill="${colors.accent2}"/>
            `,
            // Shape 6: Circle with 3 dots
            (size, colors) => `
                <defs>
                    <linearGradient id="bg${size}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:${colors.bg[0]}"/>
                        <stop offset="100%" style="stop-color:${colors.bg[1]}"/>
                    </linearGradient>
                    <radialGradient id="glow${size}" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" style="stop-color:${colors.bg[1]}"/>
                        <stop offset="100%" style="stop-color:${colors.bg[0]}"/>
                    </radialGradient>
                </defs>
                <circle cx="${size*0.5}" cy="${size*0.5}" r="${size*0.45}" fill="url(#bg${size})"/>
                <circle cx="${size*0.5}" cy="${size*0.35}" r="${size*0.18}" fill="${colors.accent}" opacity="0.15"/>
                <circle cx="${size*0.42}" cy="${size*0.35}" r="${size*0.035}" fill="${colors.accent2}"/>
                <circle cx="${size*0.5}" cy="${size*0.35}" r="${size*0.035}" fill="${colors.accent2}"/>
                <circle cx="${size*0.58}" cy="${size*0.35}" r="${size*0.035}" fill="${colors.accent2}"/>
                <circle cx="${size*0.68}" cy="${size*0.68}" r="${size*0.05}" fill="${colors.accent2}" opacity="0.7"/>
            `,
            // Shape 7: Shield with cut
            (size, colors) => `
                <defs>
                    <linearGradient id="bg${size}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:${colors.bg[0]}"/>
                        <stop offset="100%" style="stop-color:${colors.bg[1]}"/>
                    </linearGradient>
                    <clipPath id="clip${size}">
                        <path d="M${size*0.5},0 L${size},0 L${size},${size*0.7} L${size*0.5},${size} L0,${size*0.7} L0,0 Z"/>
                    </clipPath>
                </defs>
                <rect width="${size}" height="${size}" fill="url(#bg${size})" clip-path="url(#clip${size})"/>
                <path d="M${size*0.5},${size*0.15} L${size*0.5},${size*0.6} M${size*0.3},${size*0.38} L${size*0.7},${size*0.38}" 
                      stroke="${colors.accent}" stroke-width="${size*0.05}" stroke-linecap="round" fill="none" opacity="0.9"/>
                <circle cx="${size*0.5}" cy="${size*0.75}" r="${size*0.06}" fill="${colors.accent2}"/>
            `,
            // Shape 8: Diamond with notch
            (size, colors) => `
                <defs>
                    <linearGradient id="bg${size}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:${colors.bg[0]}"/>
                        <stop offset="100%" style="stop-color:${colors.bg[1]}"/>
                    </linearGradient>
                    <clipPath id="clip${size}">
                        <path d="M${size*0.5},0 L${size},${size*0.5} L${size*0.5},${size} L0,${size*0.5} Z"/>
                    </clipPath>
                </defs>
                <rect width="${size}" height="${size}" fill="url(#bg${size})" clip-path="url(#clip${size})"/>
                <path d="M${size*0.5},${size*0.2} L${size*0.5},${size*0.55} M${size*0.3},${size*0.38} L${size*0.7},${size*0.38} M${size*0.5},${size*0.55} L${size*0.5},${size*0.8}" 
                      stroke="${colors.accent}" stroke-width="${size*0.055}" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
                <circle cx="${size*0.72}" cy="${size*0.28}" r="${size*0.055}" fill="${colors.accent2}"/>
            `,
        ];

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }

        function generateIconSvg(title, size = 128) {
            const hash = hashString(title);
            const palette = PALETTES[hash % PALETTES.length];
            const shapeFn = SHAPES[hash % SHAPES.length];
            const innerSize = size * 0.92;
            const offset = size * 0.04;
            
            const shapeSvg = shapeFn(innerSize, palette);
            
            return `<svg class="icon-canvas" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title} 游戏图标">
                <defs>
                    <filter id="shadow${hash}" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="${size*0.03}" stdDeviation="${size*0.04}" flood-color="rgba(20,40,60,0.2)" flood-opacity="1"/>
                    </filter>
                    <filter id="innerGlow${hash}" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="${size*0.015}" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <g filter="url(#shadow${hash})">
                    <g transform="translate(${offset}, ${offset})">
                        ${shapeSvg}
                    </g>
                </g>
                <!-- Subtle highlight -->
                <ellipse cx="${size*0.35}" cy="${size*0.3}" rx="${size*0.25}" ry="${size*0.12}" fill="white" opacity="0.06" filter="url(#innerGlow${hash})"/>
            </svg>`;
        }

        function renderGames(filter = '') {
            const grid = document.getElementById('gamesGrid');
            const filtered = GAMES.filter(g => g.title.toLowerCase().includes(filter.toLowerCase()));
            
            document.getElementById('filteredCount').textContent = filtered.length;
            document.getElementById('footerCount').textContent = filtered.length;
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" role="status">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                            <path d="M14 7l-5 5 5 5M9 7l5 5-5 5"/>
                        </svg>
                        <p>未找到匹配的游戏</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(game => `
                <a href="${game.url}" class="game-card" role="listitem" aria-label="${game.title}">
                    <div class="game-icon-wrapper">
                        ${generateIconSvg(game.title)}
                    </div>
                    <div class="game-info">
                        <h3 class="game-title">${escapeHtml(game.title)}</h3>
                    </div>
                </a>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderGames(e.target.value);
            }, 80);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.focus();
            renderGames('');
        });

        // Keyboard shortcut: / to focus search
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape') {
                searchInput.blur();
            }
        });

        // Initial render
        renderGames();
    </script>
</body>
</html>
