    <title>离线 HTML 游戏合集 - 小于 10MB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eaeaea;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #48dbfb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 1.1rem;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 25px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #48dbfb;
        }
        .stat-label {
            font-size: 0.9rem;
            color: #a0a0b0;
            margin-top: 4px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #eaeaea;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            border-color: #48dbfb;
            box-shadow: 0 0 20px rgba(72, 219, 251, 0.2);
        }
        .search-box input::placeholder {
            color: #666;
        }
        .search-box svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            stroke: #666;
            pointer-events: none;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: rgba(72, 219, 251, 0.4);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(72, 219, 251, 0.1);
        }
        .game-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .game-size {
            font-size: 0.85rem;
            color: #feca57;
            margin-bottom: 16px;
        }
        .game-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
            color: #0f0f23;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            margin-top: auto;
        }
        .game-link:hover {
            background: linear-gradient(135deg, #feca57 0%, #ff6b6b 100%);
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(254, 202, 87, 0.4);
        }
        .game-link svg {
            width: 18px;
            height: 18px;
        }
        .hidden {
            display: none !important;
        }
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .no-results svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .game-grid { grid-template-columns: 1fr; }
            .stat-item { padding: 12px 18px; }
            .stat-number { font-size: 1.5rem; }
        }
    </style>

        const grid = document.getElementById('game-grid');
        const searchInput = document.getElementById('search-input');
        const visibleCount = document.getElementById('visible-count');
        const noResults = document.getElementById('no-results');

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function formatName(filename) {
            return filename.replace('.html', '')
                .replace(/([A-Z])/g, ' $1')
                .replace(/_/g, ' ')
                .replace(/([0-9])([A-Za-z])/g, '$1 $2')
                .replace(/([A-Za-z])([0-9])/g, '$1 $2')
                .trim()
                .split(' ')
                .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                .join(' ');
        }

        function renderGames(filteredGames) {
            grid.innerHTML = '';
            if (filteredGames.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
                visibleCount.textContent = '0';
                return;
            }
            grid.classList.remove('hidden');
            noResults.classList.add('hidden');
            visibleCount.textContent = filteredGames.length;
            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-name">${formatName(game.name)}</div>
                    <div class="game-size">${formatSize(game.size)}</div>
                    <a href="${game.url}" target="_blank" rel="noopener noreferrer" class="game-link">
                        在 GitHub 上打开
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
                        </svg>
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderGames(games);
                return;
            }
            const filtered = games.filter(game => 
                game.name.toLowerCase().includes(query) || 
                formatName(game.name).toLowerCase().includes(query)
            );
            renderGames(filtered);
        });

        // 初始渲染
        renderGames(games);
    </script>
