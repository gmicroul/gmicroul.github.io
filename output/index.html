<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Harbor · HTML5 游戏大厅</title>
<style>
:root{
  --bg-deep:#071b26;
  --bg-mid:#0a2a3a;
  --panel:rgba(255,255,255,.06);
  --panel-border:rgba(255,255,255,.10);
  --ink:#f5f7f7;
  --ink-dim:#9db8c4;
  --accent:#19a7ce;
  --accent-2:#4fc3f7;
  --shadow:0 10px 30px rgba(20,40,60,.25);
  --radius-squircle:28%;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:"Segoe UI",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(25,167,206,.22), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(46,189,133,.14), transparent 60%),
    linear-gradient(160deg, var(--bg-mid), var(--bg-deep) 55%);
  background-attachment:fixed;
}
/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(7,27,38,.72);
  border-bottom:1px solid var(--panel-border);
}
.bar{
  max-width:1280px;margin:0 auto;
  padding:14px 20px;
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.brand-mark{
  width:44px;height:44px;border-radius:var(--radius-squircle);
  background:linear-gradient(135deg,#0e7c8c,#4fc3f7);
  position:relative;overflow:hidden;flex:0 0 auto;
  box-shadow:0 6px 16px rgba(20,40,60,.35);
}
.brand-mark::before{ /* negative-shape wave cut */
  content:"";position:absolute;left:14%;right:14%;top:52%;height:22%;
  background:#f5f7f7;border-radius:999px;
  transform:rotate(-18deg);
}
.brand-mark::after{ /* highlight, light from top-left */
  content:"";position:absolute;top:8%;left:10%;width:38%;height:22%;
  background:rgba(255,255,255,.28);border-radius:999px;
  transform:rotate(-24deg);filter:blur(1px);
}
.brand h1{font-size:1.15rem;font-weight:700;letter-spacing:.04em}
.brand small{display:block;font-size:.72rem;color:var(--ink-dim);font-weight:400;letter-spacing:.14em;text-transform:uppercase}
/* ---------- search ---------- */
.search-wrap{
  flex:1 1 260px;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:999px;padding:10px 18px;
  transition:border-color .2s, box-shadow .2s;
}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,167,206,.22)}
.search-wrap svg{flex:0 0 auto;opacity:.7}
#search{
  flex:1;background:transparent;border:0;outline:0;
  color:var(--ink);font-size:.95rem;
}
#search::placeholder{color:var(--ink-dim)}
.count-pill{
  flex:0 0 auto;font-size:.8rem;color:var(--ink-dim);
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:999px;padding:8px 16px;white-space:nowrap;
}
.count-pill b{color:var(--accent-2);font-variant-numeric:tabular-nums}
/* ---------- grid ---------- */
main{max-width:1280px;margin:0 auto;padding:26px 20px 60px}
.grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
}
@media(min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:22px}}
/* ---------- card ---------- */
.card{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:20px 10px 16px;
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:22px;cursor:pointer;text-decoration:none;color:inherit;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  border-color:rgba(79,195,247,.45);
  box-shadow:var(--shadow);
  outline:none;
}
.card:active{transform:translateY(-1px) scale(.98)}
/* ---------- SailfishOS-style icon ---------- */
.icon{
  width:72px;height:72px;position:relative;flex:0 0 auto;
  box-shadow:0 8px 20px rgba(20,40,60,.30); /* unified soft shadow, whole set */
  overflow:hidden;
}
@media(min-width:720px){.icon{width:84px;height:84px}}
.icon.shape-0{border-radius:var(--radius-squircle)}                      /* squircle */
.icon.shape-1{border-radius:50%}                                          /* circle  */
.icon.shape-2{border-radius:52% 8% 52% 8% / 52% 8% 52% 8%}                /* organic leaf, rotated per-card */
.icon .glyph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;
  font-size:2.1rem;line-height:1;
  text-shadow:0 2px 6px rgba(20,40,60,.25);
  transform:translateY(-1px); /* optical centering */
  user-select:none;
}
.icon.shape-2 .glyph{transform:rotate(var(--unrot)) translateY(-1px)}     /* keep glyph upright on rotated leaf */
.icon .gloss{ /* single small translucent highlight, light from top-left */
  position:absolute;top:7%;left:9%;width:40%;height:20%;
  background:rgba(255,255,255,.26);border-radius:999px;
  transform:rotate(-24deg);pointer-events:none;
}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.card .name{
  font-size:.82rem;color:var(--ink);text-align:center;line-height:1.35;
  max-width:100%;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word;
}
/* ---------- empty state ---------- */
.empty{
  display:none;text-align:center;padding:70px 20px;color:var(--ink-dim);
}
.empty .big{font-size:2.4rem;margin-bottom:10px}
.empty.show{display:block}
footer{
  text-align:center;color:var(--ink-dim);font-size:.75rem;
  padding:24px 20px 40px;letter-spacing:.06em;
}
</style>
</head>

<header>
  <div class="bar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <h1>Game Harbor<small>HTML5 游戏大厅</small></h1>
    </div>
    <label class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">

      <input id="search" type="search" placeholder="搜索游戏…" autocomplete="off" aria-label="搜索游戏">

<main>

</main>

var grid = document.getElementById('grid');
var emptyEl = document.getElementById('empty');
var searchEl = document.getElementById('search');
var totalEl = document.getElementById('total');
var shownEl = document.getElementById('shown');

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function iconHtml(g){
  var inner;
  if (g.i) {
    inner = '<img src="' + esc(g.i) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">';
  } else {
    inner = '<span class="glyph" aria-hidden="true">' + esc(g.l) + '</span><span class="gloss"></span>';
  }
  var rot = (g.s === 2) ? 'transform:rotate(' + g.r + 'deg);' : '';
  var unrot = (g.s === 2) ? ('--unrot:' + (-g.r) + 'deg;') : '';
  return '<div class="icon shape-' + g.s + '" style="background:linear-gradient(135deg,' + g.c[0] + ',' + g.c[1] + ');' + rot + unrot + '">' + inner + '</div>';
}

function cardHtml(g){
  return '<a class="card" href="' + esc(g.u) + '" title="' + esc(g.t) + '">'
       + iconHtml(g)
       + '<span class="name">' + esc(g.t) + '</span>'
       + '</a>';
}

function render(list){
  grid.innerHTML = list.map(cardHtml).join('');
  shownEl.textContent = list.length;
  emptyEl.classList.toggle('show', list.length === 0);
}

function norm(s){ return String(s).toLowerCase(); }

var timer = null;
searchEl.addEventListener('input', function(){
  clearTimeout(timer);
  timer = setTimeout(function(){
    var q = norm(searchEl.value.trim());
    if (!q) { render(GAMES); return; }
    render(GAMES.filter(function(g){ return norm(g.t).indexOf(q) !== -1; }));
  }, 60);
});

totalEl.textContent = GAMES.length;
render(GAMES);
</script>
