<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub - HTML5 游戏大厅</title>
<style>
/* ============================================================
   SAILFISH OS ICON DESIGN SYSTEM
   ============================================================ */
/* Color Palette - Ocean Theme (60%+) */
:root {
  --deep-teal: #0E7C8C;
  --teal: #19A7CE;
  --sky-blue: #4FC3F7;
  --sea-green: #2EBD85;
  --deep-green: #15966B;
  --coral-red: #F0544F;
  --orange: #F59B23;
  --bright-yellow: #FFD34E;
  --purple-pink-start: #C56CD6;
  --purple-pink-end: #E85D9E;
  --fg-white: #FFFFFF;
  --fg-offwhite: #F5F7F7;
  --accent-magenta: #B03A6B;
  --shadow-color: rgba(20, 40, 60, 0.2);
  --shadow-strong: rgba(20, 40, 60, 0.35);
  --card-bg: rgba(255, 255, 255, 0.92);
  --card-border: rgba(14, 124, 140, 0.12);
  --bg-gradient-start: #0a1a2a;
  --bg-gradient-mid: #112d3d;
  --bg-gradient-end: #0d1f2f;
  --text-primary: #1a2a3a;
  --text-secondary: #4a5a6a;
  --search-bg: rgba(255, 255, 255, 0.15);
  --search-border: rgba(25, 167, 206, 0.3);
  --search-focus-border: #19A7CE;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
  min-height: 100vh;
  color: var(--text-primary);
  line-height: 1.6;
  padding: 24px 16px 40px;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  max-width: 1400px;
  margin: 0 auto 28px;
  text-align: center;
  padding: 8px 0 16px;
}
.header h1 {
  font-size: clamp(1.8rem, 4.5vw, 2.8rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--fg-white) 0%, var(--sky-blue) 50%, var(--sea-green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.header .subtitle {
  color: rgba(255,255,255,0.65);
  font-size: clamp(0.85rem, 2vw, 1rem);
  font-weight: 400;
}

/* ============================================================
   SEARCH BAR
   ============================================================ */
.search-wrapper {
  max-width: 640px;
  margin: 0 auto 24px;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 14px 20px 14px 52px;
  font-size: 1rem;
  border: 2px solid var(--search-border);
  border-radius: 100px;
  background: var(--search-bg);
  color: var(--fg-white);
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  backdrop-filter: blur(10px);
}
.search-input::placeholder { color: rgba(255,255,255,0.5); }
.search-input:focus {
  border-color: var(--search-focus-border);
  background: rgba(255,255,255,0.22);
  box-shadow: 0 0 0 4px rgba(25, 167, 206, 0.18), 0 8px 32px rgba(20,40,60,0.25);
}
.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  stroke: rgba(255,255,255,0.6);
  stroke-width: 2;
  pointer-events: none;
  transition: stroke 0.25s ease;
}
.search-input:focus + .search-icon { stroke: var(--sky-blue); }
.search-clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s ease;
}
.search-clear:hover { background: rgba(255,255,255,0.15); color: var(--fg-white); }
.search-clear.visible { opacity: 1; visibility: visible; }
.search-clear svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; }

/* ============================================================
   STATS BAR
   ============================================================ */
.stats-bar {
  max-width: 1400px;
  margin: 0 auto 20px;
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  font-size: 0.875rem;
  color: rgba(255,255,255,0.7);
}
.stat-item { display: flex; align-items: center; gap: 6px; }
.stat-item strong { color: var(--fg-white); font-weight: 600; font-size: 1.1rem; }

/* ============================================================
   GAME GRID
   ============================================================ */
.game-grid {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 20px;
  padding: 0 4px;
}

/* ============================================================
   GAME CARD - SAILFISH OS ICON STYLE
   ============================================================ */
.game-card {
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  border-radius: 20px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 18px 12px 14px;
  backdrop-filter: blur(20px);
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.25s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.game-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 50%, transparent 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.game-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 20px 48px rgba(20,40,60,0.28), 0 8px 24px rgba(14,124,140,0.15);
  border-color: rgba(25, 167, 206, 0.3);
}
.game-card:hover::before { opacity: 1; }
.game-card:active { transform: translateY(-2px) scale(0.99); transition-duration: 0.1s; }
.game-card:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--sky-blue), 0 20px 48px rgba(20,40,60,0.28);
}

/* ============================================================
   ICON CONTAINER - 512x512 BASE, RESPONSIVE
   ============================================================ */
.icon-wrapper {
  width: 88px;
  height: 88px;
  position: relative;
  flex-shrink: 0;
  border-radius: 26px; /* ~30% squircle approximation */
  overflow: hidden;
  /* Long shadow (flat style) - unified across all icons */
  box-shadow:
    8px 8px 0 rgba(20,40,60,0.08),
    16px 16px 0 rgba(20,40,60,0.05),
    24px 24px 0 rgba(20,40,60,0.03),
    inset 0 -2px 8px rgba(0,0,0,0.06),
    inset 0 1px 1px rgba(255,255,255,0.3);
}

/* Soft glow on hover */
.game-card:hover .icon-wrapper {
  box-shadow:
    0 0 0 2px rgba(25,167,206,0.25),
    8px 8px 0 rgba(20,40,60,0.1),
    16px 16px 0 rgba(20,40,60,0.06),
    24px 24px 0 rgba(20,40,60,0.04),
    inset 0 -2px 8px rgba(0,0,0,0.06),
    inset 0 1px 1px rgba(255,255,255,0.3);
}

/* ============================================================
   ICON BASE SHAPES (SVG generated via CSS)
   Three Mother Shapes: Circle/Concentric, Squircle, Organic Flow
   ============================================================ */

/* Color Palettes for Icons - Ocean dominant (60%+), Warm accents sparingly */
.icon-palette-1 { --ic-main: var(--deep-teal); --ic-main-light: var(--teal); --ic-accent: var(--sky-blue); --ic-fg: var(--fg-white); }
.icon-palette-2 { --ic-main: var(--teal); --ic-main-light: var(--sky-blue); --ic-accent: var(--sea-green); --ic-fg: var(--fg-white); }
.icon-palette-3 { --ic-main: var(--sea-green); --ic-main-light: var(--deep-green); --ic-accent: var(--teal); --ic-fg: var(--fg-white); }
.icon-palette-4 { --ic-main: var(--deep-green); --ic-main-light: var(--sea-green); --ic-accent: var(--teal); --ic-fg: var(--fg-white); }
.icon-palette-5 { --ic-main: var(--sky-blue); --ic-main-light: #6fd5fa; --ic-accent: var(--teal); --ic-fg: var(--fg-white); }
.icon-palette-6 { --ic-main: var(--coral-red); --ic-main-light: #f77a76; --ic-accent: var(--orange); --ic-fg: var(--fg-white); }
.icon-palette-7 { --ic-main: var(--orange); --ic-main-light: #f8b84d; --ic-accent: var(--bright-yellow); --ic-fg: var(--fg-white); }
.icon-palette-8 { --ic-main: #C56CD6; --ic-main-light: #d694e8; --ic-accent: #E85D9E; --ic-fg: var(--fg-white); }

/* Base icon SVG container */
.icon-svg {
  width: 100%;
  height: 100%;
  display: block;
  /* Gradient background: 120-150deg, light source top-left */
  background: linear-gradient(135deg, var(--ic-main-light) 0%, var(--ic-main) 65%, color-mix(in srgb, var(--ic-main) 85%, black) 100%);
}

/* ============================================================
   ICON VARIANTS - Three Mother Shapes
   1. Circle / Concentric (focus, time, lens, play, celestial)
   2. Squircle (rounded rect with continuous curvature)
   3. Organic Flow (teardrop, leaf, comma, arch - asymmetric)
   ============================================================ */

/* --- Shape A: Circle / Concentric --- */
.icon-circle .icon-bg { fill: none; }
.icon-circle .icon-ring {
  fill: none;
  stroke: var(--ic-fg);
  stroke-width: 6%;
  stroke-linecap: round;
  opacity: 0.9;
}
.icon-circle .icon-core {
  fill: var(--ic-fg);
  opacity: 0.95;
}
.icon-circle .icon-accent {
  fill: var(--ic-accent);
}

/* --- Shape B: Squircle (continuous curvature via path) --- */
.icon-squircle .icon-bg { fill: var(--ic-fg); opacity: 0.15; }
.icon-squircle .icon-symbol {
  fill: var(--ic-fg);
  opacity: 0.95;
}
.icon-squircle .icon-accent { fill: var(--ic-accent); }

/* --- Shape C: Organic Flow (teardrop/leaf/comma) --- */
.icon-organic .icon-bg { fill: var(--ic-fg); opacity: 0.12; }
.icon-organic .icon-symbol { fill: var(--ic-fg); opacity: 0.95; }
.icon-organic .icon-accent { fill: var(--ic-accent); }

/* ============================================================
   SPECIFIC ICON DESIGNS (2-4 colors each, negative space symbols)
   ============================================================ */

/* Utility: centered symbol with stroke-based negative space */
.icon-symbol { transform-origin: center; }

/* --- Category: Puzzle / Logic (Circle/Concentric) --- */
.icon-type-puzzle .icon-ring { stroke-width: 7%; }
.icon-type-puzzle .icon-core { r: 22%; }

/* --- Category: Action / Arcade (Squircle) --- */
.icon-type-action .icon-symbol { transform: scale(0.58); }

/* --- Category: Racing / Sports (Organic) --- */
.icon-type-racing .icon-symbol { transform: scale(0.55) rotate(-12deg); }

/* --- Category: Adventure / Platformer (Squircle) --- */
.icon-type-adventure .icon-symbol { transform: scale(0.52); }

/* --- Category: Strategy / Simulation (Circle) --- */
.icon-type-strategy .icon-ring { stroke-width: 6.5%; }
.icon-type-strategy .icon-core { r: 20%; }

/* --- Category: Shooter (Squircle) --- */
.icon-type-shooter .icon-symbol { transform: scale(0.54); }

/* --- Category: Casual / Clicker (Organic) --- */
.icon-type-casual .icon-symbol { transform: scale(0.58); }

/* --- Category: RPG / Idle (Circle) --- */
.icon-type-rpg .icon-ring { stroke-width: 6%; }
.icon-type-rpg .icon-core { r: 24%; }

/* --- Category: Horror / Survival (Squircle - dark) --- */
.icon-type-horror .icon-bg { fill: var(--ic-fg); opacity: 0.08; }
.icon-type-horror .icon-symbol { fill: var(--ic-main); transform: scale(0.52); }

/* --- Category: Multiplayer / IO (Organic) --- */
.icon-type-multi .icon-symbol { transform: scale(0.56); }

/* --- Category: Classic / Retro (Circle) --- */
.icon-type-classic .icon-ring { stroke-width: 8%; }
.icon-type-classic .icon-core { r: 18%; }

/* ============================================================
   GAME TITLE
   ============================================================ */
.game-title {
  font-size: 0.78rem;
  font-weight: 550;
  color: var(--text-primary);
  text-align: center;
  line-height: 1.25;
  max-width: 100%;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: 0.01em;
}

/* ============================================================
   NO RESULTS STATE
   ============================================================ */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: rgba(255,255,255,0.6);
}
.no-results svg { width: 64px; height: 64px; margin-bottom: 16px; stroke: rgba(255,255,255,0.3); stroke-width: 1.5; }
.no-results p { font-size: 1.1rem; font-weight: 500; }
.no-results span { font-size: 0.9rem; opacity: 0.7; }

/* ============================================================
   LOADING STATE
   ============================================================ */
.loading { grid-column: 1 / -1; text-align: center; padding: 40px; color: rgba(255,255,255,0.5); }
.loading-spinner {
  width: 40px; height: 40px; margin: 0 auto 16px;
  border: 3px solid rgba(25,167,206,0.2);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   RESPONSIVE BREAKPOINTS
   ============================================================ */
@media (max-width: 1200px) {
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 18px; }
  .icon-wrapper { width: 80px; height: 80px; border-radius: 24px; }
  .game-title { font-size: 0.75rem; }
}

@media (max-width: 900px) {
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px; }
  .icon-wrapper { width: 76px; height: 76px; border-radius: 22px; }
}

@media (max-width: 600px) {
  body { padding: 16px 12px 32px; }
  .header { margin-bottom: 20px; }
  .header h1 { font-size: 1.6rem; }
  .search-input { padding: 12px 16px 12px 46px; font-size: 16px; /* prevent zoom on iOS */ }
  .search-icon { left: 14px; width: 20px; height: 20px; }
  .stats-bar { gap: 16px; font-size: 0.8rem; }
  .game-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .icon-wrapper { width: 70px; height: 70px; border-radius: 20px; }
  .game-title { font-size: 0.7rem; }
  .game-card { padding: 14px 8px 12px; border-radius: 18px; }
}

@media (max-width: 400px) {
  .game-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .icon-wrapper { width: 64px; height: 64px; border-radius: 18px; }
  .game-title { font-size: 0.65rem; }
}

/* Large screens - more columns */
@media (min-width: 1400px) {
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .icon-wrapper { width: 96px; height: 96px; border-radius: 28px; }
  .game-title { font-size: 0.82rem; }
}

@media (min-width: 1800px) {
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .icon-wrapper { width: 104px; height: 104px; border-radius: 30px; }
  .game-title { font-size: 0.85rem; }
}

/* ============================================================
   ACCESSIBILITY - Reduced Motion
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   HIGH CONTRAST MODE
   ============================================================ */
@media (prefers-contrast: high) {
  :root {
    --card-bg: white;
    --card-border: var(--deep-teal);
    --text-primary: black;
    --search-bg: white;
    --search-border: var(--deep-teal);
  }
  .game-card:hover { border-color: var(--deep-teal); }
}
</style>

const PALETTES = [
  {main:'#0E7C8C', light:'#19A7CE', accent:'#4FC3F7', fg:'#FFFFFF'}, // Deep Teal
  {main:'#19A7CE', light:'#4FC3F7', accent:'#2EBD85', fg:'#FFFFFF'}, // Teal
  {main:'#2EBD85', light:'#15966B', accent:'#19A7CE', fg:'#FFFFFF'}, // Sea Green
  {main:'#15966B', light:'#2EBD85', accent:'#19A7CE', fg:'#FFFFFF'}, // Deep Green
  {main:'#4FC3F7', light:'#6fd5fa', accent:'#19A7CE', fg:'#FFFFFF'}, // Sky Blue
  {main:'#F0544F', light:'#f77a76', accent:'#F59B23', fg:'#FFFFFF'}, // Coral Red
  {main:'#F59B23', light:'#f8b84d', accent:'#FFD34E', fg:'#FFFFFF'}, // Orange
  {main:'#C56CD6', light:'#d694e8', accent:'#E85D9E', fg:'#FFFFFF'}, // Purple-Pink
];

// Simple hash for consistent palette assignment
function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return Math.abs(h);
}

// Determine icon type/category from title
function getIconType(title) {
  const t = title.toLowerCase();
  if (t.includes('puzzle') || t.includes('2048') || t.includes('minesweeper') || t.includes('bloxorz') || t.includes('trivia') || t.includes('quiz') || t.includes('riddle') || t.includes('wordle') || t.includes('sokoban')) return 'puzzle';
  if (t.includes('racing') || t.includes('racer') || t.includes('motorcycle') || t.includes('moto') || t.includes('bike') || t.includes('car') || t.includes('highway') || t.includes('track') || t.includes('drift') || t.includes('speed') || t.includes('slope') || t.includes('polytrack')) return 'racing';
  if (t.includes('shoot') || t.includes('gun') || t.includes('tank') || t.includes('tank') || t.includes('boom') || t.includes('blast') || t.includes('trigger') || t.includes('bullet') || t.includes('sniper') || t.includes('battle') || t.includes('combat') || t.includes('strike') || t.includes('war') || t.includes('arrow') || t.includes('archer')) return 'shooter';
  if (t.includes('platform') || t.includes('run') || t.includes('jump') || t.includes('hook') || t.includes('climb') || t.includes('adventure') || t.includes('level') || t.includes('vex') || t.includes('fireboy') || t.includes('watergirl') || t.includes('dadish') || t.includes('fancy') || t.includes('doodle') || t.includes('evil') || t.includes('glitch') || t.includes('short') || t.includes('death') || t.includes('only') || t.includes('impossible')) return 'adventure';
  if (t.includes('strategy') || t.includes('tower') || t.includes('td') || t.includes('bloons') || t.includes('defense') || t.includes('kingdom') || t.includes('age of') || t.includes('war') || t.includes('clash') || t.includes('viking') || t.includes('state.io') || t.includes('territorial') || t.includes('merge') || t.includes('idle') || t.includes('sim') || t.includes('tycoon') || t.includes('papa') || t.includes('restaurant') || t.includes('cooking') || t.includes('burger') || t.includes('pizza') || t.includes('pancake') || t.includes('donut') || t.includes('freezeria') || t.includes('cupcake') || t.includes('pastaria') || t.includes('taco') || t.includes('wingeria') || t.includes('hot dog') || t.includes('cheeseria') || t.includes('pizzeria')) return 'strategy';
  if (t.includes('horror') || t.includes('fnaf') || t.includes('five nights') || t.includes('backrooms') || t.includes('scary') || t.includes('evil') || t.includes('monster') || t.includes('zombie') || t.includes('ghost')) return 'horror';
  if (t.includes('io') || t.includes('agar') || t.includes('slither') || t.includes('multiplayer') || t.includes('online') || t.includes('.io') || t.includes('territorial') || t.includes('hole.io') || t.includes('ducklings') || t.includes('volley') || t.includes('basket') || t.includes('soccer') || t.includes('football') || t.includes('tag') || t.includes('wrestle') || t.includes('stick') || t.includes('ragdoll') || t.includes('rooftop') || t.includes('get on top') || t.includes('battle') || t.includes('bros') || t.includes('bros') || t.includes('legends') || t.includes('random')) return 'multi';
  if (t.includes('retro') || t.includes('classic') || t.includes('pacman') || t.includes('snake') || t.includes('tetris') || t.includes('pong') || t.includes('ping pong') || t.includes('space invaders') || t.includes('frogger') || t.includes('donkey kong') || t.includes('mario') || t.includes('sonic') || t.includes('indie') || t.includes('8-bit') || t.includes('16-bit') || t.includes('nes') || t.includes('genesis') || t.includes('sm64') || t.includes('eaglercraft') || t.includes('minecraft') || t.includes('alpha') || t.includes('beta') || t.includes('indev')) return 'classic';
  if (t.includes('clicker') || t.includes('idle') || t.includes('tap') || t.includes('incremental') || t.includes('cookie') || t.includes('capybara') || t.includes('spacebar')) return 'casual';
  if (t.includes('rpg') || t.includes('role') || t.includes('level up') || t.includes('experience') || t.includes('skill') || t.includes('quest') || t.includes('dungeon') || t.includes('adventure') || t.includes('learn to fly') || t.includes('duck life') || t.includes('pou') || t.includes('tamagotchi') || t.includes('pet')) return 'rpg';
  if (t.includes('sport') || t.includes('tennis') || t.includes('golf') || t.includes('pool') || t.includes('8ball') || t.includes('billiard') || t.includes('bowling') || t.includes('baseball') || t.includes('ping pong') || t.includes('table tennis') || t.includes('volleyball') || t.includes('badminton')) return 'racing';
  return 'action';
}

// Generate SVG for icon based on type and palette
function generateIconSvg(type, palette, title) {
  const {main, light, accent, fg} = palette;
  const seed = hashStr(title);
  const variant = seed % 3; // 0, 1, 2 for sub-variations

  // Gradient definition (135deg = top-left light source)
  const gradId = `grad-${hashStr(title + type)}`;
  const grad = `<defs><linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${light}"/><stop offset="55%" stop-color="${main}"/><stop offset="100%" stop-color="${adjustColor(main, -15)}"/></linearGradient></defs>`;

  // Squircle path (continuous curvature approximation)
  const size = 512;
  const r = size * 0.26; // ~26% corner radius for squircle
  const squirclePath = `M${r},0 H${size-r} C${size-r*0.4},0 ${size},${r*0.4} ${size},${r} V${size-r} C${size},${size-r*0.4} ${size-r*0.4},${size} ${size-r},${size} H${r} C${r*0.4},${size} 0,${size-r*0.4} 0,${size-r} V${r} C0,${r*0.4} ${r*0.4},0 ${r},0 Z`;

  // Organic teardrop/leaf shape
  const organicPath = `M256,40 C380,40 460,180 460,256 C460,332 380,472 256,472 C180,472 80,380 80,256 C80,180 180,40 256,40 Z`;
  const organicPath2 = `M256,60 C360,60 440,200 440,256 C440,312 360,452 256,452 C152,452 72,312 72,256 C72,200 152,60 256,60 Z`;

  // Symbol paths (negative space - white on colored bg)
  const symbols = {
    puzzle: [
      // Concentric circles - puzzle piece
      `<circle cx="256" cy="256" r="140" fill="none" stroke="${fg}" stroke-width="32" stroke-linecap="round" opacity="0.9"/>`,
      `<circle cx="256" cy="256" r="70" fill="${fg}" opacity="0.95"/>`
    ],
    action: [
      // Squircle with play triangle
      `<path d="${squirclePath}" fill="${fg}" opacity="0.12"/>`,
      `<polygon points="200,160 200,352 352,256" fill="${fg}" opacity="0.95"/>`
    ],
    racing: [
      // Organic teardrop with speed lines
      `<path d="${organicPath}" fill="${fg}" opacity="0.1"/>`,
      `<path d="M180,256 L340,256 M180,220 L320,220 M180,292 L320,292" stroke="${fg}" stroke-width="24" stroke-linecap="round" opacity="0.9"/>`,
      `<circle cx="420" cy="256" r="28" fill="${accent}" opacity="0.9"/>`
    ],
    adventure: [
      // Squircle with mountain/peak
      `<path d="${squirclePath}" fill="${fg}" opacity="0.12"/>`,
      `<path d="M160,340 L256,160 L352,340 Z" fill="${fg}" opacity="0.95"/>`,
      `<path d="M200,340 L256,240 L312,340 Z" fill="${accent}" opacity="0.9"/>`
    ],
    strategy: [
      // Concentric circles - tower defense style
      `<circle cx="256" cy="256" r="150" fill="none" stroke="${fg}" stroke-width="28" stroke-linecap="round" opacity="0.9"/>`,
      `<circle cx="256" cy="256" r="85" fill="${fg}" opacity="0.95"/>`,
      `<rect x="236" y="120" width="40" height="100" rx="8" fill="${accent}" opacity="0.9"/>`
    ],
    shooter: [
      // Squircle with crosshair
      `<path d="${squirclePath}" fill="${fg}" opacity="0.1"/>`,
      `<circle cx="256" cy="256" r="110" fill="none" stroke="${fg}" stroke-width="22" stroke-linecap="round" opacity="0.85"/>`,
      `<line x1="256" y1="146" x2="256" y2="366" stroke="${fg}" stroke-width="22" stroke-linecap="round" opacity="0.9"/>`,
      `<line x1="146" y1="256" x2="366" y2="256" stroke="${fg}" stroke-width="22" stroke-linecap="round" opacity="0.9"/>`
    ],
    casual: [
      // Organic with dots (clicker style)
      `<path d="${organicPath2}" fill="${fg}" opacity="0.1"/>`,
      `<circle cx="256" cy="200" r="50" fill="${fg}" opacity="0.95"/>`,
      `<circle cx="256" cy="360" r="22" fill="${accent}" opacity="0.9"/>`
    ],
    rpg: [
      // Concentric circles - RPG stats
      `<circle cx="256" cy="256" r="145" fill="none" stroke="${fg}" stroke-width="30" stroke-linecap="round" opacity="0.9"/>`,
      `<circle cx="256" cy="256" r="90" fill="${fg}" opacity="0.95"/>`,
      `<polygon points="256,150 290,220 370,220 300,270 320,350 256,300 192,350 212,270 142,220 222,220" fill="${accent}" opacity="0.95"/>`
    ],
    horror: [
      // Dark squircle with eye
      `<path d="${squirclePath}" fill="${main}" opacity="0.6"/>`,
      `<ellipse cx="256" cy="256" rx="100" ry="60" fill="${fg}" opacity="0.15"/>`,
      `<ellipse cx="256" cy="256" rx="40" ry="50" fill="${main}" opacity="0.9"/>`
    ],
    multi: [
      // Organic with multiple figures
      `<path d="${organicPath}" fill="${fg}" opacity="0.08"/>`,
      `<circle cx="180" cy="256" r="50" fill="${fg}" opacity="0.9"/>`,
      `<circle cx="332" cy="256" r="50" fill="${accent}" opacity="0.9"/>`
    ],
    classic: [
      // Concentric - arcade cabinet
      `<circle cx="256" cy="256" r="140" fill="none" stroke="${fg}" stroke-width="38" stroke-linecap="round" opacity="0.95"/>`,
      `<circle cx="256" cy="256" r="60" fill="${fg}" opacity="0.95"/>`,
      `<rect x="216" y="140" width="80" height="120" rx="12" fill="${accent}" opacity="0.9"/>`
    ]
  };

  const typeSymbols = symbols[type] || symbols.action;
  const symbolSvg = typeSymbols.map(s => s.replace(/fill="#FFFFFF"/g, `fill="${fg}"`)).join('');

  return `${grad}<rect width="512" height="512" fill="url(#${gradId})" rx="130" ry="130"/>${symbolSvg}`;
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.max(0, Math.min(255, ((num >> 16) & 255) + amount));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amount));
  const b = Math.max(0, Math.min(255, (num & 255) + amount));
  return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
}

// RENDER GAMES
// ============================================================

const grid = document.getElementById('gameGrid');
const template = document.getElementById('gameCardTemplate');
const totalCountEl = document.getElementById('totalCount');
const visibleCountEl = document.getElementById('visibleCount');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

totalCountEl.textContent = GAMES.length;

function renderGames(filter = '') {
  grid.innerHTML = '';
  const lowerFilter = filter.toLowerCase().trim();
  let visible = 0;

  GAMES.forEach((game, index) => {
    if (lowerFilter && !game.title.toLowerCase().includes(lowerFilter)) return;
    visible++;

    const clone = template.content.cloneNode(true);
    const card = clone.querySelector('.game-card');
    const titleEl = clone.querySelector('.game-title');
    const iconWrapper = clone.querySelector('.icon-wrapper');
    const iconSvg = clone.querySelector('.icon-svg');

    // Assign palette deterministically
    const palette = PALETTES[hashStr(game.title) % PALETTES.length];
    const type = getIconType(game.title);

    // Apply palette CSS vars to icon wrapper for gradient
    iconWrapper.style.setProperty('--ic-main', palette.main);
    iconWrapper.style.setProperty('--ic-main-light', palette.light);
    iconWrapper.style.setProperty('--ic-accent', palette.accent);
    iconWrapper.style.setProperty('--ic-fg', palette.fg);

    // Generate and inject SVG
    iconSvg.innerHTML = generateIconSvg(type, palette, game.title);
    iconSvg.classList.add(`icon-type-${type}`);
    iconSvg.classList.add(`icon-palette-${(hashStr(game.title) % PALETTES.length) + 1}`);

    // Set link and title
    card.href = `/games-web/${game.file}`;
    titleEl.textContent = game.title;

    // Staggered entrance animation
    card.style.animationDelay = `${Math.min(index * 15, 300)}ms`;
    card.classList.add('fade-in');

    grid.appendChild(clone);
  });

  visibleCountEl.textContent = visible;

  // No results state
  if (visible === 0 && lowerFilter) {
    const noResults = document.createElement('div');
    noResults.className = 'no-results';
    noResults.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <p>未找到匹配的游戏</p>
      <span>尝试其他关键词或清空搜索</span>
    `;
    grid.appendChild(noResults);
  }
}

// ============================================================
// SEARCH HANDLING
// ============================================================

let searchDebounce;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    const val = e.target.value;
    searchClear.classList.toggle('visible', val.length > 0);
    renderGames(val);
  }, 120);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  renderGames('');
  searchInput.focus();
});

// Clear on Escape
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    renderGames('');
    searchInput.blur();
  }
});

// Keyboard navigation: Enter/Space on card opens link
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.game-card')) {
    e.preventDefault();
    e.target.closest('.game-card').click();
  }
});
</script>
</body>
</html>
