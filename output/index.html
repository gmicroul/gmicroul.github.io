*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#16213e,#0f3460);padding:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
.header h1{font-size:20px;font-weight:600;color:#e0e0e0;margin-bottom:8px;letter-spacing:0.5px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:#888;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-wrap svg line{stroke:#888}
#search{width:100%;padding:10px 12px 10px 38px;border:1px solid #333;border-radius:8px;background:#0d1117;color:#e0e0e0;font-size:15px;outline:none;transition:border-color .2s}
#search:focus{border-color:#533483}
#search::placeholder{color:#555}
.count{font-size:13px;color:#888;margin-top:8px;padding-left:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{background:#16213e;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid #1a1a3e;text-decoration:none}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(83,52,131,0.3);border-color:#533483}
.card:active{transform:scale(0.97)}
.card-icon{width:86px;height:86px;border-radius:0;margin-bottom:8px;display:block}
.card-name{font-size:12px;color:#ccc;text-align:center;line-height:1.3;max-height:32px;overflow:hidden;width:100%;word-break:break-word}
.no-results{text-align:center;padding:40px 20px;color:#666;font-size:15px;display:none}
</style>

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const countEl=document.getElementById("count");
const noResults=document.getElementById("noResults");
function render(filter){
  const f=(filter||"").toLowerCase();
  const filtered=f?GAMES.filter(g=>g.name.toLowerCase().includes(f)):GAMES;
  grid.innerHTML="";
  if(filtered.length===0){noResults.style.display="block";countEl.textContent="0 games";return;}
  noResults.style.display="none";
  countEl.textContent=filtered.length+" game"+(filtered.length!==1?"s":"");
  filtered.forEach(g=>{
    const a=document.createElement("a");
    a.className="card";
    a.href=g.file;
    a.innerHTML='<img class="card-icon" src="'+g.icon+'" alt="'+g.name+'" loading="lazy"><div class="card-name">'+g.name+'</div>';
    grid.appendChild(a);
  });
}
search.addEventListener("input",function(){render(this.value)});
render("");
