<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root {
  --bg: #0a0f14;
  --bg-elevated: #111820;
  --bg-card: #151d28;
  --fg: #f5f7f7;
  --fg-muted: #8a9ba8;
  --accent-cyan: #19a7ce;
  --accent-teal: #0e7c8c;
  --accent-sky: #4fc3f7;
  --accent-sea: #2ebd85;
  --accent-deep: #15966b;
  --accent-coral: #f0544f;
  --accent-orange: #f59b23;
  --accent-yellow: #ffd34e;
  --gradient-ocean: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%);
  --gradient-sea: linear-gradient(135deg, #15966b 0%, #2ebd85 50%, #4fc3f7 100%);
  --gradient-warm: linear-gradient(135deg, #f0544f 0%, #f59b23 50%, #ffd34e 100%);
  --gradient-berry: linear-gradient(135deg, #c56cd6 0%, #e85d9e 100%);
  --shadow-soft: 0 8px 32px rgba(20, 40, 60, 0.35);
  --shadow-long: 12px 12px 24px rgba(20, 40, 60, 0.25);
  --radius-squircle: 28%;
  --stroke-w: 6%;
  --safe-zone: 82%;
  --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 var(--glow-color); }
  50% { box-shadow: 0 0 20px 4px var(--glow-color); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(25, 167, 206, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(46, 189, 133, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse 50% 30% at 0% 0%, rgba(197, 108, 214, 0.05) 0%, transparent 50%);
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  position: relative;
  padding: clamp(1.25rem, 3vw, 2rem) clamp(1rem, 4vw, 2.5rem);
  text-align: center;
  background:
    linear-gradient(180deg, rgba(25, 167, 206, 0.06) 0%, transparent 100%),
    linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.02), transparent);
  border-bottom: 1px solid rgba(25, 167, 206, 0.1);
}

.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0C13.43 0 0 13.43 0 30s13.43 30 30 30 30-13.43 30-30S46.57 0 30 0zm0 54C16.74 54 6 43.26 6 30S16.74 6 30 6s24 10.74 24 24-10.74 24-24 24z' fill='none' stroke='%2319a7ce' stroke-width='0.5' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
  animation: fadeInUp 0.6s var(--transition);
}

.logo-icon {
  width: clamp(40px, 6vw, 56px);
  height: clamp(40px, 6vw, 56px);
  border-radius: var(--radius-squircle);
  background: var(--gradient-ocean);
  position: relative;
  box-shadow:
    var(--shadow-soft),
    inset 0 1px 0 rgba(255, 255, 255, 0.2),
    inset 0 -1px 0 rgba(0, 0, 0, 0.2);
  clip-path: polygon(
    0% var(--radius-squircle),
    0% calc(100% - var(--radius-squircle)),
    var(--radius-squircle) 100%,
    calc(100% - var(--radius-squircle)) 100%,
    100% calc(100% - var(--radius-squircle)),
    100% var(--radius-squircle),
    calc(100% - var(--radius-squircle)) 0%,
    var(--radius-squircle) 0%
  );
}

.logo-icon::before {
  content: '';
  position: absolute;
  inset: 12%;
  background: var(--bg);
  border-radius: calc(var(--radius-squircle) * 0.6);
  clip-path: polygon(
    0% calc(var(--radius-squircle) * 0.6),
    0% calc(100% - var(--radius-squircle) * 0.6),
    calc(var(--radius-squircle) * 0.6) 100%,
    calc(100% - var(--radius-squircle) * 0.6) 100%,
    100% calc(100% - var(--radius-squircle) * 0.6),
    100% calc(var(--radius-squircle) * 0.6),
    calc(100% - var(--radius-squircle) * 0.6) 0%,
    calc(var(--radius-squircle) * 0.6) 0%
  );
}

.logo-icon::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 45%; height: 45%;
  background: var(--gradient-ocean);
  border-radius: 50%;
  box-shadow:
    0 0 16px rgba(25, 167, 206, 0.6),
    inset 0 -2px 4px rgba(0, 0, 0, 0.3);
  animation: pulseGlow 3s ease-in-out infinite;
  --glow-color: rgba(25, 167, 206, 0.4);
}

.logo-text { display: flex; flex-direction: column; text-align: left; }

.logo-title {
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--fg) 0%, var(--accent-sky) 50%, var(--accent-sea) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
}

.logo-subtitle {
  font-size: clamp(0.75rem, 1.5vw, 0.875rem);
  color: var(--fg-muted);
  font-weight: 400;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* Search */
.search-wrap {
  max-width: 560px;
  margin: clamp(1rem, 2.5vw, 1.5rem) auto 0;
  animation: fadeInUp 0.7s var(--transition) 0.1s both;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 0.875rem 1.25rem 0.875rem 3rem;
  font-size: clamp(0.9rem, 2vw, 1rem);
  background: var(--bg-card);
  border: 1px solid rgba(25, 167, 206, 0.15);
  border-radius: 999px;
  color: var(--fg);
  outline: none;
  transition: var(--transition);
  box-shadow: var(--shadow-soft);
}

.search-input::placeholder { color: var(--fg-muted); opacity: 0.7; }

.search-input:focus,
.search-input:not(:placeholder-shown) {
  border-color: var(--accent-cyan);
  box-shadow:
    var(--shadow-soft),
    0 0 0 3px rgba(25, 167, 206, 0.15);
}

.search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px;
  stroke: var(--fg-muted);
  stroke-width: 2;
  pointer-events: none;
  transition: var(--transition);
}

.search-input:focus + .search-icon { stroke: var(--accent-cyan); }

.search-clear {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 24px; height: 24px;
  background: transparent;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
  color: var(--fg-muted);
}

.search-clear:hover { background: rgba(240, 84, 79, 0.15); color: var(--accent-coral); }
.search-input:not(:placeholder-shown) + .search-icon + .search-clear { opacity: 1; visibility: visible; }

/* Stats Bar */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: clamp(1rem, 3vw, 2rem);
  margin-top: clamp(1rem, 2.5vw, 1.5rem);
  padding: 0.75rem 1.5rem;
  background: rgba(21, 29, 40, 0.6);
  border-radius: 999px;
  border: 1px solid rgba(25, 167, 206, 0.1);
  max-width: fit-content;
  margin-left: auto;
  margin-right: auto;
  animation: fadeInUp 0.7s var(--transition) 0.2s both;
  backdrop-filter: blur(12px);
}

.stat-item { display: flex; align-items: center; gap: 0.5rem; }

.stat-value {
  font-size: clamp(1.125rem, 2.5vw, 1.5rem);
  font-weight: 700;
  background: var(--gradient-ocean);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label {
  font-size: clamp(0.7rem, 1.3vw, 0.75rem);
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Main Grid */
.main { flex: 1; padding: clamp(1rem, 2.5vw, 2rem) clamp(1rem, 4vw, 2.5rem); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 20vw, 180px), 1fr));
  gap: clamp(0.75rem, 1.5vw, 1.25rem);
  max-width: 1600px;
  margin: 0 auto;
}

.game-card {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--radius-squircle);
  background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.04);
  cursor: pointer;
  overflow: hidden;
  transition: var(--transition);
  animation: fadeInUp 0.5s var(--transition) both;
  animation-delay: calc(var(--i, 0) * 0.02s);
  clip-path: polygon(
    0% var(--radius-squircle),
    0% calc(100% - var(--radius-squircle)),
    var(--radius-squircle) 100%,
    calc(100% - var(--radius-squircle)) 100%,
    100% calc(100% - var(--radius-squircle)),
    100% var(--radius-squircle),
    calc(100% - var(--radius-squircle)) 0%,
    var(--radius-squircle) 0%
  );
}

.game-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%, rgba(0,0,0,0.1) 100%);
  pointer-events: none;
  z-index: 1;
}

.game-card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: rgba(25, 167, 206, 0.3);
  box-shadow:
    var(--shadow-soft),
    0 0 0 1px rgba(25, 167, 206, 0.15),
    0 0 32px rgba(25, 167, 206, 0.1);
  z-index: 10;
}

.game-card:active { transform: translateY(-2px) scale(0.99); }

.game-card.hidden { display: none !important; }

/* Icon Area */
.card-icon {
  position: relative;
  width: 100%;
  height: 70%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-icon svg {
  width: var(--safe-zone);
  height: var(--safe-zone);
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
  transition: var(--transition);
}

.game-card:hover .card-icon svg { transform: scale(1.05) rotate(-2deg); }

/* Card Info */
.card-info {
  padding: clamp(0.625rem, 1.2vw, 0.875rem) clamp(0.75rem, 1.5vw, 1rem);
  text-align: center;
  position: relative;
  z-index: 2;
}

.card-title {
  font-size: clamp(0.75rem, 1.5vw, 0.875rem);
  font-weight: 600;
  line-height: 1.3;
  color: var(--fg);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
}

/* Empty State */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: clamp(3rem, 8vw, 5rem) 2rem;
  animation: fadeInUp 0.5s var(--transition);
}

.empty-icon {
  width: clamp(80px, 15vw, 120px);
  height: clamp(80px, 15vw, 120px);
  margin: 0 auto 1.5rem;
  opacity: 0.4;
}

.empty-title {
  font-size: clamp(1.25rem, 3vw, 1.5rem);
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: var(--fg);
}

.empty-desc {
  font-size: clamp(0.9rem, 1.8vw, 1rem);
  color: var(--fg-muted);
  max-width: 400px;
  margin: 0 auto;
}

/* Footer */
.footer {
  padding: clamp(1.5rem, 3vw, 2rem);
  text-align: center;
  border-top: 1px solid rgba(255, 255, 255, 0.03);
  background: rgba(10, 15, 20, 0.8);
  backdrop-filter: blur(12px);
}

.footer-text {
  font-size: clamp(0.75rem, 1.3vw, 0.875rem);
  color: var(--fg-muted);
}

.footer-link {
  color: var(--accent-sky);
  text-decoration: none;
  transition: var(--transition);
}

.footer-link:hover { color: var(--accent-sea); text-decoration: underline; }

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Focus Visible */
:focus-visible {
  outline: 2px solid var(--accent-cyan);
  outline-offset: 2px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent-teal); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

/* Mobile Adjustments */
@media (max-width: 480px) {
  .stats-bar { gap: 1rem; padding: 0.625rem 1rem; }
  .stat-value { font-size: 1rem; }
  .stat-label { font-size: 0.6rem; }
}
</style>
</head>

</div>

// ===== SVG Icon Generators (Sailfish OS Style) =====
const ICON_GENERATORS = [
  // 1. Concentric circles (focus, lens, time)
  (palette, seed) => {
    const r = 32; const cx = 32; const cy = 32;
    const rings = 3 + (seed % 3);
    let paths = '';
    for (let i = 0; i < rings; i++) {
      const radius = r * (0.7 - i * 0.15) * (0.85 + (seed % 4) * 0.05);
      const strokeW = 3 + (seed % 3);
      paths += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${palette.fg}" stroke-width="${strokeW}" stroke-linecap="round" opacity="${0.9 - i * 0.2}"/>`;
    }
    // Center dot
    paths += `<circle cx="${cx}" cy="${cy}" r="${2 + seed % 3}" fill="${palette.accent}"/>`;
    // Accent dots
    for (let i = 0; i < 3; i++) {
      const angle = (seed * 0.7 + i * 2.1) % (Math.PI * 2);
      const d = r * 0.45;
      paths += `<circle cx="${cx + Math.cos(angle) * d}" cy="${cy + Math.sin(angle) * d}" r="${1.5}" fill="${palette.accent}" opacity="0.8"/>`;
    }
    return paths;
  },
  // 2. Squircle with negative cutout (organic shape)
  (palette, seed) => {
    const size = 64; const r = 18;
    const squircle = `M${r},0 H${size-r} Q${size},0 ${size},${r} V${size-r} Q${size},${size} ${size-r},${size} H${r} Q0,${size} 0,${size-r} V${r} Q0,0 ${r},0 Z`;
    // Negative shape inside
    const shapes = ['circle', 'rounded-rect', 'triangle', 'droplet'];
    const shape = shapes[seed % shapes.length];
    let inner = '';
    const cx = 32, cy = 32;
    const s = 18 + (seed % 8);
    if (shape === 'circle') inner = `<circle cx="${cx}" cy="${cy}" r="${s}" fill="${palette.bg}"/>`;
    else if (shape === 'rounded-rect') inner = `<rect x="${cx-s}" y="${cy-s}" width="${s*2}" height="${s*2}" rx="${6 + seed%4}" fill="${palette.bg}"/>`;
    else if (shape === 'triangle') inner = `<path d="M${cx} ${cy-s} L${cx+s*0.866} ${cy+s*0.5} L${cx-s*0.866} ${cy+s*0.5} Z" fill="${palette.bg}"/>`;
    else inner = `<path d="M${cx} ${cy-s} Q${cx+s*0.6} ${cy-s*0.3} ${cx+s*0.6} ${cy} Q${cx+s*0.6} ${cy+s*0.3} ${cx} ${cy+s} Q${cx-s*0.6} ${cy+s*0.3} ${cx-s*0.6} ${cy} Q${cx-s*0.6} ${cy-s*0.3} ${cx} ${cy-s} Z" fill="${palette.bg}"/>`;
    return `<path d="${squircle}" fill="url(#grad)"/><mask id="mask"><rect width="64" height="64" fill="white"/>${inner}</mask><g mask="url(#mask)"><rect width="64" height="64" fill="url(#grad)"/></g>`;
  },
  // 3. Organic flow shape (droplet/leaf/comma)
  (palette, seed) => {
    const cx = 32, cy = 32;
    const types = ['droplet', 'leaf', 'comma', 'arch'];
    const t = types[seed % types.length];
    let path = '';
    const base = 22 + (seed % 8);
    if (t === 'droplet') {
      path = `M${cx} ${cy-base*1.3} Q${cx+base} ${cy-base*0.3} ${cx+base*0.6} ${cy+base*0.5} Q${cx} ${cy+base*1.5} ${cx} ${cy+base*1.5} Q${cx} ${cy+base*1.5} ${cx-base*0.6} ${cy+base*0.5} Q${cx-base} ${cy-base*0.3} ${cx} ${cy-base*1.3} Z`;
    } else if (t === 'leaf') {
      path = `M${cx} ${cy-base*1.2} Q${cx+base*1.2} ${cy} ${cx} ${cy+base*1.2} Q${cx-base*1.2} ${cy} ${cx} ${cy-base*1.2} Z`;
    } else if (t === 'comma') {
      path = `M${cx} ${cy-base*1.1} Q${cx+base} ${cy-base*0.2} ${cx+base*0.5} ${cy+base*0.8} Q${cx} ${cy+base*1.3} ${cx} ${cy+base*1.3} Q${cx} ${cy+base*1.3} ${cx-base*0.3} ${cy+base*0.6} Q${cx-base*0.8} ${cy} ${cx} ${cy-base*1.1} Z`;
    } else {
      path = `M${cx-base} ${cy+base*0.5} Q${cx-base*0.3} ${cy-base*1.2} ${cx} ${cy-base*1.2} Q${cx+base*0.3} ${cy-base*1.2} ${cx+base} ${cy+base*0.5} Z`;
    }
    // Accent line
    const accentPath = path.replace('Z', '') + ` M${cx} ${cy-base*0.8} Q${cx+base*0.4} ${cy} ${cx} ${cy+base*0.8}`;
    return `<path d="${path}" fill="url(#grad)"/><path d="${accentPath}" fill="none" stroke="${palette.accent}" stroke-width="3" stroke-linecap="round" opacity="0.7"/>`;
  },
  // 4. Geometric negative space (play, forward, menu)
  (palette, seed) => {
    const cx = 32, cy = 32;
    const shapes = ['play', 'forward', 'menu', 'dots', 'grid', 'cross'];
    const s = shapes[seed % shapes.length];
    let paths = '';
    const base = 16 + (seed % 6);
    if (s === 'play') {
      paths = `<path d="M${cx-base*0.5} ${cy-base} L${cx+base} ${cy} L${cx-base*0.5} ${cy+base} Z" fill="${palette.fg}"/>`;
    } else if (s === 'forward') {
      paths = `<path d="M${cx-base} ${cy-base} L${cx+base*0.3} ${cy} L${cx-base} ${cy+base} M${cx+base*0.3} ${cy} H${cx+base}" fill="none" stroke="${palette.fg}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
    } else if (s === 'menu') {
      for (let i = 0; i < 3; i++) {
        paths += `<rect x="${cx-base}" y="${cy-base*1.2 + i*base*1.2}" width="${base*2}" height="${base*0.5}" rx="${base*0.25}" fill="${palette.fg}"/>`;
      }
    } else if (s === 'dots') {
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          paths += `<circle cx="${cx-base*1.2 + j*base*1.2}" cy="${cy-base*1.2 + i*base*1.2}" r="${base*0.35}" fill="${palette.fg}" opacity="${0.5 + (i+j)%2 * 0.4}"/>`;
        }
      }
    } else if (s === 'grid') {
      for (let i = 0; i < 2; i++) {
        for (let j = 0; j < 2; j++) {
          paths += `<rect x="${cx-base*0.7 + j*base*1.4}" y="${cy-base*0.7 + i*base*1.4}" width="${base*1.2}" height="${base*1.2}" rx="${3}" fill="${palette.fg}" opacity="${0.6 + (i+j)%2 * 0.3}"/>`;
        }
      }
    } else {
      paths = `<path d="M${cx-base} ${cy-base} L${cx+base} ${cy+base} M${cx+base} ${cy-base} L${cx-base} ${cy+base}" fill="none" stroke="${palette.fg}" stroke-width="${4 + seed%2}" stroke-linecap="round"/>`;
    }
    return paths;
  },
  // 5. Organic squircle with cutout (phone, bubble, envelope)
  (palette, seed) => {
    const cx = 32, cy = 32;
    const types = ['phone', 'bubble', 'envelope', 'shield'];
    const t = types[seed % types.length];
    let paths = '';
    if (t === 'phone') {
      paths = `<path d="M${cx-18} ${cy-24} Q${cx+18} ${cy-24} ${cx+18} ${cy-14} V${cy+24} Q${cx+18} ${cy+28} ${cx} ${cy+28} Q${cx-18} ${cy+28} ${cx-18} ${cy+18} V${cy-14} Q${cx-18} ${cy-24} ${cx} ${cy-24} Z" fill="url(#grad)"/>`;
      paths += `<circle cx="${cx}" cy="${cy+20}" r="5" fill="${palette.fg}" opacity="0.9"/>`;
      paths += `<path d="M${cx-8} ${cy-20} Q${cx} ${cy-16} ${cx+8} ${cy-20}" fill="none" stroke="${palette.fg}" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>`;
    } else if (t === 'bubble') {
      paths = `<path d="M${cx-20} ${cy-10} Q${cx+20} ${cy-10} ${cx+20} ${cy+10} Q${cx+20} ${cy+20} ${cx+8} ${cy+20} L${cx} ${cy+28} L${cx-8} ${cy+20} Q${cx-20} ${cy+20} ${cx-20} ${cy+10} Q${cx-20} ${cy-10} ${cx} ${cy-10} Z" fill="url(#grad)"/>`;
      for (let i = 0; i < 3; i++) {
        paths += `<circle cx="${cx-8 + i*8}" cy="${cy}" r="2.5" fill="${palette.accent}" opacity="${0.5 + i*0.2}"/>`;
      }
    } else if (t === 'envelope') {
      paths = `<path d="M${cx-22} ${cy-14} L${cx} ${cy+4} L${cx+22} ${cy-14} V${cy+20} Q${cx+22} ${cy+26} ${cx} ${cy+26} Q${cx-22} ${cy+26} ${cx-22} ${cy+20} Z" fill="url(#grad)"/>`;
      paths += `<path d="M${cx-16} ${cy-8} L${cx} ${cy+6} L${cx+16} ${cy-8}" fill="none" stroke="${palette.fg}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>`;
    } else {
      paths = `<path d="M${cx} ${cy-22} L${cx+20} ${cy-6} V${cy+14} Q${cx+20} ${cy+22} ${cx} ${cy+22} Q${cx-20} ${cy+22} ${cx-20} ${cy+14} V${cy-6} Z" fill="url(#grad)"/>`;
      paths += `<path d="M${cx} ${cy-14} L${cx} ${cy+8} M${cx-8} ${cy-2} L${cx+8} ${cy-2}" fill="none" stroke="${palette.fg}" stroke-width="3" stroke-linecap="round" opacity="0.8"/>`;
    }
    return paths;
  },
  // 6. Abstract tech shapes (circuit, signal, code)
  (palette, seed) => {
    const cx = 32, cy = 32;
    const types = ['circuit', 'signal', 'code', 'node', 'wave'];
    const t = types[seed % types.length];
    let paths = '';
    if (t === 'circuit') {
      paths = `<rect x="${cx-18}" y="${cy-2}" width="36" height="4" rx="2" fill="${palette.fg}" opacity="0.9"/>`;
      paths += `<rect x="${cx-2}" y="${cy-18}" width="4" height="36" rx="2" fill="${palette.fg}" opacity="0.9"/>`;
      for (let i = 0; i < 4; i++) {
        const angle = i * Math.PI / 2;
        const d = 18;
        paths += `<circle cx="${cx + Math.cos(angle)*d}" cy="${cy + Math.sin(angle)*d}" r="4" fill="${palette.accent}"/>`;
      }
    } else if (t === 'signal') {
      for (let i = 0; i < 4; i++) {
        paths += `<path d="M${cx-14 + i*10} ${cy+12} L${cx-10 + i*10} ${cy-12}" fill="none" stroke="${palette.fg}" stroke-width="${3 + i}" stroke-linecap="round" opacity="${0.4 + i*0.15}"/>`;
      }
    } else if (t === 'code') {
      paths = `<path d="M${cx-16} ${cy-12} L${cx} ${cy} L${cx-16} ${cy+12} M${cx+16} ${cy-12} L${cx} ${cy} L${cx+16} ${cy+12}" fill="none" stroke="${palette.fg}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>`;
      paths += `<circle cx="${cx-16}" cy="${cy-12}" r="3" fill="${palette.accent}"/><circle cx="${cx-16}" cy="${cy+12}" r="3" fill="${palette.accent}"/><circle cx="${cx+16}" cy="${cy-12}" r="3" fill="${palette.accent}"/><circle cx="${cx+16}" cy="${cy+12}" r="3" fill="${palette.accent}"/>`;
    } else if (t === 'node') {
      paths = `<circle cx="${cx}" cy="${cy}" r="14" fill="none" stroke="${palette.fg}" stroke-width="3" opacity="0.6"/>`;
      for (let i = 0; i < 6; i++) {
        const angle = i * Math.PI / 3;
        const d = 22;
        paths += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(angle)*d}" y2="${cy + Math.sin(angle)*d}" stroke="${palette.fg}" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>`;
        paths += `<circle cx="${cx + Math.cos(angle)*d}" cy="${cy + Math.sin(angle)*d}" r="5" fill="${palette.accent}"/>`;
      }
      paths += `<circle cx="${cx}" cy="${cy}" r="6" fill="${palette.fg}"/>`;
    } else {
      paths = `<path d="M${cx-24} ${cy} Q${cx-12} ${cy-16} ${cx} ${cy} Q${cx+12} ${cy+16} ${cx+24} ${cy}" fill="none" stroke="${palette.fg}" stroke-width="4" stroke-linecap="round" opacity="0.8"/>`;
      paths += `<path d="M${cx-24} ${cy+8} Q${cx-12} ${cy-8} ${cx} ${cy+8} Q${cx+12} ${cy+24} ${cx+24} ${cy+8}" fill="none" stroke="${palette.accent}" stroke-width="3" stroke-linecap="round" opacity="0.7"/>`;
    }
    return paths;
  },
];

// ===== Generate SVG for a game =====
function generateGameIcon(title, index) {
  const palette = PALETTES[index % PALETTES.length];
  const generator = ICON_GENERATORS[index % ICON_GENERATORS.length];
  const inner = generator(palette, index);

  // Create gradient definition
  const gradId = `grad-${index}`;
  const gradientDef = `
    <defs>
      <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
        <stop offset="0%" stop-color="${palette.bg.split(' ')[1] || '#0e7c8c'}"/>
        <stop offset="50%" stop-color="${palette.bg.split(' ')[3] || '#19a7ce'}"/>
        <stop offset="100%" stop-color="${palette.bg.split(' ')[5] || '#4fc3f7'}"/>
      </linearGradient>
    </defs>
  `.replace(/linear-gradient\([^)]+\)/, '');

  // Parse actual gradient colors from palette.bg
  const gradMatch = palette.bg.match(/#[0-9a-f]{6}/gi);
  const stops = gradMatch ? gradMap(gradMatch) : defaultStops();

  function gradMap(colors) {
    return colors.map((c, i) => `<stop offset="${i === 0 ? '0%' : i === colors.length - 1 ? '100%' : '50%'}" stop-color="${c}"/>`).join('');
  }
  function defaultStops() {
    return '<stop offset="0%" stop-color="#0e7c8c"/><stop offset="50%" stop-color="#19a7ce"/><stop offset="100%" stop-color="#4fc3f7"/>';
  }

  const gradDef = `<defs><linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">${gradMatch ? gradMap(gradMatch) : defaultStops()}</linearGradient></defs>`;

  return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">${gradDef}${inner.replace(/url\(#grad\)/g, `url(#${gradId})`)}</svg>`;
}

// ===== Render Game Cards =====
const grid = document.getElementById('gameGrid');
const emptyState = document.getElementById('emptyState');
const totalCountEl = document.getElementById('totalCount');
const visibleCountEl = document.getElementById('visibleCount');
const footerTotal = document.getElementById('footerTotal');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

let visibleCount = GAMES.length;

function renderGames(filter = '') {
  grid.innerHTML = '';
  visibleCount = 0;
  const lowerFilter = filter.toLowerCase().trim();

  GAMES.forEach((game, i) => {
    const matches = !lowerFilter || game.title.toLowerCase().includes(lowerFilter);
    if (!matches) return;

    visibleCount++;
    const card = document.createElement('article');
    card.className = 'game-card';
    card.style.setProperty('--i', visibleCount);
    card.role = 'listitem';
    card.tabIndex = 0;
    card.dataset.title = game.title;

    const iconSvg = generateGameIcon(game.title, i);

    card.innerHTML = `
      <div class="card-icon" aria-hidden="true">${iconSvg}</div>
      <div class="card-info">
        <h2 class="card-title">${escapeHtml(game.title)}</h2>
      </div>
    `;

    const url = `/games-web/${game.file}`;
    card.addEventListener('click', () => window.open(url, '_blank', 'noopener,noreferrer'));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    });

    grid.appendChild(card);
  });

  updateCounts();
  emptyState.hidden = visibleCount > 0;
  grid.style.display = visibleCount > 0 ? 'grid' : 'none';
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));
}

function updateCounts() {
  totalCountEl.textContent = GAMES.length;
  visibleCountEl.textContent = visibleCount;
  footerTotal.textContent = GAMES.length;
}

// ===== Search Handling =====
let searchDebounce = null;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => renderGames(e.target.value), 80);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  renderGames('');
});

// ===== Initialize =====
renderGames();

// ===== Keyboard shortcut: '/' to focus search =====
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
    searchInput.value = '';
    renderGames('');
  }
});
</script>
</body>
