<html lang="zh-CN">

<title>游戏大厅 · SFOS Game Hub</title>
<style>

* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  background: #14171a;
  background-image: radial-gradient(1200px 500px at 50% -10%, rgba(0,192,255,0.10), transparent 60%),
                    radial-gradient(800px 400px at 90% 110%, rgba(0,255,170,0.06), transparent 60%);
  background-attachment: fixed;
  color: #f2f5f7;
  font-family: "Sailfish", "Open Sans", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100%;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 26px 18px 60px; }

header.top { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.brand {
  width:48px; height:48px; border-radius:8px; flex:0 0 auto;
  background: linear-gradient(135deg, #00c0ff, #0077e6);
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 18px rgba(0,140,255,0.35);
}
.brand svg { width:26px; height:26px; }
.title h1 { font-size:24px; font-weight:600; letter-spacing:0.5px; }
.title p { font-size:13px; color:#8a949c; margin-top:2px; }
.title p b { color:#00d2a0; font-weight:600; }

.searchbar { position:relative; margin-bottom:22px; }
.searchbar svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:#8a949c; fill:none; stroke-width:2; stroke-linecap:round; }
#search {
  width:100%; padding:13px 44px; font-size:15px; color:#f2f5f7;
  background:#1c2126; border:1px solid #2a3138; border-radius:10px;
  outline:none; transition: border-color .15s, box-shadow .15s;
}
#search::placeholder { color:#6a747c; }
#search:focus { border-color:#00c0ff; box-shadow:0 0 0 3px rgba(0,192,255,0.18); }
#clear {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border:none; border-radius:8px; cursor:pointer;
  background:#2a3138; color:#aeb6bd; font-size:14px; line-height:1;
  display:none; align-items:center; justify-content:center;
}
#clear:hover { background:#36404a; color:#fff; }

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, 108px);
  justify-content:center;
  gap: 14px;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 108px); gap: 12px; }
}
.card {
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  width:108px; height:108px;
  background:#1b2025; border:1px solid #242b32; border-radius:0;
  text-decoration:none; color:inherit;
  transition: transform .12s, border-color .12s, background .12s;
}
.card:hover { background:#20272d; border-color:#00c0ff; transform:translateY(-3px); }
.card .ico { width:86px; height:86px; flex:0 0 86px; display:flex; align-items:center; justify-content:center; margin-top:4px; }
.card .ico img { width:86px; height:86px; display:block; }
.card .nm {
  width:100%; height:22px; flex:0 0 22px; text-align:center; font-size:10px; line-height:22px;
  color:#c2cad1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 2px;
}
.card:hover .nm { color:#fff; }

.empty {
  display:none; text-align:center; padding:60px 0; color:#6a747c; font-size:14px;
}
.empty.on { display:block; }
footer { margin-top:36px; text-align:center; font-size:12px; color:#4a525a; }

</style>
</head>

  var grid = document.getElementById('grid');
  var search = document.getElementById('search');
  var clearBtn = document.getElementById('clear');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');
  var all = GAMES.map(function(g){
    var a = document.createElement('a');
    a.className = 'card';
    a.href = '../games-web/' + g.f;
    a.title = g.n;
    var ico = document.createElement('span');
    ico.className = 'ico';
    var img = document.createElement('img');
    img.src = g.i; img.alt = ''; img.width = 86; img.height = 86; img.loading = 'lazy';
    ico.appendChild(img);
    var nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = g.n;
    a.appendChild(ico); a.appendChild(nm);
    return a;
  });
  all.forEach(function(a){ grid.appendChild(a); });

  function render(){
    var q = search.value.trim().toLowerCase();
    var shown = 0;
    for (var i = 0; i < all.length; i++) {
      var hit = !q || GAMES[i].n.toLowerCase().indexOf(q) !== -1;
      all[i].style.display = hit ? '' : 'none';
      if (hit) shown++;
    }
    count.textContent = shown;
    empty.classList.toggle('on', shown === 0);
    clearBtn.style.display = q ? 'flex' : 'none';
  }
  search.addEventListener('input', render);
  search.addEventListener('keydown', function(e){ if (e.key === 'Escape') { search.value = ''; render(); } });
  clearBtn.addEventListener('click', function(){ search.value = ''; render(); search.focus(); });
  render();
})();
