<style>
/* ===== CSS Variables & Reset ===== */
:root {
    --bg-primary: #0a0f1a;
    --bg-secondary: #111827;
    --bg-card: #161e2e;
    --bg-card-hover: #1c2538;
    --border-color: #2a3a52;
    --text-primary: #f0f4f8;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --accent-cyan: #19A7CE;
    --accent-teal: #2EBD85;
    --accent-blue: #4FC3F7;
    --accent-coral: #F0544F;
    --accent-orange: #F59B23;
    --accent-yellow: #FFD34E;
    --accent-purple: #C56CD6;
    --shadow-sm: 0 2px 8px rgba(20,40,60,0.25);
    --shadow-md: 0 8px 24px rgba(20,40,60,0.3);
    --shadow-lg: 0 16px 48px rgba(20,40,60,0.35);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
}

/* Animated background */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(25,167,206,0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(46,189,133,0.06) 0%, transparent 50%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(10,15,26,1) 0%, rgba(5,8,14,1) 100%);
    pointer-events: none;
    z-index: -1;
}

/* ===== Layout ===== */
.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    background: linear-gradient(180deg, rgba(22,30,46,0.9) 0%, rgba(10,15,26,0) 100%);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
}

.header h1 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-teal) 50%, var(--accent-blue) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
}

.header .subtitle {
    color: var(--text-secondary);
    font-size: clamp(0.875rem, 2vw, 1rem);
    font-weight: 400;
}

.search-container {
    max-width: 1400px;
    margin: clamp(16px, 3vw, 24px) auto;
    padding: 0 clamp(16px, 4vw, 32px);
    width: 100%;
}

.search-wrapper {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
}

.search-input {
    width: 100%;
    padding: 14px 20px 14px 52px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    color: var(--text-primary);
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
}

.search-input:focus {
    outline: none;
    border-color: var(--accent-cyan);
    box-shadow: var(--shadow-md), 0 0 0 3px rgba(25,167,206,0.15);
}

.search-input::placeholder { color: var(--text-muted); }

.search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    transition: var(--transition);
}

.search-input:focus + .search-icon { color: var(--accent-cyan); }

.results-count {
    text-align: center;
    padding: 8px 16px;
    color: var(--text-secondary);
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
}

.games-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: clamp(12px, 2vw, 16px);
    padding: clamp(12px, 2vw, 16px) clamp(16px, 4vw, 32px);
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
}

/* ===== Game Card ===== */
.game-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: var(--transition);
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
}

.game-card:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: var(--accent-cyan);
    box-shadow: var(--shadow-lg);
    z-index: 10;
}

.game-card:active { transform: translateY(-2px) scale(1.01); }

.game-card:focus-visible {
    outline: none;
    border-color: var(--accent-cyan);
    box-shadow: var(--shadow-md), 0 0 0 3px rgba(25,167,206,0.2);
}

/* SailfishOS-style leaf icon */
.game-icon {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--icon-bg, var(--bg-secondary));
    overflow: hidden;
}

.game-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
    pointer-events: none;
}

.leaf-icon {
    width: 70%;
    height: 70%;
    position: relative;
    transform-origin: center;
}

/* Leaf shape using clip-path - SailfishOS style */
.leaf-icon svg {
    width: 100%;
    height: 100%;
    display: block;
}

.leaf-shape {
    fill: var(--icon-fg, #fff);
    opacity: 0.95;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}

/* Accent dot */
.leaf-accent {
    fill: var(--icon-accent, rgba(176,58,107,0.9));
}

/* Rotation for even-indexed cards */
.game-card:nth-child(2n) .leaf-icon {
    transform: rotate(90deg);
}

/* Card content */
.card-content {
    padding: 14px 12px 12px;
    text-align: center;
    flex-shrink: 0;
}

.card-title {
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--text-primary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.01em;
}

/* Loading state */
.game-card.loading .leaf-shape {
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* No results */
.no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}

.no-results svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
.no-results p { font-size: 1rem; }

/* Footer */
.footer {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border-color);
    background: var(--bg-secondary);
}

/* ===== Responsive Breakpoints ===== */
@media (max-width: 640px) {
    .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px 12px;
    }
    .card-title { font-size: 0.72rem; }
    .card-content { padding: 10px 8px 8px; }
    .search-input { padding: 12px 16px 12px 44px; font-size: 16px; }
}

@media (min-width: 641px) and (max-width: 1024px) {
    .games-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 1025px) and (max-width: 1440px) {
    .games-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1441px) and (max-width: 1920px) {
    .games-grid { grid-template-columns: repeat(5, 1fr); }
}

@media (min-width: 1921px) {
    .games-grid { grid-template-columns: repeat(6, 1fr); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    .game-card:hover { transform: none; }
}

/* High contrast mode */
@media (prefers-contrast: high) {
    :root {
        --border-color: #4a5a72;
        --text-secondary: #cbd5e1;
    }
    .game-card { border-width: 2px; }
    .game-card:hover { border-color: var(--accent-yellow); }
}

/* Print styles */
@media print {
    .header, .search-container, .footer { display: none; }
    .games-grid { gap: 8px; }
    .game-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
}
</style>

// Remove duplicates based on file
const uniqueGames = [];
const seenFiles = new Set();
for (const game of games) {
    if (!seenFiles.has(game.file)) {
        seenFiles.add(game.file);
        uniqueGames.push(game);
    }
}

// ===== Color Palettes for Icons =====
const colorPalettes = [
    { bg: 'linear-gradient(135deg, #0E7C8C 0%, #15966B 100%)', fg: '#FFFFFF', accent: '#B03A6B' },
    { bg: 'linear-gradient(135deg, #19A7CE 0%, #2EBD85 100%)', fg: '#FFFFFF', accent: '#F0544F' },
    { bg: 'linear-gradient(135deg, #4FC3F7 0%, #19A7CE 100%)', fg: '#FFFFFF', accent: '#F59B23' },
    { bg: 'linear-gradient(135deg, #2EBD85 0%, #15966B 100%)', fg: '#FFFFFF', accent: '#FFD34E' },
    { bg: 'linear-gradient(135deg, #15966B 0%, #0E7C8C 100%)', fg: '#FFFFFF', accent: '#C56CD6' },
    { bg: 'linear-gradient(135deg, #0E7C8C 0%, #19A7CE 100%)', fg: '#F5F7F7', accent: '#B03A6B' },
    { bg: 'linear-gradient(135deg, #19A7CE 0%, #4FC3F7 100%)', fg: '#FFFFFF', accent: '#F0544F' },

    { bg: 'linear-gradient(135deg, #F59B23 0%, #FFD34E 100%)', fg: '#111827', accent: '#0E7C8C' },
    { bg: 'linear-gradient(135deg, #4FC3F7 0%, #2EBD85 100%)', fg: '#FFFFFF', accent: '#C56CD6' },

// SailfishOS-style leaf SVG path
// Based on the described shape: square with rounded corners, circle from center with radius = half square side,
// keeping only top-left and bottom-right arcs, forming a leaf shape
const leafSVG = (fg, accent) => `
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="leafClip">
            <path d="M50,0 C50,0 50,0 50,0
                Q100,0 100,50
                Q100,100 50,100
                Q0,100 0,50
                Q0,0 50,0 Z
                M50,50
                A50,50 0 0 1 100,100
                A50,50 0 0 1 50,50
                M50,50
                A50,50 0 0 0 0,0
                A50,50 0 0 0 50,50
                Z" fill-rule="evenodd"/>
        </clipPath>
    </defs>
    <!-- Background circle for the leaf shape -->
    <circle cx="50" cy="50" r="50" fill="${fg}" fill-opacity="0.95" clip-path="url(#leafClip)"/>
    <!-- Accent dots - 3 dots like SailfishOS style -->
    <g fill="${accent}" fill-opacity="0.9">
        <circle cx="30" cy="30" r="4"/>
        <circle cx="42" cy="22" r="3"/>
        <circle cx="22" cy="42" r="3"/>
    </g>
    <!-- Subtle highlight -->
    <ellipse cx="35" cy="35" rx="15" ry="8" fill="#FFFFFF" fill-opacity="0.1" transform="rotate(-45 35 35)"/>
</svg>
`;

// Alternative simpler leaf shape that matches the description better
const leafSVG2 = (fg, accent) => `
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="leafClip2">
            <!-- Square with rounded corners (squircle-like), then circle from center radius=50,
                 keeping only top-left and bottom-right quadrants -->
            <path fill-rule="evenodd" d="
                M 10 0
                L 90 0
                Q 100 0 100 10
                L 100 90
                Q 100 100 90 100
                L 10 100
                Q 0 100 0 90
                L 0 10
                Q 0 0 10 0
                Z
                M 50 50
                A 50 50 0 0 1 100 100

                Z
            "/>

    <rect x="0" y="0" width="100" height="100" fill="${fg}" fill-opacity="0.95" clip-path="url(#leafClip2)"/>

`;

// Even simpler and more reliable leaf shape
const createLeafSVG = (fg, accent, index) => {
    // Use a more straightforward approach: the leaf shape as described
    // Square container, circle from center with radius = half side (50)
    // Keep only top-left and bottom-right arcs
    const rotation = index % 2 === 1 ? 'rotate(90 50 50)' : '';
    return `
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="leafClip${index}">
            <path fill-rule="evenodd" d="
                M 12 0
                L 88 0
                C 94.6 0 100 5.4 100 12
                L 100 88
                C 100 94.6 94.6 100 88 100
                L 12 100
                C 5.4 100 0 94.6 0 88
                L 0 12
                C 0 5.4 5.4 0 12 0
                Z
                M 50 50
                A 50 50 0 0 1 100 100
                L 100 100
                A 50 50 0 0 1 50 50
                Z
                M 50 50
                A 50 50 0 0 0 0 0
                L 0 0
                A 50 50 0 0 0 50 50
                Z
            "/>
        </clipPath>
    </defs>
    <g transform="${rotation}">
        <rect x="0" y="0" width="100" height="100" fill="${fg}" fill-opacity="0.95" clip-path="url(#leafClip${index})"/>
        <g fill="${accent}" fill-opacity="0.95">
            <circle cx="28" cy="28" r="5"/>
            <circle cx="42" cy="20" r="3.5"/>
            <circle cx="20" cy="42" r="3.5"/>
        </g>
        <ellipse cx="32" cy="32" rx="18" ry="10" fill="#FFFFFF" fill-opacity="0.12" transform="rotate(-45 32 32)"/>
    </g>
</svg>
`;
};

// ===== DOM Elements =====
const grid = document.getElementById('gamesGrid');
const searchInput = document.getElementById('searchInput');
const resultsCount = document.getElementById('resultsCount');

// ===== Render Functions =====
function renderGames(filteredGames) {
    grid.innerHTML = '';
    
    if (filteredGames.length === 0) {
        grid.innerHTML = `
            <div class="no-results" role="status" aria-live="polite">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="9" y1="9" x2="13" y2="13"></line>
                    <line x1="13" y1="9" x2="9" y2="13"></line>
                </svg>
                <p>未找到匹配的游戏</p>
            </div>
        `;
        resultsCount.textContent = `显示 0 / ${uniqueGames.length} 款游戏`;
        return;
    }
    
    resultsCount.textContent = `显示 ${filteredGames.length} / ${uniqueGames.length} 款游戏`;
    
    const fragment = document.createDocumentFragment();
    
    filteredGames.forEach((game, index) => {
        const palette = colorPalettes[index % colorPalettes.length];
        const card = document.createElement('article');
        card.className = 'game-card';
        card.setAttribute('role', 'listitem');
        card.setAttribute('tabindex', '0');
        card.dataset.title = game.title.toLowerCase();
        card.dataset.file = game.file;
        
        // Generate leaf icon SVG
        const leafSvg = createLeafSVG(palette.fg, palette.accent, index);
        
        card.innerHTML = `
            <div class="game-icon" style="background: ${palette.bg};" aria-hidden="true">
                <div class="leaf-icon">${leafSvg}</div>
            </div>
            <div class="card-content">
                <h2 class="card-title">${escapeHtml(game.title)}</h2>
            </div>
        `;
        
        // Click/keyboard handler
        const openGame = () => {
            window.location.href = '/games-web/' + game.file;
        };
        
        card.addEventListener('click', openGame);
        card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openGame();
            }
        });
        
        fragment.appendChild(card);
    });
    
    grid.appendChild(fragment);
}

// ===== Search Functionality =====
let searchTimeout = null;
searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const query = e.target.value.trim().toLowerCase();
        if (query === '') {
            renderGames(uniqueGames);
        } else {
            const filtered = uniqueGames.filter(game => 
                game.title.toLowerCase().includes(query) ||
                game.file.toLowerCase().includes(query)
            );
            renderGames(filtered);
        }
    }, 80);
});

// ===== Utility =====
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ===== Initial Render =====
renderGames(uniqueGames);

// ===== Keyboard Navigation Enhancement =====
document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
    }
    if (e.key === 'Escape') {
        searchInput.blur();
        searchInput.value = '';
        renderGames(uniqueGames);
    }
});

// Focus search on load for better UX
// searchInput.focus(); // Commented out to not steal focus immediately

// Performance: IntersectionObserver for lazy initialization if needed
if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.remove('loading');
            }
        });
    }, { rootMargin: '100px' });
    
    // Re-observe after render
    const observeCards = () => {
        document.querySelectorAll('.game-card').forEach(card => observer.observe(card));
    };
    
    // Initial observe
    setTimeout(observeCards, 0);
    
    // Re-observe after search
    const originalRender = renderGames;
    renderGames = function(games) {
        originalRender(games);
        setTimeout(observeCards, 0);
    };
}
</script>
