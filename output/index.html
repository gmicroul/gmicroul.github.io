<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Harbor · HTML5 游戏大厅</title>
<style>
  :root{
    --bg0:#0b1c26; --bg1:#102836; --panel:#14303f;
    --text:#eef6f8; --muted:#8fb3bf; --accent:#19A7CE;
    --radius:18px;
    --shadow:0 10px 30px rgba(20,40,60,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,195,247,.12), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(46,189,133,.10), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1));
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}

  header{
    position:sticky;top:0;z-index:10;
    backdrop-filter:blur(14px);
    background:rgba(11,28,38,.72);
    border-bottom:1px solid rgba(79,195,247,.14);
  }
  .bar{
    max-width:1280px;margin:0 auto;padding:16px 20px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .mark{
    width:42px;height:42px;flex:none;
    border-radius:50% 0 50% 0;             /* leaf 母形：左上/右下圆弧，右上/左下直角 */
    background:linear-gradient(135deg,#4FC3F7,#0E7C8C);
    box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .brand .mark::after{                     /* 负形播放符号 */
    content:"";position:absolute;left:16px;top:11px;
    border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;
  }
  .brand h1{font-size:20px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:2px}

  .search{
    flex:1 1 260px;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(79,195,247,.22);
    border-radius:999px;padding:10px 18px;
    transition:border-color .2s, box-shadow .2s;
  }
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,167,206,.18)}
  .search svg{flex:none;opacity:.7}
  .search input{
    flex:1;min-width:0;background:none;border:none;outline:none;
    color:var(--text);font-size:15px;
  }
  .search input::placeholder{color:var(--muted)}
  .count{
    font-size:13px;color:var(--muted);white-space:nowrap;
    background:rgba(25,167,206,.12);border:1px solid rgba(25,167,206,.3);
    padding:6px 14px;border-radius:999px;
  }
  .count b{color:#4FC3F7;font-size:15px}

  main{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
  .grid{
    display:grid;gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  }
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
    main{padding:20px 14px 48px}
  }

  .card{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:20px 10px 16px;cursor:pointer;
    background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid rgba(79,195,247,.10);
    border-radius:var(--radius);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s;
  }
  .card:hover{transform:translateY(-5px);border-color:rgba(79,195,247,.45);box-shadow:var(--shadow)}
  .card:active{transform:translateY(-1px) scale(.98)}

  /* ===== Sailfish 风格叶片图标 =====
     母形：正方形半径画弧，只保留左上+右下弧线，右上+左下为直角；
     负形白色字母符号；同色系 135deg 渐变（光源左上）；统一柔和投影。 */
  .icon{
    width:76px;height:76px;position:relative;
    filter:drop-shadow(0 6px 12px rgba(20,40,60,.25));
  }
  @media (max-width:520px){.icon{width:62px;height:62px}}
  .icon .shape{
    position:absolute;inset:0;overflow:hidden;
    border-radius:50% 0 50% 0;
    display:flex;align-items:center;justify-content:center;
  }
  .icon.rot .shape{transform:rotate(90deg)}       /* 双数卡片旋转 90° */
  .icon .shape::before{                            /* 左上小面积高光叠层 */
    content:"";position:absolute;left:-18%;top:-18%;width:60%;height:60%;
    background:rgba(255,255,255,.22);border-radius:50%;
  }
  .icon .glyph{
    font-size:34px;font-weight:800;color:#fff;line-height:1;
    text-shadow:0 2px 6px rgba(20,40,60,.25);
    user-select:none;
  }
  .icon.rot .glyph{transform:rotate(-90deg)}       /* 字母保持正向 */
  @media (max-width:520px){.icon .glyph{font-size:27px}}

  .name{
    font-size:13.5px;font-weight:600;text-align:center;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.7em;word-break:break-word;
  }

  .empty{
    display:none;text-align:center;padding:80px 20px;color:var(--muted);
  }
  .empty .big{font-size:44px;margin-bottom:12px}
  footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;letter-spacing:1px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <div class="mark"></div>
      <h1>Game Harbor<small>HTML5 GAMES LOBBY</small></h1>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fb3bf" stroke-width="2.4" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      <input id="q" type="search" placeholder="搜索游戏…" autocomplete="off">
    </label>
    <div class="count">共 <b id="total">0</b> 款 · 显示 <b id="shown">0</b> 款</div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="big">🎮</div>
    <div>没有找到匹配的游戏，换个关键词试试</div>
  </div>
</main>

<footer>GAME HARBOR · 点击卡片即开即玩</footer>

var grid = document.getElementById('grid');
var q = document.getElementById('q');
var totalEl = document.getElementById('total');
var shownEl = document.getElementById('shown');
var emptyEl = document.getElementById('empty');

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cardHTML(g){
  return '<a class="card" href="' + g.u + '" title="' + esc(g.n) + '">' +
    '<div class="icon' + (g.r ? ' rot' : '') + '">' +
      '<div class="shape" style="background:linear-gradient(135deg,' + g.c1 + ',' + g.c2 + ')">' +
        '<span class="glyph">' + esc(g.l) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="name">' + esc(g.n) + '</div>' +
  '</a>';
}

function render(list){
  grid.innerHTML = list.map(cardHTML).join('');
  shownEl.textContent = list.length;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

totalEl.textContent = GAMES.length;
render(GAMES);

q.addEventListener('input', function(){
  var kw = q.value.trim().toLowerCase();
  if(!kw){ render(GAMES); return; }
  render(GAMES.filter(function(g){ return g.n.toLowerCase().indexOf(kw) !== -1; }));
});
