<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#101a2e; --panel:#141f36; --text:#eaf2ff; --muted:#8fa3c7;
    --accent:#4fc3f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1b2c4d 0%, var(--bg) 55%) fixed, var(--bg);
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(11,18,32,.82); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.06);
    padding:14px 20px;
  }
  .bar{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:1.25rem;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  h1 .dot{color:var(--accent)}
  .stats{font-size:.85rem;color:var(--muted);white-space:nowrap}
  .searchwrap{flex:1;min-width:200px;display:flex}
  #search{
    width:100%;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.12);
    background:var(--panel);color:var(--text);font-size:.95rem;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.18)}
  #search::placeholder{color:var(--muted)}
  main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
  .grid{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  }
  @media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px}}
  @media (min-width:1024px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px}}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    text-decoration:none;color:var(--text);cursor:pointer;
    transition:transform .16s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.03)}
  .card:active{transform:scale(.97)}
  /* SailfishOS-style icon: rounded-square, glassy gradient, top highlight */
  .icon{
    width:100%;aspect-ratio:1/1;max-width:96px;border-radius:26%;
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .icon::before{ /* glass sheen */
    content:"";position:absolute;left:0;right:0;top:0;height:52%;
    background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.02));
    border-radius:0 0 50% 50%/0 0 26% 26%;
  }
  .icon::after{ /* bottom vignette */
    content:"";position:absolute;left:0;right:0;bottom:0;height:45%;
    background:linear-gradient(0deg,rgba(0,0,0,.22),transparent);
  }
  .icon .glyph{
    position:relative;z-index:1;
    font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem);
    color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);
    user-select:none;
  }
  .label{
    font-size:.82rem;line-height:1.25;text-align:center;color:var(--text);
    max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    word-break:break-word;
  }
  .card:hover .label{color:var(--accent)}
  #empty{display:none;text-align:center;color:var(--muted);padding:60px 0;font-size:1rem}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 20px 30px}
</style>
</head>

    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="empty">没有找到匹配的游戏</div>
</main>
<footer>共 <span id="total"></span> 款游戏 · 点击图标开始游戏</footer>

function hashHue(s){
  var h=0;
  for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  return h%360;
}
function iconStyle(name){
  var h=hashHue(name);
  var h2=(h+40)%360;
  return "background:linear-gradient(160deg,hsl("+h+",72%,58%) 0%,hsl("+h2+",68%,38%) 100%);";
}
function glyphFor(name){
  var m=name.match(/[A-Za-z0-9\u4e00-\u9fff]/);
  return m?m[0].toUpperCase():"?";
}

var grid=document.getElementById("grid"),
    search=document.getElementById("search"),
    stats=document.getElementById("stats"),
    empty=document.getElementById("empty");

document.getElementById("total").textContent=GAMES.length;

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(list){
  var out="";
  for(var i=0;i<list.length;i++){
    var g=list[i];
    out+='<a class="card" href="/games-web/'+encodeURIComponent(g.file)+'">'
       + '<div class="icon" style="'+iconStyle(g.name)+'"><span class="glyph">'+esc(glyphFor(g.name))+"</span></div>"
       + '<div class="label">'+esc(g.name)+"</div></a>";
  }
  grid.innerHTML=out;
  stats.textContent="共 "+list.length+" / "+GAMES.length+" 款游戏";
  empty.style.display=list.length?"none":"block";
}

function filter(){
  var q=search.value.trim().toLowerCase();
  if(!q){render(GAMES);return;}
  render(GAMES.filter(function(g){return g.name.toLowerCase().indexOf(q)!==-1;}));
}

search.addEventListener("input",filter);
render(GAMES);
