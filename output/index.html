<title>游戏大厅</title>
<style>
:root {
  --bg: #0a0f14;
  --bg-elevated: #111820;
  --card-bg: #151d28;
  --card-border: #1e2a3a;
  --text: #e8edf2;
  --text-muted: #8b98a8;
  --accent: #19a7ce;
  --accent-glow: rgba(25, 167, 206, 0.4);
  --coral: #f0544f;
  --orange: #f59b23;
  --yellow: #ffd34e;
  --green: #2ebd85;
  --purple: #c56cd6;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(25, 167, 206, 0.2);
  --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
  50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(25, 167, 206, 0.2); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

html { font-size: 16px; -webkit-font-smoothing: antialiased; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(25, 167, 206, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(46, 189, 133, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(197, 108, 214, 0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

header {
  position: relative;
  z-index: 10;
  padding: clamp(24px, 4vw, 40px) clamp(16px, 4vw, 32px);
  text-align: center;
  border-bottom: 1px solid var(--card-border);
  background: linear-gradient(180deg, rgba(17, 24, 32, 0.95), rgba(17, 24, 32, 0.7));
  backdrop-filter: blur(20px);
}

header h1 {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  animation: fadeInUp 0.6s ease-out;
}

header p {
  color: var(--text-muted);
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  animation: fadeInUp 0.6s ease-out 0.1s both;
}

.search-wrapper {
  position: relative;
  z-index: 10;
  max-width: 560px;
  margin: clamp(16px, 3vw, 24px) auto 0;
  animation: fadeInUp 0.6s ease-out 0.2s both;
}

.search-wrapper::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50px;
  background: linear-gradient(135deg, var(--accent), var(--purple), var(--green));
  opacity: 0;
  transition: opacity var(--transition);
  z-index: -1;
  filter: blur(12px);
}

.search-wrapper:focus-within::before {
  opacity: 0.3;
  animation: pulseGlow 3s ease-in-out infinite;
}

#search {
  width: 100%;
  padding: 14px 20px 14px 52px;
  font-size: 1rem;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 50px;
  color: var(--text);
  outline: none;
  transition: all var(--transition);
}

#search::placeholder { color: var(--text-muted); opacity: 0.7; }

#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3);
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--text-muted);
  stroke-width: 2;
  pointer-events: none;
  transition: stroke var(--transition);
}

#search:focus + .search-icon { stroke: var(--accent); }

.stats {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: clamp(16px, 3vw, 32px);
  margin-top: clamp(16px, 3vw, 24px);
  padding: 0 clamp(16px, 4vw, 32px);
  animation: fadeInUp 0.6s ease-out 0.3s both;
}

.stat-item {
  text-align: center;
  padding: 12px 20px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  min-width: 100px;
  transition: all var(--transition);
}

.stat-item:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

.stat-value {
  display: block;
  font-size: clamp(1.4rem, 3vw, 2rem);
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 4px;
}

main {
  position: relative;
  z-index: 5;
  padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 32px);
  max-width: 1600px;
  margin: 0 auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: clamp(12px, 2vw, 20px);
}

.grid:empty::after {
  content: '未找到匹配的游戏';
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 1.1rem;
}

.card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  animation: fadeInUp 0.5s ease-out both;
  transition: all var(--transition);
  will-change: transform, box-shadow, border-color;
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: var(--accent);
  box-shadow: var(--shadow-hover);
  z-index: 10;
}

.card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.2), var(--shadow);
}

.icon-wrapper {
  position: relative;
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--icon-from), var(--icon-to));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.icon-wrapper::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg,
    rgba(255,255,255,0.15) 0%,
    rgba(255,255,255,0.05) 30%,
    rgba(0,0,0,0.1) 70%,
    rgba(0,0,0,0.25) 100%);
  pointer-events: none;
}

.icon-wrapper::after {
  content: '';
  position: absolute;
  inset: -50%;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.2) 0%, transparent 60%);
  pointer-events: none;
  opacity: 0.5;
}

.icon-svg {
  width: 62%;
  height: 62%;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  transition: transform var(--transition);
}

.card:hover .icon-svg { transform: scale(1.08) rotate(2deg); }

.icon-letter {
  font-size: clamp(2.5rem, 8vw, 4rem);
  font-weight: 800;
  color: #fff;
  text-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
  font-family: 'Segoe UI', 'PingFang SC', sans-serif;
  letter-spacing: -0.02em;
  transition: transform var(--transition);
}

.card:hover .icon-letter { transform: scale(1.1); }

.card-content {
  padding: clamp(12px, 2vw, 16px);
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.card-title {
  font-size: clamp(0.85rem, 1.8vw, 0.95rem);
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text);
}

.card-url {
  font-size: 0.65rem;
  color: var(--text-muted);
  opacity: 0.7;
  font-family: monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent), transparent 60%);
  opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
}

.card:hover::after { opacity: 0.08; }

footer {
  position: relative;
  z-index: 10;
  padding: clamp(24px, 4vw, 40px) clamp(16px, 4vw, 32px);
  text-align: center;
  border-top: 1px solid var(--card-border);
  background: linear-gradient(0deg, rgba(10, 15, 20, 0.95), rgba(17, 24, 32, 0.8));
  backdrop-filter: blur(20px);
}

footer p {
  color: var(--text-muted);
  font-size: 0.85rem;
}

footer a {
  color: var(--accent);
  text-decoration: none;
  transition: color var(--transition);
}

footer a:hover { color: var(--green); text-decoration: underline; }

.hidden { display: none !important; }

@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .icon-svg { width: 58%; height: 58%; }
  .stat-item { min-width: 80px; padding: 10px 14px; }
}

@media (min-width: 641px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
}

@media (min-width: 1025px) and (max-width: 1440px) {
  .grid { grid-template-columns: repeat(5, 1fr); gap: 14px; }
}

@media (min-width: 1441px) {
  .grid { grid-template-columns: repeat(7, 1fr); gap: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  header { padding: 20px 16px; }
  main { padding: 16px; }
  .stats { gap: 12px; }
  .stat-item { min-width: 70px; padding: 8px 12px; }
}
</style>

// 生成首字母
function getInitial(title) {
  const match = title.match(/([A-Za-z\u4e00-\u9fa5])/);
  return match ? match[1].toUpperCase() : '?';
}

// 为每个游戏分配确定性的图标样式
function assignIconStyle(game, index) {
  const palette = iconPalettes[index % iconPalettes.length];
  const shape = iconShapes[index % iconShapes.length];
  const initial = getInitial(game.title);
  return { palette, shape, initial };
}

// 渲染游戏网格
const grid = document.getElementById('grid');
const totalCount = document.getElementById('total-count');
const visibleCount = document.getElementById('visible-count');
const searchInput = document.getElementById('search');

totalCount.textContent = games.length;

function renderGames(filter = '') {
  grid.innerHTML = '';
  let visible = 0;

  games.forEach((game, index) => {
    const title = game.title.toLowerCase();
    const query = filter.toLowerCase();
    if (query && !title.includes(query)) return;

    visible++;
    const { palette, shape, initial } = assignIconStyle(game, index);
    const delay = Math.min(visible * 30, 600);

    const card = document.createElement('a');
    card.className = 'card';
    card.href = game.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.style.setProperty('--icon-from', palette.from);
    card.style.setProperty('--icon-to', palette.to);
    card.style.animationDelay = `${delay}ms`;

    // 判断是否使用 SVG 还是首字母
    const useLetter = index % 3 === 0; // 1/3 使用首字母，增加多样性

    card.innerHTML = `
      <div class="icon-wrapper" aria-hidden="true">
        ${useLetter ? `<span class="icon-letter">${initial}</span>` : `<div class="icon-svg" style="color:${palette.from}">${shape}</div>`}
      </div>
      <div class="card-content">
        <span class="card-title">${game.title}</span>
        <span class="card-url">${game.url}</span>
      </div>
    `;
    grid.appendChild(card);
  });

  visibleCount.textContent = visible;
  grid.classList.toggle('hidden', visible === 0);
}

renderGames();

// 搜索过滤（防抖）
let searchTimeout;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => renderGames(e.target.value), 80);
});

// 键盘快捷键：/ 聚焦搜索框
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
    searchInput.value = '';
    renderGames('');
  }
});

// 入口动画错开
document.querySelectorAll('.card').forEach((card, i) => {
  card.style.animationDelay = `${Math.min(i * 20, 500)}ms`;
});
</script>
