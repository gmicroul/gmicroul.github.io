        // 渲染函数
        function renderNews(containerId, newsArray) {
            const container = document.getElementById(containerId);
            container.innerHTML = newsArray.map(item => `
                <article class="news-card">
                    <div class="news-meta">
                        <span class="news-date">${formatDate(item.date)}</span>
                        <span class="news-source">${item.source}</span>
                        <span class="news-category">${item.category}</span>
                        <span class="badge-${item.badge}">${getBadgeText(item.badge)}</span>
                    </div>
                    <h2 class="news-title">${escapeHtml(item.title)}</h2>
                    <p class="news-summary">${escapeHtml(item.summary)}</p>
                    <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="news-link">
                        阅读原文
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                </article>
            `).join('');
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${m}月${parseInt(d, 10)}日`;
        }

        function getBadgeText(badge) {
            const map = { 'new': '新发布', 'update': '更新', 'announce': '公告' };
            return map[badge] || badge;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 初始化渲染
        renderNews('news-latest', newsData.latest);
        renderNews('news-updates', newsData.updates);
        renderNews('news-ecosystem', newsData.ecosystem);
        renderNews('news-dev', newsData.dev);
        renderNews('news-community', newsData.community);

        // 响应式：桌面端使用网格布局
        if (window.innerWidth >= 768) {
            document.querySelectorAll('.news-list').forEach(list => {
                list.classList.add('news-grid');
            });
        }
    </script>
