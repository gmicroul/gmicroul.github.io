<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --bg1:#041218; --bg2:#082430; --bg3:#0C3642;
    --card:#0E2D3A; --card-hover:#144A5C; --card-active:#1A5E73;
    --text:#E8F4F8; --dim:#8AB4BE; --dim2:#6A9AA6;
    --accent:#4FC3F7; --accent2:#2EBD85; --accent3:#19A7CE;
    --warm1:#F0544F; --warm2:#F59B23; --warm3:#FFD34E;
    --purple1:#C56CD6; --purple2:#E85D9E;
    --shadow:rgba(14,28,40,0.45); --shadow-strong:rgba(10,20,30,0.65);
    --glass:rgba(255,255,255,0.06); --glass-strong:rgba(255,255,255,0.12);
    --border:rgba(79,195,247,0.12); --border-hover:rgba(79,195,247,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
  }
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79,195,247,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(46,189,133,0.05) 0%, transparent 55%),
      linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
    line-height:1.5;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(4,18,24,0.88);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
  }
  .bar{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:.5px;flex-shrink:0}
  .logo svg{width:38px;height:38px;flex:none}
  .logo em{font-style:normal;background:linear-gradient(130deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:13px;color:var(--dim);background:var(--glass);border:1px solid var(--border);padding:4px 14px;border-radius:999px;white-space:nowrap;font-weight:600;flex-shrink:0}
  .search{flex:1;min-width:200px;max-width:480px;position:relative}
  .search input{
    width:100%;padding:11px 18px 11px 44px;border-radius:999px;
    border:1px solid var(--border);background:rgba(14,45,58,0.9);
    color:var(--text);font-size:15px;outline:none;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,195,247,0.18);background:rgba(14,45,58,1)}
  .search input::placeholder{color:var(--dim2)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--dim2);fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none;transition:stroke .2s}
  .search input:focus + svg{stroke:var(--accent)}
  main{max-width:1360px;margin:0 auto;padding:28px 20px 80px}
  .grid{display:grid;gap:16px 12px;grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}
  @media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:20px 16px}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:24px 20px}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:28px 24px}}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:18px 10px 16px;border-radius:20px;text-decoration:none;color:var(--text);
    background:linear-gradient(150deg,rgba(20,60,76,0.6),rgba(10,42,54,0.65));
    border:1px solid var(--border);
    transition:transform .22s cubic-bezier(.2,.7,.3,1),background .22s ease,border-color .22s ease,box-shadow .22s ease;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:20px;
    background:linear-gradient(135deg,rgba(255,255,255,0.04) 0%,transparent 50%);
    opacity:0;transition:opacity .22s ease;pointer-events:none;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-6px) scale(1.02);
    background:linear-gradient(150deg,rgba(28,85,105,0.85),rgba(16,60,78,0.9));
    border-color:var(--border-hover);
    box-shadow:0 18px 40px var(--shadow-strong),0 6px 16px var(--shadow);
    outline:none;z-index:5;
  }
  .card:hover::before,.card:focus-visible::before{opacity:1}
  .icon{width:76%;max-width:128px;aspect-ratio:1/1;filter:drop-shadow(0 10px 22px var(--shadow));transition:filter .22s ease,transform .22s ease}
  .card:hover .icon{filter:drop-shadow(0 16px 32px var(--shadow-strong));transform:scale(1.05)}
  .name{
    font-size:13.5px;font-weight:600;text-align:center;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:2.7em;max-width:100%;
    letter-spacing:0.01em;
  }
  .empty{display:none;text-align:center;color:var(--dim);padding:80px 20px;font-size:16px}
  .empty svg{width:64px;height:64px;margin-bottom:16px;stroke:var(--dim2);fill:none;stroke-width:1.5}
  footer{text-align:center;color:var(--dim2);font-size:12px;padding:20px 0 40px;opacity:.7;letter-spacing:0.02em}
  @media(max-width:480px){
    header{padding:12px 16px}
    .logo{font-size:19px}
    .logo svg{width:34px;height:34px}
    .search{min-width:0;max-width:none;margin-left:0;width:100%;order:3}
    .bar{gap:10px}
    main{padding:20px 16px 60px}
    .card{padding:16px 8px 14px;border-radius:18px;gap:8px}
    .name{font-size:12.5px;min-height:2.5em}
  }
</style>
</head>

/* SailfishOS leaf: square side 512, radius = side (512), 1/8-circle (45 deg) arcs
   cutting TL & BR corners; BL & TR are sharp right-angle corners. */
const LEAF = "M277.1 0 L512 0 L512 234.9 A512 512 0 0 0 234.9 512 L0 512 L0 277.1 A512 512 0 0 0 277.1 0 Z";

/* Ocean palette (>=60% of set) + sparse warm accents */
const PALETTE = [
  {a:"#2FA8C9", b:"#0E7C8C"},   // deep teal -> teal
  {a:"#4FC3F7", b:"#19A7CE"},   // sky -> cyan
  {a:"#7FD6FB", b:"#4FC3F7"},   // pale sky -> sky
  {a:"#4EDCA0", b:"#2EBD85"},   // mint -> sea green
  {a:"#2EBD85", b:"#15966B"},   // sea green -> deep green
  {a:"#2FA8C9", b:"#0E7C8C"},
  {a:"#4FC3F7", b:"#19A7CE"},
  {a:"#4EDCA0", b:"#2EBD85"},
  {a:"#FB8A7E", b:"#F0544F"},   // coral
  {a:"#FDB95F", b:"#F59B23"},   // orange
  {a:"#FFE083", b:"#FFD34E"},   // yellow
  {a:"#C56CD6", b:"#E85D9E"}    // purple-pink gradient
];

function hash(s){
  var h=0,i;
  for(i=0;i<s.length;i++){
    h=(h*31+s.charCodeAt(i))>>>0;
  }
  return h;
}

function letter(name){
  var m=/[A-Za-z0-9\u4e00-\u9fff]/.exec(name);
  return m?m[0].toUpperCase():"?";
}

function iconSVG(g,i){
  var c=PALETTE[hash(g.f)%PALETTE.length];
  var L=letter(g.n);
  var rot=(i%2===1)?" rotate(90 256 256)":"";
  return '<svg viewBox="0 0 512 512" role="img" aria-label="'+g.n.replace(/"/g,'"')+'">'+
    '<defs>'+
    '<linearGradient id="g'+i+'" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0" stop-color="'+c.a+'"/><stop offset="1" stop-color="'+c.b+'"/>'+
    '</linearGradient>'+
    '<mask id="m'+i+'">'+
    '<path d="'+LEAF+'" fill="#fff"/>'+
    '<text x="256" y="256" text-anchor="middle" dominant-baseline="central" '+
    'font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="235" font-weight="800" fill="#000">'+L+'</text>'+
    '</mask>'+
    '<clipPath id="c'+i+'"><path d="'+LEAF+'"/></clipPath>'+
    '</defs>'+
    '<g transform="translate(46 46) scale(0.82)'+rot+'">'+
    '<path d="'+LEAF+'" fill="url(#g'+i+')" mask="url(#m'+i+')"/>'+
    '<g clip-path="url(#c'+i+')">'+
    '<ellipse cx="140" cy="105" rx="180" ry="95" fill="#ffffff" opacity="0.16" transform="rotate(-25 140 105)"/>'+
    '</g>'+
    '</g></svg>';
}

var grid=document.getElementById("grid");
var cards=[];
GAMES.forEach(function(g,i){
  var a=document.createElement("a");
  a.className="card";
  a.href="/games-web/"+encodeURIComponent(g.f);
  a.target="_blank"; a.rel="noopener";
  a.innerHTML='<span class="icon">'+iconSVG(g,i)+'</span><span class="name"></span>';
  a.querySelector(".name").textContent=g.n;
  grid.appendChild(a);
  cards.push({el:a,name:g.n.toLowerCase()});
});

var countEl=document.getElementById("count");
var emptyEl=document.getElementById("empty");
var total=GAMES.length;
function setCount(n){countEl.textContent=n+" / "+total+" 款游戏";}
setCount(total);

var q=document.getElementById("q");
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase(),shown=0;
  cards.forEach(function(c){
    var hit=!v||c.name.indexOf(v)!==-1;
    c.el.style.display=hit?"":"none";
    if(hit)shown++;
  });
  setCount(shown);
  emptyEl.style.display=shown?"none":"block";
});
})();
</script>
