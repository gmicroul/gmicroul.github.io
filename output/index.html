<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅</title>
<style>
:root {
  --bg: #0a0f14;
  --bg-elevated: #111820;
  --fg: #e8ecf1;
  --fg-muted: #8a94a3;
  --accent: #19A7CE;
  --accent-dim: #0E7C8C;
  --warm: #F0544F;
  --card-border: #1e2a36;
  --shadow: rgba(20,40,60,0.25);
  --shadow-strong: rgba(20,40,60,0.4);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.page {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding: clamp(16px, 3vw, 32px);
}

.header {
  text-align: center;
  margin-bottom: clamp(20px, 4vw, 36px);
}

.header h1 {
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  color: var(--fg-muted);
  font-size: clamp(14px, 2.5vw, 16px);
  margin-top: 6px;
}

.search-wrapper {
  position: relative;
  max-width: 560px;
  margin: 0 auto clamp(20px, 4vw, 32px);
}

.search-input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  font-size: 16px;
  border: 2px solid var(--card-border);
  border-radius: 14px;
  background: var(--bg-elevated);
  color: var(--fg);
  transition: var(--transition);
  outline: none;
}

.search-input::placeholder { color: var(--fg-muted); }

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(25,167,206,0.15);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--fg-muted);
  pointer-events: none;
  transition: var(--transition);
}

.search-input:focus + .search-icon { stroke: var(--accent); }

.stats {
  text-align: center;
  color: var(--fg-muted);
  font-size: clamp(13px, 2vw, 15px);
  margin-bottom: clamp(16px, 3vw, 24px);
}

.stats strong { color: var(--accent); font-weight: 600; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: clamp(12px, 2.5vw, 20px);
  flex: 1;
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}

@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: var(--bg-elevated);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: clamp(16px, 3vw, 20px) clamp(12px, 2vw, 16px);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25,167,206,0.08) 0%, transparent 60%);
  opacity: 0;
  transition: var(--transition);
}

.card:hover::before,
.card:focus-visible::before { opacity: 1; }

.card:hover,
.card:focus-visible {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 12px 32px var(--shadow-strong), 0 0 0 1px var(--accent);
}

.card:focus-visible { outline: none; }

.icon-wrapper {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 12px;
  flex-shrink: 0;
  background: var(--icon-bg, var(--accent));
  box-shadow:
    inset 0 -2px 4px rgba(0,0,0,0.15),
    inset 0 2px 4px rgba(255,255,255,0.08),
    0 4px 16px var(--shadow);
}

.icon-wrapper svg {
  width: 78%;
  height: 78%;
  stroke: var(--icon-fg, #fff);
  stroke-width: 7%;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.icon-accent {
  position: absolute;
  width: 18%;
  height: 18%;
  background: var(--accent-color, var(--warm));
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-color, var(--warm));
}

.icon-accent.tl { top: 8%; left: 8%; }
.icon-accent.tr { top: 8%; right: 8%; }
.icon-accent.bl { bottom: 8%; left: 8%; }
.icon-accent.br { bottom: 8%; right: 8%; }

.card-title {
  font-size: clamp(13px, 2.2vw, 15px);
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.card.hidden { display: none; }

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-muted);
}

.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }

.empty-state p { font-size: 16px; }

.footer {
  text-align: center;
  padding: 24px 16px;
  color: var(--fg-muted);
  font-size: 13px;
  border-top: 1px solid var(--card-border);
  margin-top: auto;
}

.footer a { color: var(--accent); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>

  </div>

  <div class="stats" id="stats">共 <strong>224</strong> 款游戏</div>

  <main class="grid" id="grid" role="list"></main>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

</div>

// 确定性伪随机：基于字符串生成稳定索引
function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function getPalette(name) {
  const idx = hashStr(name) % ICON_PALETTES.length;
  return ICON_PALETTES[idx];
}

function getIconSvg(name) {
  const idx = hashStr(name + 'icon') % ICON_SVGS.length;
  return ICON_SVGS[idx];
}

function getAccentPos(name) {
  const positions = ['tl', 'tr', 'bl', 'br'];
  const idx = hashStr(name + 'accent') % positions.length;
  return positions[idx];
}

// 渲染游戏卡片
function renderGames(filter = '') {
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const stats = document.getElementById('stats');
  
  const filtered = GAMES.filter(g => 
    g.title.toLowerCase().includes(filter.toLowerCase())
  );
  
  stats.textContent = `共 ${filtered.length} 款游戏`.replace(filtered.length.toString(), `<strong>${filtered.length}</strong>`);
  
  if (filtered.length === 0) {
    grid.innerHTML = '';
    emptyState.classList.remove('hidden');
    return;
  }
  
  emptyState.classList.add('hidden');
  
  grid.innerHTML = filtered.map(game => {
    const palette = getPalette(game.title);
    const iconSvg = getIconSvg(game.title);
    const accentPos = getAccentPos(game.title);
    
    return `
          <a href="${game.url}" class="card" role="listitem" aria-label="${game.title.replace(/"/g, '"')}">
            <div class="icon-wrapper" style="--icon-bg: ${palette.bg}; --icon-fg: ${palette.fg};">
              ${iconSvg}
              <span class="icon-accent ${accentPos}" style="--accent-color: ${palette.accent};"></span>
            </div>
            <span class="card-title">${game.title.replace(/"/g, '"')}</span>
          </a>
        `;
  }).join('');
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  renderGames();
  
  const searchInput = document.getElementById('searchInput');
  let debounceTimer;
  
  searchInput.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      renderGames(e.target.value);
    }, 80);
  });
  
  // 键盘快捷键：/ 聚焦搜索，Esc 清空
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.value = '';
      searchInput.blur();
      renderGames('');
    }
  });
});
