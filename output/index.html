<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(135deg,#0f3460,#16213e);padding:20px 16px 16px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header h1{font-size:22px;font-weight:600;color:#fff;margin-bottom:12px;text-align:center}
.search-wrap{position:relative;max-width:600px;margin:0 auto}
.search-wrap input{width:100%;padding:12px 16px 12px 40px;border:none;border-radius:12px;background:#1e2a4a;color:#fff;font-size:15px;outline:none}
.search-wrap input::placeholder{color:#6b7db3}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6b7db3;font-size:16px}
.game-count{text-align:center;color:#6b7db3;font-size:13px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:900px;margin:0 auto}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{background:#16213e;border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;color:#e0e0e0}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(233,69,96,.3)}
.card:active{transform:scale(.96)}
.card-icon{width:86px;height:86px;border-radius:0;overflow:hidden;margin-bottom:8px}
.card-icon img{width:100%;height:100%;display:block}
.card-name{font-size:12px;font-weight:500;text-align:center;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.no-results{text-align:center;color:#6b7db3;padding:60px 20px;font-size:15px;display:none}
</style>
</head>

var grid=document.getElementById("grid");
var countEl=document.getElementById("count");
var noResults=document.getElementById("noresults");
var searchEl=document.getElementById("search");

function render(filter){
  filter=(filter||"").toLowerCase().trim();
  var html="";
  var n=0;
  for(var i=0;i<GAMES.length;i++){
    var g=GAMES[i];
    if(filter && g.search.indexOf(filter)===-1) continue;
    html+='<a class="card" href="'+g.file+'"><div class="card-icon"><img src="'+g.icon+'" alt="'+g.name+'" loading="lazy"></div><div class="card-name">'+g.name+'</div></a>';
    n++;
  }
  grid.innerHTML=html;
  countEl.textContent=n+" games";
  noResults.style.display=n===0?"block":"none";
}

searchEl.addEventListener("input",function(){render(this.value)});
render("");
</script>
