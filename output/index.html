<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="游戏大厅 - 免登录在线小游戏合集">
<title>游戏大厅 · Game Hub</title>
<style>

:root{
  --bg1:#06222C; --bg2:#0A3A47;
  --card:#0E3240; --card-hover:#145062;
  --text:#EAF6F8; --dim:#8FB6C0;
  --accent:#4FC3F7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;color:var(--text);min-height:100vh;
}
header{
  position:sticky;top:0;z-index:20;background:rgba(6,34,44,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(79,195,247,.18);padding:14px 20px;
}
.bar{max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{font-size:20px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand em{font-style:normal;background:linear-gradient(120deg,#5FD0F5,#2EBD85);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:12px;color:var(--dim);background:rgba(79,195,247,.10);border:1px solid rgba(79,195,247,.25);padding:3px 11px;border-radius:999px;white-space:nowrap}
.search{
  margin-left:auto;flex:1 1 240px;min-width:200px;position:relative;
}
.search input{
  width:100%;padding:11px 15px;border-radius:12px;border:1px solid rgba(79,195,247,.28);
  background:rgba(14,50,64,.7);color:var(--text);font-size:14px;outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.18)}
.countline{max-width:1160px;margin:14px auto 4px;padding:0 20px;font-size:13px;color:var(--dim)}
.countline b{color:var(--accent)}
main{max-width:1160px;margin:0 auto;padding:18px 20px 60px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
.card{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  text-decoration:none;color:var(--text);
  background:linear-gradient(180deg,rgba(14,50,64,.9),rgba(12,42,54,.9));
  border:1px solid rgba(79,195,247,.14);border-radius:20px;
  padding:11px 6px 9px;transition:transform .18s ease,border-color .18s,background .18s;
}
.card:hover{transform:translateY(-4px);border-color:rgba(79,195,247,.55);background:var(--card-hover)}
.card .tile{
  width:86px;height:86px;border-radius:20px;overflow:hidden;position:relative;
  background:#06222C;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.05);
}
.card .tile svg{width:86px;height:86px;display:block}
.card .glyph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-family:system-ui,sans-serif;font-weight:700;font-size:29px;
  color:#FFFFFF;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.35);
}
.card .nm{
  font-size:12px;line-height:1.25;text-align:center;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  max-width:100%;word-break:break-word;
}
.noresult{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--dim);font-size:14px;display:none}
@media(max-width:420px){
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  main{padding:14px 14px 50px}
  .card{min-height:150px}
}
@media(min-width:800px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .card .tile{width:108px;height:108px}
  .card .tile svg{width:108px;height:108px}
  .card .glyph{font-size:34px}
}
footer{text-align:center;padding:26px 20px 40px;color:var(--dim);font-size:12px}

</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">🎮 <em>游戏大厅</em> · Game Hub</div>
    <div class="badge" id="total">0</div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索游戏…" autocomplete="off" spellcheck="false">
    </div>
  </div>
</header>
<div class="countline">共 <b id="count">0</b> 款游戏</div>
<main>
  <div class="grid" id="grid"></div>
  <div class="noresult" id="nores">没有找到匹配的游戏</div>
</main>
<footer>所有游戏均在本站 games-web 中内嵌运行 · 点击卡片即可游玩</footer>

  var grid = document.getElementById('grid');
  var input = document.getElementById('q');
  var count = document.getElementById('count');
  var total = document.getElementById('total');
  var nores = document.getElementById('nores');
  var cards = [];

  function build(all){
    cards = all.map(function(d){
      var a = document.createElement('a');
      a.className = 'card';
      a.href = d.href;
      a.setAttribute('aria-label', d.name);
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = d.icon;
      var g = document.createElement('div');
      g.className = 'glyph';
      g.textContent = d.letter;
      tile.appendChild(g);
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = d.name;
      nm.title = d.name;
      a.appendChild(tile);
      a.appendChild(nm);
      grid.appendChild(a);
      return {el:a,name:(d.name||'').toLowerCase()};
    });
  }
  build(DATA);
  total.textContent = DATA.length;
  count.textContent = DATA.length;
  nores.style.display = DATA.length ? 'none':'block';

  input.addEventListener('input', function(){
    var q = input.value.trim().toLowerCase();
    var shown = 0;
    for(var i=0;i<cards.length;i++){
      var hit = !q || cards[i].name.indexOf(q) !== -1;
      cards[i].el.style.display = hit ? '' : 'none';
      if(hit) shown++;
    }
    count.textContent = shown;
    nores.style.display = shown ? 'none':'block';
  });
})();

</script>
