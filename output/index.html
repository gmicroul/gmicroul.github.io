<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root {
  --bg-color: #0f0f12;
  --card-bg: #1a1a22;
  --card-border: #2a2a3a;
  --text-primary: #e8e8ed;
  --text-secondary: #9a9ab0;
  --accent: #5FD0F5;
  --accent-hover: #3AA8D0;
  --shadow: rgba(0,0,0,0.4);
  --search-bg: #15151c;
  --search-border: #333344;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg-color: #f5f5f7;
    --card-bg: #ffffff;
    --card-border: #e0e0e5;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #007aff;
    --accent-hover: #0056cc;
    --shadow: rgba(0,0,0,0.1);
    --search-bg: #f0f0f3;
    --search-border: #d1d1d6;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-color);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}

.header {
  padding: 24px 16px;
  text-align: center;
  border-bottom: 1px solid var(--card-border);
  background: linear-gradient(180deg, var(--card-bg) 0%, var(--bg-color) 100%);
}

.header h1 {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #FFB0C4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.header p {
  color: var(--text-secondary);
  font-size: 0.95rem;
}

.search-container {
  padding: 16px;
  max-width: 1200px;
  margin: 0 auto;
}

.search-box {
  position: relative;
  max-width: 600px;
  margin: 0 auto;
}

.search-box svg {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: var(--text-secondary);
  pointer-events: none;
}

.search-box input {
  width: 100%;
  padding: 14px 16px 14px 48px;
  font-size: 1rem;
  border: 1px solid var(--search-border);
  border-radius: 12px;
  background: var(--search-bg);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

.search-box input::placeholder {
  color: var(--text-secondary);
}

.stats {
  text-align: center;
  padding: 8px 16px 16px;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.stats span {
  color: var(--accent);
  font-weight: 600;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
  padding: 0 16px 24px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (min-width: 480px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}

@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
}

@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px var(--shadow);
  border-color: var(--accent);
}

.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon-wrapper {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  background: var(--card-border);
}

.icon-wrapper svg {
  width: 100%;
  height: 100%;
  display: block;
}

.card-content {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.card-meta {
  font-size: 0.7rem;
  color: var(--text-secondary);
}

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}

.empty-state svg {
  width: 64px;
  height: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 1rem;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.card {
  animation: fadeIn 0.3s ease-out backwards;
}

.card:nth-child(1) { animation-delay: 0ms; }
.card:nth-child(2) { animation-delay: 20ms; }
.card:nth-child(3) { animation-delay: 40ms; }
.card:nth-child(4) { animation-delay: 60ms; }
.card:nth-child(5) { animation-delay: 80ms; }
.card:nth-child(6) { animation-delay: 100ms; }
.card:nth-child(7) { animation-delay: 120ms; }
.card:nth-child(8) { animation-delay: 140ms; }
.card:nth-child(9) { animation-delay: 160ms; }
.card:nth-child(10) { animation-delay: 180ms; }
.card:nth-child(11) { animation-delay: 200ms; }
.card:nth-child(12) { animation-delay: 220ms; }

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
}

.footer {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-secondary);
  font-size: 0.8rem;
  border-top: 1px solid var(--card-border);
  background: var(--card-bg);
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}
</style>
</head>

// SailfishOS 风格图标生成器
function generateIconSvg(index, title) {
  const isOdd = (index % 2) === 0; // 0-based: 0,2,4... 是第1,3,5个 -> 奇数
  const firstChar = title.trim().charAt(0).toUpperCase();
  const isIPrefix = firstChar === 'I';
  
  // 渐变 ID
  const gradId = `grad-${index}`;
  const highlightId = `highlight-${index}`;
  
  // 奇数：蓝色系 #5FD0F5 -> #3AA8D0
  // 偶数：粉色系 #FFD8E0 -> #FFB0C4
  const gradStart = isOdd ? '#5FD0F5' : '#FFD8E0';
  const gradEnd = isOdd ? '#3AA8D0' : '#FFB0C4';
  
  // 字体颜色
  const fontColor = isIPrefix ? '#E85D9E' : '#FFFFFF';
  
  // 旋转变换：偶数图形组旋转90度，字体不旋转
  const groupTransform = isOdd ? '' : 'transform="rotate(90 43 47)"';
  
  // 裁剪路径
  const clipId = `clip-${index}`;
  const clipPath = `<clipPath id="${clipId}"><path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"/></clipPath>`;
  
  // 背景路径（与裁剪路径相同）
  const bgPath = '<path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"';
  
  return `<svg viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
    <defs>
      ${clipPath}
      <linearGradient id="${gradId}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0%" stop-color="${gradStart}"/>
        <stop offset="100%" stop-color="${gradEnd}"/>
      </linearGradient>
      <radialGradient id="${highlightId}" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g ${groupTransform} clip-path="url(#${clipId})">
      ${bgPath} fill="url(#${gradId})"/>
      ${bgPath} fill="url(#${highlightId})"/>
    </g>
    <text x="43" y="47" text-anchor="middle" dominant-baseline="central" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="bold" font-size="29" fill="${fontColor}">${firstChar}</text>
  </svg>`;
}

// 渲染游戏卡片
function renderGames(filter = '') {
  const grid = document.getElementById('gameGrid');
  const emptyState = document.getElementById('emptyState');
  const visibleCount = document.getElementById('visibleCount');
  
  const filtered = games.filter(g => 
    g.title.toLowerCase().includes(filter.toLowerCase()) ||
    g.file.toLowerCase().includes(filter.toLowerCase())
  );
  
  visibleCount.textContent = filtered.length;
  
  if (filtered.length === 0) {
    grid.innerHTML = '';
    emptyState.hidden = false;
    return;
  }
  
  emptyState.hidden = true;
  
  grid.innerHTML = filtered.map((game, i) => {
    const originalIndex = games.findIndex(g => g.file === game.file);
    const iconSvg = generateIconSvg(originalIndex, game.title);
    return `
      <a href="/games-web/${game.file}" class="card" role="listitem" aria-label="${game.title}">
        <div class="icon-wrapper" aria-hidden="true">${iconSvg}</div>
        <div class="card-content">
          <div class="card-title">${escapeHtml(game.title)}</div>
          <div class="card-meta">${game.file.replace('.html', '')}</div>
        </div>
      </a>
    `;
  }).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 搜索功能
const searchInput = document.getElementById('searchInput');
let debounceTimer;

searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    renderGames(e.target.value);
  }, 100);
});

// 初始渲染
renderGames();

// 键盘快捷键：/ 聚焦搜索框
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
  }
});
</script>
