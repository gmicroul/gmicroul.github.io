<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Lobby - gmicroul.github.io</title>
<style>
/* ===== CSS Variables - SailfishOS Color Palette ===== */
:root {
  /* Ocean theme (60%+) */
  --deep-teal: #0E7C8C;
  --teal: #19A7CE;
  --sky-blue: #4FC3F7;
  --sea-green: #2EBD85;
  --deep-green: #15966B;
  /* Warm accents (sparingly) */
  --coral-red: #F0544F;
  --orange: #F59B23;
  --bright-yellow: #FFD34E;
  --purple-pink-from: #C56CD6;
  --purple-pink-to: #E85D9E;
  /* Foreground */
  --fg-white: #FFFFFF;
  --fg-offwhite: #F5F7F7;
  /* Accents */
  --bubble-dots: #B03A6B;
  --lens-red: #FF3B30;
  --lens-green: #34C759;
  --lens-blue: #007AFF;
  /* Shadows */
  --shadow-color: rgba(20, 40, 60, 0.2);
  --shadow-color-strong: rgba(20, 40, 60, 0.25);
  /* Background */
  --bg-primary: #0A1620;
  --bg-secondary: #0F1E2E;
  --bg-card: #142536;
  --bg-card-hover: #1A3046;
  --border-color: rgba(25, 167, 206, 0.15);
  --border-hover: rgba(25, 167, 206, 0.35);
}

/* Light theme support (auto) */
@media (prefers-color-scheme: light) {
  :root {
    --bg-primary: #E8F0F8;
    --bg-secondary: #DDE8F4;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F0F7FF;
    --border-color: rgba(14, 124, 140, 0.2);
    --border-hover: rgba(14, 124, 140, 0.4);
    --fg-white: #0A1620;
    --fg-offwhite: #1A2E3E;
  }
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--fg-offwhite);
  min-height: 100vh;
  line-height: 1.6;
}

/* ===== Layout ===== */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ===== Header ===== */
.header {
  padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 5vw, 2rem);
  background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  background: linear-gradient(135deg, rgba(15, 30, 46, 0.95) 0%, rgba(10, 22, 32, 0.95) 100%);
}
@media (prefers-color-scheme: light) {
  .header {
    background: linear-gradient(135deg, rgba(221, 232, 244, 0.95) 0%, rgba(232, 240, 248, 0.95) 100%);
  }
}

.header-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  align-items: flex-start;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: var(--fg-white);
}

.logo-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.logo-icon svg { width: 100%; height: 100%; }

.logo-text {
  font-size: clamp(1.25rem, 3vw, 1.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--teal), var(--sky-blue), var(--sea-green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-subtitle {
  font-size: 0.875rem;
  color: var(--teal);
  opacity: 0.8;
  font-weight: 500;
}

/* ===== Search ===== */
.search-wrapper {
  width: 100%;
  max-width: 600px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 0.875rem 1rem 0.875rem 3rem;
  font-size: 1rem;
  border: 2px solid var(--border-color);
  border-radius: 16px;
  background: var(--bg-card);
  color: var(--fg-offwhite);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.search-input::placeholder {
  color: var(--teal);
  opacity: 0.5;
}

.search-input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 4px rgba(25, 167, 206, 0.15);
  background: var(--bg-card-hover);
}

.search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  pointer-events: none;
  opacity: 0.5;
  color: var(--teal);
}

.search-clear {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--teal);
  opacity: 0;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s ease, background 0.2s ease;
}

.search-clear.visible { opacity: 0.6; }
.search-clear:hover { opacity: 1; background: var(--border-color); }

/* ===== Stats ===== */
.stats {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  font-size: 0.875rem;
  color: var(--teal);
  opacity: 0.8;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 0.375rem;
}

.stat-value {
  font-weight: 700;
  font-size: 1rem;
  color: var(--fg-white);
}

/* ===== Main Content ===== */
.main {
  flex: 1;
  padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 5vw, 2rem);
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: clamp(0.75rem, 2vw, 1.25rem);
}

/* ===== Game Card ===== */
.game-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              border-color 0.2s ease,
              box-shadow 0.2s ease;
  cursor: pointer;
}

.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-hover);
  box-shadow: 0 12px 32px var(--shadow-color),
              0 4px 12px var(--shadow-color-strong);
}

.game-card:active {
  transform: translateY(-2px) scale(0.99);
}

.game-card:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

/* Icon Area */
.card-icon {
  aspect-ratio: 1;
  width: 100%;
  max-width: 160px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
}

.card-icon .icon-svg {
  width: 70%;
  height: 70%;
  max-width: 80px;
  max-height: 80px;
  filter: drop-shadow(0 4px 12px var(--shadow-color));
}

.card-icon .icon-placeholder {
  width: 60%;
  height: 60%;
  max-width: 70px;
  max-height: 70px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.5rem;
  color: var(--fg-white);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.1),
    inset 0 -2px 4px rgba(0,0,0,0.2),
    0 4px 12px var(--shadow-color);
}

/* Card Content */
.card-content {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  min-height: 72px;
}

.card-title {
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--fg-white);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  font-size: 0.7rem;
  color: var(--teal);
  opacity: 0.7;
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.card-tag {
  padding: 0.125rem 0.5rem;
  background: linear-gradient(135deg, rgba(25,167,206,0.15), rgba(46,189,133,0.15));
  border: 1px solid var(--border-color);
  border-radius: 100px;
  font-weight: 500;
}

/* ===== Empty State ===== */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
  color: var(--teal);
  opacity: 0.6;
}

.empty-icon {
  width: 80px;
  height: 80px;
  margin-bottom: 1rem;
  opacity: 0.4;
}

.empty-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: var(--fg-offwhite);
}

.empty-desc {
  font-size: 0.9rem;
  max-width: 300px;
}

/* ===== Footer ===== */
.footer {
  padding: 2rem;
  text-align: center;
  color: var(--teal);
  opacity: 0.5;
  font-size: 0.8rem;
  border-top: 1px solid var(--border-color);
  background: var(--bg-secondary);
}

/* ===== Animations ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.game-card {
  animation: fadeInUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}

.game-card:nth-child(1) { animation-delay: 0ms; }
.game-card:nth-child(2) { animation-delay: 30ms; }
.game-card:nth-child(3) { animation-delay: 60ms; }
.game-card:nth-child(4) { animation-delay: 90ms; }
.game-card:nth-child(5) { animation-delay: 120ms; }
.game-card:nth-child(6) { animation-delay: 150ms; }
.game-card:nth-child(7) { animation-delay: 180ms; }
.game-card:nth-child(8) { animation-delay: 210ms; }
.game-card:nth-child(9) { animation-delay: 240ms; }
.game-card:nth-child(10) { animation-delay: 270ms; }
.game-card:nth-child(11) { animation-delay: 300ms; }
.game-card:nth-child(12) { animation-delay: 330ms; }
.game-card:nth-child(13) { animation-delay: 360ms; }
.game-card:nth-child(14) { animation-delay: 390ms; }
.game-card:nth-child(15) { animation-delay: 420ms; }
.game-card:nth-child(16) { animation-delay: 450ms; }
.game-card:nth-child(17) { animation-delay: 480ms; }
.game-card:nth-child(18) { animation-delay: 510ms; }
.game-card:nth-child(19) { animation-delay: 540ms; }
.game-card:nth-child(20) { animation-delay: 570ms; }

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .games-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }
  .card-content { padding: 0.875rem; }
  .card-title { font-size: 0.8rem; }
  .search-input { padding: 0.75rem 1rem 0.75rem 2.75rem; font-size: 16px; }
}

@media (min-width: 641px) and (max-width: 1024px) {
  .games-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (min-width: 1025px) and (max-width: 1400px) {
  .games-grid {
    grid-template-columns: repeat(5, 1fr);
  }
}

@media (min-width: 1401px) {
  .games-grid {
    grid-template-columns: repeat(7, 1fr);
  }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  .game-card,
  .search-input,
  .search-clear {
    animation: none !important;
    transition: none !important;
  }
  .game-card:hover { transform: none; }
}

/* ===== High Contrast ===== */
@media (prefers-contrast: high) {
  :root {
    --border-color: var(--teal);
    --border-hover: var(--sky-blue);
    --shadow-color: rgba(0,0,0,0.5);
  }
  .game-card { border-width: 2px; }
  .search-input { border-width: 2px; }
}
</style>

  other: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="otherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#19A7CE"/>
        <stop offset="100%" stop-color="#4FC3F7"/>
      </linearGradient>
    </defs>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#otherGrad)"/>
    <path d="M22 32 L30 40 L42 24" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
    <circle cx="32" cy="32" r="4" fill="#FFFFFF" opacity="0.2"/>
  </svg>`
};

// ===== Placeholder Letter Gradients =====
const PLACEHOLDER_GRADIENTS = [
  'linear-gradient(135deg, #0E7C8C, #19A7CE)',
  'linear-gradient(135deg, #19A7CE, #4FC3F7)',
  'linear-gradient(135deg, #4FC3F7, #2EBD85)',
  'linear-gradient(135deg, #2EBD85, #15966B)',
  'linear-gradient(135deg, #15966B, #0E7C8C)',
  'linear-gradient(135deg, #F0544F, #C56CD6)',
  'linear-gradient(135deg, #C56CD6, #E85D9E)',
  'linear-gradient(135deg, #F59B23, #FFD34E)',
  'linear-gradient(135deg, #FFD34E, #F0544F)',
];

function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getPlaceholderGradient(name) {
  const idx = hashString(name) % PLACEHOLDER_GRADIENTS.length;
  return PLACEHOLDER_GRADIENTS[idx];
}

function getPlaceholderLetter(name) {
  const cleaned = name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  return cleaned.charAt(0) || '?';
}

// ===== Render Functions =====
function createGameCard(game) {
  const card = document.createElement('a');
  card.href = game.url;
  card.className = 'game-card';
  card.setAttribute('role', 'listitem');
  card.setAttribute('data-title', game.title.toLowerCase());
  card.setAttribute('data-type', game.type);
  
  // Icon
  const iconDiv = document.createElement('div');
  iconDiv.className = 'card-icon';
  
  if (game.icon) {
    // Use actual icon image
    const img = document.createElement('img');
    img.src = game.icon;
    img.alt = '';
    img.className = 'icon-svg';
    img.loading = 'lazy';
    img.onerror = () => {
      img.style.display = 'none';
      showPlaceholder();
    };
    iconDiv.appendChild(img);
  } else {
    showPlaceholder();
  }
  
  function showPlaceholder() {
    if (iconDiv.querySelector('.icon-placeholder')) return;
    const placeholder = document.createElement('div');
    placeholder.className = 'icon-placeholder';
    placeholder.style.background = getPlaceholderGradient(game.title);
    placeholder.textContent = getPlaceholderLetter(game.title);
    iconDiv.appendChild(placeholder);
  }
  
  // SVG Icon (SailfishOS style)
  if (!game.icon) {
    const svgIcon = document.createElement('div');
    svgIcon.className = 'icon-svg';
    svgIcon.innerHTML = ICON_SVGS[game.type] || ICON_SVGS.other;
    iconDiv.insertBefore(svgIcon, iconDiv.firstChild);
  }
  
  // Content
  const contentDiv = document.createElement('div');
  contentDiv.className = 'card-content';
  
  const titleDiv = document.createElement('div');
  titleDiv.className = 'card-title';
  titleDiv.textContent = game.title;
  
  const metaDiv = document.createElement('div');
  metaDiv.className = 'card-meta';
  
  const typeNames = {
    action: '动作',
    puzzle: '益智',
    racing: '竞速',
    sports: '体育',
    arcade: '街机',
    strategy: '策略',
    adventure: '冒险',
    simulation: '模拟',
    casual: '休闲',
    other: '其他'
  };
  
  const tag = document.createElement('span');
  tag.className = 'card-tag';
  tag.textContent = typeNames[game.type] || '其他';
  metaDiv.appendChild(tag);
  
  contentDiv.appendChild(titleDiv);
  contentDiv.appendChild(metaDiv);
  
  card.appendChild(iconDiv);
  card.appendChild(contentDiv);
  
  return card;
}

function renderGames(games) {
  const grid = document.getElementById('gamesGrid');
  const emptyState = document.getElementById('emptyState');
  const filteredCount = document.getElementById('filteredCount');
  
  grid.innerHTML = '';
  
  if (games.length === 0) {
    grid.style.display = 'none';
    emptyState.style.display = 'flex';
    filteredCount.textContent = '0';
    return;
  }
  
  grid.style.display = 'grid';
  emptyState.style.display = 'none';
  filteredCount.textContent = games.length;
  
  const fragment = document.createDocumentFragment();
  games.forEach(game => {
    fragment.appendChild(createGameCard(game));
  });
  grid.appendChild(fragment);
}

// ===== Search =====
function initSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  
  input.addEventListener('input', (e) => {
    const query = e.target.value.trim().toLowerCase();
    clearBtn.classList.toggle('visible', query.length > 0);
    
    if (query === '') {
      renderGames(GAMES_DATA);
      return;
    }
    
    const filtered = GAMES_DATA.filter(game => 
      game.title.toLowerCase().includes(query) ||
      game.file.toLowerCase().includes(query)
    );
    renderGames(filtered);
  });
  
  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('visible');
    renderGames(GAMES_DATA);
    input.focus();
  });
  
  // Keyboard shortcut: / to focus search
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== input) {
      e.preventDefault();
      input.focus();
    }
    if (e.key === 'Escape' && document.activeElement === input) {
      input.blur();
    }
  });
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('totalCount').textContent = 224;
  renderGames(GAMES_DATA);
  initSearch();
  
  // Announce count to screen readers
  const liveRegion = document.createElement('div');
  liveRegion.setAttribute('aria-live', 'polite');
  liveRegion.setAttribute('aria-atomic', 'true');
  liveRegion.className = 'sr-only';
  liveRegion.style.cssText = 'position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;';
  document.body.appendChild(liveRegion);
  
  const originalRender = renderGames;
  window.renderGames = function(games) {
    originalRender(games);
    liveRegion.textContent = `显示 ${games.length} 个游戏，共 ${GAMES_DATA.length} 个`;
  };
});

</script>
