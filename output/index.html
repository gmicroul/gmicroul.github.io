<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFOS 游戏大厅 · Game Hall</title>
<style>
  :root{
    --bg0:#081318; --bg1:#0b1b22; --bg2:#0e232c;
    --panel:#0d1e26; --panel2:#12303c; --panel3:#163a48;
    --line:#1d3f4b; --line2:#2a5563;
    --text:#e6f4f8; --dim:#7fa6b3; --faint:#4d707c;
    --accent:#43c6ff; --accent2:#8fe3ff;
    --shadow:0 6px 18px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, var(--bg2) 0%, var(--bg1) 45%, var(--bg0) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(8,19,24,.86);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1240px; margin:0 auto; padding:12px 18px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.4px; font-size:17px; white-space:nowrap}
  .logo .dot{
    width:22px; height:22px; border-radius:4px; flex:none;
    background:linear-gradient(140deg, var(--accent), var(--accent2));
    box-shadow:0 0 12px rgba(67,198,255,.55);
  }
  .count{
    font-size:12px; color:var(--accent); background:rgba(67,198,255,.12);
    border:1px solid rgba(67,198,255,.3); border-radius:999px;
    padding:3px 10px; white-space:nowrap;
  }
  .search{
    flex:1 1 240px; min-width:180px; position:relative;
  }
  .search input{
    width:100%; padding:9px 34px 9px 14px;
    background:var(--panel); color:var(--text);
    border:1px solid var(--line2); border-radius:0;
    font-size:14px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(67,198,255,.15);
  }
  .search .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; line-height:18px; text-align:center;
    color:var(--faint); cursor:pointer; font-size:15px; border-radius:50%;
    display:none; user-select:none;
  }
  .search .clear:hover{color:var(--text)}
  .search input:not(:placeholder-shown) ~ .clear{display:block}
  main{max-width:1240px; margin:0 auto; padding:20px 18px 48px}
  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:16px; color:var(--dim); font-size:13px;
  }
  .toolbar .right{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .fbtn{
    background:var(--panel); color:var(--dim);
    border:1px solid var(--line); padding:5px 11px; cursor:pointer;
    font-size:12px; border-radius:0; transition:all .15s;
  }
  .fbtn:hover{color:var(--text); border-color:var(--line2)}
  .fbtn.on{color:var(--accent); border-color:var(--accent); background:rgba(67,198,255,.1)}
  .grid{
    display:grid; gap:14px;
    grid-template-columns:repeat(2,1fr);
  }
  @media (min-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:16px}
  }
  .cell{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    text-decoration:none; color:inherit; cursor:pointer;
    animation:fadein .3s ease both;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tile{
    width:108px; height:108px; border-radius:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, var(--panel2), var(--panel));
    border:1px solid var(--line);
    transition:transform .15s, border-color .15s, box-shadow .15s, background .15s;
    position:relative;
  }
  .tile img{width:86px; height:86px; display:block; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .tile::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(150deg, rgba(143,227,255,.14), transparent 60%);
    opacity:0; transition:opacity .15s;
  }
  .cell:hover .tile{
    transform:translateY(-3px);
    border-color:var(--accent);
    box-shadow:var(--shadow), 0 0 0 1px rgba(67,198,255,.4);
    background:linear-gradient(150deg, var(--panel3), var(--panel2));
  }
  .cell:hover .tile::after{opacity:1}
  .cell:active .tile{transform:translateY(0) scale(.97)}
  .name{
    font-size:12px; line-height:1.25; text-align:center; color:var(--dim);
    max-width:116px; height:30px; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    word-break:break-all; transition:color .15s;
  }
  .cell:hover .name{color:var(--text)}
  .empty{
    grid-column:1/-1; text-align:center; padding:60px 0; color:var(--faint); font-size:14px;
  }
  footer{
    text-align:center; padding:18px; color:var(--faint); font-size:11px;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="dot"></span>SFOS 游戏大厅</div>
    <div class="count" id="count">-- 款游戏</div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索游戏名称…" autocomplete="off">
      <span class="clear" id="clear" title="清空">&times;</span>
    </div>
  </div>
</header>
<main>
  <div class="toolbar">
    <span id="total">共 -- 款</span>
    <div class="right" id="fbars"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>SFOS Game Hall · 本地独立运行 · 数据来自 games-web/</footer>

const $ = s => document.querySelector(s);
const grid = $('#grid'), q = $('#q'), clear = $('#clear'), count = $('#count'), total = $('#total');

const CATS = {
  'speed':'竞速','ball':'球类','mountain':'跑酷','puzzle':'解谜','food':'美食',
  'monster':'恐怖','flying':'飞行','war':'策略','retro':'怀旧','space':'太空',
  'water':'水域','nature':'植物','pets':'宠物','music':'音乐','stick':'火柴人',
  'circuit':'科技','target':'射击','bubbles':'球形','tower':'塔防','generic':'其他'
};

let state = { q: '', cat: 'all' };

function cellHTML(g){
  const href = '../games-web/' + encodeURIComponent(g.f);
  const src = 'icons/' + encodeURIComponent(g.i);
  return '<a class="cell" href="' + href + '" target="_blank" rel="noopener">' +
         '<span class="tile"><img src="' + src + '" alt="" loading="lazy"></span>' +
         '<span class="name"></span></a>';
}

function render(){
  const s = state.q.trim().toLowerCase();
  const list = GAMES.filter(g => {
    const hit = !s || g.n.toLowerCase().includes(s);
    const cat = state.cat === 'all' || g.c === state.cat;
    return hit && cat;
  });
  count.textContent = list.length + ' / ' + GAMES.length + ' 款游戏';
  total.textContent = '共 ' + GAMES.length + ' 款 · 显示 ' + list.length + ' 款';
  if(!list.length){
    grid.innerHTML = '<div class="empty">没有找到匹配的游戏</div>';
    return;
  }
  grid.innerHTML = list.map(cellHTML).join('');
  const names = grid.querySelectorAll('.name');
  list.forEach((g, i) => { names[i].textContent = g.n; });
}

function buildBars(){
  const wrap = $('#fbars');
  const counts = {};
  GAMES.forEach(g => { counts[g.c] = (counts[g.c] || 0) + 1; });
  let html = '<button class="fbtn on" data-c="all">全部 ' + GAMES.length + '</button>';
  Object.keys(CATS).forEach(k => {
    if(counts[k]) html += '<button class="fbtn" data-c="' + k + '">' + CATS[k] + ' ' + counts[k] + '</button>';
  });
  wrap.innerHTML = html;
  wrap.addEventListener('click', e => {
    const b = e.target.closest('.fbtn'); if(!b) return;
    wrap.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    state.cat = b.dataset.c;
    render();
  });
}

q.addEventListener('input', () => { state.q = q.value; render(); });
clear.addEventListener('click', () => { q.value = ''; state.q = ''; render(); q.focus(); });

buildBars();
render();
</script>
