<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · SFOS Game Hub</title>
<style>
  :root{
    --bg1:#061021; --bg2:#0d2140;
    --card:rgba(15,29,52,.62); --card-hover:rgba(20,40,70,.82);
    --line:rgba(92,168,224,.16); --line-hover:rgba(64,214,255,.55);
    --text:#e8f0f8; --dim:#8fa9c6; --dim2:#6d88a6;
    --accent:#3ad3f2; --accent2:#7ce6ff; --accent3:#2ea8d8;
    --glow:rgba(58,211,242,.20);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans",sans-serif;
    color:var(--text);min-height:100vh;
    background:
      radial-gradient(1200px 620px at 18% -8%, rgba(58,211,242,.10), transparent 60%),
      radial-gradient(1000px 700px at 88% 108%, rgba(46,168,216,.10), transparent 60%),
      linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,#0a1b33 100%);
    background-attachment:fixed;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(6,16,33,.78);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid var(--line);
    padding:12px 18px;
  }
  .bar{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.5px;user-select:none}
  .logo svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 8px rgba(58,211,242,.35))}
  .logo em{font-style:normal;background:linear-gradient(120deg,#7ce6ff,#3ad3f2 55%,#7fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;font-size:9px;font-weight:500;color:var(--dim2);letter-spacing:1.6px;margin-top:1px}
  .count{
    font-size:12px;color:var(--dim);background:rgba(58,211,242,.08);
    border:1px solid rgba(58,211,242,.22);padding:4px 12px;border-radius:999px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .search{margin-left:auto;flex:1;min-width:180px;max-width:440px;position:relative}
  .search input{
    width:100%;padding:9px 16px 9px 38px;border-radius:999px;
    border:1px solid rgba(92,168,224,.28);background:rgba(10,22,40,.85);
    color:var(--text);font-size:14px;outline:none;caret-color:var(--accent);
    transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  .search input::placeholder{color:var(--dim2)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim2);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
  main{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
  .grid{
    display:grid;
    grid-template-columns:repeat(2,108px);
    justify-content:center;
    gap:16px 14px;
  }
  @media(min-width:600px){
    .grid{grid-template-columns:repeat(auto-fill,108px)}
  }
  .card{
    width:108px;height:108px;border-radius:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:4px 2px 3px;
    text-decoration:none;color:var(--text);
    background:linear-gradient(168deg,var(--card),rgba(8,17,32,.62));
    border:1px solid var(--line);
    transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
    position:relative;
  }
  .card::after{
    content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:0;transition:opacity .16s ease;
  }
  .card img{
    width:86px;height:86px;display:block;flex:none;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.38));
    transition:transform .16s ease,filter .16s ease;
  }
  .card .name{
    max-width:102px;font-size:10px;line-height:1.2;text-align:center;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:color .16s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px);outline:none;
    background:linear-gradient(168deg,var(--card-hover),rgba(10,22,42,.82));
    border-color:var(--line-hover);
    box-shadow:0 8px 22px rgba(4,12,24,.5),0 0 0 1px rgba(58,211,242,.08);
  }
  .card:hover::after,.card:focus-visible::after{opacity:1}
  .card:hover img,.card:focus-visible img{transform:scale(1.05);filter:drop-shadow(0 6px 14px rgba(58,211,242,.28))}
  .card:hover .name,.card:focus-visible .name{color:#cfe9ff}
  .empty{display:none;text-align:center;color:var(--dim);padding:70px 0;font-size:15px}
  footer{text-align:center;color:var(--dim2);font-size:11px;padding:0 0 26px;letter-spacing:.4px}
  footer b{color:var(--dim);font-weight:600}
</style>
</head>

var grid = document.getElementById("grid");
var cards = [];
GAMES.forEach(function(g){
  var a = document.createElement("a");
  a.className = "card";
  a.href = "../games-web/" + encodeURIComponent(g.f);
  a.target = "_blank"; a.rel = "noopener";
  a.title = g.n;
  var img = document.createElement("img");
  img.src = g.i;
  img.alt = g.n;
  img.loading = "lazy";
  var nm = document.createElement("span");
  nm.className = "name";
  nm.textContent = g.n;
  a.appendChild(img);
  a.appendChild(nm);
  grid.appendChild(a);
  cards.push({el:a, name:g.n.toLowerCase()});
});

var countEl = document.getElementById("count");
var emptyEl = document.getElementById("empty");
var total = GAMES.length;
document.getElementById("total").textContent = total;
function setCount(n){ countEl.textContent = n + " / " + total + " 款游戏"; }
setCount(total);

var q = document.getElementById("q");
q.addEventListener("input", function(){
  var v = q.value.trim().toLowerCase();
  var shown = 0;
  cards.forEach(function(c){
    var hit = !v || c.name.indexOf(v) !== -1;
    c.el.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  setCount(shown);
  emptyEl.style.display = shown ? "none" : "block";
});
})();
</script>
