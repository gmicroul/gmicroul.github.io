<style>
:root {
  --bg: #0a0f14;
  --bg-elevated: #111820;
  --fg: #e8ecf0;
  --fg-muted: #8a93a0;
  --accent: #19a7ce;
  --accent-dim: #0e7c8c;
  --sea-green: #2ebd85;
  --sea-green-dim: #15966b;
  --coral: #f0544f;
  --orange: #f59b23;
  --yellow: #ffd34e;
  --card-bg: rgba(17, 24, 32, 0.85);
  --card-border: rgba(25, 167, 206, 0.15);
  --shadow: rgba(20, 40, 60, 0.35);
  --shadow-strong: rgba(20, 40, 60, 0.5);
  --gradient-primary: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%);
  --gradient-green: linear-gradient(135deg, #15966b 0%, #2ebd85 50%, #4fc3f7 100%);
  --gradient-warm: linear-gradient(135deg, #f0544f 0%, #f59b23 50%, #ffd34e 100%);
  --gradient-purple: linear-gradient(135deg, #c56cd6 0%, #e85d9e 100%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(25, 167, 206, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(46, 189, 133, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(25, 167, 206, 0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

header {
  position: relative;
  z-index: 10;
  padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 4vw, 3rem) clamp(1rem, 3vw, 2rem);
  text-align: center;
  border-bottom: 1px solid var(--card-border);
  background: linear-gradient(180deg, rgba(17, 24, 32, 0.95) 0%, transparent 100%);
}

header h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}

header p {
  color: var(--fg-muted);
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  max-width: 600px;
  margin: 0 auto;
}

.search-container {
  position: relative;
  z-index: 10;
  max-width: 640px;
  margin: 0 auto clamp(1rem, 3vw, 2rem);
  padding: 0 clamp(1rem, 4vw, 3rem);
}

.search-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 16px;
  width: 22px;
  height: 22px;
  color: var(--fg-muted);
  pointer-events: none;
  flex-shrink: 0;
}

#searchInput {
  width: 100%;
  padding: 14px 20px 14px 54px;
  font-size: 1rem;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  color: var(--fg);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  backdrop-filter: blur(10px);
}

#searchInput::placeholder { color: var(--fg-muted); opacity: 0.7; }

#searchInput:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.15), 0 8px 32px var(--shadow);
  background: var(--bg-elevated);
}

#searchInput:focus + .search-icon { color: var(--accent); }

.stats {
  position: relative;
  z-index: 10;
  text-align: center;
  color: var(--fg-muted);
  font-size: 0.875rem;
  margin-bottom: clamp(1rem, 2.5vw, 1.5rem);
  padding: 0 clamp(1rem, 4vw, 3rem);
}

.stats strong { color: var(--accent); font-weight: 600; }

main {
  position: relative;
  z-index: 10;
  padding: 0 clamp(1rem, 4vw, 3rem) clamp(2rem, 5vw, 4rem);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: clamp(12px, 2.5vw, 20px);
  max-width: 1600px;
  margin: 0 auto;
}

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
}

@media (min-width: 481px) and (max-width: 768px) {
  .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
}

@media (min-width: 1025px) and (max-width: 1400px) {
  .grid { grid-template-columns: repeat(5, 1fr); gap: 18px; }
}

@media (min-width: 1401px) {
  .grid { grid-template-columns: repeat(6, 1fr); gap: 20px; }
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: clamp(14px, 2.5vw, 20px) clamp(10px, 2vw, 14px);
  backdrop-filter: blur(12px);
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), 
              box-shadow 0.25s ease, 
              border-color 0.25s ease;
  overflow: hidden;
  min-height: 180px;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25, 167, 206, 0.05) 0%, transparent 50%, rgba(46, 189, 133, 0.03) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(25, 167, 206, 0.4);
  box-shadow: 0 20px 48px var(--shadow-strong), 0 8px 24px var(--shadow);
}

.card:hover::before { opacity: 1; }

.card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.25), 0 12px 32px var(--shadow);
}

.icon-wrapper {
  position: relative;
  width: clamp(72px, 14vw, 96px);
  height: clamp(72px, 14vw, 96px);
  margin-bottom: clamp(10px, 2vw, 14px);
  flex-shrink: 0;
  filter: drop-shadow(0 8px 24px var(--shadow)) drop-shadow(0 4px 12px var(--shadow));
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), filter 0.3s ease;
}

.card:hover .icon-wrapper { transform: scale(1.08) rotate(-2deg); filter: drop-shadow(0 12px 32px var(--shadow-strong)) drop-shadow(0 6px 16px var(--shadow)); }

.leaf-icon {
  width: 100%;
  height: 100%;
  display: block;
}

.card-title {
  font-size: clamp(0.8rem, 1.8vw, 0.95rem);
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  transition: color 0.2s ease;
}

.card:hover .card-title { color: var(--accent); }

.hidden { display: none !important; }

.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 2rem;
  color: var(--fg-muted);
}

.no-results svg { width: 80px; height: 80px; margin-bottom: 1rem; opacity: 0.5; }

.no-results h3 { font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--fg); }

footer {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 2rem;
  color: var(--fg-muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--card-border);
  background: linear-gradient(0deg, rgba(10, 15, 20, 0.95) 0%, transparent 100%);
}

footer a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
footer a:hover { color: var(--sea-green); text-decoration: underline; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.card { animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

.card:nth-child(1) { animation-delay: 0ms; }
.card:nth-child(2) { animation-delay: 30ms; }
.card:nth-child(3) { animation-delay: 60ms; }
.card:nth-child(4) { animation-delay: 90ms; }
.card:nth-child(5) { animation-delay: 120ms; }
.card:nth-child(6) { animation-delay: 150ms; }
.card:nth-child(7) { animation-delay: 180ms; }
.card:nth-child(8) { animation-delay: 210ms; }
.card:nth-child(9) { animation-delay: 240ms; }
.card:nth-child(10) { animation-delay: 270ms; }
.card:nth-child(11) { animation-delay: 300ms; }
.card:nth-child(12) { animation-delay: 330ms; }

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .card:hover, .icon-wrapper { transition: none; }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(25, 167, 206, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(25, 167, 206, 0); }
}

.search-wrapper:focus-within { animation: pulse 2s infinite; }
</style>
</head>

const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const stats = document.getElementById('stats');
const noResults = document.getElementById('noResults');

const gradients = [
  'linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%)',
  'linear-gradient(135deg, #15966b 0%, #2ebd85 50%, #4fc3f7 100%)',
  'linear-gradient(135deg, #0e7c8c 0%, #19a7ce 40%, #2ebd85 100%)',
  'linear-gradient(135deg, #19a7ce 0%, #4fc3f7 50%, #2ebd85 100%)',
  'linear-gradient(135deg, #15966b 0%, #19a7ce 50%, #0e7c8c 100%)',
  'linear-gradient(135deg, #0e7c8c 0%, #15966b 50%, #2ebd85 100%)',
  'linear-gradient(135deg, #19a7ce 0%, #0e7c8c 50%, #15966b 100%)',
  'linear-gradient(135deg, #2ebd85 0%, #19a7ce 50%, #0e7c8c 100%)'
];

const accentColors = ['#19a7ce', '#2ebd85', '#4fc3f7', '#15966b', '#0e7c8c'];

function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function generateLeafIcon(title, index) {
  const h = hashString(title + index);
  const gradient = gradients[h % gradients.length];
  const accent = accentColors[h % accentColors.length];
  const rotate = (index % 2 === 1) ? 90 : 0;
  const rotateStr = rotate ? ` transform="rotate(${rotate} 256 256)"` : '';
  
  return `<svg class="leaf-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"${rotateStr}>
  <defs>
    <linearGradient id="grad-${index}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${gradient.split(',')[0].split('(')[1].trim()}"/>
      <stop offset="50%" stop-color="${gradient.split(',')[1].split('%')[0].trim()}%"/>
      <stop offset="100%" stop-color="${gradient.split(',')[2].split(')')[0].trim()}"/>
    </linearGradient>
    <linearGradient id="shine-${index}" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow-${index}" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14283c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow-${index})">
    <path d="M256 16 C123.7 16 16 123.7 16 256 C16 388.3 123.7 496 256 496 C388.3 496 496 388.3 496 256 C496 123.7 388.3 16 256 16 Z" 
          fill="url(#grad-${index})" stroke="none"/>
    <path d="M256 16 C256 16 256 256 256 256 C256 256 16 256 16 256 C16 256 256 496 256 496 C256 496 496 256 496 256 C496 256 256 16 256 16 Z"
          fill="none" stroke="url(#shine-${index})" stroke-width="2" stroke-linecap="round"/>
    <circle cx="340" cy="172" r="12" fill="#ffffff" opacity="0.25"/>
    <circle cx="355" cy="160" r="5" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>`;
}

function renderGames(list) {
  grid.innerHTML = '';
  if (list.length === 0) {
    noResults.classList.remove('hidden');
    stats.textContent = `共 ${games.length} 款游戏 · 筛选结果 0 款`;
    return;
  }
  noResults.classList.add('hidden');
  stats.textContent = `共 ${games.length} 款游戏 · 显示 ${list.length} 款`;
  
  list.forEach((game, i) => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = game.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.innerHTML = `
      <div class="icon-wrapper">
        ${generateLeafIcon(game.title, i)}
      </div>
      <div class="card-title">${escapeHtml(game.title)}</div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function filterGames(query) {
  const q = query.trim().toLowerCase();
  if (!q) return games;
  return games.filter(g => g.title.toLowerCase().includes(q));
}

let debounceTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const filtered = filterGames(e.target.value);
    renderGames(filtered);
  }, 80);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchInput.blur();
    renderGames(games);
  }
});

renderGames(games);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
