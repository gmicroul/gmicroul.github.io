<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏大厅 · Sailfish</title>
<style>
  :root{
    --accent:#00a9de; --accent2:#1eb58a;
    --bg:#f2f5f8; --card:#ffffff; --line:#dbe3ec;
    --text:#27343e; --dim:#7a8a99;
    --shadow:0 1px 2px rgba(23,44,66,.06), 0 2px 8px rgba(23,44,66,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 420px at 50% -120px, rgba(0,169,222,.10), transparent 70%),
      linear-gradient(180deg, #fafcfe 0%, var(--bg) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(250,252,254,.85);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .logo .mark{width:30px;height:30px;flex:none}
  .count{
    font-size:12px;font-weight:600;color:var(--accent);
    background:rgba(0,169,222,.10);border:1px solid rgba(0,169,222,.28);
    padding:4px 12px;white-space:nowrap;
  }
  .search{flex:1 1 220px;max-width:420px;position:relative;margin-left:auto}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#9fb0bf;pointer-events:none}
  .search input{
    width:100%;padding:9px 14px 9px 40px;font-size:14px;color:var(--text);
    border:1px solid var(--line);background:#fff;outline:none;
    box-shadow:0 1px 2px rgba(23,44,66,.04);
    transition:border-color .18s, box-shadow .18s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,169,222,.14)}
  .search input::placeholder{color:#a7b5c2}
  main{max-width:1180px;margin:0 auto;padding:22px 16px 46px}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
  .card{
    width:108px;height:108px;flex:0 0 auto;text-decoration:none;
    background:var(--card);border:1px solid var(--line);border-radius:0;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 6px 18px rgba(23,44,66,.13);border-color:var(--accent);outline:none}
  .card img{width:86px;height:86px;flex:none;display:block}
  .card .name{
    font-size:10.5px;line-height:1.25;color:var(--text);text-align:center;
    max-width:100px;padding:0 4px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card:hover .name{color:var(--accent)}
  .empty{display:none;text-align:center;color:var(--dim);padding:60px 0;font-size:14px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:0 16px 28px}
  @media (max-width:600px){
    .bar{gap:10px}
    .grid{display:grid;grid-template-columns:repeat(2,108px);gap:12px;justify-content:center}
  }
</style>
</head>

</header>

var countEl=document.getElementById("count");
var emptyEl=document.getElementById("empty");
var cards=[];
GAMES.forEach(function(g,i){
  var a=document.createElement("a");
  a.className="card";
  a.href="../games-web/"+encodeURIComponent(g.f);
  a.target="_blank"; a.rel="noopener";
  var img=document.createElement("img");
  img.src="icons/"+encodeURIComponent(g.i);
  img.width=86; img.height=86; img.alt=""; img.loading="lazy";
  var name=document.createElement("span");
  name.className="name";
  name.textContent=g.n;
  a.appendChild(img); a.appendChild(name);
  grid.appendChild(a);
  cards.push({el:a,name:g.n.toLowerCase()});
});
var total=GAMES.length;
function setCount(n){countEl.textContent=n+" / "+total;}
setCount(total);
var q=document.getElementById("q");
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase(),shown=0;
  for(var i=0;i<cards.length;i++){
    var hit=cards[i].name.indexOf(v)!==-1;
    cards[i].el.style.display=hit?"flex":"none";
    if(hit)shown++;
  }
  emptyEl.style.display=shown===0?"block":"none";
  setCount(shown);
});
})();
