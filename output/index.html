<style>
:root{
  --bg0:#f2f6fa; --bg1:#e5edf4;
  --ink:#152330; --dim:#5d7184;
  --accent:#00a9c8; --accent-soft:#0b7f9e;
  --card:#ffffff; --line:#d3dde7;
  --shadow:0 1px 2px rgba(18,42,60,.06);
  --shadow-lg:0 12px 26px rgba(18,52,74,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Open Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 100%);
  background-attachment:fixed;
  color:var(--ink);min-height:100vh;
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(246,250,253,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:12px 16px;
}
.bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand .sf{width:30px;height:30px;flex:none;display:block;filter:drop-shadow(0 2px 4px rgba(0,140,170,.35))}
.brand em{font-style:normal;color:var(--accent)}
.count{
  font-size:12.5px;font-weight:600;color:var(--accent-soft);
  background:rgba(0,169,200,.10);border:1px solid rgba(0,169,200,.28);
  padding:4px 12px;border-radius:999px;white-space:nowrap;
}
.search{margin-left:auto;position:relative;flex:1;min-width:168px;max-width:340px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
.search input{
  width:100%;padding:10px 14px 10px 38px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px;
  outline:none;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,169,200,.16)}
.search input::placeholder{color:var(--dim)}
main{max-width:1200px;margin:0 auto;padding:22px 16px 64px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 10px;justify-items:center}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:24px 14px}}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:120px}
.card{
  width:108px;height:108px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:0;
  text-decoration:none;position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(0,169,200,.10),transparent 55%);opacity:0;transition:opacity .16s ease}
.card:hover,.card:focus-visible{
  transform:translateY(-3px);border-color:var(--accent);
  box-shadow:var(--shadow-lg);outline:none;
}
.card:hover::after,.card:focus-visible::after{opacity:1}
.card img{width:86px;height:86px;display:block;position:relative;z-index:1}
.name{
  font-size:12px;font-weight:600;text-align:center;line-height:1.3;max-width:108px;
  color:var(--ink);word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.empty{display:none;text-align:center;color:var(--dim);padding:80px 0;font-size:15px}
.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
footer{text-align:center;color:var(--dim);font-size:12px;padding:0 0 30px;line-height:1.6}
</style>
</head>

var grid = document.getElementById("grid");
var countEl = document.getElementById("count");
var emptyEl = document.getElementById("empty");
var q = document.getElementById("q");

var frag = document.createDocumentFragment();
var cells = [];
GAMES.forEach(function(g){
  var cell = document.createElement("figure");
  cell.className = "cell";

  var a = document.createElement("a");
  a.className = "card";
  a.href = "../games-web/" + encodeURIComponent(g.f);
  a.target = "_blank";
  a.rel = "noopener";
  a.setAttribute("aria-label", g.n);

  var img = document.createElement("img");
  img.src = "icons/" + encodeURIComponent(g.i) + ".svg";
  img.alt = g.n;
  img.width = 86;
  img.height = 86;
  img.loading = "lazy";
  img.decoding = "async";

  var fig = document.createElement("figcaption");
  fig.className = "name";
  fig.textContent = g.n;

  a.appendChild(img);
  cell.appendChild(a);
  cell.appendChild(fig);
  frag.appendChild(cell);
  cells.push({el: cell, text: (g.n + " " + g.f).toLowerCase()});
});
grid.appendChild(frag);

function setCount(n){
  countEl.textContent = n + " / " + TOTAL + " 款游戏";
}
setCount(TOTAL);

function filter(){
  var v = q.value.trim().toLowerCase();
  var shown = 0;
  cells.forEach(function(c){
    var hit = !v || c.text.indexOf(v) !== -1;
    c.el.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  setCount(shown);
  emptyEl.style.display = shown ? "none" : "block";
}

q.addEventListener("input", filter);

/* keyboard: / focuses search, Esc clears */
document.addEventListener("keydown", function(e){
  if (e.key === "/" && document.activeElement !== q){
    e.preventDefault();
    q.focus();
  } else if (e.key === "Escape" && document.activeElement === q){
    q.value = "";
    filter();
    q.blur();
  }
});
})();
</script>
</body>
</html>
