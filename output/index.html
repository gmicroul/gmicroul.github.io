<style>
/* ===== CSS Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0f14;
  --bg-elevated: #111820;
  --bg-card: #151d28;
  --bg-card-hover: #1a2432;
  --fg: #e8ecf1;
  --fg-muted: #8b95a1;
  --fg-subtle: #5a6673;
  --accent: #19a7ce;
  --accent-dim: #127a96;
  --accent-glow: rgba(25, 167, 206, 0.35);
  --coral: #f0544f;
  --orange: #f59b23;
  --yellow: #ffd34e;
  --purple-pink: #c56cd6;
  --teal: #2ebd85;
  --deep-green: #15966b;
  --deep-teal: #0e7c8c;
  --sky: #4fc3f7;
  --card-shadow: rgba(20, 40, 60, 0.4);
  --card-shadow-hover: rgba(20, 40, 60, 0.6);
  --long-shadow: rgba(20, 40, 60, 0.18);
  --border: #233040;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', monospace;
}

/* ===== Base ===== */
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  line-height: 1.5;
  overflow-x: hidden;
}

/* Background atmosphere */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(25, 167, 206, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 90%, rgba(46, 189, 133, 0.05) 0%, transparent 55%),
    radial-gradient(ellipse 100% 100% at 50% 50%, rgba(14, 124, 140, 0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ===== Header ===== */
.header {
  position: relative;
  z-index: 10;
  padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 5vw, 3rem) clamp(1rem, 3vw, 1.5rem);
  text-align: center;
}
.header h1 {
  font-size: clamp(1.75rem, 5vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--fg) 0%, var(--sky) 50%, var(--teal) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}
.header p {
  color: var(--fg-muted);
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  font-weight: 400;
}

/* ===== Search ===== */
.search-wrapper {
  position: relative;
  z-index: 10;
  max-width: 640px;
  margin: 0 auto clamp(1.5rem, 4vw, 2.5rem);
  padding: 0 clamp(1rem, 5vw, 3rem);
}
.search-box {
  position: relative;
  width: 100%;
}
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  stroke: var(--fg-subtle);
  pointer-events: none;
  transition: stroke var(--transition);
}
.search-box:focus-within .search-icon { stroke: var(--accent); }
.search-input {
  width: 100%;
  padding: 14px 20px 14px 56px;
  font-size: 1rem;
  font-family: inherit;
  color: var(--fg);
  background: var(--bg-elevated);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}
.search-input::placeholder { color: var(--fg-subtle); }
.search-input:hover { border-color: #2d3d50; background: #17202d; }
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow), 0 8px 32px var(--card-shadow);
  background: var(--bg-card);
}
.search-clear {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--fg-subtle);
  cursor: pointer;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  transition: all var(--transition);
}
.search-clear.visible { opacity: 1; pointer-events: auto; }
.search-clear:hover { color: var(--fg); background: rgba(255,255,255,0.08); }
.search-clear svg { width: 18px; height: 18px; }

/* ===== Stats ===== */
.stats {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: clamp(1rem, 3vw, 2rem);
  padding: 0 clamp(1rem, 5vw, 3rem) clamp(1.5rem, 4vw, 2.5rem);
  flex-wrap: wrap;
  font-size: 0.875rem;
  color: var(--fg-muted);
}
.stat { display: flex; align-items: center; gap: 0.5rem; }
.stat strong { color: var(--fg); font-size: 1.25rem; font-weight: 700; }
.stat.accent strong { color: var(--accent); }

/* ===== Grid ===== */
.main { position: relative; z-index: 10; padding: 0 clamp(1rem, 5vw, 3rem) clamp(3rem, 8vw, 4rem); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: clamp(1rem, 2.5vw, 1.5rem);
  max-width: 1600px;
  margin: 0 auto;
}

/* ===== Card ===== */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(1.25rem, 3vw, 1.5rem) clamp(1rem, 2vw, 1.25rem);
  transition: all var(--transition);
  overflow: hidden;
  isolation: isolate;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25,167,206,0.03) 0%, rgba(46,189,133,0.02) 100%);
  opacity: 0;
  transition: opacity var(--transition);
  z-index: -1;
}
.card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: var(--accent);
  background: var(--bg-card-hover);
  box-shadow:
    0 20px 40px var(--card-shadow-hover),
    0 8px 16px var(--long-shadow),
    inset 0 1px 0 rgba(255,255,255,0.03);
}
.card:hover::before { opacity: 1; }
.card:active { transform: translateY(-2px) scale(1.01); transition-duration: 0.1s; }
.card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow), 0 12px 32px var(--card-shadow);
}

/* ===== Icon Container ===== */
.icon-wrap {
  position: relative;
  width: clamp(72px, 18vw, 96px);
  height: clamp(72px, 18vw, 96px);
  border-radius: 26%;
  margin-bottom: clamp(0.75rem, 2vw, 1rem);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow:
    0 8px 24px rgba(20,40,60,0.35),
    0 2px 8px rgba(20,40,60,0.25),
    inset 0 1px 0 rgba(255,255,255,0.05);
  transition: all var(--transition);
}
.card:hover .icon-wrap {
  transform: scale(1.08) rotate(-2deg);
  box-shadow:
    0 16px 40px rgba(20,40,60,0.45),
    0 4px 12px rgba(20,40,60,0.3),
    inset 0 1px 0 rgba(255,255,255,0.08);
}
.card:active .icon-wrap { transform: scale(1.02) rotate(-1deg); }

/* SailfishOS-style squircle mask */
.icon-wrap svg { width: 100%; height: 100%; display: block; }
.icon-wrap .icon-bg { width: 100%; height: 100%; }
.icon-wrap .icon-fg { width: 78%; height: 78%; }

/* Long shadow (flat long shadow style) */
.icon-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, transparent 50%, var(--long-shadow) 100%);
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}
.card:hover .icon-wrap::after { opacity: 1; }

/* ===== Card Title ===== */
.card-title {
  font-size: clamp(0.8rem, 2vw, 0.95rem);
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 100%;
  color: var(--fg);
  transition: color var(--transition);
}
.card:hover .card-title { color: var(--sky); }

/* ===== Empty State ===== */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
  color: var(--fg-muted);
}
.empty-state svg { width: 80px; height: 80px; margin-bottom: 1rem; opacity: 0.5; }
.empty-state h3 { font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--fg); }
.empty-state p { font-size: 0.95rem; }

/* ===== Footer ===== */
.footer {
  position: relative;
  z-index: 10;
  padding: 2rem;
  text-align: center;
  color: var(--fg-subtle);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}
.footer a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
.footer a:hover { color: var(--sky); text-decoration: underline; }

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== High Contrast ===== */
@media (prefers-contrast: high) {
  :root {
    --border: #4a5a6a;
    --fg-muted: #aab8c5;
    --card-shadow: rgba(0,0,0,0.5);
  }
  .card { border-width: 2px; }
  .search-input { border-width: 3px; }
}

/* ===== Responsive Adjustments ===== */
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 0.875rem; }
  .icon-wrap { width: 64px; height: 64px; }
  .card { padding: 1rem 0.75rem; }
  .stats { gap: 1rem; font-size: 0.8rem; }
}
@media (min-width: 481px) and (max-width: 768px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 769px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 1025px) and (max-width: 1440px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}
@media (min-width: 1441px) {
  .grid { grid-template-columns: repeat(6, 1fr); }
}

/* ===== Print ===== */
@media print {
  .search-wrapper, .footer { display: none; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
  .icon-wrap::after { display: none; }
}
</style>

// Deterministic pseudo-random for consistent icon assignment
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getIconForGame(title, index) {
  const h = hashString(title + index);
  const palette = ICON_PALETTES[h % ICON_PALETTES.length];
  const symbols = ICON_SYMBOLS[palette.type];
  const symbol = symbols[h % symbols.length];
  
  // Build SVG with squircle mask (continuous curvature approximation)
  const borderRadius = palette.type === 'squircle' ? '26%' : (palette.type === 'circle' ? '50%' : '26%');
  
  // Create squircle path using SVG (approximation with cubic beziers for continuous curvature)
  let clipPath = '';
  let bgRect = '';
  
  if (palette.type === 'circle') {

    // Squircle approximation: superellipse with n=2.42, using cubic beziers
    // 26% corner radius approximation with continuous curvature
    const r = 26; // percent
    clipPath = `<clipPath id="clip"><path d="M${r},0 L${100-r},0 C${100},0 ${100},${r} ${100},${r} L${100},${100-r} C${100},${100} ${100-r},${100} ${100-r},${100} L${r},${100} C0,${100} 0,${100-r} 0,${100-r} L0,${r} C0,0 ${r},0 ${r},0 Z"/></clipPath>`;

  } else {
    // Organic blob - asymmetric rounded shape
    clipPath = '<clipPath id="clip"><path d="M15,0 L85,0 C95,0 100,15 100,35 L100,75 C100,92 88,100 68,100 L32,100 C12,100 0,88 0,68 L0,32 C0,12 12,0 15,0 Z"/></clipPath>';

  }
  
  // Long shadow for flat long-shadow style

    '<ellipse cx="35%" cy="30%" rx="18%" ry="12%" fill="#FFFFFF" opacity="0.12" filter="url(#blur)"/>' : 
    (palette.type === 'circle' ? 
      '<circle cx="35%" cy="35%" r="15%" fill="#FFFFFF" opacity="0.08"/>' : 
      '<rect x="30%" y="30%" width="25%" height="15%" rx="30%" fill="#FFFFFF" opacity="0.08"/>');

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${palette.bg.split(' ')[1].replace('deg,','deg,')}" />
      <stop offset="100%" stop-color="${palette.bg.split(' ')[2].replace(')','')}" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="innerShadow"><feOffset dx="0" dy="2"/><feGaussianBlur stdDeviation="2"/><feFlood flood-color="#14283c" flood-opacity="0.3"/><feComposite operator="in"/><feComposite in="SourceGraphic" operator="over"/></filter>
  </defs>
  <!-- Background with gradient -->
  ${bgRect.replace('class="icon-bg"', 'class="icon-bg" fill="url(#bgGrad)"')}
  <!-- Highlight -->
  ${highlight}
  <!-- Foreground symbol (negative space) -->
  <g style="color:${palette.fg};" clip-path="url(#clip)">
    ${symbol}
  </g>
  <!-- Accent detail -->
  ${palette.accent ? `<circle cx="82%" cy="18%" r="7%" fill="${palette.accent}" filter="url(#blur)"/>` : ''}
</svg>`;
}

/* ===== DOM Elements ===== */
const grid = document.getElementById('game-grid');
const searchInput = document.querySelector('.search-input');
const searchClear = document.querySelector('.search-clear');
const totalCount = document.getElementById('total-count');
const visibleCount = document.getElementById('visible-count');
const emptyState = document.getElementById('empty-state');

/* ===== Render Cards ===== */
function renderCards(filter = '') {
  const lowerFilter = filter.toLowerCase().trim();
  const filtered = lowerFilter 
    ? GAMES.filter(g => g.title.toLowerCase().includes(lowerFilter))
    : GAMES;
  
  grid.innerHTML = '';
  
  if (filtered.length === 0) {
    grid.hidden = true;
    emptyState.hidden = false;
  } else {
    grid.hidden = false;
    emptyState.hidden = true;
    
    const fragment = document.createDocumentFragment();
    filtered.forEach((game, idx) => {
      const card = document.createElement('a');
      card.href = game.path;
      card.className = 'card';
      card.role = 'listitem';
      card.setAttribute('aria-label', game.title);
      
      const iconHtml = getIconForGame(game.title, idx);
      
      card.innerHTML = `
        <div class="icon-wrap" aria-hidden="true">${iconHtml}</div>
        <span class="card-title">${escapeHtml(game.title)}</span>
      `;
      
      fragment.appendChild(card);
    });
    grid.appendChild(fragment);
  }
  
  visibleCount.textContent = filtered.length;
  totalCount.textContent = GAMES.length;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ===== Search Handling ===== */
let searchDebounce = null;
searchInput.addEventListener('input', (e) => {
  const value = e.target.value;
  searchClear.classList.toggle('visible', value.length > 0);
  
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    renderCards(value);
  }, 120);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  renderCards('');
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    searchInput.blur();
    renderCards('');
  }
});

/* ===== Keyboard Navigation ===== */
document.addEventListener('keydown', (e) => {
  if (e.target === searchInput) return;
  if (e.key === '/' || (e.key === 'f' && (e.metaKey || e.ctrlKey))) {
    e.preventDefault();
    searchInput.focus();
  }
});

/* ===== Initial Render ===== */
renderCards();

/* ===== Performance: IntersectionObserver for lazy rendering (optional) ===== */
// Cards are lightweight SVG, so eager render is fine for 225 items

/* ===== Service Worker Registration (optional, for offline) ===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

console.log(`Game Hub loaded: ${GAMES.length} games`);
</script>
