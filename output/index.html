<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(135deg,#16213e 0%,#0f3460 100%);padding:16px 12px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border:none;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:15px;outline:none;transition:background .2s}
.search-wrap input:focus{background:rgba(255,255,255,.18)}
.search-wrap input::placeholder{color:rgba(255,255,255,.45)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.45);font-size:16px;pointer-events:none}
.count{font-size:12px;color:rgba(255,255,255,.5);text-align:right;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 10px 20px;max-width:800px;margin:0 auto}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 16px 24px}}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr);gap:14px;padding:14px 20px 28px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr);gap:16px;padding:16px 24px 32px}}
.card{background:#16213e;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.card:active{transform:scale(.96)}
.icon-wrap{width:108px;height:108px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}
.icon-wrap img{width:86px;height:86px;display:block}
.card-name{font-size:11px;color:rgba(255,255,255,.75);text-align:center;margin-top:6px;line-height:1.3;max-width:108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no-results{text-align:center;padding:60px 20px;color:rgba(255,255,255,.35);font-size:15px;display:none}
</style>
</head>

var grid=document.getElementById("grid");
var search=document.getElementById("search");
var countEl=document.getElementById("count");
var noRes=document.getElementById("noResults");
function render(q){
q=(q||"").toLowerCase().trim();
grid.innerHTML="";
var c=0;
for(var i=0;i<GAMES.length;i++){
var g=GAMES[i];
if(q&&g.n.toLowerCase().indexOf(q)===-1&&g.f.toLowerCase().indexOf(q)===-1)continue;
c++;
var d=document.createElement("div");
d.className="card";
d.onclick=(function(f){return function(){window.location.href="../games-web/"+f}})(g.f);
d.innerHTML="<div class=\"icon-wrap\"><img src=\""+g.i+"\" alt=\""+g.n.replace(/"/g,"&quot;")+"\"></div><div class=\"card-name\">"+g.n+"</div>";
grid.appendChild(d);
}
countEl.textContent=c+" game"+(c!==1?"s":"");
noRes.style.display=c===0?"block":"none";
}
search.addEventListener("input",function(){render(this.value)});
render("");
