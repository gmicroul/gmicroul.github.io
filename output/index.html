  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-start: #5FD0F5;
      --bg-end: #3AA8D0;
      --text: #FFFFFF;
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --card-hover: rgba(255, 255, 255, 0.2);
      --search-bg: rgba(255, 255, 255, 0.15);
      --search-border: rgba(255, 255, 255, 0.3);
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    /* 背景高光效果 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.55) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* 标题区域 */
    .header {
      text-align: center;
      padding: 32px 16px 24px;
    }

    .header h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .game-count {
      margin-top: 8px;
      font-size: clamp(14px, 2.5vw, 16px);
      opacity: 0.9;
      font-weight: 400;
    }

    /* 搜索框 */
    .search-wrapper {
      position: relative;
      max-width: 560px;
      margin: 0 auto 32px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px 16px 52px;
      font-size: 16px;
      color: var(--text);
      background: var(--search-bg);
      border: 2px solid var(--search-border);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .search-input:focus {
      border-color: var(--text);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      opacity: 0.6;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .clear-btn.visible {
      display: flex;
    }

    /* 游戏网格 */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    /* 游戏卡片 */
    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
    }

    .game-card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
    }

    .game-card:active {
      transform: translateY(-2px) scale(0.98);
    }

    /* 图标容器 */
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .game-title {
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .game-card.hidden {
      display: none;
    }

    /* 空状态 */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      opacity: 0.7;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }

    /* 响应式断点 */
    @media (max-width: 480px) {
      .container {
        padding: 16px 12px;
      }

      .header {
        padding: 24px 8px 16px;
      }

      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .game-card {
        padding: 16px 8px;
      }

      .icon-wrapper {
        width: 52px;
        height: 52px;
        font-size: 20px;
        border-radius: 12px;
      }

      .game-title {
        font-size: 12px;
      }

      .search-input {
        padding: 14px 16px 14px 46px;
        font-size: 16px; /* 防止 iOS 缩放 */
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .games-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (min-width: 1025px) and (max-width: 1280px) {
      .games-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    @media (min-width: 1281px) {
      .games-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    /* 入场动画 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game-card {
      animation: fadeInUp 0.4s ease-out backwards;
    }

    .game-card:nth-child(1) { animation-delay: 0ms; }
    .game-card:nth-child(2) { animation-delay: 20ms; }
    .game-card:nth-child(3) { animation-delay: 40ms; }
    .game-card:nth-child(4) { animation-delay: 60ms; }
    .game-card:nth-child(5) { animation-delay: 80ms; }
    .game-card:nth-child(6) { animation-delay: 100ms; }
    .game-card:nth-child(7) { animation-delay: 120ms; }
    .game-card:nth-child(8) { animation-delay: 140ms; }
    .game-card:nth-child(9) { animation-delay: 160ms; }
    .game-card:nth-child(10) { animation-delay: 180ms; }
    .game-card:nth-child(11) { animation-delay: 200ms; }
    .game-card:nth-child(12) { animation-delay: 220ms; }
    .game-card:nth-child(13) { animation-delay: 240ms; }
    .game-card:nth-child(14) { animation-delay: 260ms; }
    .game-card:nth-child(15) { animation-delay: 280ms; }
    .game-card:nth-child(16) { animation-delay: 300ms; }
    .game-card:nth-child(17) { animation-delay: 320ms; }
    .game-card:nth-child(18) { animation-delay: 340ms; }
    .game-card:nth-child(19) { animation-delay: 360ms; }
    .game-card:nth-child(20) { animation-delay: 380ms; }

    /* 减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
      .game-card {
        animation: none;
      }
      .game-card:hover {
        transform: none;
      }
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>

      {"filename":"wheeliebike.html","title":"Wheeliebike"},
      {"filename":"wheely.html","title":"Wheely"},
      {"filename":"wheely2.html","title":"Wheely2"},
      {"filename":"wheely3.html","title":"Wheely3"},
      {"filename":"wheely6.html","title":"Wheely6"},
      {"filename":"wheely8.html","title":"Wheely8"},
      {"filename":"wordleunlimited.html","title":"Wordleunlimited"},
      {"filename":"worldshardestgame.html","title":"Worldshardestgame"},
      {"filename":"worldshardestgame2.html","title":"Worldshardestgame2"},
      {"filename":"worldshardestgame3.html","title":"Worldshardestgame3"},
      {"filename":"wrestlebros.html","title":"Wrestlebros"},
      {"filename":"zombierush.html","title":"Zombierush"},
      {"filename":"index.html","title":"游戏大厅 · Game Hub"}
    ];

    // 16 种图标背景色（轮流使用）
    const iconColors = [
      '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
      '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
      '#F8B500', '#00CED1', '#FF69B4', '#32CD32',
      '#FF8C00', '#9370DB', '#20B2AA', '#FF4500'
    ];

    // 简单的哈希函数，用于根据标题生成固定的字母
    function getInitial(title) {
      let hash = 0;
      for (let i = 0; i < title.length; i++) {
        hash = ((hash << 5) - hash) + title.charCodeAt(i);
        hash |= 0;
      }
      const idx = Math.abs(hash) % 26;
      return String.fromCharCode(65 + idx); // A-Z
    }

    const grid = document.getElementById('gamesGrid');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const gameCount = document.getElementById('gameCount');
    const emptyState = document.getElementById('emptyState');

    // 渲染游戏卡片
    function renderGames(filteredGames) {
      grid.innerHTML = '';
      filteredGames.forEach((game, index) => {
        const colorIndex = index % iconColors.length;
        const initial = getInitial(game.title);
        const bgColor = iconColors[colorIndex];

        const card = document.createElement('a');
        card.href = '/games-web/' + game.filename;
        card.className = 'game-card';
        card.dataset.title = game.title.toLowerCase();
        card.innerHTML = `
          <div class="icon-wrapper" style="background: ${bgColor};">
            ${initial}
          </div>
          <span class="game-title">${escapeHtml(game.title)}</span>
        `;
        grid.appendChild(card);
      });

      // 更新计数
      gameCount.textContent = `共 ${filteredGames.length} 个游戏`;

      // 显示/隐藏空状态
      if (filteredGames.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 搜索过滤
    function filterGames(query) {
      const lowerQuery = query.toLowerCase().trim();
      if (!lowerQuery) return games;

      return games.filter(game =>
        game.title.toLowerCase().includes(lowerQuery) ||
        game.filename.toLowerCase().includes(lowerQuery)
      );
    }

    // 事件监听
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value;
      const filtered = filterGames(query);
      renderGames(filtered);
      clearBtn.classList.toggle('visible', query.length > 0);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      renderGames(games);
      clearBtn.classList.remove('visible');
      searchInput.focus();
    });

    // 初始渲染
    renderGames(games);
  </script>
</body>
