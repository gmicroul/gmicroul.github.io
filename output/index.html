<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Hub</title>
<style>
:root {
  --bg: #000000;
  --fg: #ffffff;
  --fg-dim: #888888;
  --card-bg: #111111;
  --card-border: #222222;
  --search-bg: #1a1a1a;
  --search-border: #333333;
  --accent-cyan: #5FD0F5;
  --accent-pink: #FFD8E0;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

header {
  padding: 24px 16px;
  text-align: center;
  border-bottom: 1px solid var(--card-border);
}

header h1 {
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #5FD0F5 0%, #FFD8E0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stats {
  margin-top: 8px;
  font-size: 14px;
  color: var(--fg-dim);
}

.search-container {
  padding: 16px;
  position: sticky;
  top: 0;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 80%, transparent 100%);
  z-index: 10;
}

.search-wrapper {
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 14px 18px 14px 48px;
  font-size: 16px;
  background: var(--search-bg);
  border: 1px solid var(--search-border);
  border-radius: 14px;
  color: var(--fg);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-input::placeholder {
  color: var(--fg-dim);
}

.search-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(95, 208, 245, 0.15);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--fg-dim);
  pointer-events: none;
  transition: stroke 0.2s;
}

.search-input:focus + .search-icon {
  stroke: var(--accent-cyan);
}

.clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, background 0.2s;
}

.clear-btn:hover {
  background: rgba(255,255,255,0.1);
}

.clear-btn.visible {
  opacity: 1;
  pointer-events: auto;
}

.clear-btn svg {
  width: 16px;
  height: 16px;
  stroke: var(--fg-dim);
}

main {
  flex: 1;
  padding: 0 16px 32px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}

@media (max-width: 480px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
}

@media (min-width: 481px) and (max-width: 768px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
}

@media (min-width: 1025px) {
  .grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }
}

@media (min-width: 1400px) {
  .grid {
    grid-template-columns: repeat(6, 1fr);
  }
}

@media (min-width: 1600px) {
  .grid {
    grid-template-columns: repeat(7, 1fr);
  }
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              border-color 0.2s,
              box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--accent-cyan);
  box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--accent-cyan);
}

.card:active {
  transform: translateY(-2px) scale(1.01);
  transition-duration: 0.1s;
}

.card:focus-visible {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(95, 208, 245, 0.3);
}

.icon-wrapper {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.icon-svg {
  width: 86px;
  height: 86px;
  display: block;
}

.card-title {
  padding: 12px 10px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  hyphens: auto;
}

.card.hidden {
  display: none;
}

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-dim);
}

.empty-state svg {
  width: 64px;
  height: 64px;
  margin-bottom: 16px;
  stroke: var(--fg-dim);
  opacity: 0.5;
}

.empty-state p {
  font-size: 16px;
}

footer {
  padding: 24px 16px;
  text-align: center;
  border-top: 1px solid var(--card-border);
  color: var(--fg-dim);
  font-size: 13px;
}

footer a {
  color: var(--accent-cyan);
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .card,
  .search-input,
  .clear-btn,
  .search-icon {
    transition: none !important;
  }
  .card:hover {
    transform: none;
  }
}

/* High contrast mode */
@media (prefers-contrast: high) {
  :root {
    --card-border: #444444;
    --search-border: #666666;
  }
  .card:hover {
    border-color: #ffffff;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 2px #ffffff;
  }
}
</style>

// ============ Icon Generation ============
function getLetter(title) {
  const words = title.split(/\s+/);
  for (const w of words) {
    const first = w[0];
    if (first && /[A-Za-z0-9]/.test(first)) return first.toUpperCase();
  }
  return title[0]?.toUpperCase() || '?';
}

function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

// SailfishOS-style icon SVG generation
function generateIconSvg(title, index) {
  const letter = getLetter(title);
  const isOdd = index % 2 === 0; // 0-based: 0,2,4 = odd positions (1st, 3rd, 5th)
  const h = hashString(title);
  const hue1 = h % 360;
  const hue2 = (h + 30) % 360;

  // Odd: cyan gradient (#5FD0F5 -> #3AA8D0), no rotation
  // Even: pink gradient (#FFD8E0 -> #FFB0C4), rotated 90deg around center (43,47)
  // Text color: white, except if letter is 'I' then #E85D9E
  const textColor = letter === 'I' ? '#E85D9E' : '#FFFFFF';

  if (isOdd) {
    // Odd pattern (1st, 3rd, 5th...)
    return `<svg class="icon-svg" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
  <defs>
    <linearGradient id="bg${index}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5FD0F5"/>
      <stop offset="100%" stop-color="#3AA8D0"/>
    </linearGradient>
    <radialGradient id="hl${index}" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(0, -4)">
    <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"
          fill="url(#bg${index})"/>
    <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"
          fill="url(#hl${index})"/>
  </g>
  <text x="43" y="50" text-anchor="middle" dominant-baseline="central" fill="${textColor}" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="bold" font-size="29">${letter}</text>
</svg>`;
  } else {
    // Even pattern (2nd, 4th, 6th...) - rotated 90deg around center (43,47)
    return `<svg class="icon-svg" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
  <defs>
    <linearGradient id="bg${index}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFD8E0"/>
      <stop offset="100%" stop-color="#FFB0C4"/>
    </linearGradient>
    <radialGradient id="hl${index}" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="rotate(90 43 47)">
    <g transform="translate(0, -4)">
      <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"
            fill="url(#bg${index})"/>
      <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"
            fill="url(#hl${index})"/>
    </g>
  </g>
  <text x="43" y="50" text-anchor="middle" dominant-baseline="central" fill="${textColor}" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="bold" font-size="29">${letter}</text>
</svg>`;
  }
}

// ============ Render ============
const grid = document.getElementById('grid');
const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-btn');
const emptyState = document.getElementById('empty-state');
const totalCount = document.getElementById('total-count');
const footerCount = document.getElementById('footer-count');
const stats = document.getElementById('stats');

let visibleCount = GAMES.length;

function renderGames(filter = '') {
  const lowerFilter = filter.toLowerCase().trim();
  let count = 0;

  grid.innerHTML = '';

  GAMES.forEach((game, index) => {
    const matches = !lowerFilter || game.title.toLowerCase().includes(lowerFilter);
    if (matches) count++;

    const card = document.createElement('a');
    card.href = game.url;
    card.className = 'card' + (matches ? '' : ' hidden');
    card.dataset.title = game.title.toLowerCase();
    card.setAttribute('aria-label', game.title);

    card.innerHTML = `
      <div class="icon-wrapper">${generateIconSvg(game.title, index)}</div>
      <div class="card-title">${escapeHtml(game.title)}</div>
    `;

    grid.appendChild(card);
  });

  visibleCount = count;
  updateStats();
  emptyState.classList.toggle('hidden', count > 0);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function updateStats() {
  totalCount.textContent = visibleCount;
  footerCount.textContent = visibleCount;
  stats.innerHTML = `共 <span id="total-count">${visibleCount}</span> 个游戏${visibleCount !== GAMES.length ? ` / 全部 ${GAMES.length} 个` : ''}`;
}

// ============ Search ============
let searchDebounce = null;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    renderGames(e.target.value);
    clearBtn.classList.toggle('visible', e.target.value.length > 0);
  }, 80);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  clearBtn.classList.remove('visible');
  renderGames('');
});

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
  }
});

// Initial render
renderGames();
</script>
