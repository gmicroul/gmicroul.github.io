<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏大厅 · Game Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2235;
            --bg-card-hover: #222d45;
            --text-primary: #f5f7f7;
            --text-secondary: #a0aec0;
            --text-muted: #6b7a94;
            --accent-cyan: #19a7ce;
            --accent-teal: #2ebd85;
            --accent-coral: #f0544f;
            --accent-orange: #f59b23;
            --accent-yellow: #ffd34e;
            --accent-purple: #c56cd6;
            --border-color: #2a3a55;
            --shadow-color: rgba(20, 40, 60, 0.25);
            --gradient-1: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%);
            --gradient-2: linear-gradient(135deg, #15966b 0%, #2ebd85 50%, #4fd1a5 100%);
            --gradient-3: linear-gradient(135deg, #c56cd6 0%, #e85d9e 100%);
            --gradient-4: linear-gradient(135deg, #f59b23 0%, #ffd34e 100%);
            --gradient-5: linear-gradient(135deg, #f0544f 0%, #ff6b6b 100%);
            --gradient-6: linear-gradient(135deg, #6366f1 0%, #a5b4fc 100%);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f8fafc;
                --bg-secondary: #ffffff;
                --bg-card: #ffffff;
                --bg-card-hover: #f1f5f9;
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
                --border-color: #e2e8f0;
                --shadow-color: rgba(15, 23, 42, 0.12);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(25, 167, 206, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(46, 189, 133, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(197, 108, 214, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-teal), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 400;
        }

        /* Search Section */
        .search-section {
            padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 4vw, 2rem);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            font-size: 1rem;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 4px rgba(25, 167, 206, 0.15);
        }

        .search-stats {
            margin-top: 0.75rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .search-stats .count {
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .clear-search {
            position: absolute;
            right: 1rem;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: none;
            flex-shrink: 0;
        }

        .clear-search.visible {
            display: block;
        }

        .clear-search:hover {
            color: var(--accent-coral);
        }

        /* Games Grid */
        .games-section {
            padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 4vw, 2rem);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: clamp(0.75rem, 2vw, 1.25rem);
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .games-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1025px) and (max-width: 1400px) {
            .games-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @media (min-width: 1401px) {
            .games-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        /* Game Card */
        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
            box-shadow: 
                0 12px 32px var(--shadow-color),
                0 0 0 1px var(--accent-cyan);
        }

        .game-card:active {
            transform: translateY(-2px);
        }

        .game-card.hidden {
            display: none;
        }

        /* Icon Container - SailfishOS Style */
        .game-icon {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            background: var(--icon-bg, var(--gradient-1));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Shape variations based on index */
        .game-card:nth-child(odd) .game-icon::before,
        .game-card:nth-child(even) .game-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
        }

        /* Odd cards - default orientation */
        .game-card:nth-child(odd) .game-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        /* Even cards - rotated 90deg */
        .game-card:nth-child(even) .game-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            transform: rotate(90deg);
            transform-origin: center;
        }

        /* Squircle mask for icon shape */
        .game-icon .icon-shape {
            width: 82%;
            height: 82%;
            border-radius: 26%;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-icon .icon-shape::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
            border-radius: 28%;
            z-index: -1;
        }

        .game-icon .icon-symbol {
            width: 55%;
            height: 55%;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            background: white;
            opacity: 0.95;
        }

        /* Card Content */
        .game-info {
            padding: 0.875rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-align: center;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* No results */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .no-results svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Footer */
        .footer {
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .game-card,
            .search-input,
            .loading-spinner {
                animation: none;
                transition: none;
            }
            .game-card:hover {
                transform: none;
            }
        }

        /* Focus visible */
        .game-card:focus-visible,
        .search-input:focus-visible,
        .clear-search:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 2px;
        }
    </style>
</head>

            'linear-gradient(135deg, #2ebd85 0%, #f59b23 100%)',
            'linear-gradient(135deg, #6366f1 0%, #f0544f 100%)'
        ];

        // Symbol pool for fallback
        const symbolKeys = Object.keys(iconSymbols);

        // Deterministic hash for consistent assignment
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function getIconData(title) {
            const lowerTitle = title.toLowerCase();
            let matchedCategory = 'default';
            let matchedKeywords = 0;

            for (const [category, keywords] of Object.entries(iconKeywords)) {
                const count = keywords.filter(kw => lowerTitle.includes(kw)).length;
                if (count > matchedKeywords) {
                    matchedKeywords = count;
                    matchedCategory = category;
                }
            }

            const hash = hashString(title);
            const gradient = gradients[hash % gradients.length];
            const symbolKey = iconSymbols[matchedCategory] ? matchedCategory : symbolKeys[hash % symbolKeys.length];

            return {
                gradient,
                symbol: iconSymbols[symbolKey],
                category: matchedCategory
            };
        }

        function createGameCard(game, index) {
            const iconData = getIconData(game.title);
            const card = document.createElement('a');
            card.href = game.url;
            card.className = 'game-card';
            card.dataset.title = game.title.toLowerCase();
            card.style.setProperty('--icon-bg', iconData.gradient);
            card.setAttribute('aria-label', `Play ${game.title}`);

            // Determine rotation for even/odd
            const isEven = (index + 1) % 2 === 0;
            const rotationStyle = isEven ? 'transform: rotate(90deg);' : '';

            card.innerHTML = `
                <div class="game-icon">
                    <div class="icon-shape" style="${rotationStyle}">
                        <svg class="icon-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            ${iconData.symbol}
                        </svg>
                    </div>
                </div>
                <div class="game-info">
                    <h3 class="game-title">${escapeHtml(game.title)}</h3>
                </div>
            `;
            return card;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderGames(filteredGames = games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            if (filteredGames.length === 0) {
                document.getElementById('noResults').style.display = 'block';
            } else {
                document.getElementById('noResults').style.display = 'none';
                const fragment = document.createDocumentFragment();
                filteredGames.forEach((game, index) => {
                    fragment.appendChild(createGameCard(game, index));
                });
                grid.appendChild(fragment);
            }
            updateStats(filteredGames.length);
        }

        function updateStats(visibleCount) {
            document.getElementById('visibleCount').textContent = visibleCount;
            document.getElementById('totalCount').textContent = games.length;
            document.getElementById('footerCount').textContent = games.length;
        }

        function filterGames(query) {
            const lowerQuery = query.toLowerCase().trim();
            if (!lowerQuery) {
                renderGames(games);
                return;
            }
            const filtered = games.filter(game => 
                game.title.toLowerCase().includes(lowerQuery)
            );
            renderGames(filtered);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderGames(games);

            const searchInput = document.getElementById('searchInput');
            const clearSearch = document.getElementById('clearSearch');

            searchInput.addEventListener('input', (e) => {
                const value = e.target.value;
                filterGames(value);
                clearSearch.classList.toggle('visible', value.length > 0);
            });

            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                filterGames('');
                clearSearch.classList.remove('visible');
                searchInput.focus();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape') {
                    searchInput.blur();
                    searchInput.value = '';
                    filterGames('');
                    clearSearch.classList.remove('visible');
                }
            });
        });
    </script>
</body>
</html>
