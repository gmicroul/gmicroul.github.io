<style>
:root {
  --bg: #0a0e14;
  --bg-elevated: #111720;
  --card-bg: #151c28;
  --card-border: #1e2838;
  --fg: #e8ebf0;
  --fg-muted: #8b95a6;
  --accent: #19a7ce;
  --accent-dim: #0e7c8c;
  --accent-glow: rgba(25, 167, 206, 0.35);
  --warm-accent: #f0544f;
  --warm-accent-dim: #c53d38;
  --success: #2ebd85;
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
  --shadow-md: 0 6px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.45);
  --transition: 180ms cubic-bezier(0.2, 0.6, 0.2, 1);
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f3f8;
    --bg-elevated: #ffffff;
    --card-bg: #ffffff;
    --card-border: #e1e6ee;
    --fg: #1a1f2e;
    --fg-muted: #6b7586;
    --accent: #0e7c8c;
    --accent-dim: #15966b;
    --accent-glow: rgba(14, 124, 140, 0.25);
    --shadow-sm: 0 2px 8px rgba(14, 124, 140, 0.08);
    --shadow-md: 0 6px 24px rgba(14, 124, 140, 0.12);
    --shadow-lg: 0 12px 40px rgba(14, 124, 140, 0.16);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-glow) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(240, 84, 79, 0.08) 0%, transparent 50%),
    var(--bg);
  z-index: -1;
  pointer-events: none;
}

.skip-link {
  position: absolute;
  top: -100%;
  left: 1rem;
  padding: 0.75rem 1.25rem;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-m);
  z-index: 1000;
  text-decoration: none;
  font-weight: 600;
  transition: top var(--transition);
}
.skip-link:focus { top: 1rem; }

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, rgba(10, 14, 20, 0.95), rgba(10, 14, 20, 0.7)), var(--bg);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--card-border);
  padding: 1rem clamp(1rem, 4vw, 3rem);
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  align-items: stretch;
}

@media (min-width: 640px) {
  .header-inner { flex-direction: row; align-items: center; justify-content: space-between; }
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: inherit;
}

.brand-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-m);
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.15);
  position: relative;
  overflow: hidden;
}

.brand-icon::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
  transform: translateX(-100%);
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.brand-icon svg { width: 24px; height: 24px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }

.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-title { font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(135deg, var(--fg), var(--fg-muted)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-subtitle { font-size: 0.7rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; }

.search-wrapper {
  position: relative;
  flex: 1;
  max-width: 560px;
  width: 100%;
}

.search-input {
  width: 100%;
  padding: 0.75rem 1rem 0.75rem 2.75rem;
  font-size: 0.95rem;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-l);
  color: var(--fg);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}
.search-input::placeholder { color: var(--fg-muted); opacity: 0.7; }
.search-input:hover { border-color: var(--accent-dim); }
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-sm);
  background: var(--bg-elevated);
}

.search-icon {
  position: absolute;
  left: 0.875rem;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--fg-muted);
  pointer-events: none;
  transition: color var(--transition);
}
.search-input:focus + .search-icon { color: var(--accent); }

.search-clear {
  position: absolute;
  right: 0.625rem;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: var(--fg-muted);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), color var(--transition);
}
.search-clear:hover { background: var(--card-border); color: var(--fg); }
.search-clear.visible { display: flex; }
.search-clear svg { width: 16px; height: 16px; }

.stats {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  font-size: 0.8rem;
  color: var(--fg-muted);
  font-weight: 500;
  white-space: nowrap;
}
.stats strong { color: var(--fg); font-size: 1.1em; }
.stats .accent-count { color: var(--accent); }

.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem clamp(1rem, 4vw, 3rem) 3rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1rem;
}

@media (min-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.25rem; } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.5rem; } }
@media (min-width: 1400px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

.game-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: linear-gradient(145deg, var(--card-bg), var(--bg-elevated));
  border: 1px solid var(--card-border);
  border-radius: var(--radius-l);
  padding: 1.25rem 1rem 1rem;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  overflow: hidden;
  min-height: 220px;
}
.game-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25, 167, 206, 0.08), transparent 60%);
  opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
}
.game-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent-dim);
  z-index: 10;
}
.game-card:hover::before { opacity: 1; }
.game-card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-md);
}
.game-card:active { transform: translateY(-2px) scale(1.01); }

.card-icon {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-m);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 0.875rem;
  position: relative;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08);
  transition: transform var(--transition), box-shadow var(--transition);
}
.game-card:hover .card-icon { transform: scale(1.05); box-shadow: var(--shadow-md); }

.card-icon .icon-svg { width: 42px; height: 42px; color: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

.card-icon::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: calc(var(--radius-m) + 2px);
  background: linear-gradient(135deg, var(--accent), var(--accent-dim), var(--warm-accent));
  opacity: 0;
  filter: blur(8px);
  z-index: -1;
  transition: opacity var(--transition);
}
.game-card:hover .card-icon::after { opacity: 0.4; }

.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  max-width: 100%;
  transition: color var(--transition);
}
.game-card:hover .card-title { color: var(--accent); }

.card-hidden { display: none !important; }

.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
  color: var(--fg-muted);
  border: 2px dashed var(--card-border);
  border-radius: var(--radius-l);
  background: var(--card-bg);
}
.empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }
.empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--fg); margin-bottom: 0.5rem; }
.empty-state p { font-size: 0.9rem; max-width: 320px; }

.footer {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--fg-muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--card-border);
  margin-top: 2rem;
}
.footer a { color: var(--accent); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .brand-icon::before { animation: none; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.game-card { animation: fadeInUp 0.4s ease-out backwards; }
.game-card:nth-child(1) { animation-delay: 0ms; }
.game-card:nth-child(2) { animation-delay: 20ms; }
.game-card:nth-child(3) { animation-delay: 40ms; }
.game-card:nth-child(4) { animation-delay: 60ms; }
.game-card:nth-child(5) { animation-delay: 80ms; }

.game-card:nth-child(9) { animation-delay: 160ms; }
.game-card:nth-child(10) { animation-delay: 180ms; }
.game-card:nth-child(11) { animation-delay: 200ms; }
.game-card:nth-child(12) { animation-delay: 220ms; }
.game-card:nth-child(13) { animation-delay: 240ms; }

.game-card:nth-child(19) { animation-delay: 360ms; }
.game-card:nth-child(20) { animation-delay: 380ms; }

// 为每个游戏确定性地分配图标样式
function getIconForGame(index) {
  const palette = ICON_PALETTES[index % ICON_PALETTES.length];
  const shape = ICON_SHAPES[index % ICON_SHAPES.length];
  return { palette, shape };
}

// 生成 SVG 图标
function generateIconSvg(index) {
  const { palette, shape } = getIconForGame(index);
  const accent = palette.accent;
  const bg = palette.bg;

  // 根据形状类型调整视觉
  let innerSvg = "";
  const strokeWidth = shape.type === "circle" ? "1.5" : shape.type === "organic" ? "1.8" : "2";

  if (shape.type === "circle" || shape.type === "play" || shape.type === "star" || shape.type === "bolt" || shape.type === "heart" || shape.type === "diamond" || shape.type === "hex") {
    innerSvg = `<path d="${shape.d}" fill="${accent}" />`;
  } else if (shape.type === "squircle" || shape.type === "blocks" || shape.type === "shield") {
    innerSvg = `<path d="${shape.d}" fill="${accent}" />`;
  } else if (shape.type === "organic") {
    innerSvg = `<path d="${shape.d}" fill="${accent}" />`;
  } else if (shape.type === "gamepad") {
    innerSvg = `<path d="${shape.d}" fill="none" stroke="${accent}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else {
    innerSvg = `<path d="${shape.d}" fill="${accent}" />`;
  }

  return `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="bg${index}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${palette.bg.split(',')[0].replace('linear-gradient(135deg, ', '')}"/>
        <stop offset="100%" stop-color="${palette.bg.split(',')[1].replace(')', '')}"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="24" height="24" rx="5" fill="url(#bg${index})"/>
    ${innerSvg}
  </svg>`;
}

// 渲染游戏卡片
function renderGames(games) {
  const grid = document.getElementById('gameGrid');
  const emptyState = document.getElementById('emptyState');
  const totalCount = document.getElementById('totalCount');
  const filteredCount = document.getElementById('filteredCount');
  const filteredCountStrong = filteredCount.querySelector('strong');
  const footerCount = document.getElementById('footerCount');

  totalCount.textContent = GAMES.length;
  footerCount.textContent = GAMES.length;

  if (games.length === 0) {
    grid.innerHTML = '';
    emptyState.hidden = false;
    filteredCount.hidden = true;
    return;
  }

  emptyState.hidden = true;
  filteredCount.hidden = false;
  filteredCountStrong.textContent = games.length;

  grid.innerHTML = games.map((game, idx) => {
    const originalIndex = GAMES.findIndex(g => g.file === game.file);
    const iconHtml = generateIconSvg(originalIndex);
    return `<a href="/games-web/${game.file}" class="game-card" role="listitem" data-title="${game.title.toLowerCase()}" aria-label="打开游戏: ${game.title}">
      <div class="card-icon" aria-hidden="true">${iconHtml}</div>
      <span class="card-title">${escapeHtml(game.title)}</span>
    </a>`;
  }).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 搜索功能
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

let searchDebounce = null;

function filterGames(query) {
  const trimmed = query.trim().toLowerCase();
  if (!trimmed) return GAMES;

  return GAMES.filter(game =>
    game.title.toLowerCase().includes(trimmed) ||
    game.file.toLowerCase().includes(trimmed)
  );
}

function handleSearch() {
  const query = searchInput.value;
  searchClear.hidden = !query;

  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    const filtered = filterGames(query);
    renderGames(filtered);
  }, 80);
}

searchInput.addEventListener('input', handleSearch);
searchInput.addEventListener('keyup', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchClear.hidden = true;
    renderGames(GAMES);
    searchInput.blur();
  }
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.hidden = true;
  renderGames(GAMES);
  searchInput.focus();
});

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  renderGames(GAMES);

  // 焦点管理：搜索框获取焦点
  // searchInput.focus(); // 可选：页面加载时自动聚焦搜索框
});

// 键盘快捷键：按 / 聚焦搜索框
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    searchInput.focus();
  }
});
</script>
