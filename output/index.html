<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>Game Hub - 224 Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --shadow: rgba(0, 0, 0, 0.4);
      --gradient-odd-start: #5FD0F5;
      --gradient-odd-end: #3AA8D0;
      --gradient-even-start: #FFD8E0;
      --gradient-even-end: #FFB0C4;
      --highlight-color: #E85D9E;
    }
    
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --bg-secondary: #f6f8fa;
        --bg-card: #ffffff;
        --border: #d0d7de;
        --text: #24292f;
        --text-muted: #656d76;
        --shadow: rgba(0, 0, 0, 0.1);
      }
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    
    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    
    /* Header */
    header {
      margin-bottom: 24px;
      text-align: center;
    }
    
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--gradient-odd-start), var(--gradient-even-start));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    
    .stats {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    
    /* Search */
    .search-container {
      margin-bottom: 24px;
      position: relative;
    }
    
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      font-size: 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }
    
    .search-input::placeholder {
      color: var(--text-muted);
    }
    
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }
    
    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    
    .clear-btn:hover {
      background: var(--bg-card);
      color: var(--text);
    }
    
    .clear-btn.visible {
      display: flex;
    }
    
    /* Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    
    @media (max-width: 480px) {
      .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    
    @media (min-width: 481px) and (max-width: 768px) {
      .games-grid { grid-template-columns: repeat(3, 1fr); }
    }
    
    @media (min-width: 769px) and (max-width: 1024px) {
      .games-grid { grid-template-columns: repeat(5, 1fr); }
    }
    
    @media (min-width: 1025px) and (max-width: 1400px) {
      .games-grid { grid-template-columns: repeat(7, 1fr); }
    }
    
    @media (min-width: 1401px) {
      .games-grid { grid-template-columns: repeat(8, 1fr); }
    }
    
    /* Game Card */
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 200px;
    }
    
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px var(--shadow);
      border-color: var(--accent);
    }
    
    .game-card:active {
      transform: translateY(-2px);
    }
    
    .game-card.hidden {
      display: none;
    }
    
    /* Icon Container */
    .icon-wrapper {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .icon-svg {
      width: 86px;
      height: 86px;
    }
    
    /* Card Content */
    .card-content {
      padding: 14px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    
    .game-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    
    /* Loading state */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* No results */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    
    .no-results svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    /* Footer */
    footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    
    footer a:hover {
      text-decoration: underline;
    }
    
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .game-card { transition: none; }
      .spinner { animation: none; }
      .search-input { transition: none; }
    }
  </style>
</head>

    // SVG icons cache
    const iconCache = new Map();
    
    function generateIconSvg(index, title) {
      const cacheKey = `${index}-${title.charAt(0).toUpperCase()}`;
      if (iconCache.has(cacheKey)) {
        return iconCache.get(cacheKey);
      }
      
      const isOdd = index % 2 === 1; // 1-based index
      const firstChar = title.charAt(0).toUpperCase();
      const textColor = (firstChar === 'I') ? '#E85D9E' : '#FFFFFF';
      
      // Gradient IDs
      const bgGradId = `bgGrad${index}`;
      const highlightGradId = `highlightGrad${index}`;
      
      let svg = '';
      
      if (isOdd) {
        // Odd: no rotation
        svg = `<svg class="icon-svg" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="${bgGradId}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#5FD0F5"/>
              <stop offset="100%" stop-color="#3AA8D0"/>
            </linearGradient>
            <radialGradient id="${highlightGradId}" cx="0.25" cy="0.25" r="0.6">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g transform="translate(0, -4)">
            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${bgGradId})"/>
            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${highlightGradId})"/>
            <text x="43" y="47" text-anchor="middle" dominant-baseline="central" fill="${textColor}" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="bold" font-size="29">${firstChar}</text>
          </g>
        </svg>`;
      } else {
        // Even: rotate 90deg around center (43, 47), text not rotated
        svg = `<svg class="icon-svg" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="${bgGradId}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFD8E0"/>
              <stop offset="100%" stop-color="#FFB0C4"/>
            </linearGradient>
            <radialGradient id="${highlightGradId}" cx="0.25" cy="0.25" r="0.6">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g transform="translate(0, -4) rotate(90 43 47)">
            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${bgGradId})"/>
            <path d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#${highlightGradId})"/>
          </g>
          <text x="43" y="47" text-anchor="middle" dominant-baseline="central" fill="${textColor}" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="bold" font-size="29">${firstChar}</text>
        </svg>`;
      }
      
      iconCache.set(cacheKey, svg);
      return svg;
    }
    
    function renderGames(filteredGames) {
      const grid = document.getElementById('games-grid');
      const noResults = document.getElementById('no-results');
      const countEl = document.getElementById('game-count');
      
      countEl.textContent = filteredGames.length;
      
      if (filteredGames.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = filteredGames.map((game, i) => {
        const displayIndex = i + 1;
        const iconSvg = generateIconSvg(displayIndex, game.title);
        return `<a href="${game.url}" class="game-card" target="_blank" rel="noopener" aria-label="${game.title}">
          <div class="icon-wrapper">${iconSvg}</div>
          <div class="card-content">
            <div class="game-title">${escapeHtml(game.title)}</div>
          </div>
        </a>`;
      }).join('');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Search functionality
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    
    let debounceTimer = null;
    
    searchInput.addEventListener('input', function() {
      const value = this.value.trim().toLowerCase();
      clearBtn.classList.toggle('visible', value.length > 0);
      
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const filtered = games.filter(game => 
          game.title.toLowerCase().includes(value)
        );
        renderGames(filtered);
      }, 80);
    });
    
    clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      this.classList.remove('visible');
      searchInput.focus();
      renderGames(games);
    });
    
    // Initial render
    renderGames(games);
    
    // Keyboard shortcut: '/' to focus search
    document.addEventListener('keydown', function(e) {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        searchInput.blur();
        if (searchInput.value) {
          searchInput.value = '';
          clearBtn.classList.remove('visible');
          renderGames(games);
        }
      }
    });
  </script>
