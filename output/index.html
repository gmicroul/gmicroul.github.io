<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-start: #5FD0F5;
            --bg-end: #3AA8D0;
            --text-primary: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.2);
            --card-hover-bg: rgba(255, 255, 255, 0.2);
            --search-bg: rgba(255, 255, 255, 0.15);
            --search-border: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Radial gradient highlight overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle at 25% 25%,
                rgba(255, 255, 255, 0.55) 0%,
                rgba(255, 255, 255, 0) 60%
            );
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
            padding: 16px 0;
        }

        .header h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: clamp(14px, 2.5vw, 18px);
            color: rgba(255, 255, 255, 0.85);
            margin-top: 8px;
            font-weight: 400;
        }

        /* Search Section */
        .search-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 520px;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            font-size: 16px;
            color: var(--text-primary);
            background: var(--search-bg);
            border: 2px solid var(--search-border);
            border-radius: 50px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-input:focus {
            border-color: var(--text-primary);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 2;
            fill: none;
            pointer-events: none;
        }

        .game-count {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            white-space: nowrap;
            padding: 0 8px;
        }

        .game-count span {
            font-weight: 700;
            font-size: 18px;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 8px 4px 24px;
        }

        /* Game Card */
        .game-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .game-card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }

        .game-card:active {
            transform: translateY(-1px) scale(0.99);
        }

        .game-card.hidden {
            display: none;
        }

        /* Icon placeholder - CSS generated letter avatar */
        .game-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .game-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        /* 16 color variations for cycling through icons */
        .game-icon.icon-0 { background: linear-gradient(135deg, #6C5CE7, #A29BFE); }
        .game-icon.icon-1 { background: linear-gradient(135deg, #00CEC9, #81ECEC); }
        .game-icon.icon-2 { background: linear-gradient(135deg, #FD79A8, #FAB1A0); }
        .game-icon.icon-3 { background: linear-gradient(135deg, #FDCB6E, #FFEAA7); }
        .game-icon.icon-4 { background: linear-gradient(135deg, #55EFC4, #81ECEC); }
        .game-icon.icon-5 { background: linear-gradient(135deg, #A29BFE, #DDB2FF); }
        .game-icon.icon-6 { background: linear-gradient(135deg, #FF7675, #FFB8B8); }
        .game-icon.icon-7 { background: linear-gradient(135deg, #74B9FF, #A8D9FF); }
        .game-icon.icon-8 { background: linear-gradient(135deg, #E17055, #FFB89A); }
        .game-icon.icon-9 { background: linear-gradient(135deg, #00B894, #55EFC4); }
        .game-icon.icon-10 { background: linear-gradient(135deg, #6C5CE7, #B8A9FF); }
        .game-icon.icon-11 { background: linear-gradient(135deg, #E84393, #FF9FD6); }
        .game-icon.icon-12 { background: linear-gradient(135deg, #0984E3, #74B9FF); }
        .game-icon.icon-13 { background: linear-gradient(135deg, #2D3436, #636E72); }
        .game-icon.icon-14 { background: linear-gradient(135deg, #D63031, #FF6B6B); }
        .game-icon.icon-15 { background: linear-gradient(135deg, #F39C12, #FDCB6E); }

        .game-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            max-width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* No results */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .no-results svg {
            width: 64px;
            height: 64px;
            stroke: rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
        }

        .no-results p {
            font-size: 16px;
            font-weight: 500;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 16px;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .game-icon {
                width: 56px;
                height: 56px;
                font-size: 20px;
                border-radius: 12px;
            }

            .game-title {
                font-size: 13px;
            }

            .search-section {
                flex-direction: column;
                gap: 10px;
            }

            .search-wrapper {
                max-width: 100%;
                min-width: 100%;
            }

            .game-count {
                order: -1;
            }
        }

        @media (min-width: 1200px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .game-card,
            .search-input {
                transition: none;
            }
        }

        /* Focus visible for accessibility */
        .game-card:focus-visible,
        .search-input:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.8);
            outline-offset: 3px;
        }
    </style>
</head>

        // Generate a letter from the game title for the icon
        function getInitial(title) {
            const match = title.match(/[A-Za-z]/);
            return match ? match[0].toUpperCase() : '?';
        }

        // Create game card element
        function createGameCard(game, index) {
            const card = document.createElement('a');
            card.href = game.url;
            card.className = 'game-card';
            card.dataset.title = game.title.toLowerCase();
            
            const iconIndex = index % 16;
            const initial = getInitial(game.title);
            
            card.innerHTML = `
                <div class="game-icon icon-${iconIndex}" aria-hidden="true">${initial}</div>
                <div class="game-title">${escapeHtml(game.title)}</div>
            `;
            
            return card;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Render all games
        function renderGames(filter = '') {
            const grid = document.getElementById('gamesGrid');
            const noResults = document.getElementById('noResults');
            const visibleCount = document.getElementById('visibleCount');
            
            const filteredGames = games.filter(game => 
                game.title.toLowerCase().includes(filter.toLowerCase())
            );
            
            visibleCount.textContent = filteredGames.length;
            
            if (filteredGames.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            
            // Use DocumentFragment for better performance
            const fragment = document.createDocumentFragment();
            filteredGames.forEach((game, index) => {
                fragment.appendChild(createGameCard(game, index));
            });
            
            grid.innerHTML = '';
            grid.appendChild(fragment);
        }

        // Search input handler with debounce
        let debounceTimer;
        const searchInput = document.getElementById('searchInput');
        
        searchInput.addEventListener('input', function(e) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                renderGames(e.target.value.trim());
            }, 80);
        });

        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            renderGames();
            
            // Focus search input on load (optional, for better UX)
            // searchInput.focus();
        });

        // Keyboard navigation: Escape clears search
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                searchInput.blur();
                renderGames('');
            }
        });
    </script>
