<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMicroul Games</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    background: linear-gradient(135deg, #f3f7fb 0%, #e8f4f8 100%);
    color: #132238;
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px) saturate(120%);
    background: rgba(255,255,255,0.78);
    border-bottom: 1px solid rgba(20,40,60,0.06);
    box-shadow: 0 6px 18px rgba(20,40,60,0.04);
  }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 16px;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 42px; height: 42px;
    background: linear-gradient(140deg, #19A7CE, #2EBD85);
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    box-shadow: 0 10px 24px rgba(31,160,160,0.18);
  }
  .title {
    font-weight: 800;
    letter-spacing: 0.2px;
    font-size: 28px;
    background: linear-gradient(140deg, #0E7C8C, #2EBD85);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    color: #4f647a;
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  .searchbox {
    flex: 1 1 260px;
    min-width: 240px;
    position: relative;
  }
  .searchbox input {
    width: 100%;
    height: 46px;
    border-radius: 999px;
    border: 1px solid rgba(20,40,60,0.08);
    padding: 0 18px 0 44px;
    font-size: 15px;
    background: white;
    color: #152236;
    outline: none;
    box-shadow: 0 10px 24px rgba(20,40,60,0.04), inset 0 0 0 1px rgba(20,40,60,0.03);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .searchbox input:focus {
    border-color: #4FC3F7;
    box-shadow: 0 10px 28px rgba(79,195,247,0.25);
  }
  .searchbox .icon-search {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    color: #7a8fa2;
    pointer-events: none;
  }

  .resultsbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .resultsbar .count {
    font-size: 13px;
    color: #5e758b;
    background: rgba(255,255,255,0.7);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(20,40,60,0.08);
  }
  .resultsbar .count b { color: #0E7C8C; }

  .chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: white;
    border: 1px solid rgba(20,40,60,0.08);
    color: #2a3d50;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
  }
  .chip.active {
    background: linear-gradient(140deg, #0E7C8C, #19A7CE);
    color: white;
    border-color: transparent;
    box-shadow: 0 12px 24px rgba(14,124,140,0.28);
  }
  .chip:hover { transform: translateY(-1px); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    padding: 18px 0 40px;
  }
  @media (min-width: 720px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; padding: 22px 0 50px; }
  }

  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(255,255,255,0.72));
    border: 1px solid rgba(20,40,60,0.06);
    border-radius: 22px;
    padding: 14px;
    box-shadow: 0 18px 40px rgba(20,40,60,0.07);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 28px 60px rgba(20,40,60,0.14);
    border-color: rgba(79,195,247,0.45);
  }

  .icon {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #edf5f7;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { display: block; }

  .game-name {
    margin-top: 12px;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.35;
    color: #142334;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .game-id {
    margin-top: 4px;
    font-size: 11px;
    color: #889cb1;
    font-weight: 500;
  }

  .empty {
    display: none;
    grid-column: 1 / -1;
    padding: 40px 10px;
    text-align: center;
    color: #7a8fa2;
    font-weight: 500;
  }
  .empty.show { display: block; }

  footer {
    text-align: center;
    padding: 14px 10px 28px;
    color: #7a8fa2;
    font-size: 12px;
  }
</style>
</head>

function iconFor(name,i){
  return iconSVG(name,i);
}

const PALETTES = [
  ["#19A7CE","#0E6A78","#FFFFFF"],
  ["#2EBD85","#177D4D","#FFFFFF"],
  ["#4FC3F7","#1479A3","#FFFFFF"],
  ["#F0544F","#A8312D","#FFFFFF"],
  ["#F59B23","#A65D15","#FFFFFF"],
  ["#C56CD6","#9B428F","#FFFFFF"],
  ["#15966B","#0D4A3A","#FFFFFF"],
  ["#0E7C8C","#052F36","#FFFFFF"]
];

const SYMBOLS = ['&#9679;','&#9681;','&#9651;','&#9650;','&#9711;','&#10070;','&#10023;','&#10053;','&#10055;','&#10067;']; // filled shapes matter less — we draw symbol in SVG

function hashCode(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return Math.abs(h);}

function iconSymbolSVG(seed){
  // Produce small SVG code with a symbol in negative space
  const r = hashCode(seed);
  const pick = r % 4;
  // We always return a viewBox="0 0 64 64" SVG.
  // background rect + one negative symbol 
  // Use fill-rule: evenodd for negative shaping.
  let symbol = '';
  if(pick === 0){
    // circle negative
    const cx=32,cy=32,rad=18;
    symbol = `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="white" opacity="0.92"/>`;
  } else if(pick === 1){
    // rounded rect negative
    symbol = `<rect x="14" y="14" width="36" height="36" rx="10" fill="white" opacity="0.92"/>`;
  } else if(pick === 2){
    // rounded diamond-ish
    symbol = `<polygon points="32,12 52,32 32,52 12,32" fill="white" opacity="0.92"/>`;
  } else {
    // pill negative
    symbol = `<rect x="12" y="22" width="40" height="20" rx="10" fill="white" opacity="0.92"/>`;
  }
  return symbol;
}

function iconSVG(name,seed){
  const h = hashCode(name + seed);
  const pal = PALETTES[h % PALETTES.length];
  const bg = pal[0], mid = pal[1], fg = pal[2];
  const detail = pal[2];

  // Use squircle-ish base via a path with rounded corners (control points)
  // Simplified squircle via 4 cubic bezier arcs
  const S = 64, m = 12, q = 52;
  const squirclePath = [
    `m ${m} 6`,
    `c 11 0 18.6 3.7 21.4 9.2`,
    `c 1.7 3.4 1.6 7.6 -0.1 11.1`,
    `c -1.2 2.5 -3.7 6.1 -7.3 9.3`,
    `c -3.4 2.9 -8 5.4 -13.3 6.2`,
    `c -2.7 0.4 -5.6 -0.1 -8.1 -1.5`,
    `c -2.1 -1.2 -3.7 -3.2 -4.6 -5.6`,
    `c -1.2 -3.1 -1.4 -6.7 -0.3 -9.9`,
    `c 1 -3 3.3 -5.4 6.4 -6.9`,
    `c 2.8 -1.3 6.1 -1.7 9.1 -0.9`,
    `c 0.9 0.2 1.8 0.6 2.5 1.1`,
  ].join(' ');

  const starOrMark = iconSymbolSVG(name + seed);
  // random rotation looks better
  const rot = h % 2 === 0 ? '' : ' transform="rotate(30 32 32)"';

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
  <defs>
    <linearGradient id="g${seed}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="${bg}"/>
      <stop offset="100%" stop-color="${mid}"/>
    </linearGradient>
  </defs>
  <path d="${squirclePath}" fill="url(#g${seed})" />
  <g${rot}>${starOrMark}</g>
</svg>`;
}

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const q = document.getElementById('q');
const empty = document.getElementById('empty');
const subtitle = document.getElementById('subtitle');

const all = GAMES.slice();
let visible = all;

function render(list){
  grid.innerHTML = '';
  countEl.innerHTML = `<b>${list.length}</b> games`;
  subtitle.textContent = list.length + ' titles ready';
  if(!list.length){
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');
  const frag = document.createDocumentFragment();
  list.forEach((g, idx) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.url;
    a.rel = 'noopener';
    a.target = '_self';
    a.title = g.name;
    const iconWrap = document.createElement('div');
    iconWrap.className = 'icon';
    iconWrap.innerHTML = iconFor(g.name, idx);
    const nm = document.createElement('div');
    nm.className = 'game-name';
    nm.textContent = g.name;
    const id = document.createElement('div');
    id.className = 'game-id';
    id.textContent = g.url.replace('/games-web/','');
    a.appendChild(iconWrap);
    a.appendChild(nm);
    a.appendChild(id);
    frag.appendChild(a);
  });
  grid.appendChild(frag);
}

function applyFilter(t){
  const term = t.trim().toLowerCase();
  if(!term){ visible = all; }
  else {
    visible = all.filter(g => g.name.toLowerCase().includes(term) || g.url.toLowerCase().includes(term));
  }
  render(visible);
}

q.addEventListener('input', e => applyFilter(e.target.value));
render(all);
})();
