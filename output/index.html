<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · SFOS Style</title>
<style>
  :root{
    --bg1:#06131F; --bg2:#0B2233;
    --card:#102E42; --card2:#143852;
    --line:rgba(88,206,255,.16); --line-hi:rgba(88,206,255,.55);
    --text:#EAF5FC; --dim:#82A6BB;
    --acc:#41C8F5; --acc2:#2EE6A8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;color:var(--text);min-height:100vh;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(6,19,31,.85);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:14px 18px;
  }
  .bar{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .logo{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
  .logo svg{width:32px;height:32px;flex:none}
  .logo em{font-style:normal;background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;font-size:10px;font-weight:500;color:var(--dim);letter-spacing:2px}
  .count{
    font-size:12.5px;color:var(--dim);background:rgba(65,200,245,.08);
    border:1px solid var(--line);padding:5px 12px;border-radius:999px;white-space:nowrap;
  }
  .count b{color:var(--acc);font-weight:700}
  .search{margin-left:auto;flex:1;min-width:180px;max-width:400px;position:relative}
  .search input{
    width:100%;padding:10px 16px 10px 40px;border-radius:999px;
    border:1px solid var(--line);background:rgba(16,46,66,.9);
    color:var(--text);font-size:15px;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(65,200,245,.18)}
  .search input::placeholder{color:var(--dim)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
  main{max-width:1180px;margin:0 auto;padding:26px 18px 64px}
  .grid{
    display:grid;gap:20px 12px;
    grid-template-columns:repeat(2,minmax(0,1fr));
    justify-items:center;
  }
  @media(min-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));justify-items:stretch;gap:26px 18px}
  }
  .cell{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    text-decoration:none;color:var(--text);outline:none;
  }
  .tile{
    width:108px;height:108px;border-radius:20px;
    display:grid;place-items:center;
    background:linear-gradient(150deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line);
    box-shadow:0 6px 16px rgba(2,10,18,.45);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .tile img{width:86px;height:86px;display:block;pointer-events:none}
  .cell:hover .tile,.cell:focus-visible .tile{
    transform:translateY(-5px);
    border-color:var(--line-hi);
    box-shadow:0 16px 34px rgba(2,10,18,.55),0 0 0 3px rgba(65,200,245,.14);
  }
  .name{
    font-size:12.5px;font-weight:600;text-align:center;line-height:1.3;
    max-width:132px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:2.6em;
  }
  .empty{display:none;text-align:center;color:var(--dim);padding:80px 0;font-size:15px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:0 0 34px;opacity:.75}
  footer b{color:var(--acc);font-weight:600}
</style>
</head>

          <path d="M277.1 0 L512 0 L512 234.9 A512 512 0 0 0 234.9 512 L0 512 L0 277.1 A512 512 0 0 0 277.1 0 Z" fill="url(#hg)"/>
          <path d="M150 352 L150 160 L198 160 L198 252 L312 160 L374 160 L246 258 L380 352 L318 352 L212 268 L198 268 L198 352 Z" fill="#06222C"/>

      <span>游戏<em>大厅</em><small>SAILFISH OS STYLE</small></span>

    <span class="count" id="count"></span>

      <input id="q" type="search" placeholder="搜索游戏… / Search games" autocomplete="off" aria-label="搜索游戏">
    </div>
  </div>
</header>
<main>

var grid=document.getElementById("grid");
var cards=[];
GAMES.forEach(function(g){
  var a=document.createElement("a");
  a.className="cell";
  a.href=g.h;
  a.target="_blank"; a.rel="noopener";
  var t=document.createElement("span"); t.className="tile";
  var im=document.createElement("img");
  im.src=g.i; im.alt=g.n; im.width=86; im.height=86; im.loading="lazy";
  t.appendChild(im);
  var n=document.createElement("span"); n.className="name";
  n.textContent=g.n;
  a.appendChild(t); a.appendChild(n);
  grid.appendChild(a);
  cards.push({el:a,name:g.n.toLowerCase(),file:g.h.toLowerCase()});
});

var countEl=document.getElementById("count");
var footEl=document.getElementById("footCount");
var emptyEl=document.getElementById("empty");
var total=GAMES.length;
function setCount(n){
  countEl.innerHTML=n+" / "+total+" 款";
  footEl.textContent=n;
}
setCount(total);

var q=document.getElementById("q");
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase(),shown=0;
  cards.forEach(function(c){
    var hit=!v||c.name.indexOf(v)!==-1||c.file.indexOf(v)!==-1;
    c.el.style.display=hit?"":"none";
    if(hit)shown++;
  });
  setCount(shown);
  emptyEl.style.display=shown?"none":"block";
});
document.addEventListener("keydown",function(e){
  if(e.key==="/" && document.activeElement!==q){e.preventDefault();q.focus();}
});
})();
