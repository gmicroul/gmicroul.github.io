<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Chaos - 停车大混乱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #eee;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .stat-value.moves { color: #feca57; }
        .stat-value.time { color: #48dbfb; }
        .stat-value.best { color: #1dd1a1; }

        #gameCanvas {
            border-radius: 12px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 0 100px rgba(0, 0, 0, 0.3);
            background: #0d1426;
            cursor: grab;
            touch-action: none;
        }

        #gameCanvas:active {
            cursor: grabbing;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
            color: white;
            box-shadow: 0 4px 15px rgba(29, 209, 161, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 209, 161, 0.6);
        }

        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .message-overlay.show {
            display: flex;
        }

        .message-box {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px 60px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
        }

        .message-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .message-title.win {
            background: linear-gradient(90deg, #1dd1a1, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-title.lose {
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .message-stat {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .message-stat-label {
            font-size: 0.8rem;
            color: #888;
        }

        .message-stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #ccc;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-box {
            animation: slideIn 0.4s ease-out;
        }

        .car-selected {
            animation: pulse 0.5s ease-in-out infinite;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .stats-bar { gap: 15px; padding: 10px 20px; }
            .stat-value { font-size: 1.2rem; }
            .message-box { padding: 30px 20px; }
            .message-title { font-size: 1.8rem; }
            button { padding: 10px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Parking Chaos</h1>
        <p class="subtitle">把所有车开出停车场 · 每次游戏地图随机生成</p>
        
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">移动步数</span>
                <span class="stat-value moves" id="moveCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">用时</span>
                <span class="stat-value time" id="timer">00:00</span>
            </div>
            <div class="stat">
                <span class="stat-label">最佳记录</span>
                <span class="stat-value best" id="bestRecord">--:-- / --</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <div class="controls">
            <button class="btn-primary" id="restartBtn">重新开始</button>
            <button class="btn-secondary" id="undoBtn">撤销</button>
            <button class="btn-success" id="hintBtn">提示</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #ff6b6b, #ee5a5a);"></div>
                <span>主车 (目标)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #48dbfb, #0abde3);"></div>
                <span>横向车辆</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #ff9ff3, #f368e0);"></div>
                <span>纵向车辆</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #feca57, #ffdd40);"></div>
                <span>出口</span>
            </div>
        </div>
    </div>

    <div class="message-overlay" id="winOverlay">
        <div class="message-box">
            <h2 class="message-title win">通关成功！🎉</h2>
            <div class="message-stats">
                <div class="message-stat">
                    <span class="message-stat-label">移动步数</span>
                    <span class="message-stat-value" id="finalMoves">0</span>
                </div>
                <div class="message-stat">
                    <span class="message-stat-label">用时</span>
                    <span class="message-stat-value" id="finalTime">00:00</span>
                </div>
            </div>
            <button class="btn-primary" onclick="restartGame()">下一关</button>
        </div>
    </div>

    <script>
        // 游戏配置
        const GRID_SIZE = 6;
        const CELL_SIZE = 500 / GRID_SIZE;
        const CAR_COLORS = {
            main: ['#ff6b6b', '#ee5a5a'],
            horizontal: ['#48dbfb', '#0abde3'],
            vertical: ['#ff9ff3', '#f368e0'],
            exit: ['#feca57', '#ffdd40']
        };

        // 游戏状态
        let cars = [];
        let selectedCar = null;
        let dragStart = null;
        let moveCount = 0;
        let startTime = null;
        let timerInterval = null;
        let gameWon = false;
        let moveHistory = [];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const moveCountEl = document.getElementById('moveCount');
        const timerEl = document.getElementById('timer');
        const bestRecordEl = document.getElementById('bestRecord');
        const winOverlay = document.getElementById('winOverlay');
        const finalMovesEl = document.getElementById('finalMoves');
        const finalTimeEl = document.getElementById('finalTime');

        // 车辆类
        class Car {
            constructor(id, x, y, length, orientation, isMain = false) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.length = length;
                this.orientation = orientation; // 'horizontal' 或 'vertical'
                this.isMain = isMain;
                this.color = isMain ? CAR_COLORS.main : (orientation === 'horizontal' ? CAR_COLORS.horizontal : CAR_COLORS.vertical);
            }

            getCells() {
                const cells = [];
                for (let i = 0; i < this.length; i++) {
                    if (this.orientation === 'horizontal') {
                        cells.push({x: this.x + i, y: this.y});
                    } else {
                        cells.push({x: this.x, y: this.y + i});
                    }
                }
                return cells;
            }

            canMove(dir, allCars) {
                const cells = this.getCells();
                let testX = this.x;
                let testY = this.y;

                if (this.orientation === 'horizontal') {
                    testX += dir;
                } else {
                    testY += dir;
                }

                // 检查边界
                if (this.orientation === 'horizontal') {
                    if (testX < 0 || testX + this.length > GRID_SIZE) return false;
                } else {
                    if (testY < 0 || testY + this.length > GRID_SIZE) return false;
                }

                // 检查碰撞
                const newCells = [];
                for (let i = 0; i < this.length; i++) {
                    if (this.orientation === 'horizontal') {
                        newCells.push({x: testX + i, y: testY});
                    } else {
                        newCells.push({x: testX, y: testY + i});
                    }
                }

                for (const car of allCars) {
                    if (car.id === this.id) continue;
                    const otherCells = car.getCells();
                    for (const nc of newCells) {
                        for (const oc of otherCells) {
                            if (nc.x === oc.x && nc.y === oc.y) return false;
                        }
                    }
                }
                return true;
            }

            move(dir) {
                if (this.orientation === 'horizontal') {
                    this.x += dir;
                } else {
                    this.y += dir;
                }
            }

            isAtExit() {
                if (!this.isMain) return false;
                // 主车在最右列且朝右
                return this.orientation === 'horizontal' && this.x + this.length === GRID_SIZE;
            }
        }

        // 生成随机关卡
        function generateLevel() {
            cars = [];
            const occupied = new Array(GRID_SIZE).fill(null).map(() => new Array(GRID_SIZE).fill(false));
            let carId = 0;

            // 1. 放置主车 (长度2，横向，第2或3行)
            const mainRow = Math.floor(Math.random() * 2) + 2; // 第2或3行 (0-indexed: 2, 3)
            const mainCar = new Car(carId++, 0, mainRow, 2, 'horizontal', true);
            cars.push(mainCar);
            markOccupied(occupied, mainCar);

            // 2. 随机放置其他车辆
            const numOtherCars = Math.floor(Math.random() * 5) + 4; // 4-8辆其他车
            
            for (let i = 0; i < numOtherCars; i++) {
                const orientation = Math.random() < 0.5 ? 'horizontal' : 'vertical';
                const length = Math.random() < 0.7 ? 2 : 3; // 70%长度2，30%长度3
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < 50) {
                    attempts++;
                    let x, y;

                    if (orientation === 'horizontal') {
                        x = Math.floor(Math.random() * (GRID_SIZE - length + 1));
                        y = Math.floor(Math.random() * GRID_SIZE);
                    } else {
                        x = Math.floor(Math.random() * GRID_SIZE);
                        y = Math.floor(Math.random() * (GRID_SIZE - length + 1));
                    }

                    // 检查是否与主车重叠
                    if (orientation === 'horizontal' && y === mainRow && x < 2) continue;

                    const testCar = new Car(-1, x, y, length, orientation);
                    if (canPlace(occupied, testCar)) {
                        const car = new Car(carId++, x, y, length, orientation);
                        cars.push(car);
                        markOccupied(occupied, car);
                        placed = true;
                    }
                }
            }

            // 确保主车有解（至少出口路径上没有完全阻挡）
            ensureSolvable();
        }

        function markOccupied(occupied, car) {
            const cells = car.getCells();
            for (const cell of cells) {
                if (cell.x >= 0 && cell.x < GRID_SIZE && cell.y >= 0 && cell.y < GRID_SIZE) {
                    occupied[cell.y][cell.x] = true;
                }
            }
        }

        function canPlace(occupied, car) {
            const cells = car.getCells();
            for (const cell of cells) {
                if (cell.x < 0 || cell.x >= GRID_SIZE || cell.y < 0 || cell.y >= GRID_SIZE) return false;
                if (occupied[cell.y][cell.x]) return false;
            }
            return true;
        }

        function ensureSolvable() {
            // 简单确保：检查主车右侧是否有路径，如果完全堵死则移除阻挡车
            const mainCar = cars.find(c => c.isMain);
            let blocked = false;
            
            for (let x = mainCar.x + mainCar.length; x < GRID_SIZE; x++) {
                for (const car of cars) {
                    if (car.id === mainCar.id) continue;
                    const cells = car.getCells();
                    for (const cell of cells) {
                        if (cell.x === x && cell.y === mainCar.y) {
                            blocked = true;
                            break;
                        }
                    }
                    if (blocked) break;
                }
                if (blocked) break;
            }

            // 如果被堵，尝试移动阻挡的纵向车辆
            if (blocked) {
                for (const car of cars) {
                    if (car.id === mainCar.id) continue;
                    if (car.orientation === 'vertical') {
                        const cells = car.getCells();
                        for (const cell of cells) {
                            if (cell.y === mainCar.y && cell.x >= mainCar.x + mainCar.length) {
                                // 尝试向上或向下移动
                                if (car.y > 0 && canMoveCar(car, -1)) {
                                    car.y--;
                                    return;
                                }
                                if (car.y + car.length < GRID_SIZE && canMoveCar(car, 1)) {
                                    car.y++;
                                    return;
                                }
                            }
                        }
                    }
                }
            }
        }

        function canMoveCar(car, dir) {
            if (car.orientation === 'horizontal') {
                const newX = car.x + dir;
                if (newX < 0 || newX + car.length > GRID_SIZE) return false;
            } else {
                const newY = car.y + dir;
                if (newY < 0 || newY + car.length > GRID_SIZE) return false;
            }
            // 检查碰撞
            for (const other of cars) {
                if (other.id === car.id) continue;
                const cells = other.getCells();
                const testCells = car.orientation === 'horizontal' 
                    ? Array.from({length: car.length}, (_, i) => ({x: car.x + dir + i, y: car.y}))
                    : Array.from({length: car.length}, (_, i) => ({x: car.x, y: car.y + dir + i}));
                for (const tc of testCells) {
                    for (const oc of cells) {
                        if (tc.x === oc.x && tc.y === oc.y) return false;
                    }
                }
            }
            return true;
        }

        // 绘制游戏
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制网格背景
            drawGrid();

            // 绘制出口
            drawExit();

            // 绘制车辆
            for (const car of cars) {
                drawCar(car);
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= GRID_SIZE; i++) {
                // 竖线
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                // 横线
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // 绘制停车位标记
            ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if ((row + col) % 2 === 0) {
                        ctx.fillRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
        }

        function drawExit() {
            const mainCar = cars.find(c => c.isMain);
            const exitX = GRID_SIZE * CELL_SIZE;
            const exitY = mainCar.y * CELL_SIZE;
            
            // 出口箭头区域
            const gradient = ctx.createLinearGradient(canvas.width - 40, 0, canvas.width, 0);
            gradient.addColorStop(0, 'rgba(254, 202, 87, 0.3)');
            gradient.addColorStop(1, 'rgba(254, 202, 87, 0.1)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(canvas.width - 40, exitY, 40, CELL_SIZE);

            // 出口箭头
            ctx.fillStyle = '#feca57';
            ctx.beginPath();
            const arrowX = canvas.width - 20;
            const arrowY = exitY + CELL_SIZE / 2;
            ctx.moveTo(arrowX - 12, arrowY - 10);
            ctx.lineTo(arrowX + 8, arrowY);
            ctx.lineTo(arrowX - 12, arrowY + 10);
            ctx.closePath();
            ctx.fill();

            // "出口" 文字
            ctx.fillStyle = '#feca57';
            ctx.font = 'bold 14px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText('出口', arrowX, exitY + CELL_SIZE + 20);
        }

        function drawCar(car) {
            const cells = car.getCells();
            const x = cells[0].x * CELL_SIZE;
            const y = cells[0].y * CELL_SIZE;
            const w = car.orientation === 'horizontal' ? car.length * CELL_SIZE : CELL_SIZE;
            const h = car.orientation === 'horizontal' ? CELL_SIZE : car.length * CELL_SIZE;

            const padding = 3;
            const rx = 8;

            // 阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            // 车身渐变
            const gradient = ctx.createLinearGradient(x + padding, y + padding, x + padding, y + h - padding);
            gradient.addColorStop(0, car.color[0]);
            gradient.addColorStop(1, car.color[1]);
            
            ctx.fillStyle = gradient;
            roundRect(ctx, x + padding, y + padding, w - padding * 2, h - padding * 2, rx);
            ctx.fill();

            // 高光
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            const highlightGradient = ctx.createLinearGradient(x + padding, y + padding, x + padding, y + padding + 15);
            highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = highlightGradient;
            roundRect(ctx, x + padding, y + padding, w - padding * 2, Math.min(15, h - padding * 2), rx);
            ctx.fill();

            // 选中效果
            if (car === selectedCar) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                roundRect(ctx, x + padding, y + padding, w - padding * 2, h - padding * 2, rx);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 车窗
            drawWindows(car, x, y, w, h, padding);

            // 主车标识
            if (car.isMain) {
                drawMainCarMark(x, y, w, h, padding);
            }

            // 轮胎
            drawWheels(car, x, y, w, h, padding);
        }

        function drawWindows(car, x, y, w, h, padding) {
            const innerX = x + padding;
            const innerY = y + padding;
            const innerW = w - padding * 2;
            const innerH = h - padding * 2;

            ctx.fillStyle = 'rgba(30, 50, 80, 0.8)';
            
            if (car.orientation === 'horizontal') {
                const windowW = innerW / car.length * 0.6;
                const windowH = innerH * 0.5;
                const startX = innerX + (innerW - windowW * car.length) / 2;
                
                for (let i = 0; i < car.length; i++) {
                    const wx = startX + i * (innerW / car.length) + (innerW / car.length - windowW) / 2;
                    const wy = innerY + (innerH - windowH) / 2;
                    roundRect(ctx, wx, wy, windowW, windowH, 3);
                    ctx.fill();
                }
            } else {
                const windowW = innerW * 0.7;
                const windowH = innerH / car.length * 0.5;
                const startY = innerY + (innerH - windowH * car.length) / 2;
                
                for (let i = 0; i < car.length; i++) {
                    const wx = innerX + (innerW - windowW) / 2;
                    const wy = startY + i * (innerH / car.length) + (innerH / car.length - windowH) / 2;
                    roundRect(ctx, wx, wy, windowW, windowH, 3);
                    ctx.fill();
                }
            }
        }

        function drawMainCarMark(x, y, w, h, padding) {
            // 箭头指示方向
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            const cx = x + w / 2;
            const cy = y + h / 2;
            const size = Math.min(w, h) * 0.25;
            
            ctx.beginPath();
            ctx.moveTo(cx + size, cy);
            ctx.lineTo(cx - size, cy - size * 0.7);
            ctx.lineTo(cx - size * 0.3, cy);
            ctx.lineTo(cx - size, cy + size * 0.7);
            ctx.closePath();
            ctx.fill();
        }

        function drawWheels(car, x, y, w, h, padding) {
            ctx.fillStyle = '#1a1a2e';
            const wheelR = Math.min(w, h) * 0.12;
            const offset = Math.max(w, h) * 0.2;

            if (car.orientation === 'horizontal') {
                // 前后轮
                const wheelY = y + h / 2;
                ctx.beginPath();
                ctx.arc(x + offset, wheelY, wheelR, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + w - offset, wheelY, wheelR, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // 左右轮
                const wheelX = x + w / 2;
                ctx.beginPath();
                ctx.arc(wheelX, y + offset, wheelR, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(wheelX, y + h - offset, wheelR, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // 获取点击位置的车辆
        function getCarAt(x, y) {
            const col = Math.floor(x / CELL_SIZE);
            const row = Math.floor(y / CELL_SIZE);
            
            for (const car of cars) {
                const cells = car.getCells();
                for (const cell of cells) {
                    if (cell.x === col && cell.y === row) {
                        return car;
                    }
                }
            }
            return null;
        }

        // 鼠标/触摸事件
        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove, {passive: false});
        
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchend', onPointerUp);

        function onPointerDown(e) {
            if (gameWon) return;
            e.preventDefault();
            
            const pos = getEventPos(e);
            const car = getCarAt(pos.x, pos.y);
            
            if (car) {
                selectedCar = car;
                dragStart = {x: pos.x, y: pos.y};
                canvas.style.cursor = 'grabbing';
                draw();
            }
        }

        function onPointerMove(e) {
            if (!selectedCar || !dragStart || gameWon) return;
            e.preventDefault();
            
            const pos = getEventPos(e);
            const dx = pos.x - dragStart.x;
            const dy = pos.y - dragStart.y;
            
            // 确定移动方向
            let moved = false;
            if (selectedCar.orientation === 'horizontal') {
                if (Math.abs(dx) > CELL_SIZE * 0.5) {
                    const dir = dx > 0 ? 1 : -1;
                    if (selectedCar.canMove(dir, cars)) {
                        saveState();
                        selectedCar.move(dir);
                        moveCount++;
                        updateMoveCount();
                        moved = true;
                    }
                }
            } else {
                if (Math.abs(dy) > CELL_SIZE * 0.5) {
                    const dir = dy > 0 ? 1 : -1;
                    if (selectedCar.canMove(dir, cars)) {
                        saveState();
                        selectedCar.move(dir);
                        moveCount++;
                        updateMoveCount();
                        moved = true;
                    }
                }
            }
            
            if (moved) {
                dragStart = {x: pos.x, y: pos.y};
                checkWin();
                draw();
            }
        }

        function onPointerUp() {
            selectedCar = null;
            dragStart = null;
            canvas.style.cursor = 'grab';
            draw();
        }

        // 撤销功能
        function saveState() {
            const state = cars.map(car => ({
                id: car.id,
                x: car.x,
                y: car.y,
                length: car.length,
                orientation: car.orientation,
                isMain: car.isMain
            }));
            moveHistory.push(state);
            if (moveHistory.length > 50) moveHistory.shift();
        }

        function undo() {
            if (moveHistory.length === 0 || gameWon) return;
            
            const prevState = moveHistory.pop();
            cars = prevState.map(s => {
                const car = new Car(s.id, s.x, s.y, s.length, s.orientation, s.isMain);
                return car;
            });
            moveCount = Math.max(0, moveCount - 1);
            updateMoveCount();
            draw();
        }

        // 检查胜利
        function checkWin() {
            const mainCar = cars.find(c => c.isMain);
            if (mainCar.isAtExit()) {
                gameWon = true;
                stopTimer();
                showWin();
            }
        }

        function showWin() {
            finalMovesEl.textContent = moveCount;
            finalTimeEl.textContent = formatTime(Date.now() - startTime);
            
            // 更新最佳记录
            const best = getBestRecord();
            if (!best || moveCount < best.moves || (moveCount === best.moves && (Date.now() - startTime) < best.time)) {
                saveBestRecord(moveCount, Date.now() - startTime);
                updateBestRecord();
            }
            
            winOverlay.classList.add('show');
        }

        // 计时器
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                timerEl.textContent = formatTime(Date.now() - startTime);
            }, 500);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const min = Math.floor(totalSec / 60);
            const sec = totalSec % 60;
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        // 最佳记录
        function getBestRecord() {
            try {
                const data = localStorage.getItem('parkingChaosBest');
                return data ? JSON.parse(data) : null;
            } catch {
                return null;
            }
        }

        function saveBestRecord(moves, time) {
            try {
                localStorage.setItem('parkingChaosBest', JSON.stringify({moves, time, date: Date.now()}));
            } catch {}
        }

        function updateBestRecord() {
            const best = getBestRecord();
            if (best) {
                bestRecordEl.textContent = `${formatTime(best.time)} / ${best.moves}步`;
            } else {
                bestRecordEl.textContent = '--:-- / --';
            }
        }

        function updateMoveCount() {
            moveCountEl.textContent = moveCount;
        }

        // 重新开始
        function restartGame() {
            gameWon = false;
            moveCount = 0;
            moveHistory = [];
            selectedCar = null;
            winOverlay.classList.remove('show');
            generateLevel();
            updateMoveCount();
            startTimer();
            draw();
        }

        // 提示功能
        function showHint() {
            const mainCar = cars.find(c => c.isMain);
            
            // 找到阻挡主车的车辆
            for (let x = mainCar.x + mainCar.length; x < GRID_SIZE; x++) {
                for (const car of cars) {
                    if (car.id === mainCar.id) continue;
                    const cells = car.getCells();
                    for (const cell of cells) {
                        if (cell.x === x && cell.y === mainCar.y) {
                            // 高亮显示这辆车
                            selectedCar = car;
                            draw();
                            setTimeout(() => {
                                selectedCar = null;
                                draw();
                            }, 1500);
                            return;
                        }
                    }
                }
            }
            
            // 如果没有阻挡，提示主车
            selectedCar = mainCar;
            draw();
            setTimeout(() => {
                selectedCar = null;
                draw();
            }, 1500);
        }

        // 按钮事件
        document.getElementById('restartBtn').addEventListener('click', restartGame);
        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('hintBtn').addEventListener('click', showHint);

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (gameWon) return;
            
            if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                undo();
            } else if (e.key === 'r') {
                restartGame();
            } else if (e.key === 'h') {
                showHint();
            } else if (selectedCar) {
                let dir = 0;
                if (selectedCar.orientation === 'horizontal') {
                    if (e.key === 'ArrowLeft') dir = -1;
                    else if (e.key === 'ArrowRight') dir = 1;
                } else {
                    if (e.key === 'ArrowUp') dir = -1;
                    else if (e.key === 'ArrowDown') dir = 1;
                }
                
                if (dir !== 0 && selectedCar.canMove(dir, cars)) {
                    saveState();
                    selectedCar.move(dir);
                    moveCount++;
                    updateMoveCount();
                    checkWin();
                    draw();
                }
            }
        });

        // 初始化
        updateBestRecord();
        restartGame();
    </script>
</body>
</html>
