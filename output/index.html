<html lang="zh-CN">
<head>

<title>游戏大厅 - gmicroul.github.io</title>
<style>
/* ===== CSS Variables & Reset ===== */
:root {
  --bg-primary: #0a0f14;
  --bg-secondary: #0f1720;
  --bg-card: #141f2e;
  --bg-card-hover: #1a2a3e;
  --text-primary: #e8f0f8;
  --text-secondary: #9ab0c8;
  --text-muted: #6b859c;
  --border-color: #23354a;
  --accent-cyan: #19a7ce;
  --accent-teal: #2ebd85;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}

/* ===== Background Atmosphere ===== */
.bg-atmosphere {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.bg-atmosphere::before {
  content: ''; position: absolute; top: -200px; right: -200px; width: 600px; height: 600px;
  background: radial-gradient(ellipse, rgba(25,167,206,0.08) 0%, transparent 70%);
  animation: float 20s ease-in-out infinite;
}
.bg-atmosphere::after {
  content: ''; position: absolute; bottom: -150px; left: -150px; width: 500px; height: 500px;
  background: radial-gradient(ellipse, rgba(46,189,133,0.06) 0%, transparent 70%);
  animation: float 25s ease-in-out infinite reverse;
}
@keyframes float {
  0%, 100% { transform: translate(0,0) rotate(0deg); }
  33% { transform: translate(30px,-20px) rotate(1deg); }
  66% { transform: translate(-20px,30px) rotate(-1deg); }
}

/* ===== Layout ===== */
.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* ===== Header ===== */
.header {
  padding: clamp(16px, 3vw, 24px) clamp(16px, 5vw, 32px);
  border-bottom: 1px solid var(--border-color);
  background: linear-gradient(180deg, rgba(20,31,46,0.95) 0%, rgba(10,15,20,0.9) 100%);
  backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 100;
}
.header-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.logo-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-teal) 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(25,167,206,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
}
.logo-icon svg { width: 24px; height: 24px; color: white; }
.logo-text { font-size: clamp(1.1rem, 2.5vw, 1.4rem); font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-cyan) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats-badge { font-size: 0.75rem; font-weight: 600; padding: 6px 12px; background: rgba(25,167,206,0.15); border: 1px solid rgba(25,167,206,0.3); border-radius: 100px; color: var(--accent-cyan); white-space: nowrap; }

/* ===== Search ===== */
.search-wrapper { position: relative; width: 100%; max-width: 520px; }
.search-input {
  width: 100%; padding: 14px 18px 14px 50px; font-size: 0.95rem; font-family: inherit;
  background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  color: var(--text-primary); outline: none; transition: var(--transition);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(25,167,206,0.15); }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-muted); pointer-events: none; transition: var(--transition); }
.search-input:focus + .search-icon { color: var(--accent-cyan); }
.clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: none; background: transparent; color: var(--text-muted); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: var(--transition); }
.clear-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
.search-input:not(:placeholder-shown) + .search-icon + .clear-btn { opacity: 1; visibility: visible; }

/* ===== Main Content ===== */
.main { flex: 1; padding: clamp(16px, 3vw, 24px) clamp(16px, 5vw, 32px); }
.container { max-width: 1400px; margin: 0 auto; }

/* ===== Grid ===== */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: clamp(12px, 2vw, 20px);
}
@media (min-width: 480px) { .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
@media (min-width: 768px) { .games-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
@media (min-width: 1024px) { .games-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
@media (min-width: 1400px) { .games-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

/* ===== Game Card ===== */
.game-card {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
  overflow: hidden; text-decoration: none; color: inherit;
  transition: var(--transition); position: relative;
  animation: cardEnter 0.5s cubic-bezier(0.4,0,0.2,1) backwards;
}
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.game-card:nth-child(odd) { animation-delay: calc(var(--i, 0) * 0.03s); }
.game-card:nth-child(even) { animation-delay: calc(var(--i, 0) * 0.03s + 0.05s); }

.game-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(25,167,206,0.4);
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(25,167,206,0.2);
  background: var(--bg-card-hover);
}
.game-card:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; }

.game-card.hidden { display: none !important; }

/* ===== SailfishOS Style Icon ===== */
.card-icon {
  aspect-ratio: 1 / 1; width: 100%; max-width: 140px; margin: 0 auto;
  position: relative; overflow: visible;
}

/* Squircle mask - SailfishOS style */
.icon-shape {
  width: 100%; height: 100%;
  /* Squircle using clip-path - continuous curvature */
  clip-path: path('M0,30 C0,13.4 13.4,0 30,0 L210,0 C226.6,0 240,13.4 240,30 L240,210 C240,226.6 226.6,240 210,240 L30,240 C13.4,240 0,226.6 0,210 Z');
  /* For browsers without path() support, fallback to border-radius */
  border-radius: 28%;
  position: relative; overflow: hidden;
  transform-origin: center center;
}

/* Shape variations using clip-path */
.icon-shape.shape-0 { /* Squircle - classic SailfishOS */
  clip-path: path('M0,30 C0,13.4 13.4,0 30,0 L210,0 C226.6,0 240,13.4 240,30 L240,210 C240,226.6 226.6,240 210,240 L30,240 C13.4,240 0,226.6 0,210 Z');
}
.icon-shape.shape-1 { /* Circle */
  clip-path: circle(50% at 50% 50%);
  border-radius: 50%;
}
.icon-shape.shape-2 { /* Organic droplet - asymmetric */
  clip-path: path('M120,10 C180,10 230,45 230,100 C230,155 190,205 120,230 C50,205 10,155 10,100 C10,45 60,10 120,10 Z');
  border-radius: 0;
}
.icon-shape.shape-3 { /* Rounded square - softer */
  clip-path: path('M0,20 C0,9 9,0 20,0 L220,0 C231,0 240,9 240,20 L240,220 C240,231 231,240 220,240 L20,240 C9,240 0,231 0,220 Z');
  border-radius: 12%;
}
.icon-shape.shape-4 { /* Hexagon-ish rounded */
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%);
  border-radius: 0;
}
.icon-shape.shape-5 { /* Teardrop */
  clip-path: path('M120,5 C175,5 220,55 220,110 C220,165 175,210 120,235 C65,210 20,165 20,110 C20,55 65,5 120,5 Z');
  border-radius: 0;
}

/* Base gradient background */
.icon-bg {
  position: absolute; inset: 0;
  background: var(--icon-base);
  /* Linear gradient 120-150deg - light source top-left */
  background: linear-gradient(135deg, var(--icon-base) 0%, var(--icon-base-dark) 100%);
  /* Subtle radial highlight for spherical feel */
  background-image: 
    linear-gradient(135deg, var(--icon-base) 0%, var(--icon-base-dark) 100%),
    radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 50%);
  background-blend-mode: normal, screen;
}

/* Negative space symbol (cutout) - white/cream foreground */
.icon-symbol {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  /* The symbol is "cut out" via mask - we use a pseudo-element approach */
}
.icon-symbol::before {
  content: '';
  width: 55%; height: 55%;
  background: var(--icon-symbol-color, #ffffff);
  mask: var(--symbol-mask);
  -webkit-mask: var(--symbol-mask);
  mask-repeat: no-repeat; mask-position: center; mask-size: contain;
  -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-size: contain;
  opacity: 0.95;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
}

/* Accent dot/element */
.icon-accent {
  position: absolute;
  width: 14%; height: 14%;
  background: var(--icon-accent);
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 -1px 2px rgba(0,0,0,0.2);
  /* Top-right area */
  top: 12%; right: 12%;
  animation: accentPulse 3s ease-in-out infinite;
}
@keyframes accentPulse {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.1); opacity: 1; }
}

/* Long shadow - flat long shadow style */
.icon-shape::after {
  content: '';
  position: absolute; inset: -40%;
  background: linear-gradient(135deg, transparent 50%, rgba(20,40,60,0.18) 50%);
  pointer-events: none;
  z-index: -1;
  border-radius: inherit;
  clip-path: inherit;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.game-card:hover .icon-shape::after { opacity: 1; }

/* Card content */
.card-content { padding: clamp(12px, 2vw, 16px); text-align: center; }
.card-title {
  font-size: clamp(0.75rem, 1.8vw, 0.875rem);
  font-weight: 600; line-height: 1.3; color: var(--text-primary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: 2.6em; transition: var(--transition);
}
.game-card:hover .card-title { color: var(--accent-cyan); }

/* ===== Empty State ===== */
.empty-state {
  grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
.empty-state h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
.empty-state p { font-size: 0.9rem; }

/* ===== Footer ===== */
.footer {
  padding: 24px; text-align: center; color: var(--text-muted);
  font-size: 0.8rem; border-top: 1px solid var(--border-color);
  background: var(--bg-secondary);
}
.footer a { color: var(--accent-cyan); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== High Contrast ===== */
@media (prefers-contrast: high) {
  :root {
    --border-color: #4a6b8a;
    --text-secondary: #b8d0e8;
  }
  .game-card { border-width: 2px; }
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== Symbol Masks (SVG data URIs) ===== */
/* We'll inject these via JS based on game index */
</style>

// ===== Darker shade generator =====
function darkenHex(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.floor(((num >> 16) & 255) * (1 - percent)));
  const g = Math.max(0, Math.floor(((num >> 8) & 255) * (1 - percent)));
  const b = Math.max(0, Math.floor((num & 255) * (1 - percent)));
  return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
}

// ===== Render Game Cards =====
const grid = document.getElementById('gamesGrid');
const emptyState = document.getElementById('emptyState');
const statsBadge = document.getElementById('statsBadge');
const footerCount = document.getElementById('footerCount');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

let visibleCount = GAMES_DATA.length;

function renderCards(filter = '') {
  grid.innerHTML = '';
  visibleCount = 0;
  const lowerFilter = filter.toLowerCase().trim();
  
  GAMES_DATA.forEach((game, index) => {
    const title = game.title.toLowerCase();
    const matches = !lowerFilter || title.includes(lowerFilter);
    
    if (!matches) return;
    
    visibleCount++;
    const iconData = ICONS_DATA[index];
    const baseColor = iconData.base;
    const accentColor = iconData.accent;
    const darkColor = darkenHex(baseColor, 0.25);
    const shapeClass = `shape-${iconData.shape}`;
    const rotation = iconData.rotation;
    const symbolMask = SYMBOL_MASKS[index % SYMBOL_MASKS.length];
    
    const card = document.createElement('a');
    card.href = `/games-web/${game.file}`;
    card.className = 'game-card';
    card.style.setProperty('--i', visibleCount);
    card.setAttribute('role', 'listitem');
    card.setAttribute('data-title', game.title);
    card.dataset.titleLower = title;
    
    // SailfishOS style icon with CSS custom properties
    card.innerHTML = `
      <div class="card-icon">
        <div class="icon-shape ${shapeClass}" style="transform: rotate(${rotation}deg);">
          <div class="icon-bg" style="--icon-base: ${baseColor}; --icon-base-dark: ${darkColor};"></div>
          <div class="icon-symbol" style="--symbol-mask: ${symbolMask}; --icon-symbol-color: #ffffff;"></div>
          <div class="icon-accent" style="--icon-accent: ${accentColor};"></div>
        </div>
      </div>
      <div class="card-content">
        <h3 class="card-title">${escapeHtml(game.title)}</h3>
      </div>
    `;
    grid.appendChild(card);
  });
  
  updateStats();
  toggleEmptyState();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function updateStats() {
  const total = GAMES_DATA.length;
  statsBadge.textContent = filter ? `显示 ${visibleCount} / ${total} 款游戏` : `共 ${total} 款游戏`;
  footerCount.textContent = total;
}

function toggleEmptyState() {
  if (visibleCount === 0) {
    emptyState.classList.remove('hidden');
    grid.style.display = 'none';
  } else {
    emptyState.classList.add('hidden');
    grid.style.display = 'grid';
  }
}

// ===== Search Handling =====
let searchDebounce;
let currentFilter = '';

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const value = e.target.value;
  clearBtn.style.display = value ? 'flex' : 'none';
  
  searchDebounce = setTimeout(() => {
    currentFilter = value;
    renderCards(currentFilter);
  }, 120);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  currentFilter = '';
  renderCards('');
  searchInput.focus();
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.blur();
    if (searchInput.value) {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      currentFilter = '';
      renderCards('');
    }
  }
});

// ===== Initial Render =====
renderCards();

// ===== Stagger animation on load =====
requestAnimationFrame(() => {
  const cards = grid.querySelectorAll('.game-card');
  cards.forEach((card, i) => {
    card.style.animationDelay = `${i * 0.02}s`;
  });
});

// ===== Keyboard Navigation Enhancement =====
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
});
</script>
