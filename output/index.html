<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏大厅 - GitHub Pages</title>
  <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0f14;
      --bg-elevated: #111820;
      --fg: #e8ecf1;
      --fg-muted: #8b95a1;
      --accent: #19a7ce;
      --accent-dim: #0e7c8c;
      --card-bg: #151d27;
      --card-border: #1e2a38;
      --shadow: rgba(20,40,60,0.35);
      --shadow-strong: rgba(20,40,60,0.5);
      --search-bg: #0d141c;
      --search-border: #233040;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0f4f8;
        --bg-elevated: #ffffff;
        --fg: #1a2330;
        --fg-muted: #5a6a7a;
        --accent: #0e7c8c;
        --accent-dim: #0a5f6e;
        --card-bg: #ffffff;
        --card-border: #d8e2ec;
        --shadow: rgba(20,40,60,0.12);
        --shadow-strong: rgba(20,40,60,0.2);
        --search-bg: #ffffff;
        --search-border: #c8d4e0;
      }
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Header */
    header {
      padding: 1.5rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg) 100%);
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent) 0%, #4fc3f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      margin-top: 0.35rem;
      font-size: clamp(0.875rem, 1.5vw, 1rem);
      color: var(--fg-muted);
    }
    .stats {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--fg-muted);
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .stats span { font-weight: 500; color: var(--fg); }
    /* Search */
    .search-wrapper {
      padding: 1rem 1.25rem;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }
    .search-box {
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }
    .search-box svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--fg-muted);
      pointer-events: none;
    }
    .search-box input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 3rem;
      font-size: 1rem;
      background: var(--search-bg);
      border: 2px solid var(--search-border);
      border-radius: 14px;
      color: var(--fg);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(25,167,206,0.15);
    }
    .search-box input::placeholder { color: var(--fg-muted); opacity: 0.6; }
    .clear-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .clear-btn.visible { display: block; opacity: 1; }
    .clear-btn:hover { color: var(--fg); }
    /* Grid */
    main { flex: 1; padding: 1.25rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1025px) and (max-width: 1400px) {
      .grid { grid-template-columns: repeat(5, 1fr); }
    }
    @media (min-width: 1401px) {
      .grid { grid-template-columns: repeat(6, 1fr); }
    }
    /* Card */
    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.18s, border-color 0.18s;
      position: relative;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px var(--shadow-strong), 0 4px 12px var(--shadow);
      border-color: var(--accent-dim);
    }
    .game-card:active { transform: translateY(-1px) scale(0.99); }
    .game-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Icon container - SailfishOS style */
    .icon-wrap {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--icon-bg-start) 0%, var(--icon-bg-end) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .icon-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .icon-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
    }
    .icon-svg {
      width: 62%;
      height: 62%;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
      z-index: 1;
    }
    .icon-img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
      z-index: 1;
    }
    /* SailfishOS squircle clip-path for icon background */
    .icon-bg {
      position: absolute;
      inset: 0;
      background: inherit;
      clip-path: path("M512,48 C278.5,48 48,278.5 48,512 C48,745.5 278.5,976 512,976 C745.5,976 976,745.5 976,512 C976,278.5 745.5,48 512,48 Z");
      /* Squircle approximation with continuous curvature */
    }
    .game-info { padding: 0.85rem 0.75rem; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 60px; }
    .game-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--fg-muted);
    }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state p { font-size: 1.1rem; }
    /* Footer */
    footer {
      padding: 1.5rem 1.25rem;
      text-align: center;
      color: var(--fg-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--card-border);
      background: var(--bg-elevated);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .game-card, .search-box input, .clear-btn { transition: none; }
    }
  </style>
</head>

    // Deterministic pseudo-random for consistent assignment
    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function getIconForGame(title) {
      const h = hashString(title);
      const paletteIdx = h % PALETTE.length;
      const iconIdx = Math.floor(h / PALETTE.length) % ICONS.length;
      return { palette: PALETTE[paletteIdx], icon: ICONS[iconIdx] };
    }

    // Render a game card
    function renderCard(game) {
      const { palette, icon } = getIconForGame(game.title);
      const card = document.createElement('a');
      card.href = game.path;
      card.className = 'game-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.style.setProperty('--icon-bg-start', palette.start);
      card.style.setProperty('--icon-bg-end', palette.end);
      card.innerHTML = `
        <div class="icon-wrap">
          <div class="icon-bg"></div>
          <div class="icon-svg" style="color: ${palette.start}">${icon}</div>
        </div>
        <div class="game-info">
          <span class="game-title">${game.title}</span>
        </div>
      `;
      return card;
    }

    // Render all games
    function renderGames(filter = '') {
      grid.innerHTML = '';
      const lowerFilter = filter.toLowerCase().trim();
      const filtered = GAMES.filter(g => g.title.toLowerCase().includes(lowerFilter));
      
      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        const fragment = document.createDocumentFragment();
        filtered.forEach(game => fragment.appendChild(renderCard(game)));
        grid.appendChild(fragment);
      }
      
      visibleCount.textContent = filtered.length;
      totalCount.textContent = GAMES.length;
      footerCount.textContent = GAMES.length;
    }

    // Search handling
    let searchDebounce;
    searchInput.addEventListener('input', (e) => {
      clearBtn.classList.toggle('visible', e.target.value.length > 0);
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => renderGames(e.target.value), 80);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      renderGames('');
      searchInput.focus();
    });

    // Keyboard: Escape clears search
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        renderGames('');
        searchInput.blur();
      }
    });

    // Initial render
    renderGames();
  </script>
