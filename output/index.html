<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1620">
<title>游戏大厅 · SFOS Game Hub</title>
<style>
  :root{
    --bg0:#0b1219; --bg1:#111e2c; --bg2:#0e1823;
    --surface:rgba(255,255,255,.055); --surface-hi:rgba(255,255,255,.10);
    --line:rgba(255,255,255,.09);
    --text:#E7F1F8;     --dim:#87A0B2; --dim2:#5F7890;
    --accent:#00A9FF; --accent2:#2EE6A8;
    --r:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(1100px 480px at 85% -10%, rgba(0,169,255,.14), transparent 60%),
      radial-gradient(900px 420px at -10% 110%, rgba(46,230,168,.08), transparent 55%),
      linear-gradient(165deg, var(--bg1) 0%, var(--bg0) 45%, var(--bg2) 100%);
    background-attachment:fixed;
  }

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(13,22,32,.82);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1280px; margin:0 auto; padding:12px 18px;
    display:flex; align-items:center; gap:12px;
  }
  .brand{
    display:flex; align-items:center; gap:11px;
    font-size:19px; font-weight:700; letter-spacing:.4px;
  }
  .brand svg{width:32px;height:32px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,169,255,.4))}
  .brand em{
    font-style:normal;
    background:linear-gradient(100deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .count-badge{
    margin-left:auto; flex:none;
    font-size:12.5px; color:var(--dim);
    background:var(--surface); border:1px solid var(--line);
    padding:5px 13px; border-radius:999px;
    white-space:nowrap;
  }
  .count-badge b{color:var(--accent); font-weight:700}

  /* ---------- search ---------- */
  .search-wrap{max-width:1280px;margin:0 auto;padding:16px 18px 4px}
  .search{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:0 16px; height:48px;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .search:focus-within{
    border-color:rgba(0,169,255,.55);
    box-shadow:0 0 0 3px rgba(0,169,255,.15);
    background:rgba(255,255,255,.075);
  }
  .search svg{width:20px;height:20px;flex:none;color:var(--dim)}
  .search input{
    flex:1; min-width:0; height:100%;
    background:none; border:none; outline:none;
    color:var(--text); font-size:15px;
  }
  .search input::placeholder{color:var(--dim2)}
  .search .clear{
    flex:none; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(255,255,255,.08); color:var(--dim);
    font-size:14px; cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  .search .clear.on{display:flex}
  .hint{
    max-width:1280px; margin:0 auto; padding:8px 20px 2px;
    font-size:12px; color:var(--dim2);
  }
  .hint kbd{
    font-family:inherit; font-size:11px; color:var(--dim);
    background:var(--surface); border:1px solid var(--line);
    border-radius:6px; padding:1px 7px;
  }

  /* ---------- grid ---------- */
  .grid-wrap{max-width:1280px;margin:0 auto;padding:18px}
  .grid{
    display:grid; gap:14px; justify-content:center;
    grid-template-columns:repeat(auto-fill,minmax(104px,108px));
  }
  .card{
    width:108px; height:108px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:4px; padding:7px 6px 6px;
    background:linear-gradient(180deg,var(--surface-hi),var(--surface));
    border:1px solid var(--line); border-radius:var(--r);
    text-decoration:none; color:inherit;
    transition:transform .18s ease, border-color .18s, box-shadow .18s, background .18s;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0; border-radius:var(--r);
    background:radial-gradient(120px 60px at 50% 0%, rgba(255,255,255,.10), transparent 70%);
    opacity:0; transition:opacity .18s;
    pointer-events:none;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px);
    border-color:rgba(0,169,255,.5);
    box-shadow:0 8px 22px rgba(0,0,0,.35), 0 0 0 1px rgba(0,169,255,.15), 0 0 18px rgba(0,169,255,.18);
    background:linear-gradient(180deg,rgba(0,169,255,.16),var(--surface-hi));
  }
  .card:hover::before{opacity:1}
  .card:active{transform:translateY(0) scale(.97)}
  .card .thumb{
    width:86px; height:86px; border-radius:15px; overflow:hidden;
    background:rgba(0,0,0,.18);
    display:flex; align-items:center; justify-content:center;
  }
  .card .thumb img{width:86px;height:86px;display:block;object-fit:contain}
  .card .nm{
    width:100%; text-align:center;
    font-size:11.5px; line-height:14px; color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .18s;
  }
  .card:hover .nm{color:var(--text)}

  /* ---------- empty ---------- */
  .empty{
    display:none; text-align:center; padding:70px 20px; color:var(--dim2);
  }
  .empty.on{display:block}
  .empty svg{width:64px;height:64px;opacity:.5;margin-bottom:14px}
  .empty b{display:block;color:var(--dim);font-size:16px;margin-bottom:6px;font-weight:600}

  footer{
    max-width:1280px;margin:0 auto;padding:26px 18px 40px;
    text-align:center; font-size:12px; color:var(--dim2);
  }

  /* ---------- responsive ---------- */
  @media (max-width:640px){
    .bar{padding:10px 14px}
    .brand{font-size:17px}
    .count-badge{padding:4px 10px;font-size:11.5px}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
    .grid-wrap{padding:12px}
    .search-wrap{padding:12px 14px 2px}
    .card{width:100%;height:108px}
  }
  @media (max-width:360px){
    .count-badge span{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>

<header>
  <div class="bar">

        <defs><linearGradient id="lg" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">

</header>

<div class="search-wrap">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
    <input id="q" type="search" placeholder="搜索游戏 · Search games…" autocomplete="off" spellcheck="false">
    <button class="clear" id="clear" aria-label="清除">×</button>
  </div>
</div>
<div class="hint">按 <kbd>/</kbd> 聚焦搜索 · <span id="shown">224</span> / 224 显示</div>

<main class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6M11 8v6"/></svg>
    <b>没有找到匹配的游戏</b>
    换个关键词试试
  </div>
</main>

<footer>SFOS 风格游戏大厅 · 全部游戏本地运行 · 点击卡片开始游戏</footer>
