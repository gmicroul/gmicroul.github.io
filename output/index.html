<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root {
  --bg-deep: #0a0f14;
  --bg-card: #111820;
  --bg-card-hover: #16202b;
  --bg-input: #0d141c;
  --border: #1e2a38;
  --border-hover: #2a3f52;
  --text-primary: #e8f0f8;
  --text-secondary: #94a3b8;
  --text-muted: #5a6d82;
  --accent-cyan: #19A7CE;
  --accent-sky: #4FC3F7;
  --accent-sea: #2EBD85;
  --accent-coral: #F0544F;
  --accent-orange: #F59B23;
  --accent-yellow: #FFD34E;
  --accent-purple: #C56CD6;
  --accent-pink: #E85D9E;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}

.page {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 16px;
}

.header {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
  padding: 0 4px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.title-block h1 {
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-sky) 50%, var(--accent-sea) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.title-block p {
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.stats {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.stats strong {
  color: var(--accent-sky);
  font-size: 1rem;
}

.search-wrapper {
  position: relative;
  width: 100%;
  max-width: 480px;
}

.search-input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  font-size: 0.9375rem;
  color: var(--text-primary);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: var(--transition);
  outline: none;
}

.search-input::placeholder { color: var(--text-muted); }

.search-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.15);
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: var(--text-muted);
  pointer-events: none;
  transition: var(--transition);
}

.search-input:focus + .search-icon { color: var(--accent-cyan); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
}

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
}

@media (min-width: 481px) and (max-width: 768px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1025px) and (max-width: 1280px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}

@media (min-width: 1281px) {
  .grid { grid-template-columns: repeat(6, 1fr); }
}

.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: var(--transition);
  position: relative;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(25,167,206,0.08) 0%, rgba(46,189,133,0.06) 100%);
  opacity: 0;
  transition: var(--transition);
  pointer-events: none;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--border-hover);
  box-shadow: var(--shadow-lg);
}

.card:hover::before { opacity: 1; }

.card:focus-visible {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.25);
}

.card-icon {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  overflow: hidden;
}

.card-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.card-content {
  padding: 14px 12px;
}

.card-title {
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.card:hover .card-title { color: var(--accent-sky); }

.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
  color: var(--text-muted);
  background: var(--bg-card);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
}

.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }

.empty-state p { font-size: 1rem; }

.hidden { display: none !important; }

/* SailfishOS-style icon generation */
.icon-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Base shape: square with inscribed circle, random corner cutouts */
.icon-shape {
  transform-origin: center;
}

/* Animation for hover */
.card:hover .icon-shape {
  animation: iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-3px) rotate(1deg); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .card:hover .icon-shape { animation: none; }
  .card { transition: none; }
  .card:hover { transform: none; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
</style>
</head>

// ============ SailfishOS-style Icon Generator ============
const PALETTES = [
  // Ocean theme (primary)
  { bg: ['#0E7C8C', '#19A7CE'], fg: '#FFFFFF', accent: '#4FC3F7' },
  { bg: ['#19A7CE', '#4FC3F7'], fg: '#FFFFFF', accent: '#0E7C8C' },
  { bg: ['#2EBD85', '#15966B'], fg: '#FFFFFF', accent: '#4FC3F7' },
  { bg: ['#15966B', '#2EBD85'], fg: '#FFFFFF', accent: '#19A7CE' },
  { bg: ['#0E7C8C', '#15966B'], fg: '#FFFFFF', accent: '#2EBD85' },
  { bg: ['#4FC3F7', '#19A7CE'], fg: '#0E7C8C', accent: '#FFFFFF' },
  // Accent theme (secondary)
  { bg: ['#F0544F', '#F59B23'], fg: '#FFFFFF', accent: '#FFD34E' },
  { bg: ['#F59B23', '#FFD34E'], fg: '#0E7C8C', accent: '#F0544F' },
  { bg: ['#C56CD6', '#E85D9E'], fg: '#FFFFFF', accent: '#FFD34E' },
  { bg: ['#E85D9E', '#C56CD6'], fg: '#FFFFFF', accent: '#4FC3F7' },
];

// Hash function for deterministic randomness
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

// Seeded random
function seededRandom(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function pick(arr, seed, offset = 0) {
  return arr[Math.floor(seededRandom(seed + offset) * arr.length)];
}

function pickInt(min, max, seed, offset = 0) {
  return min + Math.floor(seededRandom(seed + offset) * (max - min + 1));
}

// Generate SailfishOS-style icon SVG
function generateIconSVG(title) {
  const seed = hashString(title);
  const palette = pick(PALETTES, seed);
  const size = 512;
  const safeZone = 0.82; // 82% content area
  const strokeWidth = 0.07; // 7% of size
  const cornerRadius = pickInt(22, 30, seed) / 100; // 22-30% corner radius
  
  // Shape type: 0=circle/squircle, 1=squircle with cutouts, 2=organic
  const shapeType = pickInt(0, 2, seed, 1);
  
  // Determine corner cutouts (which corners to remove)
  const cutoutMask = pickInt(1, 15, seed, 2); // 1-15 (at least one, not all)
  const cutouts = {
    tl: (cutoutMask & 1) !== 0,
    tr: (cutoutMask & 2) !== 0,
    bl: (cutoutMask & 4) !== 0,
    br: (cutoutMask & 8) !== 0,
  };
  
  // Inner symbol type
  const symbolType = pickInt(0, 5, seed, 3);
  
  const cx = size / 2;
  const cy = size / 2;
  const radius = size * safeZone / 2;
  const stroke = size * strokeWidth;
  const r = size * cornerRadius;
  
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" class="icon-canvas">`;
  
  // Defs for gradients
  svg += `<defs>`;
  // Background gradient
  svg += `<linearGradient id="bg${seed}" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(135)">`;
  svg += `<stop offset="0%" stop-color="${palette.bg[0]}"/>`;
  svg += `<stop offset="100%" stop-color="${palette.bg[1]}"/>`;
  svg += `</linearGradient>`;
  // Symbol gradient (lighter)
  svg += `<linearGradient id="fg${seed}" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(135)">`;
  svg += `<stop offset="0%" stop-color="${palette.fg}" stop-opacity="1"/>`;
  svg += `<stop offset="100%" stop-color="${palette.fg}" stop-opacity="0.85"/>`;
  svg += `</linearGradient>`;
  // Accent gradient
  svg += `<linearGradient id="ac${seed}" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(135)">`;
  svg += `<stop offset="0%" stop-color="${palette.accent}" stop-opacity="1"/>`;
  svg += `<stop offset="100%" stop-color="${palette.accent}" stop-opacity="0.7"/>`;
  svg += `</linearGradient>`;
  // Radial highlight for depth
  svg += `<radialGradient id="hl${seed}" cx="35%" cy="35%" r="60%">`;
  svg += `<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>`;
  svg += `<stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>`;
  svg += `</radialGradient>`;
  svg += `</defs>`;
  
  // Main shape group with clip-path
  const clipId = `clip${seed}`;
  svg += `<clipPath id="${clipId}">`;
  
  // Build the base shape path (square with inscribed circle, corner cutouts)
  const halfSize = size / 2;
  const circleR = halfSize;
  const inset = halfSize * (1 - safeZone);
  const contentBox = halfSize * safeZone;
  
  // Path for the container shape
  let shapePath = '';
  
  if (shapeType === 0) {
    // Pure circle/squircle
    shapePath = `M${cx - circleR},${cy} 
      A${circleR},${circleR} 0 0,1 ${cx},${cy - circleR}
      A${circleR},${circleR} 0 0,1 ${cx + circleR},${cy}
      A${circleR},${circleR} 0 0,1 ${cx},${cy + circleR}
      A${circleR},${circleR} 0 0,1 ${cx - circleR},${cy} Z`;
  } else if (shapeType === 1) {
    // Squircle with corner cutouts
    const sq = halfSize * 0.95;
    const cr = sq * cornerRadius;
    
    shapePath = `M${cx - sq + cr},${cy - sq}
      H${cx + sq - cr}
      Q${cx + sq},${cy - sq} ${cx + sq},${cy - sq + cr}
      V${cy + sq - cr}
      Q${cx + sq},${cy + sq} ${cx + sq - cr},${cy + sq}
      H${cx - sq + cr}
      Q${cx - sq},${cy + sq} ${cx - sq},${cy + sq - cr}
      V${cy - sq + cr}
      Q${cx - sq},${cy - sq} ${cx - sq + cr},${cy - sq} Z`;
    
    // Apply corner cutouts by intersecting with circle
    shapePath = `M${cx - circleR},${cy} 
      A${circleR},${circleR} 0 0,1 ${cx},${cy - circleR}
      A${circleR},${circleR} 0 0,1 ${cx + circleR},${cy}
      A${circleR},${circleR} 0 0,1 ${cx},${cy + circleR}
      A${circleR},${circleR} 0 0,1 ${cx - circleR},${cy} Z`;
  } else {
    // Organic blob shape
    const points = 8;
    const angles = [];
    for (let i = 0; i < points; i++) {
      const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
      const variance = 0.85 + seededRandom(seed + i * 10) * 0.3;
      const r = circleR * variance;
      angles.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
    }
    shapePath = `M${angles[0].x},${angles[0].y} `;
    for (let i = 1; i < points; i++) {
      const next = angles[i];
      const prev = angles[i - 1];
      const cpx = (prev.x + next.x) / 2;
      const cpy = (prev.y + next.y) / 2;
      shapePath += `Q${cpx},${cpy} ${next.x},${next.y} `;
    }
    shapePath += `Q${(angles[points-1].x + angles[0].x)/2},${(angles[points-1].y + angles[0].y)/2} ${angles[0].x},${angles[0].y} Z`;
  }
  
  svg += `<path d="${shapePath}"/>`;
  svg += `</clipPath>`;
  
  // Background shape
  svg += `<g clip-path="url(#${clipId})">`;
  svg += `<rect width="${size}" height="${size}" fill="url(#bg${seed})"/>`;
  // Highlight overlay
  svg += `<rect width="${size}" height="${size}" fill="url(#hl${seed})"/>`;
  svg += `</g>`;
  
  // Inner symbol (negative space / mask)
  const symSize = radius * 0.55;
  const symStroke = stroke * 1.2;
  
  svg += `<g class="icon-shape" transform="translate(${cx},${cy})">`;
  
  switch (symbolType) {
    case 0: // Concentric circles (focus, time, lens)
      svg += `<circle r="${symSize}" fill="none" stroke="url(#fg${seed})" stroke-width="${symStroke}" stroke-linecap="round"/>`;
      svg += `<circle r="${symSize * 0.55}" fill="none" stroke="url(#fg${seed})" stroke-width="${symStroke * 0.7}" stroke-linecap="round" stroke-dasharray="${symSize * 0.3},${symSize * 0.3}"/>`;
      // Center dot
      svg += `<circle r="${symSize * 0.12}" fill="url(#ac${seed})"/>`;
      break;
      
    case 1: // Play triangle
      const triSize = symSize * 0.9;
      svg += `<polygon points="-${triSize * 0.5},-${triSize * 0.866} ${triSize * 0.5},0 -${triSize * 0.5},${triSize * 0.866}" fill="url(#fg${seed})"/>`;
      break;
      
    case 2: // Cross/plus (medical, add, close)
      const barW = symStroke * 1.5;
      const barL = symSize * 1.3;
      svg += `<rect x="${-barW/2}" y="${-barL/2}" width="${barW}" height="${barL}" rx="${barW/2}" fill="url(#fg${seed})"/>`;
      svg += `<rect x="${-barL/2}" y="${-barW/2}" width="${barL}" height="${barW}" rx="${barW/2}" fill="url(#fg${seed})"/>`;
      break;
      
    case 3: // Organic droplet/leaf
      svg += `<path d="M0,${-symSize} Q${symSize * 0.6},${-symSize * 0.3} ${symSize * 0.8},${symSize * 0.2} Q0,${symSize * 0.6} ${-symSize * 0.8},${symSize * 0.2} Q${-symSize * 0.6},${-symSize * 0.3} 0,${-symSize} Z" fill="url(#fg${seed})"/>`;
      // Inner accent
      svg += `<ellipse cx="0" cy="${-symSize * 0.2}" rx="${symSize * 0.25}" ry="${symSize * 0.35}" fill="url(#ac${seed})" opacity="0.6"/>`;
      break;
      
    case 4: // Squircle symbol
      const s = symSize * 0.9;
      const cr = s * 0.3;
      svg += `<path d="M${-s + cr},${-s} H${s - cr} Q${s},${-s} ${s},${-s + cr} V${s - cr} Q${s},${s} ${s - cr},${s} H${-s + cr} Q${-s},${s} ${-s},${s - cr} V${-s + cr} Q${-s},${-s} ${-s + cr},${-s} Z" fill="none" stroke="url(#fg${seed})" stroke-width="${symStroke}" stroke-linecap="round" stroke-linejoin="round"/>`;
      break;
      
    case 5: // Three dots (bubbles, menu)
      const dotR = symSize * 0.18;
      const spacing = symSize * 0.7;
      svg += `<circle cx="${-spacing}" cy="0" r="${dotR}" fill="url(#fg${seed})"/>`;
      svg += `<circle cx="0" cy="0" r="${dotR}" fill="url(#ac${seed})"/>`;
      svg += `<circle cx="${spacing}" cy="0" r="${dotR}" fill="url(#fg${seed})"/>`;
      break;
  }
  
  svg += `</g>`;
  svg += `</svg>`;
  
  return svg;
}

// ============ Render ============
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const totalCount = document.getElementById('totalCount');
const filteredCount = document.getElementById('filteredCount');
const showCount = document.getElementById('showCount');
const emptyState = document.getElementById('emptyState');

let filteredGames = GAMES;
let iconCache = new Map();

function renderGames(games) {
  grid.innerHTML = '';
  
  if (games.length === 0) {
    emptyState.classList.remove('hidden');
    grid.appendChild(emptyState);
    return;
  }
  
  emptyState.classList.add('hidden');
  
  const fragment = document.createDocumentFragment();
  
  games.forEach(game => {
    const card = document.createElement('a');
    card.href = game.url;
    card.className = 'card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', game.title);
    
    // Get or generate icon
    let iconSvg = iconCache.get(game.title);
    if (!iconSvg) {
      iconSvg = generateIconSVG(game.title);
      iconCache.set(game.title, iconSvg);
    }
    
    card.innerHTML = `
      <div class="card-icon">${iconSvg}</div>
      <div class="card-content">
        <h3 class="card-title">${escapeHtml(game.title)}</h3>
      </div>
    `;
    
    fragment.appendChild(card);
  });
  
  grid.appendChild(fragment);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function updateStats() {
  totalCount.textContent = GAMES.length;
  showCount.textContent = filteredGames.length;
  
  if (filteredGames.length !== GAMES.length) {
    filteredCount.classList.remove('hidden');
  } else {
    filteredCount.classList.add('hidden');
  }
}

function filterGames(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    filteredGames = GAMES;
  } else {
    filteredGames = GAMES.filter(game => 
      game.title.toLowerCase().includes(q) || 
      game.filename.toLowerCase().includes(q)
    );
  }
  renderGames(filteredGames);
  updateStats();
}

// Initial render
renderGames(GAMES);
updateStats();

// Search handler
let searchTimeout;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    filterGames(e.target.value);
  }, 80);
});

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
    searchInput.value = '';
    filterGames('');
  }
});

// Touch-friendly: prevent double-tap zoom on cards
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch < 300) {
    e.preventDefault();
  }
  lastTouch = now;
}, { passive: false });

// Performance: IntersectionObserver for lazy icon generation (not needed since we cache)
// But we can defer non-visible icons
const iconObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const card = entry.target;
      const svg = card.querySelector('svg');
      if (svg && svg.dataset.deferred) {
        svg.outerHTML = svg.dataset.deferred;
      }
      iconObserver.unobserve(card);
    }
  });
}, { rootMargin: '100px' });

// Observe cards after render
setTimeout(() => {
  document.querySelectorAll('.card').forEach(card => iconObserver.observe(card));
}, 0);
</script>
