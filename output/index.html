* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {

.topline { position:fixed; top:0; left:0; right:0; height:3px; z-index:50;

.wrap { max-width:1180px; margin:0 auto; padding:22px 18px 60px; }
header { padding:18px 4px 20px; }
h1 { font-size:26px; font-weight:700; letter-spacing:.5px; color:#f2f7fb; }
h1 b { color:#4cb8ff; font-weight:700; }
.sub { margin-top:4px; font-size:13px; color:#8b98a5; }
.sub .count { color:#4cb8ff; font-weight:600; }
.searchbar { position:relative; margin:6px 4px 22px; }
.searchbar svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.55; }
#search {
  width:100%; padding:13px 16px 13px 44px;
  font-size:15px; color:#e8eef3;
  background:#141a21; border:1px solid #26323e; border-radius:0;
  outline:none; transition:border-color .15s, box-shadow .15s;
  font-family:inherit;
}
#search::placeholder { color:#5c6a78; }
#search:focus { border-color:#4cb8ff; box-shadow:0 0 0 3px rgba(76,184,255,.15); }
.grid {
  display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
  gap:12px; justify-items:center;
}
@media (min-width:520px) {
  .grid { grid-template-columns:repeat(auto-fill, minmax(112px,1fr)); }
}
.card {
  width:108px; height:108px;
  background:#161c22; border:1px solid #26323e; border-radius:0;
  display:flex; flex-direction:column; align-items:center;
  position:relative; overflow:hidden; cursor:pointer;
  text-decoration:none; user-select:none; -webkit-user-select:none;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.card:hover { border-color:#4cb8ff; background:#1a222b; transform:translateY(-2px); }
.card:active { transform:translateY(0); }
.card .thumb {
  width:86px; height:86px; margin-top:3px;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
.card .thumb img { width:86px; height:86px; display:block; }
.card .label {
  position:absolute; bottom:0; left:0; right:0;
  padding:4px 6px 5px; text-align:center;
  font-size:11px; line-height:1.25; color:#c9d6e0;
  background:linear-gradient(transparent, rgba(10,14,18,.9) 40%);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  pointer-events:none;
}
.empty { display:none; grid-column:1/-1; text-align:center; padding:50px 0; color:#6b7885; }
.empty.show { display:block; }
/* overlay */
.overlay {
  position:fixed; inset:0; z-index:100; background:rgba(5,8,11,.94);
  opacity:1; transition:opacity .18s ease;
}
.overlay.hidden { opacity:0; pointer-events:none; }
.otop {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; background:#141a21; border-bottom:1px solid #26323e;
}
.back {
  width:40px; height:40px; flex:0 0 auto;
  background:#1b232c; border:1px solid #2c3a48; color:#dbe6ee;
  font-size:20px; line-height:1; cursor:pointer; border-radius:0;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, border-color .12s;
  font-family:inherit;
}
.back:hover { background:#243040; border-color:#4cb8ff; }
.otitle { flex:1; font-size:15px; font-weight:600; color:#e8eef3;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.oframe { position:absolute; top:61px; bottom:0; left:0; right:0; }
.oframe iframe { width:100%; height:100%; border:0; background:#000; }

</style>

const grid = document.getElementById('grid');
const input = document.getElementById('search');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const overlay = document.getElementById('overlay');
const frame = document.getElementById('gameFrame');
const ftitle = document.getElementById('frameTitle');
const backBtn = document.getElementById('backBtn');
const cards = [];

function render(list) {
  grid.innerHTML = '';
  cards.length = 0;
  const frag = document.createDocumentFragment();
  for (const g of list) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '../games-web/' + encodeURI(g.f);
    a.title = g.n;
    a.innerHTML =
      '<span class="thumb"><img src="icons/' + g.i + '" alt="" width="86" height="86" loading="lazy"></span>' +
      '<span class="label"></span>';
    a.querySelector('.label').textContent = g.n;
    a.addEventListener('click', function (e) {
      e.preventDefault();
      ftitle.textContent = g.n;
      frame.src = '../games-web/' + encodeURI(g.f);
      overlay.classList.remove('hidden');
    });
    cards.push(a);
    frag.appendChild(a);
  }
  grid.appendChild(frag);
}

function applyFilter() {
  const q = input.value.trim().toLowerCase();
  let shown = 0;
  for (const a of cards) {
    const hit = !q || a.title.toLowerCase().indexOf(q) !== -1;
    a.style.display = hit ? '' : 'none';
    if (hit) shown++;
  }
  empty.classList.toggle('show', shown === 0);
  count.textContent = q ? (shown + ' / ' + GAMES.length) : String(GAMES.length);
}

function closeGame() {
  frame.src = 'about:blank';
  overlay.classList.add('hidden');
}

render(GAMES);
applyFilter();
input.addEventListener('input', applyFilter);
backBtn.addEventListener('click', closeGame);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeGame();
});
overlay.addEventListener('click', function (e) {
  if (e.target === overlay) closeGame();
});

</script>
