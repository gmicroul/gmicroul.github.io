<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg:#0a1822; --bg2:#0e2230; --panel:#12293a; --line:#1d3a4f;
  --txt:#e8f4f8; --dim:#8fb3c4; --accent:#19a7ce; --accent2:#4fc3f7;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 15% -5%,rgba(25,167,206,.16),transparent 60%),
             radial-gradient(900px 500px at 90% 110%,rgba(46,189,133,.10),transparent 60%),
             linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--txt);min-height:100vh;
}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,24,34,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.bar{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:42px;height:42px;flex:none;filter:drop-shadow(0 6px 14px rgba(20,40,60,.45))}
h1{font-size:1.25rem;font-weight:700;letter-spacing:.5px}
h1 small{display:block;font-size:.7rem;font-weight:400;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
.search{flex:1;min-width:200px;position:relative}
.search input{
  width:100%;padding:12px 16px 12px 44px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,167,206,.22)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--dim)}
.count{
  font-size:.85rem;color:var(--dim);white-space:nowrap;padding:8px 14px;
  border:1px solid var(--line);border-radius:999px;background:var(--panel);
}
.count b{color:var(--accent2);font-size:1rem}
main{max-width:1200px;margin:0 auto;padding:26px 20px 60px}
.grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
}
.card{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:20px 12px 16px;border-radius:18px;text-decoration:none;color:var(--txt);
  background:linear-gradient(150deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 14px 30px rgba(20,40,60,.4)}
.card .icon{width:78px;height:78px;filter:drop-shadow(0 8px 16px rgba(20,40,60,.35));transition:transform .18s ease}
.card:hover .icon{transform:scale(1.07)}
.card .name{font-size:.85rem;font-weight:600;text-align:center;line-height:1.3;word-break:break-word}
.empty{display:none;text-align:center;color:var(--dim);padding:70px 0;font-size:1rem}
footer{text-align:center;color:var(--dim);font-size:.78rem;padding:0 0 34px;letter-spacing:1px}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
  .card{padding:14px 8px 12px;border-radius:14px}
  .card .icon{width:60px;height:60px}
  .card .name{font-size:.75rem}
  h1{font-size:1.05rem}
  .count{order:3;width:100%;text-align:center}
}
</style>
</head>

/* SailfishOS-style palette: ocean first, warm accents used sparingly */
const PALETTES = [
  ["#4FC3F7","#0E7C8C"], ["#19A7CE","#0E7C8C"], ["#2EBD85","#15966B"],
  ["#4FC3F7","#19A7CE"], ["#19A7CE","#15966B"], ["#2EBD85","#0E7C8C"],
  ["#F59B23","#F0544F"], ["#C56CD6","#E85D9E"], ["#FFD34E","#F59B23"]
];

function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h}

function iconSVG(name, idx){
  const pal = PALETTES[hash(name)%PALETTES.length];
  const letter = (name.match(/[A-Za-z0-9\u4e00-\u9fff]/)||["?"])[0].toUpperCase();
  const rot = (idx%2===1) ? ' transform="rotate(90 256 256)"' : '';
  const gid = 'g'+idx;
  return '<svg viewBox="0 0 512 512" aria-hidden="true">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0.866" y2="1">'
    +'<stop offset="0" stop-color="'+pal[0]+'"/><stop offset="1" stop-color="'+pal[1]+'"/>'
    +'</linearGradient></defs>'
    +'<g'+rot+'>'
    +'<path d="M512 0 A512 512 0 0 0 0 512 A512 512 0 0 0 512 0 Z" fill="url(#'+gid+')"/>'
    +'<path d="M512 0 A512 512 0 0 0 0 512 L0 0 Z" fill="#ffffff" opacity="0.10"/>'
    +'<text x="256" y="252" text-anchor="middle" dominant-baseline="central" '
    +'font-family="Segoe UI,system-ui,sans-serif" font-size="216" font-weight="700" fill="#ffffff">'
    +letter+'</text>'
    +'</g></svg>';
}

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const nEl = document.getElementById('n');
document.getElementById('total').textContent = GAMES.length;

function render(list){
  grid.innerHTML = list.map(function(g){

      +'<span class="name">'+g.name+'</span></a>';
  }).join('');
  nEl.textContent = list.length;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

GAMES.forEach(function(g,i){ g.i = i; });
render(GAMES);

document.getElementById('q').addEventListener('input', function(e){
  const q = e.target.value.trim().toLowerCase();
  render(q ? GAMES.filter(function(g){return g.name.toLowerCase().indexOf(q) !== -1}) : GAMES);
});
</script>
</body>
</html>
