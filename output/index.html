<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 | gmicroul.github.io</title>
<style>
  :root{
    --bg0:#0b1220;
    --bg1:#101b30;
    --card:#141f36;
    --card-hi:#1b2a47;
    --line:rgba(255,255,255,.08);
    --text:#e8eef7;
    --dim:#8ea2c0;
    --accent:#2fb4ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%,rgba(47,180,255,.14),transparent 60%),
      radial-gradient(900px 500px at 10% 0%,rgba(140,90,255,.12),transparent 55%),
      linear-gradient(180deg,var(--bg0),var(--bg1));
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}

  header{display:flex;flex-direction:column;gap:18px;margin-bottom:26px}
  .title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{
    width:52px;height:52px;border-radius:16px;flex:none;
    background:linear-gradient(145deg,#2fb4ff,#6a5cff 60%,#a24bff);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(47,180,255,.35),inset 0 1px 0 rgba(255,255,255,.35);
  }
  .logo svg{width:30px;height:30px}
  h1{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:.5px}
  .subtitle{color:var(--dim);font-size:14px;margin-top:2px}

  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .search-box{
    flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 16px;transition:border-color .2s,box-shadow .2s;
  }
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,180,255,.18)}
  .search-box svg{width:18px;height:18px;flex:none;opacity:.6}
  #search{
    flex:1;background:none;border:none;outline:none;color:var(--text);
    font-size:15px;font-family:inherit;
  }
  #search::placeholder{color:var(--dim)}
  .count{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 18px;font-size:14px;color:var(--dim);white-space:nowrap;
  }
  .count b{color:var(--accent);font-size:16px;margin:0 2px}

  .grid{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  }
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
    .wrap{padding:20px 14px 48px}
  }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;
    cursor:pointer;text-decoration:none;color:inherit;
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);background:var(--card-hi);
    border-color:rgba(47,180,255,.4);
    box-shadow:0 12px 28px rgba(0,0,0,.35);
  }
  .card:active{transform:translateY(-1px) scale(.98)}

  /* SailfishOS style: squircle + gradient + top gloss + letter */
  .icon{
    width:64px;height:64px;border-radius:26%;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:800;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    box-shadow:
      0 6px 16px rgba(0,0,0,.35),
      inset 0 2px 3px rgba(255,255,255,.32),
      inset 0 -3px 6px rgba(0,0,0,.22);
    position:relative;overflow:hidden;flex:none;
    user-select:none;
  }
  .icon::after{
    content:"";position:absolute;left:8%;right:8%;top:4%;height:38%;
    border-radius:40% 40% 46% 46%/70% 70% 30% 30%;
    background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));
    pointer-events:none;
  }
  .name{
    font-size:13px;font-weight:600;text-align:center;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;min-height:2.7em;
  }
  .empty{
    grid-column:1/-1;text-align:center;color:var(--dim);
    padding:60px 0;font-size:15px;
  }
  footer{margin-top:40px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>

    return (words[0][0] + words[1][0]).toUpperCase();
  }
  const w = words[0] || '?';
  return w.slice(0, 2).toUpperCase();
}
function makeCard(game){
  const a = document.createElement('a');
  a.className = 'card';
  a.href = game.u;
  a.setAttribute('data-name', game.n.toLowerCase());

  const icon = document.createElement('div');
  icon.className = 'icon';
  const pair = PALETTES[hashName(game.n) % PALETTES.length];
  const angle = 120 + (hashName(game.n) % 90);
  icon.style.background = 'linear-gradient(' + angle + 'deg,' + pair[0] + ',' + pair[1] + ')';
  icon.textContent = initials(game.n);

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = game.n;

  a.appendChild(icon);
  a.appendChild(name);
  return a;
}

const cards = GAMES.map(g => {
  const el = makeCard(g);
  grid.appendChild(el);
  return { el, key: g.n.toLowerCase() };
});
totalEl.textContent = GAMES.length;

let emptyEl = null;
function applyFilter(q){
  q = q.trim().toLowerCase();
  let shown = 0;
  for (const c of cards){
    const match = !q || c.key.indexOf(q) !== -1;
    c.el.style.display = match ? '' : 'none';
    if (match) shown++;
  }
  totalEl.textContent = shown;
  if (shown === 0){
    if (!emptyEl){
      emptyEl = document.createElement('div');
      emptyEl.className = 'empty';
      emptyEl.textContent = '没有找到匹配的游戏';
      grid.appendChild(emptyEl);
    }
  } else if (emptyEl){
    emptyEl.remove();
    emptyEl = null;
  }
}
searchEl.addEventListener('input', e => applyFilter(e.target.value));
</script>
