<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --grad-1:#5FD0F5;
    --grad-2:#3AA8D0;
    --bg:#0b1420;
    --bg-2:#101e2f;
    --card:#14283a;
    --card-hover:#1b3348;
    --text:#eaf6ff;
    --text-dim:#8fb3c9;
    --accent:#5FD0F5;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(95,208,245,.16), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(58,168,208,.14), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(58,168,208,.10), transparent 60%),
      linear-gradient(160deg,#0b1420 0%, #0e1c2a 50%, #0a1220 100%);
    color:var(--text);
    min-height:100%;
    padding-bottom:60px;
    overflow-x:hidden;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px;}

  /* Header */
  header{text-align:center;padding:44px 16px 8px;}
  .logo{
    display:inline-flex;align-items:center;gap:12px;margin-bottom:10px;
  }
  .logo-badge{
    width:52px;height:52px;color:#fff;border-radius:14px;
    font-weight:800;font-size:26px;display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--grad-1),var(--grad-2));
    box-shadow:0 8px 24px rgba(95,208,245,.35);
  }
  h1{font-size:clamp(24px,5vw,40px);font-weight:800;letter-spacing:.5px;
     background:linear-gradient(120deg,#cff2ff,#5FD0F5 45%,#3AA8D0);
     -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--text-dim);margin-top:8px;font-size:15px;}

  /* Stats + search */
  .toolbar{
    margin:28px auto 0;max-width:640px;padding:0 8px;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .stats{
    display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap;
  }
  .stat{text-align:center;}
  .stat b{display:block;font-size:30px;font-weight:800;color:var(--grad-1);line-height:1.1;}
  .stat span{font-size:12px;color:var(--text-dim);letter-spacing:.6px;text-transform:uppercase;}
  .searchbox{position:relative;width:100%;max-width:640px;}
  .searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--text-dim);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;}
  #search{
    width:100%;padding:14px 18px 14px 48px;font-size:16px;color:var(--text);
    background:rgba(16,30,47,.75);border:1px solid rgba(95,208,245,.22);
    border-radius:40px;outline:none;backdrop-filter:blur(6px);
    transition:border-color .2s, box-shadow .2s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(95,208,245,.15);}
  #search::placeholder{color:var(--text-dim);}
  .empty{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:17px;display:none;}

  /* Grid */
  #grid{
    margin-top:34px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:18px;
  }
  @media (min-width:900px){
    #grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;}
  }
  a.card{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    text-decoration:none;color:var(--text);
    background:linear-gradient(180deg,var(--card),#112230);
    border:1px solid rgba(95,208,245,.10);
    border-radius:var(--radius);
    padding:20px 14px 16px;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    cursor:pointer;
  }
  a.card:hover{
    transform:translateY(-5px);
    background:var(--card-hover);
    border-color:rgba(95,208,245,.45);
    box-shadow:0 16px 34px rgba(0,0,0,.45);
  }
  a.card:active{transform:translateY(-2px) scale(.98);}
  .icon{width:82px;height:82px;flex:none;filter:drop-shadow(0 6px 14px rgba(58,168,208,.35));}
  a.card .icon svg{width:100%;height:100%;display:block;}
  .cname{
    font-size:14px;font-weight:600;text-align:center;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:36px;align-content:center;
    color:var(--text);
  }

  footer{text-align:center;color:var(--text-dim);font-size:12.5px;margin-top:46px;}

  /* Fade-in animation */
  a.card{animation:pop .28s ease both;}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

  /* Hidden master defs svg */
  #defs{position:absolute;width:0;height:0;overflow:hidden;}
</style>
</head>

  function shapeIcon(svgIndex, letter){
    // svgIndex in [0,15]. Build an 86x86 icon with gradient fill, clipped highlight and centered letter.
    var i = ((svgIndex % 16) + 16) % 16;
    var clipId = "cp" + i;
    var svg = "<svg viewBox='0 0 86 86' xmlns='http://www.w3.org/2000/svg'>";
    // 1) gradient-filled shape
    svg += "<path d='" + SHAPES[i] + "' fill='url(#lg)'/>";
    // 2) glossy highlight, clipped to the shape (white 0.55 -> 0)
    svg += "<g clip-path='url(#" + clipId + ")'><rect x='0' y='0' width='86' height='86' fill='url(#rg)'/></g>";
    // 3) centered letter label
    svg += "<text x='43' y='49' text-anchor='middle' dominant-baseline='central' fill='#FFFFFF' "
        +  "font-family='system-ui,sans-serif' font-size='29' font-weight='bold'>"
        + letter + "</text>";
    svg += "</svg>";
    return svg;
  }

  function render(list){
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var frag = document.createDocumentFragment();
    list.forEach(function(g, idx){
      var letter = g.name.charAt(0).toUpperCase() || '?';
      var a = document.createElement('a');
      a.className = 'card';
      a.href = g.url;
      a.setAttribute('aria-label', 'Play ' + g.name);
      a.style.animationDelay = (Math.min(idx, 24) * 12) + 'ms';
      var ic = document.createElement('div');
      ic.className = 'icon';
      ic.innerHTML = shapeIcon(idx, letter);
      var nm = document.createElement('div');
      nm.className = 'cname';
      nm.textContent = g.name;
      a.appendChild(ic);
      a.appendChild(nm);
      frag.appendChild(a);
    });
    grid.appendChild(frag);
    document.getElementById('statVis').textContent = list.length;
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  }

  function filter(q){
    q = q.trim().toLowerCase();
    var out;
    if(!q){ out = GAMES; }
    else{ out = GAMES.filter(function(g){ return g.name.toLowerCase().indexOf(q) !== -1; }); }
    render(out);
  }

  (function init(){
    document.getElementById('statTotal').textContent = GAMES.length;
    document.getElementById('year').textContent = new Date().getFullYear();
    var box = document.getElementById('search');
    box.addEventListener('input', function(){ filter(box.value); });
    render(GAMES);

    // quick clear via Escape
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ box.value=''; filter(''); box.blur(); }
    });
  })();
