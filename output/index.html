<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#000000;
    color:#FFFFFF; min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(0,0,0,0.95);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:14px 20px;
  }
  .bar{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo svg{width:34px;height:34px;flex:none}
  .logo em{font-style:normal;background:linear-gradient(135deg,#5FD0F5,#FFB0C4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:13px;color:#888;background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);padding:4px 12px;border-radius:999px;white-space:nowrap}
  .search{margin-left:auto;flex:1;min-width:180px;max-width:420px;position:relative}
  .search input{
    width:100%;padding:10px 16px 10px 40px;border-radius:999px;
    border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);
    color:#FFFFFF;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .search input:focus{border-color:#5FD0F5;box-shadow:0 0 0 3px rgba(95,208,245,0.18)}
  .search input::placeholder{color:#666}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#666;fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
  main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
  .grid{display:grid;gap:18px 14px;grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
  @media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:22px 18px}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:26px 22px}}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:16px 8px 14px;border-radius:18px;text-decoration:none;color:#FFFFFF;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-5px);background:rgba(255,255,255,0.08);
    border-color:rgba(95,208,245,0.4);box-shadow:0 12px 28px rgba(0,0,0,0.6);outline:none;
  }
  .icon{width:78%;max-width:112px;aspect-ratio:1/1}
  .icon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.4))}
  .card:hover .icon svg{filter:drop-shadow(0 12px 22px rgba(0,0,0,0.5))}
  .name{
    font-size:13px;font-weight:600;text-align:center;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;min-height:2.7em;
  }
  .empty{display:none;text-align:center;color:#666;padding:70px 0;font-size:16px}
  footer{text-align:center;color:#555;font-size:12px;padding:0 0 30px;opacity:.7}
</style>
</head>

/* Odd (1,3,5...): gradient #5FD0F5 -> #3AA8D0 */
/* Even (2,4,6...): gradient #FFD8E0 -> #FFB0C4, rotated 90deg */
var ODD_GRAD_A = "#5FD0F5", ODD_GRAD_B = "#3AA8D0";
var EVEN_GRAD_A = "#FFD8E0", EVEN_GRAD_B = "#FFB0C4";

function hash(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}

function firstLetter(name){
  var m = /[A-Za-z0-9\u4e00-\u9fff]/.exec(name);
  return m ? m[0].toUpperCase() : "?";
}

function iconSVG(g, index){
  var isOdd = (index % 2 === 0); // 0-based: 0,2,4... are 1st,3rd,5th
  var L = firstLetter(g.n);
  var gradA = isOdd ? ODD_GRAD_A : EVEN_GRAD_A;
  var gradB = isOdd ? ODD_GRAD_B : EVEN_GRAD_B;
  var textColor = (!isOdd && L === 'I') ? "#E85D9E" : "#FFFFFF";
  
  // For even indices (2nd, 4th, 6th...), rotate the whole group (shape+highlight) 90deg around center (43,47)
  // Text stays upright (not rotated)
  var groupTransform = isOdd ? "translate(0 -4)" : "translate(0 -4) rotate(90 43 47)";
  
  return '<svg viewBox="0 0 86 86" role="img" aria-label="'+g.n.replace(/"/g,'')+'">'

    + '<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>'
    + '</radialGradient>'
    + '</defs>'
    + '<g transform="'+groupTransform+'">'
    + '<path d="'+SHAPE+'" fill="url(#g'+index+')"/>'
    + '<path d="'+SHAPE+'" fill="url(#h'+index+')"/>'
    + '<text x="43" y="47" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="29" font-weight="bold" fill="'+textColor+'">'+L+'</text>'
    + '</g>'

}

var cards = [];

GAMES.forEach(function(g, i){
  var a = document.createElement("a");
  a.className = "card";
  a.href = "/games-web/" + encodeURIComponent(g.f);
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML = '<span class="icon">'+iconSVG(g,i)+'</span><span class="name"></span>';
  a.querySelector(".name").textContent = g.n;
  grid.appendChild(a);
  cards.push({el:a, name:g.n.toLowerCase()});
});

var countEl = document.getElementById("count");
var emptyEl = document.getElementById("empty");
var total = GAMES.length;

function setCount(n){
  countEl.textContent = n + " / " + total + " 款游戏";
}
setCount(total);

var q = document.getElementById("q");
q.addEventListener("input", function(){
  var v = q.value.trim().toLowerCase(), shown = 0;
  cards.forEach(function(c){
    var hit = !v || c.name.indexOf(v) !== -1;
    c.el.style.display = hit ? "" : "none";
    if(hit) shown++;
  });
  setCount(shown);
  emptyEl.style.display = shown ? "none" : "block";
});
