<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · Game Hub</title>
<style>
  :root {
    --bg1: #06222C;
    --bg2: #0A3A47;
    --card: #0E3240;
    --card-hover: #145062;
    --text: #EAF6F8;
    --dim: #8FB6C0;
    --accent: #4FC3F7;
    --accent2: #2EBD85;
    --accent3: #19A7CE;
    --accent4: #15966B;
    --coral: #F0544F;
    --orange: #F59B23;
    --yellow: #FFD34E;
  }
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  html {
    scroll-behavior: smooth;
  }
  
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
  }
  
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(6, 34, 44, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(79, 195, 247, 0.18);
    padding: 14px 20px;
  }
  
  .bar {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  
  .logo .leaf-icon {
    width: 34px;
    height: 34px;
    flex: none;
  }
  
  .logo em {
    font-style: normal;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  
  .count {
    font-size: 13px;
    color: var(--dim);
    background: rgba(79, 195, 247, 0.10);
    border: 1px solid rgba(79, 195, 247, 0.25);
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  
  .search {
    margin-left: auto;
    flex: 1;
    min-width: 180px;
    max-width: 420px;
    position: relative;
  }
  
  .search input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 999px;
    border: 1px solid rgba(79, 195, 247, 0.30);
    background: rgba(14, 50, 64, 0.85);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.18);
  }
  
  .search input::placeholder {
    color: var(--dim);
  }
  
  .search svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--dim);
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    pointer-events: none;
  }
  
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  
  .grid {
    display: grid;
    gap: 18px 14px;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
  }
  
  @media (min-width: 600px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 22px 18px;
    }
  }
  
  @media (min-width: 1000px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 26px 22px;
    }
  }
  
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px 8px 14px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--text);
    background: linear-gradient(140deg, var(--card) 0%, #114050 100%);
    border: 1px solid rgba(79, 195, 247, 0.12);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  
  .card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(79, 195, 247, 0.35);
    border-color: rgba(79, 195, 247, 0.45);
    background: linear-gradient(140deg, var(--card-hover) 0%, #1a6078 100%);
  }
  
  .card:active {
    transform: translateY(-1px) scale(0.99);
  }
  
  .icon-wrapper {
    width: 72px;
    height: 72px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 
      inset 0 1px 0 rgba(255, 255, 255, 0.1),
      0 4px 16px rgba(0, 0, 0, 0.25),
      0 0 0 1px rgba(255, 255, 255, 0.03);
  }
  
  .card:hover .icon-wrapper {
    box-shadow: 
      inset 0 1px 0 rgba(255, 255, 255, 0.15),
      0 8px 24px rgba(0, 0, 0, 0.35),
      0 0 0 1px rgba(79, 195, 247, 0.3);
    border-color: rgba(79, 195, 247, 0.4);
  }
  
  .leaf-svg {
    width: 56px;
    height: 56px;
    display: block;
  }
  
  .card-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    max-width: 100%;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    letter-spacing: 0.2px;
  }
  
  .card:hover .card-title {
    color: var(--accent);
  }
  
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--dim);
  }
  
  .empty-state svg {
    width: 64px;
    height: 64px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  
  .empty-state p {
    font-size: 16px;
  }
  
  /* Color variations for leaf icons - ocean theme colors */
  .leaf-icon-0 { --leaf-bg: #0E7C8C; --leaf-fg: #FFFFFF; }
  .leaf-icon-1 { --leaf-bg: #19A7CE; --leaf-fg: #FFFFFF; }
  .leaf-icon-2 { --leaf-bg: #4FC3F7; --leaf-fg: #FFFFFF; }
  .leaf-icon-3 { --leaf-bg: #2EBD85; --leaf-fg: #FFFFFF; }
  .leaf-icon-4 { --leaf-bg: #15966B; --leaf-fg: #FFFFFF; }
  .leaf-icon-5 { --leaf-bg: #0E7C8C; --leaf-fg: #F5F7F7; }
  .leaf-icon-6 { --leaf-bg: #19A7CE; --leaf-fg: #F5F7F7; }
  .leaf-icon-7 { --leaf-bg: #4FC3F7; --leaf-fg: #F5F7F7; }
  .leaf-icon-8 { --leaf-bg: #2EBD85; --leaf-fg: #F5F7F7; }
  .leaf-icon-9 { --leaf-bg: #15966B; --leaf-fg: #F5F7F7; }
  .leaf-icon-10 { --leaf-bg: #006064; --leaf-fg: #FFFFFF; }
  .leaf-icon-11 { --leaf-bg: #00838F; --leaf-fg: #FFFFFF; }
  .leaf-icon-12 { --leaf-bg: #00ACC1; --leaf-fg: #FFFFFF; }
  .leaf-icon-13 { --leaf-bg: #26C6DA; --leaf-fg: #FFFFFF; }
  .leaf-icon-14 { --leaf-bg: #4DD0E1; --leaf-fg: #FFFFFF; }
  .leaf-icon-15 { --leaf-bg: #80DEEA; --leaf-fg: #06222C; }
  .leaf-icon-16 { --leaf-bg: #004D40; --leaf-fg: #FFFFFF; }
  .leaf-icon-17 { --leaf-bg: #00695C; --leaf-fg: #FFFFFF; }
  .leaf-icon-18 { --leaf-bg: #00796B; --leaf-fg: #FFFFFF; }
  .leaf-icon-19 { --leaf-bg: #00897B; --leaf-fg: #FFFFFF; }
  .leaf-icon-20 { --leaf-bg: #009688; --leaf-fg: #FFFFFF; }
  .leaf-icon-21 { --leaf-bg: #26A69A; --leaf-fg: #FFFFFF; }
  .leaf-icon-22 { --leaf-bg: #4DB6AC; --leaf-fg: #FFFFFF; }
  .leaf-icon-23 { --leaf-bg: #80CBC4; --leaf-fg: #06222C; }
  
  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .card, .card-title, .icon-wrapper {
      transition: none !important;
    }
  }
  
  /* Focus visible for accessibility */
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>

// SailfishOS leaf icon SVG generator
function createLeafIcon(index, size = 56) {
  const colorIndex = index % 24;
  const leafClass = `leaf-icon-${colorIndex}`;
  
  // SailfishOS leaf shape: square with left-bottom and right-top right angles
  // The shape uses a square (512x512), with circle radius = 256 (half the square)
  // Keep only top-left and bottom-right quadrants of the circle
  const svg = `
    <svg class="leaf-svg ${leafClass}" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" style="width:${size}px;height:${size}px;">
      <defs>
        <linearGradient id="leafGrad${index}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--leaf-bg)"/>
          <stop offset="100%" stop-color="var(--leaf-bg)" stop-opacity="0.85"/>
        </linearGradient>
        <linearGradient id="leafHighlight${index}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--leaf-fg)" stop-opacity="0.25"/>
          <stop offset="50%" stop-color="var(--leaf-fg)" stop-opacity="0.05"/>
          <stop offset="100%" stop-color="var(--leaf-fg)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- Main leaf shape: square with left-bottom and right-top right angles -->
      <!-- The square edges are radius (256), circle from center with radius 256 -->
      <!-- Keep only top-left and bottom-right arcs forming a closed loop -->
      <path d="M0 256 L0 0 L256 0 C256 141.1 370.1 256 512 256 C370.1 370.9 256 512 256 512 L256 256 L0 256 Z" fill="url(#leafGrad${index})"/>
      <!-- Highlight overlay for depth (top-left area) -->
      <path d="M0 256 L0 0 L256 0 C256 80 300 120 370.1 256 C300 320 256 370.9 256 512 L256 256 L0 256 Z" fill="url(#leafHighlight${index})"/>
    </svg>
  `;
  return svg;
}

// Render game cards
function renderGames(filter = '') {
  const grid = document.getElementById('gameGrid');
  const emptyState = document.getElementById('emptyState');
  const countEl = document.getElementById('gameCount');
  
  const filtered = GAMES.filter(game => 
    game.title.toLowerCase().includes(filter.toLowerCase())
  );
  
  countEl.textContent = `${filtered.length} / ${GAMES.length} 款游戏`;
  
  if (filtered.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  
  emptyState.style.display = 'none';
  
  grid.innerHTML = filtered.map((game, idx) => `
    <a href="${game.url}" class="card" role="listitem" tabindex="0" data-title="${game.title.replace(/"/g, '"')}">
      <div class="icon-wrapper">
        ${createLeafIcon(idx)}
      </div>
      <span class="card-title">${game.title}</span>
    </a>
  `).join('');
}

// Search functionality
const searchInput = document.getElementById('searchInput');
let searchDebounce;

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    renderGames(e.target.value);
  }, 80);
});

// Initial render
renderGames();

// Keyboard navigation enhancement
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
    searchInput.value = '';
    renderGames('');
  }
});
</script>
