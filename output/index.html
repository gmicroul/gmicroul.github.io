<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="HTML5 游戏大厅 · Game Hub">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg: #0b1220;
  --bg-2: #111a2e;
  --card: #17233d;
  --card-hover: #1d2c4d;
  --border: #243861;
  --text: #eef4ff;
  --muted: #93a5c9;
  --accent: #5FD0F5;
  --accent2: #3AA8D0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(63,168,208,.22), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(95,208,245,.14), transparent 55%),
    linear-gradient(160deg, var(--bg), var(--bg-2));
  color: var(--text);
  min-height:100vh;
}
header{
  padding: 40px 20px 20px;
  text-align:center;
}
header h1{
  font-size: clamp(28px, 5vw, 44px);
  font-weight:800;
  letter-spacing:.5px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
header .sub{
  color: var(--muted);
  margin-top:8px;
  font-size:15px;
}
.controls{
  max-width:760px;
  margin: 22px auto 6px;
  padding: 0 20px;
}
.search-wrap{
  position:relative;
}
.search-wrap svg{
  position:absolute; left:16px; top:50%;
  transform:translateY(-50%);
  width:18px;height:18px;
  stroke: var(--muted);
  fill:none; stroke-width:2;
  pointer-events:none;
}
#search{
  width:100%;
  padding: 14px 18px 14px 46px;
  font-size:16px;
  color: var(--text);
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 14px;
  outline:none;
  transition: border .2s, box-shadow .2s, background .2s;
}
#search::placeholder{color:var(--muted)}
#search:focus{
  border-color: var(--accent);
  background: rgba(255,255,255,.07);
  box-shadow: 0 0 0 3px rgba(95,208,245,.18);
}
.stat{
  max-width:1060px;
  margin:0 auto;
  padding: 6px 20px 0;
  font-size:13px;
  color: var(--muted);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
.stat b{color:var(--accent); font-weight:700}
.clear-btn{
  background:none;border:none;color:var(--accent);
  cursor:pointer;font-size:13px;padding:2px 6px;
  text-decoration:underline;
}
.clear-btn.hidden{visibility:hidden}

/* responsive grid */
.grid{
  max-width:1200px;
  margin: 22px auto 60px;
  padding: 0 20px;
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
@media (max-width: 520px){
  .grid{grid-template-columns: repeat(2, 1fr); gap: 12px;}
}
@media (min-width: 900px){
  .grid{grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));}
}

.card{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding: 16px 8px 14px;
  background: linear-gradient(180deg, var(--card), rgba(23,35,61,.6));
  border: 1px solid var(--border);
  border-radius: 14px;
  text-decoration:none;
  color: var(--text);
  transition: transform .18s ease, border-color .18s, box-shadow .18s, background .18s;
  overflow:hidden;
  position:relative;
}
.card:hover{
  transform: translateY(-5px);
  border-color: var(--accent);
  background: linear-gradient(180deg, var(--card-hover), rgba(29,44,77,.7));
  box-shadow: 0 12px 28px -8px rgba(0,0,0,.55), 0 0 0 1px rgba(95,208,245,.25);
}
.card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- icon badge (emulates the filled shape SVG) ----
   fill only black shape: gradient 135°, highlight radial, centered bold letter */
.badge{
  width: 76px; height:76px;
  border-radius: 22%;
  display:flex; align-items:center; justify-content:center;
  /* linear 135deg #5FD0F5 -> #3AA8D0 */
  background-image:
    linear-gradient(135deg, #5FD0F5 0%, #3AA8D0 100%);
  position:relative;
  flex-shrink:0;
  box-shadow: 0 6px 16px -6px rgba(63,168,208,.55), 0 1px 0 rgba(255,255,255,.25) inset;
}
/* radial top-left highlight: center (0.25,0.25) r .6, white 0.55 -> 0 */
.badge::after{
  content:"";
  position:absolute; inset:0;
  border-radius:22%;
  background: radial-gradient(circle at 25% 25%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 60%);
  pointer-events:none;
}
/* centered white bold letter 29px */
.badge .glyph{
  position:relative; z-index:1;
  color:#FFFFFF;
  font-weight:bold;
  font-size:29px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height:1;
  user-select:none;
  text-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.card .name{
  font-size:13.5px;
  text-align:center;
  font-weight:600;
  line-height:1.25;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  max-width:100%;
  min-height: 2.5em;
}
.empty{
  grid-column: 1 / -1;
  text-align:center;
  color: var(--muted);
  padding: 60px 20px;
}
footer{
  text-align:center;
  color: var(--muted);
  font-size:12px;
  padding: 30px 20px 40px;
}
</style>
</head>

  function clearHighlight(node){
    if (window.getSelection) window.getSelection().removeAllRanges();
  }

  function render(list){
    grid.innerHTML = '';
    if (!list.length){
      var d = document.createElement('div');
      d.className = 'empty';
      d.textContent = '没有找到匹配的游戏';
      grid.appendChild(d);
      countEl.textContent = 0;
      return;
    }
    var frag = document.createDocumentFragment();
    for (var i = 0; i < list.length; i++){
      var g = list[i];
      var glyph = (i % GLYPHS.length) === 0 ? initialOf(g.name) : GLYPHS[i % GLYPHS.length];
      var card = document.createElement('a');
      card.className = 'card';
      card.href = g.href;
      card.setAttribute('aria-label', '打开 ' + g.name);
      card.innerHTML =
        '<div class="badge"><span class="glyph"></span></div>' +
        '<div class="name"></div>';
      card.querySelector('.glyph').textContent = glyph;
      card.querySelector('.name').textContent = g.name;
      card.addEventListener('click', clearHighlight);
      frag.appendChild(card);
    }
    grid.appendChild(frag);
    countEl.textContent = list.length;
  }

  function applyFilter(){
    var q = search.value.trim().toLowerCase();
    var list = q
      ? GAMES.filter(function(g){ return g.name.toLowerCase().indexOf(q) !== -1; })
      : GAMES;
    render(list);
    clearBtn.classList.toggle('hidden', !q);
  }

  search.addEventListener('input', applyFilter);
  clearBtn.addEventListener('click', function(){
    search.value = '';
    search.focus();
    applyFilter();
  });

  render(GAMES);
})();
</script>
</body>
</html>
