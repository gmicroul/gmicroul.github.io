<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏大厅 - GitHub Pages</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --card-border: #222222;
      --text-primary: #ffffff;
      --text-secondary: #aaaaaa;
      --accent-blue: #5FD0F5;
      --accent-pink: #FFD8E0;
      --search-bg: #1a1a1a;
      --search-border: #333333;
      --hover-glow: rgba(95, 208, 245, 0.15);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    .header {
      padding: 24px 16px;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .header h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #5FD0F5 0%, #FFD8E0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .game-count {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Search */
    .search-container {
      max-width: 600px;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      font-size: 16px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      border-radius: 12px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: #666;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(95, 208, 245, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      stroke: var(--text-secondary);
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--card-border);
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .clear-btn:hover {
      background: #333;
      color: var(--text-primary);
    }

    .clear-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 24px 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (max-width: 480px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 16px 12px;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .games-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1025px) and (max-width: 1280px) {
      .games-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1281px) {
      .games-grid {
        grid-template-columns: repeat(8, 1fr);
        gap: 16px;
      }
    }

    /* Game Card */
    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px var(--hover-glow), 0 4px 16px rgba(0, 0, 0, 0.4);
      border-color: var(--accent-blue);
    }

    .game-card:active {
      transform: translateY(-2px) scale(0.98);
    }

    .game-card.hidden {
      display: none;
    }

    .game-icon-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
      min-height: 0;
    }

    .game-icon-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    .game-info {
      padding: 12px 14px 14px;
      text-align: center;
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.3);
    }

    .game-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* SailfishOS Style Icon */
    .sailfish-icon {
      width: 86px;
      height: 86px;
    }

    .sailfish-icon .bg-path {
      transform-origin: 43px 47px;
    }

    .sailfish-icon .highlight {
      opacity: 0.55;
    }

    .sailfish-icon .label {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 29px;
      fill: #FFFFFF;
      dominant-baseline: central;
      text-anchor: middle;
    }

    /* No results */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .no-results svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      stroke: var(--text-secondary);
      opacity: 0.5;
    }

    .no-results p {
      font-size: 16px;
    }

    /* Footer */
    .footer {
      padding: 24px 16px;
      text-align: center;
      border-top: 1px solid var(--card-border);
      color: var(--text-secondary);
      font-size: 13px;
    }

    .footer a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Loading state */
    .game-card.loading .game-icon-svg {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .game-card,
      .search-input,
      .clear-btn,
      .game-icon-svg {
        transition: none;
        animation: none;
      }
      .game-card:hover {
        transform: none;
      }
    }
  </style>
</head>

    // ===== SAILFISHOS ICON GENERATOR =====
    function generateSailfishIcon(index, title) {
      const isOdd = (index % 2) === 0; // 0-based: odd positions (1,3,5) = even indices
      const firstChar = title.trim().charAt(0).toUpperCase();
      const textColor = (firstChar === 'I') ? '#E85D9E' : '#FFFFFF';
      
      if (isOdd) {
        // Odd: no rotation, blue gradient
        return `<svg class="sailfish-icon game-icon-svg" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
  <defs>
    <linearGradient id="grad-blue-${index}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5FD0F5"/>
      <stop offset="100%" stop-color="#3AA8D0"/>
    </linearGradient>
    <radialGradient id="highlight-${index}" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-${index}">
      <path class="bg-path" d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-${index})">
    <path class="bg-path" d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#grad-blue-${index})"/>
    <ellipse class="highlight" cx="21.5" cy="21.5" rx="25.8" ry="25.8" fill="url(#highlight-${index})"/>
  </g>
  <text class="label" x="43" y="47" fill="${textColor}">${firstChar}</text>
</svg>`;
      } else {
        // Even: rotated 90deg, pink gradient, text not rotated
        return `<svg class="sailfish-icon game-icon-svg" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
  <defs>
    <linearGradient id="grad-pink-${index}" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFD8E0"/>
      <stop offset="100%" stop-color="#FFB0C4"/>
    </linearGradient>
    <radialGradient id="highlight-${index}" cx="0.25" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-${index}">
      <path class="bg-path" d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-${index})" transform="rotate(90 43 47)">
    <path class="bg-path" d="M 1.7229995,4.3 H 43 c 23.583,0 42.7,19.118 42.7,42.7 v 41.277 c 0,0.786 -0.637,1.423 -1.423,1.423 H 43 C 19.417,89.7 0.2999995,70.582 0.2999995,47 V 5.723 c 0,-0.786 0.637,-1.423 1.423,-1.423 z" fill="url(#grad-pink-${index})"/>
    <ellipse class="highlight" cx="21.5" cy="21.5" rx="25.8" ry="25.8" fill="url(#highlight-${index})"/>
  </g>
  <text class="label" x="43" y="47" fill="${textColor}">${firstChar}</text>
</svg>`;
      }
    }

    // ===== RENDER GAME CARDS =====
    const grid = document.getElementById('gamesGrid');
    const gameCountEl = document.getElementById('gameCount');
    const noResults = document.getElementById('noResults');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    function renderGames(filter = '') {
      grid.innerHTML = '';
      let visibleCount = 0;
      const lowerFilter = filter.toLowerCase().trim();

      gamesData.forEach((game, index) => {
        const titleLower = game.title.toLowerCase();
        const matches = !lowerFilter || titleLower.includes(lowerFilter);
        
        if (!matches) return;
        
        visibleCount++;
        const card = document.createElement('article');
        card.className = 'game-card';
        card.dataset.title = game.title;
        card.role = 'listitem';
        card.tabIndex = 0;
        
        // Use absolute root path for GitHub Pages
        const gameUrl = '/games-web/' + game.rel_path;
        
        card.innerHTML = `
          <div class="game-icon-wrapper">
            ${generateSailfishIcon(index, game.title)}
          </div>
          <div class="game-info">
            <div class="game-title" title="${game.title}">${game.title}</div>
          </div>
        `;

        // Click handler
        const openGame = (e) => {
          // Don't navigate if clicking on interactive elements
          if (e.target.closest('a, button, input')) return;
          window.location.href = gameUrl;
        };

        card.addEventListener('click', openGame);
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openGame(e);
          }
        });

        grid.appendChild(card);
      });

      gameCountEl.textContent = filter 
        ? `找到 ${visibleCount} 款游戏 (共 ${gamesData.length} 款)`
        : `共 ${gamesData.length} 款游戏`;

      noResults.style.display = visibleCount === 0 && filter ? 'block' : 'none';
    }

    // ===== SEARCH =====
    let searchDebounce;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        const value = e.target.value;
        clearBtn.style.display = value ? 'flex' : 'none';
        renderGames(value);
      }, 120);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      renderGames('');
      searchInput.focus();
    });

    // Clear on Escape
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        renderGames('');
        searchInput.blur();
      }
    });

    // ===== INIT =====
    renderGames();

    // Focus search on '/' key (when not in input)
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        searchInput.focus();
      }
    });
  </script>
