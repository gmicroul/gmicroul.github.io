<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="游戏导航主页 - 224+ 款精选HTML5游戏">
    <title>游戏大厅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #111820;
            --bg-card: #151d2a;
            --bg-card-hover: #1a2434;
            --text-primary: #e8ecf1;
            --text-secondary: #8b95a1;
            --text-muted: #5a6573;
            --accent-cyan: #19a7ce;
            --accent-teal: #0e7c8c;
            --accent-green: #2ebd85;
            --accent-coral: #f0544f;
            --accent-orange: #f59b23;
            --accent-yellow: #ffd34e;
            --accent-purple: #c56cd6;
            --border-color: #1e2a3a;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f0f4f8;
                --bg-secondary: #e8eef5;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f9fc;
                --text-primary: #1a2330;
                --text-secondary: #5a6573;
                --text-muted: #8b95a1;
                --border-color: #d0dce8;
                --shadow-sm: 0 2px 8px rgba(20, 40, 60, 0.08);
                --shadow-md: 0 8px 24px rgba(20, 40, 60, 0.12);
                --shadow-lg: 0 16px 48px rgba(20, 40, 60, 0.16);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(25, 167, 206, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(46, 189, 133, 0.06), transparent);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, var(--bg-secondary), transparent);
        }

        .header h1 {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .header .subtitle {
            font-size: clamp(0.875rem, 1.5vw, 1rem);
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Search */
        .search-container {
            padding: clamp(12px, 2.5vw, 20px) clamp(16px, 4vw, 32px);
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 52px;
            font-size: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.15);
        }

        .search-clear {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .search-clear.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .search-clear:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: clamp(16px, 3vw, 32px);
            padding: 0 clamp(16px, 4vw, 32px) clamp(16px, 3vw, 24px);
            font-size: clamp(0.8rem, 1.2vw, 0.9rem);
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .stat-value.accent {
            color: var(--accent-cyan);
        }

        /* Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: clamp(12px, 2vw, 16px);
            padding: 0 clamp(16px, 4vw, 32px) clamp(24px, 4vw, 40px);
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 0 12px 24px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .games-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1025px) and (max-width: 1400px) {
            .games-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @media (min-width: 1401px) {
            .games-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        /* Game Card */
        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
            box-shadow: var(--shadow-md);
            background: var(--bg-card-hover);
        }

        .game-card:active {
            transform: translateY(-1px);
            transition-duration: 0.1s;
        }

        .game-card.hidden {
            display: none;
        }

        /* Icon Container - SailfishOS Style */
        .icon-container {
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
        }

        .game-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* SailfishOS Icon Base Styles */
        .sailfish-icon {
            width: 78%;
            height: 78%;
            position: relative;
            border-radius: 26%;
        }

        /* Shape 1: Circle / Concentric */
        .shape-circle .sailfish-icon {
            border-radius: 50%;
        }

        /* Shape 2: Squircle */
        .shape-squircle .sailfish-icon {
            border-radius: 26%;
        }

        /* Shape 3: Organic (teardrop-like) */
        .shape-organic .sailfish-icon {
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }

        /* Icon Background Gradient */
        .sailfish-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--icon-gradient);
            border-radius: inherit;
        }

        /* Negative space symbol - cutout */
        .sailfish-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
        }

        /* Specific symbol patterns using clip-path for negative space */
        .symbol-quadrant .sailfish-icon {
            --symbol-size: 45%;
        }

        .symbol-quadrant .sailfish-icon::after {
            width: var(--symbol-size);
            height: var(--symbol-size);
            background: var(--bg-primary);
            clip-path: var(--quadrant-clip);
        }

        .symbol-circle .sailfish-icon::after {
            width: 38%;
            height: 38%;
            border-radius: 50%;
            background: var(--bg-primary);
        }

        .symbol-cross .sailfish-icon::after {
            width: 50%;
            height: 50%;
            background: var(--bg-primary);
            clip-path: polygon(25% 0, 75% 0, 75% 25%, 100% 25%, 100% 75%, 75% 75%, 75% 100%, 25% 100%, 25% 75%, 0 75%, 0 25%, 25% 25%);
        }

        .symbol-diamond .sailfish-icon::after {
            width: 42%;
            height: 42%;
            background: var(--bg-primary);
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .symbol-triangle .sailfish-icon::after {
            width: 0;
            height: 0;
            background: transparent;
            border-left: 22% solid transparent;
            border-right: 22% solid transparent;
            border-bottom: 38% solid var(--bg-primary);
            transform: translate(-50%, -30%);
        }

        .symbol-hexagon .sailfish-icon::after {
            width: 40%;
            height: 40%;
            background: var(--bg-primary);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .symbol-star .sailfish-icon::after {
            width: 45%;
            height: 45%;
            background: var(--bg-primary);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .symbol-gear .sailfish-icon::after {
            width: 44%;
            height: 44%;
            background: var(--bg-primary);
            border-radius: 50%;
            box-shadow: 
                0 -32% 0 -8% var(--bg-primary),
                28% -16% 0 -8% var(--bg-primary),
                28% 16% 0 -8% var(--bg-primary),
                0 32% 0 -8% var(--bg-primary),
                -28% 16% 0 -8% var(--bg-primary),
                -28% -16% 0 -8% var(--bg-primary);
        }

        .symbol-play .sailfish-icon::after {
            width: 0;
            height: 0;
            background: transparent;
            border-left: 28% solid var(--bg-primary);
            border-top: 16% solid transparent;
            border-bottom: 16% solid transparent;
            transform: translate(-40%, -50%);
        }

        .symbol-pause .sailfish-icon::after {
            width: 36%;
            height: 48%;
            background: var(--bg-primary);
            clip-path: polygon(0 0, 40% 0, 40% 100%, 0 100%, 60% 100%, 60% 0, 100% 0, 100% 100%, 60% 100%, 60% 0, 40% 0, 40% 100%);
        }

        .symbol-arrow .sailfish-icon::after {
            width: 38%;
            height: 38%;
            background: var(--bg-primary);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 50% 65%, 0% 65%, 0% 35%, 50% 35%);
        }

        .symbol-heart .sailfish-icon::after {
            width: 40%;
            height: 40%;
            background: var(--bg-primary);
            clip-path: path('M50,15 C30,15 15,30 15,45 C15,55 30,65 50,85 C70,65 85,55 85,45 C85,30 70,15 50,15 Z');
        }

        .symbol-bolt .sailfish-icon::after {
            width: 35%;
            height: 35%;
            background: var(--bg-primary);
            clip-path: polygon(55% 0%, 90% 45%, 60% 45%, 100% 100%, 45% 100%, 10% 55%, 40% 55%, 0% 0%);
        }

        .symbol-droplet .sailfish-icon::after {
            width: 36%;
            height: 36%;
            background: var(--bg-primary);
            border-radius: 50% 50% 50% 0;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .symbol-leaf .sailfish-icon::after {
            width: 38%;
            height: 38%;
            background: var(--bg-primary);
            border-radius: 50% 0 50% 50%;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .symbol-wave .sailfish-icon::after {
            width: 50%;
            height: 30%;
            background: var(--bg-primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 40% 0 0 var(--bg-primary);
        }

        .symbol-dots .sailfish-icon::after {
            width: 12%;
            height: 12%;
            background: var(--bg-primary);
            border-radius: 50%;
            box-shadow: 
                -35% -35% 0 0 var(--bg-primary),
                35% -35% 0 0 var(--bg-primary),
                -35% 35% 0 0 var(--bg-primary),
                35% 35% 0 0 var(--bg-primary);
        }

        .symbol-ring .sailfish-icon::after {
            width: 55%;
            height: 55%;
            border: 12% solid var(--bg-primary);
            border-radius: 50%;
            background: transparent;
        }

        .symbol-target .sailfish-icon::after {
            width: 45%;
            height: 45%;
            border: 10% solid var(--bg-primary);
            border-radius: 50%;
            background: transparent;
            box-shadow: inset 0 0 0 10% var(--bg-primary);
        }

        /* Accent dot */
        .accent-dot .sailfish-icon::before {
            content: '';
            position: absolute;
            top: 12%;
            right: 12%;
            width: 18%;
            height: 18%;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* Gradient definitions */
        .gradient-ocean { --icon-gradient: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%); }
        .gradient-deep { --icon-gradient: linear-gradient(135deg, #0a5a67 0%, #0e7c8c 50%, #15966b 100%); }
        .gradient-teal { --icon-gradient: linear-gradient(135deg, #15966b 0%, #2ebd85 50%, #4fc3f7 100%); }
        .gradient-sky { --icon-gradient: linear-gradient(135deg, #19a7ce 0%, #4fc3f7 50%, #81d4fa 100%); }
        .gradient-coral { --icon-gradient: linear-gradient(135deg, #c0392b 0%, #f0544f 50%, #ff7974 100%); }
        .gradient-orange { --icon-gradient: linear-gradient(135deg, #c87700 0%, #f59b23 50%, #ffc107 100%); }
        .gradient-purple { --icon-gradient: linear-gradient(135deg, #8e44ad 0%, #c56cd6 50%, #e85d9e 100%); }
        .gradient-sunset { --icon-gradient: linear-gradient(135deg, #f59b23 0%, #f0544f 50%, #c56cd6 100%); }
        .gradient-forest { --icon-gradient: linear-gradient(135deg, #1b5e20 0%, #2ebd85 50%, #15966b 100%); }
        .gradient-midnight { --icon-gradient: linear-gradient(135deg, #0d47a1 0%, #19a7ce 50%, #0e7c8c 100%); }
        .gradient-volcano { --icon-gradient: linear-gradient(135deg, #bf360c 0%, #f0544f 50%, #ff9800 100%); }
        .gradient-aurora { --icon-gradient: linear-gradient(135deg, #006064 0%, #15966b 50%, #4fc3f7 100%); }
        .gradient-berry { --icon-gradient: linear-gradient(135deg, #880e4f 0%, #c56cd6 50%, #e85d9e 100%); }
        .gradient-emerald { --icon-gradient: linear-gradient(135deg, #004d40 0%, #0e7c8c 50%, #2ebd85 100%); }
        .gradient-amber { --icon-gradient: linear-gradient(135deg, #e65100 0%, #f59b23 50%, #ffd34e 100%); }
        .gradient-indigo { --icon-gradient: linear-gradient(135deg, #283593 0%, #3f51b5 50%, #5c6bc0 100%); }

        /* Accent colors */
        .accent-red { --accent-color: #f0544f; }
        .accent-orange { --accent-color: #f59b23; }
        .accent-yellow { --accent-color: #ffd34e; }
        .accent-pink { --accent-color: #e85d9e; }
        .accent-purple { --accent-color: #c56cd6; }
        .accent-cyan { --accent-color: #19a7ce; }
        .accent-green { --accent-color: #2ebd85; }
        .accent-white { --accent-color: #ffffff; }

        /* Game Info */
        .game-info {
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 56px;
        }

        .game-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .game-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Loading state */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus visible */
        .search-input:focus-visible,
        .search-clear:focus-visible,
        .game-card:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 2px;
        }
    </style>
</head>

            const shape = ICON_SHAPES[hash % ICON_SHAPES.length];
            const symbol = ICON_SYMBOLS[(hash * 7) % ICON_SYMBOLS.length];
            const gradient = ICON_GRADIENTS[(hash * 13) % ICON_GRADIENTS.length];
            const accent = ICON_ACCENTS[(hash * 17) % ICON_ACCENTS.length];
            const quadrantClip = QUADRANT_CLIPS[(hash * 19) % QUADRANT_CLIPS.length];
            const rotate90 = (hash * 23) % 2 === 1; // odd/even rotation
            
            let symbolClass = symbol;
            let styleVar = '';
            if (symbol === 'symbol-quadrant') {
                styleVar = `--quadrant-clip: ${quadrantClip};`;
            }
            
            return { shape, symbol: symbolClass, gradient, accent, styleVar, rotate90 };
        }

        // Render game cards
        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            games.forEach((game, index) => {
                const config = getIconConfig(index, game.title);
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = game.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.dataset.title = game.title.toLowerCase();
                
                card.innerHTML = `
                    <div class="icon-container">
                        <div class="game-icon ${config.shape} ${config.symbol} ${config.gradient} ${config.accent}" style="${config.styleVar} ${config.rotate90 ? 'transform: rotate(90deg);' : ''}">
                            <div class="sailfish-icon"></div>
                        </div>
                    </div>
                    <div class="game-info">
                        <span class="game-title">${escapeHtml(game.title)}</span>
                        <span class="game-meta">HTML5 Game</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const totalCount = document.getElementById('totalCount');
        const showCount = document.getElementById('showCount');
        const gamesGrid = document.getElementById('gamesGrid');

        totalCount.textContent = GAMES.length;
        showCount.textContent = GAMES.length;

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const query = e.target.value.toLowerCase().trim();
                searchClear.classList.toggle('visible', query.length > 0);
                filterGames(query);
            }, 100);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            filterGames('');
            searchInput.focus();
        });

        function filterGames(query) {
            const cards = gamesGrid.querySelectorAll('.game-card');
            let visible = 0;
            
            cards.forEach(card => {
                const title = card.dataset.title;
                const match = !query || title.includes(query);
                card.classList.toggle('hidden', !match);
                if (match) visible++;
            });
            
            showCount.textContent = visible;
        }

        // Initial render
        renderGames(GAMES);

        // Keyboard shortcut: '/' to focus search
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape') {
                searchInput.blur();
                searchInput.value = '';
                searchClear.classList.remove('visible');
                filterGames('');
            }
        });
    </script>
</body>
</html>
