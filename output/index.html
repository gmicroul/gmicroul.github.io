<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停车场大混乱 - Parking Chaos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #eee;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff6b6b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s linear infinite;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        #gameCanvas {
            display: block;
            border-radius: 12px;
            box-shadow: 
                0 0 40px rgba(72, 219, 251, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 60px rgba(255, 255, 255, 0.05);
            background: #0d1b2a;
            border: 3px solid #1e3a5f;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
            color: #0d1b2a;
            box-shadow: 0 4px 20px rgba(72, 219, 251, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(72, 219, 251, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5253 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 107, 107, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ed573 0%, #1eae98 100%);
            color: #0d1b2a;
            box-shadow: 0 4px 20px rgba(46, 213, 115, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(46, 213, 115, 0.6);
        }

        .info-panel {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            padding: 15px 30px;
            background: rgba(13, 27, 42, 0.8);
            border-radius: 12px;
            border: 1px solid #1e3a5f;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .info-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #48dbfb;
        }

        .info-value.moves { color: #feca57; }
        .info-value.time { color: #ff6b6b; }
        .info-value.cars { color: #2ed573; }

        .instructions {
            margin-top: 20px;
            padding: 20px;
            max-width: 800px;
            background: rgba(13, 27, 42, 0.7);
            border-radius: 12px;
            border: 1px solid #1e3a5f;
            text-align: left;
        }

        .instructions h3 {
            color: #48dbfb;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .instructions ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .instructions li {
            padding: 8px 12px;
            background: rgba(72, 219, 251, 0.1);
            border-radius: 8px;
            border-left: 3px solid #48dbfb;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .instructions li kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85em;
            margin-right: 8px;
            border: 1px solid #335;
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.95);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
            border: 3px solid #2ed573;
            box-shadow: 0 0 60px rgba(46, 213, 115, 0.3);
        }

        .win-overlay.show {
            display: flex;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-overlay h2 {
            font-size: 3rem;
            background: linear-gradient(90deg, #2ed573, #1eae98, #2ed573);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 2s linear infinite;
        }

        .win-stats {
            display: flex;
            gap: 40px;
            margin: 10px 0;
        }

        .win-stat {
            text-align: center;
        }

        .win-stat-label {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .win-stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #feca57;
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 10px;
        }

        .mobile-controls .btn {
            padding: 15px 25px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .mobile-controls { display: flex; flex-wrap: wrap; justify-content: center; }
            .controls .btn { padding: 10px 20px; font-size: 0.9rem; }
            .info-panel { gap: 15px; padding: 12px 20px; }
            .win-overlay h2 { font-size: 2rem; }
            .win-stats { gap: 20px; }
            .win-stat-value { font-size: 1.5rem; }
        }

        @media (max-width: 480px) {
            .instructions ul { grid-template-columns: 1fr; }
        }

        .car-selection {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .car-option {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .car-option:hover {
            transform: scale(1.1);
        }

        .car-option.selected {
            border-color: #48dbfb;
            box-shadow: 0 0 20px rgba(72, 219, 251, 0.6);
        }

        .car-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 7px;
        }
    </style>
</head>
<body>
    <h1>停车场大混乱</h1>
    <p class="subtitle">Parking Chaos - 每次游玩都是全新的随机关卡</p>

    <div class="game-container">
        <canvas id="gameCanvas" width="720" height="720"></canvas>
        <div class="win-overlay" id="winOverlay">
            <h2>🎉 通关成功！</h2>
            <div class="win-stats">
                <div class="win-stat">
                    <div class="win-stat-label">移动步数</div>
                    <div class="win-stat-value" id="finalMoves">0</div>
                </div>
                <div class="win-stat">
                    <div class="win-stat-label">用时</div>
                    <div class="win-stat-value" id="finalTime">0.0s</div>
                </div>
                <div class="win-stat">
                    <div class="win-stat-label">车辆数</div>
                    <div class="win-stat-value" id="finalCars">0</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-item">
            <span class="info-label">移动步数</span>
            <span class="info-value moves" id="moveCount">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">用时</span>
            <span class="info-value time" id="timeCount">0.0s</span>
        </div>
        <div class="info-item">
            <span class="info-label">剩余车辆</span>
            <span class="info-value cars" id="carCount">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">目标车辆</span>
            <span class="info-value" id="targetCarInfo" style="color: #ff6b6b;">红车</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="restartGame()">🔄 重新开始</button>
        <button class="btn btn-secondary" onclick="undoMove()">↩️ 撤销</button>
        <button class="btn btn-success" onclick="toggleHint()">💡 提示</button>
    </div>

    <div class="mobile-controls">
        <button class="btn btn-primary" onclick="mobileMove('up')">▲ 上</button>
        <button class="btn btn-primary" onclick="mobileMove('left')">◄ 左</button>
        <button class="btn btn-primary" onclick="mobileMove('right')">► 右</button>
        <button class="btn btn-primary" onclick="mobileMove('down')">▼ 下</button>
    </div>

    <div class="instructions">
        <h3>🎮 游戏规则</h3>
        <ul>
            <li><kbd>鼠标拖拽</kbd> 或 <kbd>触摸滑动</kbd> 移动车辆</li>
            <li><kbd>方向键</kbd> 移动选中的车辆</li>
            <li>车辆只能沿其朝向直线行驶</li>
            <li><span style="color:#ff6b6b">■ 红车</span> 是目标车，需开出出口</li>
            <li><span style="color:#48dbfb">■ 蓝车</span> 横向行驶</li>
            <li><span style="color:#feca57">■ 黄车</span> 纵向行驶</li>
            <li><span style="color:#2ed573">■ 绿车</span> 长车辆(占3格)</li>
            <li>点击 <kbd>撤销</kbd> 回退一步</li>
            <li>点击 <kbd>提示</kbd> 显示下一步建议</li>
        </ul>
    </div>

    <script>
        // ============ 游戏核心逻辑 ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 6;
        const CELL_SIZE = 110;
        const MARGIN = 30;
        const BOARD_SIZE = GRID_SIZE * CELL_SIZE;

        // 颜色方案
        const COLORS = {
            bg: '#0d1b2a',
            grid: '#1e3a5f',
            gridAccent: '#2a4a7a',
            exit: '#ff6b6b',
            exitGlow: '#ff6b6b',
            targetCar: '#ff6b6b',
            targetCarLight: '#ff9999',
            targetCarDark: '#cc4444',
            hCar: '#48dbfb',
            hCarLight: '#7ae7ff',
            hCarDark: '#0abde3',
            vCar: '#feca57',
            vCarLight: '#ffe66d',
            vCarDark: '#e6b800',
            longCar: '#2ed573',
            longCarLight: '#5eff8c',
            longCarDark: '#1eae98',
            selected: '#ffffff',
            hint: '#ff6b6b',
            text: '#eee',
            shadow: 'rgba(0,0,0,0.4)'
        };

        // 游戏状态
        let cars = [];
        let selectedCar = null;
        let dragStart = null;
        let moveHistory = [];
        let moveCount = 0;
        let startTime = Date.now();
        let timerInterval = null;
        let gameWon = false;
        let showHint = false;
        let hintPath = null;

        // 车辆类
        class Car {
            constructor(id, x, y, length, horizontal, color) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.length = length;
                this.horizontal = horizontal;
                this.color = color;
                this.isTarget = false;
            }

            getCells() {
                const cells = [];
                for (let i = 0; i < this.length; i++) {
                    if (this.horizontal) {
                        cells.push({x: this.x + i, y: this.y});
                    } else {
                        cells.push({x: this.x, y: this.y + i});
                    }
                }
                return cells;
            }

            canMove(dir, board) {
                const cells = this.getCells();
                if (this.horizontal) {
                    if (dir === -1) { // 左
                        if (this.x === 0) return false;
                        return !board[this.y][this.x - 1];
                    } else { // 右
                        if (this.x + this.length >= GRID_SIZE) return false;
                        return !board[this.y][this.x + this.length];
                    }
                } else {
                    if (dir === -1) { // 上
                        if (this.y === 0) return false;
                        return !board[this.y - 1][this.x];
                    } else { // 下
                        if (this.y + this.length >= GRID_SIZE) return false;
                        return !board[this.y + this.length][this.x];
                    }
                }
            }

            move(dir) {
                if (this.horizontal) {
                    this.x += dir;
                } else {
                    this.y += dir;
                }
            }

            checkWin() {
                if (!this.isTarget) return false;
                // 红车在右边缘且朝右
                return this.x + this.length === GRID_SIZE;
            }

            draw(ctx, cellSize, margin, selected, showHint) {
                const px = margin + this.x * cellSize;
                const py = margin + this.y * cellSize;
                const w = this.horizontal ? this.length * cellSize : cellSize;
                const h = this.horizontal ? cellSize : this.length * cellSize;
                const radius = 12;

                // 阴影
                ctx.save();
                ctx.shadowColor = COLORS.shadow;
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 4;

                // 车身渐变
                const grad = ctx.createLinearGradient(px, py, px + w, py + h);
                if (this.isTarget) {
                    grad.addColorStop(0, this.color);
                    grad.addColorStop(0.5, this.color === COLORS.targetCar ? COLORS.targetCarLight : this.color);
                    grad.addColorStop(1, COLORS.targetCarDark);
                } else if (this.color === COLORS.hCar) {
                    grad.addColorStop(0, COLORS.hCarLight);
                    grad.addColorStop(0.5, COLORS.hCar);
                    grad.addColorStop(1, COLORS.hCarDark);
                } else if (this.color === COLORS.vCar) {
                    grad.addColorStop(0, COLORS.vCarLight);
                    grad.addColorStop(0.5, COLORS.vCar);
                    grad.addColorStop(1, COLORS.vCarDark);
                } else {
                    grad.addColorStop(0, COLORS.longCarLight);
                    grad.addColorStop(0.5, COLORS.longCar);
                    grad.addColorStop(1, COLORS.longCarDark);
                }

                ctx.fillStyle = grad;
                roundRect(ctx, px + 2, py + 2, w - 4, h - 4, radius);
                ctx.fill();
                ctx.restore();

                // 高光
                ctx.save();
                const highlightGrad = ctx.createLinearGradient(px, py, px, py + h * 0.4);
                highlightGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
                highlightGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = highlightGrad;
                roundRect(ctx, px + 3, py + 3, w - 6, h * 0.35, radius - 1);
                ctx.fill();
                ctx.restore();

                // 选中边框
                if (selected) {
                    ctx.save();
                    ctx.strokeStyle = COLORS.selected;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#48dbfb';
                    ctx.shadowBlur = 15;
                    roundRect(ctx, px + 1, py + 1, w - 2, h - 2, radius);
                    ctx.stroke();
                    ctx.restore();
                }

                // 提示闪烁
                if (showHint && this === hintPath) {
                    ctx.save();
                    ctx.strokeStyle = COLORS.hint;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10, 10]);
                    ctx.lineDashOffset = Date.now() / 10 % 20;
                    roundRect(ctx, px, py, w, h, radius);
                    ctx.stroke();
                    ctx.restore();
                }

                // 车窗
                ctx.fillStyle = 'rgba(20, 40, 60, 0.8)';
                const windowPadding = 8;
                const windowGap = 4;
                if (this.horizontal) {
                    const windowW = (w - windowPadding * 2 - windowGap * (this.length - 1)) / this.length;
                    for (let i = 0; i < this.length; i++) {
                        const wx = px + windowPadding + i * (windowW + windowGap);
                        roundRect(ctx, wx, py + windowPadding, windowW, h - windowPadding * 2, 4);
                        ctx.fill();
                    }
                } else {
                    const windowH = (h - windowPadding * 2 - windowGap * (this.length - 1)) / this.length;
                    for (let i = 0; i < this.length; i++) {
                        const wy = py + windowPadding + i * (windowH + windowGap);
                        roundRect(ctx, px + windowPadding, wy, w - windowPadding * 2, windowH, 4);
                        ctx.fill();
                    }
                }

                // 方向指示箭头
                if (this.isTarget) {
                    ctx.save();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('▶', px + w - 18, py + h / 2);
                    ctx.restore();
                }

                // 车牌号
                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.font = '11px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`#${this.id}`, px + w / 2, py + h / 2 + 2);
                ctx.restore();
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // 生成随机关卡
        function generateLevel() {
            cars = [];
            const board = createEmptyBoard();
            let carId = 0;

            // 1. 固定放置目标车（红车，横向，长度2，第3行）
            const targetRow = 2;
            const targetCar = new Car(carId++, 0, targetRow, 2, true, COLORS.targetCar);
            targetCar.isTarget = true;
            placeCarOnBoard(board, targetCar);
            cars.push(targetCar);

            // 2. 随机生成其他车辆
            const carTypes = [
                { length: 2, horizontal: true, color: COLORS.hCar, count: 3 },   // 蓝色横向
                { length: 2, horizontal: false, color: COLORS.vCar, count: 3 },  // 黄色纵向
                { length: 3, horizontal: true, color: COLORS.longCar, count: 2 }, // 绿色长横向
                { length: 3, horizontal: false, color: COLORS.longCar, count: 1 }, // 绿色长纵向
            ];

            // 打乱类型顺序
            shuffleArray(carTypes);

            for (const type of carTypes) {
                for (let i = 0; i < type.count; i++) {
                    const car = tryPlaceCar(carId++, type.length, type.horizontal, type.color, board);
                    if (car) cars.push(car);
                }
            }

            // 3. 确保关卡可解（简单验证：目标车右侧有路径或可移动）
            ensureSolvable(board);

            return cars;
        }

        function createEmptyBoard() {
            return Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        }

        function placeCarOnBoard(board, car) {
            const cells = car.getCells();
            for (const cell of cells) {
                if (cell.x >= 0 && cell.x < GRID_SIZE && cell.y >= 0 && cell.y < GRID_SIZE) {
                    board[cell.y][cell.x] = car.id;
                }
            }
        }

        function removeCarFromBoard(board, car) {
            const cells = car.getCells();
            for (const cell of cells) {
                if (cell.x >= 0 && cell.x < GRID_SIZE && cell.y >= 0 && cell.y < GRID_SIZE) {
                    board[cell.y][cell.x] = null;
                }
            }
        }

        function tryPlaceCar(id, length, horizontal, color, board) {
            const attempts = 50;
            for (let attempt = 0; attempt < attempts; attempt++) {
                let x, y;
                if (horizontal) {
                    x = Math.floor(Math.random() * (GRID_SIZE - length + 1));
                    y = Math.floor(Math.random() * GRID_SIZE);
                } else {
                    x = Math.floor(Math.random() * GRID_SIZE);
                    y = Math.floor(Math.floor(Math.random() * (GRID_SIZE - length + 1)));
                }

                // 避开目标车所在行
                if (horizontal && y === 2) continue;

                const car = new Car(id, x, y, length, horizontal, color);
                const cells = car.getCells();
                let canPlace = true;

                for (const cell of cells) {
                    if (cell.x < 0 || cell.x >= GRID_SIZE || cell.y < 0 || cell.y >= GRID_SIZE || board[cell.y][cell.x] !== null) {
                        canPlace = false;
                        break;
                    }
                }

                if (canPlace) {
                    placeCarOnBoard(board, car);
                    return car;
                }
            }
            return null;
        }

        function ensureSolvable(board) {
            // 简单确保：目标车右侧至少有一个空位或可移开的车
            const targetCar = cars.find(c => c.isTarget);
            if (!targetCar) return;

            let blocked = false;
            for (let x = targetCar.x + targetCar.length; x < GRID_SIZE; x++) {
                if (board[targetCar.y][x] !== null) {
                    blocked = true;
                    break;
                }
            }

            // 如果完全堵死，尝试移动阻挡的车
            if (blocked) {
                // 这里简单处理：不强制保证可解，依靠随机性
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        // 获取鼠标/触摸在棋盘上的坐标
        function getBoardPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const col = Math.floor((x - MARGIN) / CELL_SIZE);
            const row = Math.floor((y - MARGIN) / CELL_SIZE);
            return { x: col, y: row, rawX: x, rawY: y };
        }

        // 点击/触摸选择车辆
        function handlePointerDown(e) {
            if (gameWon) return;
            const pos = getBoardPos(e);
            if (pos.x < 0 || pos.x >= GRID_SIZE || pos.y < 0 || pos.y >= GRID_SIZE) return;

            const board = createBoardFromCars();
            const carId = board[pos.y][pos.x];
            if (carId !== null) {
                selectedCar = cars.find(c => c.id === carId);
                dragStart = { x: pos.rawX, y: pos.rawY };
            }
        }

        function handlePointerMove(e) {
            if (!selectedCar || !dragStart || gameWon) return;
            e.preventDefault();

            const pos = getBoardPos(e);
            const dx = pos.rawX - dragStart.x;
            const dy = pos.rawY - dragStart.y;

            const threshold = CELL_SIZE * 0.4;
            let moved = false;

            if (selectedCar.horizontal) {
                if (dx > threshold) { moveCar(selectedCar, 1); moved = true; }
                else if (dx < -threshold) { moveCar(selectedCar, -1); moved = true; }
            } else {
                if (dy > threshold) { moveCar(selectedCar, 1); moved = true; }
                else if (dy < -threshold) { moveCar(selectedCar, -1); moved = true; }
            }

            if (moved) {
                dragStart = { x: pos.rawX, y: pos.rawY };
            }
        }

        function handlePointerUp() {
            selectedCar = null;
            dragStart = null;
        }

        function createBoardFromCars() {
            const board = createEmptyBoard();
            for (const car of cars) {
                placeCarOnBoard(board, car);
            }
            return board;
        }

        function moveCar(car, dir) {
            const board = createBoardFromCars();
            if (!car.canMove(dir, board)) return false;

            // 记录历史用于撤销
            moveHistory.push({
                carId: car.id,
                x: car.x,
                y: car.y
            });

            car.move(dir);
            moveCount++;
            updateUI();
            checkWin();
            return true;
        }

        function undoMove() {
            if (moveHistory.length === 0 || gameWon) return;
            const lastMove = moveHistory.pop();
            const car = cars.find(c => c.id === lastMove.carId);
            if (car) {
                car.x = lastMove.x;
                car.y = lastMove.y;
                moveCount = Math.max(0, moveCount - 1);
                updateUI();
            }
        }

        function checkWin() {
            const targetCar = cars.find(c => c.isTarget);
            if (targetCar && targetCar.checkWin()) {
                gameWon = true;
                stopTimer();
                showWinOverlay();
            }
        }

        function showWinOverlay() {
            const overlay = document.getElementById('winOverlay');
            document.getElementById('finalMoves').textContent = moveCount;
            document.getElementById('finalTime').textContent = document.getElementById('timeCount').textContent;
            document.getElementById('finalCars').textContent = cars.length;
            overlay.classList.add('show');

            // 烟花效果
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#48dbfb', '#feca57', '#2ed573', '#ff9ff3', '#54a0ff'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.cssText = `
                        position: fixed;
                        left: ${Math.random() * 100}vw;
                        top: -10px;
                        width: ${Math.random() * 8 + 4}px;
                        height: ${Math.random() * 8 + 4}px;
                        background: ${colors[Math.floor(Math.random() * colors.length)]};
                        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                        pointer-events: none;
                        z-index: 1000;
                        transform: rotate(${Math.random() * 360}deg);
                    `;
                    document.body.appendChild(confetti);
                    const duration = Math.random() * 2000 + 1500;
                    const xOffset = (Math.random() - 0.5) * 200;
                    confetti.animate([
                        { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(${xOffset}px, ${window.innerHeight + 100}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                    ], { duration, easing: 'cubic-out' }).onfinish = () => confetti.remove();
                }, i * 30);
            }
        }

        function restartGame() {
            gameWon = false;
            moveCount = 0;
            moveHistory = [];
            startTime = Date.now();
            showHint = false;
            hintPath = null;
            document.getElementById('winOverlay').classList.remove('show');
            generateLevel();
            startTimer();
            draw();
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                document.getElementById('timeCount').textContent = elapsed.toFixed(1) + 's';
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateUI() {
            document.getElementById('moveCount').textContent = moveCount;
            document.getElementById('carCount').textContent = cars.length;
        }

        function toggleHint() {
            showHint = !showHint;
            if (showHint) {
                hintPath = findHint();
            } else {
                hintPath = null;
            }
            draw();
        }

        // 简单提示：找到目标车能否向右移动，如果被阻挡，提示阻挡的车
        function findHint() {
            const targetCar = cars.find(c => c.isTarget);
            const board = createBoardFromCars();

            // 检查目标车右侧
            for (let x = targetCar.x + targetCar.length; x < GRID_SIZE; x++) {
                const blockingCarId = board[targetCar.y][x];
                if (blockingCarId !== null) {
                    return cars.find(c => c.id === blockingCarId);
                }
            }
            return targetCar; // 如果没阻挡，提示目标车
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (gameWon || !selectedCar) return;
            let dir = 0;
            let moved = false;
            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (selectedCar.horizontal) { dir = -1; moved = moveCar(selectedCar, dir); }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (selectedCar.horizontal) { dir = 1; moved = moveCar(selectedCar, dir); }
                    break;
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (!selectedCar.horizontal) { dir = -1; moved = moveCar(selectedCar, dir); }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (!selectedCar.horizontal) { dir = 1; moved = moveCar(selectedCar, dir); }
                    break;
            }
            if (moved) e.preventDefault();
        });

        // 鼠标/触摸事件
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('mouseleave', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        canvas.addEventListener('touchend', handlePointerUp);

        // 点击画布选择车辆
        canvas.addEventListener('click', (e) => {
            if (gameWon) return;
            const pos = getBoardPos(e);
            if (pos.x < 0 || pos.x >= GRID_SIZE || pos.y < 0 || pos.y >= GRID_SIZE) {
                selectedCar = null;
                draw();
                return;
            }
            const board = createBoardFromCars();
            const carId = board[pos.y][pos.x];
            if (carId !== null) {
                selectedCar = cars.find(c => c.id === carId);
            } else {
                selectedCar = null;
            }
            draw();
        });

        // 移动端方向按钮
        function mobileMove(direction) {
            if (!selectedCar || gameWon) return;
            let moved = false;
            if (selectedCar.horizontal) {
                if (direction === 'left') moved = moveCar(selectedCar, -1);
                else if (direction === 'right') moved = moveCar(selectedCar, 1);
            } else {
                if (direction === 'up') moved = moveCar(selectedCar, -1);
                else if (direction === 'down') moved = moveCar(selectedCar, 1);
            }
        }

        // 绘制函数
        function draw() {
            // 清空画布
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格背景
            drawGrid();

            // 绘制出口
            drawExit();

            // 绘制所有车辆
            for (const car of cars) {
                car.draw(ctx, CELL_SIZE, MARGIN, car === selectedCar, showHint && car === hintPath);
            }
        }

        function drawGrid() {
            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 1;

            // 细网格线
            for (let i = 0; i <= GRID_SIZE; i++) {
                const pos = MARGIN + i * CELL_SIZE;
                // 垂直线
                ctx.beginPath();
                ctx.moveTo(pos, MARGIN);
                ctx.lineTo(pos, MARGIN + BOARD_SIZE);
                ctx.stroke();
                // 水平线
                ctx.beginPath();
                ctx.moveTo(MARGIN, pos);
                ctx.lineTo(MARGIN + BOARD_SIZE, pos);
                ctx.stroke();
            }

            // 格子坐标标记（可选，调试用）
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const x = MARGIN + col * CELL_SIZE + CELL_SIZE / 2;
                    const y = MARGIN + row * CELL_SIZE + CELL_SIZE / 2;
                    // ctx.fillText(`${col},${row}`, x, y);
                }
            }
        }

        function drawExit() {
            // 出口在右边缘，目标车所在行（第3行，索引2）
            const exitRow = 2;
            const exitX = MARGIN + BOARD_SIZE;
            const exitY = MARGIN + exitRow * CELL_SIZE;

            // 出口发光效果
            const glowGrad = ctx.createRadialGradient(
                exitX, exitY + CELL_SIZE / 2, 0,
                exitX, exitY + CELL_SIZE / 2, 60
            );
            glowGrad.addColorStop(0, 'rgba(255, 107, 107, 0.3)');
            glowGrad.addColorStop(1, 'rgba(255, 107, 107, 0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(exitX - 30, exitY - 30, 90, CELL_SIZE + 60);

            // 出口箭头
            ctx.save();
            ctx.fillStyle = COLORS.exit;
            ctx.shadowColor = COLORS.exitGlow;
            ctx.shadowBlur = 20;
            for (let i = 0; i < 3; i++) {
                const offset = i * 15 - 15;
                ctx.beginPath();
                ctx.moveTo(exitX + 5, exitY + CELL_SIZE / 2 + offset);
                ctx.lineTo(exitX + 35, exitY + CELL_SIZE / 2 - 10 + offset);
                ctx.lineTo(exitX + 35, exitY + CELL_SIZE / 2 + 10 + offset);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            // EXIT 文字
            ctx.save();
            ctx.fillStyle = COLORS.exit;
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('EXIT', exitX + 55, exitY + CELL_SIZE / 2);
            ctx.restore();
        }

        // 初始化游戏
        function init() {
            // 适配高DPI
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = 720 * dpr;
            canvas.height = 720 * dpr;
            canvas.style.width = '720px';
            canvas.style.height = '720px';
            ctx.scale(dpr, dpr);

            generateLevel();
            startTimer();
            updateUI();
            draw();

            // 动画循环
            function animate() {
                if (showHint && hintPath) {
                    draw();
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // 窗口大小改变时重绘
        window.addEventListener('resize', () => {
            draw();
        });

        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) e.preventDefault();
        }, { passive: false });

        // 启动游戏
        init();
    </script>
</body>
</html>
