        // DOM元素
        const newsGrid = document.getElementById('newsGrid');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalCount = document.getElementById('totalCount');
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const themeText = document.getElementById('themeText');
        const genTime = document.getElementById('genTime');
        const currentDate = document.getElementById('currentDate');
        const updateTime = document.getElementById('updateTime');

        // 初始化
        let currentFilter = 'all';

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}年${month}月${day}日`;
        }

        // 格式化生成时间
        function formatGenTime() {
            const now = new Date();
            return now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 渲染新闻卡片
        function renderNews(filter = 'all') {
            const filtered = filter === 'all' 
                ? newsData 
                : newsData.filter(item => item.source === filter);

            totalCount.textContent = filtered.length;

            if (filtered.length === 0) {
                newsGrid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <p>暂无该来源的新闻</p>
                    </div>
                `;
                return;
            }

            newsGrid.innerHTML = filtered.map((item, index) => {
                const isFeatured = index === 0 && filter === 'all';
                const cardClass = isFeatured ? 'news-card featured' : 'news-card';
                const dateFormatted = formatDate(item.date);
                
                return `
                    <article class="${cardClass}" style="animation-delay: ${index * 0.05}s">
                        <span class="source-badge">${item.source}</span>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="title">${escapeHtml(item.title)}</a>
                        <p class="summary">${escapeHtml(item.summary)}</p>
                        <div class="meta-bottom">
                            <span class="date">${dateFormatted}</span>
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="link-btn">
                                阅读全文
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 筛选功能
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                currentFilter = btn.dataset.source;
                renderNews(currentFilter);
            });
        });

        // 主题切换
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
                themeText.textContent = '浅色';
            } else {
                document.documentElement.removeAttribute('data-theme');
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
                themeText.textContent = '深色';
            }
        }

        // 检测系统主题
        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        // 初始化主题
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            applyTheme(savedTheme);
        } else {
            applyTheme(getSystemTheme());
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || getSystemTheme();
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });

        // 监听系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        // 设置日期
        const today = new Date();
        const dateStr = today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
        currentDate.textContent = dateStr;
        updateTime.textContent = dateStr;
        genTime.textContent = formatGenTime();

        // 初始渲染
        renderNews();

        // 键盘导航支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                document.body.classList.add('keyboard-nav');
            }
        });

        document.addEventListener('mousedown', () => {
            document.body.classList.remove('keyboard-nav');
        });
    </script>
