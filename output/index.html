<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙跑酷 - Dino Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: #0d1b2a;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px #1e3a5f;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .score-label {
            font-size: 12px;
            font-weight: 400;
            color: #88a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            color: #00d4ff;
        }

        .high-score .score-value {
            color: #ffd700;
        }

        .start-screen, .game-over-screen {
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-title {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #ff6b6b, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .game-subtitle {
            font-size: 16px;
            color: #88a;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .btn {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0d1b2a;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 212, 255, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .controls-hint {
            margin-top: 30px;
            font-size: 14px;
            color: #668;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .key-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .key {
            display: inline-block;
            min-width: 40px;
            padding: 4px 8px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 6px;
            font-family: monospace;
            font-weight: 700;
            color: #00d4ff;
        }

        .game-over-screen .final-score {
            font-size: 36px;
            font-weight: 700;
            color: #ff6b6b;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }

        .game-over-screen .best-score {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .hidden {
            display: none !important;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
        }

        @media (max-width: 820px) {
            .game-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                border-radius: 0;
            }
            .game-title { font-size: 36px; }
            .score-panel { font-size: 18px; gap: 24px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-overlay">
            <div class="score-panel hidden" id="scorePanel">
                <div class="score-item">
                    <span class="score-label">得分</span>
                    <span class="score-value" id="currentScore">0</span>
                </div>
                <div class="score-item high-score">
                    <span class="score-label">最高</span>
                    <span class="score-value" id="highScore">0</span>
                </div>
            </div>

            <div class="start-screen" id="startScreen">
                <h1 class="game-title">恐龙跑酷</h1>
                <p class="game-subtitle">随机生成地图 · 无限挑战</p>
                <button class="btn btn-primary" id="startBtn">开始游戏</button>
                <div class="controls-hint">
                    <div class="key-hint"><span class="key">空格</span> / <span class="key">↑</span> 跳跃</div>
                    <div class="key-hint"><span class="key">↓</span> 下蹲</div>
                    <div class="key-hint"><span class="key">P</span> 暂停</div>
                </div>
            </div>

            <div class="game-over-screen hidden" id="gameOverScreen">
                <h1 class="game-title">游戏结束</h1>
                <div class="final-score" id="finalScore">得分: 0</div>
                <div class="best-score" id="bestScoreDisplay">最高分: 0</div>
                <button class="btn btn-primary" id="restartBtn">再来一局</button>
                <button class="btn btn-secondary" style="margin-top: 16px;" id="menuBtn">返回菜单</button>
            </div>

            <div class="pause-screen hidden" id="pauseScreen">
                <h1 class="game-title">游戏暂停</h1>
                <button class="btn btn-primary" id="resumeBtn">继续游戏</button>
            </div>
        </div>
    </div>

    <script>
        // 游戏常量
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 400;
        const GROUND_Y = 320;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -14;
        const INITIAL_SPEED = 6;
        const MAX_SPEED = 15;
        const SPEED_INCREMENT = 0.002;

        // 恐龙属性
        const DINO_WIDTH = 44;
        const DINO_HEIGHT = 48;
        const DINO_DUCK_HEIGHT = 28;
        const DINO_X = 80;

        // 颜色主题
        const COLORS = {
            bg: '#0d1b2a',
            ground: '#1e3a5f',
            groundLine: '#00d4ff',
            dino: '#4ecdc4',
            dinoEye: '#fff',
            dinoEyePupil: '#1a1a2e',
            obstacle: '#ff6b6b',
            obstacleDark: '#cc4444',
            cloud: 'rgba(255,255,255,0.15)',
            star: 'rgba(255,255,255,0.8)',
            particle: ['#00d4ff', '#ff6b6b', '#ffd700', '#4ecdc4'],
            text: '#fff',
            scoreText: '#00d4ff',
            highScoreText: '#ffd700'
        };

        // 游戏状态
        let canvas, ctx;
        let gameState = 'start'; // start, playing, paused, gameover
        let score = 0;
        let highScore = 0;
        let gameSpeed = INITIAL_SPEED;
        let frameCount = 0;
        let animationId = null;

        // 恐龙对象
        let dino = {
            x: DINO_X,
            y: GROUND_Y - DINO_HEIGHT,
            width: DINO_WIDTH,
            height: DINO_HEIGHT,
            velocityY: 0,
            isJumping: false,
            isDucking: false,
            animFrame: 0,
            animTimer: 0,
            blinkTimer: 0,
            eyeOpen: true
        };

        // 地面
        let groundOffset = 0;

        // 障碍物数组
        let obstacles = [];

        // 云朵数组
        let clouds = [];

        // 星星数组（背景装饰）
        let stars = [];

        // 粒子系统
        let particles = [];

        // 地图生成相关
        let mapSegments = [];
        let currentSegmentIndex = 0;
        let nextObstacleDistance = 0;

        // 初始化
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 读取最高分
            highScore = parseInt(localStorage.getItem('dinoRunnerHighScore') || '0');
            updateHighScoreDisplay();

            // 生成背景星星
            generateStars();

            // 生成初始云朵
            generateInitialClouds();

            // 绑定事件
            bindEvents();

            // 显示开始界面
            showStartScreen();

            // 开始渲染循环
            render();
        }

        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function bindEvents() {
            // 键盘事件
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    e.preventDefault();
                    handleJump();
                } else if (e.code === 'ArrowDown') {
                    e.preventDefault();
                    handleDuck(true);
                } else if (e.code === 'KeyP') {
                    handlePause();
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowDown') {
                    handleDuck(false);
                }
            });

            // 触摸事件（移动端支持）
            let touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'gameover') {
                    // 由按钮处理
                } else if (gameState === 'playing') {
                    handleJump();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                const diff = touchStartY - touchEndY;
                if (diff > 50 && gameState === 'playing') {
                    handleJump();
                } else if (diff < -50 && gameState === 'playing') {
                    handleDuck(false);
                }
            });

            // 按钮事件
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('menuBtn').addEventListener('click', showStartScreen);
            document.getElementById('resumeBtn').addEventListener('click', resumeGame);

            // 点击画布跳跃
            canvas.addEventListener('click', () => {
                if (gameState === 'playing') handleJump();
                else if (gameState === 'start') startGame();
            });
        }

        // 界面控制
        function showStartScreen() {
            gameState = 'start';
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('scorePanel').classList.add('hidden');
        }

        function showGameOverScreen() {
            gameState = 'gameover';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = `得分: ${Math.floor(score)}`;
            document.getElementById('bestScoreDisplay').textContent = `最高分: ${highScore}`;
        }

        function showPauseScreen() {
            gameState = 'paused';
            document.getElementById('pauseScreen').classList.remove('hidden');
        }

        function hideAllScreens() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('scorePanel').classList.remove('hidden');
        }

        function handlePause() {
            if (gameState === 'playing') {
                showPauseScreen();
            } else if (gameState === 'paused') {
                resumeGame();
            }
        }

        function resumeGame() {
            gameState = 'playing';
            document.getElementById('pauseScreen').classList.add('hidden');
        }

        // 游戏开始
        function startGame() {
            // 重置游戏状态
            gameState = 'playing';
            score = 0;
            gameSpeed = INITIAL_SPEED;
            frameCount = 0;
            groundOffset = 0;
            obstacles = [];
            clouds = [];
            particles = [];
            mapSegments = [];
            currentSegmentIndex = 0;
            nextObstacleDistance = 0;

            // 重置恐龙
            dino = {
                x: DINO_X,
                y: GROUND_Y - DINO_HEIGHT,
                width: DINO_WIDTH,
                height: DINO_HEIGHT,
                velocityY: 0,
                isJumping: false,
                isDucking: false,
                animFrame: 0,
                animTimer: 0,
                blinkTimer: 0,
                eyeOpen: true
            };

            // 生成新地图
            generateMap();

            // 生成初始云朵
            generateInitialClouds();

            hideAllScreens();
            updateScoreDisplay();
        }

        // 随机地图生成
        function generateMap() {
            // 生成 10-15 个地图段落，每段 800-1200 像素宽
            const numSegments = 12 + Math.floor(Math.random() * 4);
            let currentX = CANVAS_WIDTH + 200;

            for (let i = 0; i < numSegments; i++) {
                const segmentWidth = 800 + Math.floor(Math.random() * 400);
                const segment = {
                    x: currentX,
                    width: segmentWidth,
                    obstacles: [],
                    difficulty: Math.min(1 + i * 0.08, 3) // 难度逐渐增加
                };

                // 在段落内生成障碍物
                generateSegmentObstacles(segment);

                mapSegments.push(segment);
                currentX += segmentWidth;
            }

            nextObstacleDistance = mapSegments[0].x;
        }

        function generateSegmentObstacles(segment) {
            let x = segment.x;
            const segmentEnd = segment.x + segment.width;
            const difficulty = segment.difficulty;

            while (x < segmentEnd) {
                // 根据难度决定障碍物类型和间距
                const minGap = Math.max(250, 400 - difficulty * 50);
                const maxGap = minGap + 300;
                const gap = minGap + Math.random() * (maxGap - minGap);

                x += gap;

                if (x >= segmentEnd) break;

                // 选择障碍物类型
                const rand = Math.random();
                let obstacle;

                if (rand < 0.35) {
                    // 单个仙人掌
                    obstacle = createCactus(x, 'single');
                } else if (rand < 0.55) {
                    // 双仙人掌
                    obstacle = createCactus(x, 'double');
                } else if (rand < 0.7) {
                    // 三连仙人掌
                    obstacle = createCactus(x, 'triple');
                } else if (rand < 0.85) {
                    // 飞鸟
                    obstacle = createBird(x);
                } else {
                    // 组合障碍物（高难度）
                    if (difficulty > 1.5 && Math.random() < 0.5) {
                        obstacle = createComboObstacle(x);
                    } else {
                        obstacle = createCactus(x, 'single');
                    }
                }

                if (obstacle) {
                    segment.obstacles.push(obstacle);
                }

                x += obstacle.width + 20;
            }
        }

        function createCactus(x, type) {
            const types = {
                single: { width: 24, height: 48, parts: 1 },
                double: { width: 44, height: 48, parts: 2 },
                triple: { width: 64, height: 48, parts: 3 }
            };
            const t = types[type];
            return {
                x: x,
                y: GROUND_Y - t.height,
                width: t.width,
                height: t.height,
                type: 'cactus',
                subType: type,
                passed: false
            };
        }

        function createBird(x) {
            // 鸟的高度：低、中、高三种
            const heights = [
                GROUND_Y - 30,  // 低 - 需要跳跃
                GROUND_Y - 70,  // 中 - 可跳可蹲
                GROUND_Y - 110  // 高 - 必须下蹲
            ];
            const y = heights[Math.floor(Math.random() * heights.length)];
            return {
                x: x,
                y: y,
                width: 46,
                height: 36,
                type: 'bird',
                animFrame: 0,
                animTimer: 0,
                passed: false
            };
        }

        function createComboObstacle(x) {
            // 组合障碍物：地面障碍 + 飞鸟，或双层飞鸟
            const comboType = Math.random() < 0.5 ? 'cactusBird' : 'doubleBird';
            if (comboType === 'cactusBird') {
                return {
                    x: x,
                    y: GROUND_Y - 48,
                    width: 24,
                    height: 48,
                    type: 'combo',
                    comboType: 'cactusBird',
                    birdY: GROUND_Y - 80,
                    passed: false
                };
            } else {
                return {
                    x: x,
                    y: GROUND_Y - 80,
                    width: 46,
                    height: 36,
                    type: 'combo',
                    comboType: 'doubleBird',
                    birdY2: GROUND_Y - 120,
                    passed: false
                };
            }
        }

        // 云朵生成
        function generateInitialClouds() {
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: 40 + Math.random() * 120,
                    width: 60 + Math.random() * 80,
                    height: 20 + Math.random() * 15,
                    speed: 0.2 + Math.random() * 0.3,
                    opacity: 0.1 + Math.random() * 0.15
                });
            }
        }

        function generateStars() {
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * (GROUND_Y - 50),
                    size: 0.5 + Math.random() * 1.5,
                    brightness: 0.3 + Math.random() * 0.7,
                    twinkleSpeed: 0.01 + Math.random() * 0.03,
                    twinkleOffset: Math.random() * Math.PI * 2
                });
            }
        }

        // 恐龙控制
        function handleJump() {
            if (gameState !== 'playing') return;
            if (!dino.isJumping && !dino.isDucking) {
                dino.velocityY = JUMP_FORCE;
                dino.isJumping = true;
                createJumpParticles();
            }
        }

        function handleDuck(duck) {
            if (gameState !== 'playing') return;
            if (duck && !dino.isJumping) {
                dino.isDucking = true;
                dino.height = DINO_DUCK_HEIGHT;
                dino.y = GROUND_Y - DINO_DUCK_HEIGHT;
            } else if (!duck && dino.isDucking) {
                dino.isDucking = false;
                dino.height = DINO_HEIGHT;
                dino.y = GROUND_Y - DINO_HEIGHT;
            }
        }

        function createJumpParticles() {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: dino.x + dino.width / 2,
                    y: dino.y + dino.height,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 3 + 1,
                    size: 3 + Math.random() * 4,
                    color: COLORS.particle[Math.floor(Math.random() * COLORS.particle.length)],
                    life: 1,
                    decay: 0.02 + Math.random() * 0.03
                });
            }
        }

        function createCrashParticles(obstacle) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: obstacle.x + obstacle.width / 2,
                    y: obstacle.y + obstacle.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    size: 4 + Math.random() * 6,
                    color: COLORS.particle[Math.floor(Math.random() * COLORS.particle.length)],
                    life: 1,
                    decay: 0.015 + Math.random() * 0.025
                });
            }
        }

        // 更新逻辑
        function update() {
            if (gameState !== 'playing') return;

            frameCount++;

            // 更新游戏速度
            gameSpeed = Math.min(INITIAL_SPEED + frameCount * SPEED_INCREMENT, MAX_SPEED);

            // 更新得分
            score += gameSpeed * 0.02;
            updateScoreDisplay();

            // 更新地面偏移
            groundOffset = (groundOffset - gameSpeed) % 80;

            // 更新恐龙
            updateDino();

            // 更新障碍物（从地图段落生成）
            updateObstaclesFromMap();

            // 更新现有障碍物
            updateObstacles();

            // 更新云朵
            updateClouds();

            // 更新粒子
            updateParticles();

            // 碰撞检测
            checkCollisions();

            // 检查是否完成所有段落
            if (currentSegmentIndex >= mapSegments.length && obstacles.length === 0) {
                // 关卡完成 - 生成无限模式障碍物
                generateInfiniteObstacles();
            }
        }

        function updateDino() {
            // 重力
            if (dino.isJumping) {
                dino.velocityY += GRAVITY;
                dino.y += dino.velocityY;

                // 落地检测
                const groundLevel = dino.isDucking ? GROUND_Y - DINO_DUCK_HEIGHT : GROUND_Y - DINO_HEIGHT;
                if (dino.y >= groundLevel) {
                    dino.y = groundLevel;
                    dino.velocityY = 0;
                    dino.isJumping = false;
                    createLandParticles();
                }
            }

            // 动画帧
            dino.animTimer++;
            if (dino.animTimer >= 6) {
                dino.animFrame = (dino.animFrame + 1) % 2;
                dino.animTimer = 0;
            }

            // 眨眼
            dino.blinkTimer++;
            if (dino.blinkTimer > 120 + Math.random() * 180) {
                dino.eyeOpen = !dino.eyeOpen;
                if (dino.eyeOpen) {
                    dino.blinkTimer = 0;
                } else if (dino.blinkTimer > 120 + 10) {
                    dino.eyeOpen = true;
                    dino.blinkTimer = 0;
                }
            }
        }

        function createLandParticles() {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: dino.x + dino.width / 2 + (Math.random() - 0.5) * 20,
                    y: GROUND_Y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -(Math.random() * 3 + 1),
                    size: 2 + Math.random() * 3,
                    color: COLORS.groundLine,
                    life: 1,
                    decay: 0.03 + Math.random() * 0.02
                });
            }
        }

        function updateObstaclesFromMap() {
            // 将地图段落的障碍物移入活跃障碍物数组
            while (currentSegmentIndex < mapSegments.length) {
                const segment = mapSegments[currentSegmentIndex];
                let hasActiveObstacles = false;

                for (const obs of segment.obstacles) {
                    if (obs.x < CANVAS_WIDTH + 100) {
                        obstacles.push({ ...obs });
                    } else {
                        hasActiveObstacles = true;
                    }
                }

                if (!hasActiveObstacles) {
                    currentSegmentIndex++;
                } else {
                    break;
                }
            }
        }

        function generateInfiniteObstacles() {
            // 无限模式：持续生成随机障碍物
            const lastObstacle = obstacles[obstacles.length - 1];
            const lastX = lastObstacle ? lastObstacle.x : CANVAS_WIDTH;

            if (lastX - gameSpeed < CANVAS_WIDTH + 300) {
                const minGap = 300;
                const maxGap = 500;
                const gap = minGap + Math.random() * (maxGap - minGap);
                const x = lastX + gap;

                const rand = Math.random();
                let obstacle;
                if (rand < 0.3) obstacle = createCactus(x, 'single');
                else if (rand < 0.5) obstacle = createCactus(x, 'double');
                else if (rand < 0.65) obstacle = createCactus(x, 'triple');
                else if (rand < 0.85) obstacle = createBird(x);
                else obstacle = createCactus(x, 'single');

                if (obstacle) obstacles.push(obstacle);
            }
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;

                // 鸟的动画
                if (obs.type === 'bird' || (obs.type === 'combo' && obs.comboType.includes('Bird'))) {
                    obs.animTimer++;
                    if (obs.animTimer >= 8) {
                        obs.animFrame = (obs.animFrame + 1) % 2;
                        obs.animTimer = 0;
                    }
                }

                // 计分
                if (!obs.passed && obs.x + obs.width < dino.x) {
                    obs.passed = true;
                    score += 10;
                }

                // 移除屏幕外障碍物
                if (obs.x + obs.width < -50) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function updateClouds() {
            for (const cloud of clouds) {
                cloud.x -= cloud.speed * (gameSpeed / INITIAL_SPEED);
                if (cloud.x + cloud.width < 0) {
                    cloud.x = CANVAS_WIDTH + Math.random() * 200;
                    cloud.y = 40 + Math.random() * 120;
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; // 重力
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            const dinoBox = getDinoHitbox();

            for (const obs of obstacles) {
                const obsBox = getObstacleHitbox(obs);
                if (boxesIntersect(dinoBox, obsBox)) {
                    gameOver();
                    return;
                }
            }
        }

        function getDinoHitbox() {
            // 碰撞箱稍微小于视觉大小，手感更好
            const padding = 6;
            return {
                x: dino.x + padding,
                y: dino.y + padding,
                width: dino.width - padding * 2,
                height: dino.height - padding * 2
            };
        }

        function getObstacleHitbox(obs) {
            const padding = 4;
            return {
                x: obs.x + padding,
                y: obs.y + padding,
                width: obs.width - padding * 2,
                height: obs.height - padding * 2
            };
        }

        function boxesIntersect(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function gameOver() {
            gameState = 'gameover';

            // 更新最高分
            const finalScore = Math.floor(score);
            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem('dinoRunnerHighScore', highScore.toString());
                updateHighScoreDisplay();
            }

            // 创建撞击粒子
            for (const obs of obstacles) {
                const dinoBox = getDinoHitbox();
                const obsBox = getObstacleHitbox(obs);
                if (boxesIntersect(dinoBox, obsBox)) {
                    createCrashParticles(obs);
                    break;
                }
            }

            // 延迟显示游戏结束界面
            setTimeout(showGameOverScreen, 500);
        }

        // 渲染
        function render() {
            // 清空画布
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制星星
            renderStars();

            // 绘制云朵
            renderClouds();

            // 绘制地面
            renderGround();

            // 绘制障碍物
            renderObstacles();

            // 绘制恐龙
            renderDino();

            // 绘制粒子
            renderParticles();

            // 绘制暂停遮罩
            if (gameState === 'paused') {
                renderPauseOverlay();
            }

            animationId = requestAnimationFrame(render);
        }

        function renderStars() {
            for (const star of stars) {
                const brightness = star.brightness * (0.7 + 0.3 * Math.sin(frameCount * star.twinkleSpeed + star.twinkleOffset));
                ctx.globalAlpha = brightness;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function renderClouds() {
            for (const cloud of clouds) {
                ctx.globalAlpha = cloud.opacity;
                ctx.fillStyle = '#fff';
                const cx = cloud.x;
                const cy = cloud.y;
                const w = cloud.width;
                const h = cloud.height;

                // 绘制云朵形状（多个圆组成）
                ctx.beginPath();
                ctx.ellipse(cx + w * 0.15, cy + h * 0.5, w * 0.25, h * 0.5, 0, 0, Math.PI * 2);
                ctx.ellipse(cx + w * 0.4, cy + h * 0.2, w * 0.3, h * 0.6, 0, 0, Math.PI * 2);
                ctx.ellipse(cx + w * 0.65, cy + h * 0.5, w * 0.25, h * 0.5, 0, 0, Math.PI * 2);
                ctx.ellipse(cx + w * 0.4, cy + h * 0.5, w * 0.35, h * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function renderGround() {
            // 地面主体
            ctx.fillStyle = COLORS.ground;
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // 地面线条
            ctx.strokeStyle = COLORS.groundLine;
            ctx.lineWidth = 2;
            ctx.setLineDash([40, 20]);
            ctx.lineDashOffset = groundOffset;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.stroke();
            ctx.setLineDash([]);

            // 地面装饰线
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                const y = GROUND_Y + 30 + i * 20;
                ctx.setLineDash([60, 30]);
                ctx.lineDashOffset = groundOffset * 0.5;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        function renderObstacles() {
            for (const obs of obstacles) {
                if (obs.type === 'cactus') {
                    renderCactus(obs);
                } else if (obs.type === 'bird') {
                    renderBird(obs);
                } else if (obs.type === 'combo') {
                    renderCombo(obs);
                }
            }
        }

        function renderCactus(obs) {
            ctx.fillStyle = COLORS.obstacle;
            const x = obs.x;
            const y = obs.y;
            const w = obs.width;
            const h = obs.height;

            if (obs.subType === 'single') {
                // 单个仙人掌
                drawCactusShape(x, y, w, h);
            } else if (obs.subType === 'double') {
                // 双仙人掌
                drawCactusShape(x, y, 20, h);
                drawCactusShape(x + 24, y, 20, h);
            } else if (obs.subType === 'triple') {
                // 三连仙人掌
                drawCactusShape(x, y, 18, h);
                drawCactusShape(x + 22, y, 22, h);
                drawCactusShape(x + 46, y, 18, h);
            }

            // 高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            if (obs.subType === 'single') {
                ctx.fillRect(x + 4, y + 4, 3, h - 8);
            } else if (obs.subType === 'double') {
                ctx.fillRect(x + 4, y + 4, 3, h - 8);
                ctx.fillRect(x + 28, y + 4, 3, h - 8);
            } else {
                ctx.fillRect(x + 3, y + 4, 2, h - 8);
                ctx.fillRect(x + 25, y + 4, 3, h - 8);
                ctx.fillRect(x + 49, y + 4, 2, h - 8);
            }
        }

        function drawCactusShape(x, y, w, h) {
            // 主干
            ctx.fillRect(x + w * 0.3, y, w * 0.4, h);

            // 左臂
            ctx.fillRect(x, y + h * 0.3, w * 0.35, w * 0.35);
            // 右臂
            ctx.fillRect(x + w * 0.65, y + h * 0.5, w * 0.35, w * 0.35);

            // 小刺
            ctx.fillStyle = COLORS.obstacleDark;
            ctx.fillRect(x + w * 0.15, y + h * 0.2, 2, 6);
            ctx.fillRect(x + w * 0.15, y + h * 0.4, 2, 4);
            ctx.fillRect(x + w * 0.15, y + h * 0.6, 2, 5);
            ctx.fillRect(x + w * 0.15, y + h * 0.8, 2, 3);

            ctx.fillRect(x + w * 0.85, y + h * 0.25, 2, 5);
            ctx.fillRect(x + w * 0.85, y + h * 0.55, 2, 4);
            ctx.fillRect(x + w * 0.85, y + h * 0.75, 2, 5);
        }

        function renderBird(obs) {
            const x = obs.x;
            const y = obs.y;
            const wingOffset = obs.animFrame === 0 ? -6 : 6;

            // 身体
            ctx.fillStyle = COLORS.obstacle;
            ctx.beginPath();
            ctx.ellipse(x + 23, y + 18, 20, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // 头部
            ctx.beginPath();
            ctx.ellipse(x + 40, y + 14, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // 翅膀
            ctx.fillStyle = COLORS.obstacleDark;
            ctx.beginPath();
            ctx.ellipse(x + 23, y + 18 + wingOffset, 18, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x + 44, y + 12, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 45, y + 12, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // 嘴巴
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.moveTo(x + 48, y + 14);
            ctx.lineTo(x + 54, y + 16);
            ctx.lineTo(x + 48, y + 18);
            ctx.fill();
        }

        function renderCombo(obs) {
            if (obs.comboType === 'cactusBird') {
                // 仙人掌
                drawCactusShape(obs.x, obs.y, obs.width, obs.height);
                // 飞鸟
                renderBird({ ...obs, x: obs.x + 2, y: obs.birdY, animFrame: obs.animFrame, animTimer: obs.animTimer });
            } else if (obs.comboType === 'doubleBird') {
                // 两只鸟上下
                renderBird({ ...obs, x: obs.x, y: obs.y, animFrame: obs.animFrame });
                renderBird({ ...obs, x: obs.x, y: obs.birdY2, animFrame: 1 - obs.animFrame });
            }
        }

        function renderDino() {
            const x = dino.x;
            const y = dino.y;
            const w = dino.width;
            const h = dino.height;

            // 身体主色
            ctx.fillStyle = COLORS.dino;

            if (dino.isDucking) {
                // 下蹲姿势
                // 身体
                ctx.fillRect(x + 8, y + 8, w - 16, h - 16, 8);
                ctx.beginPath();
                ctx.roundRect(x + 8, y + 8, w - 16, h - 16, 8);
                ctx.fill();

                // 头部
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, 28, 20, 6);
                ctx.fill();

                // 眼睛
                drawDinoEye(x + 18, y + 10);
            } else {
                // 站立/奔跑姿势
                // 大腿
                const legOffset = dino.isJumping ? 0 : (dino.animFrame === 0 ? -4 : 4);
                ctx.fillStyle = COLORS.dino;
                ctx.fillRect(x + 10, y + h - 16 + legOffset, 10, 16);
                ctx.fillRect(x + w - 20, y + h - 16 - legOffset, 10, 16);

                // 身体
                ctx.beginPath();
                ctx.roundRect(x + 6, y + 4, w - 12, h - 20, 8);
                ctx.fill();

                // 头部
                ctx.beginPath();
                ctx.roundRect(x - 2, y - 8, 32, 24, 8);
                ctx.fill();

                // 尾巴
                ctx.beginPath();
                ctx.moveTo(x + w - 6, y + 20);
                ctx.lineTo(x + w + 10, y + 30);
                ctx.lineTo(x + w - 6, y + 30);
                ctx.fill();

                // 眼睛
                drawDinoEye(x + 20, y + 2);

                // 脊背小刺
                ctx.fillStyle = '#3dbdb5';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x + w - 10 + i * 6, y + 8);
                    ctx.lineTo(x + w - 6 + i * 6, y + 2);
                    ctx.lineTo(x + w - 2 + i * 6, y + 8);
                    ctx.fill();
                }
            }
        }

        function drawDinoEye(ex, ey) {
            if (dino.eyeOpen) {
                // 睁眼
                ctx.fillStyle = COLORS.dinoEye;
                ctx.beginPath();
                ctx.ellipse(ex, ey, 6, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = COLORS.dinoEyePupil;
                ctx.beginPath();
                ctx.arc(ex + 1, ey, 3, 0, Math.PI * 2);
                ctx.fill();
                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(ex + 3, ey - 2, 1.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // 闭眼
                ctx.strokeStyle = COLORS.dinoEyePupil;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ex - 5, ey);
                ctx.lineTo(ex + 5, ey);
                ctx.stroke();
            }
        }

        function renderParticles() {
            for (const p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function renderPauseOverlay() {
            ctx.fillStyle = 'rgba(13, 27, 42, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00d4ff';
            ctx.font = 'bold 32px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText('游戏暂停', canvas.width / 2, canvas.height / 2 - 20);

            ctx.fillStyle = '#88a';
            ctx.font = '16px "Microsoft YaHei"';
            ctx.fillText('按 P 或点击继续', canvas.width / 2, canvas.height / 2 + 20);
            ctx.textAlign = 'left';
        }

        // UI 更新
        function updateScoreDisplay() {
            document.getElementById('currentScore').textContent = Math.floor(score);
        }

        function updateHighScoreDisplay() {
            document.getElementById('highScore').textContent = highScore;
        }

        // 启动游戏
        init();

        // 防止页面卸载时内存泄漏
        window.addEventListener('beforeunload', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
    </script>
</body>
</html>
