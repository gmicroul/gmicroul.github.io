<style>
:root {
    --bg: #0a0f1a;
    --bg-elevated: #111827;
    --fg: #e8edf5;
    --fg-muted: #8b9ab3;
    --accent: #19a7ce;
    --accent-dim: #0e7c8c;
    --card-bg: #151d2e;
    --card-border: #1e2a3e;
    --search-bg: #0d1421;
    --search-border: #2a3f54;
    --shadow: rgba(20, 40, 60, 0.35);
    --shadow-strong: rgba(20, 40, 60, 0.5);
    --leaf-gradient-1: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%);
    --leaf-gradient-2: linear-gradient(135deg, #15966b 0%, #2ebd85 50%, #4fc3f7 100%);
    --leaf-gradient-3: linear-gradient(135deg, #c56cd6 0%, #e85d9e 50%, #ffd34e 100%);
    --leaf-gradient-4: linear-gradient(135deg, #f59b23 0%, #f0544f 50%, #ffd34e 100%);
    --leaf-gradient-5: linear-gradient(135deg, #2ebd85 0%, #15966b 50%, #0e7c8c 100%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Background pattern */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(25, 167, 206, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(46, 189, 133, 0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

/* Header */
header {
    position: relative;
    z-index: 10;
    padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
    border-bottom: 1px solid var(--card-border);
    background: linear-gradient(180deg, rgba(17, 24, 39, 0.95) 0%, rgba(10, 15, 26, 0.9) 100%);
    backdrop-filter: blur(20px);
}

.header-content {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2vw, 16px);
}

header h1 {
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    font-weight: 700;
    background: linear-gradient(135deg, #4fc3f7 0%, #2ebd85 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
}

.stats {
    display: flex;
    align-items: center;
    gap: clamp(12px, 3vw, 24px);
    flex-wrap: wrap;
    font-size: clamp(0.8rem, 2vw, 0.95rem);
    color: var(--fg-muted);
}

.stats strong { color: var(--fg); }

/* Search */
.search-wrapper {
    position: relative;
    max-width: 100%;
}

#search {
    width: 100%;
    max-width: 520px;
    padding: clamp(10px, 2vw, 14px) clamp(14px, 3vw, 18px);
    padding-left: clamp(44px, 8vw, 52px);
    font-size: clamp(0.9rem, 2.5vw, 1rem);
    background: var(--search-bg);
    border: 1px solid var(--search-border);
    border-radius: 14px;
    color: var(--fg);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

#search::placeholder { color: var(--fg-muted); opacity: 0.7; }

#search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.15), 0 8px 32px var(--shadow);
    background: #111a2a;
}

.search-icon {
    position: absolute;
    left: clamp(12px, 2.5vw, 16px);
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    stroke: var(--fg-muted);
    stroke-width: 2;
    pointer-events: none;
    opacity: 0.6;
}

#search:focus + .search-icon { stroke: var(--accent); opacity: 1; }

/* Main grid */
main {
    position: relative;
    z-index: 10;
    flex: 1;
    padding: clamp(16px, 3vw, 24px) clamp(12px, 3vw, 24px);
}

.grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 18vw, 160px), 1fr));
    gap: clamp(12px, 2vw, 16px);
}

/* Game card */
.game-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: clamp(14px, 2.5vw, 18px) clamp(10px, 2vw, 14px);
    transition: transform 0.2s cubic-bezier(0.2, 0.6, 0.2, 1),
                box-shadow 0.2s cubic-bezier(0.2, 0.6, 0.2, 1),
                border-color 0.2s;
    overflow: hidden;
}

.game-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(25, 167, 206, 0.06) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
}

.game-card:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: var(--accent-dim);
    box-shadow: 0 16px 48px var(--shadow-strong), 0 4px 16px var(--shadow);
    z-index: 5;
}

.game-card:hover::before { opacity: 1; }

.game-card:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.3);
}

/* Leaf icon */
.leaf-icon {
    position: relative;
    width: clamp(64px, 14vw, 88px);
    height: clamp(64px, 14vw, 88px);
    margin-bottom: clamp(10px, 2vw, 14px);
    flex-shrink: 0;
}

.leaf-icon svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 8px 24px var(--shadow)) drop-shadow(0 2px 8px var(--shadow));
}

/* Leaf shape - sailfishos style */
/* Square with bottom-left and top-right right angles, circular arcs from center */
.leaf-shape {
    transform-origin: center;
}

/* Odd index - normal, Even index - rotated 90deg */
.leaf-icon:nth-child(odd) .leaf-shape,
.leaf-icon[data-rotate="0"] .leaf-shape {
    transform: rotate(0deg);
}
.leaf-icon[data-rotate="90"] .leaf-shape {
    transform: rotate(90deg);
}

/* Card content */
.card-title {
    font-size: clamp(0.75rem, 1.8vw, 0.9rem);
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    max-width: 100%;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--fg);
    transition: color 0.2s;
}

.game-card:hover .card-title { color: #4fc3f7; }

/* Empty state */
.empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(40px, 8vw, 60px) 20px;
    text-align: center;
    color: var(--fg-muted);
}

.empty-state .leaf-icon { margin-bottom: 16px; opacity: 0.4; }

.empty-state p { font-size: clamp(1rem, 2.5vw, 1.2rem); }

/* Footer */
footer {
    position: relative;
    z-index: 10;
    padding: clamp(16px, 3vw, 24px);
    text-align: center;
    color: var(--fg-muted);
    font-size: clamp(0.75rem, 1.5vw, 0.85rem);
    border-top: 1px solid var(--card-border);
    background: rgba(10, 15, 26, 0.8);
}

/* Animations */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.game-card {
    animation: fadeInUp 0.4s cubic-bezier(0.2, 0.6, 0.2, 1) backwards;
}

/* Staggered animation */
.grid .game-card:nth-child(1) { animation-delay: 0ms; }
.grid .game-card:nth-child(2) { animation-delay: 30ms; }
.grid .game-card:nth-child(3) { animation-delay: 60ms; }
.grid .game-card:nth-child(4) { animation-delay: 90ms; }
.grid .game-card:nth-child(5) { animation-delay: 120ms; }
.grid .game-card:nth-child(6) { animation-delay: 150ms; }
.grid .game-card:nth-child(7) { animation-delay: 180ms; }
.grid .game-card:nth-child(8) { animation-delay: 210ms; }
.grid .game-card:nth-child(9) { animation-delay: 240ms; }
.grid .game-card:nth-child(10) { animation-delay: 270ms; }
.grid .game-card:nth-child(11) { animation-delay: 300ms; }
.grid .game-card:nth-child(12) { animation-delay: 330ms; }
.grid .game-card:nth-child(13) { animation-delay: 360ms; }
.grid .game-card:nth-child(14) { animation-delay: 390ms; }
.grid .game-card:nth-child(15) { animation-delay: 420ms; }
.grid .game-card:nth-child(16) { animation-delay: 450ms; }
.grid .game-card:nth-child(17) { animation-delay: 480ms; }
.grid .game-card:nth-child(18) { animation-delay: 510ms; }
.grid .game-card:nth-child(19) { animation-delay: 540ms; }
.grid .game-card:nth-child(20) { animation-delay: 570ms; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    .game-card { animation: none; }
    .game-card:hover { transform: none; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--search-border); }

/* High contrast mode */
@media (prefers-contrast: high) {
    :root {
        --card-border: #4fc3f7;
        --search-border: #4fc3f7;
    }
    .game-card:hover { border-width: 2px; }
}
</style>

// Leaf gradients - 5 variations for visual variety
const leafGradients = [
    'linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #4fc3f7 100%)',
    'linear-gradient(135deg, #15966b 0%, #2ebd85 50%, #4fc3f7 100%)',
    'linear-gradient(135deg, #c56cd6 0%, #e85d9e 50%, #ffd34e 100%)',
    'linear-gradient(135deg, #f59b23 0%, #f0544f 50%, #ffd34e 100%)',
    'linear-gradient(135deg, #2ebd85 0%, #15966b 50%, #0e7c8c 100%)'
];

// Generate leaf SVG with sailfishos style
function generateLeafSVG(gradientIndex, rotate90) {
    const gradId = `leafGrad${gradientIndex}`;
    const rotation = rotate90 ? 'rotate(90 50 50)' : '';
    
    return `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
<defs>
    <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${leafGradients[gradientIndex].match(/#[0-9a-f]{6}/g)[0]}"/>
        <stop offset="50%" stop-color="${leafGradients[gradientIndex].match(/#[0-9a-f]{6}/g)[1]}"/>
        <stop offset="100%" stop-color="${leafGradients[gradientIndex].match(/#[0-9a-f]{6}/g)[2]}"/>
    </linearGradient>
    <filter id="leafShadow${gradientIndex}" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(20,40,60,0.35)"/>
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(20,40,60,0.2)"/>
    </filter>
</defs>
<path class="leaf-shape" d="M0,0 L100,0 L100,50 A50,50 0 0,1 50,100 L0,100 L0,50 A50,50 0 0,1 50,0 Z" fill="url(#${gradId})" filter="url(#leafShadow${gradientIndex})" transform="${rotation}"/>
</svg>`;
}

// Render game cards
const grid = document.getElementById('game-grid');
const gameCount = document.getElementById('game-count');
const filteredCount = document.getElementById('filtered-count');
const emptyState = document.getElementById('empty-state');

function renderGames(gamesToRender) {
    grid.innerHTML = '';
    
    gamesToRender.forEach((game, index) => {
        const card = document.createElement('a');
        card.href = game.url;
        card.className = 'game-card';
        card.setAttribute('role', 'listitem');
        card.setAttribute('tabindex', '0');
        
        // Assign gradient and rotation based on index
        const gradIndex = index % leafGradients.length;
        const rotate90 = index % 2 === 1; // Even index (0-based) = odd position = normal, odd index = even position = rotate 90
        
        card.innerHTML = `
            <div class="leaf-icon" data-rotate="${rotate90 ? '90' : '0'}">
                ${generateLeafSVG(gradIndex, rotate90)}
            </div>
            <span class="card-title">${escapeHtml(game.title)}</span>
        `;
        
        grid.appendChild(card);
    });
    
    // Update counts
    gameCount.textContent = games.length;
    if (gamesToRender.length !== games.length) {
        filteredCount.textContent = `（筛选: ${gamesToRender.length}）`;
        filteredCount.style.display = 'inline';
    } else {
        filteredCount.style.display = 'none';
    }
    
    // Empty state
    emptyState.style.display = gamesToRender.length === 0 ? 'flex' : 'none';
    grid.style.display = gamesToRender.length === 0 ? 'none' : 'grid';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Search/filter
const searchInput = document.getElementById('search');
let searchTimeout;

searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
            renderGames(games);
            return;
        }
        const filtered = games.filter(g => g.title.toLowerCase().includes(query));
        renderGames(filtered);
    }, 80);
});

// Initial render
renderGames(games);

// Keyboard navigation for search
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        searchInput.value = '';
        searchInput.blur();
        renderGames(games);
    }
});

// Focus search on '/' key
document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
    }
});
</script>
