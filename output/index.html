<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5 游戏大厅</title>
<meta name="description" content="精选 HTML5 游戏合集，在线畅玩">
<style>
  /* Reset */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:#0a1c24;
    color:#e0f2fe;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== Header ===== */
  .site-header{
    position:sticky; top:0; z-index:100;
    background:rgba(10,28,36,0.92);
    backdrop-filter:saturate(1.4) blur(12px);
    -webkit-backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid rgba(79,195,247,0.12);
    padding:0 clamp(12px, 3vw, 48px);
  }
  .header-inner{
    max-width:1440px; margin:0 auto;
    padding:16px 0;
    display:flex; align-items:center; gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    margin-right:auto;
  }
  .brand-mark{
    width:36px; height:36px;
    background:linear-gradient(135deg,#19A7CE,#0E7C8C);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:16px;
    box-shadow:0 4px 12px rgba(25,167,206,0.3);
  }
  .brand-name{
    font-size:20px; font-weight:700;
    background:linear-gradient(135deg,#4FC3F7,#2EBD85);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:-0.3px;
  }
  .search-wrap{
    position:relative;
    flex:0 1 360px;
    min-width:180px;
  }
  .search-wrap svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:#8ba7b8; pointer-events:none;
  }
  #search{
    width:100%;
    padding:10px 16px 10px 42px;
    background:rgba(19,47,59,0.7);
    border:1px solid rgba(79,195,247,0.2);
    border-radius:999px;
    color:#e0f2fe;
    font-size:15px;
    outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  #search::placeholder{ color:#8ba7b8; opacity:.7 }
  #search:focus{
    border-color:rgba(79,195,247,0.6);
    box-shadow:0 0 0 3px rgba(25,167,206,0.12);
  }
  .game-count{
    font-size:13px; color:#8ba7b8;
    white-space:nowrap;
    min-width:90px; text-align:right;
  }
  .game-count strong{
    color:#4FC3F7; font-weight:600;
  }

  /* ===== Main layout ===== */
  .container{
    max-width:1440px;
    margin:0 auto;
    padding:28px clamp(12px, 3vw, 48px) 60px;
  }
  .empty{
    text-align:center; padding:80px 20px; color:#8ba7b8; font-size:16px;
  }
  .empty svg{ display:block; margin:0 auto 16px; opacity:.5; }

  /* ===== Game grid ===== */
  .game-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap:20px;
  }
  @media (min-width:1200px) {
    .game-grid{ grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:24px; }
  }
  @media (max-width:480px) {
    .game-grid{ grid-template-columns: repeat(3, 1fr); gap:12px; }
  }
  @media (max-width:360px) {
    .game-grid{ grid-template-columns: repeat(2, 1fr); gap:10px; }
  }

  /* ===== Game card ===== */
  .game-card{
    display:flex; flex-direction:column;
    border-radius:18px;
    overflow:hidden;
    background:#132f3b;
    border:1px solid rgba(79,195,247,0.12);
    box-shadow:0 2px 8px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.18);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .game-card:hover{
    transform:translateY(-5px) scale(1.02);
    box-shadow:0 8px 24px rgba(0,0,0,0.35), 0 16px 40px rgba(25,167,206,0.18);
    border-color:rgba(79,195,247,0.4);
  }
  .game-card:active{ transform:translateY(-2px) scale(0.99); }
  .card-icon{
    aspect-ratio:1/1;
    background:#0a1c24;
    display:flex; align-items:center; justify-content:center;
    padding:12px;
    position:relative;
    overflow:hidden;
  }
  .card-icon img, .card-icon svg{
    width:100%; height:100%;
    display:block;
    border-radius:14px;
  }
  .card-body{
    padding:12px 14px 14px;
    border-top:1px solid rgba(79,195,247,0.08);
  }
  .card-title{
    font-size:13px; font-weight:600;
    line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    color:#e0f2fe;
  }
  .game-card:hover .card-title{
    color:#4FC3F7;
  }

  /* ===== Footer ===== */
  .site-footer{
    text-align:center; padding:24px;
    color:#8ba7b8; font-size:12px;
    border-top:1px solid rgba(79,195,247,0.08);
  }
  .site-footer a{ color:#4FC3F7; text-decoration:none; opacity:.7; }
  .site-footer a:hover{ opacity:1; text-decoration:underline; }
</style>
</head>

</footer>

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
let currentItems = GAMES;

function render(items){
  countEl.textContent = items.length;
  if (!items.length){
    grid.innerHTML = '';
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';
  // Build all at once using a document fragment
  const frag = document.createDocumentFragment();
  items.forEach(g => {
    const a = document.createElement('a');
    a.className = 'game-card';
    a.href = g.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = g.title;
    const iconWrap = document.createElement('div');
    iconWrap.className = 'card-icon';
    // icon may be data URI or http(s) URL
    if (g.icon.startsWith('http')){
      const img = document.createElement('img');
      img.src = g.icon;
      img.alt = g.title;
      img.loading = 'lazy';
      iconWrap.appendChild(img);
    } else {
      // inline SVG data URI -> render as <img>
      const img = document.createElement('img');
      img.src = g.icon;
      img.alt = g.title;
      img.loading = 'lazy';
      iconWrap.appendChild(img);
    }
    const body = document.createElement('div');
    body.className = 'card-body';
    const t = document.createElement('div');
    t.className = 'card-title';
    t.textContent = g.title;
    body.appendChild(t);
    a.appendChild(iconWrap);
    a.appendChild(body);
    frag.appendChild(a);
  });
  grid.innerHTML = '';
  grid.appendChild(frag);
}

function filter(){
  const q = search.value.trim().toLowerCase();
  if (!q){
    currentItems = GAMES;
  } else {
    currentItems = GAMES.filter(g => g.title.toLowerCase().includes(q));
  }
  render(currentItems);
}

search.addEventListener('input', filter);
render(GAMES);
})();
</script>
