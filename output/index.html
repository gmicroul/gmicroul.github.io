<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0a0a0c">
<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --bg0:#0a0a0c; --bg1:#121216;
    --panel:#16161c; --panel2:#1c1c24;
    --line:#26262f;
    --text:#eef0f4; --dim:#8a8f9c;
    --accent:#8fd0ff; --accent2:#5fe0a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Sail Sans Pro","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg0),var(--bg1) 60%,#0d0d12);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(10,10,12,.86);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:12px 18px;
  }
  .bar{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.4px}
  .logo svg{width:30px;height:30px;flex:none;display:block}
  .logo em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:12.5px;color:var(--dim);background:rgba(255,255,255,.05);
    border:1px solid var(--line);padding:4px 12px;border-radius:999px;white-space:nowrap}
  .search{margin-left:auto;flex:1;min-width:170px;max-width:380px;position:relative}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
  .search input{
    width:100%;padding:9px 14px 9px 38px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:14.5px;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,208,255,.14)}
  .search input::placeholder{color:var(--dim)}
  main{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--dim)}
  .meta b{color:var(--text);font-weight:700}
  .meta .pill{background:rgba(143,208,255,.10);border:1px solid rgba(143,208,255,.22);color:var(--accent);padding:2px 10px;border-radius:999px;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .cell{
    display:block;text-decoration:none;color:inherit;cursor:pointer;
  }
  .card{
    width:108px;height:108px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);
    border-radius:0;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .cell:hover .card{transform:translateY(-3px);border-color:rgba(143,208,255,.45);background:var(--panel2)}
  .cell:active .card{transform:scale(.97)}
  .icon{
    width:86px;height:86px;
    border-radius:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));
  }
  .name{margin-top:9px;text-align:center;font-size:12.5px;font-weight:600;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{display:none;text-align:center;padding:60px 20px;color:var(--dim);font-size:14px}
  @media (max-width:560px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    main{padding:16px 12px 48px}
  }
  @media (max-width:330px){
    .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  }
</style>
</head>

</header>

  var grid = document.getElementById('grid');
  var q = document.getElementById('q');
  var shown = document.getElementById('shown');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  count.textContent = GAMES.length + ' 款游戏';

  function el(g){
    var a = document.createElement('a');
    a.className = 'cell';
    a.href = g.h;
    a.setAttribute('data-name', g.n.toLowerCase());
    var box = document.createElement('div');
    box.className = 'card';
    var img = document.createElement('img');
    img.className = 'icon';
    img.src = g.i;
    img.alt = g.n;
    img.loading = 'lazy';
    box.appendChild(img);
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = g.n;
    name.title = g.n;
    a.appendChild(box);
    a.appendChild(name);
    return a;
  }

  function render(filter){
    filter = (filter || '').trim().toLowerCase();
    var vis = 0;
    grid.innerHTML = '';
    for (var i = 0; i < GAMES.length; i++){
      if (!filter || GAMES[i].n.toLowerCase().indexOf(filter) !== -1){
        grid.appendChild(el(GAMES[i]));
        vis++;
      }
    }
    shown.textContent = vis;
    empty.style.display = vis ? 'none' : 'block';
  }

  var t = null;
  q.addEventListener('input', function(){
    clearTimeout(t);
    var v = q.value;
    t = setTimeout(function(){ render(v); }, 90);
  });

  render('');
})();
