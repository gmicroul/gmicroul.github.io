<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg:#101317;
  --bg2:#0b0d11;
  --card:#1c222b;
  --card2:#212a35;
  --line:#2b3542;
  --accent:#17a88b;
  --accent2:#6bc6a9;
  --text:#d7dee8;
  --muted:#7f8b99;
  --input:#1a2029;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(1200px 500px at 50% -100px, #17222b 0%, var(--bg) 55%, var(--bg2) 100%);
  color:var(--text);
  font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Noto Sans","Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
  padding-bottom:48px;
}
a{color:inherit;text-decoration:none}

header{
  position:sticky;top:0;z-index:10;
  background:rgba(16,19,23,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}
.head-top{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:34px;height:34px;flex:none;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  border-radius:9px;
  display:grid;place-items:center;
  box-shadow:0 0 18px rgba(23,168,139,.45);
}
.logo svg{display:block}
h1{font-size:19px;font-weight:700;letter-spacing:.3px;color:#f2f6fb}
h1 small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:2px}
.count{
  margin-left:auto;font-size:12px;font-weight:700;
  color:var(--accent2);
  background:rgba(23,168,139,.12);
  border:1px solid rgba(107,198,169,.35);
  border-radius:14px;padding:4px 11px;white-space:nowrap;
}
.search-wrap{max-width:1100px;margin:12px auto 0;position:relative}
.search-ico{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;opacity:.55;
}
#q{
  width:100%;
  background:var(--input);
  border:1px solid var(--line);
  border-radius:22px;
  color:var(--text);
  font-size:15px;
  padding:11px 16px 11px 40px;
  outline:none;
  transition:border-color .18s, box-shadow .18s;
}
#q::placeholder{color:var(--muted)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,168,139,.18)}

main{max-width:1100px;margin:22px auto 0;padding:0 16px}
.result-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.result-bar span{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:12px;
  padding:3px 9px;cursor:pointer;user-select:none;transition:.15s;
}
.tag.on{color:#08110e;background:var(--accent2);border-color:var(--accent2);font-weight:700}

.grid{
  display:grid;
  grid-template-columns:repeat(2,108px);
  gap:14px;
  justify-content:center;
}
.card{display:flex;flex-direction:column;align-items:center}
.tile{
  width:108px;height:108px;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:0;
  display:grid;place-items:center;
  transition:transform .16s, border-color .16s, box-shadow .16s, background .16s;
}
.tile img{width:86px;height:86px;display:block;transition:transform .18s}
.tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.tile:hover img{transform:scale(1.07)}
.card p{
  width:108px;margin-top:6px;
  font-size:11px;line-height:1.3;
  color:var(--muted);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .15s;
}
.card:hover p{color:var(--accent2)}

.empty{display:none;text-align:center;padding:60px 0;color:var(--muted)}
.empty svg{opacity:.35;margin-bottom:14px}

@media (min-width:480px){
  .grid{grid-template-columns:repeat(3,108px)}
}
@media (min-width:640px){
  .grid{grid-template-columns:repeat(auto-fit,108px)}
}
</style>
</head>

var CATS = {};

(function(){
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var result = document.getElementById('result');
  var countEl = document.getElementById('count');
  var q = document.getElementById('q');
  var tagsEl = document.getElementById('tags');
  var activeCat = '';

  GAMES.forEach(function(g){ CATS[g.c] = (CATS[g.c]||0)+1; });

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function render(){
    var term = q.value.trim().toLowerCase();
    var list = GAMES.filter(function(g){
      var match = g.n.toLowerCase().indexOf(term) !== -1 || g.c.toLowerCase().indexOf(term) !== -1;
      return match && (activeCat === '' || g.c === activeCat);
    });
    grid.innerHTML = list.map(function(g){
      return '<a class="card" href="' + esc(g.h) + '" title="' + esc(g.n) + '">' +
        '<span class="tile"><img src="icons/' + esc(g.i) + '" alt="' + esc(g.n) + '" width="86" height="86" loading="lazy"></span>' +
        '<p>' + esc(g.n) + '</p></a>';
    }).join('');
    empty.style.display = list.length ? 'none' : 'block';
    grid.style.display = list.length ? 'grid' : 'none';
    result.textContent = '显示 ' + list.length + ' / ' + GAMES.length;
    countEl.textContent = GAMES.length + ' 款游戏';
  }

  function buildTags(){
    var names = {
      arcade:'街机', runner:'跑酷', sports:'体育', racing:'竞速', nature:'休闲',
      puzzle:'解谜', strategy:'策略', food:'美食', horror:'恐怖', shooter:'射击',
      space:'太空', fire:'火焰', minecraft:'方块', clicker:'点击', retro:'复古', music:'音乐'
    };
    var keys = Object.keys(CATS).sort(function(a,b){ return CATS[b]-CATS[a]; });
    tagsEl.innerHTML = '<span class="tag" data-c="">全部</span>' + keys.map(function(k){
      return '<span class="tag" data-c="' + k + '">' + (names[k]||k) + '</span>';
    }).join('');
    tagsEl.querySelectorAll('.tag').forEach(function(t){
      t.addEventListener('click', function(){
        activeCat = t.getAttribute('data-c');
        tagsEl.querySelectorAll('.tag').forEach(function(x){ x.classList.toggle('on', x === t); });
        render();
      });
    });
    tagsEl.querySelector('.tag').classList.add('on');
  }

  q.addEventListener('input', render);
  buildTags();
  render();
})();
