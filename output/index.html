  <title>游戏大厅 · Game Hub</title>
  <style>
    /* ===== CSS Variables & Reset ===== */
    :root {
      --bg-primary: #0a0f14;
      --bg-secondary: #111820;
      --bg-card: #161e2a;
      --bg-card-hover: #1c2636;
      --fg-primary: #e8f0f8;
      --fg-secondary: #9ab0c8;
      --fg-muted: #6a7a8a;
      --accent-deep: #0E7C8C;
      --accent-cyan: #19A7CE;
      --accent-sky: #4FC3F7;
      --accent-sea: #2EBD85;
      --accent-deepgreen: #15966B;
      --accent-coral: #F0544F;
      --accent-orange: #F59B23;
      --accent-yellow: #FFD34E;
      --shadow-color: rgba(20, 40, 60, 0.22);
      --shadow-strong: rgba(20, 40, 60, 0.35);
      --stroke-subtle: rgba(150, 180, 210, 0.08);
      --radius-squircle: 28%;
      --icon-safe: 82%;
      --stroke-width: 7%;
      --transition-fast: 180ms ease-out;
      --transition-normal: 280ms ease-out;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f0f4f8;
        --bg-secondary: #e8eef5;
        --bg-card: #ffffff;
        --bg-card-hover: #f5f9fc;
        --fg-primary: #1a2a3a;
        --fg-secondary: #4a5a6a;
        --fg-muted: #7a8a9a;
        --stroke-subtle: rgba(30, 60, 90, 0.1);
        --shadow-color: rgba(20, 40, 60, 0.12);
        --shadow-strong: rgba(20, 40, 60, 0.2);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      min-height: 100vh;
      background: var(--bg-primary);
      color: var(--fg-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ===== Background Atmosphere ===== */
    .bg-atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(14, 124, 140, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(30, 189, 133, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(25, 167, 206, 0.04) 0%, transparent 70%);
    }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.03;
      background-image:
        linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ===== Layout ===== */
    .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ===== Header ===== */
    .header {
      padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 32px);
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      border-bottom: 1px solid var(--stroke-subtle);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(12px, 2vw, 16px); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logo {
      display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg-primary);
      font-weight: 700; font-size: clamp(1.1rem, 2.5vw, 1.4rem); letter-spacing: -0.02em;
    }
    .logo-icon { flex-shrink: 0; }
    .logo-icon svg { display: block; }
    .logo-text { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-sea)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stats { color: var(--fg-secondary); font-size: clamp(0.8rem, 1.8vw, 0.95rem); white-space: nowrap; }
    .stats strong { color: var(--fg-primary); font-weight: 600; }

    /* ===== Search ===== */
    .search-wrapper { position: relative; width: 100%; max-width: 520px; }
    .search-input {
      width: 100%; padding: 12px 16px 12px 48px;
      background: var(--bg-card); border: 1px solid var(--stroke-subtle);
      border-radius: 14px; color: var(--fg-primary); font-size: 0.95rem; outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
    }
    .search-input::placeholder { color: var(--fg-muted); }
    .search-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(25, 167, 206, 0.15); background: var(--bg-card-hover); }
    .search-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; color: var(--fg-muted); pointer-events: none; transition: color var(--transition-fast);
    }
    .search-input:focus + .search-icon { color: var(--accent-cyan); }
    .clear-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; border: none; background: transparent; color: var(--fg-muted);
      border-radius: 8px; cursor: pointer; display: none; align-items: center; justify-content: center;
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .clear-btn:hover { background: var(--bg-secondary); color: var(--fg-primary); }
    .clear-btn.visible { display: flex; }

    /* ===== Main Grid ===== */
    .main { flex: 1; padding: clamp(16px, 3vw, 28px) clamp(16px, 4vw, 32px); }
    .grid-container { max-width: 1400px; margin: 0 auto; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: clamp(12px, 2.5vw, 20px);
    }
    @media (max-width: 480px) { .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    @media (min-width: 481px) and (max-width: 768px) { .games-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
    @media (min-width: 769px) and (max-width: 1024px) { .games-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
    @media (min-width: 1025px) and (max-width: 1400px) { .games-grid { grid-template-columns: repeat(5, 1fr); gap: 18px; } }
    @media (min-width: 1401px) { .games-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }

    /* ===== Game Card ===== */
    .game-card {
      text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center;
      background: var(--bg-card); border: 1px solid var(--stroke-subtle);
      border-radius: 18px; padding: 16px 10px 14px; gap: 10px;
      transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal), background var(--transition-normal);
      position: relative; overflow: hidden; min-height: 170px;
    }
    .game-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(25,167,206,0.06) 0%, rgba(30,189,133,0.04) 100%);
      opacity: 0; transition: opacity var(--transition-normal);
    }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px var(--shadow-strong), 0 4px 12px var(--shadow-color); border-color: rgba(25,167,206,0.25); background: var(--bg-card-hover); }
    .game-card:hover::before { opacity: 1; }
    .game-card:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; }

    /* ===== SailfishOS Style Icon ===== */
    .icon-wrapper {
      width: 72px; height: 72px; flex-shrink: 0; position: relative;
      filter: drop-shadow(0 8px 24px var(--shadow-color)) drop-shadow(0 2px 6px var(--shadow-color));
      transition: transform var(--transition-normal), filter var(--transition-normal);
    }
    .game-card:hover .icon-wrapper { transform: scale(1.05); filter: drop-shadow(0 12px 32px var(--shadow-strong)) drop-shadow(0 4px 10px var(--shadow-color)); }
    .icon-wrapper svg { width: 100%; height: 100%; display: block; }

    /* Icon base shapes - squircle mask */
    .icon-shape { border-radius: calc(72px * var(--radius-squircle) / 100); overflow: hidden; width: 100%; height: 100%; position: relative; }
    .icon-bg { width: 100%; height: 100%; position: absolute; inset: 0; }
    .icon-fg { width: 100%; height: 100%; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

    /* ===== Icon Variants (Procedural) ===== */
    /* Type 0: Circle / Concentric */
    .icon-type-0 .icon-bg { background: var(--bg-gradient); }
    .icon-type-0 .icon-fg svg { width: var(--icon-safe); height: var(--icon-safe); }

    /* Type 1: Squircle */
    .icon-type-1 .icon-bg { background: var(--bg-gradient); }
    .icon-type-1 .icon-fg svg { width: var(--icon-safe); height: var(--icon-safe); }

    /* Type 2: Organic / Teardrop */
    .icon-type-2 .icon-bg { background: var(--bg-gradient); clip-path: polygon(50% 5%, 95% 40%, 95% 85%, 50% 100%, 5% 85%, 5% 40%); }
    .icon-type-2 .icon-fg svg { width: calc(var(--icon-safe) * 0.85); height: calc(var(--icon-safe) * 0.85); }

    /* Type 3: Squircle with cut corner (Rule 7) */
    .icon-type-3 .icon-bg { background: var(--bg-gradient); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 50%); }
    .icon-type-3 .icon-fg svg { width: var(--icon-safe); height: var(--icon-safe); }

    /* Type 4: Circle with cut corner */
    .icon-type-4 .icon-bg { background: var(--bg-gradient); border-radius: 50%; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 50%); }
    .icon-type-4 .icon-fg svg { width: var(--icon-safe); height: var(--icon-safe); }

    /* Type 5: Organic with cut */
    .icon-type-5 .icon-bg { background: var(--bg-gradient); clip-path: polygon(50% 5%, 95% 40%, 95% 85%, 50% 100%, 5% 85%, 5% 40%, 50% 50%); }
    .icon-type-5 .icon-fg svg { width: calc(var(--icon-safe) * 0.85); height: calc(var(--icon-safe) * 0.85); }

    /* Rotation for even indices */
    .icon-rotated .icon-shape { transform: rotate(90deg); }
    .icon-rotated .icon-fg svg { transform: rotate(-90deg); }

    /* ===== Game Title ===== */
    .game-title {
      font-size: clamp(0.75rem, 1.6vw, 0.85rem);
      font-weight: 500; line-height: 1.3; text-align: center;
      color: var(--fg-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      max-width: 100%; padding: 0 4px;
    }

    /* ===== Empty State ===== */
    .empty-state {
      grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; text-align: center; color: var(--fg-secondary);
    }
    .empty-icon { width: 64px; height: 64px; color: var(--fg-muted); margin-bottom: 16px; opacity: 0.6; }
    .empty-text { font-size: 1rem; max-width: 300px; }

    /* ===== Footer ===== */
    .footer { padding: 24px; text-align: center; color: var(--fg-muted); font-size: 0.8rem; border-top: 1px solid var(--stroke-subtle); background: var(--bg-secondary); }
    .footer a { color: var(--accent-cyan); text-decoration: none; transition: color var(--transition-fast); }
    .footer a:hover { color: var(--accent-sky); text-decoration: underline; }

    /* ===== Reduced Motion ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* ===== High Contrast ===== */
    @media (prefers-contrast: high) {
      :root { --stroke-subtle: currentColor; --shadow-color: transparent; --shadow-strong: transparent; }
      .game-card { border-width: 2px; }
      .search-input { border-width: 2px; }
    }
  </style>
</head>

    // ===== SailfishOS Icon Generation =====
    // Color palette (ocean theme)
    const GRADIENTS = [
      // Deep teal to cyan
      "linear-gradient(135deg, #0E7C8C 0%, #19A7CE 100%)",
      "linear-gradient(135deg, #19A7CE 0%, #4FC3F7 100%)",
      "linear-gradient(135deg, #0E7C8C 0%, #2EBD85 100%)",
      "linear-gradient(135deg, #15966B 0%, #2EBD85 100%)",
      "linear-gradient(135deg, #0E7C8C 0%, #15966B 100%)",
      // Warm accents (sparse)
      "linear-gradient(135deg, #F0544F 0%, #F59B23 100%)",
      "linear-gradient(135deg, #C56CD6 0%, #E85D9E 100%)",
      "linear-gradient(135deg, #F59B23 0%, #FFD34E 100%)",
      // More ocean variants
      "linear-gradient(135deg, #19A7CE 0%, #0E7C8C 100%)",
      "linear-gradient(135deg, #2EBD85 0%, #15966B 100%)",
      "linear-gradient(135deg, #4FC3F7 0%, #19A7CE 100%)",
      "linear-gradient(135deg, #15966B 0%, #0E7C8C 100%)",
    ];

    // Symbol shapes (negative space cutouts) - 6 types matching the 3 master shapes + variants
    const SYMBOLS = [
      // Type 0: Circle / Concentric - play, target, lens
      `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="24" fill="#fff" fill-rule="evenodd"/><circle cx="32" cy="32" r="12" fill="#0a0f14"/></svg>`,

      `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="25" fill="#fff" fill-rule="evenodd"/><polygon points="32,14 50,32 32,50" fill="#0a0f14"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="24" fill="#fff" fill-rule="evenodd"/><circle cx="32" cy="32" r="8" fill="#B03A6B"/></svg>`,

      `<svg viewBox="0 0 64 64" fill="none"><path d="M12 8 C12 4 16 4 20 4 H44 C48 4 52 4 52 8 V56 C52 60 48 60 44 60 H20 C16 60 12 60 12 56 V8 Z" fill="#fff" fill-rule="evenodd"/><circle cx="32" cy="32" r="10" fill="#0a0f14"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><path d="M12 8 C12 4 16 4 20 4 H44 C48 4 52 4 52 8 V56 C52 60 48 60 44 60 H20 C16 60 12 60 12 56 V8 Z" fill="#fff" fill-rule="evenodd"/><path d="M20 32 L44 32 M32 20 L32 44" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`,

      // Type 2: Organic / Teardrop - droplet, leaf, comma
      `<svg viewBox="0 0 64 64" fill="none"><path d="M32 6 C20 6 10 18 10 32 C10 46 32 58 32 58 S54 46 54 32 C54 18 44 6 32 6 Z" fill="#fff" fill-rule="evenodd"/><ellipse cx="32" cy="28" rx="10" ry="14" fill="#0a0f14"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><path d="M32 6 C20 6 10 18 10 32 C10 46 32 58 32 58 S54 46 54 32 C54 18 44 6 32 6 Z" fill="#fff" fill-rule="evenodd"/><path d="M32 18 Q32 28 24 36 Q32 36 32 46" stroke="#0a0f14" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`,

      `<svg viewBox="0 0 64 64" fill="none"><path d="M0 0 H64 V64 H0 V0 Z M32 2 A30 30 0 1 1 2 32 A30 30 0 0 1 32 2 Z" fill="#fff" fill-rule="evenodd"/><rect x="18" y="18" width="28" height="28" rx="4" fill="#0a0f14"/></svg>`,

      `<svg viewBox="0 0 64 64" fill="none"><path d="M0 0 H64 V64 H0 V0 Z M32 2 A30 30 0 1 1 2 32 A30 30 0 0 1 32 2 Z" fill="#fff" fill-rule="evenodd"/><polygon points="32,16 48,32 32,48" fill="#0a0f14"/></svg>`,

      // Type 4: Circle with cut corner
      `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#fff" fill-rule="evenodd"/><path d="M0 0 H64 V32 H0 V0 Z M32 2 A30 30 0 1 1 2 32 A30 30 0 0 1 32 2 Z" fill="#0a0f14" fill-rule="evenodd"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#fff" fill-rule="evenodd"/><path d="M0 0 H64 V32 H0 V0 Z M32 2 A30 30 0 1 1 2 32 A30 30 0 0 1 32 2 Z" fill="#0a0f14" fill-rule="evenodd"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#fff" fill-rule="evenodd"/><path d="M0 0 H64 V32 H0 V0 Z M32 2 A30 30 0 1 1 2 32 A30 30 0 0 1 32 2 Z" fill="#0a0f14" fill-rule="evenodd"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#fff" fill-rule="evenodd"/><path d="M0 0 H64 V32 H0 V0 Z M32 2 A30 30 0 1 1 2 32 A30 30 0 0 1 32 2 Z" fill="#0a0f14" fill-rule="evenodd"/></svg>`,

      // Type 5: Organic with cut
      `<svg viewBox="0 0 64 64" fill="none"><path d="M32 6 C20 6 10 18 10 32 C10 46 32 58 32 58 S54 46 54 32 C54 18 44 6 32 6 Z M0 0 H64 V32 H0 V0 Z" fill="#fff" fill-rule="evenodd"/><ellipse cx="32" cy="28" rx="10" ry="14" fill="#0a0f14"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><path d="M32 6 C20 6 10 18 10 32 C10 46 32 58 32 58 S54 46 54 32 C54 18 44 6 32 6 Z M0 0 H64 V32 H0 V0 Z" fill="#fff" fill-rule="evenodd"/><path d="M32 18 Q32 28 24 36 Q32 36 32 46" stroke="#0a0f14" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><path d="M32 6 C20 6 10 18 10 32 C10 46 32 58 32 58 S54 46 54 32 C54 18 44 6 32 6 Z M0 0 H64 V32 H0 V0 Z" fill="#fff" fill-rule="evenodd"/><circle cx="32" cy="34" r="10" fill="#0a0f14"/></svg>`,
      `<svg viewBox="0 0 64 64" fill="none"><path d="M32 6 C20 6 10 18 10 32 C10 46 32 58 32 58 S54 46 54 32 C54 18 44 6 32 6 Z M0 0 H64 V32 H0 V0 Z" fill="#fff" fill-rule="evenodd"/><circle cx="32" cy="22" r="4" fill="#B03A6B"/><circle cx="22" cy="36" r="3" fill="#B03A6B"/><circle cx="42" cy="36" r="3" fill="#B03A6B"/></svg>`,
    ];

    // Deterministic pseudo-random for consistent assignment
    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function getIconData(title, index) {
      const h = hashString(title + index);
      const typeIndex = h % 6; // 0-5 for the 6 icon shape types
      const gradientIndex = (h >> 3) % GRADIENTS.length;
      const symbolIndex = (h >> 6) % 4 + typeIndex * 4; // 4 symbols per type
      const rotated = index % 2 === 1; // Even indices (1-based odd) rotated

      return {
        type: typeIndex,
        gradient: GRADIENTS[gradientIndex],
        symbol: SYMBOLS[symbolIndex],
        rotated
      };
    }

    // ===== Render Functions =====
    function createCard(game, index) {
      const iconData = getIconData(game.title, index);
      const href = '/games-web/' + game.path;
      const typeClass = 'icon-type-' + iconData.type;
      const rotatedClass = iconData.rotated ? 'icon-rotated' : '';

      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = href;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.role = 'listitem';
      card.setAttribute('data-title', game.title.toLowerCase());
      card.style.setProperty('--bg-gradient', iconData.gradient);

      card.innerHTML = `
        <div class="icon-wrapper">
          <div class="icon-shape ${typeClass} ${rotatedClass}">
            <div class="icon-bg"></div>
            <div class="icon-fg">${iconData.symbol}</div>
          </div>
        </div>
        <span class="game-title">${escapeHtml(game.title)}</span>
      `;
      return card;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderGames(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const emptyState = document.getElementById('emptyState');
      const countEl = document.getElementById('gameCount');
      const footerCount = document.getElementById('footerCount');

      const lowerFilter = filter.toLowerCase().trim();
      const filtered = lowerFilter
        ? GAMES.filter(g => g.title.toLowerCase().includes(lowerFilter))
        : GAMES;

      grid.innerHTML = '';
      filtered.forEach((game, i) => {
        grid.appendChild(createCard(game, i));
      });

      const visible = filtered.length;
      const total = GAMES.length;
      countEl.textContent = visible === total ? total : visible + ' / ' + total;
      footerCount.textContent = visible === total ? total : visible + ' / ' + total;

      emptyState.hidden = visible > 0;
      grid.style.display = visible > 0 ? 'grid' : 'none';
    }

    // ===== Search Handling =====
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    let searchDebounce;
    searchInput.addEventListener('input', () => {
      const value = searchInput.value;
      clearBtn.hidden = !value;
      clearBtn.classList.toggle('visible', !!value);

      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => renderGames(value), 80);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.hidden = true;
      clearBtn.classList.remove('visible');
      searchInput.focus();
      renderGames('');
    });

    // Keyboard: Escape to clear, / to focus search
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.activeElement === searchInput) {
          searchInput.blur();
        } else if (searchInput.value) {
          searchInput.value = '';
          clearBtn.hidden = true;
          clearBtn.classList.remove('visible');
          renderGames('');
        }
      }
      if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // ===== Initial Render =====
    renderGames('');

    // ===== IntersectionObserver for stagger animation (optional) =====
    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            entry.target.style.animationDelay = (i * 30) + 'ms';
            entry.target.classList.add('fade-in');
            observer.unobserve(entry.target);
          }
        });
      }, { rootMargin: '50px', threshold: 0.1 });

      const style = document.createElement('style');
      style.textContent = `
        .game-card { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.4s ease-out forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .game-card.fade-in { animation-play-state: running; }
      `;
      document.head.appendChild(style);

      // Re-observe on filter
      const origRender = renderGames;
      renderGames = function(filter) {
        origRender(filter);
        requestAnimationFrame(() => {
          document.querySelectorAll('.game-card').forEach(el => observer.observe(el));
        });
      };
    }
  </script>
