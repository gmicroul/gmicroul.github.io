<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏大厅 · Game Hub</title>
<style>
:root{
  --bg0:#07222b; --bg1:#0b3542; --bg2:#0e4757;
  --ink:#f5f7f7; --ink-dim:rgba(245,247,247,.55);
  --card-bg:rgba(255,255,255,.045);
  --card-bg-hover:rgba(255,255,255,.10);
  --accent:#19a7ce; --accent2:#4fc3f7;
  --shadow:rgba(20,40,60,.28);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(1200px 800px at 85% -10%, rgba(25,167,206,.28), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(46,189,133,.16), transparent 55%),
    linear-gradient(155deg, var(--bg2) 0%, var(--bg1) 42%, var(--bg0) 100%);
  background-attachment:fixed;
}
/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(180deg, rgba(7,34,43,.88), rgba(7,34,43,.72));
  border-bottom:1px solid rgba(79,195,247,.14);
}
.hwrap{
  max-width:1200px;margin:0 auto;
  padding:18px 20px 16px;
  display:flex;flex-direction:column;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:0 0 auto;filter:drop-shadow(0 4px 10px var(--shadow))}
.brand h1{font-size:1.35rem;font-weight:700;letter-spacing:.02em}
.brand h1 span{color:var(--accent2);font-weight:500;font-size:.85em;margin-left:.4em}
.count{
  margin-left:auto;
  font-size:.85rem;color:var(--ink-dim);
  background:rgba(25,167,206,.14);
  border:1px solid rgba(79,195,247,.25);
  padding:5px 12px;border-radius:999px;white-space:nowrap;
}
.count b{color:var(--accent2);font-weight:700}
/* ---------- search ---------- */
.search{position:relative}
.search svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--ink-dim);pointer-events:none;
}
.search input{
  width:100%;padding:12px 42px 12px 42px;
  font-size:1rem;color:var(--ink);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(79,195,247,.22);
  border-radius:999px;outline:none;
  transition:border-color .2s, background .2s, box-shadow .2s;
}
.search input::placeholder{color:var(--ink-dim)}
.search input:focus{
  border-color:var(--accent);
  background:rgba(255,255,255,.09);
  box-shadow:0 0 0 3px rgba(25,167,206,.18);
}
.clearbtn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border:none;border-radius:50%;
  background:rgba(255,255,255,.10);color:var(--ink-dim);
  font-size:14px;line-height:1;cursor:pointer;display:none;
}
.clearbtn:hover{background:rgba(255,255,255,.2);color:var(--ink)}
/* ---------- grid ---------- */
main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:18px 14px;
}
.card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:16px 8px 14px;
  background:var(--card-bg);
  border:1px solid rgba(255,255,255,.05);
  border-radius:var(--radius);
  text-decoration:none;color:var(--ink);
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  background:var(--card-bg-hover);
  border-color:rgba(79,195,247,.35);
  box-shadow:0 12px 28px rgba(3,15,20,.45);
  outline:none;
}
.card:active{transform:translateY(-1px) scale(.98)}
.icon{
  width:72%;max-width:96px;aspect-ratio:1/1;
  filter:drop-shadow(0 6px 12px var(--shadow));
  transition:transform .18s ease;
}
.card:hover .icon{transform:scale(1.06)}
.icon svg{width:100%;height:100%;display:block}
.gname{
  font-size:.86rem;line-height:1.3;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;max-width:100%;
}
/* ---------- empty ---------- */
.empty{
  display:none;text-align:center;padding:80px 20px;color:var(--ink-dim);
}
.empty .big{font-size:3rem;margin-bottom:12px}
/* ---------- footer ---------- */
footer{
  text-align:center;padding:26px 20px 34px;
  color:var(--ink-dim);font-size:.8rem;
  border-top:1px solid rgba(79,195,247,.10);
}
/* ---------- responsive ---------- */
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
  .hwrap{padding:14px 14px 12px}
  main{padding:18px 14px 48px}
  .brand h1{font-size:1.1rem}
  .gname{font-size:.78rem}
}
@media (min-width:641px) and (max-width:1024px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
}
</style>
</head>

  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;

}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let uid = 0;
function iconSVG(name){
  const [c1, c2] = PALETTES[hash(name) % PALETTES.length];
  const letter = (name.trim()[0] || "?").toUpperCase();
  const gid = "g" + (uid++);
  /* single highlight overlay, top-left light source; letter optically centered (slightly high) */
  return '<svg viewBox="0 0 512 512" role="img" aria-label="' + esc(name) + '">'
    + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/>'
    + '</linearGradient></defs>'
    + '<path d="' + ICON_PATH + '" fill="url(#' + gid + ')"/>'
    + '<ellipse cx="168" cy="128" rx="150" ry="96" fill="#ffffff" opacity="0.14" transform="rotate(-28 168 128)"/>'
    + '<text x="256" y="300" text-anchor="middle" font-family="inherit" font-size="220" font-weight="700" fill="#ffffff">'
    + esc(letter) + '</text></svg>';
}

const grid = document.getElementById("grid");
const emptyBox = document.getElementById("emptyBox");
const countBox = document.getElementById("countBox");
const input = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");

function render(list){
  const frag = document.createDocumentFragment();
  for (const g of list){
    const a = document.createElement("a");
    a.className = "card";
    a.href = g.url;               /* absolute root path: /games-web/xxx.html */
    a.target = "_blank";
    a.rel = "noopener";
    a.title = g.name;
    const ic = document.createElement("div");
    ic.className = "icon";
    ic.innerHTML = iconSVG(g.name);
    const nm = document.createElement("div");
    nm.className = "gname";
    nm.textContent = g.name;
    a.appendChild(ic); a.appendChild(nm);
    frag.appendChild(a);
  }
  grid.innerHTML = "";
  grid.appendChild(frag);
  countBox.innerHTML = "共 <b>" + list.length + "</b> 款游戏";
  emptyBox.style.display = list.length ? "none" : "block";
}

function applyFilter(){
  const q = input.value.trim().toLowerCase();
  clearBtn.style.display = q ? "block" : "none";
  if (!q){ render(GAMES); return; }
  render(GAMES.filter(g => g.name.toLowerCase().includes(q) || g.url.toLowerCase().includes(q)));
}

input.addEventListener("input", applyFilter);
clearBtn.addEventListener("click", () => { input.value = ""; applyFilter(); input.focus(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input){ e.preventDefault(); input.focus(); }
  if (e.key === "Escape" && document.activeElement === input){ input.value = ""; applyFilter(); }
});

render(GAMES);
</script>
</body>
</html>
