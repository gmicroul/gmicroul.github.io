<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙跑酷 - Chrome 风格小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 200px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: white;
        }
        
        .ui-panel {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        
        .score-board {
            display: flex;
            gap: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }
        
        .score-board span {
            color: #e74c3c;
            font-family: 'Courier New', monospace;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .btn-primary {
            background: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #fef9e7;
            border: 1px solid #f5d033;
            border-radius: 6px;
            color: #7d6608;
            font-size: 0.9rem;
            max-width: 800px;
            line-height: 1.6;
        }
        
        .instructions strong {
            color: #b7950b;
        }
        
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: white;
            z-index: 10;
        }
        
        .game-over-overlay.show {
            display: flex;
        }
        
        .game-over-overlay h2 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        
        .final-score {
            font-size: 1.5rem;
            color: #f39c12;
        }
        
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            color: white;
            z-index: 20;
        }
        
        .start-screen.hidden {
            display: none;
        }
        
        .start-screen h2 {
            font-size: 2.5rem;
        }
        
        .start-screen p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        @media (max-width: 840px) {
            .game-container {
                width: 100%;
                max-width: 800px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>🦕 恐龙跑酷</h1>
    <p class="subtitle">Chrome 风格离线小游戏 · 随机地图 · 单关卡挑战</p>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="200"></canvas>
        
        <div class="start-screen" id="startScreen">
            <h2>恐龙跑酷</h2>
            <p>按 <strong>空格</strong> 或 <strong>↑</strong> 跳跃，按 <strong>↓</strong> 蹲下</p>
            <p>避开仙人掌和飞鸟，挑战最高分！</p>
            <button class="btn-primary" id="startBtn" style="padding: 14px 40px; font-size: 1.2rem;">开始游戏</button>
        </div>
        
        <div class="game-over-overlay" id="gameOverOverlay">
            <h2>游戏结束</h2>
            <p class="final-score">最终得分: <span id="finalScore">0</span></p>
            <p>最高分: <span id="highScoreDisplay">0</span></p>
            <button class="btn-primary" id="restartBtn">再来一局</button>
        </div>
        
        <div class="ui-panel">
            <div class="score-board">
                <div>得分: <span id="score">0</span></div>
                <div>最高分: <span id="highScore">0</span></div>
                <div>速度: <span id="speedDisplay">1.0x</span></div>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn-primary" id="jumpBtn">跳跃 (空格/↑)</button>
        <button class="btn-secondary" id="duckBtn">蹲下 (↓)</button>
        <button class="btn-danger" id="pauseBtn">暂停</button>
    </div>
    
    <div class="instructions">
        <strong>操作说明：</strong>
        <br>• <strong>空格键</strong> / <strong>↑ 方向键</strong> / 点击跳跃按钮：恐龙跳跃
        <br>• <strong>↓ 方向键</strong> / 点击蹲下按钮：恐龙蹲下（躲避飞鸟）
        <br>• <strong>P 键</strong> / 点击暂停按钮：暂停/继续游戏
        <br>• 游戏每次启动<strong>随机生成地图</strong>，只有一个无尽关卡，难度随分数递增
        <br>• 碰到障碍物游戏结束，点击"再来一局"重新开始
    </div>

    <script>
        // 游戏常量
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 200;
        const GROUND_Y = 160;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const INITIAL_SPEED = 6;
        const MAX_SPEED = 15;
        const SPEED_INCREASE = 0.002;
        
        // 游戏状态
        let canvas, ctx;
        let dino, obstacles, ground;
        let score = 0;
        let highScore = 0;
        let gameSpeed = INITIAL_SPEED;
        let isRunning = false;
        let isPaused = false;
        let isGameOver = false;
        let animationId = null;
        let frameCount = 0;
        let mapGenerated = false;
        let obstacleQueue = [];
        
        // 恐龙对象
        const dinoWidth = 44;
        const dinoHeight = 47;
        const dinoDuckHeight = 30;
        
        // 图片缓存
        const sprites = {};
        let spritesLoaded = 0;
        const totalSprites = 6;
        
        // 颜色定义（用于绘制几何图形备选）
        const COLORS = {
            dino: '#535353',
            dinoEye: '#fff',
            ground: '#c0c0c0',
            obstacle: '#535353',
            sky: '#fff',
            cloud: '#e0e0e0',
            text: '#535353'
        };
        
        // 云朵
        let clouds = [];
        
        // 初始化画布
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // 从localStorage读取最高分
            highScore = parseInt(localStorage.getItem('dinoHighScore')) || 0;
            updateHighScoreDisplay();
            
            // 创建恐龙
            resetDino();
            
            // 初始化地面
            ground = { x: 0, y: GROUND_Y, width: CANVAS_WIDTH, speed: gameSpeed };
            
            // 初始化云朵
            initClouds();
            
            // 生成随机地图
            generateRandomMap();
            
            // 绑定事件
            bindEvents();
            
            // 绘制开始画面
            drawStartScreen();
        }
        
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 4; i++) {
                clouds.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: 30 + Math.random() * 60,
                    width: 60 + Math.random() * 40,
                    height: 20 + Math.random() * 15,
                    speed: 0.3 + Math.random() * 0.3
                });
            }
        }
        
        function resetDino() {
            dino = {
                x: 50,
                y: GROUND_Y - dinoHeight,
                width: dinoWidth,
                height: dinoHeight,
                velocityY: 0,
                isJumping: false,
                isDucking: false,
                animationFrame: 0,
                animationTimer: 0
            };
        }
        
        function generateRandomMap() {
            // 清空障碍物队列
            obstacleQueue = [];
            
            // 生成 30-50 个障碍物，随机分布
            const obstacleCount = 30 + Math.floor(Math.random() * 20);
            let lastX = CANVAS_WIDTH + 100;
            
            for (let i = 0; i < obstacleCount; i++) {
                // 随机间距：200-500 像素
                const gap = 200 + Math.random() * 300;
                lastX += gap;
                
                // 随机选择障碍物类型
                const type = Math.random();
                let obstacle;
                
                if (type < 0.5) {
                    // 小仙人掌
                    obstacle = createCactus('small', lastX);
                } else if (type < 0.75) {
                    // 大仙人掌
                    obstacle = createCactus('large', lastX);
                } else if (type < 0.9) {
                    // 双仙人掌
                    obstacle = createCactus('double', lastX);
                } else {
                    // 飞鸟（三种高度）
                    const birdY = [GROUND_Y - 60, GROUND_Y - 90, GROUND_Y - 120][Math.floor(Math.random() * 3)];
                    obstacle = createBird(lastX, birdY);
                }
                
                obstacleQueue.push(obstacle);
            }
            
            // 初始障碍物数组
            obstacles = [];
            
            // 将前几个障碍物移入活跃数组
            spawnInitialObstacles();
            
            mapGenerated = true;
        }
        
        function spawnInitialObstacles() {
            // 将前 5 个障碍物加入活跃列表
            for (let i = 0; i < Math.min(5, obstacleQueue.length); i++) {
                if (obstacleQueue[i].x < CANVAS_WIDTH + 200) {
                    obstacles.push(obstacleQueue[i]);
                }
            }
        }
        
        function createCactus(type, x) {
            const baseY = GROUND_Y;
            let width, height, variant;
            
            switch(type) {
                case 'small':
                    width = 17;
                    height = 35;
                    variant = Math.floor(Math.random() * 3);
                    break;
                case 'large':
                    width = 25;
                    height = 50;
                    variant = Math.floor(Math.random() * 3);
                    break;
                case 'double':
                    width = 40;
                    height = 50;
                    variant = 0;
                    break;
            }
            
            return {
                x: x,
                y: baseY - height,
                width: width,
                height: height,
                type: 'cactus',
                cactusType: type,
                variant: variant,
                passed: false
            };
        }
        
        function createBird(x, y) {
            return {
                x: x,
                y: y,
                width: 46,
                height: 40,
                type: 'bird',
                animationFrame: 0,
                animationTimer: 0,
                passed: false
            };
        }
        
        function bindEvents() {
            // 键盘事件
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            // 按钮事件
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            document.getElementById('jumpBtn').addEventListener('click', () => { if (isRunning && !isPaused && !isGameOver) jump(); });
            document.getElementById('duckBtn').addEventListener('mousedown', () => { if (isRunning && !isPaused && !isGameOver) duck(); });
            document.getElementById('duckBtn').addEventListener('mouseup', () => { if (isRunning && !isPaused && !isGameOver) unduck(); });
            document.getElementById('duckBtn').addEventListener('mouseleave', () => { if (isRunning && !isPaused && !isGameOver) unduck(); });
            document.getElementById('pauseBtn').addEventListener('click', togglePause);
            
            // 触摸事件支持
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        }
        
        function handleKeyDown(e) {
            if (!isRunning || isPaused || isGameOver) return;
            
            switch(e.code) {
                case 'Space':
                case 'ArrowUp':
                    e.preventDefault();
                    jump();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    duck();
                    break;
                case 'KeyP':
                    togglePause();
                    break;
            }
        }
        
        function handleKeyUp(e) {
            if (e.code === 'ArrowDown') {
                unduck();
            }
        }
        
        function handleTouchStart(e) {
            if (!isRunning || isPaused || isGameOver) return;
            e.preventDefault();
            jump();
        }
        
        function jump() {
            if (!dino.isJumping && !dino.isDucking) {
                dino.velocityY = JUMP_FORCE;
                dino.isJumping = true;
            }
        }
        
        function duck() {
            if (!dino.isJumping && !dino.isDucking) {
                dino.isDucking = true;
                dino.height = dinoDuckHeight;
                dino.y = GROUND_Y - dinoDuckHeight;
            }
        }
        
        function unduck() {
            if (dino.isDucking) {
                dino.isDucking = false;
                dino.height = dinoHeight;
                dino.y = GROUND_Y - dinoHeight;
            }
        }
        
        function togglePause() {
            if (!isRunning || isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? '继续' : '暂停';
            if (!isPaused) {
                gameLoop();
            }
        }
        
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.remove('show');
            isRunning = true;
            isPaused = false;
            isGameOver = false;
            score = 0;
            gameSpeed = INITIAL_SPEED;
            frameCount = 0;
            
            resetDino();
            obstacles = [];
            obstacleQueue = [];
            generateRandomMap();
            initClouds();
            
            updateScoreDisplay();
            updateSpeedDisplay();
            gameLoop();
        }
        
        function restartGame() {
            document.getElementById('gameOverOverlay').classList.remove('show');
            startGame();
        }
        
        function gameLoop() {
            if (!isRunning || isPaused || isGameOver) return;
            
            update();
            draw();
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function update() {
            frameCount++;
            
            // 更新恐龙
            updateDino();
            
            // 更新障碍物
            updateObstacles();
            
            // 更新地面
            ground.x -= gameSpeed;
            if (ground.x <= -CANVAS_WIDTH) ground.x = 0;
            
            // 更新云朵
            updateClouds();
            
            // 生成新障碍物
            spawnObstacles();
            
            // 更新分数
            score += Math.floor(gameSpeed * 0.1);
            if (score % 100 === 0) updateScoreDisplay();
            
            // 增加速度
            if (gameSpeed < MAX_SPEED) {
                gameSpeed += SPEED_INCREASE;
                updateSpeedDisplay();
            }
            
            // 更新地面速度
            ground.speed = gameSpeed;
        }
        
        function updateDino() {
            // 重力
            if (dino.isJumping) {
                dino.velocityY += GRAVITY;
                dino.y += dino.velocityY;
                
                // 着地检测
                if (dino.y >= GROUND_Y - dino.height) {
                    dino.y = GROUND_Y - dino.height;
                    dino.velocityY = 0;
                    dino.isJumping = false;
                }
            }
            
            // 动画帧
            dino.animationTimer++;
            if (dino.animationTimer >= 6) {
                dino.animationTimer = 0;
                dino.animationFrame = (dino.animationFrame + 1) % 2;
            }
        }
        
        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;
                
                // 碰撞检测
                if (checkCollision(dino, obs)) {
                    gameOver();
                    return;
                }
                
                // 计分（通过障碍物）
                if (!obs.passed && obs.x + obs.width < dino.x) {
                    obs.passed = true;
                    score += 10;
                    updateScoreDisplay();
                }
                
                // 移除屏幕外的障碍物
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
            
            // 鸟的动画
            for (const obs of obstacles) {
                if (obs.type === 'bird') {
                    obs.animationTimer++;
                    if (obs.animationTimer >= 8) {
                        obs.animationTimer = 0;
                        obs.animationFrame = (obs.animationFrame + 1) % 2;
                    }
                }
            }
        }
        
        function updateClouds() {
            for (const cloud of clouds) {
                cloud.x -= cloud.speed * (gameSpeed / INITIAL_SPEED);
                if (cloud.x + cloud.width < 0) {
                    cloud.x = CANVAS_WIDTH + Math.random() * 200;
                    cloud.y = 30 + Math.random() * 60;
                }
            }
        }
        
        function spawnObstacles() {
            // 从队列中取出进入屏幕范围的障碍物
            while (obstacleQueue.length > 0 && obstacleQueue[0].x - gameSpeed * 2 < CANVAS_WIDTH + 100) {
                const obs = obstacleQueue.shift();
                obstacles.push(obs);
            }
            
            // 如果队列空了，生成新的随机障碍物（无尽模式）
            if (obstacleQueue.length === 0) {
                // 无尽模式：继续生成
                const lastObstacleX = obstacles.length > 0 
                    ? Math.max(...obstacles.map(o => o.x + o.width))
                    : CANVAS_WIDTH;
                const newX = lastObstacleX + 200 + Math.random() * 400;
                
                for (let i = 0; i < 10; i++) {
                    const gap = 200 + Math.random() * 300;
                    const x = newX + i * gap;
                    const type = Math.random();
                    let obstacle;
                    
                    if (type < 0.5) {
                        obstacle = createCactus('small', x);
                    } else if (type < 0.75) {
                        obstacle = createCactus('large', x);
                    } else if (type < 0.9) {
                        obstacle = createCactus('double', x);
                    } else {
                        const birdY = [GROUND_Y - 60, GROUND_Y - 90, GROUND_Y - 120][Math.floor(Math.random() * 3)];
                        obstacle = createBird(x, birdY);
                    }
                    obstacleQueue.push(obstacle);
                }
            }
        }
        
        function checkCollision(dino, obstacle) {
            // 碰撞箱微调（让游戏稍微宽容一点）
            const dinoBox = {
                x: dino.x + 4,
                y: dino.y + 4,
                width: dino.width - 8,
                height: dino.height - 8
            };
            
            const obsBox = {
                x: obstacle.x + 2,
                y: obstacle.y + 2,
                width: obstacle.width - 4,
                height: obstacle.height - 4
            };
            
            return dinoBox.x < obsBox.x + obsBox.width &&
                   dinoBox.x + dinoBox.width > obsBox.x &&
                   dinoBox.y < obsBox.y + obsBox.height &&
                   dinoBox.y + dinoBox.height > obsBox.y;
        }
        
        function gameOver() {
            isGameOver = true;
            isRunning = false;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('dinoHighScore', highScore.toString());
                updateHighScoreDisplay();
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('highScoreDisplay').textContent = highScore;
            document.getElementById('gameOverOverlay').classList.add('show');
        }
        
        function draw() {
            // 清空画布
            ctx.fillStyle = COLORS.sky;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 绘制云朵
            drawClouds();
            
            // 绘制地面
            drawGround();
            
            // 绘制障碍物
            drawObstacles();
            
            // 绘制恐龙
            drawDino();
            
            // 绘制分数（游戏中实时显示）
            if (isRunning && !isGameOver) {
                drawScore();
            }
        }
        
        function drawClouds() {
            ctx.fillStyle = COLORS.cloud;
            for (const cloud of clouds) {
                // 绘制云朵（多个圆组成）
                const cx = cloud.x;
                const cy = cloud.y;
                const w = cloud.width;
                const h = cloud.height;
                
                ctx.beginPath();
                ctx.ellipse(cx, cy, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
                ctx.ellipse(cx + w * 0.3, cy - h * 0.2, w * 0.35, h * 0.4, 0, 0, Math.PI * 2);
                ctx.ellipse(cx - w * 0.3, cy - h * 0.1, w * 0.3, h * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawGround() {
            ctx.fillStyle = COLORS.ground;
            
            // 地面主线
            ctx.fillRect(ground.x, GROUND_Y, CANVAS_WIDTH * 2, 2);
            ctx.fillRect(ground.x - CANVAS_WIDTH, GROUND_Y, CANVAS_WIDTH * 2, 2);
            
            // 地面纹理（小点点）
            ctx.fillStyle = '#a0a0a0';
            for (let i = 0; i < 20; i++) {
                const x = (ground.x + i * 80) % (CANVAS_WIDTH * 2) - CANVAS_WIDTH;
                const y = GROUND_Y + 5 + (i % 3) * 3;
                ctx.fillRect(x, y, 2, 2);
            }
        }
        
        function drawObstacles() {
            for (const obs of obstacles) {
                if (obs.type === 'cactus') {
                    drawCactus(obs);
                } else if (obs.type === 'bird') {
                    drawBird(obs);
                }
            }
        }
        
        function drawCactus(obs) {
            ctx.fillStyle = COLORS.obstacle;
            const x = obs.x;
            const y = obs.y;
            const w = obs.width;
            const h = obs.height;
            
            if (obs.cactusType === 'small') {
                // 小仙人掌 - 三种变体
                switch(obs.variant) {
                    case 0: // 单柱
                        ctx.fillRect(x + 7, y, 3, h);
                        break;
                    case 1: // 双柱
                        ctx.fillRect(x + 3, y + 5, 3, h - 5);
                        ctx.fillRect(x + 11, y, 3, h);
                        break;
                    case 2: // 三柱
                        ctx.fillRect(x + 2, y + 8, 3, h - 8);
                        ctx.fillRect(x + 7, y, 3, h);
                        ctx.fillRect(x + 12, y + 5, 3, h - 5);
                        break;
                }
            } else if (obs.cactusType === 'large') {
                // 大仙人掌
                switch(obs.variant) {
                    case 0: // 主干 + 两侧分支
                        ctx.fillRect(x + 11, y, 3, h);
                        ctx.fillRect(x + 5, y + 15, 6, 3);
                        ctx.fillRect(x + 14, y + 25, 6, 3);
                        break;
                    case 1: // 主干 + 左分支
                        ctx.fillRect(x + 11, y, 3, h);
                        ctx.fillRect(x + 3, y + 20, 8, 3);
                        ctx.fillRect(x + 3, y + 20, 3, 15);
                        break;
                    case 2: // 主干 + 右分支
                        ctx.fillRect(x + 11, y, 3, h);
                        ctx.fillRect(x + 14, y + 20, 8, 3);
                        ctx.fillRect(x + 19, y + 20, 3, 15);
                        break;
                }
            } else if (obs.cactusType === 'double') {
                // 双仙人掌
                ctx.fillRect(x + 7, y, 3, h);
                ctx.fillRect(x + 30, y, 3, h);
                ctx.fillRect(x + 3, y + 10, 4, h - 10);
                ctx.fillRect(x + 33, y + 15, 4, h - 15);
            }
        }
        
        function drawBird(obs) {
            ctx.fillStyle = COLORS.obstacle;
            const x = obs.x;
            const y = obs.y;
            const wingOffset = obs.animationFrame === 0 ? -3 : 3;
            
            // 身体
            ctx.fillRect(x + 15, y + 15, 16, 10);
            ctx.fillRect(x + 18, y + 12, 10, 6);
            
            // 头
            ctx.fillRect(x + 25, y + 10, 8, 8);
            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 30, y + 12, 2, 2);
            ctx.fillStyle = COLORS.obstacle;
            
            // 翅膀
            ctx.fillRect(x + 8, y + 15 + wingOffset, 12, 4);
            ctx.fillRect(x + 5, y + 17 + wingOffset, 8, 2);
            
            // 尾巴
            ctx.fillRect(x + 10, y + 20, 6, 3);
        }
        
        function drawDino() {
            const x = dino.x;
            const y = dino.y;
            const w = dino.width;
            const h = dino.height;
            const legFrame = dino.animationFrame;
            
            ctx.fillStyle = COLORS.dino;
            
            if (dino.isDucking) {
                // 蹲下姿势
                // 身体
                ctx.fillRect(x + 8, y + 5, 28, 20);
                ctx.fillRect(x + 4, y + 10, 8, 15);
                // 头
                ctx.fillRect(x + 28, y + 2, 16, 12);
                // 眼睛
                ctx.fillStyle = COLORS.dinoEye;
                ctx.fillRect(x + 38, y + 5, 3, 3);
                ctx.fillStyle = COLORS.dino;
                // 腿
                ctx.fillRect(x + 10, y + 25, 6, 5);
                ctx.fillRect(x + 22, y + 25, 6, 5);
            } else {
                // 站立/跑步姿势
                // 身体
                ctx.fillRect(x + 12, y, 24, 30);
                // 头
                ctx.fillRect(x + 32, y - 5, 12, 17);
                // 眼睛
                ctx.fillStyle = COLORS.dinoEye;
                ctx.fillRect(x + 39, y + 2, 3, 3);
                ctx.fillStyle = COLORS.dino;
                // 尾巴
                ctx.fillRect(x + 4, y + 10, 10, 12);
                ctx.fillRect(x + 2, y + 18, 6, 8);
                
                // 腿部动画
                if (dino.isJumping) {
                    // 跳跃时腿缩起
                    ctx.fillRect(x + 16, y + 35, 6, 12);
                    ctx.fillRect(x + 28, y + 35, 6, 12);
                } else {
                    // 跑步动画
                    if (legFrame === 0) {
                        ctx.fillRect(x + 16, y + 35, 6, 12);
                        ctx.fillRect(x + 20, y + 42, 6, 5); // 脚
                        ctx.fillRect(x + 28, y + 38, 6, 9);
                        ctx.fillRect(x + 32, y + 44, 6, 3); // 脚
                    } else {
                        ctx.fillRect(x + 16, y + 38, 6, 9);
                        ctx.fillRect(x + 20, y + 44, 6, 3); // 脚
                        ctx.fillRect(x + 28, y + 35, 6, 12);
                        ctx.fillRect(x + 32, y + 42, 6, 5); // 脚
                    }
                }
            }
        }
        
        function drawScore() {
            ctx.fillStyle = COLORS.text;
            ctx.font = '20px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillText(score.toString().padStart(5, '0'), CANVAS_WIDTH - 20, 30);
            
            // HI 标记
            if (highScore > 0) {
                ctx.font = '12px "Courier New", monospace';
                ctx.fillText('HI ' + highScore.toString().padStart(5, '0'), CANVAS_WIDTH - 20, 50);
            }
        }
        
        function drawStartScreen() {
            // 绘制静态开始画面背景
            ctx.fillStyle = COLORS.sky;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            drawClouds();
            drawGround();
            // 绘制一只静态恐龙
            const startDino = { x: 50, y: GROUND_Y - dinoHeight, width: dinoWidth, height: dinoHeight, isJumping: false, isDucking: false, animationFrame: 0 };
            drawDinoStatic(startDino);
        }
        
        function drawDinoStatic(dino) {
            const x = dino.x;
            const y = dino.y;
            ctx.fillStyle = COLORS.dino;
            // 身体
            ctx.fillRect(x + 12, y, 24, 30);
            // 头
            ctx.fillRect(x + 32, y - 5, 12, 17);
            // 眼睛
            ctx.fillStyle = COLORS.dinoEye;
            ctx.fillRect(x + 39, y + 2, 3, 3);
            ctx.fillStyle = COLORS.dino;
            // 尾巴
            ctx.fillRect(x + 4, y + 10, 10, 12);
            ctx.fillRect(x + 2, y + 18, 6, 8);
            // 腿
            ctx.fillRect(x + 16, y + 35, 6, 12);
            ctx.fillRect(x + 20, y + 42, 6, 5);
            ctx.fillRect(x + 28, y + 35, 6, 12);
            ctx.fillRect(x + 32, y + 42, 6, 5);
        }
        
        function updateScoreDisplay() {
            document.getElementById('score').textContent = score;
        }
        
        function updateHighScoreDisplay() {
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('highScoreDisplay').textContent = highScore;
        }
        
        function updateSpeedDisplay() {
            document.getElementById('speedDisplay').textContent = gameSpeed.toFixed(1) + 'x';
        }
        
        // 启动游戏
        init();
    </script>
</body>
</html>
