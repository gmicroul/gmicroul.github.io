<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E7C8C">
  <title>游戏大厅 · Game Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0f14;
      --bg-elevated: #111820;
      --bg-card: #151d28;
      --fg: #e8edf2;
      --fg-muted: #7a8a9a;
      --accent: #19A7CE;
      --accent-dim: #19A7CE40;
      --accent-strong: #4FC3F7;
      --sea-deep: #0E7C8C;
      --sea-green: #2EBD85;
      --coral: #F0544F;
      --orange: #F59B23;
      --yellow: #FFD34E;
      --purple-pink: #C56CD6;
      --stroke: #233040;
      --stroke-strong: #2d3d4f;
      --shadow: rgba(20,40,60,0.25);
      --shadow-strong: rgba(20,40,60,0.4);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0f4f8;
        --bg-elevated: #ffffff;
        --bg-card: #f8fafc;
        --fg: #1a2330;
        --fg-muted: #5a6a7a;
        --accent: #0E7C8C;
        --accent-dim: #0E7C8C30;
        --accent-strong: #15966B;
        --stroke: #d0d8e0;
        --stroke-strong: #b8c4d0;
        --shadow: rgba(20,40,60,0.12);
        --shadow-strong: rgba(20,40,60,0.2);
      }
    }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.5;
    }
    /* Background atmosphere */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, var(--accent-dim) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, #2EBD8520 0%, transparent 55%),
        radial-gradient(ellipse 40% 30% at 50% 50%, var(--purple-pink)15 0%, transparent 70%),
        var(--bg);
      pointer-events: none;
    }
    /* Layout */
    .app { max-width: 1400px; margin: 0 auto; padding: 24px 16px 40px; }
    /* Header */
    .header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 28px; }
    .header-main { flex: 1; min-width: 200px; }
    .title {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent-strong), var(--accent), var(--sea-green));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1.15;
    }
    .subtitle { color: var(--fg-muted); font-size: 0.95rem; margin-top: 4px; }
    .stats { display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.85rem; color: var(--fg-muted); }
    .stat { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-elevated); border: 1px solid var(--stroke); border-radius: 100px; }
    .stat strong { color: var(--fg); font-size: 1rem; }
    /* Search */
    .search-wrapper { position: relative; flex: 1; min-width: 220px; max-width: 480px; }
    .search-input {
      width: 100%; padding: 14px 18px 14px 48px;
      font-size: 1rem; color: var(--fg);
      background: var(--bg-elevated);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-md);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      outline: none;
    }
    .search-input::placeholder { color: var(--fg-muted); }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); background: var(--bg-card); }
    .search-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; stroke: var(--fg-muted); pointer-events: none;
      transition: stroke var(--transition);
    }
    .search-input:focus + .search-icon { stroke: var(--accent); }
    .clear-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; border: none; background: transparent;
      color: var(--fg-muted); cursor: pointer; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: all var(--transition);
    }
    .search-input:not(:placeholder-shown) + .search-icon + .clear-btn,
    .search-input:focus + .search-icon + .clear-btn { opacity: 1; pointer-events: auto; }
    .clear-btn:hover { background: var(--accent-dim); color: var(--accent); }
    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }
    @media (min-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
    @media (min-width: 1400px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
    /* Card */
    .card {
      display: block; text-decoration: none; color: inherit;
      background: var(--bg-card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .card::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none; opacity: 0; transition: opacity var(--transition);
    }
    .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 20px 40px -15px var(--shadow-strong); }
    .card:hover::before { opacity: 1; }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card-icon-wrapper {
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, var(--icon-bg-start), var(--icon-bg-end));
      position: relative;
      overflow: hidden;
    }
    .card-icon-wrapper::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 60%);
      pointer-events: none;
    }
    .card-icon { width: 100%; height: 100%; display: block; }
    .card-content { padding: 14px 12px 16px; }
    .card-title {
      font-size: 0.875rem; font-weight: 600; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 2.7em;
    }
    .card-hidden { display: none !important; }
    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 24px; text-align: center; color: var(--fg-muted);
      background: var(--bg-card); border: 1px dashed var(--stroke); border-radius: var(--radius-lg);
    }
    .empty-icon { width: 64px; height: 64px; stroke: var(--fg-muted); margin-bottom: 16px; opacity: 0.6; }
    .empty-title { font-size: 1.1rem; font-weight: 600; color: var(--fg); margin-bottom: 6px; }
    .empty-desc { font-size: 0.9rem; max-width: 320px; }
    /* Footer */
    .footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--stroke); text-align: center; color: var(--fg-muted); font-size: 0.8rem; }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
  </style>
</head>

    // SailfishOS-style icon generator
    const ICON_PALETTES = [
      { start: "#0E7C8C", end: "#15966B" },     // Deep teal → Deep green
      { start: "#19A7CE", end: "#2EBD85" },     // Cyan → Sea green
      { start: "#4FC3F7", end: "#19A7CE" },     // Sky blue → Cyan
      { start: "#0E7C8C", end: "#0E7C8C" },     // Solid deep teal
      { start: "#15966B", end: "#2EBD85" },     // Deep green → Sea green
      { start: "#F0544F", end: "#C56CD6" },     // Coral → Purple-pink
      { start: "#F59B23", end: "#FFD34E" },     // Orange → Yellow
      { start: "#C56CD6", end: "#E85D9E" },     // Purple-pink gradient
      { start: "#19A7CE", end: "#0E7C8C" },     // Cyan → Deep teal
      { start: "#2EBD85", end: "#15966B" },     // Sea green → Deep green
    ];

    const ICON_SHAPES = [
      // Circle / concentric (focus, time, lens, play, celestial)
      (ctx, size, fg) => {
        const cx = size/2, cy = size/2, r = size*0.32;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        // inner cutout for some
        if (Math.random() > 0.5) {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath(); ctx.arc(cx, cy, r*0.45, 0, Math.PI*2); ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        }
      },
      // Squircle (rounded rect with continuous curvature)
      (ctx, size, fg) => {
        const r = size*0.26, inset = size*0.18;
        const w = size - inset*2, h = size - inset*2;
        const cr = Math.min(w,h)*0.55;
        ctx.beginPath();
        ctx.moveTo(inset + cr, inset);
        ctx.lineTo(inset + w - cr, inset);
        ctx.bezierCurveTo(inset + w, inset, inset + w, inset, inset + w, inset + cr);
        ctx.lineTo(inset + w, inset + h - cr);
        ctx.bezierCurveTo(inset + w, inset + h, inset + w, inset + h, inset + w - cr, inset + h);
        ctx.lineTo(inset + cr, inset + h);
        ctx.bezierCurveTo(inset, inset + h, inset, inset + h, inset, inset + h - cr);
        ctx.lineTo(inset, inset + cr);
        ctx.bezierCurveTo(inset, inset, inset, inset, inset + cr, inset);
        ctx.closePath(); ctx.fill();
        // Cutout
        if (Math.random() > 0.4) {
          ctx.globalCompositeOperation = 'destination-out';
          const icr = cr*0.5;
          const ii = inset + (w - w*0.6)/2;
          const iw = w*0.6, ih = h*0.6;
          ctx.beginPath();
          ctx.moveTo(ii + icr, ii);
          ctx.lineTo(ii + iw - icr, ii);
          ctx.bezierCurveTo(ii + iw, ii, ii + iw, ii, ii + iw, ii + icr);
          ctx.lineTo(ii + iw, ii + ih - icr);
          ctx.bezierCurveTo(ii + iw, ii + ih, ii + iw, ii + ih, ii + iw - icr, ii + ih);
          ctx.lineTo(ii + icr, ii + ih);
          ctx.bezierCurveTo(ii, ii + ih, ii, ii + ih, ii, ii + ih - icr);
          ctx.lineTo(ii, ii + icr);
          ctx.bezierCurveTo(ii, ii, ii, ii, ii + icr, ii);
          ctx.closePath(); ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        }
      },
      // Organic blob (droplet/leaf/comma/arch)
      (ctx, size, fg) => {
        const cx = size/2, cy = size/2;
        const baseR = size*0.28;
        ctx.beginPath();
        // Asymmetric blob using bezier curves
        const pts = 6;
        for (let i=0; i<pts; i++) {
          const angle = (i/pts)*Math.PI*2 - Math.PI/2;
          const variance = 0.75 + Math.random()*0.4;
          const r = baseR * variance;
          const x = cx + Math.cos(angle)*r;
          const y = cy + Math.sin(angle)*r;
          if (i===0) ctx.moveTo(x,y);
          else {
            const prevAngle = ((i-1)/pts)*Math.PI*2 - Math.PI/2;
            const px = cx + Math.cos(prevAngle)*baseR*(0.75+Math.random()*0.4);
            const py = cy + Math.sin(prevAngle)*baseR*(0.75+Math.random()*0.4);
            const cpx = (px+x)/2 + (Math.random()-0.5)*size*0.1;
            const cpy = (py+y)/2 + (Math.random()-0.5)*size*0.1;
            ctx.quadraticCurveTo(cpx, cpy, x, y);
          }
        }
        ctx.closePath(); ctx.fill();
      },
      // Play triangle (cutout from circle/squircle)
      (ctx, size, fg) => {
        const cx = size/2, cy = size/2, r = size*0.35;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'destination-out';
        const tr = r*0.55;
        ctx.beginPath();
        ctx.moveTo(cx - tr*0.6, cy - tr);
        ctx.lineTo(cx - tr*0.6, cy + tr);
        ctx.lineTo(cx + tr*0.8, cy);
        ctx.closePath(); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      },
      // Gamepad cross (cutout)
      (ctx, size, fg) => {
        const cx = size/2, cy = size/2, r = size*0.32;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'destination-out';
        const barW = size*0.08, barL = r*1.6;
        // Vertical
        ctx.roundRect(cx - barW/2, cy - barL/2, barW, barL, barW/2);
        ctx.fill();
        // Horizontal
        ctx.roundRect(cx - barL/2, cy - barW/2, barL, barW, barW/2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      },
      // Pixel block cluster
      (ctx, size, fg) => {
        const block = size*0.11, gap = size*0.025;
        const start = size/2 - (block*2 + gap);
        for (let y=0; y<3; y++) {
          for (let x=0; x<3; x++) {
            if (Math.random() > 0.25) {
              ctx.fillRect(start + x*(block+gap), start + y*(block+gap), block, block);
            }
          }
        }
      },
      // Arrow/pointer (cutout from circle)
      (ctx, size, fg) => {
        const cx = size/2, cy = size/2, r = size*0.34;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'destination-out';
        const ah = r*1.1, aw = r*0.7;
        ctx.beginPath();
        ctx.moveTo(cx, cy - ah/2);
        ctx.lineTo(cx - aw/2, cy + ah/3);
        ctx.lineTo(cx - aw/6, cy + ah/3);
        ctx.lineTo(cx - aw/6, cy + ah/2);
        ctx.lineTo(cx + aw/6, cy + ah/2);
        ctx.lineTo(cx + aw/6, cy + ah/3);
        ctx.lineTo(cx + aw/2, cy + ah/3);
        ctx.closePath(); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      },
      // Concentric rings
      (ctx, size, fg) => {
        const cx = size/2, cy = size/2;
        for (let i=3; i>=1; i--) {
          const r = size*0.14*i;
          ctx.lineWidth = size*0.035;
          ctx.strokeStyle = fg;
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
        }
        // Center dot
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(cx, cy, size*0.045, 0, Math.PI*2); ctx.fill();
      },
      // Hexagon-ish (squircle variant)
      (ctx, size, fg) => {
        const cx = size/2, cy = size/2, r = size*0.3;
        ctx.beginPath();
        for (let i=0; i<6; i++) {
          const a = (i/6)*Math.PI*2 - Math.PI/6;
          const x = cx + Math.cos(a)*r;
          const y = cy + Math.sin(a)*r;
          if (i===0) ctx.moveTo(x,y);
          else ctx.lineTo(x,y);
        }
        ctx.closePath(); ctx.fill();
      },
      // Speech bubble (organic)
      (ctx, size, fg) => {
        const cx = size/2, cy = size*0.52;
        ctx.beginPath();
        // Main bubble
        const r = size*0.28;
        ctx.moveTo(cx, cy + r*0.8);
        ctx.quadraticCurveTo(cx - r*0.3, cy + r*1.1, cx - r*0.2, cy + r*0.6);
        ctx.bezierCurveTo(cx - r, cy + r*0.3, cx - r, cy - r*0.5, cx - r*0.3, cy - r);
        ctx.bezierCurveTo(cx - r*0.1, cy - r*1.1, cx + r*0.1, cy - r*1.1, cx + r*0.3, cy - r);
        ctx.bezierCurveTo(cx + r, cy - r*0.5, cx + r, cy + r*0.3, cx + r*0.3, cy + r*0.6);
        ctx.quadraticCurveTo(cx + r*0.2, cy + r*1.1, cx, cy + r*0.8);
        ctx.closePath(); ctx.fill();
      }
    ];

    // Deterministic hash for consistent icon per game
    function hashStr(str) {
      let h = 0;
      for (let i=0; i<str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
      return Math.abs(h);
    }

    function generateIconSvg(game, index) {
      const palette = ICON_PALETTES[index % ICON_PALETTES.length];
      const shapeFn = ICON_SHAPES[hashStr(game.title) % ICON_SHAPES.length];
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, palette.start);
      grad.addColorStop(1, palette.end);
      ctx.fillStyle = grad;
      // Clip to rounded square (squircle mask)
      const cr = size * 0.26;
      ctx.beginPath();
      ctx.moveTo(cr, 0);
      ctx.lineTo(size - cr, 0);
      ctx.bezierCurveTo(size, 0, size, 0, size, cr);
      ctx.lineTo(size, size - cr);
      ctx.bezierCurveTo(size, size, size, size, size - cr, size);
      ctx.lineTo(cr, size);
      ctx.bezierCurveTo(0, size, 0, size, 0, size - cr);
      ctx.lineTo(0, cr);
      ctx.bezierCurveTo(0, 0, 0, 0, cr, 0);
      ctx.closePath();
      ctx.clip();
      ctx.fillRect(0, 0, size, size);
      // Draw shape in white (foreground)
      ctx.fillStyle = '#FFFFFF';
      shapeFn(ctx, size, '#FFFFFF');
      // Subtle highlight overlay
      const hl = ctx.createRadialGradient(size*0.25, size*0.25, 0, size*0.3, size*0.3, size*0.6);
      hl.addColorStop(0, 'rgba(255,255,255,0.18)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = hl;
      ctx.fillRect(0, 0, size, size);
      ctx.globalCompositeOperation = 'source-over';
      // Soft shadow
      ctx.shadowColor = 'rgba(20,40,60,0.25)';
      ctx.shadowBlur = size*0.08;
      ctx.shadowOffsetX = size*0.015;
      ctx.shadowOffsetY = size*0.03;
      // Convert to data URL
      return canvas.toDataURL('image/png');
    }

    // Pre-generate all icons (with caching via sessionStorage)
    function getIconDataUrl(game, index) {
      const cacheKey = `icon_${game.filename}`;
      const cached = sessionStorage.getItem(cacheKey);
      if (cached) return cached;
      const dataUrl = generateIconSvg(game, index);
      try { sessionStorage.setItem(cacheKey, dataUrl); } catch(e) {}
      return dataUrl;
    }

    // Render cards
    const grid = document.getElementById('grid');
    const emptyState = document.getElementById('emptyState');
    const totalCount = document.getElementById('total-count');
    const visibleCount = document.getElementById('visible-count');
    const searchInput = document.getElementById('search');
    const clearBtn = document.getElementById('clearBtn');

    totalCount.textContent = GAMES.length;

    function render(filter = '') {
      const term = filter.trim().toLowerCase();
      let visible = 0;
      grid.innerHTML = '';
      GAMES.forEach((game, i) => {
        if (term && !game.title.toLowerCase().includes(term)) return;
        visible++;
        const iconUrl = getIconDataUrl(game, i);
        const card = document.createElement('a');
        card.className = 'card';
        card.href = game.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.setAttribute('aria-label', game.title);
        const palette = ICON_PALETTES[i % ICON_PALETTES.length];
        card.innerHTML = `
          <div class="card-icon-wrapper" style="--icon-bg-start:${palette.start};--icon-bg-end:${palette.end};">
            <img class="card-icon" src="${iconUrl}" alt="" loading="lazy" decoding="async">
          </div>
          <div class="card-content">
            <h2 class="card-title">${escapeHtml(game.title)}</h2>
          </div>
        `;
        grid.appendChild(card);
      });
      visibleCount.textContent = visible;
      emptyState.classList.toggle('card-hidden', visible > 0);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));
    }

    // Search handling
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => render(e.target.value), 80);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      render('');
    });

    // Initial render
    render();
  </script>
</body>
</html>
