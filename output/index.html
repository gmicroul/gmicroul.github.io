<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
<title>游戏大厅 · Game Hub</title>
<style>
  :root{
    --bg1:#0c1116; --bg2:#131a23;
    --panel:rgba(255,255,255,.045);
    --panel-hover:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09);
    --border-accent:rgba(79,195,247,.55);
    --text:#eef5fa; --dim:#8aa2b8;
    --accent:#4fc3f7; --accent2:#2ebd85;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(10,15,20,.86);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(79,195,247,.16);
  }
  .bar{max-width:960px;margin:0 auto;padding:14px 18px 12px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:.4px}
  .logo .dot{width:12px;height:12px;flex:none;border-radius:2px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 14px rgba(79,195,247,.8)}
  .logo em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:12px;color:var(--dim);background:rgba(79,195,247,.08);
    border:1px solid rgba(79,195,247,.28);padding:3px 12px;border-radius:3px}
  .search{display:flex;align-items:center;gap:8px;margin-top:12px;
    background:rgba(0,0,0,.32);border:1px solid var(--border);border-radius:4px;
    padding:0 12px;transition:border-color .18s, box-shadow .18s}
  .search:focus-within{border-color:var(--border-accent);
    box-shadow:0 0 0 3px rgba(79,195,247,.14)}
  .search svg{width:16px;height:16px;flex:none;stroke:var(--dim)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);
    font-size:14px;padding:11px 0;font-family:inherit}
  .search input::placeholder{color:#5c738a}
  .search .clear{display:none;border:none;background:none;color:var(--dim);
    cursor:pointer;font-size:15px;line-height:1;padding:6px 2px}
  .search .clear.show{display:block}
  .sub{display:flex;align-items:baseline;justify-content:space-between;
    max-width:960px;margin:0 auto;padding:14px 18px 6px;
    font-size:12px;color:var(--dim)}
  main{max-width:960px;margin:0 auto;padding:10px 18px 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
  .card{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    width:108px;height:108px;padding:6px 4px 5px;margin:0 auto;
    background:var(--panel);border:1px solid var(--border);
    text-decoration:none;color:var(--text);cursor:pointer;
    transition:background .16s, border-color .16s, transform .16s, box-shadow .16s;
  }
  .card:hover,.card:focus-visible{
    background:var(--panel-hover);border-color:var(--border-accent);
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(79,195,247,.16);
    outline:none;
  }
  .card img{width:86px;height:86px;flex:none;display:block;user-select:none;
    -webkit-user-drag:none}
  .card span{width:100%;margin-top:2px;font-size:9px;line-height:1.25;color:var(--text);
    text-align:center;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .empty{display:none;grid-column:1/-1;text-align:center;color:var(--dim);
    font-size:14px;padding:60px 0}
  footer{max-width:960px;margin:0 auto;padding:6px 18px 26px;
    font-size:11px;color:#4f647a;text-align:center}
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .card{width:100%;max-width:168px}
    .bar{padding:12px 14px 10px}
    main{padding:8px 14px 32px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <div class="logo"><span class="dot"></span>游戏<em>大厅</em></div>
      <div class="count" id="countBadge">共 224 款游戏</div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21 L16.5 16.5"/>
      </svg>
      <input id="search" type="search" placeholder="搜索游戏…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clear" id="clearBtn" aria-label="清除">×</button>
    </div>
  </div>
</header>
<div class="sub">
  <span id="resultText">共 224 款游戏</span>
  <span>点击卡片进入游戏</span>
</div>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有找到匹配的游戏</div>
</main>
<footer>Game Hub · Sailfish OS 风格游戏大厅 · 224 款游戏</footer>

  var grid = document.getElementById('grid');
  var input = document.getElementById('search');
  var clearBtn = document.getElementById('clearBtn');
  var empty = document.getElementById('empty');
  var resultText = document.getElementById('resultText');
  var countBadge = document.getElementById('countBadge');

  function render(q){
    q = (q || '').trim().toLowerCase();
    var hits = [];
    for (var i = 0; i < GAMES.length; i++){
      var g = GAMES[i];
      if (!q || g.n.toLowerCase().indexOf(q) !== -1 || g.f.toLowerCase().indexOf(q) !== -1){
        hits.push(g);
      }
    }
    var frag = document.createDocumentFragment();
    for (var j = 0; j < hits.length; j++){
      var h = hits[j];
      var a = document.createElement('a');
      a.className = 'card';
      a.href = '../games-web/' + encodeURI(h.f);
      a.title = h.n;
      var img = document.createElement('img');
      img.src = h.i;
      img.alt = h.n;
      img.loading = 'lazy';
      img.width = 86; img.height = 86;
      a.appendChild(img);
      var sp = document.createElement('span');
      sp.textContent = h.n;
      a.appendChild(sp);
      frag.appendChild(a);
    }
    grid.innerHTML = '';
    grid.appendChild(frag);
    empty.style.display = hits.length ? 'none' : 'block';
    clearBtn.className = 'clear' + (q ? ' show' : '');
    var msg = q ? '显示 224 款中的 ' + hits.length + ' 款' : '共 ' + hits.length + ' 款游戏';
    resultText.textContent = msg;
    countBadge.textContent = '共 ' + GAMES.length + ' 款游戏';
  }

  input.addEventListener('input', function(){ render(input.value); });
  clearBtn.addEventListener('click', function(){
    input.value = '';
    render('');
    input.focus();
  });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ input.value = ''; render(''); }
  });
  render('');
})();
