/* ===== CSS Variables - SailfishOS Color System ===== */
:root {
  --bg-primary: #0a0f14;
  --bg-secondary: #111820;
  --bg-card: #161f2b;
  --bg-card-hover: #1d2a3d;
  --text-primary: #e8eef4;
  --text-secondary: #9ab0c8;
  --text-muted: #6b8098;
  --border-color: #2a3a4f;
  --accent-cyan: #19a7ce;
  --accent-teal: #0e7c8c;
  --accent-sky: #4fc3f7;
  --accent-sea: #2ebd85;
  --accent-deep: #15966b;
  --accent-coral: #f0544f;
  --accent-orange: #f59b23;
  --accent-yellow: #ffd34e;
  --shadow-sm: 0 2px 8px rgba(20,40,60,0.25);
  --shadow-md: 0 8px 24px rgba(20,40,60,0.3);
  --shadow-lg: 0 16px 48px rgba(20,40,60,0.35);
  --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.05);
  --radius-squircle: 28%;
  --transition-fast: 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
  --transition-normal: 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
  --transition-slow: 400ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ===== SailfishOS Icon Color Palettes ===== */
:root {
  --icon-palette-0: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 100%);
  --icon-palette-1: linear-gradient(135deg, #19a7ce 0%, #4fc3f7 100%);
  --icon-palette-2: linear-gradient(135deg, #2ebd85 0%, #15966b 100%);
  --icon-palette-3: linear-gradient(135deg, #15966b 0%, #0e7c8c 100%);
  --icon-palette-4: linear-gradient(135deg, #4fc3f7 0%, #19a7ce 100%);
  --icon-palette-5: linear-gradient(135deg, #f0544f 0%, #f59b23 100%);
  --icon-palette-6: linear-gradient(135deg, #f59b23 0%, #ffd34e 100%);
  --icon-palette-7: linear-gradient(135deg, #c56cd6 0%, #e85d9e 100%);
  --icon-palette-8: linear-gradient(135deg, #0e7c8c 0%, #2ebd85 100%);
  --icon-palette-9: linear-gradient(135deg, #19a7ce 0%, #15966b 100%);
  --icon-palette-10: linear-gradient(135deg, #4fc3f7 0%, #0e7c8c 100%);
  --icon-palette-11: linear-gradient(135deg, #f0544f 0%, #c56cd6 100%);
  --icon-palette-12: linear-gradient(135deg, #f59b23 0%, #f0544f 100%);
  --icon-palette-13: linear-gradient(135deg, #15966b 0%, #4fc3f7 100%);
  --icon-palette-14: linear-gradient(135deg, #2ebd85 0%, #4fc3f7 100%);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  min-height: 100vh;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ===== Background Atmosphere ===== */
.bg-atmosphere {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(25,167,206,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 80% 90%, rgba(46,189,133,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 100% 100% at 50% 50%, rgba(14,124,140,0.04) 0%, transparent 70%);
}
.bg-atmosphere::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.03), transparent),
    radial-gradient(1px 1px at 100px 70px, rgba(25,167,206,0.02), transparent),
    radial-gradient(1px 1px at 200px 150px, rgba(46,189,133,0.02), transparent);
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: starDrift 60s linear infinite;
}
@keyframes starDrift { 0% { transform: translate(0, 0); } 100% { transform: translate(-300px, -200px); } }

/* ===== Layout ===== */
.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* ===== Header ===== */
.header {
  padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 5vw, 2rem);
  background: linear-gradient(180deg, rgba(10,15,20,0.95) 0%, rgba(10,15,20,0.7) 100%);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.header-title {
  display: flex; align-items: center; gap: 0.75rem;
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-sky) 50%, var(--accent-sea) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-title::before {
  content: '';
  width: 40px; height: 40px;
  background: var(--icon-palette-0);
  border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
  animation: blobMorph 8s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes blobMorph {
  0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: rotate(0deg); }
  25% { border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%; transform: rotate(90deg); }
  50% { border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%; transform: rotate(180deg); }
  75% { border-radius: 33% 67% 58% 42% / 37% 29% 71% 63%; transform: rotate(270deg); }
}

/* ===== Search ===== */
.search-wrapper { position: relative; max-width: 600px; }
.search-input {
  width: 100%;
  padding: 0.875rem 1rem 0.875rem 3rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 100px;
  color: var(--text-primary);
  font-size: 1rem;
  transition: all var(--transition-fast);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(25,167,206,0.15), var(--shadow-md);
  background: var(--bg-card-hover);
}
.search-icon {
  position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; color: var(--text-muted); pointer-events: none;
  transition: color var(--transition-fast);
}
.search-input:focus + .search-icon { color: var(--accent-cyan); }
.clear-btn {
  position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border: none; background: transparent;
  color: var(--text-muted); border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all var(--transition-fast);
}
.clear-btn.visible { opacity: 1; visibility: visible; }
.clear-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

/* ===== Stats Bar ===== */
.stats-bar {
  display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  padding-top: 0.5rem; border-top: 1px solid var(--border-color);
  margin-top: 0.5rem;
}
.stat-item { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.875rem; }
.stat-item strong { color: var(--text-primary); font-weight: 600; }
.stat-divider { width: 1px; height: 1.25rem; background: var(--border-color); }

/* ===== Main Content ===== */
.main { flex: 1; padding: clamp(1rem, 3vw, 2rem); }
.games-grid {
  max-width: 1400px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: clamp(0.75rem, 2vw, 1.25rem);
}

/* ===== Game Card ===== */
.game-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  overflow: hidden;
  cursor: pointer;
  transition: all var(--transition-normal);
  aspect-ratio: 1;
  display: flex; flex-direction: column;
}
.game-card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--accent-cyan);
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(25,167,206,0.2);
  z-index: 10;
}
.game-card:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; }
.game-card.hidden { display: none !important; }

/* ===== SailfishOS Icon Container ===== */
.icon-wrapper {
  position: relative;
  width: 100%; height: 100%;
  min-height: 140px;
  display: flex; align-items: center; justify-content: center;
  background: var(--icon-bg, var(--icon-palette-0));
  overflow: hidden;
}
.icon-wrapper::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%, rgba(20,40,60,0.1) 100%);
  pointer-events: none;
}
.icon-wrapper::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.1) 0%, transparent 60%);
  pointer-events: none;
}

/* Squircle mask for SailfishOS shape */
.icon-svg {
  width: 78%; height: 78%;
  max-width: 120px; max-height: 120px;
  filter: drop-shadow(0 4px 12px rgba(20,40,60,0.3));
  transition: transform var(--transition-normal), filter var(--transition-normal);
}
.game-card:hover .icon-svg { transform: scale(1.05); filter: drop-shadow(0 8px 24px rgba(20,40,60,0.4)); }

/* Icon symbol styles - using CSS mask for negative space */
.icon-symbol {
  width: 100%; height: 100%;
  fill: #fff;
  fill-rule: evenodd;
}

/* ===== Card Content ===== */
.card-content {
  padding: clamp(0.75rem, 2vw, 1rem);
  display: flex; flex-direction: column; gap: 0.375rem;
  flex: 1; min-height: 0;
}
.game-title {
  font-size: clamp(0.75rem, 1.8vw, 0.875rem);
  font-weight: 600; color: var(--text-primary);
  line-height: 1.3; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  text-align: center;
}
.game-path {
  font-size: 0.625rem; color: var(--text-muted);
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: ui-monospace, SFMono-Regular, monospace;
}

/* ===== Empty State ===== */
.empty-state {
  grid-column: 1 / -1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4rem 2rem; text-align: center; color: var(--text-secondary);
}
.empty-icon {
  width: 80px; height: 80px; margin-bottom: 1rem; opacity: 0.5;
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.empty-state h3 { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
.empty-state p { font-size: 0.9rem; max-width: 300px; }

/* ===== Footer ===== */
.footer {
  padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;
  border-top: 1px solid var(--border-color);
  background: rgba(10,15,20,0.8); backdrop-filter: blur(10px);
}

/* ===== Responsive Breakpoints ===== */
@media (max-width: 640px) {
  .games-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
  .header { padding: 1rem; }
  .stat-divider { display: none; }
  .stats-bar { justify-content: space-around; }
}
@media (min-width: 641px) and (max-width: 1024px) {
  .games-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1025px) and (max-width: 1400px) {
  .games-grid { grid-template-columns: repeat(5, 1fr); }
}
@media (min-width: 1401px) {
  .games-grid { grid-template-columns: repeat(7, 1fr); }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== High Contrast ===== */
@media (prefers-contrast: high) {
  :root {
    --border-color: #ffffff;
    --text-secondary: #ffffff;
    --text-muted: #cccccc;
  }
  .game-card { border-width: 2px; }
}

/* ===== Loading State ===== */
.loading-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg-primary);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 1rem;
}
.loading-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border-color);
  border-top-color: var(--accent-cyan);
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-secondary); font-size: 0.9rem; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>

// Deterministic hash for consistent assignment
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0;
  }
  return Math.abs(hash);
}

function getIconData(title, index) {
  const h = hashString(title);
  const palette = iconPalettes[h % iconPalettes.length];
  const clip = organicClips[h % organicClips.length];
  const symbol = iconSymbols[h % iconSymbols.length];
  return { palette, clip, symbol };
}

// ===== DOM Elements =====
const gamesGrid = document.getElementById('gamesGrid');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const totalCount = document.getElementById('totalCount');
const filteredCount = document.getElementById('filteredCount');
const footerCount = document.getElementById('footerCount');
const emptyState = document.getElementById('emptyState');
const loadingOverlay = document.getElementById('loadingOverlay');
const app = document.getElementById('app');

let filteredGames = [...games];
let debounceTimer = null;

// ===== Render Functions =====
function createGameCard(game, index) {
  const { palette, clip, symbol } = getIconData(game.title, index);
  const card = document.createElement('article');
  card.className = 'game-card';
  card.dataset.title = game.title.toLowerCase();
  card.setAttribute('role', 'listitem');
  card.setAttribute('tabindex', '0');
  card.style.setProperty('--icon-bg', palette);
  card.style.setProperty('--icon-clip', clip);

  card.innerHTML = `
    <div class="icon-wrapper" style="clip-path: ${clip};">
      <svg class="icon-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <defs>
          <mask id="mask-${index}" maskUnits="objectBoundingBox">
            <rect x="0" y="0" width="1" height="1" fill="white"/>
            ${symbol.replace('fill="currentColor"', 'fill="black"')}
          </mask>
        </defs>
        <rect x="0" y="0" width="100" height="100" fill="white" mask="url(#mask-${index})"/>
      </svg>
    </div>
    <div class="card-content">
      <h2 class="game-title">${escapeHtml(game.title)}</h2>
      <span class="game-path">${escapeHtml(game.path)}</span>
    </div>
  `;

  const openGame = () => window.location.href = game.path;
  card.addEventListener('click', openGame);
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openGame();
    }
  });

  return card;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderGames(gamesList) {
  gamesGrid.innerHTML = '';
  const fragment = document.createDocumentFragment();
  gamesList.forEach((game, i) => {
    fragment.appendChild(createGameCard(game, i));
  });
  gamesGrid.appendChild(fragment);
  updateCounts(gamesList.length);
  emptyState.style.display = gamesList.length === 0 ? 'flex' : 'none';
}

function updateCounts(visibleCount) {
  totalCount.textContent = games.length;
  filteredCount.textContent = visibleCount;
  footerCount.textContent = games.length;
}

function filterGames(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    filteredGames = [...games];
  } else {
    filteredGames = games.filter(g => g.title.toLowerCase().includes(q));
  }
  renderGames(filteredGames);
}

// ===== Event Listeners =====
searchInput.addEventListener('input', (e) => {
  clearBtn.style.display = e.target.value ? 'flex' : 'none';
  clearBtn.classList.toggle('visible', !!e.target.value);
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => filterGames(e.target.value), 100);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  clearBtn.classList.remove('visible');
  searchInput.focus();
  filterGames('');
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.blur();
    searchInput.value = '';
    clearBtn.style.display = 'none';
    clearBtn.classList.remove('visible');
    filterGames('');
  }
});

// ===== Initialize =====
function init() {
  renderGames(games);
  loadingOverlay.style.display = 'none';
  app.style.display = 'flex';
  searchInput.focus();
}

// Start when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
