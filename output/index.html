<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏大厅 | gmicroul.github.io</title>
<style>
:root{
  --bg:#0d1117; --bg2:#131a23; --card:#171f2a; --card-hover:#1e2937;
  --text:#e8eef5; --muted:#8b98a8; --accent:#29a8df; --accent2:#7c5cff;
  --radius:18px; --gap:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:linear-gradient(160deg,#0a1420 0%,#0d1117 40%,#101826 100%);
  background-attachment:fixed;
  color:var(--text);min-height:100vh;padding-bottom:60px;
}
header{
  position:sticky;top:0;z-index:100;
  background:rgba(13,17,23,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:14px 20px;
}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.logo-icon{
  width:36px;height:36px;border-radius:26%;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:19px;
  box-shadow:0 4px 14px rgba(41,168,223,.35),inset 0 1px 0 rgba(255,255,255,.35);
}
.stats{font-size:13px;color:var(--muted);white-space:nowrap}
.stats b{color:var(--accent);font-weight:600}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--muted);pointer-events:none}
#search{
  width:100%;padding:10px 16px 10px 38px;border-radius:24px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:var(--text);font-size:14px;outline:none;transition:border-color .2s,background .2s;
}
#search:focus{border-color:var(--accent);background:rgba(255,255,255,.08)}
#search::placeholder{color:var(--muted)}
main{max-width:1400px;margin:0 auto;padding:24px 20px}
.grid{
  display:grid;gap:var(--gap);
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;
  cursor:pointer;border:1px solid rgba(255,255,255,.05);
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease,border-color .18s;
  text-decoration:none;color:inherit;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px) scale(1.03);background:var(--card-hover);
  border-color:rgba(41,168,223,.35);
  box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(41,168,223,.15);
}
.card:active{transform:translateY(-1px) scale(.99)}
/* SailfishOS-style icon: squircle, ambience gradient, glossy top, white glyph */
.icon{
  width:64px;height:64px;border-radius:28%;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
  box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 6px rgba(0,0,0,.22);
  position:relative;overflow:hidden;flex-shrink:0;
  user-select:none;
}
.icon::after{ /* sailfish glassy sheen */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 38%,rgba(255,255,255,0) 55%);
}
.name{
  font-size:12.5px;line-height:1.35;text-align:center;color:var(--text);
  word-break:break-word;max-height:2.7em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.empty{
  display:none;text-align:center;padding:80px 20px;color:var(--muted);font-size:15px;
}
.empty .big{font-size:44px;margin-bottom:12px}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
  .icon{width:56px;height:56px;font-size:26px}
  .card{padding:14px 6px 12px;gap:10px}
  .name{font-size:11.5px}
  header{padding:12px 14px}
  main{padding:16px 14px}
  .logo{font-size:17px}
}
@media (min-width:641px) and (max-width:1024px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
</style>
</head>

/* Deterministic SailfishOS-style ambience gradient per game name */
function hashStr(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
var PALETTES=[
  [203,88,64],[221,82,62],[258,70,66],[287,62,60],   /* blues/purples */
  [174,72,50],[152,64,52],[16,84,56],[38,92,58],     /* teal/green/orange */
  [336,70,62],[350,74,60],[46,90,55],[190,80,50]     /* magenta/red/amber */
];
function iconStyle(name){
  var h=hashStr(name),p=PALETTES[h%PALETTES.length];
  var c1='hsl('+p[0]+','+p[1]+'%,'+p[2]+'%)';
  var c2='hsl('+((p[0]+28)%360)+','+p[1]+'%,'+Math.max(p[2]-14,22)+'%)';
  return 'background:linear-gradient(145deg,'+c1+' 0%,'+c2+' 100%)';
}
function glyph(name){
  for(var i=0;i<name.length;i++){var c=name.charAt(i);if(/[A-Za-z0-9\u4e00-\u9fff]/.test(c))return c.toUpperCase();}
  return name.charAt(0).toUpperCase();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var grid=document.getElementById('grid');
var cards=[];
GAMES.forEach(function(g){
  var a=document.createElement('a');
  a.className='card';a.href=g.u;a.title=g.n;
  a.innerHTML='<span class="icon" style="'+iconStyle(g.n)+'">'+esc(glyph(g.n))+'</span><span class="name">'+esc(g.n)+'</span>';
  a.dataset.key=g.n.toLowerCase();
  grid.appendChild(a);cards.push(a);
});

document.getElementById('total').textContent=GAMES.length;

var input=document.getElementById('search');
var filteredEl=document.getElementById('filtered');
var filteredWrap=document.getElementById('filtered-wrap');
var emptyEl=document.getElementById('empty');
function applyFilter(){
  var q=input.value.trim().toLowerCase(),shown=0;
  cards.forEach(function(c){
    var hit=!q||c.dataset.key.indexOf(q)!==-1;
    c.style.display=hit?'':'none';
    if(hit)shown++;
  });
  filteredWrap.style.display=q?'':'none';
  filteredEl.textContent=shown;
  emptyEl.style.display=shown===0?'block':'none';
}
input.addEventListener('input',applyFilter);
</script>
