<title>游戏大厅 · Game Hub</title>
<style>
:root {
  --bg: #0a0f1a;
  --bg-elevated: #111827;
  --bg-card: #151d2e;
  --border: #1e293b;
  --border-hover: #2d3a4f;
  --text: #e8edf3;
  --text-muted: #8b9ab8;
  --text-dim: #5a6a85;
  --accent: #19a7ce;
  --accent-glow: rgba(25, 167, 206, 0.4);
  --accent-warm: #f0544f;
  --success: #2ebd85;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-hover: 0 16px 48px rgba(0,0,0,0.5);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

@media (max-width: 640px) { html { font-size: 14px; } }
@media (min-width: 1200px) { html { font-size: 17px; } }
@media (min-width: 1600px) { html { font-size: 18px; } }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

.background {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}

.background::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(25,167,206,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(46,189,133,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 100% 100% at 50% 50%, rgba(14,124,140,0.04) 0%, transparent 40%);
  animation: drift 30s ease-in-out infinite alternate;
}

@keyframes drift {
  0% { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(-2%, 2%) rotate(1deg); }
}

.background::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.03), transparent),
    radial-gradient(1px 1px at 40px 70px, rgba(25,167,206,0.02), transparent),
    radial-gradient(1px 1px at 90px 40px, rgba(46,189,133,0.02), transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.015), transparent);
  background-size: 200px 150px;
  animation: stars 60s linear infinite;
}

@keyframes stars {
  0% { transform: translateY(0); }
  100% { transform: translateY(-150px); }
}

.container {
  max-width: 1600px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

.header {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  margin-bottom: 2.5rem;
  text-align: center;
  padding-top: 1rem;
}

.header-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.logo {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0e7c8c 0%, #19a7ce 50%, #2ebd85 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(25,167,206,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}

.logo::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.logo svg {
  width: 28px;
  height: 28px;
  stroke: #fff;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  z-index: 1;
}

h1 {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff 0%, #a5b8d0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
  font-weight: 400;
}

.search-wrapper {
  position: relative;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
}

.search-input {
  width: 100%;
  padding: 0.875rem 1.25rem 0.875rem 3rem;
  font-size: 1rem;
  font-family: inherit;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  transition: var(--transition);
  outline: none;
}

.search-input::placeholder {
  color: var(--text-dim);
}

.search-input:hover {
  border-color: var(--border-hover);
  background: var(--bg-card);
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  stroke: var(--text-dim);
  pointer-events: none;
  transition: var(--transition);
}

.search-input:focus + .search-icon {
  stroke: var(--accent);
}

.clear-btn {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.clear-btn:hover {
  background: var(--bg-card);
  color: var(--accent-warm);
}

.clear-btn.visible {
  opacity: 1;
  visibility: visible;
}

.clear-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.stats {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2rem;
  flex-wrap: wrap;
  font-size: 0.875rem;
  color: var(--text-muted);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.stat-value {
  font-weight: 600;
  color: var(--text);
  font-size: 1.125rem;
}

.stat-label {
  color: var(--text-dim);
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1.25rem;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .games-grid { grid-template-columns: repeat(2, 1fr); gap: 0.875rem; }
}

@media (min-width: 481px) and (max-width: 768px) {
  .games-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .games-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1025px) and (max-width: 1400px) {
  .games-grid { grid-template-columns: repeat(6, 1fr); }
}

@media (min-width: 1401px) {
  .games-grid { grid-template-columns: repeat(8, 1fr); }
}

.game-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: var(--transition);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  min-height: 200px;
}

.game-card:hover {
  transform: translateY(-6px);
  border-color: var(--border-hover);
  box-shadow: var(--shadow-hover);
}

.game-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.card-icon {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  background: var(--icon-bg, var(--bg-elevated));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
  pointer-events: none;
}

.card-icon svg,
.card-icon canvas,
.card-icon img {
  width: 68%;
  height: 68%;
  max-width: 96px;
  max-height: 96px;
  object-fit: contain;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  transition: var(--transition);
}

.game-card:hover .card-icon svg,
.game-card:hover .card-icon canvas,
.game-card:hover .card-icon img {
  transform: scale(1.05);
}

.card-content {
  padding: 1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 72px;
}

.card-title {
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}

.card-play {
  position: absolute;
  bottom: 1rem;
  right: 1rem;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, #0e7c8c 100%);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(8px) scale(0.9);
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(25,167,206,0.4);
}

.card-play svg {
  width: 18px;
  height: 18px;
  stroke: #fff;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  margin-left: 2px;
}

.game-card:hover .card-play {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.card-play:hover {
  box-shadow: 0 6px 24px rgba(25,167,206,0.5);
  transform: scale(1.08);
}

.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
  color: var(--text-muted);
}

.empty-state svg {
  width: 80px;
  height: 80px;
  stroke: var(--text-dim);
  margin-bottom: 1.5rem;
  opacity: 0.5;
}

.empty-state p {
  font-size: 1.125rem;
  max-width: 300px;
}

.footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-dim);
  font-size: 0.875rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
  transition: var(--transition);
}

.footer a:hover {
  color: var(--success);
  text-decoration: underline;
}

/* SailfishOS-style icon generation */
.icon-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .background::before { animation: none; }
  .background::after { animation: none; }
}

/* High contrast mode */
@media (prefers-contrast: high) {
  :root {
    --border: #4a5a6f;
    --text-muted: #b0c0d8;
  }
  .game-card { border-width: 2px; }
}
</style>

// SailfishOS-style color palette
const PALETTES = [
  // Ocean theme (primary)
  { bg: ['#0e7c8c', '#15966b'], fg: '#ffffff', accent: '#4fc3f7' },
  { bg: ['#19a7ce', '#0e7c8c'], fg: '#ffffff', accent: '#2ebd85' },
  { bg: ['#4fc3f7', '#19a7ce'], fg: '#ffffff', accent: '#0e7c8c' },
  { bg: ['#2ebd85', '#15966b'], fg: '#ffffff', accent: '#4fc3f7' },
  { bg: ['#15966b', '#0e7c8c'], fg: '#ffffff', accent: '#2ebd85' },
  // Warm accents
  { bg: ['#f0544f', '#c56cd6'], fg: '#ffffff', accent: '#ffd34e' },
  { bg: ['#f59b23', '#f0544f'], fg: '#ffffff', accent: '#ffd34e' },
  { bg: ['#c56cd6', '#e85d9e'], fg: '#ffffff', accent: '#4fc3f7' },
  // Deep variants
  { bg: ['#0a5c6b', '#0e7c8c'], fg: '#f5f7f7', accent: '#4fc3f7' },
  { bg: ['#0d6b4f', '#15966b'], fg: '#f5f7f7', accent: '#2ebd85' },
  { bg: ['#1a7a8a', '#108c7c'], fg: '#ffffff', accent: '#4fc3f7' },
  { bg: ['#148568', '#1c9d7a'], fg: '#ffffff', accent: '#2ebd85' },
];

// Shape templates for SailfishOS-style icons
const SHAPES = [
  // Circle / concentric circles
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, r = size * 0.35;
    // Outer ring
    ctx.strokeStyle = fg;
    ctx.lineWidth = size * 0.07;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    // Inner dot
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  },
  // Squircle with cutout
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, s = size * 0.52;
    const r = s * 0.28;
    drawSquircle(ctx, cx - s/2, cy - s/2, s, r, fg);
    // Cutout circle
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.22, 0, Math.PI * 2);
    ctx.fill();
  },
  // Organic droplet
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, s = size * 0.48;
    drawDroplet(ctx, cx, cy, s, fg);
    // Highlight
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.ellipse(cx - s*0.1, cy - s*0.15, s*0.12, s*0.08, -0.5, 0, Math.PI*2);
    ctx.fill();
  },
  // Play triangle in circle
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, r = size * 0.35;
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    // Triangle cutout
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    const tr = r * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx - tr*0.5, cy - tr*0.866);
    ctx.lineTo(cx - tr*0.5, cy + tr*0.866);
    ctx.lineTo(cx + tr, cy);
    ctx.closePath();
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // Accent dot
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx + r*0.5, cy - r*0.5, r*0.15, 0, Math.PI*2);
    ctx.fill();
  },
  // Concentric rings
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2;
    ctx.strokeStyle = fg;
    ctx.lineWidth = size * 0.05;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(cx, cy, size * (0.22 + i * 0.1), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx, cy, size * 0.08, 0, Math.PI * 2);
    ctx.fill();
  },
  // Squircle with cross cutout
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, s = size * 0.52;
    const r = s * 0.28;
    drawSquircle(ctx, cx - s/2, cy - s/2, s, r, fg);
    // Cross cutout
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    const bar = s * 0.12;
    const len = s * 0.45;
    ctx.beginPath();
    ctx.roundRect(cx - bar/2, cy - len/2, bar, len, bar/2);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(cx - len/2, cy - bar/2, len, bar, bar/2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx, cy, size * 0.06, 0, Math.PI * 2);
    ctx.fill();
  },
  // Organic leaf
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, s = size * 0.5;
    drawLeaf(ctx, cx, cy, s, fg);
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.ellipse(cx + s*0.1, cy - s*0.1, s*0.1, s*0.06, 0.3, 0, Math.PI*2);
    ctx.fill();
  },
  // Rounded square with center circle
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, s = size * 0.56;
    const r = s * 0.25;
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.roundRect(cx - s/2, cy - s/2, s, s, r);
    ctx.fill();
    // Circle cutout
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.1, 0, Math.PI * 2);
    ctx.fill();
  },
  // Three dots organic
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, s = size * 0.5;
    drawDroplet(ctx, cx, cy, s, fg);
    ctx.fillStyle = accent;
    for (let i = 0; i < 3; i++) {
      const angle = -Math.PI/2 + i * Math.PI/3;
      const dx = Math.cos(angle) * s * 0.25;
      const dy = Math.sin(angle) * s * 0.25;
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy, s * 0.07, 0, Math.PI * 2);
      ctx.fill();
    }
  },
  // Arrow in squircle
  (ctx, size, fg, accent) => {
    const cx = size/2, cy = size/2, s = size * 0.52;
    const r = s * 0.28;
    drawSquircle(ctx, cx - s/2, cy - s/2, s, r, fg);
    // Arrow cutout
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    const a = s * 0.3;
    ctx.beginPath();
    ctx.moveTo(cx - a*0.6, cy);
    ctx.lineTo(cx + a*0.2, cy - a*0.6);
    ctx.lineTo(cx + a*0.2, cy - a*0.2);
    ctx.lineTo(cx + a*0.8, cy - a*0.2);
    ctx.lineTo(cx + a*0.8, cy + a*0.2);
    ctx.lineTo(cx + a*0.2, cy + a*0.2);
    ctx.lineTo(cx + a*0.2, cy + a*0.6);
    ctx.closePath();
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx - s*0.2, cy - s*0.2, s*0.1, 0, Math.PI*2);
    ctx.fill();
  },
];

function drawSquircle(ctx, x, y, w, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, w, r);
  ctx.fill();
}

function drawDroplet(ctx, cx, cy, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  const r = size * 0.5;
  ctx.moveTo(cx, cy - r);
  ctx.bezierCurveTo(
    cx + r * 0.9, cy - r * 0.3,
    cx + r * 0.9, cy + r * 0.3,
    cx, cy + r
  );
  ctx.bezierCurveTo(
    cx - r * 0.9, cy + r * 0.3,
    cx - r * 0.9, cy - r * 0.3,
    cx, cy - r
  );
  ctx.fill();
}

function drawLeaf(ctx, cx, cy, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  const r = size * 0.5;
  ctx.moveTo(cx, cy - r);
  ctx.bezierCurveTo(
    cx + r * 1.1, cy - r * 0.2,
    cx + r * 0.8, cy + r * 0.8,
    cx, cy + r
  );
  ctx.bezierCurveTo(
    cx - r * 0.5, cy + r * 0.5,
    cx - r * 0.5, cy - r * 0.5,
    cx, cy - r
  );
  ctx.fill();
}

// Deterministic hash for consistent assignment
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getIconData(title) {
  const h = hashString(title);
  const palette = PALETTES[h % PALETTES.length];
  const shape = SHAPES[h % SHAPES.length];
  const shapeIndex = h % SHAPES.length;
  return { palette, shape, shapeIndex };
}

function generateIconCanvas(title, size = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const { palette, shape } = getIconData(title);
  const [bg1, bg2] = palette.bg;

  // Background gradient (120-150 degrees, light source top-left)
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, bg1);
  grad.addColorStop(1, bg2);
  ctx.fillStyle = grad;

  // Draw base shape (squircle container)
  const containerSize = size * 0.9;
  const containerX = (size - containerSize) / 2;
  const containerR = containerSize * 0.25;
  ctx.beginPath();
  ctx.roundRect(containerX, containerX, containerSize, containerSize, containerR);
  ctx.fill();

  // Subtle inner glow (top-left highlight)
  const highlight = ctx.createLinearGradient(0, 0, size * 0.6, size * 0.6);
  highlight.addColorStop(0, 'rgba(255,255,255,0.08)');
  highlight.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = highlight;
  ctx.beginPath();
  ctx.roundRect(containerX, containerX, containerSize, containerSize, containerR);
  ctx.fill();

  // Draw the symbol (negative space / cutout approach)
  shape(ctx, size, palette.fg, palette.accent);

  // Subtle shadow (drop shadow simulation)
  ctx.shadowColor = 'rgba(20,40,60,0.2)';
  ctx.shadowBlur = size * 0.04;
  ctx.shadowOffsetX = size * 0.01;
  ctx.shadowOffsetY = size * 0.02;

  return canvas;
}

function createGameCard(game) {
  const card = document.createElement('a');
  card.href = `/games-web/${game.filename}`;
  card.className = 'game-card';
  card.setAttribute('role', 'listitem');
  card.setAttribute('data-title', game.title.toLowerCase());

  const iconData = getIconData(game.title);
  const [bg1] = iconData.palette.bg;
  card.style.setProperty('--icon-bg', bg1);

  const canvas = generateIconCanvas(game.title, 256);

  card.innerHTML = `
    <div class="card-icon" aria-hidden="true"></div>
    <div class="card-content">
      <span class="card-title">${escapeHtml(game.title)}</span>
    </div>
    <button class="card-play" aria-label="玩 ${escapeHtml(game.title)}" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21"/>
      </svg>
    </button>
  `;

  const iconContainer = card.querySelector('.card-icon');
  iconContainer.appendChild(canvas);

  return card;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderGames(games) {
  const grid = document.getElementById('gamesGrid');
  const emptyState = document.getElementById('emptyState');
  grid.innerHTML = '';

  if (games.length === 0) {
    grid.style.display = 'none';
    emptyState.style.display = 'flex';
    return;
  }

  grid.style.display = 'grid';
  emptyState.style.display = 'none';

  const fragment = document.createDocumentFragment();
  games.forEach((game, index) => {
    const card = createGameCard(game);
    card.style.animationDelay = `${Math.min(index * 0.01, 0.3)}s`;
    fragment.appendChild(card);
  });
  grid.appendChild(fragment);
}

function filterGames(query) {
  const normalized = query.toLowerCase().trim();
  if (!normalized) return GAMES;
  return GAMES.filter(g => g.title.toLowerCase().includes(normalized));
}

function updateStats(visible, total) {
  document.getElementById('visibleCount').textContent = visible;
  document.getElementById('totalCount').textContent = total;
}

// Initialize
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

renderGames(GAMES);
updateStats(GAMES.length, GAMES.length);

searchInput.addEventListener('input', (e) => {
  const query = e.target.value;
  const filtered = filterGames(query);
  renderGames(filtered);
  updateStats(filtered.length, GAMES.length);
  clearBtn.classList.toggle('visible', query.length > 0);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  renderGames(GAMES);
  updateStats(GAMES.length, GAMES.length);
  clearBtn.classList.remove('visible');
});

searchInput.addEventListener('focus', () => {
  if (searchInput.value) clearBtn.classList.add('visible');
});

searchInput.addEventListener('blur', () => {
  setTimeout(() => clearBtn.classList.remove('visible'), 200);
});

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.blur();
    clearBtn.classList.remove('visible');
  }
});

// Touch-friendly: prevent zoom on input focus (iOS)
if ('ontouchstart' in window) {
  const viewport = document.querySelector('meta[name=viewport]');
  if (viewport) viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
}
