<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏大厅 · SFOS</title>
<style>
  :root{
    --bg1:#0c1b26; --bg2:#142b3a;
    --card:#142e3e; --card-hi:#1c3d50;
    --line:rgba(120,200,230,.16);
    --text:#eaf6fb; --dim:#8fb3c4;
    --acc:#4fc3f7; --acc2:#2edca2;
    --chip:#0f2735;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 500px at 80% -10%, rgba(46,220,162,.10), transparent 60%),
      radial-gradient(900px 460px at -10% 10%, rgba(79,195,247,.12), transparent 55%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(12,27,38,.78);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .top{max-width:1120px;margin:0 auto;padding:14px 18px 10px}
  .bar{display:flex;align-items:center;gap:12px}
  .logo{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(145deg,var(--acc),var(--acc2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(46,220,162,.35);
  }
  .logo svg{width:24px;height:24px}
  .ttl{font-size:19px;font-weight:800;letter-spacing:.5px}
  .ttl small{display:block;font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.3px;margin-top:2px}
  .cnt{
    margin-left:auto;font-size:12px;color:var(--dim);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    padding:5px 12px;border-radius:99px;white-space:nowrap;
  }
  .cnt b{color:var(--acc2);font-weight:700}
  .search{
    margin-top:12px;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:16px;padding:0 14px;height:44px;
  }
  .search:focus-within{border-color:rgba(79,195,247,.55);box-shadow:0 0 0 3px rgba(79,195,247,.15)}
  .search svg{width:18px;height:18px;flex:none;color:var(--dim)}
  .search input{
    flex:1;border:none;outline:none;background:transparent;
    color:var(--text);font-size:15px;height:100%;min-width:0;
  }
  .search input::placeholder{color:var(--dim)}
  .clear{display:none;border:none;background:rgba(255,255,255,.12);color:var(--text);width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;line-height:22px;text-align:center;flex:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--line);background:var(--chip);color:var(--dim);
    padding:6px 13px;border-radius:99px;font-size:12px;cursor:pointer;transition:.18s;user-select:none;
  }
  .chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06222c;font-weight:700;border-color:transparent}
  main{max-width:1120px;margin:0 auto;padding:18px 18px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 12px}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
  .card{
    width:108px;height:108px;border-radius:20px;
    background:linear-gradient(160deg,var(--card),#0f2431);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card img{width:86px;height:86px;border-radius:16px;display:block}
  .item:hover .card,.item:focus .card{
    transform:translateY(-3px);
    box-shadow:0 12px 26px rgba(0,0,0,.4), 0 0 0 1px rgba(79,195,247,.4);
    border-color:rgba(79,195,247,.5);
  }
  .item:active .card{transform:translateY(0) scale(.97)}
  .nm{
    max-width:120px;font-size:12px;line-height:1.25;text-align:center;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--dim);font-size:14px}
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:16px 10px}
    .ttl{font-size:17px}
  }
  @media (max-width:340px){
    .card{width:100px;height:100px}
  }
</style>
</head>

var CATS = ["全部", "竞速", "体育", "射击", "塔防", "益智", "平台", "动作", "冒险", "io", "模拟", "休闲", "音乐", "恐怖", "格斗", "策略", "沙盒"];
var curCat = "全部";
var grid = document.getElementById('grid');
var q = document.getElementById('q');
var clr = document.getElementById('clr');
var empty = document.getElementById('empty');
var cntEl = document.getElementById('cnt');

var chipsEl = document.getElementById('chips');
CATS.forEach(function(c){
  var b = document.createElement('button');
  b.className = 'chip' + (c === '全部' ? ' on' : '');
  b.textContent = c;
  b.dataset.c = c;
  b.addEventListener('click', function(){
    curCat = c;
    document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on', x === b);});
    render();
  });
  chipsEl.appendChild(b);
});

function norm(s){ return s.toLowerCase(); }

function render(){
  var kw = norm(q.value.trim());
  var list = GAMES.filter(function(g){
    if (curCat !== '全部' && g.cat !== curCat) return false;
    if (kw && norm(g.name).indexOf(kw) < 0) return false;
    return true;
  });
  cntEl.textContent = list.length;
  grid.innerHTML = '';
  list.forEach(function(g){
    var a = document.createElement('a');
    a.className = 'item';
    a.href = '../games-web/' + g.file;
    a.title = g.name;
    var card = document.createElement('div');
    card.className = 'card';
    var img = document.createElement('img');
    img.src = 'icons/' + g.icon;
    img.alt = g.name;
    img.width = 86; img.height = 86; img.loading = 'lazy';
    card.appendChild(img);
    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = g.name;
    a.appendChild(card);
    a.appendChild(nm);
    grid.appendChild(a);
  });
  empty.style.display = list.length ? 'none' : 'block';
}

var t;
q.addEventListener('input', function(){
  clr.style.display = q.value ? 'block' : 'none';
  clearTimeout(t);
  t = setTimeout(render, 90);
});
clr.addEventListener('click', function(){ q.value = ''; clr.style.display = 'none'; render(); q.focus(); });
render();
</script>
