<?xml version="1.0" encoding="UTF-8"?>
<svg width="86" height="86" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-run3">
      <path d="M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z M 0 43 A 43.0 43.0 0 0 1 43.0 0.0 L 0 0 Z M 86 43 A 43.0 43.0 0 0 1 43.0 86.0 L 86 86 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-run3)">
    <!-- Background fill -->
    <rect width="86" height="86" fill="#161b22"/>
    
    <!-- Theme decorations (behind pelican) -->
    <rect x="5" y="8" width="15" height="2" rx="1" fill="#1f6feb" opacity="0.25"/>
    <rect x="30" y="14" width="15" height="2" rx="1" fill="#1f6feb" opacity="0.25"/>
    <rect x="55" y="8" width="15" height="2" rx="1" fill="#1f6feb" opacity="0.25"/>
    <polygon points="75,70 76.5,73 73.5,73" fill="#f0883e" opacity="0.2"/>
    <polygon points="10,76 11.5,79 8.5,79" fill="#f0883e" opacity="0.2"/>
    <polygon points="70,3 71.5,6 68.5,6" fill="#f0883e" opacity="0.2"/>
    
    <!-- === UNICYCLE === -->
    <!-- Wheel -->
    <circle cx="43" cy="68" r="12" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
    <circle cx="43" cy="68" r="2" fill="#1f6feb"/>
    <!-- Spokes -->
    <line x1="43" y1="56" x2="43" y2="80" stroke="#1f6feb" stroke-width="1"/>
    <line x1="31" y1="68" x2="55" y2="68" stroke="#1f6feb" stroke-width="1"/>
    <line x1="34.5" y1="59.5" x2="51.5" y2="76.5" stroke="#1f6feb" stroke-width="0.8"/>
    <line x1="51.5" y1="59.5" x2="34.5" y2="76.5" stroke="#1f6feb" stroke-width="0.8"/>
    <!-- Pedal -->
    <line x1="43" y1="68" x2="43" y2="58" stroke="#1f6feb" stroke-width="1.5"/>
    <line x1="39" y1="57" x2="47" y2="57" stroke="#1f6feb" stroke-width="2"/>
    <!-- Seat post -->
    <line x1="43" y1="56" x2="43" y2="46" stroke="#1f6feb" stroke-width="2"/>
    <!-- Seat -->
    <ellipse cx="43" cy="45" rx="5" ry="2" fill="#1f6feb"/>
    
    <!-- === PELICAN BODY === -->
    <!-- Body (teardrop/oval shape) -->
    <ellipse cx="43" cy="35" rx="11" ry="10" fill="#56d364"/>
    
    <!-- Belly lighter area -->
    <ellipse cx="43" cy="37" rx="7" ry="6" fill="#f0883e" opacity="0.3"/>
    
    <!-- Wing -->
    <path d="M 33 33 Q 28 28 32 22 Q 36 18 40 24 Q 38 30 33 33 Z" fill="#1f6feb" opacity="0.8"/>
    <!-- Wing detail lines -->
    <path d="M 34 31 Q 30 27 33 23" fill="none" stroke="#161b22" stroke-width="0.5" opacity="0.5"/>
    <path d="M 36 30 Q 32 26 35 22" fill="none" stroke="#161b22" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Tail feathers -->
    <path d="M 52 30 L 60 25 L 58 32 L 62 28 L 57 35 L 53 33 Z" fill="#1f6feb" opacity="0.7"/>
    
    <!-- === PELICAN HEAD === -->
    <!-- Head -->
    <circle cx="48" cy="22" r="6" fill="#56d364"/>
    
    <!-- Eye white -->
    <circle cx="50" cy="20" r="2.5" fill="white"/>
    <!-- Eye pupil -->
    <circle cx="50.5" cy="19.5" r="1.2" fill="#111"/>
    <!-- Eye shine -->
    <circle cx="51" cy="19" r="0.5" fill="white"/>
    
    <!-- Beak top (pelican characteristic large beak) -->
    <path d="M 53 22 L 65 20 L 66 22 L 54 24 Z" fill="#f0883e"/>
    <!-- Beak bottom / pouch -->
    <path d="M 54 24 Q 62 28 66 22 L 65 20 Q 60 26 53 25 Z" fill="#f0883e" opacity="0.7"/>
    <!-- Beak tip hook -->
    <path d="M 65 20 L 67 21 L 66 22 Z" fill="#56d364"/>
    
    <!-- Crest/crown -->
    <path d="M 45 16 L 44 12 L 46 14 L 48 11 L 47 15 Z" fill="#f0883e" opacity="0.8"/>
    
    <!-- === LEGS on pedals === -->
    <line x1="40" y1="43" x2="39" y2="57" stroke="#f0883e" stroke-width="2"/>
    <line x1="46" y1="43" x2="47" y2="57" stroke="#f0883e" stroke-width="2"/>
    
    <!-- === BALANCE POLE (held by wing) === -->
    <line x1="28" y1="30" x2="15" y2="18" stroke="#56d364" stroke-width="1.5" opacity="0.6"/>
    <circle cx="15" cy="18" r="2" fill="#f0883e" opacity="0.6"/>
  </g>
</svg>