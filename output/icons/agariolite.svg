    <!-- Pelican body -->
    <g>
      <!-- Tail feathers -->
      <path d="M 18 38 Q 12 35 10 40 Q 14 37 18 42" fill="#ffab91" opacity="0.8"/>
      <path d="M 17 42 Q 10 40 9 45 Q 13 41 17 46" fill="#ffab91" opacity="0.7"/>

