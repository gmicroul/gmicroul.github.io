      <!-- Beak upper -->
      <path d="M 60 17 Q 68 15 74 18 Q 70 20 66 20 Q 63 20 60 19 Z" fill="#dd2c00"/>

      <!-- Beak pouch -->
      <path d="M 60 19 Q 66 20 70 22 Q 66 28 60 26 Q 62 23 60 19 Z" fill="#dd2c00" opacity="0.7"/>

      <!-- Crest/feathers on head -->
