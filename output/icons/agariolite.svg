      <line x1="32" y1="72" x2="24" y2="72" stroke="#ffab91" stroke-width="2"/>
      <!-- Seat -->
      <rect x="28" y="49" width="10" height="3" rx="1.5" fill="#ffab91"/>
      <!-- Seat post -->
      <line x1="33" y1="52" x2="33" y2="55" stroke="#ffab91" stroke-width="2"/>
      <!-- Handlebar -->
