      <line x1="14" y1="72" x2="34" y2="72" stroke="#ff8a65" stroke-width="0.6"/>
      <line x1="17" y1="65" x2="31" y2="79" stroke="#ff8a65" stroke-width="0.6"/>
      <line x1="17" y1="79" x2="31" y2="65" stroke="#ff8a65" stroke-width="0.6"/>
      <!-- Spokes front -->
      <line x1="62" y1="62" x2="62" y2="82" stroke="#ff8a65" stroke-width="0.6"/>
      <line x1="52" y1="72" x2="72" y2="72" stroke="#ff8a65" stroke-width="0.6"/>
      <line x1="55" y1="65" x2="69" y2="79" stroke="#ff8a65" stroke-width="0.6"/>
