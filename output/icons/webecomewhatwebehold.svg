<?xml version="1.0" encoding="UTF-8"?>
<svg width="86" height="86" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="shape-clip">
      <path d="M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z M 43 86 A 43.0 43.0 0 0 1 0.0 43.0 L 0 86 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape-clip)">
    <!-- Background fill inside shape -->
    <path d="M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z M 43 86 A 43.0 43.0 0 0 1 0.0 43.0 L 0 86 Z" fill="#2d1b69"/>
    <!-- Pelican design -->
    
    <!-- Pelican body -->
    <ellipse cx="43" cy="42" rx="18" ry="14" fill="#ff6ec7"/>
    <!-- Pelican belly -->
    <ellipse cx="43" cy="45" rx="13" ry="9" fill="#7b2ff7"/>
    <!-- Pelican head -->
    <circle cx="43" cy="26" r="9" fill="#ff6ec7"/>
    <!-- Pelican eye white -->
    <circle cx="46" cy="24" r="4" fill="white"/>
    <!-- Pelican eye pupil -->
    <circle cx="47" cy="24" r="2" fill="#111"/>
    <!-- Pelican eye highlight -->
    <circle cx="48" cy="23" r="0.8" fill="white"/>
    <!-- Pelican beak top -->
    <path d="M 52 25 L 68 28 L 52 30 Z" fill="#ff8c00"/>
    <!-- Pelican beak bottom / pouch -->
    <path d="M 52 30 L 65 33 Q 60 40 52 34 Z" fill="#ffa500"/>
    <!-- Pelican wing -->
    <path d="M 30 38 Q 22 42 28 50 Q 34 48 36 42 Z" fill="#7b2ff7"/>
    <!-- Pelican tail feathers -->
    <path d="M 25 42 L 15 36 L 18 44 Z" fill="#4a0e8f"/>
    <path d="M 25 44 L 14 42 L 19 48 Z" fill="#7b2ff7"/>
    <!-- Unicycle seat -->
    <rect x="36" y="55" width="14" height="3" rx="1.5" fill="#333"/>
    <!-- Unicycle pole -->
    <rect x="42" y="58" width="2" height="10" fill="#555"/>
    <!-- Unicycle wheel outer -->
    <circle cx="43" cy="72" r="11" fill="none" stroke="#ff6ec7" stroke-width="2.5"/>
    <!-- Unicycle wheel inner -->
    <circle cx="43" cy="72" r="7" fill="none" stroke="#7b2ff7" stroke-width="1.5"/>
    <!-- Wheel hub -->
    <circle cx="43" cy="72" r="2" fill="#ff6ec7"/>
    <!-- Wheel spokes -->
    <line x1="43" y1="61" x2="43" y2="83" stroke="#7b2ff7" stroke-width="1"/>
    <line x1="32" y1="72" x2="54" y2="72" stroke="#7b2ff7" stroke-width="1"/>
    <line x1="35" y1="64" x2="51" y2="80" stroke="#7b2ff7" stroke-width="0.7"/>
    <line x1="51" y1="64" x2="35" y2="80" stroke="#7b2ff7" stroke-width="0.7"/>
    <!-- Legs -->
    <line x1="38" y1="55" x2="36" y2="62" stroke="#ff8c00" stroke-width="2"/>
    <line x1="48" y1="55" x2="50" y2="62" stroke="#ff8c00" stroke-width="2"/>
    <!-- Foot on pedal left -->
    <ellipse cx="36" cy="63" rx="3" ry="1.5" fill="#ff8c00"/>
    <!-- Foot on pedal right -->
    <ellipse cx="50" cy="63" rx="3" ry="1.5" fill="#ff8c00"/>
    
    <!-- Geometric patterns -->
    <g opacity="0.5">
      <polygon points="43,15 50,22 36,22" fill="none" stroke="#ff99dd" stroke-width="0.8"/>
      <polygon points="20,40 27,47 13,47" fill="none" stroke="#ff99dd" stroke-width="0.6"/>
      <polygon points="66,40 73,47 59,47" fill="none" stroke="#ff99dd" stroke-width="0.6"/>
      <rect x="55" y="18" width="6" height="6" fill="none" stroke="#ff99dd" stroke-width="0.6" transform="rotate(45,58,21)"/>
      <rect x="16" y="52" width="5" height="5" fill="none" stroke="#ff99dd" stroke-width="0.6" transform="rotate(45,18.5,54.5)"/>
    </g>
  </g>
</svg>