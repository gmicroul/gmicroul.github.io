<?xml version="1.0" encoding="UTF-8"?>
<svg width="86" height="86" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c104">
      <path d="M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z M 86 43 A 43.0 43.0 0 0 1 43.0 86.0 L 86 86 Z"/>
    </clipPath>
    <linearGradient id="metalGrad_104" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#82b1ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#82b1ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#82b1ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c104)">
    <rect width="86" height="86" fill="#1a237e"/>
    <g opacity="0.15">
      <line x1="0" y1="15" x2="86" y2="15" stroke="#82b1ff" stroke-width="0.3"/>
      <line x1="0" y1="20" x2="86" y2="20" stroke="#82b1ff" stroke-width="0.5"/>
      <line x1="0" y1="28" x2="86" y2="28" stroke="#82b1ff" stroke-width="0.3"/>
      <line x1="0" y1="35" x2="86" y2="35" stroke="#82b1ff" stroke-width="0.4"/>
      <line x1="0" y1="42" x2="86" y2="42" stroke="#82b1ff" stroke-width="0.3"/>
      <line x1="0" y1="50" x2="86" y2="50" stroke="#82b1ff" stroke-width="0.5"/>
      <line x1="0" y1="57" x2="86" y2="57" stroke="#82b1ff" stroke-width="0.3"/>
      <line x1="0" y1="64" x2="86" y2="64" stroke="#82b1ff" stroke-width="0.4"/>
      <line x1="0" y1="72" x2="86" y2="72" stroke="#82b1ff" stroke-width="0.3"/>
      <rect x="0" y="0" width="86" height="86" fill="url(#metalGrad_104)" opacity="0.3"/>
    </g>
    
    <!-- Bicycle -->
    <g>
      <!-- Rear wheel -->
      <circle cx="24" cy="72" r="10" stroke="#536dfe" stroke-width="2" fill="none"/>
      <circle cx="24" cy="72" r="1.5" fill="#536dfe"/>
      <!-- Front wheel -->
      <circle cx="62" cy="72" r="10" stroke="#536dfe" stroke-width="2" fill="none"/>
      <circle cx="62" cy="72" r="1.5" fill="#536dfe"/>
      <!-- Spokes rear -->
      <line x1="24" y1="62" x2="24" y2="82" stroke="#536dfe" stroke-width="0.6"/>
      <line x1="14" y1="72" x2="34" y2="72" stroke="#536dfe" stroke-width="0.6"/>
      <line x1="17" y1="65" x2="31" y2="79" stroke="#536dfe" stroke-width="0.6"/>
      <line x1="17" y1="79" x2="31" y2="65" stroke="#536dfe" stroke-width="0.6"/>
      <!-- Spokes front -->
      <line x1="62" y1="62" x2="62" y2="82" stroke="#536dfe" stroke-width="0.6"/>
      <line x1="52" y1="72" x2="72" y2="72" stroke="#536dfe" stroke-width="0.6"/>
      <line x1="55" y1="65" x2="69" y2="79" stroke="#536dfe" stroke-width="0.6"/>
      <line x1="55" y1="79" x2="69" y2="65" stroke="#536dfe" stroke-width="0.6"/>
      <!-- Frame -->
      <line x1="24" y1="72" x2="38" y2="55" stroke="#8c9eff" stroke-width="2.5"/>
      <line x1="38" y1="55" x2="55" y2="55" stroke="#8c9eff" stroke-width="2.5"/>
      <line x1="55" y1="55" x2="62" y2="72" stroke="#8c9eff" stroke-width="2.5"/>
      <line x1="38" y1="55" x2="32" y2="72" stroke="#8c9eff" stroke-width="2"/>
      <line x1="32" y1="72" x2="24" y2="72" stroke="#8c9eff" stroke-width="2"/>
      <!-- Seat -->
      <rect x="28" y="49" width="10" height="3" rx="1.5" fill="#8c9eff"/>
      <!-- Seat post -->
      <line x1="33" y1="52" x2="33" y2="55" stroke="#8c9eff" stroke-width="2"/>
      <!-- Handlebar -->
      <line x1="55" y1="55" x2="58" y2="47" stroke="#8c9eff" stroke-width="2"/>
      <line x1="52" y1="46" x2="64" y2="46" stroke="#8c9eff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Pedals -->
      <circle cx="32" cy="72" r="3" stroke="#536dfe" stroke-width="1" fill="none"/>
      <line x1="29" y1="72" x2="35" y2="72" stroke="#536dfe" stroke-width="1.5"/>
    </g>

    <!-- Pelican body -->
    <g>
      <!-- Tail feathers -->
      <path d="M 18 38 Q 12 35 10 40 Q 14 37 18 42" fill="#8c9eff" opacity="0.8"/>
      <path d="M 17 42 Q 10 40 9 45 Q 13 41 17 46" fill="#8c9eff" opacity="0.7"/>

      <!-- Body -->
      <ellipse cx="36" cy="40" rx="16" ry="11" fill="#e8eaf6"/>

      <!-- Wing -->
      <path d="M 26 35 Q 30 30 40 32 Q 48 34 50 40 Q 46 38 38 37 Q 30 37 26 42 Z" fill="#8c9eff" opacity="0.6"/>
      <path d="M 28 38 Q 34 33 44 36" stroke="#8c9eff" stroke-width="0.8" fill="none" opacity="0.4"/>

      <!-- Belly -->
      <ellipse cx="38" cy="44" rx="10" ry="6" fill="#e8eaf6" opacity="0.9"/>

      <!-- Neck -->
      <path d="M 46 35 Q 50 28 52 22 Q 54 28 52 35" fill="#e8eaf6"/>

      <!-- Head -->
      <circle cx="54" cy="18" r="7" fill="#e8eaf6"/>

      <!-- Eye white -->
      <circle cx="57" cy="16" r="3" fill="white"/>
      <!-- Eye pupil -->
      <circle cx="58" cy="15.5" r="1.5" fill="#1a1a1a"/>
      <!-- Eye highlight -->
      <circle cx="58.5" cy="15" r="0.6" fill="white"/>

      <!-- Beak upper -->
      <path d="M 60 17 Q 68 15 74 18 Q 70 20 66 20 Q 63 20 60 19 Z" fill="#ff6e40"/>

      <!-- Beak pouch -->
      <path d="M 60 19 Q 66 20 70 22 Q 66 28 60 26 Q 62 23 60 19 Z" fill="#ff6e40" opacity="0.7"/>

      <!-- Crest/feathers on head -->
      <path d="M 50 12 Q 48 6 52 8 Q 50 4 55 7 Q 53 3 57 6" stroke="#8c9eff" stroke-width="1.2" fill="none"/>

      <!-- Feet on pedals -->
      <line x1="32" y1="69" x2="30" y2="72" stroke="#ff6e40" stroke-width="1.5"/>
      <line x1="34" y1="69" x2="36" y2="72" stroke="#ff6e40" stroke-width="1.5"/>
    </g>
  </g>
</svg>