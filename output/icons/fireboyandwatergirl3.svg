<?xml version="1.0" encoding="UTF-8"?>
<svg width="86" height="86" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="shape-clip">
      <path d="M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape-clip)">
    <!-- Background fill inside shape -->
    <path d="M 0 0 L 86.0 0 L 86.0 86.0 L 0 86.0 Z" fill="#1a1a2e"/>
    <!-- Pelican design -->
    
    <!-- Pelican body -->
    <ellipse cx="43" cy="42" rx="18" ry="14" fill="#e94560"/>
    <!-- Pelican belly -->
    <ellipse cx="43" cy="45" rx="13" ry="9" fill="#0f3460"/>
    <!-- Pelican head -->
    <circle cx="43" cy="26" r="9" fill="#e94560"/>
    <!-- Pelican eye white -->
    <circle cx="46" cy="24" r="4" fill="white"/>
    <!-- Pelican eye pupil -->
    <circle cx="47" cy="24" r="2" fill="#111"/>
    <!-- Pelican eye highlight -->
    <circle cx="48" cy="23" r="0.8" fill="white"/>
    <!-- Pelican beak top -->
    <path d="M 52 25 L 68 28 L 52 30 Z" fill="#ff8c00"/>
    <!-- Pelican beak bottom / pouch -->
    <path d="M 52 30 L 65 33 Q 60 40 52 34 Z" fill="#ffa500"/>
    <!-- Pelican wing -->
    <path d="M 30 38 Q 22 42 28 50 Q 34 48 36 42 Z" fill="#0f3460"/>
    <!-- Pelican tail feathers -->
    <path d="M 25 42 L 15 36 L 18 44 Z" fill="#16213e"/>
    <path d="M 25 44 L 14 42 L 19 48 Z" fill="#0f3460"/>
    <!-- Unicycle seat -->
    <rect x="36" y="55" width="14" height="3" rx="1.5" fill="#333"/>
    <!-- Unicycle pole -->
    <rect x="42" y="58" width="2" height="10" fill="#555"/>
    <!-- Unicycle wheel outer -->
    <circle cx="43" cy="72" r="11" fill="none" stroke="#e94560" stroke-width="2.5"/>
    <!-- Unicycle wheel inner -->
    <circle cx="43" cy="72" r="7" fill="none" stroke="#0f3460" stroke-width="1.5"/>
    <!-- Wheel hub -->
    <circle cx="43" cy="72" r="2" fill="#e94560"/>
    <!-- Wheel spokes -->
    <line x1="43" y1="61" x2="43" y2="83" stroke="#0f3460" stroke-width="1"/>
    <line x1="32" y1="72" x2="54" y2="72" stroke="#0f3460" stroke-width="1"/>
    <line x1="35" y1="64" x2="51" y2="80" stroke="#0f3460" stroke-width="0.7"/>
    <line x1="51" y1="64" x2="35" y2="80" stroke="#0f3460" stroke-width="0.7"/>
    <!-- Legs -->
    <line x1="38" y1="55" x2="36" y2="62" stroke="#ff8c00" stroke-width="2"/>
    <line x1="48" y1="55" x2="50" y2="62" stroke="#ff8c00" stroke-width="2"/>
    <!-- Foot on pedal left -->
    <ellipse cx="36" cy="63" rx="3" ry="1.5" fill="#ff8c00"/>
    <!-- Foot on pedal right -->
    <ellipse cx="50" cy="63" rx="3" ry="1.5" fill="#ff8c00"/>
    
    <!-- Circuit lines texture -->
    <g opacity="0.6">
      <path d="M 20 30 L 30 30 L 30 35 L 35 35" stroke="#ff6b6b" stroke-width="0.8" fill="none"/>
      <path d="M 50 20 L 50 28 L 55 28" stroke="#ff6b6b" stroke-width="0.8" fill="none"/>
      <path d="M 60 35 L 65 35 L 65 40 L 70 40" stroke="#ff6b6b" stroke-width="0.8" fill="none"/>
      <circle cx="35" cy="35" r="1.5" fill="#ff6b6b"/>
      <circle cx="55" cy="28" r="1.5" fill="#ff6b6b"/>
      <circle cx="70" cy="40" r="1.5" fill="#ff6b6b"/>
      <path d="M 15 50 L 25 50 L 25 55" stroke="#ff6b6b" stroke-width="0.6" fill="none"/>
      <circle cx="25" cy="55" r="1" fill="#ff6b6b"/>
    </g>
  </g>
</svg>