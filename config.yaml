model:
  default: "${OPENAI_MODEL}"
  provider: custom
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"
  api_mode: chat_completions


providers: {}


custom_providers:
  - name: custom
    base_url: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "${OPENAI_MODEL}"
    api_mode: chat_completions


toolsets: []


agent:
  max_turns: 10
  gateway_timeout: 300
  api_max_retries: 3
  tool_use_enforcement: disabled
  task_completion_guidance: false
  environment_probe: false
  reasoning_effort: low


terminal:
  backend: local


web:
  backend: ''
  search_backend: ''
  extract_backend: ''


browser:
  engine: none


security:
  tirith_enabled: false


display:
  interface: cli
  streaming: false
  show_reasoning: false


memory:
  memory_enabled: false
  user_profile_enabled: false


logging:
  level: INFO


_config_version: 28
